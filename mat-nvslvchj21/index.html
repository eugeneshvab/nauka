  v.labels.forEach(function(t){o+='<line x1="'+X(t)+'" y1="48" x2="'+X(t)+'" y2="72" stroke="#1f2421" stroke-width="3"/>'+txt(X(t),96,String(+t.toFixed(4)).replace('.',',').replace('-','−'),{fs:18});});
  if(v.jump){var x1=X(v.jump[0]),x2=X(v.jump[1]);o+='<path d="M'+x1+' 50 Q'+((x1+x2)/2)+' 8 '+x2+' 50" fill="none" stroke="'+COL.b+'" stroke-width="3"/><circle cx="'+x2+'" cy="60" r="7" fill="'+COL.g+'"/>';}
  (v.points||[]).forEach(function(p){o+='<circle cx="'+X(p[0])+'" cy="60" r="8" fill="'+COL.a+'"/>'+txt(X(p[0]),36,p[1],{fs:16,c:COL.a});});return svg(W+40,106,o);}
 if(v.type==='counters'){var m=v.minus,p=v.plus,x=0;for(var i=0;i<Math.max(m,p);i++){var cx=30+i*50;if(i<m)o+='<circle cx="'+cx+'" cy="30" r="20" fill="'+(i<p?'#fecaca':COL.r)+'" stroke="'+COL.r+'" stroke-width="3"/>'+txt(cx,38,'−',{c:i<p?COL.r:'#fff',fs:26});
  if(i<p)o+='<circle cx="'+cx+'" cy="90" r="20" fill="#bbf7d0" stroke="'+COL.g+'" stroke-width="3"/>'+txt(cx,98,'+',{c:COL.g,fs:26});if(i<m&&i<p)o+='<line x1="'+(cx-22)+'" y1="60" x2="'+(cx+22)+'" y2="60" stroke="#999" stroke-width="2" stroke-dasharray="4 3"/>'+txt(cx,66,'✕',{fs:14,c:'#999'});x=cx+30;}return svg(x,124,o);}
 return '';}
/* ---- screens ---- */
function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function score(T){var R=P.r[T.id];return R&&R.done?R.ans.filter(function(a){return a.ok;}).length:null;}
function home(){screen(home);var done=TS.filter(function(T){return score(T)!==null;}).length;
 var h='<div><h1>'+esc(L==='ru'?M.title_ru:M.title)+'</h1><p class="mut">'+esc(L==='ru'?M.subtitle_ru:M.subtitle)+'</p><div class="card"><p>'+u('start')+'</p><div class="prog"><i style="width:'+Math.round(100*done/TS.length)+'%"></i></div><p class="small mut">'+u('done')+': '+done+'/'+TS.length+'</p></div>';
 h+=TS.map(function(T,i){var s=score(T);return '<button class="topic" data-i="'+i+'"><span class="n">'+(s===null?T.n:(100*s/10>=PASS?'✓':T.n))+'</span><span class="t">'+esc(tt(T))+'</span><span class="s">'+(s===null?'':s+'/10')+'</span></button>';}).join('');
 if(done)h+='<button class="btn sec" id="sum">'+u('res')+'</button>';h+='<p class="small mut" style="margin-top:18px">'+esc(L==='ru'?M.sourceNote_ru:M.sourceNote)+'</p></div>';
 var v=el(h);app.appendChild(v);[].forEach.call(v.querySelectorAll('.topic'),function(b){b.onclick=function(){lesson(TS[+b.dataset.i],0);};});var sb=v.querySelector('#sum');if(sb)sb.onclick=summary;}
function lesson(T,ci){screen(function(){lesson(T,ci);});var c=T.cards[ci],C2=c[L],last=ci===T.cards.length-1;
 var h='<div><button class="btn ghost" id="bk">'+u('back')+'</button><div class="card lcard" style="margin-top:12px"><div class="small mut">'+esc(tt(T))+' · '+u('trick')+' '+(ci+1)+'/'+T.cards.length+'</div><h2>💡 '+esc(C2.t)+'</h2><p class="rule">'+hl(C2.rule)+'</p>'+vis(c.vis)+
  '<div class="ex"><div class="exh">'+u('ex')+' 1</div>'+C2.steps.map(function(s){return '<div class="st">'+hl(s)+'</div>';}).join('')+'</div>'+
  c.more.map(function(m,k){return '<div class="ex"><div class="exh">'+u('ex')+' '+(k+2)+'</div>'+m[L].map(function(s){return '<div class="st">'+hl(s)+'</div>';}).join('')+'</div>';}).join('')+
  (c.video?'<button class="btn sec" id="vb">'+u('video')+'</button><div id="vp" class="vpanel" hidden></div>':'')+'</div>'+
  (ci>0?'<button class="btn ghost" id="pv">←</button>':'')+'<button class="btn" id="go">'+(last?u('startT'):u('next'))+'</button></div>';
 var v=el(h);app.appendChild(v);v.querySelector('#bk').onclick=home;if(ci>0)v.querySelector('#pv').onclick=function(){lesson(T,ci-1);};
 if(c.video){var vb=v.querySelector('#vb'),vp=v.querySelector('#vp');vb.onclick=function(){if(vp.hidden){vp.innerHTML='<iframe src="https://www.tiktok.com/embed/v2/'+c.video+'" allow="encrypted-media; fullscreen; picture-in-picture" allowfullscreen loading="lazy" title="TikTok"></iframe>';vp.hidden=false;vb.textContent=u('hide');}else{vp.innerHTML='';vp.hidden=true;vb.textContent=u('video');}};}
 v.querySelector('#go').onclick=function(){if(!last)return lesson(T,ci+1);P.r[T.id]={t0:now(),ans:[]};save();task(T,0);};}
function dots(T,R){return '<div class="dots">'+T.problems.map(function(q,i){var a=R.ans[i];return '<span class="'+(a?(a.ok?'g':'r'):'')+'"></span>';}).join('')+'</div>';}
function task(T,i){var R=P.r[T.id],q=T.problems[i],t0=now();var redraw=function(){task(T,i);};
 if(R.ans[i]){/* already answered: language switch while feedback is shown */}
 screen(redraw);
 var v=el('<div><button class="btn ghost" id="bk">'+u('back')+'</button><div class="card" style="margin-top:12px"><div class="small mut">'+esc(tt(T))+' · '+u('task')+' '+(i+1)+'/10</div>'+dots(T,R)+'<div class="q">'+fmt(qq(q))+'</div><div id="body"></div><div id="fb"></div></div></div>');app.appendChild(v);
 v.querySelector('#bk').onclick=home;var body=v.querySelector('#body'),fb=v.querySelector('#fb'),answered=false;
 function showFb(a){var last=i===T.problems.length-1;
  fb.innerHTML=(a.ok?'<div class="fb ok">✅ <b>'+shuffle(u('good'))[0]+'</b></div>':
   '<div class="fb bad">'+(a.idk?u('nw'):u('almost'))+'<div class="sol"><ol>'+qs(q).map(function(s){return '<li>'+fmt(s)+'</li>';}).join('')+'</ol><div>'+u('ans')+': <b>'+esc(q.type==='mc'?qo(q)[q.answer]:q.accept[0])+'</b></div></div></div>')+
   '<button class="btn" id="nx">'+(last?u('see'):u('next'))+'</button>';
  fb.querySelector('#nx').onclick=function(){if(last){R.done=1;R.t1=now();save();sendTopic(T,R);sendSummaryIfAll();result(T);}else task(T,i+1);};}
 function finish(ok,given,idk){if(answered)return;answered=true;var ib=body.querySelector('.idk');if(ib)ib.remove();R.ans[i]={id:q.id,ok:ok,given:String(given),idk:!!idk,s:Math.round((now()-t0)/1000)};save();showFb(R.ans[i]);}
 if(R.ans[i]){answered=true;body.innerHTML='<div class="small mut">'+esc(R.ans[i].idk?'—':R.ans[i].given)+'</div>';showFb(R.ans[i]);return;}
 var OP=qo(q);
 if(q.type==='mc'){shuffle(q.options.map(function(o,k){return {k:k};})).forEach(function(x){var b=el('<button class="opt">'+fmt(OP[x.k])+'</button>');b.dataset.k=x.k;b.onclick=function(){if(answered)return;var ok=x.k===q.answer;b.classList.add(ok?'ok':'bad');if(!ok)[].forEach.call(body.querySelectorAll('.opt'),function(c){if(+c.dataset.k===q.answer)c.classList.add('ok');});finish(ok,q.options[x.k]);};body.appendChild(b);});}
 else{var w=el('<div><input type="text" inputmode="text" autocomplete="off" placeholder="'+u('ph')+'"><div class="hint">'+u('hint')+'</div><button class="btn" id="ck">'+u('check')+'</button></div>');body.appendChild(w);var inp=w.querySelector('input');
  function check(){if(answered)return;if(!inp.value.trim()){inp.focus();return;}if(parseNum(inp.value)===null){fb.innerHTML='<div class="hint">'+u('onlyNum')+'</div>';return;}var ok=isOk(q,inp.value);inp.disabled=true;inp.classList.add(ok?'ok':'bad');w.querySelector('#ck').remove();finish(ok,inp.value);}
  w.querySelector('#ck').onclick=check;inp.onkeydown=function(e){if(e.key==='Enter')check();};setTimeout(function(){inp.focus();},50);}
 var idk=el('<button class="btn ghost idk">'+u('idk')+'</button>');idk.onclick=function(){if(answered)return;[].forEach.call(body.querySelectorAll('input,.opt'),function(c){c.disabled=true;});var ck=body.querySelector('#ck');if(ck)ck.remove();finish(false,'',true);};body.appendChild(idk);}
function sendSummaryIfAll(){if(TS.every(function(T){return P.r[T.id]&&P.r[T.id].done;})&&!P.sumSent){P.sumSent=1;save();sendSummary();}}
function result(T){screen(function(){result(T);});var s=score(T),ok=100*s/10>=PASS,i=TS.indexOf(T),nx=TS[i+1];
 var v=el('<div><div class="card"><h2>'+esc(tt(T))+': '+s+'/10 '+(ok?'🎉':'')+'</h2>'+dots(T,P.r[T.id])+'<p>'+(s===10?u('m10'):ok?u('mok'):s>=5?u('mhalf'):u('mlow'))+'</p>'+
 (nx?'<button class="btn" id="nx">'+u('nextT')+': '+esc(tt(nx))+' →</button>':'<button class="btn" id="sm">'+u('res')+'</button>')+'<button class="btn sec" id="again">'+u('again')+'</button><button class="btn ghost" id="bk">'+u('all')+'</button></div></div>');app.appendChild(v);
 if(nx)v.querySelector('#nx').onclick=function(){lesson(nx,0);};else v.querySelector('#sm').onclick=summary;v.querySelector('#again').onclick=function(){lesson(T,0);};v.querySelector('#bk').onclick=home;}
function summary(){screen(summary);var weak=[],rows=TS.map(function(T){var s=score(T);if(s!==null&&100*s/10<PASS)weak.push(T);return '<tr><td>'+T.n+'. '+esc(tt(T))+'</td><td>'+(s===null?'<span class="mut">–</span>':s+'/10 '+(100*s/10>=PASS?'✅':'❌'))+'</td></tr>';}).join('');
 var v=el('<div><div class="card"><h2>'+u('res')+'</h2><table>'+rows+'</table>'+(weak.length?'<p style="margin-top:12px"><b>'+u('rep')+':</b> '+weak.map(function(T){return esc(tt(T));}).join(', ')+'. '+u('repT')+'</p>':'<p style="margin-top:12px">'+u('allok')+'</p>')+'<button class="btn" id="bk">'+u('all')+'</button></div></div>');app.appendChild(v);v.querySelector('#bk').onclick=home;}
window.__tpResults={queue:lq,flush:flush};home();
})();
