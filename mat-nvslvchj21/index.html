<style>

*{box-sizing:border-box}body{margin:0;font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}

.ex{background:var(--pri2);border-radius:12px;padding:10px 12px;margin-top:10px}.ex ol,.sol ol{margin:6px 0 0 1.2em;padding:0}

<script>window.TP_CONTENT={"schemaVersion": 1, "meta": {"id": "mat7-liczby-dzialania", "template": "simple", "title": "Matematyka: liczby i działania", "subtitle": "8 działów · w każdym krótki trik i 10 zadań – od bardzo łatwych do trudniejszych", "subject": "Matematyka", "grade": "Klasa 7 SP", "lang": "pl", "passPercent": 70, "sourceNote": "Triki na podstawie filmów Volhy Lukas (TikTok @volhalukas), po polsku; trik na zaokrąglanie – własny."}, "topics": [{"id": "l1", "n": 1, "title": "Liczby", "trick": "Sprawdzanie podzielności bez dzielenia", "intro": ["Patrz, nie musisz nic dzielić! Przez **3** sprawdzasz tak: dodaj cyfry. Jeśli suma dzieli się przez 3 – cała liczba też. Przez **9** – tak samo, tylko suma ma się dzielić przez 9.", "Przez **4**? Patrzysz tylko na **dwie ostatnie cyfry**.", "A ułamek dziesiętny na zwykły robisz w jednym kroku: cyfry bez przecinka idą na górę, na dół 1 i tyle zer, ile cyfr było po przecinku. Potem skracasz."], "example": {"q": "Czy 231 dzieli się przez 3? Zapisz 1,25 jako ułamek.", "steps": ["2 + 3 + 1 = 6, a 6 dzieli się przez 3 → tak!", "1,25: cyfry 125, po przecinku 2 cyfry → 125/100", "Skracamy przez 25 → 5/4"]}, "problems": [{"id": "l1-4", "type": "mc", "q": "Która liczba **nie** jest liczbą naturalną?", "options": ["7", "15", "−3", "100"], "answer": 2, "steps": ["Liczby naturalne nie są ujemne", "−3 jest liczbą całkowitą, ale nie naturalną"]}, {"id": "l1-12", "type": "mc", "q": "Zapisz 0,6 jako ułamek zwykły nieskracalny.", "options": ["3/5", "6/100", "1/6", "2/3"], "answer": 0, "steps": ["0,6 = 6/10 = 3/5"]}, {"id": "l1-3", "type": "mc", "q": "Zapisz 0,25 jako ułamek zwykły nieskracalny.", "options": ["1/4", "25/10", "2/5", "1/25"], "answer": 0, "steps": ["0,25 = 25/100 = 1/4"]}, {"id": "l1-1", "type": "mc", "q": "Która liczba dzieli się przez 3?", "options": ["124", "231", "512", "1001"], "answer": 1, "steps": ["2 + 3 + 1 = 6, a 6 dzieli się przez 3"]}, {"id": "l1-2", "type": "mc", "q": "Która liczba dzieli się przez 4?", "options": ["1234", "3418", "5716", "2022"], "answer": 2, "steps": ["Dwie ostatnie cyfry: 16 dzieli się przez 4"]}, {"id": "l1-5", "type": "mc", "q": "Która liczba jest wymierna, ale **nie** jest całkowita?", "options": ["−4", "0", "3/5", "12"], "answer": 2, "steps": ["3/5 = 0,6 – to ułamek, nie liczba całkowita", "Pozostałe są całkowite"]}, {"id": "l1-8", "type": "mc", "q": "Która liczba dzieli się przez 9?", "options": ["4573", "1235", "4563", "1000"], "answer": 2, "steps": ["4 + 5 + 6 + 3 = 18, a 18 dzieli się przez 9"]}, {"id": "l1-6", "type": "mc", "q": "Zapisz 1,25 jako ułamek zwykły (nieskracalny).", "options": ["5/4", "125/10", "1 1/25", "4/5"], "answer": 0, "steps": ["1,25 = 125/100 = 5/4 (= 1 1/4)"]}, {"id": "l1-10", "type": "mc", "q": "Która liczba jest pierwsza?", "options": ["21", "27", "29", "33"], "answer": 2, "steps": ["29 dzieli się tylko przez 1 i 29", "21 = 3·7, 27 = 3·9, 33 = 3·11 (suma cyfr dzieli się przez 3!)"]}, {"id": "l1-7", "type": "short", "q": "Ile jest liczb całkowitych większych od −3 i mniejszych od 4?", "num": 6.0, "tol": 1e-06, "accept": ["6"], "steps": ["To −2, −1, 0, 1, 2, 3 – razem 6", "Uwaga: −3 i 4 się nie liczą (są „większe od” i „mniejsze od”)"]}]}, {"id": "l2", "n": 2, "title": "Rozwinięcia dziesiętne", "trick": "Same dwójki i piątki", "intro": ["Ułamek zwykły zamieniasz na dziesiętny, kiedy dzielisz licznik przez mianownik.", "Trik: zrób na dole **10, 100 albo 1000**. 4/5 → razy 2 → 8/10 = 0,8. 7/20 → razy 5 → 35/100 = 0,35.", "Kiedy się nie da? Rozłóż mianownik. Są w nim **tylko dwójki i piątki** – wynik się skończy. Jest 3, 7, 11… – cyfry będą się powtarzać bez końca: 2/3 = 0,666… = 0,(6)."], "example": {"q": "Zamień 3/8 na ułamek dziesiętny.", "steps": ["8 = 2 · 2 · 2 – same dwójki, więc wynik się skończy", "8 · 125 = 1000, więc mnożę górę i dół przez 125", "3/8 = 375/1000 = 0,375"]}, "problems": [{"id": "l2-2", "type": "short", "q": "Zapisz 4/5 jako ułamek dziesiętny.", "num": 0.8, "tol": 1e-06, "accept": ["0,8"], "steps": ["4/5 = 8/10 = 0,8 – licznik razy 2"]}, {"id": "l2-11", "type": "short", "q": "Zapisz 13/25 jako ułamek dziesiętny.", "num": 0.52, "tol": 1e-06, "accept": ["0,52"], "steps": ["13/25 = 52/100 = 0,52 (rozszerzamy przez 4)"]}, {"id": "l2-3", "type": "short", "q": "Zapisz 7/20 jako ułamek dziesiętny.", "num": 0.35, "tol": 1e-06, "accept": ["0,35"], "steps": ["7/20 = 35/100 = 0,35 (rozszerzamy przez 5)"]}, {"id": "l2-1", "type": "short", "q": "Zapisz 3/8 jako ułamek dziesiętny.", "num": 0.375, "tol": 1e-06, "accept": ["0,375"], "steps": ["3/8 = 375/1000 = 0,375 (8·125 = 1000)"]}, {"id": "l2-6", "type": "mc", "q": "Zapisz 0,(3) jako ułamek zwykły.", "options": ["1/3", "3/10", "3/100", "1/30"], "answer": 0, "steps": ["0,(3) = 3/9 = 1/3"]}, {"id": "l2-9", "type": "mc", "q": "Zapisz 0,(7) jako ułamek zwykły.", "options": ["7/9", "7/10", "7/99", "1/7"], "answer": 0, "steps": ["Jedna cyfra w okresie → jedna dziewiątka: 0,(7) = 7/9"]}, {"id": "l2-5", "type": "mc", "q": "Zapisz 2/3 jako ułamek dziesiętny.", "options": ["0,(6)", "0,6", "0,23", "0,(3)"], "answer": 0, "steps": ["2 : 3 = 0,666… = 0,(6)"]}, {"id": "l2-4", "type": "mc", "q": "Który ułamek ma rozwinięcie dziesiętne **skończone**?", "options": ["1/3", "2/15", "3/40", "5/6"], "answer": 2, "steps": ["40 = 2·2·2·5 – same dwójki i piątki", "3/40 = 0,075"]}, {"id": "l2-7", "type": "mc", "q": "Który ułamek ma rozwinięcie **nieskończone okresowe**?", "options": ["7/25", "9/16", "5/12", "11/50"], "answer": 2, "steps": ["12 = 2·2·3 – jest trójka", "więc okresowe: 5/12 = 0,41(6)"]}, {"id": "l2-8", "type": "mc", "q": "Zapisz 1/6 jako ułamek dziesiętny.", "options": ["0,1(6)", "0,16", "0,(16)", "0,6"], "answer": 0, "steps": ["1 : 6 = 0,1666… – powtarza się tylko 6", "więc 0,1(6)"]}]}, {"id": "l3", "n": 3, "title": "Zaokrąglanie", "trick": "Sąsiad z prawej", "intro": ["Podkreśl cyfrę, do której zaokrąglasz. Teraz patrz **tylko na jej sąsiada z prawej**.", "Sąsiad to 0, 1, 2, 3 albo 4 → podkreślona cyfra **zostaje**. Sąsiad to 5, 6, 7, 8 albo 9 → podkreślona cyfra **rośnie o 1**.", "Co za nią? Po przecinku – znika. Przed przecinkiem – zamieniasz na **zera**."], "example": {"q": "Zaokrąglij 3,467 do części setnych.", "steps": ["Setne to druga cyfra po przecinku: 3,4**6**7", "Sąsiad z prawej to 7 – to 5 albo więcej", "6 rośnie o 1 → 3,47"]}, "problems": [{"id": "l3-2", "type": "short", "q": "Zaokrąglij 12,5 do całości.", "num": 13.0, "tol": 1e-06, "accept": ["13"], "steps": ["Sąsiad to 5 → w górę: 13"]}, {"id": "l3-3", "type": "short", "q": "Zaokrąglij 2 349 do setek.", "num": 2300.0, "tol": 1e-06, "accept": ["2300"], "steps": ["Podkreślam 3 (setki), sąsiad 4 → zostaje: 2 300"]}, {"id": "l3-1", "type": "short", "q": "Zaokrąglij 3,467 do części setnych.", "num": 3.47, "tol": 1e-06, "accept": ["3,47"], "steps": ["Podkreślam 6, sąsiad 7 → 3,47"]}, {"id": "l3-6", "type": "short", "q": "Zaokrąglij 45 678 do tysięcy.", "num": 46000.0, "tol": 1e-06, "accept": ["46000"], "steps": ["Tysiące to 5, sąsiad 6 → 46 000"]}, {"id": "l3-11", "type": "short", "q": "Zaokrąglij 5,555 do części dziesiątych.", "num": 5.6, "tol": 1e-06, "accept": ["5,6"], "steps": ["Dziesiąte to 5, sąsiad 5 → 5,6"]}, {"id": "l3-4", "type": "short", "q": "Zaokrąglij 0,0849 do części tysięcznych.", "num": 0.085, "tol": 1e-06, "accept": ["0,085"], "steps": ["Tysięczne to 4, sąsiad 9 → 0,085"]}, {"id": "l3-12", "type": "short", "q": "Zaokrąglij 999 do setek.", "num": 1000.0, "tol": 1e-06, "accept": ["1000"], "steps": ["Setki: 9, sąsiad 9 → 9 + 1 = 10 → 1 000"]}, {"id": "l3-7", "type": "mc", "q": "Zaokrąglij 2/3 do części setnych.", "options": ["0,67", "0,66", "0,6", "0,7"], "answer": 0, "steps": ["2/3 = 0,666…, setne: 6, sąsiad 6 → 0,67"]}, {"id": "l3-9", "type": "mc", "q": "Która liczba po zaokrągleniu do dziesiątek daje 350?", "options": ["344", "356", "355", "346"], "answer": 3, "steps": ["346: dziesiątki 4, sąsiad 6 → 350", "344 → 340, 355 i 356 → 360"]}, {"id": "l3-8", "type": "short", "q": "Zaokrąglij 19,995 do części setnych.", "num": 20.0, "tol": 1e-06, "accept": ["20"], "steps": ["Setne to 9, sąsiad 5 → 9 + 1, przenosimy aż do 20,00"]}]}, {"id": "l4", "n": 4, "title": "Dodawanie i odejmowanie", "trick": "Przecinek pod przecinkiem, całości osobno", "intro": ["Ułamki dziesiętne piszesz **przecinek pod przecinkiem**. Brakuje cyfr? Dopisz zera: 10 = 10,00.", "Ułamki zwykłe – najpierw **wspólny mianownik**. Mianowników nigdy nie dodajesz!", "Liczby mieszane? **Całości osobno, ułamki osobno.** A gdy odejmujesz ułamek od całości, rozmień jedną całość: 2 = 1 8/8."], "example": {"q": "Oblicz 2 − 3/8.", "steps": ["Rozmieniam jedną całość: 2 = 1 8/8", "1 8/8 − 3/8 = 1 5/8"]}, "problems": [{"id": "l4-6", "type": "short", "q": "Oblicz: 100 − 1 + 99", "num": 198.0, "tol": 1e-06, "accept": ["198"], "steps": ["Po kolei od lewej: 100 − 1 = 99, 99 + 99 = 198"]}, {"id": "l4-1", "type": "short", "q": "Oblicz: 3,7 + 2,45", "num": 6.15, "tol": 1e-06, "accept": ["6,15"], "steps": ["3,70 + 2,45 = 6,15"]}, {"id": "l4-12", "type": "short", "q": "Oblicz: 8,3 − 2,75", "num": 5.55, "tol": 1e-06, "accept": ["5,55"], "steps": ["8,30 − 2,75 = 5,55"]}, {"id": "l4-2", "type": "short", "q": "Oblicz: 10 − 3,26", "num": 6.74, "tol": 1e-06, "accept": ["6,74"], "steps": ["10,00 − 3,26 = 6,74"]}, {"id": "l4-3", "type": "mc", "q": "Oblicz: 1/4 + 1/6", "options": ["5/12", "2/10", "1/5", "2/24"], "answer": 0, "steps": ["3/12 + 2/12 = 5/12", "Nie dodajemy mianowników!"]}, {"id": "l4-11", "type": "mc", "q": "Oblicz: 2/3 + 1/5", "options": ["13/15", "3/8", "3/15", "2/15"], "answer": 0, "steps": ["10/15 + 3/15 = 13/15"]}, {"id": "l4-7", "type": "mc", "q": "Oblicz: 5/6 − 1/4", "options": ["7/12", "2", "1/3", "1/2"], "answer": 0, "steps": ["10/12 − 3/12 = 7/12"]}, {"id": "l4-4", "type": "mc", "q": "Oblicz: 2 − 3/8", "options": ["1 5/8", "1 3/8", "2 3/8", "5/8"], "answer": 0, "steps": ["2 = 1 8/8", "więc 1 8/8 − 3/8 = 1 5/8"]}, {"id": "l4-5", "type": "mc", "q": "Oblicz: 4 1/2 + 3 1/5", "options": ["7 7/10", "7 2/7", "7 1/7", "8 7/10"], "answer": 0, "steps": ["Całości: 7", "Ułamki: 5/10 + 2/10 = 7/10", "Razem 7 7/10"]}, {"id": "l4-9", "type": "mc", "q": "Oblicz: 3 1/3 − 1 5/6", "options": ["1 1/2", "2 2/3", "2 1/2", "1 1/3"], "answer": 0, "steps": ["1/3 < 5/6", "więc pożyczamy całość: 2 8/6 − 1 5/6 = 1 3/6 = 1 1/2"]}]}, {"id": "l5", "n": 5, "title": "Mnożenie i dzielenie", "trick": "Policz cyfry po przecinku", "intro": ["Mnożysz ułamki dziesiętne? **Zapomnij o przecinkach**, pomnóż jak zwykłe liczby. Na końcu policz, ile cyfr po przecinku było razem, i tyle oddziel.", "Dzielisz przez ułamek dziesiętny? **Przesuń przecinek** w obu liczbach o tyle samo, aż dzielnik będzie bez przecinka.", "Dzielenie przez ułamek zwykły to **mnożenie przez odwrotność**: 18 : 1/2 = 18 · 2 = 36."], "example": {"q": "Oblicz 0,3 · 0,2.", "steps": ["Bez przecinków: 3 · 2 = 6", "Po przecinku były 1 + 1 = 2 cyfry", "Oddzielam 2 cyfry: 0,06"]}, "problems": [{"id": "l5-7", "type": "short", "q": "Oblicz w pamięci: 284 · 5", "num": 1420.0, "tol": 1e-06, "accept": ["1420"], "steps": ["Połowa z 284 to 142, dopisz 0 → 1 420"]}, {"id": "l5-1", "type": "short", "q": "Oblicz: 0,3 · 0,2", "num": 0.06, "tol": 1e-06, "accept": ["0,06"], "steps": ["3 · 2 = 6, cyfr po przecinku 1 + 1 = 2 → 0,06"]}, {"id": "l5-4", "type": "short", "q": "Oblicz: 18 : 1/2", "num": 36.0, "tol": 1e-06, "accept": ["36"], "steps": ["Dzielenie przez 1/2 to mnożenie przez 2: 36"]}, {"id": "l5-8", "type": "short", "q": "Oblicz: 38 : 5", "num": 7.6, "tol": 1e-06, "accept": ["7,6"], "steps": ["Obie liczby razy 2: 76 : 10 = 7,6"]}, {"id": "l5-3", "type": "short", "q": "Oblicz: 1,44 : 0,12", "num": 12.0, "tol": 1e-06, "accept": ["12"], "steps": ["Przesuwamy przecinek o 2: 144 : 12 = 12"]}, {"id": "l5-11", "type": "short", "q": "Oblicz: 2,5 : 0,05", "num": 50.0, "tol": 1e-06, "accept": ["50"], "steps": ["Przecinek o 2 miejsca: 250 : 5 = 50"]}, {"id": "l5-5", "type": "mc", "q": "Oblicz: 3/7 · 4/5", "options": ["12/35", "7/12", "15/28", "12/5"], "answer": 0, "steps": ["Licznik razy licznik, mianownik razy mianownik: 12/35"]}, {"id": "l5-12", "type": "short", "q": "Oblicz: 0,25 · 0,4", "num": 0.1, "tol": 1e-06, "accept": ["0,1"], "steps": ["25 · 4 = 100, cyfr po przecinku 3 → 0,100 = 0,1"]}, {"id": "l5-6", "type": "mc", "q": "Oblicz: 2/3 : 5/4", "options": ["8/15", "10/12", "5/6", "15/8"], "answer": 0, "steps": ["2/3 · 4/5 = 8/15"]}, {"id": "l5-10", "type": "mc", "q": "Oblicz: 17 : 3 2/5", "options": ["5", "1/5", "57 4/5", "5 2/5"], "answer": 0, "steps": ["3 2/5 = 17/5", "więc 17 : 17/5 = 17 · 5/17 = 5"]}]}, {"id": "l6", "n": 6, "title": "Wyrażenia arytmetyczne", "trick": "Kolejność działań", "intro": ["Najpierw **nawiasy**, potem **potęgi**, potem **mnożenie i dzielenie**, na końcu **dodawanie i odejmowanie**.", "Mnożenie i dzielenie są równe – robisz je **po kolei od lewej**. Tak samo dodawanie i odejmowanie.", "Trik: jeśli ta sama liczba jest w każdym kawałku, **wyłącz ją przed nawias**. I łącz wygodne pary: 25 · 4 = 100."], "example": {"q": "Oblicz 2 + 3 · 4.", "steps": ["Najpierw mnożenie: 3 · 4 = 12", "Potem dodawanie: 2 + 12 = 14"]}, "problems": [{"id": "l6-1", "type": "short", "q": "Oblicz: 2 + 3 · 4", "num": 14.0, "tol": 1e-06, "accept": ["14"], "steps": ["Najpierw mnożenie: 3 · 4 = 12", "potem 2 + 12 = 14"]}, {"id": "l6-2", "type": "short", "q": "Oblicz: (2 + 3) · 4", "num": 20.0, "tol": 1e-06, "accept": ["20"], "steps": ["Najpierw nawias: 5 · 4 = 20"]}, {"id": "l6-11", "type": "short", "q": "Oblicz: 36 − 6 · (9 − 4)", "num": 6.0, "tol": 1e-06, "accept": ["6"], "steps": ["Nawias 5", "6 · 5 = 30", "36 − 30 = 6"]}, {"id": "l6-5", "type": "short", "q": "Oblicz: 48 : 6 : 2", "num": 4.0, "tol": 1e-06, "accept": ["4"], "steps": ["Od lewej: 48 : 6 = 8, 8 : 2 = 4 (a nie 48 : 3!)"]}, {"id": "l6-3", "type": "short", "q": "Oblicz: 20 − 8 : 4 · 2", "num": 16.0, "tol": 1e-06, "accept": ["16"], "steps": ["8 : 4 = 2, 2 · 2 = 4, 20 − 4 = 16"]}, {"id": "l6-4", "type": "short", "q": "Oblicz: 3² + 4 · (5 − 2)", "num": 21.0, "tol": 1e-06, "accept pe": "mc", "q": "Między którymi liczbami całkowitymi leży −1 5/6?", "options": ["−2 i −1", "−1 i 0", "1 i 2", "−6 i −5"], "answer": 0, "steps": ["Minus → w lewo", "całość 1 → między −1 a −2"]}, {"id": "l8-11", "type": "short", "q": "Jaka jest odległość na osi między −7 a −2?", "num": 5.0, "tol": 1e-06, "accept": ["5"], "steps": ["−2 − (−7) = 5"]}, {"id": "l8-6", "type": "short", "q": "Odcinek od 0 do 1 podzielono na 4 równe części. Jaką liczbę oznacza pierwsza kreska za zerem? (możesz wpisać ułamek)", "num": 0.25, "tol": 1e-06, "accept": ["0,25"], "steps": ["1 : 4 = 1/4 = 0,25"]}, {"id": "l8-7", "type": "mc", "q": "Liczba przeciwna do −3,5 to:", "options": ["3,5", "−3,5", "2/7", "−2/7"], "answer": 0, "steps": ["Liczba przeciwna leży po drugiej stronie zera w tej samej odległości: 3,5"]}, {"id": "l8-5", "type": "short", "q": "Jaka liczba jest środkiem odcinka o końcach −6 i 2?", "num": -2.0, "tol": 1e-06, "accept": ["−2"], "steps": ["(−6 + 2) : 2 = −4 : 2 = −2"]}, {"id": "l8-9", "type": "mc", "q": "Odcinek od −2 do 0 podzielono na 4 równe części. Pierwsza kreska na prawo od −2 to:", "options": ["−1,5", "−1,75", "−1", "−2,5"], "answer": 0, "steps": ["Każda część: 2 : 4 = 0,5", "−2 + 0,5 = −1,5"]}, {"id": "l8-10", "type": "short", "q": "Jaka jest odległość na osi między −2 1/2 a 1 3/4?", "num": 4.25, "tol": 1e-06, "accept": ["4,25"], "steps": ["1 3/4 − (−2 1/2) = 1,75 + 2,5 = 4,25"]}]}]};</script>

 var f=s.match(/^(-?)\s*(?:(\d+)\s+)?(\d+)\s*\/\s*(\d+)$/);if(f){if(!+f[4])return null;return ((+(f[2]||0))+(+f[3])/(+f[4]))*(f[1]?-1:1);}
 var m=s.match(/^-?\d+(\.\d+)?$/)||s.match(/^-?\.\d+$/);return m?parseFloat(s):null;}

   '<button class="btn" id="nx">'+(last?'Zobacz wynik →':'Dalej →')+'</button>';
  fb.querySelector('#nx').onclick=function(){if(last){R.done=1;R.t1=now();save();sendTopic(T,R);sendSummaryIfAll();result(T);}else task(T,i+1);};fb.querySelector('#nx').focus();}
 if(q.type==='mc'){shuffle(q.options.map(function(o,k){return {o:o,k:k};})).forEach(function(x){var b=el('<button class="opt">'+fmt(x.o)+'</button>');b.dataset.k=x.k;b.onclick=function(){if(answered)return;var ok=x.k===q.answer;b.classList.add(ok?'ok':'bad');if(!ok)[].forEach.call(body.querySelectorAll('.opt'),function(c){if(+c.dataset.k===q.answer)c.classList.add('ok');});finish(ok,x.o);};body.appendChild(b);});}
 else{var w=el('<div><input type="text" inputmode="text" autocomplete="off" placeholder="Twoja odpowiedź"><div class="hint">Możesz pisać 0,5 albo 0.5, ułamek 1/4, liczbę mieszaną 4 1/4, minus −.</div><button class="btn" id="ck">Sprawdź</button></div>');body.appendChild(w);var inp=w.querySelector('input');
  function check(){if(answered)return;if(!inp.value.trim()){inp.focus();return;}if(parseNum(inp.value)===null){fb.innerHTML='<div class="hint">Wpisz samą liczbę, np. 6,15 albo 3/4.</div>';return;}var ok=isOk(q,inp.value);inp.disabled=true;inp.classList.add(ok?'ok':'bad');w.querySelector('#ck').remove();finish(ok,inp.value);}
  w.querySelector('#ck').onclick=check;inp.onkeydown=function(e){if(e.key==='Enter')check();};setTimeout(function(){inp.focus();},50);}
 var idk=el('<button class="btn ghost idk">🤔 Nie wiem</button>');idk.onclick=function(){if(answered)return;idk.remove();[].forEach.call(body.querySelectorAll('input,.opt'),function(c){c.disabled=true;});var ck=body.querySelector('#ck');if(ck)ck.remove();finish(false,'',true);};body.appendChild(idk);}
function sendSummaryIfAll(){if(TS.every(function(T){return P.r[T.id]&&P.r[T.id].done;})&&!P.sumSent){P.sumSent=1;save();sendSummary();}}
function result(T){var s=score(T),ok=100*s/10>=PASS,i=TS.indexOf(T),nx=TS[i+1];scrollTo(0,0);app.innerHTML='';
 var v=el('<div><div class="card"><h2>'+esc(T.title)+': '+s+'/10 '+(ok?'🎉':'')+'</h2>'+dots(T,P.r[T.id])+'<p>'+(s===10?'Bezbłędnie! Jesteś mistrzem tego działu.':ok?'Bardzo dobrze! Ten dział masz opanowany.':s>=5?'Dobra robota – połowa za tobą. Przeczytaj jeszcze raz trik i spróbuj ponownie, a pójdzie lepiej.':'To dopiero początek. Przeczytaj trik jeszcze raz – za drugim razem będzie dużo łatwiej.')+'</p>'+
 (nx?'<button class="btn" id="nx">Następny dział: '+esc(nx.title)+' →</button>':'<button class="btn" id="sm">📊 Moje wyniki</button>')+'<button class="btn sec" id="again">Jeszcze raz ten dział</button><button class="btn ghost" id="bk">Wszystkie działy</button></div></div>');app.appendChild(v);
 if(nx)v.querySelector('#nx').onclick=function(){lesson(nx);};else v.querySelector('#sm').onclick=summary;v.querySelector('#again').onclick=function(){lesson(T);};v.querySelector('#bk').onclick=home;}
function summary(){scrollTo(0,0);app.innerHTML='';var weak=[],rows=TS.map(function(T){var s=score(T);if(s!==null&&100*s/10<PASS)weak.push(T);return '<tr><td>'+T.n+'. '+esc(T.title)+'</td><td>'+(s===null?'<span class="mut">–</span>':s+'/10 '+(100*s/10>=PASS?'✅':'❌'))+'</td></tr>';}).join('');
 var v=el('<div><div class="card"><h2>📊 Moje wyniki</h2><table>'+rows+'</table>'+(weak.length?'<p style="margin-top:12px"><b>Do powtórki:</b> '+weak.map(function(T){return esc(T.title);}).join(', ')+'. Przeczytaj trik jeszcze raz i zrób zadania ponownie.</p>':'<p style="margin-top:12px">Wszystkie zrobione działy na zaliczenie. 🎉</p>')+'<button class="btn" id="bk">Wszystkie działy</button></div></div>');app.appendChild(v);v.querySelector('#bk').onclick=home;}
window.__tpResults={queue:lq,flush:flush};home();
