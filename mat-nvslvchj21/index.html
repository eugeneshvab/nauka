<style>
:root{--bg:#f7f5f0;--card:#fff;--ink:#1f2421;--mut:#69706b;--pri:#3f6f5a;--pri2:#e6efe9;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--line:#e4e0d6;--r:16px}
*{box-sizing:border-box}body{margin:0;font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:640px;margin:auto;padding:16px 14px 60px}
h1{font-size:1.45rem;margin:6px 0 4px;line-height:1.25}h2{font-size:1.25rem;margin:0 0 10px}
.mut{color:var(--mut)}.small{font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px}
.btn{display:inline-block;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;background:var(--pri);color:#fff;margin:6px 6px 0 0}
.btn.sec{background:var(--pri2);color:var(--pri)}.btn.ghost{background:none;color:var(--mut);border:1px solid var(--line)}.btn:disabled{opacity:.45}
.topic{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 8px;font:inherit;cursor:pointer;color:var(--ink)}
.topic .n{flex:0 0 32px;height:32px;border-radius:50%;background:var(--pri2);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700}
.topic .t{flex:1}.topic .s{font-size:.9rem;color:var(--mut);white-space:nowrap}
.trick{background:#fff8e6;border:1px solid #f1dfb0;border-radius:12px;padding:10px 12px;margin:10px 0}
.ex{background:var(--pri2);border-radius:12px;padding:10px 12px;margin-top:10px}.ex ol,.sol ol{margin:6px 0 0 1.2em;padding:0}
.q{font-weight:600;font-size:1.1rem;margin:4px 0 10px}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px;margin:8px 0;font:inherit;cursor:pointer;color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
input[type=text]{font:inherit;font-size:1.15rem;padding:10px 12px;border:2px solid var(--line);border-radius:12px;width:100%;max-width:280px}
input.ok{border-color:var(--ok);background:var(--okbg)}input.bad{border-color:var(--bad);background:var(--badbg)}
.fb{border-radius:12px;padding:10px 12px;margin-top:12px}.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.sol{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.prog{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 12px}.prog i{display:block;height:100%;background:var(--pri);transition:width .3s}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}.dots span{width:14px;height:14px;border-radius:50%;background:var(--line)}.dots .g{background:var(--ok)}.dots .r{background:var(--bad)}
table{width:100%;border-collapse:collapse}td{padding:6px 4px;border-bottom:1px solid var(--line)}td:last-child{text-align:right;white-space:nowrap}
.hint{font-size:.85rem;color:var(--mut);margin-top:6px}

<script>window.TP_CONTENT={"schemaVersion": 1, "meta": {"id": "mat7-liczby-dzialania", "template": "simple", "title": "Matematyka: liczby i działania", "subtitle": "8 działów · w każdym krótki trik i 10 zadań – od bardzo łatwych do trudniejszych", "subject": "Matematyka", "grade": "Klasa 7 SP", "lang": "pl", "passPercent": 70, "sourceNote": "Triki na podstawie filmów Volhy Lukas (TikTok @volhalukas), po polsku; trik na zaokrąglanie – własny."}, "topics": [{"id": "l1", "n": 1, "title": "Liczby", "trick": "Sprawdzanie podzielności bez dzielenia", "intro": ["Patrz, nie musisz nic dzielić! Przez **3** sprawdzasz tak: dodaj cyfry. Jeśli suma dzieli się przez 3 – cała liczba też. Przez **9** – tak samo, tylko suma ma się dzielić przez 9.", "Przez **4**? Patrzysz tylko na **dwie ostatnie cyfry**.", "A ułamek dziesiętny na zwykły robisz w jednym kroku: cyfry bez przecinka idą na górę, na dół 1 i tyle zer, ile cyfr było po przecinku. Potem skracasz."], "example": {"q": "Czy 231 dzieli się przez 3? Zapisz 1,25 jako ułamek.", "steps": ["2 + 3 + 1 = 6, a 6 dzieli się przez 3 → tak!", "1,25: cyfry 125, po przecinku 2 cyfry → 125/100", "Skracamy przez 25 → 5/4"]}, "problems": [{"id": "l1-4", "type": "mc", "q": "Która liczba **nie** jest liczbą naturalną?", "options": ["7", "15", "−3", "100"], "answer": 2, "steps": ["Liczby naturalne to te, którymi liczymy rzeczy: 0, 1, 2, 3, …", "Nie ma wśród nich liczb z minusem.", "7, 15 i 100 to zwykłe liczby do liczenia – są naturalne.", "−3 ma minus, więc nie jest naturalna. Odpowiedź: −3."]}, {"id": "l1-12", "type": "mc", "q": "Zapisz 0,6 jako ułamek zwykły nieskracalny.", "options": ["3/5", "6/100", "1/6", "2/3"], "answer": 0, "steps": ["Trik: cyfry bez przecinka idą na górę ułamka.", "0,6 → na górę piszę 6.", "Po przecinku jest 1 cyfra, więc na dół piszę 1 i jedno zero: 10. Mam 6/10.", "Skracam: 6 i 10 dzielę przez 2 → 3/5."]}, {"id": "l1-3", "type": "mc", "q": "Zapisz 0,25 jako ułamek zwykły nieskracalny.", "options": ["1/4", "25/10", "2/5", "1/25"], "answer": 0, "steps": ["Trik: cyfry bez przecinka idą na górę.", "0,25 → na górę 25.", "Po przecinku są 2 cyfry, więc na dół 1 i dwa zera: 100. Mam 25/100.", "Skracam: 25 i 100 dzielę przez 25 → 1/4."]}, {"id": "l1-1", "type": "mc", "q": "Która liczba dzieli się przez 3?", "options": ["124", "231", "512", "1001"], "answer": 1, "steps": ["Trik na 3: dodaj wszystkie cyfry liczby.", "124: 1 + 2 + 4 = 7. 512: 5 + 1 + 2 = 8. 1001: 1 + 0 + 0 + 1 = 2.", "231: 2 + 3 + 1 = 6.", "6 dzieli się przez 3, a 7, 8 i 2 nie. Odpowiedź: 231."]}, {"id": "l1-2", "type": "mc", "q": "Która liczba dzieli się przez 4?", "options": ["1234", "3418", "5716", "2022"], "answer": 2, "steps": ["Trik na 4: patrz tylko na dwie ostatnie cyfry.", "1234 → 34, 3418 → 18, 2022 → 22. Żadna z nich nie dzieli się przez 4.", "5716 → 16, a 16 : 4 = 4.", "Odpowiedź: 5716."]}, {"id": "l1-5", "type": "mc", "q": "Która liczba jest wymierna, ale **nie** jest całkowita?", "options": ["−4", "0", "3/5", "12"], "answer": 2, "steps": ["Liczby całkowite to liczby bez ułamka: …, −2, −1, 0, 1, 2, …", "−4, 0 i 12 są całkowite.", "3/5 to kawałek całości (0,6) – nie jest całkowita.", "Ale da się ją zapisać jako ułamek, więc jest wymierna. Odpowiedź: 3/5."]}, {"id": "l1-8", "type": "mc", "q": "Która liczba dzieli się przez 9?", "options": ["4573", "1235", "4563", "1000"], "answer": 2, "steps": ["Trik na 9: dodaj cyfry. Suma musi się dzielić przez 9.", "4573: 4 + 5 + 7 + 3 = 19 – nie. 1235: 11 – nie. 1000: 1 – nie.", "4563: 4 + 5 + 6 + 3 = 18.", "18 : 9 = 2, więc 4563 dzieli się przez 9."]}, {"id": "l1-6", "type": "mc", "q": "Zapisz 1,25 jako ułamek zwykły (nieskracalny).", "options": ["5/4", "125/10", "1 1/25", "4/5"], "answer": 0, "steps": ["Trik: cyfry bez przecinka idą na górę: 125.", "Po przecinku są 2 cyfry, więc na dół 100. Mam 125/100.", "Skracam przez 25: 125 : 25 = 5, 100 : 25 = 4.", "Wynik: 5/4 (to to samo co 1 1/4)."]}, {"id": "l1-10", "type": "mc", "q": "Która liczba jest pierwsza?", "options": ["21", "27", "29", "33"], "answer": 2, "steps": ["Liczba pierwsza dzieli się tylko przez 1 i przez siebie.", "Sprawdzam trikiem na 3 (suma cyfr): 21 → 3, 27 → 9, 33 → 6. Wszystkie dzielą się przez 3, więc nie są pierwsze.", "29: suma 11, nie dzieli się przez 2, 3, 5 ani 7.", "Odpowiedź: 29."]}, {"id": "l1-7", "type": "short", "q": "Ile jest liczb całkowitych większych od −3 i mniejszych od 4?", "num": 6.0, "tol": 1e-06, "accept": ["6"], "steps": ["Rysuję w głowie oś i wypisuję liczby między −3 a 4.", "„Większe od −3” – więc samo −3 się nie liczy. „Mniejsze od 4” – samo 4 też nie.", "Zostają: −2, −1, 0, 1, 2, 3.", "Liczę: to 6 liczb."]}]}, {"id": "l2", "n": 2, "title": "Rozwinięcia dziesiętne", "trick": "Same dwójki i piątki", "intro": ["Ułamek zwykły zamieniasz na dziesiętny, kiedy dzielisz licznik przez mianownik.", "Trik: zrób na dole **10, 100 albo 1000**. 4/5 → razy 2 → 8/10 = 0,8. 7/20 → razy 5 → 35/100 = 0,35.", "Kiedy się nie da? Rozłóż mianownik. Są w nim **tylko dwójki i piątki** – wynik się skończy. Jest 3, 7, 11… – cyfry będą się powtarzać bez końca: 2/3 = 0,666… = 0,(6)."], "example": {"q": "Zamień 3/8 na ułamek dziesiętny.", "steps": ["8 = 2 · 2 · 2 – same dwójki, więc wynik się skończy", "8 · 125 = 1000, więc mnożę górę i dół przez 125", "3/8 = 375/1000 = 0,375"]}, "problems": [{"id": "l2-2", "type": "short", "q": "Zapisz 4/5 jako ułamek dziesiętny.", "num": 0.8, "tol": 1e-06, "accept": ["0,8"], "steps": ["Trik: zrób na dole 10.", "5 · 2 = 10, więc górę i dół mnożę przez 2.", "4/5 = 8/10.", "8/10 to 0,8."]}, {"id": "l2-11", "type": "short", "q": "Zapisz 13/25 jako ułamek dziesiętny.", "num": 0.52, "tol": 1e-06, "accept": ["0,52"], "steps": ["Trik: zrób na dole 100.", "25 · 4 = 100, więc górę i dół mnożę przez 4.", "13 · 4 = 52, czyli 13/25 = 52/100.", "52/100 to 0,52."]}, {"id": "l2-3", "type": "short", "q": "Zapisz 7/20 jako ułamek dziesiętny.", "num": 0.35, "tol": 1e-06, "accept": ["0,35"], "steps": ["Trik: zrób na dole 100.", "20 · 5 = 100, więc górę i dół mnożę przez 5.", "7 · 5 = 35, czyli 7/20 = 35/100.", "35/100 to 0,35."]}, {"id": "l2-1", "type": "short", "q": "Zapisz 3/8 jako ułamek dziesiętny.", "num": 0.375, "tol": 1e-06, "accept": ["0,375"], "steps": ["Trik: zrób na dole 1000.", "8 · 125 = 1000, więc górę i dół mnożę przez 125.", "3 · 125 = 375, czyli 3/8 = 375/1000.", "375/1000 to 0,375."]}, {"id": "l2-6", "type": "mc", "q": "Zapisz 0,(3) jako ułamek zwykły.", "options": ["1/3", "3/10", "3/100", "1/30"], "answer": 0, "steps": ["Trik: jedna cyfra w okresie → na dół piszę jedną dziewiątkę.", "Cyfra w okresie to 3, więc 0,(3) = 3/9.", "Skracam przez 3: 3/9 = 1/3.", "Wynik: 1/3."]}, {"id": "l2-9", "type": "mc", "q": "Zapisz 0,(7) jako ułamek zwykły.", "options": ["7/9", "7/10", "7/99", "1/7"], "answer": 0, "steps": ["Trik: jedna cyfra w okresie → na dół jedna dziewiątka.", "Cyfra w okresie to 7, więc na górę 7.", "0,(7) = 7/9.", "Nic się nie skraca. Wynik: 7/9."]}, {"id": "l2-5", "type": "mc", "q": "Zapisz 2/3 jako ułamek dziesiętny.", "options": ["0,(6)", "0,6", "0,23", "0,(3)"], "answer": 0, "steps": ["Ułamek to dzielenie: 2/3 = 2 : 3.", "Dzielę pisemnie: 20 : 3 = 6 reszty 2, znowu 20 : 3 = 6 reszty 2…", "Szóstki powtarzają się bez końca: 0,666…", "Zapisujemy to tak: 0,(6)."]}, {"id": "l2-4", "type": "mc", "q": "Który ułamek ma rozwinięcie dziesiętne **skończone**?", "options": ["1/3", "2/15", "3/40", "5/6"], "answer": 2, "steps": ["Trik: rozkładam mianownik. Jeśli są tylko dwójki i piątki – ułamek się skończy.", "3 – zła liczba. 15 = 3 · 5 – jest trójka. 6 = 2 · 3 – jest trójka.", "40 = 2 · 2 · 2 · 5 – same dwójki i piątki!", "Odpowiedź: 3/40 (= 0,075)."]}, {"id": "l2-7", "type": "mc", "q": "Który ułamek ma rozwinięcie **nieskończone okresowe**?", "options": ["7/25", "9/16", "5/12", "11/50"], "answer": 2, "steps": ["Trik: szukam w mianowniku liczby innej niż 2 i 5.", "25 = 5 · 5, 16 = 2 · 2 · 2 · 2, 50 = 2 · 5 · 5 – same dwójki i piątki, więc się kończą.", "12 = 2 · 2 · 3 – jest trójka!", "Więc 5/12 ma okres. Odpowiedź: 5/12."]}, {"id": "l2-8", "type": "mc", "q": "Zapisz 1/6 jako ułamek dziesiętny.", "options": ["0,1(6)", "0,16", "0,(16)", "0,6"], "answer": 0, "steps": ["1/6 to 1 : 6. Dzielę pisemnie.", "10 : 6 = 1 reszty 4. Potem 40 : 6 = 6 reszty 4.", "Reszta znowu 4, więc dalej wychodzą same szóstki: 0,1666…", "Powtarza się tylko 6, więc piszę 0,1(6)."]}]}, {"id": "l3", "n": 3, "title": "Zaokrąglanie", "trick": "Sąsiad z prawej", "intro": ["Podkreśl cyfrę, do której zaokrąglasz. Teraz patrz **tylko na jej sąsiada z prawej**.", "Sąsiad to 0, 1, 2, 3 albo 4 → podkreślona cyfra **zostaje**. Sąsiad to 5, 6, 7, 8 albo 9 → podkreślona cyfra **rośnie o 1**.", "Co za nią? Po przecinku – znika. Przed przecinkiem – zamieniasz na **zera**."], "example": {"q": "Zaokrąglij 3,467 do części setnych.", "steps": ["Setne to druga cyfra po przecinku: 3,4**6**7", "Sąsiad z prawej to 7 – to 5 albo więcej", "6 rośnie o 1 → 3,47"]}, "problems": [{"id": "l3-2", "type": "short", "q": "Zaokrąglij 12,5 do całości.", "num": 13.0, "tol": 1e-06, "accept": ["13"], "steps": ["Zaokrąglam do całości, więc podkreślam cyfrę jedności: 1**2**,5.", "Sąsiad z prawej to 5.", "5 to „5 albo więcej”, więc 2 rośnie o 1 → 3.", "To, co po przecinku, znika. Wynik: 13."]}, {"id": "l3-3", "type": "short", "q": "Zaokrąglij 2 349 do setek.", "num": 2300.0, "tol": 1e-06, "accept": ["2 300", "2300"], "steps": ["Podkreślam cyfrę setek: 2 **3**49.", "Sąsiad z prawej to 4.", "4 to „0–4”, więc 3 zostaje.", "Cyfry za nią (przed przecinkiem) zamieniam na zera: 2 300."]}, {"id": "l3-1", "type": "short", "q": "Zaokrąglij 3,467 do części setnych.", "num": 3.47, "tol": 1e-06, "accept": ["3,47"], "steps": ["Setne to druga cyfra po przecinku: 3,4**6**7.", "Sąsiad z prawej to 7.", "7 to „5 albo więcej”, więc 6 rośnie o 1 → 7.", "Resztę po przecinku skreślam. Wynik: 3,47."]}, {"id": "l3-6", "type": "short", "q": "Zaokrąglij 45 678 do tysięcy.", "num": 46000.0, "tol": 1e-06, "accept": ["46 000", "46000"], "steps": ["Podkreślam cyfrę tysięcy: 4**5** 678.", "Sąsiad z prawej to 6.", "6 to „5 albo więcej”, więc 5 rośnie o 1 → 6.", "Reszta zamienia się w zera: 46 000."]}, {"id": "l3-11", "type": "short", "q": "Zaokrąglij 5,555 do części dziesiątych.", "num": 5.6, "tol": 1e-06, "accept": ["5,6"], "steps": ["Dziesiąte to pierwsza cyfra po przecinku: 5,**5**55.", "Sąsiad z prawej to 5.", "5 to „5 albo więcej”, więc 5 rośnie o 1 → 6.", "Wynik: 5,6."]}, {"id": "l3-4", "type": "short", "q": "Zaokrąglij 0,0849 do części tysięcznych.", "num": 0.085, "tol": 1e-06, "accept": ["0,085"], "steps": ["Tysięczne to trzecia cyfra po przecinku: 0,08**4**9.", "Sąsiad z prawej to 9.", "9 to „5 albo więcej”, więc 4 rośnie o 1 → 5.", "Wynik: 0,085."]}, {"id": "l3-12", "type": "short", "q": "Zaokrąglij 999 do setek.", "num": 1000.0, "tol": 1e-06, "accept": ["1 000", "1000"], "steps": ["Podkreślam cyfrę setek: **9**99.", "Sąsiad z prawej to 9, więc podkreślona 9 rośnie o 1.", "9 + 1 = 10 – zero zostaje na miejscu setek, a jedynka idzie na miejsce tysięcy.", "Reszta to zera. Wynik: 1 000."]}, {"id": "l3-7", "type": "mc", "q": "Zaokrąglij 2/3 do części setnych.", "options": ["0,67", "0,66", "0,6", "0,7"], "answer": 0, "steps": ["Najpierw zamieniam 2/3 na ułamek dziesiętny: 2 : 3 = 0,666…", "Setne to druga cyfra po przecinku: 0,6**6**6…", "Sąsiad z prawej to 6 – „5 albo więcej”, więc 6 rośnie o 1 → 7.", "Wynik: 0,67."]}, {"id": "l3-9", "type": "mc", "q": "Która liczba po zaokrągleniu do dziesiątek daje 350?", "options": ["344", "356", "355", "346"], "answer": 3, "steps": ["Zaokrąglam do dziesiątek, więc patrzę na cyfrę jedności (sąsiada).", "344: sąsiad 4 → zostaje 340. 355 i 356: dziesiątki 5, sąsiad 5 lub 6 → rośnie → 360.", "346: dziesiątki 4, sąsiad 6 → 4 rośnie o 1 → 350.", "Odpowiedź: 346."]}, {"id": "l3-8", "type": "short", "q": "Zaokrąglij 19,995 do części setnych.", "num": 20.0, "tol": 1e-06, "accept": ["20,00", "20"], "steps": ["Setne to druga cyfra po przecinku: 19,9**9**5.", "Sąsiad z prawej to 5, więc ta 9 rośnie o 1 i robi się 10.", "Zero zostaje, a jedynka „przechodzi” dalej – i znowu trafia na 9, potem jeszcze raz. Tak 19,99 zamienia się w 20,00.", "Prosili o setne, więc zostawiam dwa miejsca po przecinku: 20,00."]}]}, {"id": "l4", "n": 4, "title": "Dodawanie i odejmowanie", "trick": "Przecinek pod przecinkiem, całości osobno", "intro": ["Ułamki dziesiętne piszesz **przecinek pod przecinkiem**. Brakuje cyfr? Dopisz zera: 10 = 10,00.", "Ułamki zwykłe – najpierw **wspólny mianownik**. Mianowników nigdy nie dodajesz!", "Liczby mieszane? **Całości osobno, ułamki osobno.** A gdy odejmujesz ułamek od całości, rozmień jedną całość: 2 = 1 8/8."], "example": {"q": "Oblicz 2 − 3/8.", "steps": ["Rozmieniam jedną całość: 2 = 1 8/8", "1 8/8 − 3/8 = 1 5/8"]}, "problems": [{"id": "l4-6", "type": "short", "q": "Oblicz: 100 − 1 + 99", "num": 198.0, "tol": 1e-06, "accept": ["198"], "steps": ["Mam tylko dodawanie i odejmowanie, więc liczę po kolei od lewej.", "Najpierw 100 − 1 = 99.", "Potem 99 + 99 = 198.", "Pułapka: nie liczę najpierw 1 + 99! Wynik: 198."]}, {"id": "l4-1", "type": "short", "q": "Oblicz: 3,7 + 2,45", "num": 6.15, "tol": 1e-06, "accept": ["6,15"], "steps": ["Trik: przecinek pod przecinkiem.", "Dopisuję zero, żeby było tyle samo cyfr: 3,70 + 2,45.", "Dodaję jak zwykłe liczby: 370 + 245 = 615.", "Przecinek stawiam w tym samym miejscu: 6,15."]}, {"id": "l4-12", "type": "short", "q": "Oblicz: 8,3 − 2,75", "num": 5.55, "tol": 1e-06, "accept": ["5,55"], "steps": ["Trik: przecinek pod przecinkiem, dopisuję zero: 8,30 − 2,75.", "Odejmuję jak zwykłe liczby: 830 − 275 = 555.", "Przecinek wraca na swoje miejsce: 5,55.", "Sprawdzam: 5,55 + 2,75 = 8,30. ✔"]}, {"id": "l4-2", "type": "short", "q": "Oblicz: 10 − 3,26", "num": 6.74, "tol": 1e-06, "accept": ["6,74"], "steps": ["Trik: dopisuję przecinek i zera: 10 = 10,00.", "Mam 10,00 − 3,26.", "Odejmuję jak zwykłe liczby: 1000 − 326 = 674.", "Przecinek na swoje miejsce: 6,74."]}, {"id": "l4-3", "type": "mc", "q": "Oblicz: 1/4 + 1/6", "options": ["5/12", "2/10", "1/5", "2/24"], "answer": 0, "steps": ["Mianowniki są różne (4 i 6), więc szukam wspólnego: najmniejsza liczba, która dzieli się przez 4 i przez 6, to 12.", "1/4 = 3/12 (górę i dół razy 3).", "1/6 = 2/12 (górę i dół razy 2).", "3/12 + 2/12 = 5/12. Mianowników nie dodaję!"]}, {"id": "l4-11", "type": "mc", "q": "Oblicz: 2/3 + 1/5", "options": ["13/15", "3/8", "3/15", "2/15"], "answer": 0, "steps": ["Wspólny mianownik dla 3 i 5 to 15.", "2/3 = 10/15 (razy 5).", "1/5 = 3/15 (razy 3).", "10/15 + 3/15 = 13/15."]}, {"id": "l4-7", "type": "mc", "q": "Oblicz: 5/6 − 1/4", "options": ["7/12", "2", "1/3", "1/2"], "answer": 0, "steps": ["Wspólny mianownik dla 6 i 4 to 12.", "5/6 = 10/12 (razy 2).", "1/4 = 3/12 (razy 3).", "10/12 − 3/12 = 7/12."]}, {"id": "l4-4", "type": "mc", "q": "Oblicz: 2 − 3/8", "options": ["1 5/8", "1 3/8", "2 3/8", "5/8"], "answer": 0, "steps": ["Trik: rozmieniam jedną całość na ósemki.", "2 = 1 + 1 = 1 + 8/8, czyli 1 8/8.", "Teraz 1 8/8 − 3/8: całość zostaje, 8/8 − 3/8 = 5/8.", "Wynik: 1 5/8."]}, {"id": "l4-5", "type": "mc", "q": "Oblicz: 4 1/2 + 3 1/5", "options": ["7 7/10", "7 2/7", "7 1/7", "8 7/10"], "answer": 0, "steps": ["Trik: całości osobno, ułamki osobno.", "Całości: 4 + 3 = 7.", "Ułamki: 1/2 + 1/5. Wspólny mianownik 10: 5/10 + 2/10 = 7/10.", "Składam razem: 7 7/10."]}, {"id": "l4-9", "type": "mc", "q": "Oblicz: 3 1/3 − 1 5/6", "options": ["1 1/2", "2 2/3", "2 1/2", "1 1/3"], "answer": 0, "steps": ["Ułamki na wspólny mianownik 6: 3 1/3 = 3 2/6.", "Mam 3 2/6 − 1 5/6. Ale 2/6 to mniej niż 5/6 – nie da się odjąć!", "Trik: rozmieniam jedną całość: 3 2/6 = 2 + 6/6 + 2/6 = 2 8/6.", "Teraz całości osobno: 2 − 1 = 1, ułamki osobno: 8/6 − 5/6 = 3/6.", "Wynik: 1 3/6 = 1 1/2."]}]}, {"id": "l5", "n": 5, "title": "Mnożenie i dzielenie", "trick": "Policz cyfry po przecinku", "intro": ["Mnożysz ułamki dziesiętne? **Zapomnij o przecinkach**, pomnóż jak zwykłe liczby. Na końcu policz, ile cyfr po przecinku było razem, i tyle oddziel.", "Dzielisz przez ułamek dziesiętny? **Przesuń przecinek** w obu liczbach o tyle samo, aż dzielnik będzie bez przecinka.", "Dzielenie przez ułamek zwykły to **mnożenie przez odwrotność**: 18 : 1/2 = 18 · 2 = 36."], "example": {"q": "Oblicz 0,3 · 0,2.", "steps": ["Bez przecinków: 3 · 2 = 6", "Po przecinku były 1 + 1 = 2 cyfry", "Oddzielam 2 cyfry: 0,06"]}, "problems": [{"id": "l5-7", "type": "short", "q": "Oblicz w pamięci: 284 · 5", "num": 1420.0, "tol": 1e-06, "accept": ["1 420", "1420"], "steps": ["Trik: razy 5 to to samo co połowa i dopisane zero.", "Połowa z 284: 284 : 2 = 142.", "Dopisuję zero: 1420.", "Wynik: 1 420."]}, {"id": "l5-1", "type": "short", "q": "Oblicz: 0,3 · 0,2", "num": 0.06, "tol": 1e-06, "accept": ["0,06"], "steps": ["Trik: zapominam o przecinkach i mnożę: 3 · 2 = 6.", "Liczę cyfry po przecinku: 0,3 ma jedną, 0,2 ma jedną – razem 2.", "W wyniku muszą być 2 cyfry po przecinku, a mam tylko 6. Dopisuję zero z przodu: 06.", "Wynik: 0,06."]}, {"id": "l5-4", "type": "short", "q": "Oblicz: 18 : 1/2", "num": 36.0, "tol": 1e-06, "accept": ["36"], "steps": ["Trik: dzielenie przez ułamek to mnożenie przez odwrotność.", "Odwrotność 1/2 to 2/1, czyli 2.", "18 : 1/2 = 18 · 2 = 36.", "Sens: ile połówek jest w 18 całych? Każda całość to 2 połówki, więc 36."]}, {"id": "l5-8", "type": "short", "q": "Oblicz: 38 : 5", "num": 7.6, "tol": 1e-06, "accept": ["7,6"], "steps": ["Trik: dzielenie przez 5 – mnożę obie liczby przez 2. Wynik się nie zmienia.", "38 · 2 = 76, 5 · 2 = 10.", "Teraz 76 : 10 – przesuwam przecinek o jedno miejsce w lewo.", "Wynik: 7,6."]}, {"id": "l5-3", "type": "short", "q": "Oblicz: 1,44 : 0,12", "num": 12.0, "tol": 1e-06, "accept": ["12"], "steps": ["Trik: przesuwam przecinek w obu liczbach, aż dzielnik będzie bez przecinka.", "W 0,12 muszę przesunąć o 2 miejsca → 12.", "W 1,44 też o 2 miejsca → 144.", "Teraz 144 : 12 = 12."]}, {"id": "l5-11", "type": "short", "q": "Oblicz: 2,5 : 0,05", "num": 50.0, "tol": 1e-06, "accept": ["50"], "steps": ["Trik: przesuwam przecinek, aż dzielnik będzie bez przecinka.", "0,05 → o 2 miejsca → 5.", "2,5 → też o 2 miejsca → 250 (dopisuję zero).", "250 : 5 = 50."]}, {"id": "l5-5", "type": "mc", "q": "Oblicz: 3/7 · 4/5", "options": ["12/35", "7/12", "15/28", "12/5"], "answer": 0, "steps": ["Mnożenie ułamków jest proste: góra razy góra, dół razy dół.", "Góra: 3 · 4 = 12.", "Dół: 7 · 5 = 35.", "Nic się nie skraca. Wynik: 12/35."]}, {"id": "l5-12", "type": "short", "q": "Oblicz: 0,25 · 0,4", "num": 0.1, "tol": 1e-06, "accept": ["0,1"], "steps": ["Trik: mnożę bez przecinków: 25 · 4 = 100.", "Cyfry po przecinku: 0,25 ma dwie, 0,4 ma jedną – razem 3.", "Oddzielam 3 cyfry od końca w 100: 0,100.", "Zera na końcu po przecinku mogę skreślić: 0,1."]}, {"id": "l5-6", "type": "mc", "q": "Oblicz: 2/3 : 5/4", "options": ["8/15", "10/12", "5/6", "15/8"], "answer": 0, "steps": ["Trik: dzielenie przez ułamek = mnożenie przez odwrotność.", "Odwracam drugi ułamek: 5/4 → 4/5.", "2/3 · 4/5: góra 2 · 4 = 8, dół 3 · 5 = 15.", "Wynik: 8/15."]}, {"id": "l5-10", "type": "mc", "q": "Oblicz: 17 : 3 2/5", "options": ["5", "1/5", "57 4/5", "5 2/5"], "answer": 0, "steps": ["Najpierw liczbę mieszaną zamieniam na ułamek: 3 2/5 = (3 · 5 + 2)/5 = 17/5.", "Mam 17 : 17/5. Trik: dzielenie przez ułamek = mnożenie przez odwrotność.", "Odwracam 17/5 → 5/17, więc liczę 17 · 5/17.", "17 na górze i 17 na dole się skracają. Zostaje 5."]}]}, {"id": "l6", "n": 6, "title": "Wyrażenia arytmetyczne", "trick": "Kolejność działań", "intro": ["Najpierw **nawiasy**, potem **potęgi**, potem **mnożenie i dzielenie**, na końcu **dodawanie i odejmowanie**.", "Mnożenie i dzielenie są równe – robisz je **po kolei od lewej**. Tak samo dodawanie i odejmowanie.", "Trik: jeśli ta sama liczba jest w każdym kawałku, **wyłącz ją przed nawias**. I łącz wygodne pary: 25 · 4 = 100."], "example": {"q": "Oblicz 2 + 3 · 4.", "steps": ["Najpierw mnożenie: 3 · 4 = 12", "Potem dodawanie: 2 + 12 = 14"]}, "problems": [{"id": "l6-1", "type": "short", "q": "Oblicz: 2 + 3 · 4", "num": 14.0, "tol": 1e-06, "accept": ["14"], "steps": ["Kolejność: mnożenie przed dodawaniem.", "Najpierw 3 · 4 = 12.", "Potem 2 + 12 = 14.", "Pułapka: 2 + 3 = 5, 5 · 4 = 20 to zła kolejność. Wynik: 14."]}, {"id": "l6-2", "type": "short", "q": "Oblicz: (2 + 3) · 4", "num": 20.0, "tol": 1e-06, "accept": ["20"], "steps": ["Nawias zawsze pierwszy.", "2 + 3 = 5.", "Potem 5 · 4 = 20.", "Wynik: 20."]}, {"id": "l6-11", "type": "short", "q": "Oblicz: 36 − 6 · (9 − 4)", "num": 6.0, "tol": 1e-06, "accept": ["6"], "steps": ["Nawias pierwszy: 9 − 4 = 5.", "Teraz mam 36 − 6 · 5. Mnożenie przed odejmowaniem: 6 · 5 = 30.", "Na końcu 36 − 30 = 6.", "Wynik: 6."]}, {"id": "l6-5", "type": "short", "q": "Oblicz: 48 : 6 : 2", "num": 4.0, "tol": 1e-06, "accept": ["4"], "steps": ["Same dzielenia – liczę po kolei od lewej.", "48 : 6 = 8.", "8 : 2 = 4.", "Pułapka: nie liczę najpierw 6 : 2! Wynik: 4."]}, {"id": "l6-3", "type": "short", "q": "Oblicz: 20 − 8 : 4 · 2", "num": 16.0, "tol": 1e-06, "accept": ["16"], "steps": ["Mnożenie i dzielenie są przed odejmowaniem. Między sobą – od lewej.", "Najpierw 8 : 4 = 2.", "Potem 2 · 2 = 4.", "Na końcu 20 − 4 = 16."]}, {"id": "l6-4", "type": "short", "q": "Oblicz: 3² + 4 · (5 − 2)", "num": 21.0, "tol": 1e-06, "accept": ["21"], "steps": ["Kolejność: nawias, potęga, mnożenie, dodawanie.", "Nawias: 5 − 2 = 3.", "Potęga: 3² = 3 · 3 = 9.", "Mnożenie: 4 · 3 = 12.", "Dodawanie: 9 + 12 = 21."]}, {"id": "l6-10", "type": "short", "q": "Oblicz sprytnie: 25 · 17 · 4", "num": 1700.0, "tol": 1e-06, "accept": ["1 700", "1700"], "steps": ["Trik: szukam wygodnej pary. 25 · 4 = 100!", "Zamieniam kolejność (przy mnożeniu wolno): 25 · 4 · 17.", "25 · 4 = 100.", "100 · 17 = 1 700."]}, {"id": "l6-7", "type": "short", "q": "Oblicz: 1/2 + 1/4 · 2", "num": 1.0, "tol": 1e-06, "accept": ["1"], "steps": ["Mnożenie przed dodawaniem.", "Najpierw 1/4 · 2 = 2/4 = 1/2.", "Potem 1/2 + 1/2 = 1.", "Wynik: 1."]}, {"id": "l6-6", "type": "short", "q": "Oblicz sprytnie: 3,7 · 6,2 + 3,7 · 1,3 + 3,7 · 2,5", "num": 37.0, "tol": 1e-06, "accept": ["37"], "steps": ["Trik: 3,7 jest w każdym kawałku – wyłączam je przed nawias.", "3,7 · (6,2 + 1,3 + 2,5).", "W nawiasie: 6,2 + 1,3 = 7,5, a 7,5 + 2,5 = 10.", "3,7 · 10 = 37 (przecinek o jedno miejsce w prawo)."]}, {"id": "l6-9", "type": "short", "q": "Oblicz: (1/2 + 1/3) · 6", "num": 5.0, "tol": 1e-06, "accept": ["5"], "steps": ["Trik: każdy ułamek w nawiasie mnożę osobno przez 6.", "1/2 · 6 = 3 (połowa z 6).", "1/3 · 6 = 2 (trzecia część z 6).", "3 + 2 = 5."]}]}, {"id": "l7", "n": 7, "title": "Liczby ujemne", "trick": "Plusy i minusy jak sztuki", "intro": ["Wyobraź sobie, że −6 to sześć minusów, a +4 to cztery plusy. **Plus i minus w parze się zjadają.** Zostaje to, czego było więcej.", "Odjąć minus to **dodać**: −7 − (−10) = −7 + 10.", "Mnożenie: **minus razy minus daje plus**, różne znaki – minus. Dużo czynników? Policz minusy: parzyście – plus, nieparzyście – minus."], "example": {"q": "Oblicz −6 + 4.", "steps": ["Sześć minusów i cztery plusy", "Cztery pary się zjadają", "Zostają 2 minusy → −2"]}, "problems": [{"id": "l7-1", "type": "short", "q": "Oblicz: −6 + 4", "num": -2.0, "tol": 1e-06, "accept": ["−2"], "steps": ["Trik: −6 to sześć minusów, +4 to cztery plusy.", "Plus i minus w parze się zjadają – mam 4 pary.", "Zostają 6 − 4 = 2 minusy.", "Wynik: −2."]}, {"id": "l7-3", "type": "short", "q": "Oblicz: 4 − 9", "num": -5.0, "tol": 1e-06, "accept": ["−5"], "steps": ["Trik: 4 to cztery plusy, −9 to dziewięć minusów.", "4 pary plus–minus się zjadają.", "Zostaje 9 − 4 = 5 minusów.", "Wynik: −5."]}, {"id": "l7-2", "type": "short", "q": "Oblicz: −3 − 5", "num": -8.0, "tol": 1e-06, "accept": ["−8"], "steps": ["Trik: −3 to trzy minusy, −5 to pięć minusów.", "Nie ma plusów, więc nic się nie zjada.", "Minusy się sumują: 3 + 5 = 8.", "Wynik: −8."]}, {"id": "l7-4", "type": "short", "q": "Oblicz: (−8) · (−2)", "num": 16.0, "tol": 1e-06, "accept": ["16"], "steps": ["Najpierw same liczby: 8 · 2 = 16.", "Teraz znak: minus razy minus daje plus.", "Wynik jest dodatni.", "Wynik: 16."]}, {"id": "l7-5", "type": "short", "q": "Oblicz: (−3) · 9", "num": -27.0, "tol": 1e-06, "accept": ["−27"], "steps": ["Najpierw same liczby: 3 · 9 = 27.", "Znak: minus razy plus – różne znaki – daje minus.", "Wynik jest ujemny.", "Wynik: −27."]}, {"id": "l7-6", "type": "short", "q": "Oblicz: −24 : (−6)", "num": 4.0, "tol": 1e-06, "accept": ["4"], "steps": ["Najpierw same liczby: 24 : 6 = 4.", "Znak: przy dzieleniu jak przy mnożeniu – minus przez minus daje plus.", "Wynik jest dodatni.", "Wynik: 4."]}, {"id": "l7-7", "type": "short", "q": "Oblicz: −7 − (−10)", "num": 3.0, "tol": 1e-06, "accept": ["3"], "steps": ["Trik: odjąć minus to dodać. „− (−10)” zamieniam na „+ 10”.", "Mam −7 + 10.", "Siedem minusów i dziesięć plusów: 7 par się zjada.", "Zostają 3 plusy. Wynik: 3."]}, {"id": "l7-11", "type": "short", "q": "Oblicz: −15 : 3 + (−2)", "num": -7.0, "tol": 1e-06, "accept": ["−7"], "steps": ["Najpierw dzielenie: −15 : 3. Liczby: 15 : 3 = 5, znaki różne → −5.", "Teraz −5 + (−2). Dodać minus to po prostu dopisać minusy: −5 − 2.", "Pięć minusów i dwa minusy – razem siedem minusów.", "Wynik: −7."]}, {"id": "l7-12", "type": "short", "q": "Oblicz: (−4)² − 5", "num": 11.0, "tol": 1e-06, "accept": ["11"], "steps": ["Najpierw potęga: (−4)² = (−4) · (−4).", "Minus razy minus daje plus: 4 · 4 = 16.", "Teraz 16 − 5 = 11.", "Wynik: 11."]}, {"id": "l7-8", "type": "short", "q": "Oblicz: (−2)³", "num": -8.0, "tol": 1e-06, "accept": ["−8"], "steps": ["(−2)³ to (−2) · (−2) · (−2).", "Same liczby: 2 · 2 · 2 = 8.", "Trik: liczę minusy – są 3, czyli nieparzyście. Wynik będzie ujemny.", "Wynik: −8."]}]}, {"id": "l8", "n": 8, "title": "Oś liczbowa", "trick": "W prawo rośnie", "intro": ["Na osi liczby rosną **w prawo**. Im bardziej w lewo, tym mniejsza liczba.", "Liczba z minusem? Idziesz **w lewo od zera**. Całości mówią, między którymi liczbami jesteś, a mianownik – na ile kawałków podzielić odcinek.", "**Odległość**  var v=el('<div><div class="card"><h2>'+esc(T.title)+': '+s+'/10 '+(ok?'🎉':'')+'</h2>'+dots(T,P.r[T.id])+'<p>'+(s===10?'Bezbłędnie! Jesteś mistrzem tego działu.':ok?'Bardzo dobrze! Ten dział masz opanowany.':s>=5?'Dobra robota – połowa za tobą. Przeczytaj jeszcze raz trik i spróbuj ponownie, a pójdzie lepiej.':'To dopiero początek. Przeczytaj trik jeszcze raz – za drugim razem będzie dużo łatwiej.')+'</p>'+
 (nx?'<button class="btn" id="nx">Następny dział: '+esc(nx.title)+' →</button>':'<button class="btn" id="sm">📊 Moje wyniki</button>')+'<button class="btn sec" id="again">Jeszcze raz ten dział</button><button class="btn ghost" id="bk">Wszystkie działy</button></div></div>');app.appendChild(v);
 if(nx)v.querySelector('#nx').onclick=function(){lesson(nx);};else v.querySelector('#sm').onclick=summary;v.querySelector('#again').onclick=function(){lesson(T);};v.querySelector('#bk').onclick=home;}
function summary(){scrollTo(0,0);app.innerHTML='';var weak=[],rows=TS.map(function(T){var s=score(T);if(s!==null&&100*s/10<PASS)weak.push(T);return '<tr><td>'+T.n+'. '+esc(T.title)+'</td><td>'+(s===null?'<span class="mut">–</span>':s+'/10 '+(100*s/10>=PASS?'✅':'❌'))+'</td></tr>';}).join('');
 var v=el('<div><div class="card"><h2>📊 Moje wyniki</h2><table>'+rows+'</table>'+(weak.length?'<p style="margin-top:12px"><b>Do powtórki:</b> '+weak.map(function(T){return esc(T.title);}).join(', ')+'. Przeczytaj trik jeszcze raz i zrób zadania ponownie.</p>':'<p style="margin-top:12px">Wszystkie zrobione działy na zaliczenie. 🎉</p>')+'<button class="btn" id="bk">Wszystkie działy</button></div></div>');app.appendChild(v);v.querySelector('#bk').onclick=home;}
window.__tpResults={queue:lq,flush:flush};home();
})();
