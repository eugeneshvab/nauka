}

 .ttab td{border:0;padding:4px 0}.ttab td:before{content:attr(data-label);display:block;font-size:.78rem;color:var(--muted);font-weight:600;margin-bottom:2px}.ttab tr.tnr{margin-top:-6px;border-color:var(--bad)}.ttab tr.tnr td:before{content:none}}
@media (max-width:560px){.wtpl i{display:none}.wtpl>div{flex-basis:100%}}

<style id="ogarnio-theme">
:root{--og-canvas:#F7F3EB;--og-surface:#FFFCF6;--og-ink:#292D29;--og-ink-soft:#68665D;--og-hair:#DDD9D0;--og-sage:#607361;--og-sage-pale:#E3E9DF;
--og-olive:#454E40;--og-clay:#9B614B;--og-clay-pale:#F2E3D9;--og-ochre:#8A642F;--og-ochre-pale:#F6EDDA;--og-lake:#596F79;--og-lake-pale:#E4EAEC;
--bg:var(--og-canvas);--card:var(--og-surface);--ink:var(--og-ink);--muted:var(--og-ink-soft);--pri:var(--og-sage);--pri2:var(--og-sage-pale);
--ok:#4E7A52;--okbg:var(--og-sage-pale);--bad:var(--og-clay);--badbg:var(--og-clay-pale);--warn:var(--og-ochre);--warnbg:var(--og-ochre-pale);--line:var(--og-hair);--r:22px;
--og-shadow:0 1px 1px rgba(0,0,0,.05),0 6px 22px rgba(0,0,0,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",Roboto,Ubuntu,sans-serif;background:var(--og-canvas);color:var(--og-ink);-webkit-font-smoothing:antialiased}
h1,h2,h3,.score{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,"Segoe UI",Roboto,sans-serif;font-weight:600;letter-spacing:-.02em}
header{position:relative;overflow:hidden;background:var(--og-canvas);color:var(--og-ink);padding:18px 20px 16px}
header h1{font-size:2rem;line-height:1.15;margin-top:4px;padding-right:120px}header p{opacity:1;color:var(--og-ink-soft)}
header .wrap{position:relative;z-index:1}
.og-brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.05rem;letter-spacing:-.01em;color:var(--og-olive);margin-bottom:10px}

.bar{background:var(--og-hair);height:8px}.bar i{background:var(--og-sage)}
nav{background:color-mix(in srgb,var(--og-canvas) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:0;padding:6px 0 8px}

nav .badge{background:var(--og-clay)}
main{padding:12px 16px 90px}
.card{background:var(--og-surface);border:0;border-radius:var(--r);padding:18px 18px;box-shadow:var(--og-shadow)}
.btn{border-radius:15px;padding:11px 18px;background:var(--og-sage)}.btn.sec{background:var(--og-sage-pale);color:var(--og-olive)}

.fb,.warn,.tldr{border-radius:15px}.warn{color:#5E4520}.tldr{background:var(--og-sage-pale)}

<script>window.TP_CONTENT={"schemaVersion": 1, "meta": {"id": "geo7-wspolrzedne-polska-geologia", "title": "Geografia: współrzędne, położenie Polski i budowa geologiczna", "subtitle": "Kierunki świata, siatka geograficzna, współrzędne i rozciągłość, sąsiedzi i granice Polski, procesy geologiczne, fałdowania, ery, płyty litosfery", "subject": "Geografia", "grade": "Klasa 7 SP", "lang": "pl", "explainLangs": ["pl", "en", "ru"], "estimatedMinutes": 120, "testDate": "2026-10-06", "sourceNote": "Opracowane według listy zagadnień do pracy klasowej i podstawy programowej geografii dla klasy 7 (w stylu podręcznika „Planeta Nowa 7”). Mapa Polski na podstawie danych Natural Earth (domena publiczna), pozostałe rysunki są uproszczone. Współrzędne skrajnych punktów i długości granic – wg GUS. Jeśli coś różni się od podręcznika – ważniejszy jest podręcznik i to, co mówił nauczyciel.", "uncertain": [], "tutorMaterial": "ZAKRES PRACY KLASOWEJ (geografia, klasa 7): kierunki świata; cechy południków i równoleżników; szerokość i długość geograficzna; obliczanie rozciągłości; linie na mapie i półkule; sąsiedzi Polski i stolice; granice naturalne; procesy endogeniczne i egzogeniczne; fałdowania; ery geologiczne; płyty litosfery.\n\n## 1. Kierunki świata\nGłówne: północ N, południe S, wschód E, zachód W. Pośrednie: NE północny wschód, SE południowy wschód, SW południowy zachód, NW północny zachód. Róża wiatrów pokazuje 8 kierunków. Na mapie północ zwykle u góry.\nWyznaczanie: kompas – igła magnetyczna wskazuje północ. Słońce w południe w Polsce jest na południu, cień jest najkrótszy i wskazuje północ. Słońce wschodzi na wschodzie, zachodzi na zachodzie (dokładnie E i W w dni równonocy). Gwiazda Polarna (Mała Niedźwiedzica) wskazuje północ – przedłużyć ok. 5 razy tylną ścianę Wielkiego Wozu. Kierunek przeciwny do NE to SW.\n\n## 2. Południki i równoleżniki\nPołudniki: półokręgi, jednakowa długość (ok. 20 000 km), łączą bieguny, kierunek N–S, zbiegają się na biegunach. Południk 0° przechodzi przez Greenwich (Londyn), naprzeciw leży 180°. Południki 0° i 180° dzielą Ziemię na półkulę wschodnią i zachodnią.\nRównoleżniki: okręgi, różna długość – maleje ku biegunom, równoległe do siebie, kierunek W–E. Równik 0° jest najdłuższy (ok. 40 000 km) i dzieli Ziemię na półkulę północną i południową. Bieguny 90°N i 90°S to punkty.\n1° wzdłuż południka ≈ 111,2 km; 1' ≈ 1,85 km.\n\n## 3. Linie na mapie\nBiegun Północny 90°N, koło podbiegunowe północne 66°33'N, zwrotnik Raka 23°27'N, równik 0°, zwrotnik Koziorożca 23°27'S, koło podbiegunowe południowe 66°33'S, Biegun Południowy 90°S. Zwrotniki + koła: 23°27' + 66°33' = 90°. Polska leży na półkuli północnej i wschodniej.\n\n## 4. Współrzędne geograficzne\nSzerokość φ: odległość kątowa od równika, 0°–90°, N (północna) lub S (południowa). Długość λ: odległość kątowa od południka 0°, 0°–180°, E (wschodnia) lub W (zachodnia). 1° = 60', 1' = 60''. Najpierw szerokość, potem długość, zawsze z literą. Warszawa ok. 52°14'N, 21°01'E. Punkt na równiku ma φ = 0°, na południku Greenwich λ = 0°.\nOdczyt z mapy: równoleżnik punktu → φ (nad równikiem N, pod S); południk punktu → λ (na prawo od 0° E, na lewo W).\n\n## 5. Rozciągłość – METODA (najważniejsze obliczenia)\nRozciągłość południkowa = różnica szerokości punktu najdalej na N i najdalej na S. Rozciągłość równoleżnikowa = różnica długości punktu najdalej na W i najdalej na E.\nKrok 1: sprawdź półkule. Ta sama półkula (N i N, S i S, E i E, W i W) → ODEJMIJ. Różne półkule → DODAJ.\nKrok 2 (tylko długość): jeśli suma > 180°, wynik = 360° − suma.\nKrok 3 (minuty): 1° = 60'. Przy odejmowaniu brakuje minut → pożycz 1° (52°15' = 51°75'). Po dodaniu minut 60' lub więcej → zamień 60' na 1° (35°75' = 36°15').\nKrok 4: odległość w km wzdłuż południka = liczba stopni × 111,2 km (minuty na ułamek: 30' = 0,5°, 15' = 0,25°, 50' ≈ 0,83°).\nPrzykłady:\n- Polska N–S: 54°50'N − 49°00'N = 5°50' (≈ 5,83° × 111,2 ≈ 649 km).\n- Polska W–E: 24°09'E − 14°07'E = 10°02'.\n- 37°20'N i 34°50'S: 37°20' + 34°50' = 71°70' = 72°10'.\n- 17°30'W i 51°25'E: 68°55'.\n- 150°E i 160°W: 310° > 180° → 360° − 310° = 50°.\n- 120°30'E i 100°45'W: 221°15' → 360° − 221°15' = 138°45'.\n- 52°15'N − 48°40'N: 51°75' − 48°40' = 3°35'.\n- 30°15'E − 12°50'E: 29°75' − 12°50' = 17°25'.\n- 66°33'N − 23°27'N = 43°06'; 23°27'N i 23°27'S = 46°54'.\n- 3° wzdłuż południka = 333,6 km; 2°30' = 278 km.\n\n## 6. Polska – położenie, sąsiedzi, granice\nEuropa Środkowa, ok. 312,7 tys. km². Skrajne punkty: N Jastrzębia Góra 54°50'N; S Opołonek (Bieszczady) 49°00'N; W zakole Odry k. Osinowa Dolnego 14°07'E; E zakole Bugu k. Zosina 24°09'E.\nSąsiedzi i stolice: Niemcy – Berlin, Czechy – Praga, Słowacja – Bratysława, Ukraina – Kijów, Białoruś – Mińsk, Litwa – Wilno, Rosja (graniczy Obwód Królewiecki) – Moskwa.\nGranice lądowe (ok., GUS): Czechy 796 km (najdłuższa), Słowacja 541, Ukraina 535, Niemcy 467, Białoruś 418, Rosja 210, Litwa 104 (najkrótsza). Razem ok. 3071 km; granica morska ok. 440 km.\nGranice naturalne: Morze Bałtyckie (N), Odra i Nysa Łużycka (z Niemcami), Sudety (z Czechami), Karpaty – Tatry, Pieniny, Beskidy, Bieszczady (ze Słowacją), Bug (z Ukrainą i Białorusią). Granice z Litwą i Rosją – sztuczne.\n\n## 7. Procesy kształtujące rzeźbę\nEndogeniczne (wewnętrzne, energia wnętrza Ziemi, tworzą nierówności): ruchy górotwórcze (fałdowanie), ruchy epejrogeniczne (powolne wznoszenie/obniżanie dużych obszarów, np. Skandynawia się podnosi), wulkanizm, trzęsienia ziemi.\nEgzogeniczne (zewnętrzne, energia Słońca i grawitacja, wyrównują): wietrzenie, erozja (niszczenie), transport, akumulacja (osadzanie). Czynniki: rzeki (doliny, delty), lodowce/lądolód (moreny, jeziora rynnowe, sandry, głazy narzutowe), wiatr (wydmy – Słowiński PN), morze (klify, mierzeje).\nPolska: lądolód skandynawski w czwartorzędzie (kilka zlodowaceń); ostatnie ukształtowało pas pojezierzy. Pasy rzeźby od N: pobrzeża, pojezierza, niziny, wyżyny, kotliny podgórskie, góry. Ok. 3/4 kraju poniżej 200 m n.p.m. Najwyższy szczyt: Rysy 2499 m (Tatry).\n\n## 8. Fałdowania\nKaledońskie – starszy paleozoik: Góry Skandynawskie, Grampiany; w Polsce Góry Świętokrzyskie.\nHercyńskie (waryscyjskie) – młodszy paleozoik: Ural, Harz, Masyw Centralny; w Polsce Sudety i Góry Świętokrzyskie.\nAlpejskie – mezozoik i kenozoik (trwa): Alpy, Himalaje, Andy, Pireneje, Kaukaz; w Polsce Karpaty (Tatry).\nSudety i Świętokrzyskie odmłodzone (ponownie wypiętrzone) w alpejskim. Góry stare: niskie, łagodne (Łysica 614 m, Śnieżka 1603 m). Góry młode: wysokie, ostre (Rysy 2499 m, Mount Everest 8849 m).\n\n## 9. Ery geologiczne (od najstarszej)\nArchaik (4,6–2,5 mld lat): powstanie Ziemi ok. 4,6 mld lat temu, pierwsze organizmy (bakterie, sinice ok. 3,5 mld). Proterozoik (2,5 mld – 541 mln): tlen w atmosferze, pierwsze wielokomórkowce. Archaik + proterozoik = prekambr.\nPaleozoik (541–252 mln; kambr, ordowik, sylur, dewon, karbon, perm): ryby, rośliny i zwierzęta lądowe, płazy, gady; fałdowania kaledońskie i hercyńskie; karbon – węgiel kamienny (Śląsk, Lubelszczyzna); perm – sól kamienna (Kłodawa), miedź.\nMezozoik (252–66 mln; trias, jura, kreda): dinozaury, pierwsze ssaki i ptaki, rozpad Pangei, początek fałdowania alpejskiego; wymarcie dinozaurów ok. 66 mln lat temu.\nKenozoik (66 mln – dziś; paleogen, neogen, czwartorzęd): fałdowanie alpejskie (Karpaty), ssaki; miocen – sól w Wieliczce i Bochni, siarka, węgiel brunatny; czwartorzęd (od 2,6 mln) – zlodowacenia i człowiek.\n\n## 10. Płyty litosfery\nLitosfera = skorupa + górna część płaszcza, podzielona na płyty, które przesuwają się o kilka cm rocznie. Główne: euroazjatycka, afrykańska, północnoamerykańska, południowoamerykańska, pacyficzna (największa), indoaustralijska, antarktyczna; mniejsze: nazca, kokosowa, karaibska, filipińska, arabska. Polska – środek płyty euroazjatyckiej (brak wulkanów, słabe trzęsienia).\nSkorupa oceaniczna: cienka 5–10 km, cięższa (bazalt), młoda. Kontynentalna: gruba 30–70 km, lżejsza (granit), stara.\nRozsuwanie: magma tworzy nowe dno – grzbiety śródoceaniczne (Grzbiet Śródatlantycki, Islandia), ryfty (Rów Wschodnioafrykański).\nZderzanie: subdukcja – cięższa płyta oceaniczna pod kontynentalną → rów oceaniczny, wulkany, góry (Andy: płyta nazca pod południowoamerykańską). Oceaniczna z oceaniczną → rów (Rów Mariański ok. 11 km) i łuk wysp. Kontynentalna z kontynentalną → góry fałdowe (Himalaje: płyta indoaustralijska i euroazjatycka).\nPrzesuwanie wzdłuż uskoku: San Andreas (płyta pacyficzna i północnoamerykańska) – trzęsienia ziemi.\nSkutki: trzęsienia ziemi, wulkany, tsunami, góry, rowy. Pacyficzny Pierścień Ognia.\n\n## Typowe błędy\nBrak litery N/S/E/W przy współrzędnych. Dodawanie zamiast odejmowania na tej samej półkuli. Zapominanie o 360° − suma. Minuty liczone jak dziesiętne (60' = 1°). Mylenie zwrotnika Raka (N) i Koziorożca (S). Mylenie cech południków i równoleżników.", "layout": "steps5"}, "images": {"roza": {"svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 320\" font-family=\"Arial,Helvetica,sans-serif\"><circle cx=\"160\" cy=\"160\" r=\"66\" fill=\"none\" stroke=\"#9ca3af\" stroke-width=\"1.5\"/><path d=\"M160,160L160.0,40.0L142.0,160.0Z\" fill=\"#1f2937\"/><path d=\"M160,160L160.0,40.0L178.0,160.0Z\" fill=\"#9ca3af\"/><path d=\"M160,160L219.4,100.6L151.5,151.5Z\" fill=\"#4b5563\"/><path d=\"M160,160L219.4,100.6L168.5,168.5Z\" fill=\"#d1d5db\"/><path d=\"M160,160L280.0,160.0L160.0,142.0Z\" fill=\"#1f2937\"/><path d=\"M160,160L280.0,160.0L160.0,178.0Z\" fill=\"#9ca3af\"/><path d=\"M160,160L219.4,219.4L168.5,151.5Z\" fill=\"#4b5563\"/><path d=\"M160,160L219.4,219.4L151.5,168.5Z\" fill=\"#d1d5db\"/><path d=\"M160,160L160.0,280.0L178.0,160.0Z\" fill=\"#1f2937\"/><path d=\"M160,160L160.0,280.0L142.0,160.0Z\" fill=\"#9ca3af\"/><path d=\"M160,160L100.6,219.4L168.5,168.5Z\" fill=\"#4b5563\"/><path d=\"M160,160L100.6,219.4L151.5,151.5Z\" fill=\"#d1d5db\"/><path d=\"M160,160L40.0,160.0L160.0,178.0Z\" fill=\"#1f2937\"/><path d=\"M160,160L40.0,160.0L160.0,142.0Z\" fill=\"#9ca3af\"/><path ><line x1=\"300\" y1=\"185\" x2=\"350\" y2=\"46\" stroke=\"#fbbf24\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\"/><circle cx=\"350\" cy=\"46\" r=\"8\" fill=\"#fde047\"/><text x=\"364\" y=\"50\" font-size=\"15\" font-weight=\"700\" fill=\"#fde047\">Gwiazda Polarna<\/text><text x=\"364\" y=\"70\" font-size=\"13\" fill=\"#e2e8f0\">wskazuje północ (N)<\/text><text x=\"60\" y=\"260\" font-size=\"14\" fill=\"#e2e8f0\">Wielki Wóz – przedłuż tylną ścianę „wozu” ok. 5 razy<\/text><\/svg>", "alt": "Wielki Wóz i Gwiazda Polarna wskazująca północ", "source": "własny rysunek SVG", "wide": true}}, "diagnostic": [{"id": "d1", "type": "mc", "tag": "l1", "q": "Który kierunek leży dokładnie pomiędzy północą a wschodem?", "options": ["południowy wschód (SE)", "wschód (E)", "północny zachód (NW)", "północny wschód (NE)"], "answer": 3, "explain": "Kierunek pośredni między N (północą) a E (wschodem) to **NE – północny wschód**."}, {"id": "d2", "type": "mc", "tag": "l2", "q": "Która cecha dotyczy **równoleżników**?", "options": ["mają różną długość – maleje ku biegunom", "są półokręgami", "mają jednakową długość", "łączą bieguny"], "answer": 0, "explain": "Równoleżniki to okręgi o różnej długości: najdłuższy jest równik, a ku biegunom są coraz krótsze. Łączenie biegunów, jednakowa długość i kształt półokręgu to cechy południków."}, {"id": "d3", "type": "mc", "tag": "l3", "q": "Jak nazywa się linia oznaczona na rysunku literą **C**?", "options": ["równik", "zwrotnik Raka", "koło podbiegunowe północne", "południk 0°"], "answer": 0, "explain": "Linia C dzieli globus na połowy (półkulę północną i południową) – to **równik (0°)**.", "image": "glob_litery"}, {"id": "d4", "type": "mc", "tag": "l4", "q": "W jakim zakresie podaje się długość geograficzną?", "options": ["od 0° do 90° (E lub W)", "od 0° do 360°", "od 0° do 180° (E lub W)", "od 0° do 90° (N lub S)"], "answer": 2, "explain": "Długość geograficzna (λ) to od 0° do 180° na wschód (E) lub zachód (W) od południka 0°. Szerokość (φ) – od 0° do 90° N lub S."}, {"id": "d5", "type": "short", "tag": "l5", "q": "Oblicz rozciągłość południkową obszaru między 54°50'N a 49°00'N (stopnie i minuty).", "accept": ["5°50'"], "dm": [5, 50], "explain": "Oba punkty na półkuli północnej → **odejmujemy**: 54°50' − 49°00' = **5°50'**. To rozciągłość południkowa Polski."}, {"id": "d6", "type": "mc", "tag": "l6", "q": "Stolicą którego sąsiada Polski jest Wilno?", "options": ["Ukrainy", "Słowacji", "Białorusi", "Litwy"], "answer": 3, "explain": "Wilno – stolica **Litwy**. Białoruś – Mińsk, Ukraina – Kijów, Słowacja – Bratysława."}, {"id": "d7", "type": "mc", "tag": "l8", "q": "W którym fałdowaniu powstały Karpaty?", "options": ["hercyńskim", "kaledońskim", "alpejskim", "żadnym – to góry wulkaniczne"], "answer": 2, "explain": "Karpaty (z Tatrami) to góry młode – powstały w **fałdowaniu alpejskim** (kenozoik)."}, {"id": "d8", "type": "mc", "tag": "l10", "q": "Co powstaje, gdy zderzają się dwie płyty kontynentalne?", "options": ["uskok przesuwczy", "grzbiet śródoceaniczny", "wysokie góry fałdowe, np. Himalaje", "rów oceaniczny z łukiem wysp"], "answer": 2, "explain": "Przy zderzeniu dwóch płyt kontynentalnych skały fałdują się i wypiętrzają – tak powstały **Himalaje** (płyta indoaustralijska napiera na euroazjatycką)."}], "lessons": [{"id": "l1", "title": "Kierunki świata i ich wyznaczanie", "minutes": 10, "body": ["**Kierunki główne:** północ (N), południe (S), wschód (E), zachód (W). **Kierunki pośrednie:** północny wschód (NE), południowy wschód (SE), południowy zachód (SW), północny zachód (NW).", "Wszystkie 8 kierunków przedstawia **róża wiatrów**. Na większości map północ jest u góry, wschód po prawej, zachód po lewej, a południe na dole.", "**Kompas** – namagnesowana igła ustawia się wzdłuż linii pola magnetycznego Ziemi i jej koniec wskazuje północ (biegun magnetyczny leży blisko geograficznego).", "**Słońce w południe** (gdy jest najwyżej – górowanie) w Polsce znajduje się **na południu**. Cień jest wtedy najkrótszy i wskazuje **północ**. Słońce wschodzi po stronie wschodniej, a zachodzi po stronie zachodniej (dokładnie na E i W – w dniach równonocy, 21 III i 23 IX).", "**Gwiazda Polarna** (w gwiazdozbiorze Małej Niedźwiedzicy) wskazuje **północ** na półkuli północnej. Znajdziesz ją, przedłużając ok. 5 razy tylną ścianę „wozu” w gwiazdozbiorze Wielkiej Niedźwiedzicy (Wielki Wóz)."], "keyPoints": ["Główne: N, S, E, W; pośrednie: NE, SE, SW, NW", "Kompas – igła magnetyczna wskazuje północ", "W Polsce w południe Słońce jest na południu, cień wskazuje północ", "Gwiazda Polarna wskazuje północ (przedłuż tylną ścianę Wielkiego Wozu ok. 5 razy)"], "why": [{"q": "Dlaczego w południe cień wskazuje północ?", "a": "Polska leży na północ od zwrotnika Raka, więc Słońce w południe jest zawsze po południowej stronie nieba. Cień pada w stronę przeciwną do Słońca – na północ."}, {"q": "Czy kompas działa obok magnesu albo metalu?", "a": "Źle – igła reaguje na każde pole magnetyczne i przedmioty z żelaza, więc może wskazać zły kierunek. Kompas trzyma się z dala od metalu."}], "tldr": {"pl": "8 kierunków: N, NE, E, SE, S, SW, W, NW. Północ wyznaczysz kompasem, cieniem w południe (wskazuje N) i Gwiazdą Polarną.", "en": "8 directions: N, NE, E, SE, S, SW, W, NW. Find north with a compass, the noon shadow (points N) and the North Star.", "ru": "8 направлений: N, NE, E, SE, S, SW, W, NW. Север определяют компасом, полуденной тенью (указывает на N) и Полярной звездой."}, "images": [{"img": "roza", "caption": "Róża wiatrów"}, {"img": "slonce_poludnie", "caption": "Słońce w południe – cień na północ"}, {"img": "gwiazda_polarna", "caption": "Gwiazda Polarna"}]}, {"id": "l2", "title": "Cechy południków i równoleżników", "minutes": 10, "body": ["**Siatka geograficzna** to układ umownych linii na globusie i mapie: **południków** i **równoleżników**.", "**Południki:** to **półokręgi**, mają **jednakową długość** (ok. 20 000 km), **łączą bieguny**, wyznaczają kierunek **północ–południe (N–S)** i **zbiegają się na biegunach**. Południk początkowy to **0° (Greenwich)** – przechodzi przez obserwatorium w Greenwich pod Londynem. Po przeciwnej stronie Ziemi leży **południk 180°**. Razem tworzą okrąg dzielący Ziemię na półkulę **wschodnią** i **zachodnią**.", "**Równoleżniki:** to **okręgi**, mają **różną długość** – najdłuższy jest **równik (0°)** (ok. 40 000 km), a im bliżej biegunów, tym są **krótsze**. Są **równoległe** do siebie i do równika, wyznaczają kierunek **wschód–zachód (W–E)**. Bieguny (90°N i 90°S) to już tylko **punkty**.", "Równik dzieli Ziemię na półkulę **północną** i **południową**.", "Na każdym południku 1° odpowiada ok. **111,2 km** – dlatego odległość wzdłuż południka łatwo policzyć ze stopni."], "keyPoints": ["Południki: półokręgi, jednakowa długość, łączą bieguny, kierunek N–S, zbiegają się na biegunach", "Południk 0° – Greenwich; 180° – po drugiej stronie Ziemi", "Równoleżniki: okręgi, różna długość (maleje ku biegunom), równoległe, kierunek W–E", "Równik 0° – najdłuższy; bieguny 90° to punkty", "1° południka ≈ 111,2 km"], "why": [{"q": "Dlaczego wszystkie południki mają tę samą długość?", "a": "Każdy południk biegnie od bieguna do bieguna po powierzchni kuli – to zawsze połowa obwodu Ziemi, więc wszystkie są równe."}, {"q": "Dlaczego równoleżniki są coraz krótsze?", "a": "Ziemia jest kulą – im bliżej bieguna, tym mniejszy jest okrąg, który da się wokół niej poprowadzić. Na samym biegunie okrąg zamienia się w punkt."}], "tldr": {"pl": "Południki: półokręgi, równe, łączą bieguny, N–S, 0° Greenwich i 180°. Równoleżniki: okręgi, coraz krótsze ku biegunom, równoległe, W–E, równik najdłuższy, bieguny to punkty.", "en": "Meridians: half-circles, equal length, join the poles, N–S, 0° Greenwich and 180°. Parallels: circles, shorter towards the poles, parallel, W–E, the equator is the longest, poles are points.", "ru": "Меридианы: полуокружности, одинаковой длины, соединяют полюса, N–S, 0° Гринвич и 180°. Параллели: окружности, к полюсам короче, параллельны, W–E, экватор самый длинный, полюса – точки."}, "images": [{"img": "poludniki", "caption": "Południki"}, {"img": "rownolezniki", "caption": "Równoleżniki"}]}, {"id": "l3", "title": "Najważniejsze linie na mapie i półkule", "minutes": 8, "body": ["**Bieguny:** Biegun Północny (90°N) i Biegun Południowy (90°S).", "**Koła podbiegunowe:** północne **66°33'N** i południowe **66°33'S** – za nimi występuje dzień i noc polarna.", "**Zwrotniki:** **Raka 23°27'N** i **Koziorożca 23°27'S** – między nimi Słońce może górować w zenicie (pionowo nad głową).", "**Równik (0°)** – najdłuższy równoleżnik, dzieli Ziemię na półkulę **północną (N)** i **południową (S)**.", "**Południk 0° (Greenwich)** i **południk 180°** – razem dzielą Ziemię na półkulę **wschodnią (E)** i **zachodnią (W)**. Polska leży na półkuli **północnej i wschodniej**.", "Kolejność od północy: Biegun Północny → koło podbiegunowe północne → zwrotnik Raka → równik → zwrotnik Koziorożca → koło podbiegunowe południowe → Biegun Południowy."], "keyPoints": ["Koła podbiegunowe 66°33'N i 66°33'S", "Zwrotnik Raka 23°27'N, zwrotnik Koziorożca 23°27'S", "Równik 0° → półkule N i S", "Południk 0° i 180° → półkule E i W", "Polska: półkula północna i wschodnia"], "why": [{"q": "Jak zapamiętać, który zwrotnik jest gdzie?", "a": "Rak jest na północy (N), Koziorożec na południu (S). Pomaga skojarzenie: „Rak na górze, Koziorożec na dole” – jak na globusie."}, {"q": "Dlaczego Polska leży na półkuli wschodniej?", "a": "Cała Polska leży na wschód od południka 0° (między 14°07'E a 24°09'E), więc jest na półkuli wschodniej; jest też na północ od równika – na półkuli północnej."}], "tldr": {"pl": "Koła podbiegunowe 66°33' N/S, zwrotniki 23°27' (Raka N, Koziorożca S), równik 0° dzieli na N i S, południk 0° i 180° na E i W.", "en": "Polar circles 66°33' N/S, tropics 23°27' (Cancer N, Capricorn S), the equator splits N and S, meridians 0° and 180° split E and W.", "ru": "Полярные круги 66°33' N/S, тропики 23°27' (Рака N, Козерога S), экватор делит на N и S, меридианы 0° и 180° – на E и W."}, "images": [{"img": "glob_opisany", "caption": "Najważniejsze linie siatki"}, {"img": "siatka_polkule", "caption": "Półkule"}]}, {"id": "l4", "title": "Szerokość i długość geograficzna", "minutes": 12, "body": ["**Szerokość geograficzna (φ)** mówi, jak daleko na północ lub południe od **równika** leży punkt. Od **0°** (równik) do **90°** (biegun), z literą **N** (szerokość północna) lub **S** (południowa).", "**Długość geograficzna (λ)** mówi, jak daleko na wschód lub zachód od **południka 0°** leży punkt. Od **0°** do **180°**, z literą **E** (długość wschodnia) lub **W** (zachodnia).", "Stopień dzieli się na minuty: **1° = 60'** (a 1' = 60''). Zapis: np. Warszawa **52°14'N, 21°01'E** (lub: 52°14' szer. geogr. płn., 21°01' dł. geogr. wsch.). Zawsze podajemy najpierw szerokość, potem długość.", "Jak odczytać współrzędne z mapy? 1) Znajdź równoleżnik punktu i odczytaj jego wartość – to φ; sprawdź, czy punkt jest nad równikiem (N), czy pod nim (S). 2) Znajdź południk punktu – to λ; sprawdź, czy jest na prawo (E), czy na lewo (W) od południka 0°.", "Punkty na równiku mają φ = 0° (bez litery), na południku 0° – λ = 0°. Biegun Północny ma φ = 90°N (długości się dla niego nie podaje).", "Litera kierunku jest obowiązkowa: 30°N i 30°S to zupełnie inne miejsca!"], "keyPoints": ["φ: od równika, 0°–90°, N lub S", "λ: od południka 0°, 0°–180°, E lub W", "1° = 60'", "Najpierw szerokość, potem długość", "Warszawa ≈ 52°14'N, 21°01'E"], "why": [{"q": "Dlaczego szerokość kończy się na 90°, a długość na 180°?", "a": "Od równika do bieguna jest ćwierć okręgu, czyli 90°. Długość liczymy od południka 0° w dwie strony do południka 180° – to pół okręgu w każdą stronę."}, {"q": "Po co minuty?", "a": "1° to ok. 111 km – za dużo, żeby dokładnie wskazać miasto. 1' to ok. 1,85 km, więc minuty pozwalają podać położenie dokładnie."}], "tldr": {"pl": "Szerokość φ: 0–90° N/S od równika. Długość λ: 0–180° E/W od południka 0°. 1° = 60'. Np. Warszawa 52°14'N, 21°01'E.", "en": "Latitude φ: 0–90° N/S from the equator. Longitude λ: 0–180° E/W from the prime meridian. 1° = 60'. E.g. Warsaw 52°14'N, 21°01'E.", "ru": "Широта φ: 0–90° N/S от экватора. Долгота λ: 0–180° E/W от нулевого меридиана. 1° = 60'. Напр. Варшава 52°14'N, 21°01'E."}, "images": [{"img": "siatka_punkty", "caption": "Odczytaj współrzędne punktów A–F"}]}, {"id": "l5", "title": "Rozciągłość południkowa i równoleżnikowa – obliczenia", "minutes": 20, "body": ["**Rozciągłość południkowa** – różnica **szerokości** geograficznej między punktem najbardziej wysuniętym na północ i na południe (mierzona wzdłuż południka). **Rozciągłość równoleżnikowa** – różnica **długości** geograficznej między punktem najdalej na zachód i na wschód.", "**Reguła:** punkty na **tej samej półkuli** (obie N albo obie S; obie E albo obie W) → **odejmujemy**. Punkty na **różnych półkulach** → **dodajemy**.", "**Uwaga przy długości:** jeśli suma wyjdzie **większa niż 180°**, liczymy krótszą drogę: **360° − suma**.", "**Minuty:** 1° = 60'. Gdy przy odejmowaniu brakuje minut – **pożycz 1° = 60'** (np. 52°15' = 51°75'). Gdy po dodaniu minut jest 60' lub więcej – zamień 60' na 1° (np. 35°75' = 36°15').", "**Przykład 1 (Polska, południkowa):** N – Jastrzębia Góra 54°50'N, S – Opołonek 49°00'N. Ta sama półkula → 54°50' − 49°00' = **5°50'**.", "**Przykład 2 (Polska, równoleżnikowa):** W – zakole Odry k. Osinowa Dolnego 14°07'E, E – zakole Bugu k. Zosina 24°09'E. Ta sama półkula → 24°09' − 14°07' = **10°02'**.", "**Przykład 3 (różne półkule, szerokość):** 37°20'N i 34°50'S → dodajemy: 37°20' + 34°50' = 71°70' = **72°10'**.", "**Przykład 4 (różne półkule, długość):** 17°30'W i 51°25'E → 17°30' + 51°25' = **68°55'**.", "**Przykład 5 (suma > 180°):** 150°E i 160°W → 150° + 160° = 310° > 180°, więc 360° − 310° = **50°**.", "**Przykład 6 (pożyczanie minut):** 52°15'N i 48°40'N → 52°15' = 51°75'; 51°75' − 48°40' = **3°35'**.", "**Odległość w km wzdłuż południka:** liczba stopni × **111,2 km**. Polska: 5°50' = 5 i 50/60 ≈ 5,83° → 5,83 × 111,2 ≈ **649 km**. (Minuty zamieniasz na ułamek stopnia: 30' = 0,5°, 15' = 0,25°, 1' ≈ 1,85 km.)"], "keyPoints": ["Południkowa = różnica szerokości (N–S); równoleżnikowa = różnica długości (W–E)", "Ta sama półkula → odejmij; różne półkule → dodaj", "Długość: suma > 180° → 360° − suma", "Brak minut → pożycz 1° = 60'; ≥ 60' → zamień na 1°", "Polska: 5°50' (N–S) i 10°02' (W–E)", "km = stopnie × 111,2 (tylko wzdłuż południka)"], "why": [{"q": "Dlaczego dla różnych półkul dodajemy?", "a": "Bo punkty leżą po dwóch stronach równika (albo południka 0°). Odległość od jednego do drugiego to droga do linii 0° plus droga od niej dalej – czyli suma."}, {"q": "Dlaczego 360° minus, gdy suma przekracza 180°?", "a": "Dookoła Ziemi jest 360°. Jeśli droga przez południk 0° ma więcej niż 180°, to druga droga – przez południk 180° – jest krótsza i wynosi 360° minus ta suma."}], "tldr": {"pl": "Ta sama półkula – odejmij, różne – dodaj; długość > 180° → 360° − suma; pożyczaj 1° = 60'. Polska: 5°50' i 10°02'. 1° południka ≈ 111,2 km.", "en": "Same hemisphere – subtract, different – add; longitude sum > 180° → 360° − sum; borrow 1° = 60'. Poland: 5°50' and 10°02'. 1° of a meridian ≈ 111.2 km.", "ru": "Одно полушарие – вычитай, разные – складывай; долгота > 180° → 360° − сумма; занимай 1° = 60'. Польша: 5°50' и 10°02'. 1° меридиана ≈ 111,2 км."}}, {"id": "l6", "title": "Położenie Polski, sąsiedzi i granice naturalne", "minutes": 12, "body": ["Polska leży w **Europie Środkowej**, na półkuli **północnej i wschodniej**. Powierzchnia: ok. **312,7 tys. km²**.", "**Skrajne punkty:** N – **Jastrzębia Góra (54°50'N)**, S – **Opołonek w Bieszczadach (49°00'N)**, W – **zakole Odry k. Osinowa Dolnego (14°07'E)**, E – **zakole Bugu k. Zosina (24°09'E)**.", "**Sąsiedzi i stolice:** Niemcy – **Berlin**, Czechy – **Praga**, Słowacja – **Bratysława**, Ukraina – **Kijów**, Białoruś – **Mińsk**, Litwa – **Wilno**, Rosja (graniczy z Polską **Obwód Królewiecki**) – **Moskwa**.", "**Długość granic lądowych** (ok., wg GUS): Czechy 796 km (**najdłuższa**), Słowacja 541 km, Ukraina 535 km, Niemcy 467 km, Białoruś 418 km, Rosja 210 km, Litwa 104 km (**najkrótsza**). Razem ok. 3071 km. Granica morska ok. 440 km.", "**Granice naturalne:** na północy **Morze Bałtyckie**; na zachodzie z Niemcami rzeki **Odra** i **Nysa Łużycka**; na południowym zachodzie z Czechami góry **Sudety**; na południu ze Słowacją **Karpaty** (m.in. **Tatry**, Pieniny, Beskidy, Bieszczady); na wschodzie z Ukrainą i Białorusią w dużej części rzeka **Bug**.", "Granica z Litwą i Rosją (Obwodem Królewieckim) nie biegnie wzdłuż wyraźnych obiektów przyrodniczych – to granice sztuczne (wyznaczone umownie)."], "keyPoints": ["Niemcy–Berlin, Czechy–Praga, Słowacja–Bratysława, Ukraina–Kijów, Białoruś–Mińsk, Litwa–Wilno, Rosja–Moskwa", "Najdłuższa granica – z Czechami, najkrótsza – z Litwą", "Granice naturalne: Bałtyk, Odra i Nysa Łużycka, Sudety, Karpaty (Tatry), Bug", "Skrajne punkty: 54°50'N, 49°00'N, 14°07'E, 24°09'E"], "why": [{"q": "Dlaczego z Rosją graniczymy tylko na północy?", "a": "Z Polską graniczy tylko Obwód Królewiecki – część Rosji oddzielona od reszty kraju, położona między Polską a Litwą nad Bałtykiem."}, {"q": "Co to jest granica naturalna?", "a": "Granica biegnąca wzdłuż obiektu w przyrodzie: rzeki, grzbietu gór albo brzegu morza – łatwo ją wskazać w terenie."}], "tldr": {"pl": "7 sąsiadów: Niemcy (Berlin), Czechy (Praga), Słowacja (Bratysława), Ukraina (Kijów), Białoruś (Mińsk), Litwa (Wilno), Rosja (Moskwa). Najdłuższa granica z Czechami. Granice naturalne: Bałtyk, Odra, Nysa Łużycka, Sudety, Karpaty, Bug.", "en": "7 neighbours: Germany (Berlin), Czechia (Prague), Slovakia (Bratislava), Ukraine (Kyiv), Belarus (Minsk), Lithuania (Vilnius), Russia (Moscow). Longest border with Czechia. Natural borders: Baltic Sea, Oder, Lusatian Neisse, Sudetes, Carpathians, Bug.", "ru": "7 соседей: Германия (Берлин), Чехия (Прага), Словакия (Братислава), Украина (Киев), Беларусь (Минск), Литва (Вильнюс), Россия (Москва). Самая длинная граница – с Чехией. Природные границы: Балтика, Одра, Ниса-Лужицкая, Судеты, Карпаты, Буг."}, "images": [{"img": "mapa_polska", "caption": "Polska i jej sąsiedzi"}]}, {"id": "l7", "title": "Procesy geologiczne i rzeźba terenu Polski", "minutes": 12, "body": ["Rzeźbę Ziemi kształtują dwie grupy procesów. **Procesy endogeniczne (wewnętrzne)** – energia z wnętrza Ziemi: **ruchy górotwórcze** (fałdowanie, wypiętrzanie gór), **ruchy epejrogeniczne** (powolne wznoszenie się lub obniżanie dużych obszarów, np. Skandynawia podnosi się po ustąpieniu lądolodu), **wulkanizm**, **trzęsienia ziemi**. Te procesy zwykle **tworzą** nierówności.", "**Procesy egzogeniczne (zewnętrzne)** – energia Słońca i siła ciężkości: **wietrzenie** (rozpad skał), **erozja** (niszczenie i wynoszenie materiału), **transport** i **akumulacja** (osadzanie). Działają: **rzeki** (doliny, delty), **lodowce i lądolody** (moreny, jeziora rynnowe, sandry, głazy narzutowe), **wiatr** (wydmy, np. Słowiński Park Narodowy), **morze** (klify, mierzeje). Te procesy zwykle **wyrównują** teren.", "W Polsce wielką rolę odegrał **lądolód skandynawski** w **czwartorzędzie** (plejstocen). Kilka razy nasuwał się z północy. Ostatnie zlodowacenie ukształtowało **pas pojezierzy** – świeża (młodoglacjalna) rzeźba z jeziorami i morenami; na nizinach rzeźba po starszych zlodowaceniach jest już wyrównana.", "**Pasowy układ rzeźby Polski** (z północy na południe): pobrzeża → **pojezierza** → **niziny** środkowopolskie → **wyżyny** → kotliny podgórskie → **góry** (Sudety, Karpaty). Polska jest krajem nizinnym – ok. 3/4 powierzchni leży poniżej 200 m n.p.m.; najwyższy szczyt to **Rysy (2499 m)** w Tatrach."], "keyPoints": ["Endogeniczne (wewnętrzne): ruchy górotwórcze, epejrogeniczne, wulkanizm, trzęsienia ziemi – tworzą nierówności", "Egzogeniczne (zewnętrzne): wietrzenie, erozja, akumulacja – rzeki, lodowiec, wiatr, morze – wyrównują", "Lądolód skandynawski (czwartorzęd) ukształtował północ Polski – pojezierza", "Pasy rzeźby: pobrzeża, pojezierza, niziny, wyżyny, kotliny, góry"], "why": [{"q": "Dlaczego jeziora są głównie na północy Polski?", "a": "Ostatni lądolód dotarł tylko do północnej Polski. Zostawił tam świeże formy – zagłębienia, rynny i moreny – w których powstały jeziora. Na południu jeziora po starszych zlodowaceniach dawno zostały zasypane."}, {"q": "Czym różni się erozja od akumulacji?", "a": "Erozja niszczy i zabiera materiał (np. rzeka pogłębia dolinę), a akumulacja to jego osadzanie (np. rzeka buduje deltę u ujścia)."}], "tldr": {"pl": "Endogeniczne (z wnętrza Ziemi) tworzą góry, wulkany, trzęsienia; egzogeniczne (wietrzenie, erozja, akumulacja: rzeki, lodowiec, wiatr, morze) wyrównują. Lądolód w czwartorzędzie ukształtował pojezierza. Pasy: pobrzeża, pojezierza, niziny, wyżyny, kotliny, góry.", "en": "Endogenic processes (from inside the Earth) build mountains, volcanoes, earthquakes; exogenic ones (weathering, erosion, deposition by rivers, glaciers, wind, sea) level the land. The Quaternary ice sheet shaped the lake districts. Belts: coast, lake districts, lowlands, uplands, basins, mountains.", "ru": "Эндогенные процессы (из недр Земли) создают горы, вулканы, землетрясения; экзогенные (выветривание, эрозия, аккумуляция: реки, ледник, ветер, море) выравнивают. Ледник в четвертичном периоде создал поозёрья. Пояса: побережья, поозёрья, низменности, возвышенности, котловины, горы."}}, {"id": "l8", "title": "Rodzaje fałdowań (orogenez)", "minutes": 10, "body": ["**Fałdowanie (orogeneza)** – proces powstawania gór: warstwy skał są zgniatane, wyginane w fałdy i wypiętrzane, zwykle przy zderzaniu się płyt litosfery.", "**Kaledońskie** – **starszy paleozoik**. Przykłady: Góry Skandynawskie, góry Szkocji (Grampiany). W Polsce: część **Gór Świętokrzyskich**.", "**Hercyńskie (waryscyjskie)** – **młodszy paleozoik** (głównie karbon). Przykłady: **Ural**, Harz, Masyw Centralny. W Polsce: **Sudety** i **Góry Świętokrzyskie** (fałdowane ponownie).", "**Alpejskie** – **mezozoik i kenozoik** (trwa do dziś). Przykłady: **Alpy, Himalaje, Andy, Karpaty**, Pireneje, Kaukaz. W Polsce: **Karpaty** (z Tatrami).", "W fałdowaniu alpejskim stare góry **Sudety** i **Świętokrzyskie** zostały ponownie wypiętrzone (**odmłodzone**) wzdłuż uskoków – ale ich skały są stare.", "**Góry stare** (kaledońskie, hercyńskie) są długo niszczone przez erozję – są **niższe, o łagodnych, zaokrąglonych** kształtach (Łysica 614 m, Śnieżka 1603 m). **Góry młode** (alpejskie) są **wysokie, strome, o ostrych szczytach** (Rysy 2499 m, Mount Everest 8849 m)."], "keyPoints": ["Kaledońskie – starszy paleozoik – Góry Skandynawskie; w Polsce Świętokrzyskie", "Hercyńskie – młodszy paleozoik – Ural; w Polsce Sudety i Świętokrzyskie", "Alpejskie – mezozoik/kenozoik – Alpy, Himalaje, Andy; w Polsce Karpaty", "Sudety odmłodzone w alpejskim", "Stare góry niskie i łagodne, młode wysokie i ostre"], "why": [{"q": "Dlaczego Sudety są niższe od Karpat?", "a": "Sudety powstały dużo wcześniej (fałdowanie hercyńskie, paleozoik), więc przez setki milionów lat niszczyła je erozja. Karpaty są młode (alpejskie) i nie zdążyły się „zetrzeć”."}, {"q": "Co znaczy, że góry zostały odmłodzone?", "a": "Że stare, zniszczone już góry zostały ponownie wypiętrzone przez późniejsze ruchy skorupy ziemskiej – w przypadku Sudetów podczas fałdowania alpejskiego."}], "tldr": {"pl": "Kaledońskie (starszy paleozoik): Góry Skandynawskie, Świętokrzyskie. Hercyńskie (młodszy paleozoik): Ural, Sudety, Świętokrzyskie. Alpejskie (mezozoik–kenozoik): Alpy, Himalaje, Andy, Karpaty.", "en": "Caledonian (early Palaeozoic): Scandinavian Mts, Holy Cross Mts. Hercynian (late Palaeozoic): Urals, Sudetes, Holy Cross Mts. Alpine (Mesozoic–Cenozoic): Alps, Himalayas, Andes, Carpathians.", "ru": "Каледонская (ранний палеозой): Скандинавские горы, Свентокшиские. Герцинская (поздний палеозой): Урал, Судеты, Свентокшиские. Альпийская (мезозой–кайнозой): Альпы, Гималаи, Анды, Карпаты."}}, {"id": "l9", "title": "Ery geologiczne i najważniejsze wydarzenia", "minutes": 12, "body": ["Historię Ziemi dzielimy na **ery** (od najstarszej): **archaik → proterozoik → paleozoik → mezozoik → kenozoik**. Archaik i proterozoik razem to **prekambr** (ok. 88% dziejów Ziemi).", "**Archaik** (ok. 4,6–2,5 mld lat temu): powstanie Ziemi (**ok. 4,6 mld lat temu**), pierwsza skorupa ziemska, **pierwsze organizmy** (bakterie, sinice – ok. 3,5 mld lat temu).", "**Proterozoik** (2,5 mld – 541 mln lat temu): przybywa tlenu w atmosferze, pojawiają się pierwsze organizmy wielokomórkowe.", "**Paleozoik** (541–252 mln lat temu; okresy: kambr, ordowik, sylur, dewon, karbon, perm): rozwój życia w morzach, ryby, pierwsze rośliny i zwierzęta lądowe, płazy i gady; **fałdowania kaledońskie i hercyńskie**. **Karbon** – bujne lasy paproci, skrzypów i widłaków → **węgiel kamienny** (Śląsk, Lubelszczyzna). **Perm** – **sól kamienna** i potasowa (np. Kłodawa) oraz rudy miedzi.", "**Mezozoik** (252–66 mln lat temu; trias, jura, kreda): **era dinozaurów**, pierwsze ssaki i ptaki, rozpad Pangei, początek fałdowania alpejskiego. W jurze – wapienie Wyżyny Krakowsko-Częstochowskiej. **Wymarcie dinozaurów ok. 66 mln lat temu** (koniec kredy).", "**Kenozoik** (66 mln lat temu – dziś; paleogen, neogen, czwartorzęd): **fałdowanie alpejskie** (Karpaty, Alpy, Himalaje), rozwój ssaków. **Neogen (miocen)** – **sól kamienna w Wieliczce i Bochni**, siarka, węgiel brunatny. **Czwartorzęd** (od ok. 2,6 mln lat) – **zlodowacenia** (lądolód skandynawski w Polsce) i **pojawienie się człowieka**."], "keyPoints": ["Kolejność er: archaik, proterozoik, paleozoik, mezozoik, kenozoik", "Powstanie Ziemi ok. 4,6 mld lat temu", "Paleozoik: fałdowania kaledońskie i hercyńskie; karbon – węgiel kamienny; perm – sól", "Mezozoik: dinozaury, wymarcie ok. 66 mln lat temu", "Kenozoik: fałdowanie alpejskie; miocen – sól w Wieliczce; czwartorzęd – zlodowacenia i człowiek"], "why": [{"q": "Skąd się wziął węgiel kamienny?", "a": "W karbonie rosły ogromne lasy paproci, skrzypów i widłaków na bagnach. Obumarłe rośliny były przykrywane osadami i pod ciśnieniem, bez dostępu powietrza, przez miliony lat zamieniały się w węgiel."}, {"q": "Skąd sól w Wieliczce?", "a": "W miocenie (neogen) na południu Polski było płytkie, ciepłe morze. Woda parowała, a sól osadzała się na dnie – powstały złoża soli kamiennej."}], "tldr": {"pl": "Archaik (Ziemia 4,6 mld lat, pierwsze organizmy) → proterozoik → paleozoik (fałdowania kaledońskie i hercyńskie, węgiel w karbonie, sól w permie) → mezozoik (dinozaury, wymarcie 66 mln) → kenozoik (fałdowanie alpejskie, sól w Wieliczce, zlodowacenia, człowiek).", "en": "Archean (Earth 4.6 bn years, first life) → Proterozoic → Palaeozoic (Caledonian and Hercynian orogenies, coal in the Carboniferous, salt in the Permian) → Mesozoic (dinosaurs, extinct 66 m years ago) → Cenozoic (Alpine orogeny, Wieliczka salt, ice ages, humans).", "ru": "Архей (Земля 4,6 млрд лет, первые организмы) → протерозой → палеозой (каледонская и герцинская складчатости, уголь в карбоне, соль в перми) → мезозой (динозавры, вымирание 66 млн лет назад) → кайнозой (альпийская складчатость, соль Велички, оледенения, человек)."}}, {"id": "l10", "title": "Płyty litosfery i ich ruchy", "minutes": 14, "body": ["**Litosfera** (skorupa ziemska + najwyższa część płaszcza) jest podzielona na **płyty litosfery**, które powoli (kilka cm na rok) przesuwają się po plastycznej warstwie płaszcza.", "**Główne płyty:** euroazjatycka, afrykańska, północnoamerykańska, południowoamerykańska, pacyficzna (największa), indoaustralijska, antarktyczna. Mniejsze m.in.: nazca, kokosowa, karaibska, filipińska, arabska. **Polska leży na płycie euroazjatyckiej**, daleko od jej granic – dlatego nie ma u nas wulkanów ani silnych trzęsień ziemi.", "**Skorupa oceaniczna vs kontynentalna:** oceaniczna jest **cienka** (ok. 5–10 km), **cięższa** (gęstsza, głównie bazalt) i **młodsza** (do ok. 200 mln lat); kontynentalna jest **gruba** (ok. 30–70 km, najgrubsza pod górami), **lżejsza** i **dużo starsza** (granit, skały osadowe).", "**Rozsuwanie (oddalanie):** płyty oddalają się, z głębi wypływa magma i tworzy nowe dno oceaniczne – powstają **grzbiety śródoceaniczne** (np. Grzbiet Śródatlantycki, na nim **Islandia**) i **ryfty** na lądzie (**Rów Wschodnioafrykański**). Towarzyszą im wulkany i trzęsienia ziemi.", "**Zderzanie (zbliżanie):** płyta oceaniczna, jako cięższa, **wsuwa się pod** kontynentalną – to **subdukcja**. Powstają **rowy oceaniczne**, **wulkany** i **góry** (np. **Andy** – płyta nazca pod południowoamerykańską; Rów Atakamski). Gdy zderzają się dwie płyty oceaniczne – rów (np. **Rów Mariański**, najgłębszy, ok. 11 km) i łuk wysp wulkanicznych (np. Mariany). Gdy zderzają się dwie płyty kontynentalne – **wypiętrzają się góry fałdowe** (np. **Himalaje**: płyta indoaustralijska napiera na euroazjatycką).", "**Przesuwanie (wzdłuż uskoku):** płyty mijają się bokiem – np. **uskok San Andreas** w Kalifornii (płyta pacyficzna i północnoamerykańska). Skutek: silne **trzęsienia ziemi**.", "**Skutki ruchów płyt:** trzęsienia ziemi, wybuchy wulkanów, **tsunami** (fale wywołane podmorskim trzęsieniem ziemi, np. Japonia 2011), powstawanie gór i rowów oceanicznych. Najwięcej wulkanów i trzęsień jest wokół Pacyfiku – to **Pacyficzny Pierścień Ognia**."], "keyPoints": ["Główne płyty: euroazjatycka, afrykańska, północnoamerykańska, południowoamerykańska, pacyficzna, indoaustralijska, antarktyczna", "Oceaniczna: cienka, cięższa, młodsza; kontynentalna: gruba, lżejsza, starsza", "Rozsuwanie: grzbiety śródoceaniczne, ryfty (Islandia, Rów Wschodnioafrykański)", "Zderzanie: subdukcja → rowy, wulkany, góry (Andy); kolizja kontynentów → Himalaje", "Przesuwanie: uskok San Andreas → trzęsienia ziemi", "Skutki: trzęsienia ziemi, wulkany, tsunami"], "why": [{"q": "Dlaczego to płyta oceaniczna wsuwa się pod kontynentalną, a nie odwrotnie?", "a": "Bo jest cięższa (gęstsza) – zbudowana z ciężkiego bazaltu. Lżejsza płyta kontynentalna „pływa” wyżej i zostaje na wierzchu."}, {"q": "Dlaczego w Polsce prawie nie ma trzęsień ziemi?", "a": "Polska leży w środku płyty euroazjatyckiej, daleko od granic płyt, gdzie skały się rozsuwają, zderzają albo przesuwają."}], "tldr": {"pl": "Litosfera = płyty. Oceaniczna cienka, ciężka, młoda; kontynentalna gruba, lekka, stara. Rozsuwanie – grzbiety i ryfty (Islandia, Afryka Wsch.); zderzanie – subdukcja (rowy, wulkany, Andy) lub kolizja (Himalaje); przesuwanie – uskoki (San Andreas). Skutki: trzęsienia, wulkany, tsunami.", "en": "The lithosphere is split into plates. Oceanic: thin, dense, young; continental: thick, light, old. Divergence – ridges and rifts (Iceland, East Africa); convergence – subduction (trenches, volcanoes, Andes) or collision (Himalayas); transform – faults (San Andreas). Effects: earthquakes, volcanoes, tsunamis.", "ru": "Литосфера разделена на плиты. Океаническая: тонкая, тяжёлая, молодая; континентальная: толстая, лёгкая, старая. Расхождение – хребты и рифты (Исландия, Восточная Африка); схождение – субдукция (желоба, вулканы, Анды) или столкновение (Гималаи); сдвиг – разломы (Сан-Андреас). Последствия: землетрясения, вулканы, цунами."}, "images": [{"img": "plyty_rozsuwanie", "caption": "Rozsuwanie płyt"}, {"img": "plyty_subdukcja", "caption": "Subdukcja"}, {"img": "plyty_kolizja", "caption": "Zderzenie kontynentów"}, {"img": "plyty_przesuwanie", "caption": "Przesuwanie wzdłuż uskoku"}]}], "flashcards": [{"front": "Kierunki główne i pośrednie", "back": "Główne: N, S, E, W. Pośrednie: NE, SE, SW, NW.", "tag": "l1", "backImage": "roza"}, {"front": "Jak wyznaczyć północ za pomocą Słońca?", "back": "W południe Słońce w Polsce jest na południu – cień (najkrótszy) wskazuje północ.", "tag": "l1", "backImage": "slonce_poludnie"}, {"front": "Jak znaleźć Gwiazdę Polarną?", "back": "Przedłużyć ok. 5 razy tylną ścianę Wielkiego Wozu. Gwiazda Polarna wskazuje północ.", "tag": "l1"}, {"front": "Cechy południków", "back": "Półokręgi, jednakowa długość, łączą bieguny, kierunek N–S, zbiegają się na biegunach. 0° – Greenwich, naprzeciw 180°.", "tag": "l2", "backImage": "poludniki"}, {"front": "Cechy równoleżników", "back": "Okręgi, różna długość (maleje ku biegunom), równoległe, kierunek W–E. Równik 0° najdłuższy, bieguny (90°) to punkty.", "tag": "l2", "backImage": "rownolezniki"}, {"front": "1° długości południka = ? km", "back": "ok. 111,2 km", "tag": "l2"}, {"front": "Koła podbiegunowe", "back": "66°33'N (północne) i 66°33'S (południowe).", "tag": "l3"}, {"front": "Zwrotniki", "back": "Zwrotnik Raka 23°27'N, zwrotnik Koziorożca 23°27'S.", "tag": "l3"}, {"front": "Co dzieli Ziemię na półkule?", "back": "Równik → północna i południowa. Południk 0° i 180° → wschodnia i zachodnia.", "tag": "l3", "backImage": "siatka_polkule"}, {"front": "Nazwij linie A–E (od góry)", "back": "A – koło podbiegunowe płn., B – zwrotnik Raka, C – równik, D – zwrotnik Koziorożca, E – koło podbiegunowe płd. (F, G – bieguny, H – południk 0°)", "tag": "l3", "frontImage": "glob_litery"}, {"front": "Szerokość geograficzna (φ)", "back": "Odległość kątowa od równika: 0°–90°, N lub S.", "tag": "l4"}, {"front": "Długość geograficzna (λ)", "back": "Odległość kątowa od południka 0°: 0°–180°, E lub W.", "tag": "l4"}, {"front": "1° = ? minut", "back": "1° = 60' (1' = 60'').", "tag": "l4"}, {"front": "Współrzędne Warszawy", "back": "ok. 52°14'N, 21°01'E", "tag": "l4"}, {"front": "Rozciągłość – kiedy odejmować, a kiedy dodawać?", "back": "Ta sama półkula → odejmij; różne półkule → dodaj. Długość: suma > 180° → 360° − suma.", "tag": "l5"}, {"front": "Pożyczanie minut: 52°15' − 48°40'", "back": "52°15' = 51°75' → 51°75' − 48°40' = 3°35'.", "tag": "l5"}, {"front": "Rozciągłość Polski", "back": "Południkowa 5°50' (54°50'N − 49°00'N, ok. 649 km); równoleżnikowa 10°02' (24°09'E − 14°07'E).", "tag": "l5"}, {"front": "Skrajne punkty Polski", "back": "N: Jastrzębia Góra 54°50'N; S: Opołonek 49°00'N; W: zakole Odry k. Osinowa Dolnego 14°07'E; E: zakole Bugu k. Zosina 24°09'E.", "tag": "l6", "backImage": "mapa_polska"}, {"front": "Sąsiedzi Polski i stolice", "back": "Niemcy – Berlin, Czechy – Praga, Słowacja – Bratysława, Ukraina – Kijów, Białoruś – Mińsk, Litwa – Wilno, Rosja – Moskwa.", "tag": "l6"}, {"front": "Nazwij państwa 1–7", "back": "1 Niemcy, 2 Czechy, 3 Słowacja, 4 Ukraina, 5 Białoruś, 6 Litwa, 7 Rosja (Obwód Królewiecki); A – Morze Bałtyckie.", "tag": "l6", "frontImage": "mapa_numery"}, {"front": "Najdłuższa i najkrótsza granica Polski", "back": "Najdłuższa – z Czechami (ok. 796 km), najkrótsza – z Litwą (ok. 104 km).", "tag": "l6"}, {"front": "Granice naturalne Polski", "back": "Morze Bałtyckie, Odra i Nysa Łużycka, Sudety, Karpaty (Tatry), Bug.", "tag": "l6"}, {"front": "Procesy endogeniczne", "back": "Wewnętrzne: ruchy górotwórcze, ruchy epejrogeniczne, wulkanizm, trzęsienia ziemi – tworzą nierówności.", "tag": "l7"}, {"front": "Procesy egzogeniczne", "back": "Zewnętrzne: wietrzenie, erozja, transport, akumulacja (rzeki, lodowce, wiatr, morze) – wyrównują teren.", "tag": "l7"}, {"front": "Ruchy epejrogeniczne", "back": "Powolne wznoszenie lub obniżanie dużych obszarów (np. Skandynawia podnosi się).", "tag": "l7"}, {"front": "Co ukształtowało pojezierza?", "back": "Lądolód skandynawski w czwartorzędzie (ostatnie zlodowacenie).", "tag": "l7"}, {"front": "Fałdowanie kaledońskie", "back": "Starszy paleozoik. Góry Skandynawskie, Grampiany; w Polsce Góry Świętokrzyskie.", "tag": "l8"}, {"front": "Fałdowanie hercyńskie", "back": "Młodszy paleozoik. Ural, Harz; w Polsce Sudety i Góry Świętokrzyskie.", "tag": "l8"}, {"front": "Fałdowanie alpejskie", "back": "Mezozoik–kenozoik (trwa). Alpy, Himalaje, Andy; w Polsce Karpaty.", "tag": "l8"}, {"front": "Ery od najstarszej", "back": "Archaik, proterozoik, paleozoik, mezozoik, kenozoik.", "tag": "l9"}, {"front": "Węgiel kamienny i sól – kiedy?", "back": "Węgiel kamienny – karbon (paleozoik). Sól – perm (Kłodawa) i miocen/neogen (Wieliczka, Bochnia).", "tag": "l9"}, {"front": "Dinozaury", "back": "Mezozoik; wymarły ok. 66 mln lat temu (koniec kredy).", "tag": "l9"}, {"front": "Czwartorzęd", "back": "Ostatni okres kenozoiku (od ok. 2,6 mln lat): zlodowacenia, pojawienie się człowieka.", "tag": "l9"}, {"front": "Płyta oceaniczna vs kontynentalna", "back": "Oceaniczna: cienka, cięższa, młodsza (bazalt). Kontynentalna: gruba, lżejsza, starsza (granit).", "tag": "l10"}, {"front": "Rozsuwanie płyt – skutki i przykłady", "back": "Grzbiety śródoceaniczne, ryfty, wulkany: Grzbiet Śródatlantycki, Islandia, Rów Wschodnioafrykański.", "tag": "l10", "backImage": "plyty_rozsuwanie"}, {"front": "Subdukcja – skutki i przykład", "back": "Płyta oceaniczna pod kontynentalną: rów oceaniczny, wulkany, góry, trzęsienia – Andy.", "tag": "l10", "backImage": "plyty_subdukcja"}, {"front": "Zderzenie płyt kontynentalnych", "back": "Wypiętrzają się góry fałdowe – Himalaje.", "tag": "l10", "backImage": "plyty_kolizja"}, {"front": "Przesuwanie płyt", "back": "Wzdłuż uskoków, silne trzęsienia ziemi – uskok San Andreas (Kalifornia).", "tag": "l10", "backImage": "plyty_przesuwanie"}, {"front": "Główne płyty litosfery", "back": "Euroazjatycka, afrykańska, północnoamerykańska, południowoamerykańska, pacyficzna, indoaustralijska, antarktyczna.", "tag": "l10"}], "quiz": [{"id": "q1", "type": "match", "tag": "l1", "q": "Połącz skrót z nazwą kierunku.", "pairs": [["NE", "północny wschód"], ["SW", "południowy zachód"], ["SE", "południowy wschód"], ["NW", "północny zachód"], ["E", "wschód"]], "explain": "N – północ, S – południe, E – wschód, W – zachód. W kierunkach pośrednich najpierw piszemy N lub S: NE = północny wschód, SE = południowy wschód, SW = południowy zachód, NW = północny zachód."}, {"id": "q2", "type": "mc", "tag": "l1", "q": "Jaki kierunek oznacza cyfra **2** na róży wiatrów?", "options": ["wschód (E)", "południowy wschód (SE)", "południowy zachód (SW)", "północny zachód (NW)"], "answer": 0, "explain": "Idąc od N zgodnie z ruchem wskazówek zegara: 1 = NE, **2 = E**, 3 = SE, 4 = S, 5 = SW, 6 = W, 7 = NW.", "image": "roza_cyfry"}, {"id": "q3", "type": "mc", "tag": "l1", "q": "Jaki kierunek oznacza cyfra **5** na róży wiatrów?", "options": ["wschód (E)", "południowy zachód (SW)", "północny zachód (NW)", "południowy wschód (SE)"], "answer": 1, "explain": "Zgodnie z ruchem wskazówek zegara od N: 1 = NE, 2 = E, 3 = SE, 4 = S, **5 = SW**, 6 = W, 7 = NW.", "image": "roza_cyfry"}, {"id": "q4", "type": "mc", "tag": "l1", "q": "Jaki kierunek oznacza cyfra **7** na róży wiatrów?", "options": ["południowy wschód (SE)", "wschód (E)", "północny zachód (NW)", "południowy zachód (SW)"], "answer": 2, "explain": "Zgodnie z ruchem wskazówek zegara od N: …, 6 = W, **7 = NW** – między zachodem a północą.", "image": "roza_cyfry"}, {"id": "q5", "type": "mc", "tag": "l1", "q": "Jest godzina 12 (południe słoneczne), stoisz w Polsce plecami do Słońca. W którą stronę patrzysz?", "options": ["na zachód", "na północ", "na południe", "na wschód"], "answer": 1, "explain": "W południe Słońce w Polsce jest na południu. Stojąc do niego plecami, patrzysz na **północ** – w tę samą stronę, w którą pada twój cień.", "image": "slonce_poludnie"}, {"id": "q6", "type": "mc", "tag": "l1", "q": "Który kierunek wskazuje Gwiazda Polarna?", "options": ["zachód", "południe", "północ", "wschód"], "answer": 2, "explain": "Gwiazda Polarna świeci prawie dokładnie nad Biegunem Północnym, więc wskazuje **północ**. Znajdziesz ją, przedłużając ok. 5 razy tylną ścianę Wielkiego Wozu.", "image": "gwiazda_polarna"}, {"id": "q7", "type": "tf", "tag": "l1", "q": "Wyznaczanie kierunków. Prawda czy fałsz?", "items": [{"s": "Igła kompasu wskazuje północ.", "a": true}, {"s": "W Polsce w południe cień jest skierowany na południe.", "a": false}, {"s": "Słońce wschodzi po stronie wschodniej nieba.", "a": true}, {"s": "Na mapach północ jest najczęściej u góry.", "a": true}, {"s": "Gwiazdę Polarną widać z półkuli południowej.", "a": false}], "explain": "Cień w południe wskazuje północ (Słońce jest na południu). Gwiazda Polarna jest widoczna tylko z półkuli północnej. Pozostałe zdania są prawdziwe."}, {"id": "q8", "type": "mc", "tag": "l1", "q": "Idziesz na północny wschód i robisz w tył zwrot. W którym kierunku teraz idziesz?", "options": ["południowy zachód", "zachód", "północny zachód", "południowy wschód"], "answer": 0, "explain": "Kierunek przeciwny do NE to **SW – południowy zachód** (na róży wiatrów leży naprzeciwko)."}, {"id": "q9", "type": "cat", "tag": "l2", "q": "Przyporządkuj cechy do południków lub równoleżników.", "categories": ["południki", "równoleżniki"], "items": [{"t": "są półokręgami", "c": 0}, {"t": "są okręgami", "c": 1}, {"t": "mają jednakową długość", "c": 0}, {"t": "ich długość maleje ku biegunom", "c": 1}, {"t": "łączą bieguny", "c": 0}, {"t": "wyznaczają kierunek W–E", "c": 1}, {"t": "wyznaczają kierunek N–S", "c": 0}, {"t": "najdłuższy z nich to równik", "c": 1}, {"t": "zbiegają się na biegunach", "c": 0}, {"t": "są do siebie równoległe", "c": 1}], "explain": "Południki: półokręgi, równe, łączą bieguny i zbiegają się na nich, kierunek N–S. Równoleżniki: okręgi, równoległe, coraz krótsze ku biegunom (najdłuższy równik), kierunek W–E."}, {"id": "q10", "type": "mc", "tag": "l2", "q": "Przez jakie miejsce przechodzi południk 0°?", "options": ["przez równik w Afryce", "przez Biegun Północny i Warszawę", "przez Paryż", "przez obserwatorium w Greenwich pod Londynem"], "answer": 3, "explain": "Południk zerowy (początkowy) przechodzi przez obserwatorium astronomiczne w **Greenwich** (dzielnica Londynu). Uwaga: każdy południk przechodzi przez oba bieguny i przecina równik."}, {"id": "q11", "type": "mc", "tag": "l2", "q": "Który równoleżnik jest najdłuższy?", "options": ["wszystkie są jednakowe", "koło podbiegunowe północne", "zwrotnik Raka", "równik (0°)"], "answer": 3, "explain": "Najdłuższy jest **równik** – ok. 40 000 km. Im bliżej biegunów, tym równoleżniki są krótsze."}, {"id": "q12", "type": "mc", "tag": "l2", "q": "Czym są bieguny w siatce geograficznej?", "options": ["punktami (90°N i 90°S), w których zbiegają się południki", "najdłuższymi równoleżnikami", "południkami 0° i 180°", "okręgami o szerokości 66°33'"], "answer": 0, "explain": "Bieguny to **punkty** o szerokości 90°N i 90°S – „równoleżniki” zmalały tam do punktu, a zbiegają się w nich wszystkie południki."}, {"id": "q13", "type": "short", "tag": "l2", "q": "Ile kilometrów odpowiada ok. **1°** wzdłuż południka? (wpisz liczbę)", "accept": ["111,2 km", "111,2"], "num": 111.2, "explain": "Obwód Ziemi przez bieguny to ok. 40 000 km; 40 000 : 360 ≈ **111,2 km**. Tę liczbę wykorzystujemy do liczenia odległości wzdłuż południka.", "tol": 0.5}, {"id": "q14", "type": "mc", "tag": "l2", "q": "Na którym rysunku zaznaczono **równoleżniki**?", "options": ["A", "B"], "optionImages": ["rownolezniki", "poludniki"], "answer": 0, "explain": "Równoleżniki to poziome okręgi, równoległe do równika, coraz krótsze ku biegunom. Południki to półokręgi łączące bieguny."}, {"id": "q15", "type": "match", "tag": "l3", "q": "Przyporządkuj literom z rysunku nazwy linii i punktów siatki geograficznej.", "pairs": [["A", "koło podbiegunowe północne"], ["B", "zwrotnik Raka"], ["C", "równik"], ["D", "zwrotnik Koziorożca"], ["E", "koło podbiegunowe południowe"], ["F", "Biegun Północny"], ["H", "południk 0°"]], "explain": "Od góry: F – Biegun Północny, A – koło podbiegunowe północne (66°33'N), B – zwrotnik Raka (23°27'N), C – równik, D – zwrotnik Koziorożca (23°27'S), E – koło podbiegunowe południowe (66°33'S); H – pionowa linia – południk 0°."}, {"id": "q16", "type": "mc", "tag": "l3", "q": "Jak nazywa się linia oznaczona literą **B**?", "options": ["zwrotnik Koziorożca", "zwrotnik Raka", "koło podbiegunowe północne", "równik"], "answer": 1, "explain": "B leży między równikiem a kołem podbiegunowym na półkuli północnej – to **zwrotnik Raka (23°27'N)**.", "image": "glob_litery"}, {"id": "q17", "type": "mc", "tag": "l3", "q": "Jak nazywa się linia oznaczona literą **E**?", "options": ["równik", "Biegun Południowy", "koło podbiegunowe południowe", "zwrotnik Koziorożca"], "answer": 2, "explain": "E leży najbliżej Bieguna Południowego (G) – to **koło podbiegunowe południowe (66°33'S)**.", "image": "glob_litery"}, {"id": "q18", "type": "match", "tag": "l3", "q": "Połącz linię z jej szerokością geograficzną.", "pairs": [["koło podbiegunowe północne", "66°33'N"], ["zwrotnik Raka", "23°27'N"], ["równik", "0°"], ["zwrotnik Koziorożca", "23°27'S"], ["koło podbiegunowe południowe", "66°33'S"], ["Biegun Północny", "90°N"]], "explain": "Zapamiętaj pary liczb: **23°27'** (zwrotniki) i **66°33'** (koła podbiegunowe). Zauważ: 23°27' + 66°33' = 90°."}, {"id": "q19", "type": "order", "tag": "l3", "q": "Ułóż linie od **północy** do **południa**.", "items": ["Biegun Północny", "koło podbiegunowe północne", "zwrotnik Raka", "równik", "zwrotnik Koziorożca", "koło podbiegunowe południowe", "Biegun Południowy"], "explain": "Od 90°N przez 66°33'N, 23°27'N, 0°, 23°27'S, 66°33'S do 90°S."}, {"id": "q20", "type": "mc", "tag": "l3", "q": "Na których półkulach leży Polska?", "options": ["południowej i zachodniej", "północnej i zachodniej", "południowej i wschodniej", "północnej i wschodniej"], "answer": 3, "explain": "Polska leży na północ od równika (półkula **północna**) i na wschód od południka 0° (półkula **wschodnia**)."}, {"id": "q21", "type": "mc", "tag": "l3", "q": "Które linie dzielą Ziemię na półkulę wschodnią i zachodnią?", "options": ["zwrotniki", "równik", "południk 0° i południk 180°", "koła podbiegunowe"], "answer": 2, "explain": "Półkulę wschodnią od zachodniej oddzielają **południk 0° i 180°** (razem tworzą okrąg). Równik dzieli Ziemię na półkulę północną i południową.", "image": "siatka_polkule"}, {"id": "q22", "type": "mc", "tag": "l4", "q": "Podaj współrzędne geograficzne punktu **A**.", "options": ["60°S, 30°E", "60°N, 30°W", "60°N, 30°E", "30°N, 60°E"], "answer": 2, "explain": "Punkt A leży na równoleżniku 60° nad równikiem (**60°N**) i na południku 30° na prawo od południka 0° (**30°E**). Najpierw szerokość, potem długość.", "image": "siatka_punkty"}, {"id": "q23", "type": "mc", "tag": "l4", "q": "Podaj współrzędne geograficzne punktu **B**.", "options": ["30°S, 60°W", "30°N, 60°W", "60°S, 30°W", "30°S, 60°E"], "answer": 0, "explain": "B leży pod równikiem na 30° (**30°S**) i na lewo od południka 0° na 60° (**60°W**).", "image": "siatka_punkty"}, {"id": "q24", "type": "mc", "tag": "l4", "q": "Który punkt leży na równiku?", "options": ["C", "F", "A", "D"], "answer": 0, "explain": "Na równiku szerokość wynosi 0°. Leży na nim punkt **C** (0°, 90°E). F leży na południku 0° (30°N, 0°).", "image": "siatka_punkty"}, {"id": "q25", "type": "short", "tag": "l4", "q": "Odczytaj z rysunku długość geograficzną punktu **D** (z literą kierunku).", "accept": ["120°00'W"], "dm": [120, 0], "explain": "D leży na południku 120° na **zachód** od południka 0° → **120°W**. (Szerokość D = 30°N.)", "dmDir": "W", "image": "siatka_punkty"}, {"id": "q26", "type": "short", "tag": "l4", "q": "Odczytaj z rysunku szerokość geograficzną punktu **E** (z literą kierunku).", "accept": ["60°00'S"], "dm": [60, 0], "explain": "E leży 60° **pod** równikiem → **60°S**. (Długość E = 150°E.)", "dmDir": "S", "image": "siatka_punkty"}, {"id": "q27", "type": "mc", "tag": "l4", "q": "Który punkt leży na **półkuli zachodniej i północnej**?", "options": ["D", "A", "B", "E"], "answer": 0, "explain": "Półkula zachodnia = długość W, północna = szerokość N. Tylko **D** (30°N, 120°W) spełnia oba warunki. B jest na zachodniej, ale południowej.", "image": "siatka_punkty"}, {"id": "q28", "type": "match", "tag": "l4", "q": "Połącz pojęcie z opisem.", "pairs": [["szerokość geograficzna", "od 0° do 90°, N lub S"], ["długość geograficzna", "od 0° do 180°, E lub W"], ["1°", "60'"], ["φ", "symbol szerokości"], ["λ", "symbol długości"]], "explain": "Szerokość (φ) liczymy od równika do biegunów (0–90°, N/S), długość (λ) od południka 0° (0–180°, E/W). 1 stopień = 60 minut."}, {"id": "q29", "type": "tf", "tag": "l4", "q": "Współrzędne geograficzne. Prawda czy fałsz?", "items": [{"s": "Szerokość geograficzna może wynosić 120°N.", "a": false}, {"s": "Punkt o długości 0° leży na południku Greenwich.", "a": true}, {"s": "Biegun Południowy ma szerokość 90°S.", "a": true}, {"s": "Zapis 52°14'N oznacza 52 stopnie i 14 minut szerokości północnej.", "a": true}, {"s": "Długość geograficzna mówi, jak daleko punkt leży od równika.", "a": false}], "explain": "Szerokość ma najwyżej 90°. Odległość od równika to szerokość, a długość to odległość od południka 0°. Pozostałe zdania są prawdziwe."}, {"id": "q30", "type": "mc", "tag": "l4", "q": "Które współrzędne mogą oznaczać miejsce w Polsce?", "options": ["52°14'N, 21°01'E", "21°01'N, 52°14'E", "52°14'N, 21°01'W", "52°14'S, 21°01'E"], "answer": 0, "explain": "Polska: szerokość 49°00'–54°50'**N**, długość 14°07'–24°09'**E**. Pasuje tylko **52°14'N, 21°01'E** – to Warszawa."}, {"id": "q31", "type": "short", "tag": "l6", "q": "Podaj współrzędną skrajnego punktu Polski najdalej wysuniętego na północ (Jastrzębia Góra) – szerokość (stopnie, minuty, litera).", "accept": ["54°50'N"], "dm": [54, 50], "explain": "Skrajne punkty Polski: N 54°50'N, S 49°00'N, W 14°07'E, E 24°09'E. Tu: **54°50'N**.", "dmDir": "N"}, {"id": "q32", "type": "short", "tag": "l6", "q": "Podaj współrzędną skrajnego punktu Polski najdalej wysuniętego na południe (Opołonek) – szerokość (stopnie, minuty, litera).", "accept": ["49°00'N"], "dm": [49, 0], "explain": "Skrajne punkty Polski: N 54°50'N, S 49°00'N, W 14°07'E, E 24°09'E. Tu: **49°00'N**.", "dmDir": "N"}, {"id": "q33", "type": "short", "tag": "l6", "q": "Podaj współrzędną skrajnego punktu Polski najdalej wysuniętego na zachód (zakole Odry k. Osinowa Dolnego) – długość (stopnie, minuty, litera).", "accept": ["14°07'E"], "dm": [14, 7], "explain": "Skrajne punkty Polski: N 54°50'N, S 49°00'N, W 14°07'E, E 24°09'E. Tu: **14°07'E**.", "dmDir": "E"}, {"id": "q34", "type": "short", "tag": "l6", "q": "Podaj współrzędną skrajnego punktu Polski najdalej wysuniętego na wschód (zakole Bugu k. Zosina) – długość (stopnie, minuty, litera).", "accept": ["24°09'E"], "dm": [24, 9], "explain": "Skrajne punkty Polski: N 54°50'N, S 49°00'N, W 14°07'E, E 24°09'E. Tu: **24°09'E**.", "dmDir": "E"}, {"id": "q35", "type": "short", "tag": "l5", "q": "Oblicz rozciągłość południkową obszaru między 50°20'N a 45°10'N. Podaj wynik w stopniach i minutach.", "accept": ["5°10'"], "dm": [5, 10], "explain": "Ta sama półkula (N) → odejmujemy: 50°20' − 45°10' = **5°10'**."}, {"id": "q36", "type": "short", "tag": "l5", "q": "Oblicz rozciągłość południkową obszaru między 12°30'N a 8°45'S. Podaj wynik w stopniach i minutach.", "accept": ["21°15'"], "dm": [21, 15], "explain": "Różne półkule (N i S) → dodajemy: 12°30' + 8°45' = 20°75' = **21°15'** (75' = 1°15')."}, {"id": "q37", "type": "short", "tag": "l5", "q": "Oblicz różnicę szerokości między kołem podbiegunowym północnym (66°33'N) a zwrotnikiem Raka (23°27'N). Podaj wynik w stopniach i minutach.", "accept": ["43°06'"], "dm": [43, 6], "explain": "Ta sama półkula → odejmujemy: 66°33' − 23°27' = **43°06'**."}, {"id": "q38", "type": "short", "tag": "l5", "q": "Oblicz różnicę szerokości między zwrotnikiem Raka (23°27'N) a zwrotnikiem Koziorożca (23°27'S). Podaj wynik w stopniach i minutach.", "accept": ["46°54'"], "dm": [46, 54], "explain": "Różne półkule → dodajemy: 23°27' + 23°27' = **46°54'**."}, {"id": "q39", "type": "short", "tag": "l5", "q": "Oblicz rozciągłość równoleżnikową obszaru między 30°15'E a 12°50'E. Podaj wynik w stopniach i minutach.", "accept": ["17°25'"], "dm": [17, 25], "explain": "Ta sama półkula (E) → odejmujemy. Brakuje minut (15' < 50'), więc pożyczamy: 30°15' = 29°75'. 29°75' − 12°50' = **17°25'**."}, {"id": "q40", "type": "short", "tag": "l5", "q": "Oblicz rozciągłość równoleżnikową obszaru między 20°40'W a 15°35'E. Podaj wynik w stopniach i minutach.", "accept": ["36°15'"], "dm": [36, 15], "explain": "Różne półkule (W i E) → dodajemy: 20°40' + 15°35' = 35°75' = **36°15'**."}, {"id": "q41", "type": "short", "tag": "l5", "q": "Oblicz rozciągłość równoleżnikową obszaru między 170°E a 165°W. Podaj wynik w stopniach i minutach.", "accept": ["25°00'"], "dm": [25, 0], "explain": "Różne półkule → 170° + 165° = 335°. To więcej niż 180°, więc liczymy krótszą drogę: 360° − 335° = **25°**."}, {"id": "q42", "type": "short", "tag": "l5", "q": "Oblicz rozciągłość równoleżnikową obszaru między 120°30'E a 100°45'W. Podaj wynik w stopniach i minutach.", "accept": ["138°45'"], "dm": [138, 45], "explain": "Różne półkule → 120°30' + 100°45' = 220°75' = 221°15' > 180°. Krótsza droga: 360° − 221°15' = 359°60' − 221°15' = **138°45'**."}, {"id": "q43", "type": "short", "tag": "l5", "q": "Oblicz rozciągłość południkową obszaru między 71°10'N a 34°50'S. Podaj wynik w stopniach i minutach.", "accept": ["106°00'"], "dm": [106, 0], "explain": "Różne półkule → dodajemy: 71°10' + 34°50' = 105°60' = **106°00'**."}, {"id": "q44", "type": "short", "tag": "l5", "q": "Oblicz rozciągłość południkową obszaru między równikiem a 37°25'S. Podaj wynik w stopniach i minutach.", "accept": ["37°25'"], "dm": [37, 25], "explain": "Równik ma szerokość 0°, więc różnica = 37°25' − 0° = **37°25'**."}, {"id": "q45", "type": "short", "tag": "l5", "q": "Oblicz rozciągłość równoleżnikową obszaru między 45°20'E a 45°20'W. Podaj wynik w stopniach i minutach.", "accept": ["90°40'"], "dm": [90, 40], "explain": "Różne półkule → dodajemy: 45°20' + 45°20' = **90°40'**."}, {"id": "q46", "type": "short", "tag": "l5", "q": "Oblicz różnicę szerokości między 52°15'N a 48°40'N. Podaj wynik w stopniach i minutach.", "accept": ["3°35'"], "dm": [3, 35], "explain": "Ta sama półkula → odejmujemy, pożyczając 1°: 52°15' = 51°75'; 51°75' − 48°40' = **3°35'**."}, {"id": "q47", "type": "short", "tag": "l5", "q": "Oblicz rozciągłość południkową Polski (N: 54°50'N, S: 49°00'N).", "accept": ["5°50'"], "dm": [5, 50], "explain": "Ta sama półkula → 54°50' − 49°00' = **5°50'**."}, {"id": "q48", "type": "short", "tag": "l5", "q": "Oblicz rozciągłość równoleżnikową Polski (W: 14°07'E, E: 24°09'E).", "accept": ["10°02'"], "dm": [10, 2], "explain": "Ta sama półkula → 24°09' − 14°07' = **10°02'**."}, {"id": "q49", "type": "short", "tag": "l5", "q": "Oblicz odległość w km między punktami leżącymi na tym samym południku: 52°N i 49°N (1° ≈ 111,2 km).", "accept": ["333,6 km", "333,6"], "num": 333.6, "explain": "Różnica szerokości: 52° − 49° = 3°. Odległość: 3 × 111,2 km = **333,6 km**.", "tol": 1}, {"id": "q50", "type": "short", "tag": "l5", "q": "Oblicz w przybliżeniu rozciągłość południkową Polski w km (5°50', 1° ≈ 111,2 km).", "accept": ["648,7 km", "648,7"], "num": 648.7, "explain": "5°50' = 5 + 50/60 ≈ 5,83°. 5,83 × 111,2 ≈ **648,7 km** (ok. 649 km).", "tol": 2.5}, {"id": "q51", "type": "short", "tag": "l5", "q": "Dwa miasta leżą na tym samym południku: 54°30'N i 52°00'N. Oblicz odległość między nimi w km (1° ≈ 111,2 km).", "accept": ["278 km", "278"], "num": 278, "explain": "Różnica: 54°30' − 52°00' = 2°30' = 2,5°. Odległość: 2,5 × 111,2 = **278 km**.", "tol": 1}, {"id": "q52", "type": "mc", "tag": "l5", "q": "Punkty leżą na różnych półkulach: 40°W i 30°E. Jak obliczysz rozciągłość równoleżnikową?", "options": ["odejmę: 40° − 30° = 10°", "360° − 70° = 290°", "40° · 30°", "dodam: 40° + 30° = 70°"], "answer": 3, "explain": "Różne półkule → **dodajemy**: 40° + 30° = 70°. Suma nie przekracza 180°, więc to jest wynik."}, {"id": "q53", "type": "order", "tag": "l5", "q": "Ułóż kroki obliczania rozciągłości równoleżnikowej punktów 150°E i 160°W.", "items": ["sprawdzam półkule: różne (E i W)", "dodaję: 150° + 160° = 310°", "sprawdzam: 310° > 180°", "liczę 360° − 310° = 50°"], "explain": "Różne półkule → dodaj. Gdy suma długości przekracza 180°, krótsza droga prowadzi przez południk 180°: 360° − suma = 50°."}, {"id": "q54", "type": "mc", "tag": "l5", "q": "Ile to jest 35°75'?", "options": ["36°15'", "35°15'", "36°75'", "34°75'"], "answer": 0, "explain": "75' = 60' + 15' = 1°15'. Zatem 35°75' = **36°15'**."}, {"id": "q55", "type": "match", "tag": "l6", "q": "Połącz sąsiada Polski z jego stolicą.", "pairs": [["Niemcy", "Berlin"], ["Czechy", "Praga"], ["Słowacja", "Bratysława"], ["Ukraina", "Kijów"], ["Białoruś", "Mińsk"], ["Litwa", "Wilno"], ["Rosja", "Moskwa"]], "explain": "Niemcy – Berlin, Czechy – Praga, Słowacja – Bratysława, Ukraina – Kijów, Białoruś – Mińsk, Litwa – Wilno, Rosja – Moskwa."}, {"id": "q56", "type": "match", "tag": "l6", "q": "Przyporządkuj cyfrom z mapy nazwy państw.", "pairs": [["1", "Niemcy"], ["2", "Czechy"], ["3", "Słowacja"], ["4", "Ukraina"], ["5", "Białoruś"], ["6", "Litwa"], ["7", "Rosja"]], "explain": "1 – Niemcy (zachód), 2 – Czechy (południowy zachód), 3 – Słowacja (południe), 4 – Ukraina (południowy wschód), 5 – Białoruś (wschód), 6 – Litwa, 7 – Rosja (Obwód Królewiecki) (północny wschód).", "image": "mapa_numery"}, {"id": "q57", "type": "mc", "tag": "l6", "q": "Jak nazywa się morze oznaczone na mapie literą **A**?", "options": ["Morze Śródziemne", "Morze Północne", "Morze Bałtyckie", "Morze Czarne"], "answer": 2, "explain": "Polska ma dostęp do **Morza Bałtyckiego** – to północna, naturalna granica kraju.", "image": "mapa_numery"}, {"id": "q58", "type": "mc", "tag": "l6", "q": "Z którym państwem Polska ma **najdłuższą** granicę?", "options": ["z Czechami", "z Ukrainą", "z Niemcami", "z Białorusią"], "answer": 0, "explain": "Najdłuższa granica lądowa Polski to granica z **Czechami** (ok. 796 km), w dużej części w Sudetach."}, {"id": "q59", "type": "mc", "tag": "l6", "q": "Z którym państwem Polska ma **najkrótszą** granicę?", "options": ["z Rosją", "z Litwą", "ze Słowacją", "z Niemcami"], "answer": 1, "explain": "Najkrótsza jest granica z **Litwą** (ok. 104 km). Z Rosją (Obwodem Królewieckim) – ok. 210 km."}, {"id": "q60", "type": "order", "tag": "l6", "q": "Ułóż granice od **najdłuższej** do **najkrótszej**.", "items": ["z Czechami", "z Niemcami", "z Rosją", "z Litwą"], "explain": "Czechy ok. 796 km > Niemcy ok. 467 km > Rosja ok. 210 km > Litwa ok. 104 km."}, {"id": "q61", "type": "match", "tag": "l6", "q": "Połącz odcinek granicy z jej naturalnym przebiegiem.", "pairs": [["granica z Niemcami", "Odra i Nysa Łużycka"], ["granica z Czechami", "Sudety"], ["granica ze Słowacją", "Karpaty (m.in. Tatry)"], ["granica z Ukrainą i Białorusią", "Bug (w dużej części)"], ["granica północna", "Morze Bałtyckie"]], "explain": "Zachód – Odra i Nysa Łużycka; południowy zachód – Sudety; południe – Karpaty; wschód – Bug; północ – Bałtyk."}, {"id": "q62", "type": "multi", "tag": "l6", "q": "Zaznacz **wszystkie** naturalne granice Polski.", "options": ["Alpy", "Odra", "Wisła", "Bug", "Morze Bałtyckie", "Sudety", "Nysa Łużycka", "Karpaty"], "answer": [1, 3, 4, 5, 6, 7], "explain": "Naturalne granice: Bałtyk, Odra, Nysa Łużycka, Sudety, Karpaty i Bug. **Wisła** płynie przez środek Polski, a **Alpy** nie leżą przy Polsce.", "image": "mapa_polska"}, {"id": "q63", "type": "mc", "tag": "l6", "q": "Która część Rosji graniczy z Polską?", "options": ["okolice Moskwy", "Syberia", "Obwód Królewiecki (Kaliningradzki)", "Kaukaz"], "answer": 2, "explain": "Z Polską graniczy tylko **Obwód Królewiecki** – część Rosji położona nad Bałtykiem, między Polską a Litwą. Stolicą Rosji jest Moskwa."}, {"id": "q64", "type": "cat", "tag": "l6", "q": "Przyporządkuj stolice: sąsiad z zachodu i południa czy ze wschodu i północy?", "categories": ["zachód / południe", "wschód / północ"], "items": [{"t": "Berlin", "c": 0}, {"t": "Praga", "c": 0}, {"t": "Bratysława", "c": 0}, {"t": "Kijów", "c": 1}, {"t": "Mińsk", "c": 1}, {"t": "Wilno", "c": 1}, {"t": "Moskwa", "c": 1}], "explain": "Na zachodzie i południu: Niemcy (Berlin), Czechy (Praga), Słowacja (Bratysława). Na wschodzie i północy: Ukraina (Kijów), Białoruś (Mińsk), Litwa (Wilno), Rosja (Moskwa)."}, {"id": "q65", "type": "cat", "tag": "l7", "q": "Przyporządkuj procesy do endogenicznych lub egzogenicznych.", "categories": ["endogeniczne (wewnętrzne)", "egzogeniczne (zewnętrzne)"], "items": [{"t": "ruchy górotwórcze", "c": 0}, {"t": "wulkanizm", "c": 0}, {"t": "trzęsienia ziemi", "c": 0}, {"t": "ruchy epejrogeniczne", "c": 0}, {"t": "wietrzenie", "c": 1}, {"t": "erozja rzeczna", "c": 1}, {"t": "akumulacja lodowcowa", "c": 1}, {"t": "działalność wiatru – wydmy", "c": 1}, {"t": "niszczenie brzegu przez morze", "c": 1}], "explain": "Endogeniczne mają źródło we wnętrzu Ziemi (ruchy skorupy, wulkany, trzęsienia). Egzogeniczne działają na powierzchni dzięki energii Słońca i grawitacji: wietrzenie, erozja, transport, akumulacja (rzeki, lodowce, wiatr, morze)."}, {"id": "q66", "type": "mc", "tag": "l7", "q": "Czym są ruchy epejrogeniczne?", "options": ["wybuchami wulkanów", "gwałtownymi wstrząsami skorupy", "powolnym wznoszeniem się lub obniżaniem dużych obszarów skorupy ziemskiej", "fałdowaniem warstw skalnych w góry"], "answer": 2, "explain": "Ruchy **epejrogeniczne** to powolne, pionowe ruchy dużych obszarów, np. Półwysep Skandynawski wciąż się podnosi po ustąpieniu ciężkiego lądolodu."}, {"id": "q67", "type": "match", "tag": "l7", "q": "Połącz czynnik zewnętrzny z formą, którą tworzy.", "pairs": [["lądolód", "moreny i jeziora rynnowe"], ["wiatr", "wydmy"], ["morze", "klif"], ["rzeka", "delta i dolina rzeczna"]], "explain": "Lądolód zostawia moreny, rynny jeziorne i głazy narzutowe; wiatr usypuje wydmy (Łeba); morze niszczy brzeg i tworzy klify; rzeka żłobi doliny i buduje delty."}, {"id": "q68", "type": "mc", "tag": "l7", "q": "Co ukształtowało rzeźbę północnej Polski (pas pojezierzy)?", "options": ["fałdowanie alpejskie", "lądolód skandynawski w czwartorzędzie", "wulkany w kenozoiku", "morze w karbonie"], "answer": 1, "explain": "Pojezierza to „świeża” rzeźba polodowcowa zostawiona przez **lądolód skandynawski** w czasie ostatniego zlodowacenia (czwartorzęd)."}, {"id": "q69", "type": "order", "tag": "l7", "q": "Ułóż pasy rzeźby Polski od **północy** do **południa**.", "items": ["pobrzeża", "pojezierza", "niziny", "wyżyny", "kotliny podgórskie", "góry"], "explain": "Pasowy układ rzeźby: pobrzeża → pojezierza → niziny środkowopolskie → wyżyny → kotliny podgórskie → góry (Sudety, Karpaty)."}, {"id": "q70", "type": "tf", "tag": "l7", "q": "Rzeźba terenu. Prawda czy fałsz?", "items": [{"s": "Procesy egzogeniczne zwykle wyrównują powierzchnię Ziemi.", "a": true}, {"s": "Erozja to osadzanie materiału.", "a": false}, {"s": "Polska jest krajem głównie nizinnym.", "a": true}, {"s": "Najwyższym szczytem Polski są Rysy.", "a": true}], "explain": "Erozja to **niszczenie** i wynoszenie materiału; osadzanie to akumulacja. Ok. 3/4 Polski leży poniżej 200 m n.p.m.; Rysy (2499 m) w Tatrach to najwyższy szczyt Polski."}, {"id": "q71", "type": "match", "tag": "l8", "q": "Połącz fałdowanie z erą, w której zachodziło.", "pairs": [["kaledońskie", "starszy paleozoik"], ["hercyńskie", "młodszy paleozoik"], ["alpejskie", "mezozoik i kenozoik"]], "explain": "Kaledońskie i hercyńskie – paleozoik (najpierw kaledońskie, potem hercyńskie). Alpejskie – od mezozoiku przez kenozoik do dziś."}, {"id": "q72", "type": "cat", "tag": "l8", "q": "Przyporządkuj góry do fałdowania, w którym powstały.", "categories": ["kaledońskie", "hercyńskie", "alpejskie"], "items": [{"t": "Góry Skandynawskie", "c": 0}, {"t": "Grampiany (Szkocja)", "c": 0}, {"t": "Ural", "c": 1}, {"t": "Sudety", "c": 1}, {"t": "Alpy", "c": 2}, {"t": "Himalaje", "c": 2}, {"t": "Andy", "c": 2}, {"t": "Karpaty", "c": 2}], "explain": "Kaledońskie: Góry Skandynawskie, góry Szkocji. Hercyńskie: Ural, Sudety (i Harz, Masyw Centralny). Alpejskie: Alpy, Himalaje, Andy, Karpaty."}, {"id": "q73", "type": "mc", "tag": "l8", "q": "W jakich fałdowaniach powstawały Góry Świętokrzyskie?", "options": ["kaledońskim i hercyńskim", "nie powstały w fałdowaniu", "tylko kaledońskim", "tylko alpejskim"], "answer": 0, "explain": "Góry Świętokrzyskie są najstarsze w Polsce – fałdowane w **kaledońskim i hercyńskim**, a w alpejskim ponownie wypiętrzone."}, {"id": "q74", "type": "mc", "tag": "l8", "q": "Co oznacza, że Sudety zostały **odmłodzone** w fałdowaniu alpejskim?", "options": ["pokryły się młodymi lasami", "stare, zniszczone góry zostały ponownie wypiętrzone wzdłuż uskoków", "zostały zalane przez morze", "powstały dopiero w kenozoiku"], "answer": 1, "explain": "Sudety powstały w fałdowaniu **hercyńskim**. W alpejskim zostały ponownie **wypiętrzone** (odmłodzone) – ale skały mają bardzo stare."}, {"id": "q75", "type": "cat", "tag": "l8", "q": "Cechy gór starych i młodych.", "categories": ["góry stare", "góry młode"], "items": [{"t": "niższe", "c": 0}, {"t": "łagodne, zaokrąglone szczyty", "c": 0}, {"t": "wysokie", "c": 1}, {"t": "ostre, strome szczyty", "c": 1}, {"t": "np. Góry Świętokrzyskie", "c": 0}, {"t": "np. Tatry", "c": 1}], "explain": "Góry stare przez setki milionów lat niszczyła erozja – są niskie i łagodne. Góry młode (alpejskie) są wysokie, strome, o ostrych szczytach."}, {"id": "q76", "type": "order", "tag": "l9", "q": "Ułóż ery geologiczne od **najstarszej** do **najmłodszej**.", "items": ["archaik", "proterozoik", "paleozoik", "mezozoik", "kenozoik"], "explain": "Archaik → proterozoik (razem prekambr) → paleozoik → mezozoik → kenozoik (trwa obecnie)."}, {"id": "q77", "type": "order", "tag": "l9", "q": "Ułóż wydarzenia od **najstarszego** do **najmłodszego**.", "items": ["powstanie Ziemi", "pierwsze organizmy (bakterie, sinice)", "powstanie węgla kamiennego (karbon)", "dinozaury", "fałdowanie alpejskie Karpat", "zlodowacenia i pojawienie się człowieka"], "explain": "4,6 mld lat – Ziemia; ok. 3,5 mld – pierwsze organizmy (archaik); karbon (paleozoik) – węgiel; mezozoik – dinozaury; kenozoik – fałdowanie alpejskie; czwartorzęd – zlodowacenia i człowiek."}, {"id": "q78", "type": "match", "tag": "l9", "q": "Połącz wydarzenie z erą.", "pairs": [["pierwsze organizmy", "archaik"], ["powstanie węgla kamiennego", "paleozoik"], ["panowanie dinozaurów", "mezozoik"], [
