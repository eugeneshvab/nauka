nie się płyt na grzbiecie"], "answer": 1, "explain": "**Subdukcja** – cięższa płyta oceaniczna zanurza się pod płytę kontynentalną (lub inną oceaniczną). Powstają rowy oceaniczne, wulkany i trzęsienia ziemi."}, {"id": "q89", "type": "mc", "tag": "l10", "q": "Jak powstał Rów Wschodnioafrykański?", "options": ["przez erozję rzeki Nil", "w wyniku zderzenia dwóch płyt kontynentalnych", "w wyniku rozsuwania się płyty litosfery na lądzie (ryft)", "przez działalność lodowca"], "answer": 2, "explain": "To **ryft** – płyta afrykańska pęka i rozsuwa się. Powstał głęboki rów z jeziorami i wulkanami (np. Kilimandżaro)."}, {"id": "q90", "type": "multi", "tag": "l10", "q": "Zaznacz **wszystkie** skutki ruchów płyt litosfery.", "options": ["trzęsienia ziemi", "powstawanie rowów oceanicznych", "powstawanie gór fałdowych", "tsunami", "pływy morskie", "wybuchy wulkanów", "pory roku"], "answer": [0, 1, 2, 3, 5], "explain": "Ruchy płyt powodują trzęsienia ziemi, wulkanizm, tsunami (po podmorskich trzęsieniach), powstawanie gór i rowów. Pory roku wynikają z ruchu obiegowego Ziemi, a pływy – z przyciągania Księżyca."}, {"id": "q91", "type": "multi", "tag": "l10", "q": "Zaznacz **główne** płyty litosfery.", "options": ["bałtycka", "północnoamerykańska", "alpejska", "euroazjatycka", "indoaustralijska", "afrykańska", "antarktyczna", "pacyficzna", "południowoamerykańska"], "answer": [1, 3, 4, 5, 6, 7, 8], "explain": "Siedem głównych płyt: euroazjatycka, afrykańska, północnoamerykańska, południowoamerykańska, pacyficzna, indoaustralijska, antarktyczna. Płyty „bałtyckiej” ani „alpejskiej” nie ma."}, {"id": "q92", "type": "mc", "tag": "l10", "q": "Gdzie występuje najwięcej wulkanów i trzęsień ziemi?", "options": ["w Australii Środkowej", "w środku Europy", "na Grenlandii", "wokół Oceanu Spokojnego (Pacyficzny Pierścień Ognia)"], "answer": 3, "explain": "Wokół Pacyfiku płyty oceaniczne wsuwają się pod inne płyty – to **Pacyficzny Pierścień Ognia** z większością czynnych wulkanów i najsilniejszymi trzęsieniami ziemi."}], "explainPrompts": [{"id": "e1", "tag": "l2", "prompt": "Porównaj cechy południków i równoleżników (co najmniej po 3 cechy).", "keyPoints": ["południki – półokręgi, równoleżniki – okręgi", "południki jednakowej długości; równoleżniki coraz krótsze ku biegunom", "południki łączą bieguny i wyznaczają N–S", "równoleżniki są równoległe i wyznaczają W–E", "równik – najdłuższy równoleżnik, 0° – Greenwich"], "model": "Południki to półokręgi o jednakowej długości, które łączą bieguny, zbiegają się na nich i wyznaczają kierunek północ–południe; początkowy to 0° (Greenwich), naprzeciw niego leży 180°. Równoleżniki to okręgi równoległe do siebie, wyznaczają kierunek wschód–zachód; najdłuższy jest równik, a ku biegunom są coraz krótsze – bieguny to już punkty."}, {"id": "e2", "tag": "l5", "prompt": "Wyjaśnij krok po kroku, jak obliczyć rozciągłość równoleżnikową dwóch punktów. Podaj przykład dla różnych półkul z sumą większą niż 180°.", "keyPoints": ["sprawdzam, na jakich półkulach są punkty", "ta sama półkula – odejmuję, różne – dodaję", "suma > 180° → 360° − suma", "minuty: pożyczam lub zamieniam 60' na 1°", "przykład, np. 150°E i 160°W → 50°"], "model": "Najpierw sprawdzam, czy punkty leżą na tej samej półkuli (obie E albo obie W) – wtedy odejmuję – czy na różnych – wtedy dodaję. Jeśli przy długości suma przekracza 180°, liczę krótszą drogę: 360° minus suma. Np. 150°E i 160°W: 150° + 160° = 310°, więc 360° − 310° = 50°. Przy minutach pożyczam 1° = 60' albo zamieniam 60' na 1°."}, {"id": "e3", "tag": "l6", "prompt": "Wymień sąsiadów Polski z ich stolicami i opisz naturalne granice Polski.", "keyPoints": ["7 sąsiadów ze stolicami", "Bałtyk na północy", "Odra i Nysa Łużycka z Niemcami", "Sudety z Czechami, Karpaty ze Słowacją", "Bug na wschodzie"], "model": "Polska graniczy z Niemcami (Berlin), Czechami (Praga), Słowacją (Bratysława), Ukrainą (Kijów), Białorusią (Mińsk), Litwą (Wilno) i Rosją – Obwodem Królewieckim (Moskwa). Naturalne granice to: Morze Bałtyckie na północy, Odra i Nysa Łużycka na zachodzie, Sudety na południowym zachodzie, Karpaty z Tatrami na południu oraz Bug na wschodzie. Najdłuższa granica jest z Czechami, najkrótsza z Litwą."}, {"id": "e4", "tag": "l8", "prompt": "Opisz trzy fałdowania: kiedy zachodziły i jakie góry (na świecie i w Polsce) wtedy powstały.", "keyPoints": ["kaledońskie – starszy paleozoik – Góry Skandynawskie, Świętokrzyskie", "hercyńskie – młodszy paleozoik – Ural, Sudety, Świętokrzyskie", "alpejskie – mezozoik/kenozoik – Alpy, Himalaje, Andy, Karpaty", "Sudety odmłodzone w alpejskim"], "model": "Fałdowanie kaledońskie zachodziło w starszym paleozoiku – powstały m.in. Góry Skandynawskie, a w Polsce część Gór Świętokrzyskich. Hercyńskie – w młodszym paleozoiku: Ural, Sudety i ponownie Góry Świętokrzyskie. Alpejskie trwa od mezozoiku do dziś: Alpy, Himalaje, Andy i Karpaty. W fałdowaniu alpejskim Sudety zostały odmłodzone, czyli ponownie wypiętrzone."}, {"id": "e5", "tag": "l10", "prompt": "Opisz trzy rodzaje ruchów płyt litosfery i ich skutki. Podaj przykłady.", "keyPoints": ["rozsuwanie – grzbiety śródoceaniczne, ryfty (Islandia, Rów Wschodnioafrykański)", "zderzanie – subdukcja: rowy, wulkany, Andy; kolizja kontynentów: Himalaje", "przesuwanie – uskoki, trzęsienia ziemi (San Andreas)", "skutki: trzęsienia ziemi, wulkany, tsunami"], "model": "Gdy płyty się rozsuwają, wypływa magma i powstają grzbiety śródoceaniczne (Islandia) lub ryfty na lądzie (Rów Wschodnioafrykański). Gdy się zderzają, cięższa płyta oceaniczna wsuwa się pod kontynentalną (subdukcja) – powstają rowy oceaniczne, wulkany i góry, np. Andy; zderzenie dwóch płyt kontynentalnych wypiętrza góry fałdowe, np. Himalaje. Gdy płyty przesuwają się wzdłuż uskoku, np. San Andreas, dochodzi do silnych trzęsień ziemi. Skutkami ruchów płyt są też wybuchy wulkanów i tsunami."}, {"id": "e6", "tag": "l7", "prompt": "Wyjaśnij różnicę między procesami endogenicznymi a egzogenicznymi i opisz, jak lądolód ukształtował Polskę.", "keyPoints": ["endogeniczne – z wnętrza Ziemi, tworzą nierówności (góry, wulkany, trzęsienia, epejrogeneza)", "egzogeniczne – zewnętrzne (wietrzenie, erozja, akumulacja), wyrównują", "lądolód skandynawski w czwartorzędzie", "pojezierza na północy – moreny, jeziora"], "model": "Procesy endogeniczne mają źródło we wnętrzu Ziemi – to ruchy górotwórcze i epejrogeniczne, wulkanizm i trzęsienia ziemi; tworzą nierówności. Procesy egzogeniczne działają z zewnątrz – wietrzenie, erozja i akumulacja przez rzeki, lodowce, wiatr i morze; wyrównują teren. W czwartorzędzie Polskę kilka razy pokrywał lądolód skandynawski; ostatni ukształtował pas pojezierzy z morenami i jeziorami na północy."}], "mockTest": {"id": "praca-klasowa-a", "title": "Praca klasowa – grupa A", "minutes": 45, "gradeScale": [[0, "niedostateczny"], [31, "dopuszczający"], [51, "dostateczny"], [71, "dobry"], [86, "bardzo dobry"], [98, "celujący"]], "intro": "Sprawdzian w stylu szkolnej pracy klasowej: zadania z punktacją, jak na kartce. Masz **45 minut**. Licz na brudnopisie, w okienka wpisuj wyniki w stopniach i minutach (np. **39°15'** albo **39 15**). Po oddaniu przy każdym zadaniu zobaczysz wyjaśnienie. Grupę B wybierzesz przyciskiem na górze tej zakładki.", "tasks": [{"id": "a1", "type": "match", "tag": "l1", "q": "**Zad. 1.** Podaj nazwy kierunków oznaczonych na róży wiatrów cyframi.", "pairs": [["1", "NE – północny wschód"], ["3", "SE – południowy wschód"], ["5", "SW – południowy zachód"], ["6", "W – zachód"]], "explain": "Od N zgodnie z ruchem wskazówek zegara: 1 NE, 2 E, 3 SE, 4 S, 5 SW, 6 W, 7 NW.", "image": "roza_cyfry"}, {"id": "a2", "type": "mc", "tag": "l1", "q": "**Zad. 2.** W którą stronę świata wskazuje w Polsce cień patyka w południe?", "options": ["na południe", "na zachód", "na północ", "na wschód"], "answer": 2, "explain": "W południe Słońce jest w Polsce na południu, więc cień pada na **północ**."}, {"id": "a3", "type": "tf", "tag": "l2", "q": "**Zad. 3.** Oceń prawdziwość zdań o siatce geograficznej.", "items": [{"s": "Wszystkie południki mają jednakową długość.", "a": true}, {"s": "Równoleżniki zbiegają się na biegunach.", "a": false}, {"s": "Równik jest najdłuższym równoleżnikiem.", "a": true}, {"s": "Południki wyznaczają kierunek wschód–zachód.", "a": false}], "explain": "Na biegunach zbiegają się **południki**; południki wyznaczają kierunek **N–S** (równoleżniki – W–E). Pozostałe zdania są prawdziwe."}, {"id": "a4", "type": "match", "tag": "l3", "q": "**Zad. 4.** Podpisz linie i punkty oznaczone na rysunku literami.", "pairs": [["A", "koło podbiegunowe północne"], ["B", "zwrotnik Raka"], ["C", "równik"], ["D", "zwrotnik Koziorożca"], ["H", "południk 0°"]], "explain": "F – Biegun Północny, A – koło podbiegunowe płn. 66°33'N, B – zwrotnik Raka 23°27'N, C – równik 0°, D – zwrotnik Koziorożca 23°27'S, E – koło podbiegunowe płd. 66°33'S, G – Biegun Południowy, H – południk 0°.", "image": "glob_litery"}, {"id": "a5", "type": "mc", "tag": "l4", "q": "**Zad. 5.** Podaj współrzędne geograficzne punktu **A** z rysunku.", "options": ["60°N, 30°E", "60°S, 30°E", "30°N, 60°E", "60°N, 30°W"], "answer": 0, "explain": "A: 60° nad równikiem (N), 30° na wschód od południka 0° (E) → **60°N, 30°E**.", "image": "siatka_punkty"}, {"id": "a6", "type": "short", "tag": "l4", "q": "**Zad. 6.** Odczytaj z tego samego rysunku szerokość geograficzną punktu **B** (z literą).", "accept": ["30°00'S"], "dm": [30, 0], "explain": "B leży 30° pod równikiem → **30°S** (długość 60°W).", "dmDir": "S"}, {"id": "a7", "type": "mc", "tag": "l3", "q": "**Zad. 7.** Na których półkulach leży punkt **E** z rysunku (60°S, 150°E)?", "options": ["południowej i zachodniej", "południowej i wschodniej", "północnej i wschodniej", "północnej i zachodniej"], "answer": 1, "explain": "S → półkula południowa, E → półkula wschodnia."}, {"id": "a8", "type": "short", "tag": "l5", "q": "**Zad. 8.** Oblicz rozciągłość południkową obszaru między 23°45'N a 15°30'S.", "accept": ["39°15'"], "dm": [39, 15], "explain": "Różne półkule → dodajemy: 23°45' + 15°30' = 38°75' = **39°15'**.", "points": 2}, {"id": "a9", "type": "short", "tag": "l5", "q": "**Zad. 9.** Oblicz rozciągłość równoleżnikową obszaru między 135°20'E a 110°50'W.", "accept": ["113°50'"], "dm": [113, 50], "explain": "Różne półkule → 135°20' + 110°50' = 245°70' = 246°10'. To więcej niż 180°, więc: 360° − 246°10' = 359°60' − 246°10' = **113°50'**.", "points": 2}, {"id": "a10", "type": "short", "tag": "l5", "q": "**Zad. 10.** Oblicz rozciągłość południkową obszaru między 47°10'N a 39°35'N.", "accept": ["7°35'"], "dm": [7, 35], "explain": "Ta sama półkula → odejmujemy, pożyczając 1°: 47°10' = 46°70'; 46°70' − 39°35' = **7°35'**.", "points": 2}, {"id": "a11", "type": "short", "tag": "l5", "q": "**Zad. 11.** Oblicz odległość w km między punktami na tym samym południku: 50°00'N i 46°30'N (1° ≈ 111,2 km).", "accept": ["389,2 km", "389,2"], "num": 389.2, "explain": "Różnica: 50°00' − 46°30' = 3°30' = 3,5°. Odległość: 3,5 × 111,2 = **389,2 km**.", "tol": 1.5, "points": 2}, {"id": "a12", "type": "match", "tag": "l6", "q": "**Zad. 12.** Podaj nazwy państw oznaczonych na mapie cyframi.", "pairs": [["1", "Niemcy"], ["2", "Czechy"], ["3", "Słowacja"], ["5", "Białoruś"], ["6", "Litwa"]], "explain": "1 Niemcy, 2 Czechy, 3 Słowacja, 4 Ukraina, 5 Białoruś, 6 Litwa, 7 Rosja (Obwód Królewiecki).", "image": "mapa_numery"}, {"id": "a13", "type": "match", "tag": "l6", "q": "**Zad. 13.** Połącz państwa z ich stolicami.", "pairs": [["Czechy", "Praga"], ["Słowacja", "Bratysława"], ["Ukraina", "Kijów"], ["Litwa", "Wilno"]], "explain": "Niemcy – Berlin, Czechy – Praga, Słowacja – Bratysława, Ukraina – Kijów, Białoruś – Mińsk, Litwa – Wilno, Rosja – Moskwa."}, {"id": "a14", "type": "multi", "tag": "l6", "q": "**Zad. 14.** Zaznacz **wszystkie** obiekty, wzdłuż których biegnie granica Polski.", "options": ["Wisła", "Sudety", "Odra", "Nysa Łużycka", "Warta", "Bug"], "answer": [1, 2, 3, 5], "explain": "Granica biegnie wzdłuż Odry i Nysy Łużyckiej (z Niemcami), Sudetów (z Czechami) i Bugu (z Ukrainą i Białorusią). Wisła i Warta płyną w głębi kraju."}, {"id": "a15", "type": "cat", "tag": "l7", "q": "**Zad. 15.** Przyporządkuj procesy do odpowiedniej grupy.", "categories": ["endogeniczne", "egzogeniczne"], "items": [{"t": "wulkanizm", "c": 0}, {"t": "ruchy górotwórcze", "c": 0}, {"t": "ruchy epejrogeniczne", "c": 0}, {"t": "wietrzenie", "c": 1}, {"t": "erozja", "c": 1}, {"t": "akumulacja lodowcowa", "c": 1}], "explain": "Endogeniczne – energia z wnętrza Ziemi (ruchy skorupy, wulkany, trzęsienia). Egzogeniczne – działają na powierzchni (wietrzenie, erozja, akumulacja: rzeki, lodowce, wiatr, morze)."}, {"id": "a16", "type": "cat", "tag": "l8", "q": "**Zad. 16.** Przyporządkuj góry do fałdowań.", "categories": ["kaledońskie", "hercyńskie", "alpejskie"], "items": [{"t": "Góry Skandynawskie", "c": 0}, {"t": "Ural", "c": 1}, {"t": "Sudety", "c": 1}, {"t": "Himalaje", "c": 2}, {"t": "Karpaty", "c": 2}, {"t": "Andy", "c": 2}], "explain": "Kaledońskie: Góry Skandynawskie, Grampiany. Hercyńskie: Ural, Sudety, Harz. Alpejskie: Alpy, Himalaje, Andy, Karpaty, Pireneje."}, {"id": "a17", "type": "order", "tag": "l9", "q": "**Zad. 17.** Ułóż ery geologiczne od najstarszej do najmłodszej.", "items": ["archaik", "proterozoik", "paleozoik", "mezozoik", "kenozoik"], "explain": "Archaik → proterozoik → paleozoik → mezozoik → kenozoik.", "points": 2}, {"id": "a18", "type": "mc", "tag": "l9", "q": "**Zad. 18.** W której erze powstał węgiel kamienny na Śląsku?", "options": ["w paleozoiku (karbon)", "w mezozoiku (jura)", "w kenozoiku (czwartorzęd)", "w archaiku"], "answer": 0, "explain": "Węgiel kamienny powstał w **karbonie** – okresie **paleozoiku** – z lasów paproci, skrzypów i widłaków."}, {"id": "a19", "type": "match", "tag": "l10", "q": "**Zad. 19.** Przyporządkuj rysunkom rodzaj ruchu płyt litosfery.", "pairs": [["rysunek 1", "subdukcja"], ["rysunek 2", "rozsuwanie"], ["rysunek 3", "przesuwanie wzdłuż uskoku"]], "explain": "Rozsuwanie – magma tworzy nowe dno; subdukcja – płyta oceaniczna pod kontynentalną; kolizja – dwie płyty kontynentalne wypiętrzają góry; przesuwanie – płyty mijają się wzdłuż uskoku.", "pairImages": ["plyty_subdukcja", "plyty_rozsuwanie", "plyty_przesuwanie"]}, {"id": "a20", "type": "mc", "tag": "l10", "q": "**Zad. 20.** Która cecha dotyczy skorupy **oceanicznej**?", "options": ["jest grubsza i lżejsza od kontynentalnej", "jest cieńsza i cięższa od kontynentalnej", "jest starsza od kontynentalnej", "zbudowana jest głównie z granitu"], "answer": 1, "explain": "Skorupa oceaniczna jest **cienka (5–10 km), cięższa** i młodsza; kontynentalna – gruba, lżejsza, stara (granit)."}, {"id": "a21", "type": "open", "tag": "l10", "q": "**Zad. 21.** Wyjaśnij, jak powstały Andy. Użyj nazw płyt i pojęcia subdukcja. Podaj dwa skutki tego procesu.", "keyPoints": ["płyta nazca (oceaniczna) zderza się z płytą południowoamerykańską (kontynentalną)", "cięższa płyta oceaniczna wsuwa się pod kontynentalną – subdukcja", "skały na krawędzi kontynentu fałdują się i wypiętrzają – Andy", "skutki: wulkany, trzęsienia ziemi, rów oceaniczny (Atakamski)"], "model": "Andy powstały na styku oceanicznej płyty nazca i kontynentalnej płyty południowoamerykańskiej. Cięższa płyta oceaniczna wsuwa się pod kontynentalną (subdukcja), a skały na krawędzi kontynentu fałdują się i wypiętrzają. Skutkami są czynne wulkany, częste trzęsienia ziemi i głęboki Rów Atakamski u wybrzeży.", "points": 4, "explain": "Za każdy element 1 pkt."}]}, "mocks": [{"id": "praca-klasowa-b", "title": "Praca klasowa – grupa B", "minutes": 45, "gradeScale": [[0, "niedostateczny"], [31, "dopuszczający"], [51, "dostateczny"], [71, "dobry"], [86, "bardzo dobry"], [98, "celujący"]], "intro": "Druga wersja pracy klasowej (inne liczby i przykłady). **45 minut**, wyniki rozciągłości wpisuj w stopniach i minutach (np. **58°50'**).", "tasks": [{"id": "b1", "type": "match", "tag": "l1", "q": "**Zad. 1.** Podaj nazwy kierunków oznaczonych na róży wiatrów cyframi.", "pairs": [["2", "E – wschód"], ["4", "S – południe"], ["7", "NW – północny zachód"], ["1", "NE – północny wschód"]], "explain": "Od N zgodnie z ruchem wskazówek zegara: 1 NE, 2 E, 3 SE, 4 S, 5 SW, 6 W, 7 NW.", "image": "roza_cyfry"}, {"id": "b2", "type": "mc", "tag": "l1", "q": "**Zad. 2.** Który kierunek wskazuje Gwiazda Polarna?", "options": ["zachód", "południe", "wschód", "północ"], "answer": 3, "explain": "Gwiazda Polarna świeci prawie dokładnie nad Biegunem Północnym – wskazuje **północ**."}, {"id": "b3", "type": "tf", "tag": "l2", "q": "**Zad. 3.** Oceń prawdziwość zdań o siatce geograficznej.", "items": [{"s": "Południki łączą bieguny.", "a": true}, {"s": "Wszystkie równoleżniki mają jednakową długość.", "a": false}, {"s": "Bieguny są punktami o szerokości 90°.", "a": true}, {"s": "Południk 180° przechodzi przez Greenwich.", "a": false}], "explain": "Równoleżniki mają **różną** długość (maleje ku biegunom). Przez Greenwich przechodzi południk **0°**, a 180° leży po przeciwnej stronie Ziemi."}, {"id": "b4", "type": "match", "tag": "l3", "q": "**Zad. 4.** Podpisz linie i punkty oznaczone na rysunku literami.", "pairs": [["B", "zwrotnik Raka"], ["C", "równik"], ["E", "koło podbiegunowe południowe"], ["F", "Biegun Północny"], ["D", "zwrotnik Koziorożca"]], "explain": "F – Biegun Północny, A – koło podbiegunowe płn. 66°33'N, B – zwrotnik Raka 23°27'N, C – równik 0°, D – zwrotnik Koziorożca 23°27'S, E – koło podbiegunowe płd. 66°33'S, G – Biegun Południowy, H – południk 0°.", "image": "glob_litery"}, {"id": "b5", "type": "mc", "tag": "l4", "q": "**Zad. 5.** Podaj współrzędne geograficzne punktu **D** z rysunku.", "options": ["30°S, 120°W", "120°N, 30°W", "30°N, 120°E", "30°N, 120°W"], "answer": 3, "explain": "D: 30° nad równikiem (N), 120° na zachód od południka 0° (W) → **30°N, 120°W**.", "image": "siatka_punkty"}, {"id": "b6", "type": "short", "tag": "l4", "q": "**Zad. 6.** Odczytaj z tego samego rysunku długość geograficzną punktu **E** (z literą id": "b13", "type": "match", "tag": "l6", "q": "**Zad. 13.** Połącz państwa z ich stolicami.", "pairs": [["Niemcy", "Berlin"], ["Białoruś", "Mińsk"], ["Rosja", "Moskwa"], ["Czechy", "Praga"]], "explain": "Niemcy – Berlin, Czechy – Praga, Słowacja – Bratysława, Ukraina – Kijów, Białoruś – Mińsk, Litwa – Wilno, Rosja – Moskwa."}, {"id": "b14", "type": "mc", "tag": "l6", "q": "**Zad. 14.** Z którym państwem Polska ma najdłuższą granicę lądową?", "options": ["z Niemcami", "z Czechami", "z Białorusią", "z Litwą"], "answer": 1, "explain": "Najdłuższa – z **Czechami** (ok. 796 km), najkrótsza – z Litwą (ok. 104 km)."}, {"id": "b15", "type": "cat", "tag": "l7", "q": "**Zad. 15.** Przyporządkuj procesy do odpowiedniej grupy.", "categories": ["endogeniczne", "egzogeniczne"], "items": [{"t": "trzęsienia ziemi", "c": 0}, {"t": "fałdowanie skał", "c": 0}, {"t": "wybuch wulkanu", "c": 0}, {"t": "powstawanie wydm", "c": 1}, {"t": "tworzenie klifu przez fale", "c": 1}, {"t": "pogłębianie doliny przez rzekę", "c": 1}], "explain": "Endogeniczne – energia z wnętrza Ziemi (ruchy skorupy, wulkany, trzęsienia). Egzogeniczne – działają na powierzchni (wietrzenie, erozja, akumulacja: rzeki, lodowce, wiatr, morze)."}, {"id": "b16", "type": "cat", "tag": "l8", "q": "**Zad. 16.** Przyporządkuj góry do fałdowań.", "categories": ["kaledońskie", "hercyńskie", "alpejskie"], "items": [{"t": "Grampiany (Szkocja)", "c": 0}, {"t": "Harz", "c": 1}, {"t": "Ural", "c": 1}, {"t": "Alpy", "c": 2}, {"t": "Pireneje", "c": 2}, {"t": "Karpaty", "c": 2}], "explain": "Kaledońskie: Góry Skandynawskie, Grampiany. Hercyńskie: Ural, Sudety, Harz. Alpejskie: Alpy, Himalaje, Andy, Karpaty, Pireneje."}, {"id": "b17", "type": "order", "tag": "l9", "q": "**Zad. 17.** Ułóż wydarzenia od najstarszego do najmłodszego.", "items": ["powstanie Ziemi", "pierwsze organizmy", "powstanie węgla kamiennego", "panowanie dinozaurów", "zlodowacenia w Polsce"], "explain": "Ziemia (4,6 mld lat) → pierwsze organizmy (archaik) → węgiel (karbon, paleozoik) → dinozaury (mezozoik) → zlodowacenia (czwartorzęd, kenozoik).", "points": 2}, {"id": "b18", "type": "mc", "tag": "l9", "q": "**Zad. 18.** W której erze powstały Karpaty i żyjemy obecnie?", "options": ["w mezozoiku", "w kenozoiku", "w paleozoiku", "w proterozoiku"], "answer": 1, "explain": "Fałdowanie alpejskie, które wypiętrzyło Karpaty, osiągnęło szczyt w **kenozoiku** – erze, która trwa do dziś."}, {"id": "b19", "type": "match", "tag": "l10", "q": "**Zad. 19.** Przyporządkuj rysunkom rodzaj ruchu płyt litosfery.", "pairs": [["rysunek 1", "zderzenie płyt kontynentalnych"], ["rysunek 2", "rozsuwanie"], ["rysunek 3", "subdukcja"]], "explain": "Rozsuwanie – magma tworzy nowe dno; subdukcja – płyta oceaniczna pod kontynentalną; kolizja – dwie płyty kontynentalne wypiętrzają góry; przesuwanie – płyty mijają się wzdłuż uskoku.", "pairImages": ["plyty_kolizja", "plyty_rozsuwanie", "plyty_subdukcja"]}, {"id": "b20", "type": "mc", "tag": "l10", "q": "**Zad. 20.** Co powstaje w miejscu rozsuwania się płyt na dnie oceanu?", "options": ["uskok San Andreas", "grzbiet śródoceaniczny", "góry fałdowe jak Himalaje", "rów oceaniczny"], "answer": 1, "explain": "Przy rozsuwaniu wypływa magma i buduje **grzbiet śródoceaniczny** (np. Grzbiet Śródatlantycki z Islandią)."}, {"id": "b21", "type": "open", "tag": "l10", "q": "**Zad. 21.** Wyjaśnij, jak powstały Himalaje i dlaczego wciąż występują tam trzęsienia ziemi.", "keyPoints": ["płyta indoaustralijska zderza się z euroazjatycką", "obie są płytami kontynentalnymi – żadna nie wsuwa się łatwo pod drugą", "skały fałdują się i wypiętrzają – góry fałdowe (fałdowanie alpejskie)", "płyty nadal na siebie napierają – trzęsienia ziemi"], "model": "Himalaje powstały w wyniku zderzenia kontynentalnej płyty indoaustralijskiej z płytą euroazjatycką. Obie płyty są lekkie, więc skały na ich styku zostały zgniecione, sfałdowane i wypiętrzone – to góry fałdowe powstałe w fałdowaniu alpejskim. Płyty wciąż na siebie napierają, dlatego występują tam trzęsienia ziemi, a góry nadal rosną.", "points": 4, "explain": "Za każdy element 1 pkt."}]}], "cheatSheet": [{"title": "Kierunki świata", "items": ["Główne: N, S, E, W · pośrednie: NE, SE, SW, NW", "Kompas – igła wskazuje N · w południe cień → N (Słońce na S) · Gwiazda Polarna → N (5× tylna ściana Wielkiego Wozu)"], "images": [{"img": "roza", "caption": "róża wiatrów"}]}, {"title": "Południki i równoleżniki", "items": ["Południki: półokręgi, równe, łączą bieguny, N–S, zbiegają się na biegunach; 0° Greenwich, 180°", "Równoleżniki: okręgi, krótsze ku biegunom, równoległe, W–E; równik 0° najdłuższy; bieguny 90° = punkty", "1° południka ≈ 111,2 km"]}, {"title": "Linie i półkule", "items": ["Koła podbiegunowe 66°33'N / 66°33'S", "Zwrotnik Raka 23°27'N · Koziorożca 23°27'S", "Równik → półkule N/S · południk 0° i 180° → E/W", "Polska: półkula N i E"], "images": [{"img": "glob_opisany", "caption": "linie siatki"}]}, {"title": "Współrzędne", "items": ["φ: 0–90° N/S (od równika) · λ: 0–180° E/W (od południka 0°)", "1° = 60' · najpierw φ, potem λ · Warszawa 52°14'N, 21°01'E"]}, {"title": "Rozciągłość – metoda", "items": ["Ta sama półkula → ODEJMIJ · różne → DODAJ", "Długość: suma > 180° → 360° − suma", "Brak minut → pożycz 1° = 60' · ≥60' → +1°", "km (wzdłuż południka) = stopnie × 111,2", "Polska: 54°50'N − 49°00'N = 5°50' (≈649 km) · 24°09'E − 14°07'E = 10°02'"]}, {"title": "Polska – położenie i granice", "items": ["Skrajne: N Jastrzębia Góra 54°50'N · S Opołonek 49°00'N · W Osinów Dolny 14°07'E · E Zosin 24°09'E", "Niemcy–Berlin · Czechy–Praga · Słowacja–Bratysława · Ukraina–Kijów · Białoruś–Mińsk · Litwa–Wilno · Rosja–Moskwa (Obwód Królewiecki)", "Najdłuższa granica: Czechy (796 km) · najkrótsza: Litwa (104 km)", "Naturalne: Bałtyk · Odra i Nysa Łużycka · Sudety · Karpaty (Tatry) · Bug"], "images": [{"img": "mapa_polska", "caption": "Polska i sąsiedzi"}]}, {"title": "Procesy geologiczne", "items": ["Endogeniczne: ruchy górotwórcze, epejrogeniczne, wulkanizm, trzęsienia ziemi", "Egzogeniczne: wietrzenie, erozja, akumulacja – rzeki, lodowiec, wiatr, morze", "Lądolód skandynawski (czwartorzęd) → pojezierza · pasy: pobrzeża, pojezierza, niziny, wyżyny, kotliny, góry"]}, {"title": "Fałdowania", "items": ["Kaledońskie (starszy paleozoik): Góry Skandynawskie · PL: Świętokrzyskie", "Hercyńskie (młodszy paleozoik): Ural, Harz · PL: Sudety, Świętokrzyskie", "Alpejskie (mezozoik–kenozoik): Alpy, Himalaje, Andy · PL: Karpaty", "Sudety odmłodzone w alpejskim · stare góry niskie, młode wysokie"]}, {"title": "Ery", "items": ["Archaik (Ziemia 4,6 mld, pierwsze organizmy) → proterozoik → paleozoik (kaledońskie, hercyńskie; karbon – węgiel; perm – sól) → mezozoik (dinozaury, wymarcie 66 mln) → kenozoik (alpejskie; miocen – sól Wieliczka; czwartorzęd – zlodowacenia, człowiek)"]}, {"title": "Płyty litosfery", "items": ["Główne: euroazjatycka, afrykańska, płn.- i płd.amerykańska, pacyficzna, indoaustralijska, antarktyczna", "Oceaniczna: cienka, ciężka, młoda · kontynentalna: gruba, lekka, stara", "Rozsuwanie → grzbiety, ryfty (Islandia, Rów Wschodnioafrykański)", "Subdukcja → rowy, wulkany, Andy · kolizja → Himalaje · przesuwanie → San Andreas", "Skutki: trzęsienia ziemi, wulkany, tsunami"], "images": [{"img": "plyty_subdukcja", "caption": "subdukcja"}]}]};</script>

<template id="tutor-tpl"><elevenlabs-convai agent-id="agent_3101m4193bfqeyy99nqzjkg5mtfh" variant="expanded" action-text="Porozmawiaj z tutorem" start-call-text="Zacznij rozmowę" end-call-text="Zakończ" dynamic-variables="{&quot;subject&quot;: &quot;Geografia&quot;, &quot;topic&quot;: &quot;Geografia: współrzędne, położenie Polski i budowa geologiczna&quot;, &quot;material&quot;: &quot;ZAKRES PRACY KLASOWEJ (geografia, klasa 7): kierunki świata; cechy południków i równoleżników; szerokość i długość geograficzna; obliczanie rozciągłości; linie na mapie i półkule; sąsiedzi Polski i stolice; granice naturalne; procesy endogeniczne i egzogeniczne; fałdowania; ery geologiczne; płyty litosfery.\n\n## 1. Kierunki świata\nGłówne: północ N, południe S, wschód E, zachód W. Pośrednie: NE północny wschód, SE południowy wschód, SW południowy zachód, NW północny zachód. Róża wiatrów pokazuje 8 kierunków. Na mapie północ zwykle u góry.\nWyznaczanie: kompas – igła magnetyczna wskazuje północ. Słońce w południe w Polsce jest na południu, cień jest najkrótszy i wskazuje północ. Słońce wschodzi na wschodzie, zachodzi na zachodzie (dokładnie E i W w dni równonocy). Gwiazda Polarna (Mała Niedźwiedzica) wskazuje północ – przedłużyć ok. 5 razy tylną ścianę Wielkiego Wozu. Kierunek przeciwny do NE to SW.\n\n## 2. Południki i równoleżniki\nPołudniki: półokręgi, jednakowa długość (ok. 20 000 km), łączą bieguny, kierunek N–S, zbiegają się na biegunach. Południk 0° przechodzi przez Greenwich (Londyn), naprzeciw leży 180°. Południki 0° i 180° dzielą Ziemię na półkulę wschodnią i zachodnią.\nRównoleżniki: okręgi, różna długość – maleje ku biegunom, równoległe do siebie, kierunek W–E. Równik 0° jest najdłuższy (ok. 40 000 km) i dzieli Ziemię na półkulę północną i południową. Bieguny 90°N i 90°S to punkty.\n1° wzdłuż południka ≈ 111,2 km; 1&#x27; ≈ 1,85 km.\n\n## 3. Linie na mapie\nBiegun Północny 90°N, koło podbiegunowe północne 66°33&#x27;N, zwrotnik Raka 23°27&#x27;N, równik 0°, zwrotnik Koziorożca 23°27&#x27;S, koło podbiegunowe południowe 66°33&#x27;S, Biegun Południowy 90°S. Zwrotniki + koła: 23°27&#x27; + 66°33&#x27; = 90°. Polska leży na półkuli północnej i wschodniej.\n\n## 4. Współrzędne geograficzne\nSzerokość φ: odległość kątowa od równika, 0°–90°, N (północna) lub S (południowa). Długość λ: odległość kątowa od południka 0°, 0°–180°, E (wschodnia) lub W (zachodnia). 1° = 60&#x27;, 1&#x27; = 60&#x27;&#x27;. Najpierw szerokość, potem długość, zawsze z literą. Warszawa ok. 52°14&#x27;N, 21°01&#x27;E. Punkt na równiku ma φ = 0°, na południku Greenwich λ = 0°.\nOdczyt z mapy: równoleżnik punktu → φ (nad równikiem N, pod S); południk punktu → λ (na prawo od 0° E, na lewo W).\n\n## 5. Rozciągłość – METODA (najważniejsze obliczenia)\nRozciągłość południkowa = różnica szerokości punktu najdalej na N i najdalej na S. Rozciągłość równoleżnikowa = różnica długości punktu najdalej na W i najdalej na E.\nKrok 1: sprawdź półkule. Ta sama półkula (N i N, S i S, E i E, W i W) → ODEJMIJ. Różne półkule → DODAJ.\nKrok 2 (tylko długość): jeśli suma &gt; 180°, wynik = 360° − suma.\nKrok 3 (minuty): 1° = 60&#x27;. Przy odejmowaniu brakuje minut → pożycz 1° (52°15&#x27; = 51°75&#x27;). Po dodaniu minut 60&#x27; lub więcej → zamień 60&#x27; na 1° (35°75&#x27; = 36°15&#x27;).\nKrok 4: odległość w km wzdłuż południka = liczba stopni × 111,2 km (minuty na ułamek: 30&#x27; = 0,5°, 15&#x27; = 0,25°, 50&#x27; ≈ 0,83°).\nPrzykłady:\n- Polska N–S: 54°50&#x27;N − 49°00&#x27;N = 5°50&#x27; (≈ 5,83° × 111,2 ≈ 649 km).\n- Polska W–E: 24°09&#x27;E − 14°07&#x27;E = 10°02&#x27;.\n- 37°20&#x27;N i 34°50&#x27;S: 37°20&#x27; + 34°50&#x27; = 71°70&#x27; = 72°10&#x27;.\n- 17°30&#x27;W i 51°25&#x27;E: 68°55&#x27;.\n- 150°E i 160°W: 310° &gt; 180° → 360° − 310° = 50°.\n- 120°30&#x27;E i 100°45&#x27;W: 221°15&#x27; → 360° − 221°15&#x27; = 138°45&#x27;.\n- 52°15&#x27;N − 48°40&#x27;N: 51°75&#x27; − 48°40&#x27; = 3°35&#x27;.\n- 30°15&#x27;E − 12°50&#x27;E: 29°75&#x27; − 12°50&#x27; = 17°25&#x27;.\n- 66°33&#x27;N − 23°27&#x27;N = 43°06&#x27;; 23°27&#x27;N i 23°27&#x27;S = 46°54&#x27;.\n- 3° wzdłuż południka = 333,6 km; 2°30&#x27; = 278 km.\n\n## 6. Polska – położenie, sąsiedzi, granice\nEuropa Środkowa, ok. 312,7 tys. km². Skrajne punkty: N Jastrzębia Góra 54°50&#x27;N; S Opołonek (Bieszczady) 49°00&#x27;N; W zakole Odry k. Osinowa Dolnego 14°07&#x27;E; E zakole Bugu k. Zosina 24°09&#x27;E.\nSąsiedzi i stolice: Niemcy – Berlin, Czechy – Praga, Słowacja – Bratysława, Ukraina – Kijów, Białoruś – Mińsk, Litwa – Wilno, Rosja (graniczy Obwód Królewiecki) – Moskwa.\nGranice lądowe (ok., GUS): Czechy 796 km (najdłuższa), Słowacja 541, Ukraina 535, Niemcy 467, Białoruś 418, Rosja 210, Litwa 104 (najkrótsza). Razem ok. 3071 km; granica morska ok. 440 km.\nGranice naturalne: Morze Bałtyckie (N), Odra i Nysa Łużycka (z Niemcami), Sudety (z Czechami), Karpaty – Tatry, Pieniny, Beskidy, Bieszczady (ze Słowacją), Bug (z Ukrainą i Białorusią). Granice z Litwą i Rosją – sztuczne.\n\n## 7. Procesy kształtujące rzeźbę\nEndogeniczne (wewnętrzne, energia wnętrza Ziemi, tworzą nierówności): ruchy górotwórcze (fałdowanie), ruchy epejrogeniczne (powolne wznoszenie/obniżanie dużych obszarów, np. Skandynawia się podnosi), wulkanizm, trzęsienia ziemi.\nEgzogeniczne (zewnętrzne, energia Słońca i grawitacja, wyrównują): wietrzenie, erozja (niszczenie), transport, akumulacja (osadzanie). Czynniki: rzeki (doliny, delty), lodowce/lądolód (moreny, jeziora rynnowe, sandry, głazy narzutowe), wiatr (wydmy – Słowiński PN), morze (klify, mierzeje).\nPolska: lądolód skandynawski w czwartorzędzie (kilka zlodowaceń); ostatnie ukształtowało pas pojezierzy. Pasy rzeźby od N: pobrzeża, pojezierza, niziny, wyżyny, kotliny podgórskie, góry. Ok. 3/4 kraju poniżej 200 m n.p.m. Najwyższy szczyt: Rysy 2499 m (Tatry).\n\n## 8. Fałdowania\nKaledońskie – starszy paleozoik: Góry Skandynawskie, Grampiany; w Polsce Góry Świętokrzyskie.\nHercyńskie (waryscyjskie) – młodszy paleozoik: Ural, Harz, Masyw Centralny; w Polsce Sudety i Góry Świętokrzyskie.\nAlpejskie – mezozoik i kenozoik (trwa): Alpy, Himalaje, Andy, Pireneje, Kaukaz; w Polsce Karpaty (Tatry).\nSudety i Świętokrzyskie odmłodzone (ponownie wypiętrzone) w alpejskim. Góry stare: niskie, łagodne (Łysica 614 m, Śnieżka 1603 m). Góry młode: wysokie, ostre (Rysy 2499 m, Mount Everest 8849 m).\n\n## 9. Ery geologiczne (od najstarszej)\nArchaik (4,6–2,5 mld lat): powstanie Ziemi ok. 4,6 mld lat temu, pierwsze organizmy (bakterie, sinice ok. 3,5 mld). Proterozoik (2,5 mld – 541 mln): tlen w atmosferze, pierwsze wielokomórkowce. Archaik + proterozoik = prekambr.\nPaleozoik (541–252 mln; kambr, ordowik, sylur, dewon, karbon, perm): ryby, rośliny i zwierzęta lądowe, płazy, gady; fałdowania kaledońskie i hercyńskie; karbon – węgiel kamienny (Śląsk, Lubelszczyzna); perm – sól kamienna (Kłodawa), miedź.\nMezozoik (252–66 mln; trias, jura, kreda): dinozaury, pierwsze ssaki i ptaki, rozpad Pangei, początek fałdowania alpejskiego; wymarcie dinozaurów ok. 66 mln lat temu.\nKenozoik (66 mln – dziś; paleogen, neogen, czwartorzęd): fałdowanie alpejskie (Karpaty), ssaki; miocen – sól w Wieliczce i Bochni, siarka, węgiel brunatny; czwartorzęd (od 2,6 mln) – zlodowacenia i człowiek.\n\n## 10. Płyty litosfery\nLitosfera = skorupa + górna część płaszcza, podzielona na płyty, które przesuwają się o kilka cm rocznie. Główne: euroazjatycka, afrykańska, północnoamerykańska, południowoamerykańska, pacyficzna (największa), indoaustralijska, antarktyczna; mniejsze: nazca, kokosowa, karaibska, filipińska, arabska. Polska – środek płyty euroazjatyckiej (brak wulkanów, słabe trzęsienia).\nSkorupa oceaniczna: cienka 5–10 km, cięższa (bazalt), młoda. Kontynentalna: gruba 30–70 km, lżejsza (granit), stara.\nRozsuwanie: magma tworzy nowe dno – grzbiety śródoceaniczne (Grzbiet Śródatlantycki, Islandia), ryfty (Rów Wschodnioafrykański).\nZderzanie: subdukcja – cięższa płyta oceaniczna pod kontynentalną → rów oceaniczny, wulkany, góry (Andy: płyta nazca pod południowoamerykańską). Oceaniczna z oceaniczną → rów (Rów Mariański ok. 11 km) i łuk wysp. Kontynentalna z kontynentalną → góry fałdowe (Himalaje: płyta indoaustralijska i euroazjatycka).\nPrzesuwanie wzdłuż uskoku: San Andreas (płyta pacyficzna i północnoamerykańska) – trzęsienia ziemi.\nSkutki: trzęsienia ziemi, wulkany, tsunami, góry, rowy. Pacyficzny Pierścień Ognia.\n\n## Typowe błędy\nBrak litery N/S/E/W przy współrzędnych. Dodawanie zamiast odejmowania na tej samej półkuli. Zapominanie o 360° − suma. Minuty liczone jak dziesiętne (60&#x27; = 1°). Mylenie zwrotnika Raka (N) i Koziorożca (S). Mylenie cech południków i równoleżników.&quot;}"></elevenlabs-convai></template>
