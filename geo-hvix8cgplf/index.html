żca 23°27′S** (półkula południowa)."}, {"front": "Koła podbiegunowe – szerokości", "back": "Północne **66°33′N**, południowe **66°33′S**. Zwrotnik + koło = 23°27′ + 66°33′ = 90°."}, {"front": "Najdalej na północ wysunięty punkt Polski", "back": "**Jastrzębia Góra** (54°50′N). Południe: Opołonek, zachód: zakole Odry k. Osinowa Dolnego, wschód: zakole Bugu k. Zosina."}, {"front": "Co dzieli Ziemię na półkulę wschodnią i zachodnią?", "back": "**Południk 0° i południk 180°**. (Równik dzieli na północną i południową!)"}], "quick": [{"id": "ws_q1", "type": "match", "tag": "l8", "q": "Przyporządkuj góry do fałdowań.", "pairs": [["Góry Skandynawskie", "kaledońskie"], ["Ural", "hercyńskie"], ["Karpaty", "alpejskie"]], "explain": "Kaledońskie – Góry Skandynawskie; hercyńskie – Ural, Sudety; alpejskie – Karpaty, Alpy, Himalaje, Andy."}, {"id": "ws_q2", "type": "mc", "tag": "l8", "q": "Do jakiego fałdowania należą **Sudety**?", "options": ["hercyńskiego", "alpejskiego", "kaledońskiego"], "answer": 0, "explain": "Sudety – fałdowanie **hercyńskie** (młodszy paleozoik), później odmłodzone w alpejskim."}, {"id": "ws_q3", "type": "mc", "tag": "l8", "q": "Które góry powstały w fałdowaniu **alpejskim**?", "options": ["Sudety", "Andy", "Ural", "Góry Skandynawskie"], "answer": 1, "explain": "**Andy** – alpejskie. Ural i Sudety – hercyńskie, Góry Skandynawskie – kaledońskie."}, {"id": "ws_q4", "type": "mc", "tag": "l9", "q": "W której erze powstały **Karpaty**?", "options": ["w proterozoiku", "w mezozoiku", "w kenozoiku", "w paleozoiku"], "answer": 2, "explain": "Karpaty to góry **alpejskie** – wypiętrzyły się w **kenozoiku** (tej samej erze, w której żyjemy)."}, {"id": "ws_q5", "type": "order", "tag": "l9", "q": "Ułóż od najstarszego do najmłodszego.", "items": ["powstanie Ziemi", "powstanie węgla kamiennego", "panowanie dinozaurów", "zlodowacenia w Polsce"], "explain": "Ziemia (archaik) → węgiel kamienny (**karbon**, paleozoik) → dinozaury (mezozoik) → zlodowacenia (czwartorzęd, kenozoik). Węgiel jest **starszy** od dinozaurów!"}, {"id": "ws_q6", "type": "order", "tag": "l9", "q": "Ułóż ery od najstarszej.", "items": ["archaik", "proterozoik", "paleozoik", "mezozoik", "kenozoik"], "explain": "Archaik → proterozoik → paleozoik → mezozoik → kenozoik."}, {"id": "ws_q7", "type": "mc", "tag": "l1", "q": "W którą stronę wskazuje w Polsce cień patyka w południe?", "options": ["na zachód", "na północ", "na południe", "na wschód"], "answer": 1, "explain": "Słońce w południe jest w Polsce na **południu**, więc cień pada na **północ**."}, {"id": "ws_q8", "type": "match", "tag": "l3", "q": "Podpisz linie – podaj ich szerokość.", "pairs": [["zwrotnik Raka", "23°27′N"], ["zwrotnik Koziorożca", "23°27′S"], ["koło podbiegunowe północne", "66°33′N"], ["koło podbiegunowe południowe", "66°33′S"]], "explain": "Zwrotniki: 23°27′ (Raka – N, Koziorożca – S). Koła podbiegunowe: 66°33′ (północne N, południowe S)."}, {"id": "ws_q9", "type": "mc", "tag": "l6", "q": "Który punkt jest **najdalej na północ** wysuniętym punktem Polski?", "options": ["zakole Bugu koło Zosina", "zakole Odry koło Osinowa Dolnego", "Jastrzębia Góra", "Opołonek"], "answer": 2, "explain": "Północ – **Jastrzębia Góra**; zachód – zakole Odry (Osinów Dolny); południe – Opołonek; wschód – zakole Bugu (Zosin)."}, {"id": "ws_q10", "type": "mc", "tag": "l3", "q": "Które linie dzielą Ziemię na półkulę **wschodnią i zachodnią**?", "options": ["południk 0° i południk 180°", "koła podbiegunowe", "równik", "zwrotniki"], "answer": 0, "explain": "E/W dzielą **południki 0° i 180°**. Równik dzieli Ziemię na półkulę północną i południową."}], "mock": "slabe-punkty-geo", "voice": [{"id": "wv1", "topic": "weak", "q": "Do jakiego fałdowania należą Góry Skandynawskie?", "a": "kaledońskie", "alt": "kaledońskiego", "x": "Góry Skandynawskie to fałdowanie kaledońskie, starszy paleozoik."}, {"id": "wv2", "topic": "weak", "q": "Do jakiego fałdowania należy Ural?", "a": "hercyńskie", "alt": "hercyńskiego, waryscyjskie", "x": "Ural i Sudety to fałdowanie hercyńskie."}, {"id": "wv3", "topic": "weak", "q": "W której erze powstały Karpaty?", "a": "w kenozoiku", "alt": "kenozoik", "x": "Karpaty to góry alpejskie, wypiętrzone w kenozoiku."}, {"id": "wv4", "topic": "weak", "q": "Co powstało wcześniej: węgiel kamienny czy dinozaury?", "a": "węgiel kamienny", "alt": "węgiel, najpierw węgiel", "x": "Węgiel kamienny powstał w karbonie, przed mezozoikiem i dinozaurami."}, {"id": "wv5", "topic": "weak", "q": "W którą stronę wskazuje cień w Polsce w południe?", "a": "na północ", "alt": "północ", "x": "Słońce w południe jest na południu, więc cień pada na północ."}, {"id": "wv6", "topic": "weak", "q": "Jaka jest szerokość geograficzna zwrotnika Koziorożca?", "a": "23 stopnie 27 minut szerokości południowej", "alt": "23°27'S, dwadzieścia trzy stopnie dwadzieścia siedem minut południowej", "x": "Zwrotnik Koziorożca leży na półkuli południowej."}, {"id": "wv7", "topic": "weak", "q": "Który punkt jest najdalej na północ wysuniętym punktem Polski?", "a": "Jastrzębia Góra", "alt": "", "x": "Jastrzębia Góra, 54 stopnie 50 minut szerokości północnej."}, {"id": "wv8", "topic": "weak", "q": "Które linie dzielą Ziemię na półkulę wschodnią i zachodnią?", "a": "południk zero i południk sto osiemdziesiąt", "alt": "0° i 180°, Greenwich i 180", "x": "Równik dzieli Ziemię na północną i południową, a południki 0 i 180 na wschodnią i zachodnią."}, {"id": "wv9", "topic": "weak", "q": "Ile minut ma jeden stopień?", "a": "60 minut", "alt": "sześćdziesiąt", "x": "Jeden stopień to sześćdziesiąt minut, dlatego nie zapisujemy minut po przecinku."}, {"id": "wv10", "topic": "weak", "q": "Ile to jest 40 minut plus 35 minut, w stopniach i minutach?", "a": "1 stopień 15 minut", "alt": "75 minut, stopień i piętnaście minut", "x": "75 minut to 60 minut, czyli 1 stopień, i jeszcze 15 minut."}, {"id": "wv11", "topic": "weak", "q": "Punkty leżą na 150 stopniach długości wschodniej i 160 stopniach długości zachodniej. Jaka jest rozciągłość równoleżnikowa?", "a": "50 stopni", "alt": "pięćdziesiąt", "x": "Różne półkule, więc dodajemy: 310. Więcej niż 180, więc 360 minus 310 to 50 stopni."}, {"id": "wv12", "topic": "weak", "q": "Jak nazywa się proces, gdy płyta oceaniczna wsuwa się pod kontynentalną?", "a": "subdukcja", "alt": "", "x": "Subdukcja – tak powstały Andy, gdy płyta nazca wsuwa się pod południowoamerykańską."}, {"id": "wv13", "topic": "weak", "q": "Co powstaje, gdy płyty rozsuwają się na dnie oceanu?", "a": "grzbiet śródoceaniczny", "alt": "grzbiet, nowe dno oceanu", "x": "Magma tworzy nowe dno i grzbiet śródoceaniczny, na przykład Grzbiet Śródatlantycki."}, {"id": "wv14", "topic": "weak", "q": "Jakie płyty zderzyły się, tworząc Himalaje?", "a": "indyjska (indoaustralijska) i euroazjatycka", "alt": "indoaustralijska i euroazjatycka", "x": "Dwie płyty kontynentalne zderzyły się i skały się sfałdowały."}]}, "steps": [{"id": "kierunki", "title": "Kierunki świata i ich wyznaczanie", "tags": ["l1"], "levels": [{"n": 1, "title": "Gdzie jest północ?", "tags": ["l1"], "body": ["Są **4 kierunki główne**: północ (N), południe (S), wschód (E), zachód (W), a pomiędzy nimi 4 pośrednie: NE, SE, SW, NW. Razem rysuje się je jako **różę wiatrów**.", "Na mapie północ jest prawie zawsze **u góry**, wschód po prawej, zachód po lewej."], "checks": [{"ref": "d1"}, {"ref": "q1"}], "images": [{"img": "roza", "caption": "róża wiatrów"}]}, {"n": 2, "title": "Róża wiatrów z cyframi", "tags": ["l1"], "body": ["Na sprawdzianie róża ma cyfry zamiast liter. Zacznij od północy (u góry) i idź **zgodnie z ruchem wskazówek zegara**: N, NE, E, SE, S, SW, W, NW."], "checks": [{"ref": "q2"}, {"ref": "q3"}, {"ref": "q4"}], "images": [{"img": "roza_cyfry", "caption": "róża z cyframi"}]}, {"n": 3, "title": "Słońce, cień, kompas i Gwiazda Polarna", "tags": ["l1"], "body": ["W Polsce Słońce w południe (najwyżej na niebie) jest **na południu**, więc cień jest najkrótszy i wskazuje **północ**. Słońce wschodzi po stronie wschodniej, zachodzi po zachodniej.", "Igła **kompasu** wskazuje północ, a w nocy kierunek północny wskazuje **Gwiazda Polarna**."], "checks": [{"ref": "q5"}, {"ref": "q6"}], "lessons": ["l1"], "images": [{"img": "slonce_poludnie", "caption": "Słońce w południe"}, {"img": "gwiazda_polarna", "caption": "Gwiazda Polarna"}]}, {"n": 4, "title": "Zwroty i kierunki przeciwne", "tags": ["l1"], "body": ["Kierunek przeciwny leży po drugiej stronie róży: N↔S, E↔W, NE↔SW, NW↔SE. „W tył zwrot” zawsze daje kierunek przeciwny."], "checks": [{"ref": "q7"}, {"ref": "q8"}]}, {"n": 5, "title": "Na sprawdzian i wyżej: kierunki w praktyce", "tags": ["l1"], "body": ["Ekspert wyznacza kierunki w terenie (Słońce, cień, kompas, gwiazdy) i na mapie, także gdy pytanie jest „odwrócone” (np. dokąd pada cień wieczorem)."], "checks": [{"q": {"id": "gk1", "type": "mc", "tag": "l1", "q": "Wieczorem Słońce zachodzi. W którą stronę pada wtedy twój cień?", "options": ["na zachód", "na wschód", "na północ", "na południe"], "answer": 1, "explain": "Słońce zachodzi po stronie **zachodniej**, a cień pada w stronę przeciwną – na **wschód**."}}, {"q": {"id": "gk2", "type": "mc", "tag": "l1", "q": "Kraków leży na południe od Warszawy. W jakim kierunku jedziesz z Krakowa do Warszawy?", "options": ["na południe", "na zachód", "na północ", "na wschód"], "answer": 2, "explain": "Jeśli Kraków jest na południe od Warszawy, to Warszawa jest na **północ** od Krakowa."}}]}]}, {"id": "siatka", "title": "Cechy południków i równoleżników", "tags": ["l2"], "levels": [{"n": 1, "title": "Siatka na globusie", "tags": ["l2"], "body": ["Na globusie narysowano umowną **siatkę geograficzną**: **południki** biegną od bieguna do bieguna, **równoleżniki** to okręgi dookoła Ziemi. Najdłuższy równoleżnik to **równik**."], "checks": [{"ref": "d2"}, {"ref": "q11"}], "images": [{"img": "poludniki", "caption": "południki"}, {"img": "rownolezniki", "caption": "równoleżniki"}]}, {"n": 2, "title": "Południk 0° i bieguny", "tags": ["l2"], "body": ["Południk **0°** przechodzi przez obserwatorium w **Greenwich** pod Londynem; po drugiej stronie Ziemi jest południk **180°**. W **biegunach** (90°N i 90°S) zbiegają się wszystkie południki."], "checks": [{"ref": "q10"}, {"ref": "q12"}]}, {"n": 3, "title": "Cechy w tabeli", "tags": ["l2"], "body": ["**Południki:** półokręgi, jednakowa długość (ok. 20 000 km), łączą bieguny, kierunek N–S, zbiegają się na biegunach. **Równoleżniki:** okręgi, różna długość (równik ok. 40 000 km, krótsze ku biegunom), równoległe do siebie, kierunek W–E."], "checks": [{"ref": "q9"}, {"ref": "q14"}], "lessons": ["l2"]}, {"n": 4, "title": "Kilometry na siatce", "tags": ["l2"], "body": ["Wzdłuż południka **1° ≈ 111 km** – bo wszystkie południki mają tę samą długość. Na równoleżnikach 1° długości ma różną liczbę km (najwięcej na równiku)."], "checks": [{"ref": "q13"}, {"q": {"id": "gs1", "type": "tf", "tag": "l2", "q": "Cechy południków i równoleżników. Prawda czy fałsz?", "items": [{"s": "Wszystkie południki mają jednakową długość.", "a": true}, {"s": "Równoleżniki zbiegają się na biegunach.", "a": false}, {"s": "Równoleżniki wyznaczają kierunek wschód–zachód.", "a": true}, {"s": "Południk to cały okrąg dookoła Ziemi.", "a": false}], "explain": "Południki: półokręgi tej samej długości, zbiegają się na biegunach, kierunek N–S. Równoleżniki: okręgi, równoległe, kierunek W–E."}}]}, {"n": 5, "title": "Na sprawdzian i wyżej: porównaj", "tags": ["l2"], "body": ["Ekspert porównuje południki i równoleżniki w co najmniej 3 cechach (kształt, długość, kierunek, czy się zbiegają) i podaje długości: południk ok. 20 000 km, równik ok. 40 000 km."], "checks": [{"ref": "e1"}, {"q": {"id": "gs2", "type": "mc", "tag": "l2", "q": "Jaka jest w przybliżeniu długość równika?", "options": ["ok. 20 000 km", "ok. 40 000 km", "ok. 111 km", "ok. 6 400 km"], "answer": 1, "explain": "Równik – najdłuższy równoleżnik – ma ok. **40 000 km**; każdy południk (półokrąg) ma ok. 20 000 km."}}]}]}, {"id": "wspolrzedne", "title": "Szerokość i długość geograficzna", "tags": ["l4"], "levels": [{"n": 1, "title": "Adres punktu na Ziemi", "tags": ["l4"], "body": ["Współrzędne to **adres punktu na Ziemi**. **Szerokość (φ)** – jak daleko na północ (N) lub południe (S) od równika, od 0° do 90°. **Długość (λ)** – jak daleko na wschód (E) lub zachód (W) od południka 0°, od 0° do 180°."], "checks": [{"ref": "d4"}, {"ref": "q24"}], "images": [{"img": "siatka_punkty", "caption": "punkty na siatce"}]}, {"n": 2, "title": "Odczytaj z rysunku", "tags": ["l4"], "body": ["Najpierw równoleżnik punktu (szerokość, litera N/S), potem południk (długość, litera E/W). Zawsze **najpierw szerokość, potem długość**."], "checks": [{"ref": "q22"}, {"ref": "q23"}]}, {"n": 3, "title": "Pojęcia i współrzędne Polski", "tags": ["l4"], "body": ["1° = 60'. Warszawa: **52°14'N, 21°01'E**. Cała Polska ma szerokość ok. 49°–55°N i długość ok. 14°–24°E."], "checks": [{"ref": "q28"}, {"ref": "q30"}], "lessons": ["l4"]}, {"n": 4, "title": "Wpisz współrzędną z literą", "tags": ["l4"], "body": ["W zadaniach otwartych wpisz liczbę stopni **i literę kierunku** (np. 120°W, 60°S). Bez litery odpowiedź jest niepełna."], "checks": [{"ref": "q25"}, {"ref": "q26"}]}, {"n": 5, "title": "Na sprawdzian i wyżej: półkule i pułapki", "tags": ["l4"], "body": ["Półkulę N/S poznasz po literze szerokości, półkulę E/W – po literze długości. Pułapki: 0° nie ma litery, 180° to jednocześnie E i W, szerokość nie przekracza 90°."], "checks": [{"ref": "q27"}, {"ref": "q29"}]}]}, {"id": "rozciaglosc", "title": "Rozciągłość południkowa i równoleżnikowa", "tags": ["l5"], "levels": [{"n": 1, "title": "Jak „szeroki” jest kraj?", "tags": ["l5"], "body": ["Rozciągłość to **różnica współrzędnych** skrajnych punktów. Południkowa: różnica szerokości (N–S). Równoleżnikowa: różnica długości (W–E). Rozgrzewka z minutami: **1° = 60'**, więc 75' = 1°15'."], "checks": [{"ref": "q54"}, {"ref": "q46"}]}, {"n": 2, "title": "Ta sama półkula – odejmujemy", "tags": ["l5"], "body": ["Oba punkty na tej samej półkuli → **odejmujemy**. Polska: 54°50'N − 49°00'N = **5°50'**. Brakuje minut? Pożycz 1° = 60'."], "checks": [{"ref": "d5"}, {"ref": "q47"}, {"ref": "q35"}]}, {"n": 3, "title": "Różne półkule – dodajemy", "tags": ["l5"], "body": ["Punkty po różnych stronach równika (N i S) albo południka 0° (E i W) → **dodajemy**. Po dodaniu 60' lub więcej – zamień 60' na 1°."], "checks": [{"ref": "q52"}, {"ref": "q36"}, {"ref": "q40"}], "lessons": ["l5"]}, {"n": 4, "title": "Ponad 180° i kilometry", "tags": ["l5"], "body": ["Suma długości **ponad 180°** → liczymy krótszą drogę: **360° − suma**. Na tym samym południku 1° ≈ 111 km."], "checks": [{"ref": "q41"}, {"ref": "q49"}, {"ref": "q53"}]}, {"n": 5, "title": "Na sprawdzian i wyżej: obliczenie krok po kroku", "tags": ["l5"], "body": ["1) półkule, 2) odejmij lub dodaj, 3) popraw minuty, 4) przy długości sprawdź 180°, 5) wynik w stopniach i minutach. Polska równoleżnikowo: 24°09'E − 14°07'E = **10°02'**."], "checks": [{"ref": "q42"}, {"ref": "q48"}, {"ref": "e2"}]}]}, {"id": "linie", "title": "Linie na mapie: bieguny, koła podbiegunowe, zwrotniki, równik, południki", "tags": ["l3"], "levels": [{"n": 1, "title": "Najważniejsze linie", "tags": ["l3"], "body": ["Na globusie są wyróżnione linie: **równik (0°)** dzieli Ziemię na półkulę północną i południową, a **południk 0° i 180°** – na wschodnią i zachodnią. Polska leży na półkuli **północnej i wschodniej**."], "checks": [{"ref": "d3"}, {"ref": "q20"}], "images": [{"img": "glob_opisany", "caption": "linie na globusie"}]}, {"n": 2, "title": "Zwrotniki i koła podbiegunowe", "tags": ["l3"], "body": ["**Zwrotnik Raka 23°27'N**, **zwrotnik Koziorożca 23°27'S** – między nimi Słońce może górować w zenicie. **Koła podbiegunowe 66°33'N i S** – za nimi dzień i noc polarna."], "checks": [{"ref": "q16"}, {"ref": "q17"}], "images": [{"img": "glob_litery", "caption": "globus z literami"}]}, {"n": 3, "title": "Kolejność i szerokości", "tags": ["l3"], "body": ["Od północy: Biegun Północny (90°N) → koło podbiegunowe północne (66°33'N) → zwrotnik Raka (23°27'N) → równik (0°) → zwrotnik Koziorożca (23°27'S) → koło podbiegunowe południowe (66°33'S) → Biegun Południowy (90°S)."], "checks": [{"ref": "q18"}, {"ref": "q19"}], "lessons": ["l3"]}, {"n": 4, "title": "Litery na rysunku i półkule", "tags": ["l3"], "body": ["Przyporządkuj litery z rysunku do linii, licząc od góry. Półkule E i W dzielą **południki 0° i 180°**, nie równik."], "checks": [{"ref": "q15"}, {"ref": "q21"}], "images": [{"img": "siatka_polkule", "caption": "półkule"}]}, {"n": 5, "title": "Na sprawdzian i wyżej: odległości między liniami", "tags": ["l3", "l5"], "body": ["Ekspert liczy różnicę szerokości między liniami (np. koło podbiegunowe − zwrotnik Raka = 66°33' − 23°27' = 43°06') i wie, co dzieje się w każdej strefie."], "checks": [{"ref": "q37"}, {"ref": "q38"}, {"q": {"id": "gl1", "type": "mc", "tag": "l3", "q": "Gdzie może wystąpić noc polarna?", "options": ["między zwrotnikami", "na równiku", "za kołem podbiegunowym", "na zwrotniku Raka"], "answer": 2, "explain": "Dzień i noc polarna występują **za kołami podbiegunowymi** (od 66°33' do biegunów)."}}]}]}, {"id": "sasiedzi", "title": "Położenie Polski, sąsiedzi i stolice", "tags": ["l6"], "levels": [{"n": 1, "title": "Polska na mapie Europy", "tags": ["l6"], "body": ["Polska leży w **Europie Środkowej**, nad **Morzem Bałtyckim**. Ma **7 sąsiadów**: Niemcy, Czechy, Słowację, Ukrainę, Białoruś, Litwę i Rosję (Obwód Królewiecki)."], "checks": [{"ref": "d6"}, {"ref": "q57"}], "images": [{"img": "mapa_polska", "caption": "Polska i sąsiedzi"}]}, {"n": 2, "title": "Sąsiedzi i ich stolice", "tags": ["l6"], "body": ["Niemcy – Berlin, Czechy – Praga, Słowacja – Bratysława, Ukraina – Kijów, Białoruś – Mińsk, Litwa – Wilno, Rosja – Moskwa (z Polską graniczy jej **Obwód Królewiecki**)."], "checks": [{"ref": "q55"}, {"ref": "q63"}]}, {"n": 3, "title": "Mapa z cyframi i strony świata", "tags": ["l6"], "body": ["Z zachodu i południa: Niemcy, Czechy, Słowacja. Ze wschodu i północy: Ukraina, Białoruś, Litwa, Rosja."], "checks": [{"ref": "q56"}, {"ref": "q64"}], "lessons": ["l6"], "images": [{"img": "mapa_numery", "caption": "mapa z cyframi"}]}, {"n": 4, "title": "Długość granic", "tags": ["l6"], "body": ["Od najdłuższej: Czechy 796 · Słowacja 541 · Ukraina 535 · Niemcy 467 · Białoruś 418 · Rosja 210 · Litwa 104 km (najkrótsza)."], "checks": [{"ref": "q58"}, {"ref": "q59"}, {"ref": "q60"}]}, {"n": 5, "title": "Na sprawdzian i wyżej: skrajne punkty", "tags": ["l6"], "body": ["Skrajne punkty: N **Jastrzębia Góra 54°50'N**, S **Opołonek 49°00'N**, W zakole Odry k. Osinowa Dolnego 14°07'E, E zakole Bugu k. Zosina 24°09'E."], "checks": [{"ref": "q31"}, {"ref": "q32"}]}]}, {"id": "granice", "title": "Naturalne granice Polski", "tags": ["l6"], "levels": [{"n": 1, "title": "Morze, rzeki i góry", "tags": ["l6"], "body": ["Granica naturalna biegnie wzdłuż czegoś, co widać w przyrodzie: **morza, rzeki albo gór**. Na północy granicą Polski jest **Morze Bałtyckie**."], "checks": [{"q": {"id": "gg1", "type": "mc", "tag": "l6", "q": "Co tworzy północną granicę Polski?", "options": ["rzeka Bug", "Morze Bałtyckie", "Sudety", "Odra"], "answer": 1, "explain": "Na północy Polska graniczy przez **Morze Bałtyckie** (granica morska ok. 440 km)."}}, {"q": {"id": "gg2", "type": "mc", "tag": "l6", "q": "Które rzeki wyznaczają granicę Polski z Niemcami?", "options": ["Wisła i Bug", "Odra i Nysa Łużycka", "Warta i Noteć", "San i Dunajec"], "answer": 1, "explain": "Na zachodzie granica z Niemcami biegnie rzekami **Odrą** i **Nysą Łużycką**."}}]}, {"n": 2, "title": "Granica w górach", "tags": ["l6"], "body": ["Z **Czechami** – góry **Sudety**. Ze **Słowacją** – **Karpaty** (m.in. Tatry, Pieniny, Beskidy, Bieszczady)."], "checks": [{"ref": "q61"}, {"q": {"id": "gg3", "type": "mc", "tag": "l6", "q": "Jakie góry tworzą granicę Polski z Czechami?", "options": ["Karpaty", "Sudety", "Góry Świętokrzyskie", "Alpy"], "answer": 1, "explain": "Na południowym zachodzie granica z Czechami biegnie przez **Sudety**."}}]}, {"n": 3, "title": "Rzeka na wschodzie i granice sztuczne", "tags": ["l6"], "body": ["Na wschodzie granicę z **Ukrainą i Białorusią** w dużej części wyznacza rzeka **Bug**. Granica z Litwą i Rosją nie biegnie wzdłuż wyraźnych obiektów przyrodniczych – to granice **sztuczne** (wyznaczone umownie)."], "checks": [{"ref": "q62"}, {"q": {"id": "gg4", "type": "mc", "tag": "l6", "q": "Która rzeka wyznacza dużą część wschodniej granicy Polski?", "options": ["Odra", "Wisła", "Bug", "Nysa Łużycka"], "answer": 2, "explain": "Granica z Ukrainą i Białorusią w dużej części biegnie rzeką **Bug**."}}], "lessons": ["l6"]}, {"n": 4, "title": "Skrajne punkty na granicach", "tags": ["l6"], "body": ["Najdalej na zachód Polska sięga na zakolu **Odry** (14°07'E), najdalej na wschód – na zakolu **Bugu** (24°09'E): skrajne punkty leżą na granicach naturalnych."], "checks": [{"ref": "q33"}, {"ref": "q34"}]}, {"n": 5, "title": "Na sprawdzian i wyżej: opisz granice", "tags": ["l6"], "body": ["Ekspert opisuje granice w kolejności dookoła Polski: Bałtyk (N) → Odra i Nysa Łużycka (W) → Sudety (SW) → Karpaty (S) → Bug (E), i wskazuje granice sztuczne (Litwa, Rosja)."], "checks": [{"ref": "e3"}, {"q": {"id": "gg5", "type": "tf", "tag": "l6", "q": "Naturalne granice Polski. Prawda czy fałsz?", "items": [{"s": "Granica ze Słowacją biegnie przez Karpaty.", "a": true}, {"s": "Granica z Litwą biegnie rzeką Bug.", "a": false}, {"s": "Nysa Łużycka jest częścią granicy z Niemcami.", "a": true}, {"s": "Granica z Obwodem Królewieckim to granica sztuczna.", "a": true}], "explain": "Karpaty – ze Słowacją; Odra i Nysa Łużycka – z Niemcami; Bug – z Ukrainą i Białorusią; granice z Litwą i Rosją są sztuczne."}}]}]}, {"id": "czynniki", "title": "Czynniki geologiczne a rzeźba terenu", "tags": ["l7"], "levels": [{"n": 1, "title": "Siły z wnętrza i z zewnątrz", "tags": ["l7"], "body": ["Rzeźbę Ziemi kształtują **siły z wnętrza Ziemi** (endogeniczne: ruchy górotwórcze, wulkany, trzęsienia ziemi – tworzą nierówności) i **siły z zewnątrz** (egzogeniczne: woda, lód, wiatr, wietrzenie – zwykle je wyrównują)."], "checks": [{"ref": "q68"}, {"q": {"id": "gc1", "type": "mc", "tag": "l7", "q": "Który proces jest **egzogeniczny** (zewnętrzny)?", "options": ["wulkanizm", "trzęsienie ziemi", "erozja rzeczna", "fałdowanie"], "answer": 2, "explain": "Erozja rzeczna działa dzięki energii Słońca i sile ciężkości – to proces **zewnętrzny**. Pozostałe są wewnętrzne (endogeniczne)."}}]}, {"n": 2, "title": "Endogeniczne czy egzogeniczne?", "tags": ["l7"], "body": ["Endogeniczne: ruchy górotwórcze, **ruchy epejrogeniczne** (powolne wznoszenie lub obniżanie dużych obszarów, np. Skandynawia), wulkanizm, trzęsienia ziemi. Egzogeniczne: wietrzenie, erozja, transport, akumulacja."], "checks": [{"ref": "q65"}, {"ref": "q66"}]}, {"n": 3, "title": "Formy terenu i pasy rzeźby Polski", "tags": ["l7"], "body": ["Rzeki tworzą doliny i delty, lądolód – moreny, jeziora rynnowe, sandry i głazy narzutowe, wiatr – wydmy. Pasy rzeźby Polski od północy: pobrzeża, pojezierza, niziny, wyżyny, kotliny podgórskie, góry."], "checks": [{"ref": "q67"}, {"ref": "q69"}], "lessons": ["l7"]}, {"n": 4, "title": "Lądolód skandynawski", "tags": ["l7"], "body": ["W czwartorzędzie **lądolód skandynawski** przykrył dużą część Polski. Zostawił pojezierza, moreny, jeziora rynnowe i **głazy narzutowe** przyniesione ze Skandynawii."], "checks": [{"ref": "q70"}, {"q": {"id": "gc2", "type": "mc", "tag": "l7", "q": "Skąd się wzięły duże głazy narzutowe na Mazowszu?", "options": ["wyrzucił je wulkan", "przyniósł je lądolód ze Skandynawii", "przyniosła je Wisła z Tatr", "spadły z kosmosu"], "answer": 1, "explain": "Głazy narzutowe przyniósł **lądolód skandynawski** w czwartorzędzie."}}]}, {"n": 5, "title": "Na sprawdzian i wyżej: wyjaśnij", "tags": ["l7"], "body": ["Ekspert wyjaśnia różnicę między procesami endogenicznymi i egzogenicznymi i opisuje, jak lądolód ukształtował północną Polskę."], "checks": [{"ref": "e6"}, {"q": {"id": "gc3", "type": "mc", "tag": "l7", "q": "Do jakiej grupy procesów należą wulkanizm i trzęsienia ziemi?", "options": ["egzogenicznych – zewnętrznych", "endogenicznych – wewnętrznych", "do żadnej – to zjawiska pogodowe", "do akumulacji"], "answer": 1, "explain": "Wulkanizm i trzęsienia ziemi mają źródło energii we **wnętrzu Ziemi** – to procesy endogeniczne."}}]}]}, {"id": "faldowania", "title": "Rodzaje fałdowań (orogenez)", "tags": ["l8"], "levels": [{"n": 1, "title": "Jak powstają góry fałdowe?", "tags": ["l8"], "body": ["**Fałdowanie (orogeneza)** to powstawanie gór: warstwy skał są zgniatane jak obrus przesuwany po stole, wyginane w fałdy i wypiętrzane – zwykle przy zderzaniu się płyt litosfery."], "checks": [{"ref": "d7"}, {"q": {"id": "gf1", "type": "mc", "tag": "l8", "q": "Czym jest fałdowanie (orogeneza)?", "options": ["powolnym zasypywaniem dolin przez rzeki", "procesem powstawania gór przez zgniatanie i wypiętrzanie warstw skał", "topnieniem lodowca", "wybuchem wulkanu"], "answer": 1, "explain": "Orogeneza = **powstawanie gór**: warstwy skał są zgniatane, fałdowane i wypiętrzane."}}]}, {"n": 2, "title": "Trzy fałdowania i ich ery", "tags": ["l8"], "body": ["**Kaledońskie** – starszy paleozoik. **Hercyńskie** – młodszy paleozoik (karbon). **Alpejskie** – mezozoik i kenozoik, trwa do dziś."], "checks": [{"ref": "q71"}, {"q": {"id": "gf2", "type": "mc", "tag": "l8", "q": "W którym fałdowaniu powstały Sudety?", "options": ["kaledońskim", "hercyńskim", "alpejskim", "w żadnym – to wulkan"], "answer": 1, "explain": "Sudety powstały w fałdowaniu **hercyńskim** (młodszy paleozoik); później zostały odmłodzone w alpejskim."}}]}, {"n": 3, "title": "Góry na świecie i w Polsce", "tags": ["l8"], "body": ["Kaledońskie: Góry Skandynawskie, część Gór Świętokrzyskich. Hercyńskie: Ural, **Sudety**, Góry Świętokrzyskie. Alpejskie: Alpy, Himalaje, Andy, **Karpaty** (z Tatrami)."], "checks": [{"ref": "q72"}, {"ref": "q73"}], "lessons": ["l8"]}, {"n": 4, "title": "Góry stare i młode, odmłodzenie", "tags": ["l8"], "body": ["Góry **stare** długo niszczy erozja – są niższe i łagodne (Łysica 614 m, Śnieżka 1603 m). Góry **młode** są wysokie i strome (Rysy 2499 m, Everest 8849 m). W fałdowaniu alpejskim Sudety i Góry Świętokrzyskie zostały **odmłodzone** – ponownie wypiętrzone."], "checks": [{"ref": "q74"}, {"ref": "q75"}]}, {"n": 5, "title": "Na sprawdzian i wyżej: opisz trzy fałdowania", "tags": ["l8"], "body": ["Ekspert do każdego fałdowania podaje erę, przykłady gór na świecie i w Polsce i wyjaśnia, dlaczego Tatry są ostre, a Sudety łagodne."], "checks": [{"ref": "e4"}, {"q": {"id": "gf3", "type": "mc", "tag": "l8", "q": "Dlaczego Tatry mają ostre szczyty, a Góry Świętokrzyskie są niskie i łagodne?", "options": ["bo w Tatrach jest zimniej", "bo Tatry są młode (alpejskie), a Góry Świętokrzyskie stare i długo niszczone przez erozję", "bo Góry Świętokrzyskie są wulkaniczne", "bo Tatry powstały w kaledońskim"], "answer": 1, "explain": "Góry młode (alpejskie) są wysokie i strome; stare (kaledońskie, hercyńskie) przez setki milionów lat niszczyła erozja."}}]}]}, {"id": "ery", "title": "Ery geologiczne i najważniejsze wydarzenia", "tags": ["l9"], "levels": [{"n": 1, "title": "Ziemia ma 4,6 mld lat", "tags": ["l9"], "body": ["Ziemia powstała ok. **4,6 mld lat temu**. Jej historię dzielimy na **ery**, tak jak historię ludzi na epoki. My żyjemy w **kenozoiku**, w okresie **czwartorzęd**."], "checks": [{"ref": "q82"}, {"ref": "q83"}]}, {"n": 2, "title": "Pięć er po kolei", "tags": ["l9"], "body": ["Od najstarszej: **archaik → proterozoik → paleozoik → mezozoik → kenozoik**. Archaik i proterozoik razem to **prekambr** (ok. 88% dziejów Ziemi)."], "checks": [{"ref": "q76"}, {"q": {"id": "ge1", "type": "mc", "tag": "l9", "q": "Która era jest najstarsza?", "options": ["kenozoik", "mezozoik", "archaik", "paleozoik"], "answer": 2, "explain": "Kolejność: **archaik** → proterozoik → paleozoik → mezozoik → kenozoik."}}]}, {"n": 3, "title": "Co się działo w każdej erze", "tags": ["l9"], "body": ["Archaik: pierwsze organizmy (bakterie). Proterozoik: więcej tlenu, pierwsze organizmy wielokomórkowe. Paleozoik: ryby, rośliny i zwierzęta lądowe, fałdowania kaledońskie i hercyńskie. Mezozoik: dinozaury. Kenozoik: ssaki, fałdowanie alpejskie, zlodowacenia, człowiek."], "checks": [{"ref": "q77"}, {"ref": "q78"}], "lessons": ["l9"]}, {"n": 4, "title": "Polskie surowce i ery", "tags": ["l9"], "body": ["Węgiel kamienny na Śląsku powstał w **karbonie** (paleozoik) z bagiennych lasów. Sól kamienna w Wieliczce i Bochni – w **neogenie** (kenozoik)."], "checks": [{"ref": "q79"}, {"ref": "q80"}]}, {"n": 5, "title": "Na sprawdzian i wyżej: daty i wydarzenia", "tags": ["l9"], "body": ["Ekspert łączy wydarzenia z erami i datami: dinozaury wymarły ok. **66 mln lat temu** (koniec mezozoiku); prekambr to ponad 4 mld lat z 4,6 mld."], "checks": [{"ref": "q81"}, {"q": {"id": "ge2", "type": "mc", "tag": "l9", "q": "Czym jest prekambr?", "options": ["nazwą okresu w kenozoiku", "archaikiem i proterozoikiem razem – ok. 88% dziejów Ziemi", "erą dinozaurów", "pierwszym okresem paleozoiku"], "answer": 1, "explain": "**Prekambr** = archaik + proterozoik, ok. 88% historii Ziemi."}}]}]}, {"id": "plyty", "title": "Płyty litosfery i ich ruchy", "tags": ["l10"], "levels": [{"n": 1, "title": "Pęknięta skorupka", "tags": ["l10"], "body": ["Litosfera jest pęknięta na **płyty**, jak skorupka jajka. Płyty bardzo powoli (kilka cm na rok) się przesuwają. Polska leży na płycie **euroazjatyckiej**, daleko od jej brzegów – dlatego nie mamy wulkanów ani silnych trzęsień ziemi."], "checks": [{"ref": "q87"}, {"ref": "q91"}]}, {"n": 2, "title": "Skorupa oceaniczna i kontynentalna; subdukcja", "tags": ["l10"], "body": ["Skorupa **oceaniczna**: cienka, cięższa (gęstsza), młodsza. **Kontynentalna**: grubsza, lżejsza, starsza. Przy zderzeniu cięższa płyta oceaniczna wsuwa się pod inną – to **subdukcja**."], "checks": [{"ref": "q84"}, {"ref": "q88"}]}, {"n": 3, "title": "Trzy rodzaje granic płyt", "tags": ["l10"], "body": ["**Rozsuwanie** – grzbiety śródoceaniczne, ryfty (Rów Wschodnioafrykański). **Zderzanie** – subdukcja (rowy oceaniczne, wulkany) albo kolizja kontynentów (Himalaje). **Przesuwanie** obok siebie – uskoki i trzęsienia ziemi."], "checks": [{"ref": "q86"}, {"ref": "q89"}], "lessons": ["l10"], "images": [{"img": "plyty_rozsuwanie", "caption": "rozsuwanie"}, {"img": "plyty_subdukcja", "caption": "subdukcja"}, {"img": "plyty_kolizja", "caption": "kolizja"}, {"img": "plyty_przesuwanie", "caption": "przesuwanie"}]}, {"n": 4, "title": "Skutki na mapie świata", "tags": ["l10"], "body": ["Najwięcej wulkanów i trzęsień ziemi jest wokół **Oceanu Spokojnego** (Pacyficzny Pierścień Ognia). Zderzenie dwóch płyt kontynentalnych tworzy najwyższe góry fałdowe (Himalaje)."], "checks": [{"ref": "d8"}, {"ref": "q92"}, {"ref": "q85"}]}, {"n": 5, "title": "Na sprawdzian i wyżej: ruchy i skutki", "tags": ["l10"], "body": ["Ekspert opisuje trzy rodzaje ruchów płyt z przykładami i wymienia skutki: góry, rowy oceaniczne, wulkany, trzęsienia ziemi, tsunami."], "checks": [{"ref": "q90"}, {"ref": "e5"}]}]}], "life": [{"concept": "Kierunki świata", "intro": "Kierunki przydają się nie tylko na mapie w szkole.", "examples": [{"t": "Kompas w telefonie", "d": "Strzałka kompasu pokazuje **północ**. W górach, gdy padnie zasięg i nie działa mapa, kompas pomaga wrócić na szlak."}, {"t": "Balkon od południa", "d": "Ogłoszenia mieszkań chwalą się „balkonem od południa” – bo w Polsce Słońce w ciągu dnia jest po stronie **południowej**, więc tam jest najjaśniej."}, {"t": "Mapa w aplikacji", "d": "Mapa w telefonie domyślnie ma **północ u góry**. Gdy obrócisz ją palcem, mała strzałka kompasu pokazuje, gdzie jest północ."}, {"t": "Wiatr w prognozie", "d": "„Wiatr zachodni” w prognozie pogody oznacza wiatr wiejący **z zachodu** – w Polsce często przynosi wilgotne powietrze znad Atlantyku."}, {"t": "Stare kościoły", "d": "Wiele starych kościołów ma ołtarz po stronie **wschodniej** – w stronę wschodu słońca. Wchodzisz więc od zachodu."}, {"t": "Gwiazda Polarna na obozie", "d": "Na obozie harcerskim nocą szuka się **Gwiazdy Polarnej** (przedłużenie „wozu” Wielkiej Niedźwiedzicy) – wskazuje północ."}, {"t": "Ulice w Warszawie", "d": "Aleje Jerozolimskie biegną mniej więcej z **zachodu na wschód** – w stronę Wisły idziesz na wschód."}]}, {"concept": "Południki i równoleżniki", "intro": "Umowne linie z globusa decydują o czasie, granicach i trasach lotów.", "examples": [{"t": "Strefy czasowe", "d": "Strefy czasowe wyznacza się według **południków** – mniej więcej co 15° długości zmienia się czas o 1 godzinę."}, {"t": "Linia w Greenwich", "d": "W Greenwich pod Londynem na ziemi jest wytyczona linia **południka 0°** – turyści stają jedną nogą na półkuli wschodniej, a drugą na zachodniej."}, {"t": "Środek Świata w Ekwadorze", "d": "Pomnik Mitad del Mundo w Ekwadorze stoi na **równiku** – najdłuższym równoleżniku (ok. 40 000 km)."}, {"t": "Loty nad biegunem", "d": "Samoloty z Europy do Azji lub Ameryki często lecą daleko na północ – bliżej bieguna, gdzie **zbiegają się południki**, trasa jest krótsza."}, {"t": "Granica USA i Kanady", "d": "Duża część granicy USA i Kanady biegnie prosto wzdłuż **równoleżnika 49°N** – widać ją na mapie jako idealnie prostą linię."}, {"t": "111 km na stopień", "d": "Wzdłuż południka 1° to ok. **111 km** – z Gdańska do Zakopanego jest ok. 5°, czyli ok. 560 km w linii prostej."}, {"t": "Dookoła świata", "d": "Okrążenie Ziemi wzdłuż równika to ok. 40 000 km – bliżej biegunów równoleżniki są **krótsze**, więc „dookoła świata” jest tam bliżej."}]}, {"concept": "Współrzędne geograficzne", "intro": "Każdy punkt na Ziemi ma swój „adres” – parę liczb.", "examples": [{"t": "Pinezka w Google Maps", "d": "Przytrzymaj palec na mapie – pojawią się liczby w stylu 52.2297, 21.0122. To **szerokość i długość** geograficzna (Warszawa ok. 52°14'N, 21°01'E), tylko zapisane ułamkiem dziesiętnym zamiast minut."}, {"t": "Udostępnianie lokalizacji", "d": "Gdy wysyłasz komuś „moja lokalizacja” w komunikatorze, telefon wysyła właśnie parę współrzędnych z GPS."}, {"t": "Bolt / Uber i dostawy jedzenia", "d": "Kierowca widzi Twoje współrzędne, a aplikacja liczy trasę. Dlatego czasem pinezka „ucieka” o kilka metrów – GPS ma niewielki błąd."}, {"t": "Geocaching i gry terenowe", "d": "Skrytki w lesie Kabackim czy na Bielanach mają podane współrzędne w stopniach i minutach – dokładnie jak w zadaniach z geografii."}, {"t": "Pogoda w aplikacji", "d": "Prognoza „dla Twojej lokalizacji” jest liczona dla konkretnych współrzędnych – dlatego na Ursynowie i w Wilanowie może pokazywać trochę inne dane."}, {"t": "Zdjęcia z telefonu", "d": "Telefon zapisuje w zdjęciu współrzędne miejsca – dlatego galeria potrafi pokazać zdjęcia z wakacji na mapie."}, {"t": "Statki i samoloty", "d": "Kapitan statku i pilot podają pozycję we współrzędnych – na morzu nie ma ulic ani numerów domów."}]}, {"concept": "Rozciągłość i różnice współrzędnych", "intro": "Różnice stopni oznaczają różnice czasu, długości dnia i odległości.", "examples": [{"t": "Wschód słońca w Polsce", "d": "Polska ma ok. 10° rozciągłości równoleżnikowej, więc w Terespolu (wschód) Słońce wschodzi ok. 40 minut wcześniej niż w Słubicach (zachód). 1° długości to 4 minuty różnicy."}, {"t": "Długość dnia nad morzem i w górach", "d": "Jastrzębia Góra leży prawie 6° bardziej na północ niż Bieszczady – w czerwcu dzień nad Bałtykiem jest dłuższy niż w Tatrach."}, {"t": "Pociąg z Gdańska do Zakopanego", "d": "Jedziesz prawie wzdłuż południka przez ok. 5° szerokości. Licząc ok. 111 km na stopień, w linii prostej to ok. 560 km."}, {"t": "Wakacje w Grecji", "d": "Kreta leży ok. 35°N, Warszawa ok. 52°N – różnica ok. 17°. Im bliżej równika, tym Słońce w południe stoi wyżej, dlatego tam jest dużo cieplej."}, {"t": "Lot do Nowego Jorku", "d": "Warszawa 21°E, Nowy Jork ok. 74°W – różne półkule, więc **dodajesz**: ok. 95° różnicy długości, czyli ok. 6 godzin różnicy czasu."}, {"t": "Kraje „długie” i „szerokie”", "d": "Chile ma ogromną rozciągłość południkową (ponad 38°), więc na północy jest pustynia, a na południu lodowce. Rosja ma ogromną rozciągłość równoleżnikową – aż 11 stref czasowych."}, {"t": "Mecz na drugim końcu świata", "d": "Mecze w Australii (ok. 150°E) oglądasz w Polsce rano: różnica długości ok. 130° to prawie 9 godzin."}]}, {"concept": "Linie na mapie: zwrotniki, koła podbiegunowe, równik", "intro": "Te linie wyznaczają, gdzie Słońce stoi w zenicie, a gdzie jest noc polarna.", "examples": [{"t": "Asuan w Egipcie", "d": "Asuan leży prawie na **zwrotniku Raka** – w czerwcu w południe Słońce stoi tam niemal pionowo i przedmioty prawie nie mają cienia."}, {"t": "Noc polarna w Tromsø", "d": "Norweskie Tromsø leży **za kołem podbiegunowym** – od końca listopada do połowy stycznia Słońce w ogóle tam nie wschodzi."}, {"t": "Nordkapp latem", "d": "Na Nordkappie (Norwegia) latem jest **dzień polarny** – turyści oglądają „słońce o północy”."}, {"t": "Chrzest równikowy", "d": "Marynarze, którzy pierwszy raz przekraczają **równik**, przechodzą żartobliwy „chrzest równikowy”."}, {"t": "Dzień na równiku", "d": "Na równiku przez cały rok dzień i noc trwają prawie po 12 godzin – nie ma tam lata i zimy jak u nas."}, {"t": "Polak na obu biegunach", "d": "Marek Kamiński w 1995 r. dotarł pieszo do **Bieguna Północnego i Południowego** w jednym roku – tam zbiegają się wszystkie południki."}, {"t": "Długi dzień w czerwcu", "d": "Polska leży między 49° a 55°N, daleko od koła podbiegunowego – dlatego nie mamy nocy polarnej, ale w czerwcu dzień trwa ponad 16 godzin."}]}, {"concept": "Sąsiedzi Polski i stolice", "intro": "Sąsiedzi to nie tylko nazwy na mapie – to wycieczki, pieniądze i sport.", "examples": [{"t": "Berlin pociągiem", "d": "Z Warszawy do **Berlina** (stolica Niemiec) jedzie się pociągiem ok. 5–6 godzin."}, {"t": "Strefa Schengen", "d": "Do Niemiec, Czech, Słowacji i na Litwę jedziesz bez kontroli paszportowej. Granice z Białorusią, Ukrainą i Rosją to zewnętrzne granice UE – tam są kontrole."}, {"t": "Wilno w historii rodzin", "d": "Wiele rodzin ma przodków z **Wilna** (dziś stolica Litwy) – granica z Litwą jest najkrótsza (104 km)."}, {"t": "Waluty sąsiadów", "d": "W Niemczech, na Słowacji i Litwie płacisz **euro**, w Czechach – **koroną czeską**, na Ukrainie – **hrywną**, na Białorusi i w Rosji – **rublem**."}, {"t": "Wiadomości z Kijowa", "d": "Kijów, stolica Ukrainy, często pojawia się w wiadomościach – Ukraina ma z Polską granicę długą na 535 km."}, {"t": "Mecze z sąsiadami", "d": "Mecze Polska–Niemcy czy Polska–Czechy to „derby sąsiadów” – kibice dojeżdżają na nie samochodem."}, {"t": "Praga na weekend", "d": "**Praga**, stolica Czech, to popularny cel szkolnych wycieczek – a granica z Czechami jest najdłuższa (796 km)."}]}, {"concept": "Naturalne granice Polski", "intro": "Morze, rzeki i góry, które widać na granicy.", "examples": [{"t": "Wycieczka do Pragi przez Sudety", "d": "Jadąc do Czech, przejeżdżasz przez **Sudety** – naturalną granicę z Czechami."}, {"t": "Narty na Słowacji", "d": "Spod Tatr szybko dojeżdża się na Słowację – granica biegnie grzbietem **Karpat**."}, {"t": "Most Zgorzelec–Görlitz", "d": "Pieszy most nad **Nysą Łużycką** łączy polski Zgorzelec z niemieckim Görlitz – przechodzisz rzekę i jesteś w Niemczech."}, {"t": "Spływ kajakowy Bugiem", "d": "Na spływie **Bugiem** po drugiej stronie rzeki widać Białoruś lub Ukrainę – rzeka jest granicą."}, {"t": "Rysy", "d": "Granica ze Słowacją przechodzi przez wierzchołek **Rysów** – na szczycie możesz stanąć jedną nogą w Polsce, drugą na Słowacji."}, {"t": "Wakacje nad Bałtykiem", "d": "Jastrzębia Góra leży nad **Bałtykiem** – morze tworzy całą północną granicę Polski."}, {"t": "Słupki na Suwalszczyźnie", "d": "Na granicy z Litwą nie ma rzeki ani gór – stoją tylko słupki graniczne. To przykład granicy **sztucznej**."}]}, {"concept": "Czynniki kształtujące rzeźbę", "intro": "Siły z wnętrza Ziemi i z zewnątrz zostawiają ślady, które widać na spacerze.", "examples": [{"t": "Skarpa wiślana w Warszawie", "d": "Skarpa, po której schodzi się z Krakowskiego Przedmieścia na Powiśle, to brzeg doliny Wisły wyrzeźbionej przez rzekę – proces **egzogeniczny** (erozja)."}, {"t": "Głazy narzutowe w parku", "d": "Duże okrągłe kamienie w parkach i lasach Mazowsza przyniósł **lądolód skandynawski** ze Skandynawii."}, {"t": "Mazury na wakacjach", "d": "Jeziora rynnowe i pagórki morenowe na Mazurach to „ślady” lądolodu z czwartorzędu."}, {"t": "Ruchome wydmy w Łebie", "d": "W Słowińskim Parku Narodowym **wiatr** przesuwa wydmy o kilka metrów rocznie – to też proces zewnętrzny."}, {"t": "Wąwozy w Kazimierzu Dolnym", "d": "Głębokie wąwozy lessowe wyrzeźbiła **spływająca woda** w miękkich skałach."}, {"t": "Klif w Gdyni Orłowie", "d": "Fale morskie podmywają klif w Orłowie i stopniowo go cofają – to niszcząca praca morza."}, {"t": "Trzęsienia ziemi w wiadomościach", "d": "Silne trzęsienia ziemi w Turcji czy Japonii to procesy **endogeniczne** – energia pochodzi z wnętrza Ziemi."}]}, {"concept": "Fałdowania i góry", "intro": "Wiek gór widać po ich kształcie.", "examples": [{"t": "Tatry i Zakopane", "d": "Tatry należą do **Karpat**, które powstały w młodym **fałdowaniu alpejskim** – dlatego są wysokie i ostre (Rysy 2499 m)."}, {"t": "Śnieżka", "d": "Najwyższy szczyt Sudetów, Śnieżka (1603 m), ma łagodny, kopulasty kształt – Sudety są stare (**hercyńskie**)."}, {"t": "Łysica w Górach Świętokrzyskich", "d": "Łysica ma tylko 614 m – Góry Świętokrzyskie należą do najstarszych w Europie i przez setki milionów lat niszczyła je erozja."}, {"t": "Alpy na nartach", "d": "Alpy, gdzie wiele rodzin jeździ na narty, to góry **alpejskie** – ostre szczyty i lodowce."}, {"t": "Mount Everest", "d": "Najwyższa góra świata (8849 m) leży w Himalajach, które wciąż rosną, bo płyta indyjska napiera na euroazjatycką."}, {"t": "Ural – granica Europy", "d": "Ural, umowna granica Europy i Azji, to stare góry **hercyńskie** – długie, ale niezbyt wysokie."}, {"t": "Fiordy w Norwegii", "d": "Góry Skandynawskie powstały w fałdowaniu **kaledońskim**; ich doliny później pogłębiły lodowce, tworząc fiordy."}]}, {"concept": "Ery geologiczne", "intro": "Ślady dawnych er można zobaczyć w Polsce.", "examples": [{"t": "Węgiel i prąd", "d": "Duża część prądu w Polsce wciąż pochodzi z węgla kamiennego ze Śląska, który powstał w **karbonie** (paleozoik) z dawnych bagiennych lasów."}, {"t": "Dinozaury w Bałtowie", "d": "Ślady dinozaurów z Gór Świętokrzyskich i park w Bałtowie przypominają **mezozoik** – erę dinozaurów."}, {"t": "Kopalnia soli w Wieliczce", "d": "Sól w Wieliczce osadziła się z wysychającego morza w **neogenie** (kenozoik)."}, {"t": "Bursztyn znad Bałtyku", "d": "Bursztyn to żywica drzew sprzed ok. **40 mln lat** (kenozoik) – czasem są w nim zatopione owady."}, {"t": "Muzeum Ewolucji w PKiN", "d": "W Pałacu Kultury i Nauki jest Muzeum Ewolucji – szkielety dinozaurów pokazują, jak wyglądał świat w mezozoiku."}, {"t": "Jurassic Park", "d": "Tytuł filmu pochodzi od **jury** – środkowego okresu mezozoiku."}, {"t": "Mamuty i epoka lodowa", "d": "Mamuty żyły w **czwartorzędzie** (kenozoik), gdy Polskę pokrywał lądolód – ich kości znajduje się czasem na budowach."}]}, {"concept": "Płyty litosfery", "intro": "Ruchy płyt tłumaczą wulkany i trzęsienia ziemi z wiadomości.", "examples": [{"t": "Islandia", "d": "Islandia leży na **grzbiecie śródoceanicznym**, gdzie płyty się rozsuwają – dlatego ma wulkany i gejzery."}, {"t": "Tsunami w Japonii 2011", "d": "Wielkie trzęsienie ziemi i tsunami w Japonii w 2011 r. wywołała **subdukcja** płyty pacyficznej."}, {"t": "Etna na Sycylii", "d": "Etna, czynny wulkan we Włoszech, leży w strefie zderzania płyty afrykańskiej i euroazjatyckiej."}, {"t": "Uskok San Andreas", "d": "W Kalifornii płyty **przesuwają się obok siebie** wzdłuż uskoku San Andreas – stąd trzęsienia ziemi w San Francisco."}, {"t": "Atlantyk się poszerza", "d": "Ameryka i Europa oddalają się od siebie o ok. 2–3 cm rocznie – mniej więcej tyle, ile rosną paznokcie."}, {"t": "GPS mierzy ruch płyt", "d": "Dokładne stacje GPS pokazują, że cała Polska przesuwa się razem z płytą euroazjatycką o ok. 2–3 cm rocznie."}, {"t": "Pacyficzny Pierścień Ognia", "d": "Większość wulkanów świata otacza **Ocean Spokojny** – tam przebiegają granice płyt."}]}]};</script>
<script>
(function(){
"use strict";
var C = window.TP_CONTENT;
var M = C.meta, KEY = 'testprep:' + M.id;
var P = load();
function load(){try{var p=JSON.parse(localStorage.getItem(KEY));if(p&&p.v===1)return p;}catch(e){}return {v:1,q:{},cards:{},mistakes:{},diag:null,lessons:{},explain:{},mock:null,lang:'pl',testDate:''};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}refreshProgress();}
/* tp events for optional add-ons (results.js etc.): window 'tp:<type>' CustomEvents; never throws */
function tpEmit(t,d){try{window.dispatchEvent(new CustomEvent('tp:'+t,{detail:d||{}}));}catch(e){}}
/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');}
var IMGS=C.images||{};
function IMG(key,cls){var m=IMGS[key];if(!m)return '';var src=m.svg?('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(m.svg)):(/^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(m.data||'')?m.data:'');if(!src)return '';return '<img class="tpimg'+(m.wide?' wide':'')+(cls?' '+cls:'')+'" alt="'+esc(m.alt||'')+'" src="'+src+'">';}
function gallery(list){if(!list||!list.length)return '';return '<div class="gal">'+list.map(function(g){return '<figure'+((IMGS[g.img]||{}).wide?' class="wide"':'')+'>'+IMG(g.img)+(g.caption?'<figcaption>'+fmt(g.caption)+'</figcaption>':'')+'</figure>';}).join('')+'</div>';}
function el(tag,attrs,html){var e=document.createElement(tag);if(attrs)for(var k in attrs){if(k==='class')e.className=attrs[k];else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k]);}if(html!=null)e.innerHTML=html;return e;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function dmParse(s){s=String(s).replace(/[′’`´]/g,"'").replace(/[″”]/g,'"');var mDec=s.match(/^\s*(\d+)[.,](\d+)\s*°?\s*[A-Za-ząćęłńóśźżĄĆĘŁŃÓŚŹŻ. ]*$/);
 if(mDec&&!(mDec[2].length===2&&+mDec[2]<60))return Math.round(parseFloat(mDec[1]+'.'+mDec[2])*60*100)/100;
 var t=s.match(/\d+/g);if(!t)return null;var d=+t[0],m=t.length>1?+t[1]:0;if(m>=60)return null;return d*60+m;}
function dmDirOf(s){var w=String(s).toUpperCase().replace(/[^A-ZĄĆĘŁŃÓŚŹŻ]+/g,' ').trim().split(' ').filter(Boolean);var f={};
 w.forEach(function(x){if(x==='N'||/^P[ŁL]N|^PÓŁN|^POLN/.test(x))f.N=1;else if(x==='S'||/^P[ŁL]?D|^POŁUD|^POLUD/.test(x))f.S=1;else if(x==='E'||/^WSCH/.test(x))f.E=1;else if(x==='W'||/^ZACH/.test(x))f.W=1;});return Object.keys(f);}
function dmCheck(v,q){if(q.noDec&&/\d\s*[.,]\s*\d/.test(String(v)))return false;var tot=dmParse(v);if(tot===null)return false;var tol=(typeof q.tol==='number')?q.tol:0;if(Math.abs(tot-(q.dm[0]*60+q.dm[1]))>tol+1e-9)return false;
 if(q.dmDir){var d=dmDirOf(v);return d.length===1&&d[0]===q.dmDir;}return true;}
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/g,'l').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}
/* optional static info table on lessons[i].table / cheatSheet[i].table = {columns:[...], rows:[[head, cell, ...]]} (same responsive layout as type 'table') */
function infoTable(t){if(!t||!t.columns||!t.rows)return '';return '<div class="ttwrap"><table class="ttab ftab"><thead><tr>'+t.columns.map(function(c){return '<th scope="col">'+esc(c)+'</th>';}).join('')+'</tr></thead><tbody>'+t.rows.map(function(r){return '<tr><th scope="row">'+fmt(r[0])+'</th>'+r.slice(1).map(function(x,i){return '<td data-label="'+esc(t.columns[i+1]||'')+'">'+fmt(x)+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>';}
/* ---------- keyword match tolerant of speech transcription (case, diacritics, stems, split words) ---------- */
function kwFold(s){return ' '+norm(s).replace(/rz/g,'z').replace(/ch/g,'h').replace(/(z|s)(c|k)(?=[aou])/g,'sk').replace(/x/g,'ks').replace(/v/g,'w')+' ';}
function kwHas(text,stem){var V=kwFold(text),S=kwFold(stem).trim();if(!S)return false;if(V.indexOf(S)>=0)return true;return S.replace(/ /g,'').length>=5&&V.replace(/ /g,'').indexOf(S.replace(/ /g,''))>=0;}
/* ---------- 🎤 speech-to-text for open answers (Web Speech API, pl-PL) ---------- */
var MIC={cur:null};
function micStop(){if(MIC.cur){var c=MIC.cur;MIC.cur=null;c.stop();}}
function micFor(ta){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;var w=el('div',{class:'mic'});
 if(!SR){var ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  w.innerHTML='<p class="small muted mic-hint">🎤 '+(ios?'Chcesz mówić zamiast pisać? Stuknij w pole odpowiedzi i naciśnij <b>mikrofon 🎙️ na klawiaturze iPhone’a</b> (dyktowanie) – tekst sam się wpisze.':'Chcesz mówić zamiast pisać? Ta przeglądarka nie rozpoznaje mowy – otwórz stronę w <b>Chrome</b> lub <b>Safari</b> albo użyj dyktowania z klawiatury.')+'</p>';return w;}
 var btn=el('button',{type:'button',class:'btn sec micbtn'},'🎤 Mów');var live=el('div',{class:'miclive small','aria-live':'polite'});w.appendChild(btn);w.appendChild(live);
 var st={on:false,rec:null,fatal:false,restarts:0};
 function ui(){btn.classList.toggle('rec',st.on);btn.innerHTML=st.on?'⏹️ Stop':'🎤 Mów';}
 function add(t){t=String(t||'').trim();if(!t||ta.disabled)return;var v=ta.value.replace(/\s+$/,'');ta.value=(v?v+(/[.!?]$/.test(v)?' ':' '):'')+t;ta.dispatchEvent(new Event('input',{bubbles:true}));}
 function stop(){st.on=false;try{st.rec&&st.rec.stop();}catch(e){}ui();if(MIC.cur===ctl)MIC.cur=null;}

<template id="tutor-tpl"><elevenlabs-convai agent-id="agent_3101m4193bfqeyy99nqzjkg5mtfh" variant="expanded" action-text="Porozmawiaj z tutorem" start-call-text="Zacznij rozmowę" end-call-text="Zakończ" dynamic-variables="{&quot;subject&quot;: &quot;Geografia&quot;, &quot;topic&quot;: &quot;Geografia: współrzędne, położenie Polski i budowa geologiczna&quot;, &quot;material&quot;: &quot;ZAKRES PRACY KLASOWEJ (geografia, klasa 7): kierunki świata; cechy południków i równoleżników; szerokość i długość geograficzna; obliczanie rozciągłości; linie na mapie i półkule; sąsiedzi Polski i stolice; granice naturalne; procesy endogeniczne i egzogeniczne; fałdowania; ery geologiczne; płyty litosfery.\n\n## 1. Kierunki świata\nGłówne: północ N, południe S, wschód E, zachód W. Pośrednie: NE północny wschód, SE południowy wschód, SW południowy zachód, NW północny zachód. Róża wiatrów pokazuje 8 kierunków. Na mapie północ zwykle u góry.\nWyznaczanie: kompas – igła magnetyczna wskazuje północ. Słońce w południe w Polsce jest na południu, cień jest najkrótszy i wskazuje północ. Słońce wschodzi na wschodzie, zachodzi na zachodzie (dokładnie E i W w dni równonocy). Gwiazda Polarna (Mała Niedźwiedzica) wskazuje północ – przedłużyć ok. 5 razy tylną ścianę Wielkiego Wozu. Kierunek przeciwny do NE to SW.\n\n## 2. Południki i równoleżniki\nPołudniki: półokręgi, jednakowa długość (ok. 20 000 km), łączą bieguny, kierunek N–S, zbiegają się na biegunach. Południk 0° przechodzi przez Greenwich (Londyn), naprzeciw leży 180°. Południki 0° i 180° dzielą Ziemię na półkulę wschodnią i zachodnią.\nRównoleżniki: okręgi, różna długość – maleje ku biegunom, równoległe do siebie, kierunek W–E. Równik 0° jest najdłuższy (ok. 40 000 km) i dzieli Ziemię na półkulę północną i południową. Bieguny 90°N i 90°S to punkty.\n1° wzdłuż południka ≈ 111,2 km; 1&#x27; ≈ 1,85 km.\n\n## 3. Linie na mapie\nBiegun Północny 90°N, koło podbiegunowe północne 66°33&#x27;N, zwrotnik Raka 23°27&#x27;N, równik 0°, zwrotnik Koziorożca 23°27&#x27;S, koło podbiegunowe południowe 66°33&#x27;S, Biegun Południowy 90°S. Zwrotniki + koła: 23°27&#x27; + 66°33&#x27; = 90°. Polska leży na półkuli północnej i wschodniej.\n\n## 4. Współrzędne geograficzne\nSzerokość φ: odległość kątowa od równika, 0°–90°, N (północna) lub S (południowa). Długość λ: odległość kątowa od południka 0°, 0°–180°, E (wschodnia) lub W (zachodnia). 1° = 60&#x27;, 1&#x27; = 60&#x27;&#x27;. Najpierw szerokość, potem długość, zawsze z literą. Warszawa ok. 52°14&#x27;N, 21°01&#x27;E. Punkt na równiku ma φ = 0°, na południku Greenwich λ = 0°.\nOdczyt z mapy: równoleżnik punktu → φ (nad równikiem N, pod S); południk punktu → λ (na prawo od 0° E, na lewo W).\n\n## 5. Rozciągłość – METODA (najważniejsze obliczenia)\nRozciągłość południkowa = różnica szerokości punktu najdalej na N i najdalej na S. Rozciągłość równoleżnikowa = różnica długości punktu najdalej na W i najdalej na E.\nKrok 1: sprawdź półkule. Ta sama półkula (N i N, S i S, E i E, W i W) → ODEJMIJ. Różne półkule → DODAJ.\nKrok 2 (tylko długość): jeśli suma &gt; 180°, wynik = 360° − suma.\nKrok 3 (minuty): 1° = 60&#x27;. Przy odejmowaniu brakuje minut → pożycz 1° (52°15&#x27; = 51°75&#x27;). Po dodaniu minut 60&#x27; lub więcej → zamień 60&#x27; na 1° (35°75&#x27; = 36°15&#x27;).\nKrok 4: odległość w km wzdłuż południka = liczba stopni × 111,2 km (minuty na ułamek: 30&#x27; = 0,5°, 15&#x27; = 0,25°, 50&#x27; ≈ 0,83°).\nPrzykłady:\n- Polska N–S: 54°50&#x27;N − 49°00&#x27;N = 5°50&#x27; (≈ 5,83° × 111,2 ≈ 649 km).\n- Polska W–E: 24°09&#x27;E − 14°07&#x27;E = 10°02&#x27;.\n- 37°20&#x27;N i 34°50&#x27;S: 37°20&#x27; + 34°50&#x27; = 71°70&#x27; = 72°10&#x27;.\n- 17°30&#x27;W i 51°25&#x27;E: 68°55&#x27;.\n- 150°E i 160°W: 310° &gt; 180° → 360° − 310° = 50°.\n- 120°30&#x27;E i 100°45&#x27;W: 221°15&#x27; → 360° − 221°15&#x27; = 138°45&#x27;.\n- 52°15&#x27;N − 48°40&#x27;N: 51°75&#x27; − 48°40&#x27; = 3°35&#x27;.\n- 30°15&#x27;E − 12°50&#x27;E: 29°75&#x27; − 12°50&#x27; = 17°25&#x27;.\n- 66°33&#x27;N − 23°27&#x27;N = 43°06&#x27;; 23°27&#x27;N i 23°27&#x27;S = 46°54&#x27;.\n- 3° wzdłuż południka = 333,6 km; 2°30&#x27; = 278 km.\n\n## 6. Polska – położenie, sąsiedzi, granice\nEuropa Środkowa, ok. 312,7 tys. km². Skrajne punkty: N Jastrzębia Góra 54°50&#x27;N; S Opołonek (Bieszczady) 49°00&#x27;N; W zakole Odry k. Osinowa Dolnego 14°07&#x27;E; E zakole Bugu k. Zosina 24°09&#x27;E.\nSąsiedzi i stolice: Niemcy – Berlin, Czechy – Praga, Słowacja – Bratysława, Ukraina – Kijów, Białoruś – Mińsk, Litwa – Wilno, Rosja (graniczy Obwód Królewiecki) – Moskwa.\nGranice lądowe (ok., GUS): Czechy 796 km (najdłuższa), Słowacja 541, Ukraina 535, Niemcy 467, Białoruś 418, Rosja 210, Litwa 104 (najkrótsza). Razem ok. 3071 km; granica morska ok. 440 km.\nGranice naturalne: Morze Bałtyckie (N), Odra i Nysa Łużycka (z Niemcami), Sudety (z Czechami), Karpaty – Tatry, Pieniny, Beskidy, Bieszczady (ze Słowacją), Bug (z Ukrainą i Białorusią). Granice z Litwą i Rosją – sztuczne.\n\n## 7. Procesy kształtujące rzeźbę\nEndogeniczne (wewnętrzne, energia wnętrza Ziemi, tworzą nierówności): ruchy górotwórcze (fałdowanie), ruchy epejrogeniczne (powolne wznoszenie/obniżanie dużych obszarów, np. Skandynawia się podnosi), wulkanizm, trzęsienia ziemi.\nEgzogeniczne (zewnętrzne, energia Słońca i grawitacja, wyrównują): wietrzenie, erozja (niszczenie), transport, akumulacja (osadzanie). Czynniki: rzeki (doliny, delty), lodowce/lądolód (moreny, jeziora rynnowe, sandry, głazy narzutowe), wiatr (wydmy – Słowiński PN), morze (klify, mierzeje).\nPolska: lądolód skandynawski w czwartorzędzie (kilka zlodowaceń); ostatnie ukształtowało pas pojezierzy. Pasy rzeźby od N: pobrzeża, pojezierza, niziny, wyżyny, kotliny podgórskie, góry. Ok. 3/4 kraju poniżej 200 m n.p.m. Najwyższy szczyt: Rysy 2499 m (Tatry).\n\n## 8. Fałdowania\nKaledońskie – starszy paleozoik: Góry Skandynawskie, Grampiany; w Polsce Góry Świętokrzyskie.\nHercyńskie (waryscyjskie) – młodszy paleozoik: Ural, Harz, Masyw Centralny; w Polsce Sudety i Góry Świętokrzyskie.\nAlpejskie – mezozoik i kenozoik (trwa): Alpy, Himalaje, Andy, Pireneje, Kaukaz; w Polsce Karpaty (Tatry).\nSudety i Świętokrzyskie odmłodzone (ponownie wypiętrzone) w alpejskim. Góry stare: niskie, łagodne (Łysica 614 m, Śnieżka 1603 m). Góry młode: wysokie, ostre (Rysy 2499 m, Mount Everest 8849 m).\n\n## 9. Ery geologiczne (od najstarszej)\nArchaik (4,6–2,5 mld lat): powstanie Ziemi ok. 4,6 mld lat temu, pierwsze organizmy (bakterie, sinice ok. 3,5 mld). Proterozoik (2,5 mld – 541 mln): tlen w atmosferze, pierwsze wielokomórkowce. Archaik + proterozoik = prekambr.\nPaleozoik (541–252 mln; kambr, ordowik, sylur, dewon, karbon, perm): ryby, rośliny i zwierzęta lądowe, płazy, gady; fałdowania kaledońskie i hercyńskie; karbon – węgiel kamienny (Śląsk, Lubelszczyzna); perm – sól kamienna (Kłodawa), miedź.\nMezozoik (252–66 mln; trias, jura, kreda): dinozaury, pierwsze ssaki i ptaki, rozpad Pangei, początek fałdowania alpejskiego; wymarcie dinozaurów ok. 66 mln lat temu.\nKenozoik (66 mln – dziś; paleogen, neogen, czwartorzęd): fałdowanie alpejskie (Karpaty), ssaki; miocen – sól w Wieliczce i Bochni, siarka, węgiel brunatny; czwartorzęd (od 2,6 mln) – zlodowacenia i człowiek.\n\n## 10. Płyty litosfery\nLitosfera = skorupa + górna część płaszcza, podzielona na płyty, które przesuwają się o kilka cm rocznie. Główne: euroazjatycka, afrykańska, północnoamerykańska, południowoamerykańska, pacyficzna (największa), indoaustralijska, antarktyczna; mniejsze: nazca, kokosowa, karaibska, filipińska, arabska. Polska – środek płyty euroazjatyckiej (brak wulkanów, słabe trzęsienia).\nSkorupa oceaniczna: cienka 5–10 km, cięższa (bazalt), młoda. Kontynentalna: gruba 30–70 km, lżejsza (granit), stara.\nRozsuwanie: magma tworzy nowe dno – grzbiety śródoceaniczne (Grzbiet Śródatlantycki, Islandia), ryfty (Rów Wschodnioafrykański).\nZderzanie: subdukcja – cięższa płyta oceaniczna pod kontynentalną → rów oceaniczny, wulkany, góry (Andy: płyta nazca pod południowoamerykańską). Oceaniczna z oceaniczną → rów (Rów Mariański ok. 11 km) i łuk wysp. Kontynentalna z kontynentalną → góry fałdowe (Himalaje: płyta indoaustralijska i euroazjatycka).\nPrzesuwanie wzdłuż uskoku: San Andreas (płyta pacyficzna i północnoamerykańska) – trzęsienia ziemi.\nSkutki: trzęsienia ziemi, wulkany, tsunami, góry, rowy. Pacyficzny Pierścień Ognia.\n\n## Typowe błędy\nBrak litery N/S/E/W przy współrzędnych. Dodawanie zamiast odejmowania na tej samej półkuli. Zapominanie o 360° − suma. Minuty liczone jak dziesiętne (60&#x27; = 1°). Mylenie zwrotnika Raka (N) i Koziorożca (S). Mylenie cech południków i równoleżników.&quot;}"></elevenlabs-convai></template>

wdzian i wyżej: półkule i pułapki"}, {"id": "q30", "topic": "l4", "q": "Które współrzędne mogą oznaczać miejsce w Polsce? Warianty: A) 52°14'N, 21°01'E; B) 21°01'N, 52°14'E; C) 52°14'N, 21°01'W; D) 52°14'S, 21°01'E", "a": "A) 52°14'N, 21°01'E", "alt": "litera albo treść wariantu", "x": "Polska: szerokość 49°00'–54°50'N, długość 14°07'–24°09'E. Pasuje tylko 52°14'N, 21°01'E – to Warszawa.", "s": "wspolrzedne", "lv": 3, "st": "Szerokość i długość geograficzna – Poziom 3: Pojęcia i współrzędne Polski"}, {"id": "q31", "topic": "l6", "q": "Podaj współrzędną skrajnego punktu Polski najdalej wysuniętego na północ (Jastrzębia Góra) – szerokość (stopnie, minuty, litera).", "a": "54°50'N", "alt": "54 stopni 50 minut", "x": "Skrajne punkty Polski: N 54°50'N, S 49°00'N, W 14°07'E, E 24°09'E. Tu: 54°50'N.", "s": "sasiedzi", "lv": 5, "st": "Położenie Polski, sąsiedzi i stolice – Poziom 5: Na sprawdzian i wyżej: skrajne punkty"}, {"id": "q32", "topic": "l6", "q": "Podaj współrzędną skrajnego punktu Polski najdalej wysuniętego na południe (Opołonek) – szerokość (stopnie, minuty, litera).", "a": "49°00'N", "alt": "49 stopni 0 minut", "x": "Skrajne punkty Polski: N 54°50'N, S 49°00'N, W 14°07'E, E 24°09'E. Tu: 49°00'N.", "s": "sasiedzi", "lv": 5, "st": "Położenie Polski, sąsiedzi i stolice – Poziom 5: Na sprawdzian i wyżej: skrajne punkty"}, {"id": "q33", "topic": "l6", "q": "Podaj współrzędną skrajnego punktu Polski najdalej wysuniętego na zachód (zakole Odry k. Osinowa Dolnego) – długość (stopnie, minuty, litera).", "a": "14°07'E", "alt": "14 stopni 7 minut", "x": "Skrajne punkty Polski: N 54°50'N, S 49°00'N, W 14°07'E, E 24°09'E. Tu: 14°07'E.", "s": "granice", "lv": 4, "st": "Naturalne granice Polski – Poziom 4: Skrajne punkty na granicach"}, {"id": "q34", "topic": "l6", "q": "Podaj współrzędną skrajnego punktu Polski najdalej wysuniętego na wschód (zakole Bugu k. Zosina) – długość (stopnie, minuty, litera).", "a": "24°09'E", "alt": "24 stopni 9 minut", "x": "Skrajne punkty Polski: N 54°50'N, S 49°00'N, W 14°07'E, E 24°09'E. Tu: 24°09'E.", "s": "granice", "lv": 4, "st": "Naturalne granice Polski – Poziom 4: Skrajne punkty na granicach"}, {"id": "q35", "topic": "l5", "q": "Oblicz rozciągłość południkową obszaru między 50°20'N a 45°10'N. Podaj wynik w stopniach i minutach.", "a": "5°10'", "alt": "5 stopni 10 minut", "x": "Ta sama półkula (N) → odejmujemy: 50°20' − 45°10' = 5°10'.", "s": "rozciaglosc", "lv": 2, "st": "Rozciągłość południkowa i równoleżnikowa – Poziom 2: Ta sama półkula – odejmujemy"}, {"id": "q36", "topic": "l5", "q": "Oblicz rozciągłość południkową obszaru między 12°30'N a 8°45'S. Podaj wynik w stopniach i minutach.", "a": "21°15'", "alt": "21 stopni 15 minut", "x": "Różne półkule (N i S) → dodajemy: 12°30' + 8°45' = 20°75' = 21°15' (75' = 1°15').", "s": "rozciaglosc", "lv": 3, "st": "Rozciągłość południkowa i równoleżnikowa – Poziom 3: Różne półkule – dodajemy"}, {"id": "q37", "topic": "l5", "q": "Oblicz różnicę szerokości między kołem podbiegunowym północnym (66°33'N) a zwrotnikiem Raka (23°27'N). Podaj wynik w stopniach i minutach.", "a": "43°06'", "alt": "43 stopni 6 minut", "x": "Ta sama półkula → odejmujemy: 66°33' − 23°27' = 43°06'.", "s": "linie", "lv": 5, "st": "Linie na mapie: bieguny, koła podbiegunowe, zwrotniki, równik, południki – Poziom 5: Na sprawdzian i wyżej: odległości między liniami"}, {"id": "q38", "topic": "l5", "q": "Oblicz różnicę szerokości między zwrotnikiem Raka (23°27'N) a zwrotnikiem Koziorożca (23°27'S). Podaj wynik w stopniach i minutach.", "a": "46°54'", "alt": "46 stopni 54 minut", "x": "Różne półkule → dodajemy: 23°27' + 23°27' = 46°54'.", "s": "linie", "lv": 5, "st": "Linie na mapie: bieguny, koła podbiegunowe, zwrotniki, równik, południki – Poziom 5: Na sprawdzian i wyżej: odległości między liniami"}, {"id": "q39", "topic": "l5", "q": "Oblicz rozciągłość równoleżnikową obszaru między 30°15'E a 12°50'E. Podaj wynik w stopniach i minutach.", "a": "17°25'", "alt": "17 stopni 25 minut", "x": "Ta
