"zlodowacenia w Polsce", "kenozoik"]], "explain": "Pierwsze organizmy – archaik; węgiel kamienny – karbon (paleozoik); dinozaury – mezozoik; zlodowacenia – czwartorzęd (kenozoik)."}, {"id": "q79", "type": "mc", "tag": "l9", "q": "W którym okresie powstały złoża węgla kamiennego na Śląsku?", "options": ["w czwartorzędzie", "w jurze", "w kredzie", "w karbonie"], "answer": 3, "explain": "Nazwa **karbon** pochodzi od łac. carbo – węgiel. Wtedy z bujnych lasów paproci, skrzypów i widłaków powstał węgiel kamienny (Górnośląskie i Lubelskie Zagłębie Węglowe)."}, {"id": "q80", "type": "mc", "tag": "l9", "q": "Kiedy powstała sól kamienna w Wieliczce i Bochni?", "options": ["w karbonie", "w czwartorzędzie", "w archaiku", "w neogenie (miocenie), w kenozoiku"], "answer": 3, "explain": "Sól w Wieliczce i Bochni osadziła się w płytkim morzu w **miocenie (neogen, kenozoik)**. Starsze złoża soli (np. Kłodawa) powstały w **permie** (paleozoik)."}, {"id": "q81", "type": "mc", "tag": "l9", "q": "Kiedy wymarły dinozaury?", "options": ["w karbonie", "ok. 2,6 mln lat temu", "ok. 66 mln lat temu – na końcu mezozoiku (kreda)", "ok. 4,6 mld lat temu"], "answer": 2, "explain": "Dinozaury wymarły **ok. 66 mln lat temu**, na przełomie mezozoiku (kreda) i kenozoiku."}, {"id": "q82", "type": "mc", "tag": "l9", "q": "Ile lat ma Ziemia?", "options": ["ok. 4,6 mld lat", "ok. 66 mln lat", "ok. 10 tys. lat", "ok. 541 mln lat"], "answer": 0, "explain": "Ziemia powstała ok. **4,6 mld lat temu** – to początek archaiku."}, {"id": "q83", "type": "mc", "tag": "l9", "q": "W której erze i okresie żyjemy?", "options": ["paleozoik, perm", "proterozoik", "kenozoik, czwartorzęd", "mezozoik, kreda"], "answer": 2, "explain": "Obecnie trwa **kenozoik**, okres **czwartorzęd** (od ok. 2,6 mln lat) – czas zlodowaceń i rozwoju człowieka."}, {"id": "q84", "type": "cat", "tag": "l10", "q": "Skorupa oceaniczna czy kontynentalna?", "categories": ["oceaniczna", "kontynentalna"], "items": [{"t": "cieńsza (ok. 5–10 km)", "c": 0}, {"t": "grubsza (ok. 30–70 km)", "c": 1}, {"t": "cięższa (gęstsza)", "c": 0}, {"t": "lżejsza", "c": 1}, {"t": "młodsza", "c": 0}, {"t": "starsza", "c": 1}, {"t": "głównie bazalt", "c": 0}, {"t": "granit i skały osadowe", "c": 1}], "explain": "Oceaniczna: cienka, ciężka, młoda, bazaltowa. Kontynentalna: gruba, lżejsza, stara, z granitem i skałami osadowymi."}, {"id": "q85", "type": "match", "tag": "l10", "q": "Połącz rysunek z rodzajem ruchu płyt.", "pairs": [["rysunek 1", "rozsuwanie – grzbiet śródoceaniczny"], ["rysunek 2", "subdukcja – płyta oceaniczna pod kontynentalną"], ["rysunek 3", "zderzenie płyt kontynentalnych"], ["rysunek 4", "przesuwanie wzdłuż uskoku"]], "explain": "1 – płyty się oddalają, wypływa magma; 2 – cięższa płyta oceaniczna wsuwa się pod kontynentalną (rów, wulkan); 3 – dwie płyty kontynentalne się zgniatają (góry fałdowe); 4 – płyty mijają się bokiem.", "pairImages": ["plyty_rozsuwanie", "plyty_subdukcja", "plyty_kolizja", "plyty_przesuwanie"]}, {"id": "q86", "type": "match", "tag": "l10", "q": "Połącz przykład z rodzajem granicy płyt.", "pairs": [["Islandia, Grzbiet Śródatlantycki", "rozsuwanie"], ["Andy", "subdukcja"], ["Himalaje", "zderzenie kontynentów"], ["uskok San Andreas", "przesuwanie"]], "explain": "Islandia leży na grzbiecie śródoceanicznym (rozsuwanie). Andy – płyta nazca pod południowoamerykańską (subdukcja). Himalaje – zderzenie płyty indoaustralijskiej z euroazjatycką. San Andreas – przesuwanie."}, {"id": "q87", "type": "mc", "tag": "l10", "q": "Na której płycie leży Polska?", "options": ["afrykańskiej", "euroazjatyckiej", "północnoamerykańskiej", "pacyficznej"], "answer": 1, "explain": "Polska leży na płycie **euroazjatyckiej**, daleko od jej granic – dlatego nie mamy czynnych wulkanów ani silnych trzęsień ziemi."}, {"id": "q88", "type": "mc", "tag": "l10", "q": "Co to jest subdukcja?", "options": ["przesuwanie płyt wzdłuż uskoku", "wsuwanie się cięższej płyty oceanicznej pod inną płytę", "wypiętrzanie się lądu po ustąpieniu lądolodu", "rozsuwanie się płyt na grzbiecie"], "answer": 1, "explain": "**Subdukcja** – cięższa płyta oceaniczna zanurza się pod płytę kontynentalną (lub inną oceaniczną). Powstają rowy oceaniczne, wulkany i trzęsienia ziemi."}, {"id": "q89", "type": "mc", "tag": "l10", "q": "Jak powstał Rów Wschodnioafrykański?", "options": ["przez erozję rzeki Nil", "w wyniku zderzenia dwóch płyt kontynentalnych", "w wyniku rozsuwania się płyty litosfery na lądzie (ryft)", "przez działalność lodowca"], "answer": 2, "explain": "To **ryft** – płyta afrykańska pęka i rozsuwa się. Powstał głęboki rów z jeziorami i wulkanami (np. Kilimandżaro)."}, {"id": "q90", "type": "multi", "tag": "l10", "q": "Zaznacz **wszystkie** skutki ruchów płyt litosfery.", "options": ["trzęsienia ziemi", "powstawanie rowów oceanicznych", "powstawanie gór fałdowych", "tsunami", "pływy morskie", "wybuchy wulkanów", "pory roku"], "answer": [0, 1, 2, 3, 5], "explain": "Ruchy płyt powodują trzęsienia ziemi, wulkanizm, tsunami (po podmorskich trzęsieniach), powstawanie gór i rowów. Pory roku wynikają z ruchu obiegowego Ziemi, a pływy – z przyciągania Księżyca."}, {"id": "q91", "type": "multi", "tag": "l10", "q": "Zaznacz **główne** płyty litosfery.", "options": ["bałtycka", "północnoamerykańska", "alpejska", "euroazjatycka", "indoaustralijska", "afrykańska", "antarktyczna", "pacyficzna", "południowoamerykańska"], "answer": [1, 3, 4, 5, 6, 7, 8], "explain": "Siedem głównych płyt: euroazjatycka, afrykańska, północnoamerykańska, południowoamerykańska, pacyficzna, indoaustralijska, antarktyczna. Płyty „bałtyckiej” ani „alpejskiej” nie ma."}, {"id": "q92", "type": "mc", "tag": "l10", "q": "Gdzie występuje najwięcej wulkanów i trzęsień ziemi?", "options": ["w Australii Środkowej", "w środku Europy", "na Grenlandii", "wokół Oceanu Spokojnego (Pacyficzny Pierścień Ognia)"], "answer": 3, "explain": "Wokół Pacyfiku płyty oceaniczne wsuwają się pod inne płyty – to **Pacyficzny Pierścień Ognia** z większością czynnych wulkanów i najsilniejszymi trzęsieniami ziemi."}], "explainPrompts": [{"id": "e1", "tag": "l2", "prompt": "Porównaj cechy południków i równoleżników (co najmniej po 3 cechy).", "keyPoints": ["południki – półokręgi, równoleżniki – okręgi", "południki jednakowej długości; równoleżniki coraz krótsze ku biegunom", "południki łączą bieguny i wyznaczają N–S", "równoleżniki są równoległe i wyznaczają W–E", "równik – najdłuższy równoleżnik, 0° – Greenwich"], "model": "Południki to półokręgi o jednakowej długości, które łączą bieguny, zbiegają się na nich i wyznaczają kierunek północ–południe; początkowy to 0° (Greenwich), naprzeciw niego leży 180°. Równoleżniki to okręgi równoległe do siebie, wyznaczają kierunek wschód–zachód; najdłuższy jest równik, a ku biegunom są coraz krótsze – bieguny to już punkty."}, {"id": "e2", "tag": "l5", "prompt": "Wyjaśnij krok po kroku, jak obliczyć rozciągłość równoleżnikową dwóch punktów. Podaj przykład dla różnych półkul z sumą większą niż 180°.", "keyPoints": ["sprawdzam, na jakich półkulach są punkty", "ta sama półkula – odejmuję, różne – dodaję", "suma > 180° → 360° − suma", "minuty: pożyczam lub zamieniam 60' na 1°", "przykład, np. 150°E i 160°W → 50°"], "model": "Najpierw sprawdzam, czy punkty leżą na tej samej półkuli (obie E albo obie W) – wtedy odejmuję – czy na różnych – wtedy dodaję. Jeśli przy długości suma przekracza 180°, liczę krótszą drogę: 360° minus suma. Np. 150°E i 160°W: 150° + 160° = 310°, więc 360° − 310° = 50°. Przy minutach pożyczam 1° = 60' albo zamieniam 60' na 1°."}, {"id": "e3", "tag": "l6", "prompt": "Wymień sąsiadów Polski z ich stolicami i opisz naturalne granice Polski.", "keyPoints": ["7 sąsiadów ze stolicami", "Bałtyk na północy", "Odra i Nysa Łużycka z Niemcami", "Sudety z Czechami, Karpaty ze Słowacją", "Bug na wschodzie"], "model": "Polska graniczy z Niemcami (Berlin), Czechami (Praga), Słowacją (Bratysława), Ukrainą (Kijów), Białorusią (Mińsk), Litwą (Wilno) i Rosją – Obwodem Królewieckim (Moskwa). Naturalne granice to: Morze Bałtyckie na północy, Odra i Nysa Łużycka na zachodzie, Sudety na południowym zachodzie, Karpaty z Tatrami na południu oraz Bug na wschodzie. Najdłuższa granica jest z Czechami, najkrótsza z Litwą."}, {"id": "e4", "tag": "l8", "prompt": "Opisz trzy fałdowania: kiedy zachodziły i jakie góry (na świecie i w Polsce) wtedy powstały.", "keyPoints": ["kaledońskie – starszy paleozoik – Góry Skandynawskie, Świętokrzyskie", "hercyńskie – młodszy paleozoik – Ural, Sudety, Świętokrzyskie", "alpejskie – mezozoik/kenozoik – Alpy, Himalaje, Andy, Karpaty", "Sudety odmłodzone w alpejskim"], "model": "Fałdowanie kaledońskie zachodziło w starszym paleozoiku – powstały m.in. Góry Skandynawskie, a w Polsce część Gór Świętokrzyskich. Hercyńskie – w młodszym paleozoiku: Ural, Sudety i ponownie Góry Świętokrzyskie. Alpejskie trwa od mezozoiku do dziś: Alpy, Himalaje, Andy i Karpaty. W fałdowaniu alpejskim Sudety zostały odmłodzone, czyli ponownie wypiętrzone."}, {"id": "e5", "tag": "l10", "prompt": "Opisz trzy rodzaje ruchów płyt litosfery i ich skutki. Podaj przykłady.", "keyPoints": ["rozsuwanie – grzbiety śródoceaniczne, ryfty (Islandia, Rów Wschodnioafrykański)", "zderzanie – subdukcja: rowy, wulkany, Andy; kolizja kontynentów: Himalaje", "przesuwanie – uskoki, trzęsienia ziemi (San Andreas)", "skutki: trzęsienia ziemi, wulkany, tsunami"], "model": "Gdy płyty się rozsuwają, wypływa magma i powstają grzbiety śródoceaniczne (Islandia) lub ryfty na lądzie (Rów Wschodnioafrykański). Gdy się zderzają, cięższa płyta oceaniczna wsuwa się pod kontynentalną (subdukcja) – powstają rowy oceaniczne, wulkany i góry, np. Andy; zderzenie dwóch płyt kontynentalnych wypiętrza góry fałdowe, np. Himalaje. Gdy płyty przesuwają się wzdłuż uskoku, np. San Andreas, dochodzi do silnych trzęsień ziemi. Skutkami ruchów płyt są też wybuchy wulkanów i tsunami."}, {"id": "e6", "tag": "l7", "prompt": "Wyjaśnij różnicę między procesami endogenicznymi a egzogenicznymi i opisz, jak lądolód ukształtował Polskę.", "keyPoints": ["endogeniczne – z wnętrza Ziemi, tworzą nierówności (góry, wulkany, trzęsienia, epejrogeneza)", "egzogeniczne – zewnętrzne (wietrzenie, erozja, akumulacja), wyrównują", "lądolód skandynawski w czwartorzędzie", "pojezierza na północy – moreny, jeziora"], "model": "Procesy endogeniczne mają źródło we wnętrzu Ziemi – to ruchy górotwórcze i epejrogeniczne, wulkanizm i trzęsienia ziemi; tworzą nierówności. Procesy egzogeniczne działają z zewnątrz – wietrzenie, erozja i akumulacja przez rzeki, lodowce, wiatr i morze; wyrównują teren. W czwartorzędzie Polskę kilka razy pokrywał lądolód skandynawski; ostatni ukształtował pas pojezierzy z morenami i jeziorami na północy."}], "mockTest": {"id": "praca-klasowa-a", "title": "Praca klasowa – grupa A", "minutes": 45, "gradeScale": [[0, "niedostateczny"], [31, "dopuszczający"], [51, "dostateczny"], [71, "dobry"], [86, "bardzo dobry"], [98, "celujący"]], "intro": "Sprawdzian w stylu szkolnej pracy klasowej: zadania z punktacją, jak na kartce. Masz **45 minut**. Licz na brudnopisie, w okienka wpisuj wyniki w stopniach i minutach (np. **39°15'** albo **39 15**). Po oddaniu przy każdym zadaniu zobaczysz wyjaśnienie. Grupę B wybierzesz przyciskiem na górze tej zakładki.", "tasks": [{"id": "a1", "type": "match", "tag": "l1", "q": "**Zad. 1.** Podaj nazwy kierunków oznaczonych na róży wiatrów cyframi.", "pairs": [["1", "NE – północny wschód"], ["3", "SE – południowy wschód"], ["5", "SW – południowy zachód"], ["6", "W – zachód"]], "explain": "Od N zgodnie z ruchem wskazówek zegara: 1 NE, 2 E, 3 SE, 4 S, 5 SW, 6 W, 7 NW.", "image": "roza_cyfry"}, {"id": "a2", "type": "mc", "tag": "l1", "q": "**Zad. 2.** W którą stronę świata wskazuje w Polsce cień patyka w południe?", "options": ["na południe", "na zachód", "na północ", "na wschód"], "answer": 2, "explain": "W południe Słońce jest w Polsce na południu, więc cień pada na **północ**."}, {"id": "a3", "type": "tf", "tag": "l2", "q": "**Zad. 3.** Oceń prawdziwość zdań o siatce geograficznej.", "items": [{"s": "Wszystkie południki mają jednakową długość.", "a": true}, {"s": "Równoleżniki zbiegają się na biegunach.", "a": false}, {"s": "Równik jest najdłuższym równoleżnikiem.", "a": true}, {"s": "Południki wyznaczają kierunek wschód–zachód.", "a": false}], "explain": "Na biegunach zbiegają się **południki**; południki wyznaczają kierunek **N–S** (równoleżniki – W–E). Pozostałe zdania są prawdziwe."}, {"id": "a4", "type": "match", "tag": "l3", "q": "**Zad. 4.** Podpisz linie i punkty oznaczone na rysunku literami.", "pairs": [["A", "koło podbiegunowe północne"], ["B", "zwrotnik Raka"], ["C", "równik"], ["D", "zwrotnik Koziorożca"], ["H", "południk 0°"]], "explain": "F – Biegun Północny, A – koło podbiegunowe płn. 66°33'N, B – zwrotnik Raka 23°27'N, C – równik 0°, D – zwrotnik Koziorożca 23°27'S, E – koło podbiegunowe płd. 66°33'S, G – Biegun Południowy, H – południk 0°.", "image": "glob_litery"}, {"id": "a5", "type": "mc", "tag": "l4", "q": "**Zad. 5.** Podaj współrzędne geograficzne punktu **A** z rysunku.", "options": ["60°N, 30°E", "60°S, 30°E", "30°N, 60°E", "60°N, 30°W"], "answer": 0, "explain": "A: 60° nad równikiem (N), 30° na wschód od południka 0° (E) → **60°N, 30°E**.", "image": "siatka_punkty"}, {"id": "a6", "type": "short", "tag": "l4", "q": "**Zad. 6.** Odczytaj z tego samego rysunku szerokość geograficzną punktu **B** (z literą).", "accept": ["30°00'S"], "dm": [30, 0], "explain": "B leży 30° pod równikiem → **30°S** (długość 60°W).", "dmDir": "S"}, {"id": "a7", "type": "mc", "tag": "l3", "q": "**Zad. 7.** Na których półkulach leży punkt **E** z rysunku (60°S, 150°E)?", "options": ["południowej i zachodniej", "południowej i wschodniej", "północnej i wschodniej", "północnej i zachodniej"], "answer": 1, "explain": "S → półkula południowa, E → półkula wschodnia."}, {"id": "a8", "type": "short", "tag": "l5", "q": "**Zad. 8.** Oblicz rozciągłość południkową obszaru między 23°45'N a 15°30'S.", "accept": ["39°15'"], "dm": [39, 15], "explain": "Różne półkule → dodajemy: 23°45' + 15°30' = 38°75' = **39°15'**.", "points": 2}, {"id": "a9", "type": "short", "tag": "l5", "q": "**Zad. 9.** Oblicz rozciągłość równoleżnikową obszaru między 135°20'E a 110°50'W.", "accept": ["113°50'"], "dm": [113, 50], "explain": "Różne półkule → 135°20' + 110°50' = 245°70' = 246°10'. To więcej niż 180°, więc: 360° − 246°10' = 359°60' − 246°10' = **113°50'**.", "points": 2}, {"id": "a10", "type": "short", "tag": "l5", "q": "**Zad. 10.** Oblicz rozciągłość południkową obszaru między 47°10'N a 39°35'N.", "accept": ["7°35'"], "dm": [7, 35], "explain": "Ta sama półkula → odejmujemy, pożyczając 1°: 47°10' = 46°70'; 46°70' − 39°35' = **7°35'**.", "points": 2}, {"id": "a11", "type": "short", "tag": "l5", "q": "**Zad. 11.** Oblicz odległość w km między punktami na tym samym południku: 50°00'N i 46°30'N (1° ≈ 111,2 km).", "accept": ["389,2 km", "389,2"], "num": 389.2, "explain": "Różnica: 50°00' − 46°30' = 3°30' = 3,5°. Odległość: 3,5 × 111,2 = **389,2 km**.", "tol": 1.5, "points": 2}, {"id": "a12", "type": "match", "tag": "l6", "q": "**Zad. 12.** Podaj nazwy państw oznaczonych na mapie cyframi.", "pairs": [["1", "Niemcy"], ["2", "Czechy"], ["3", "Słowacja"], ["5", "Białoruś"], ["6", "Litwa"]], "explain": "1 Niemcy, 2 Czechy, 3 Słowacja, 4 Ukraina, 5 Białoruś, 6 Litwa, 7 Rosja (Obwód Królewiecki).", "image": "mapa_numery"}, {"id": "a13", "type": "match", "tag": "l6", "q": "**Zad. 13.** Połącz państwa z ich stolicami.", "pairs": [["Czechy", "Praga"], ["Słowacja", "Bratysława"], ["Ukraina", "Kijów"], ["Litwa", "Wilno"]], "explain": "Niemcy – Berlin, Czechy – Praga, Słowacja – Bratysława, Ukraina – Kijów, Białoruś – Mińsk, Litwa – Wilno, Rosja – Moskwa."}, {"id": "a14", "type": "multi", "tag": "l6", "q": "**Zad. 14.** Zaznacz **wszystkie** obiekty, wzdłuż których biegnie granica Polski.", "options": ["Wisła", "Sudety", "Odra", "Nysa Łużycka", "Warta", "Bug"], "answer": [1, 2, 3, 5], "explain": "Granica biegnie wzdłuż Odry i Nysy Łużyckiej (z Niemcami), Sudetów (z Czechami) i Bugu (z Ukrainą i Białorusią). Wisła i Warta płyną w głębi kraju."}, {"id": "a15", "type": "cat", "tag": "l7", "q": "**Zad. 15.** Przyporządkuj procesy do odpowiedniej grupy.", "categories": ["endogeniczne", "egzogeniczne"], "items": [{"t": "wulkanizm", "c": 0}, {"t": "ruchy górotwórcze", "c": 0}, {"t": "ruchy epejrogeniczne", "c": 0}, {"t": "wietrzenie", "c": 1}, {"t": "erozja", "c": 1}, {"t": "akumulacja lodowcowa", "c": 1}], "explain": "Endogeniczne – energia z wnętrza Ziemi (ruchy skorupy, wulkany, trzęsienia). Egzogeniczne – działają na powierzchni (wietrzenie, erozja, akumulacja: rzeki, lodowce, wiatr, morze)."}, {"id": "a16", "type": "cat", "tag": "l8", "q": "**Zad. 16.** Przyporządkuj góry do fałdowań.", "categories": ["kaledońskie", "hercyńskie", "alpejskie"], "items": [{"t": "Góry Skandynawskie", "c": 0}, {"t": "Ural", "c": 1}, {"t": "Sudety", "c": 1}, {"t": "Himalaje", "c": 2}, {"t": "Karpaty", "c": 2}, {"t": "Andy", "c": 2}], "explain": "Kaledońskie: Góry Skandynawskie, Grampiany. Hercyńskie: Ural, Sudety, Harz. Alpejskie: Alpy, Himalaje, Andy, Karpaty, Pireneje."}, {"id": "a17", "type": "order", "tag": "l9", "q": "**Zad. 17.** Ułóż ery geologiczne od najstarszej do najmłodszej.", "items": ["archaik", "proterozoik", "paleozoik", "mezozoik", "kenozoik"], "explain": "Archaik → proterozoik → paleozoik → mezozoik → kenozoik.", "points": 2}, {"id": "a18", "type": "mc", "tag": "l9", "q": "**Zad. 18.** W której erze powstał węgiel kamienny na Śląsku?", "options": ["w paleozoiku (karbon)", "w mezozoiku (jura)", "w kenozoiku (czwartorzęd)", "w archaiku"], "answer": 0, "explain": "Węgiel kamienny powstał w **karbonie** – okresie **paleozoiku** – z lasów paproci, skrzypów i widłaków."}, {"id": "a19", "type": "match", "tag": "l10", "q": "**Zad. 19.** Przyporządkuj rysunkom rodzaj ruchu płyt litosfery.", "pairs": [["rysunek 1", "subdukcja"], ["rysunek 2", "rozsuwanie"], ["rysunek 3", "przesuwanie wzdłuż uskoku"]], "explain": "Rozsuwanie – magma tworzy nowe dno; subdukcja – płyta oceaniczna pod kontynentalną; kolizja – dwie płyty kontynentalne wypiętrzają góry; przesuwanie – płyty mijają się wzdłuż uskoku.", "pairImages": ["plyty_subdukcja", "plyty_rozsuwanie", "plyty_przesuwanie"]}, {"id": "a20", "type": "mc", "tag": "l10", "q": "**Zad. 20.** Która cecha dotyczy skorupy **oceanicznej**?", "options": ["jest grubsza i lżejsza od kontynentalnej", "jest cieńsza i cięższa od kontynentalnej", "jest starsza od kontynentalnej", "zbudowana jest głównie z granitu"], "answer": 1, "explain": "Skorupa oceaniczna jest **cienka (5–10 km), cięższa** i młodsza; kontynentalna – gruba, lżejsza, stara (granit)."}, {"id": "a21", "type": "open", "tag": "l10", "q": "**Zad. 21.** Wyjaśnij, jak powstały Andy. Użyj nazw płyt i pojęcia subdukcja. Podaj dwa skutki tego procesu.", "keyPoints": ["płyta nazca (oceaniczna) zderza się z płytą południowoamerykańską (kontynentalną)", "cięższa płyta oceaniczna wsuwa się pod kontynentalną – subdukcja", "skały na krawędzi kontynentu fałdują się i wypiętrzają – Andy", "skutki: wulkany, trzęsienia ziemi, rów oceaniczny (Atakamski)"], "model": "Andy powstały na styku oceanicznej płyty nazca i kontynentalnej płyty południowoamerykańskiej. Cięższa płyta oceaniczna wsuwa się pod kontynentalną (subdukcja), a skały na krawędzi kontynentu fałdują się i wypiętrzają. Skutkami są czynne wulkany, częste trzęsienia ziemi i głęboki Rów Atakamski u wybrzeży.", "points": 4, "explain": "Za każdy element 1 pkt."}]}, "mocks": [{"id": "praca-klasowa-b", "title": "Praca klasowa – grupa B", "minutes": 45, "gradeScale": [[0, "niedostateczny"], [31, "dopuszczający"], [51, "dostateczny"], [71, "dobry"], [86, "bardzo dobry"], [98, "celujący"]], "intro": "Druga wersja pracy klasowej (inne liczby i przykłady). **45 minut**, wyniki rozciągłości wpisuj w stopniach i minutach (np. **58°50'**).", "tasks": [{"id": "b1", "type": "match", "tag": "l1", "q": "**Zad. 1.** Podaj nazwy kierunków oznaczonych na róży wiatrów cyframi.", "pairs": [["2", "E – wschód"], ["4", "S – południe"], ["7", "NW – północny zachód"], ["1", "NE – północny wschód"]], "explain": "Od N zgodnie z ruchem wskazówek zegara: 1 NE, 2 E, 3 SE, 4 S, 5 SW, 6 W, 7 NW.", "image": "roza_cyfry"}, {"id": "b2", "type": "mc", "tag": "l1", "q": "**Zad. 2.** Który kierunek wskazuje Gwiazda Polarna?", "options": ["zachód", "południe", "wschód", "północ"], "answer": 3, "explain": "Gwiazda Polarna świeci prawie dokładnie nad Biegunem Północnym – wskazuje **północ**."}, {"id": "b3", "type": "tf", "tag": "l2", "q": "**Zad. 3.** Oceń prawdziwość zdań o siatce geograficznej.", "items": [{"s": "Południki łączą bieguny.", "a": true}, {"s": "Wszystkie równoleżniki mają jednakową długość.", "a": false}, {"s": "Bieguny są punktami o szerokości 90°.", "a": true}, {"s": "Południk 180° przechodzi przez Greenwich.", "a": false}], "explain": "Równoleżniki mają **różną** długość (maleje ku biegunom). Przez Greenwich przechodzi południk **0°**, a 180° leży po przeciwnej stronie Ziemi."}, {"id": "b4", "type": "match", "tag": "l3", "q": "**Zad. 4.** Podpisz linie i punkty oznaczone na rysunku literami.", "pairs": [["B", "zwrotnik Raka"], ["C", "równik"], ["E", "koło podbiegunowe południowe"], ["F", "Biegun Północny"], ["D", "zwrotnik Koziorożca"]], "explain": "F – Biegun Północny, A – koło podbiegunowe płn. 66°33'N, B – zwrotnik Raka 23°27'N, C – równik 0°, D – zwrotnik Koziorożca 23°27'S, E – koło podbiegunowe płd. 66°33'S, G – Biegun Południowy, H – południk 0°.", "image": "glob_litery"}, {"id": "b5", "type": "mc", "tag": "l4", "q": "**Zad. 5.** Podaj współrzędne geograficzne punktu **D** z rysunku.", "options": ["30°S, 120°W", "120°N, 30°W", "30°N, 120°E", "30°N, 120°W"], "answer": 3, "explain": "D: 30° nad równikiem (N), 120° na zachód od południka 0° (W) → **30°N, 120°W**.", "image": "siatka_punkty"}, {"id": "b6", "type": "short", "tag": "l4", "q": "**Zad. 6.** Odczytaj z tego samego rysunku długość geograficzną punktu **E** (z literą).", "accept": ["150°00'E"], "dm": [150, 0], "explain": "E leży 150° na wschód od południka 0° → **150°E** (szerokość 60°S).", "dmDir": "E"}, {"id": "b7", "type": "mc", "tag": "l3", "q": "**Zad. 7.** Na których półkulach leży punkt **B** z rysunku (30°S, 60°W)?", "options": ["północnej i zachodniej", "północnej i wschodniej", "południowej i wschodniej", "południowej i zachodniej"], "answer": 3, "explain": "S → półkula południowa, W → półkula zachodnia."}, {"id": "b8", "type": "short", "tag": "l5", "q": "**Zad. 8.** Oblicz rozciągłość południkową obszaru między 8°20'N a 41°50'S.", "accept": ["50°10'"], "dm": [50, 10], "explain": "Różne półkule → dodajemy: 8°20' + 41°50' = 49°70' = **50°10'**.", "points": 2}, {"id": "b9", "type": "short", "tag": "l5", "q": "**Zad. 9.** Oblicz rozciągłość równoleżnikową obszaru między 160°15'W a 140°55'E.", "accept": ["58°50'"], "dm": [58, 50], "explain": "Różne półkule → 160°15' + 140°55' = 300°70' = 301°10' > 180°, więc 360° − 301°10' = 359°60' − 301°10' = **58°50'**.", "points": 2}, {"id": "b10", "type": "short", "tag": "l5", "q": "**Zad. 10.** Oblicz rozciągłość równoleżnikową obszaru między 72°05'E a 28°40'E.", "accept": ["43°25'"], "dm": [43, 25], "explain": "Ta sama półkula → odejmujemy, pożyczając 1°: 72°05' = 71°65'; 71°65' − 28°40' = **43°25'**.", "points": 2}, {"id": "b11", "type": "short", "tag": "l5", "q": "**Zad. 11.** Oblicz odległość w km między punktami na tym samym południku: 54°00'N i 49°30'N (1° ≈ 111,2 km).", "accept": ["500,4 km", "500,4"], "num": 500.4, "explain": "Różnica: 54°00' − 49°30' = 4°30' = 4,5°. Odległość: 4,5 × 111,2 = **500,4 km**.", "tol": 1.5, "points": 2}, {"id": "b12", "type": "match", "tag": "l6", "q": "**Zad. 12.** Podaj nazwy państw oznaczonych na mapie cyframi.", "pairs": [["2", "Czechy"], ["3", "Słowacja"], ["4", "Ukraina"], ["5", "Białoruś"], ["7", "Rosja"]], "explain": "1 Niemcy, 2 Czechy, 3 Słowacja, 4 Ukraina, 5 Białoruś, 6 Litwa, 7 Rosja (Obwód Królewiecki).", "image": "mapa_numery"}, {"id": "b13", "type": "match", "tag": "l6", "q": "**Zad. 13.** Połącz państwa z ich stolicami.", "pairs": [["Niemcy", "Berlin"], ["Białoruś", "Mińsk"], ["Rosja", "Moskwa"], ["Czechy", "Praga"]], "explain": "Niemcy – Berlin, Czechy – Praga, Słowacja – Bratysława, Ukraina – Kijów, Białoruś – Mińsk, Litwa – Wilno, Rosja – Moskwa."}, {"id": "b14", "type": "mc", "tag": "l6", "q": "**Zad. 14.** Z którym państwem Polska ma najdłuższą granicę lądową?", "options": ["z Niemcami", "z Czechami", "z Białorusią", "z Litwą"], "answer": 1, "explain": "Najdłuższa – z **Czechami** (ok. 796 km), najkrótsza – z Litwą (ok. 104 km)."}, {"id": "b15", "type": "cat", "tag": "l7", "q": "**Zad. 15.** Przyporządkuj procesy do odpowiedniej grupy.", "categories": ["endogeniczne", "egzogeniczne"], "items": [{"t": "trzęsienia ziemi", "c": 0}, {"t": "fałdowanie skał", "c": 0}, {"t": "wybuch wulkanu", "c": 0}, {"t": "powstawanie wydm", "c": 1}, {"t": "tworzenie klifu przez fale", "c": 1}, {"t": "pogłębianie doliny przez rzekę", "c": 1}], "explain": "Endogeniczne – energia z wnętrza Ziemi (ruchy skorupy, wulkany, trzęsienia). Egzogeniczne – działają na powierzchni (wietrzenie, erozja, akumulacja: rzeki, lodowce, wiatr, morze)."}, {"id": "b16", "type": "cat", "tag": "l8", "q": "**Zad. 16.** Przyporządkuj góry do fałdowań.", "categories": ["kaledońskie", "hercyńskie", "alpejskie"], "items": [{"t": "Grampiany (Szkocja)", "c": 0}, {"t": "Harz", "c": 1}, {"t": "Ural", "c": 1}, {"t": "Alpy", "c": 2}, {"t": "Pireneje", "c": 2}, {"t": "Karpaty", "c": 2}], "explain": "Kaledońskie: Góry Skandynawskie, Grampiany. Hercyńskie: Ural, Sudety, Harz. Alpejskie: Alpy, Himalaje, Andy, Karpaty, Pireneje."}, {"id": "b17", "type": "order", "tag": "l9", "q": "**Zad. 17.** Ułóż wydarzenia od najstarszego do najmłodszego.", "items": ["powstanie Ziemi", "pierwsze organizmy", "powstanie węgla kamiennego", "panowanie dinozaurów", "zlodowacenia w Polsce"], "explain": "Ziemia (4,6 mld lat) → pierwsze organizmy (archaik) → węgiel (karbon, paleozoik) → dinozaury (mezozoik) → zlodowacenia (czwartorzęd, kenozoik).", "points": 2}, {"id": "b18", "type": "mc", "tag": "l9", "q": "**Zad. 18.** W której erze powstały Karpaty i żyjemy obecnie?", "options": ["w mezozoiku", "w kenozoiku", "w paleozoiku", "w proterozoiku"], "answer": 1, "explain": "Fałdowanie alpejskie, które wypiętrzyło Karpaty, osiągnęło szczyt w **kenozoiku** – erze, która trwa do dziś."}, {"id": "b19", "type": "match", "tag": "l10", "q": "**Zad. 19.** Przyporządkuj rysunkom rodzaj ruchu płyt litosfery.", "pairs": [["rysunek 1", "zderzenie płyt kontynentalnych"], ["rysunek 2", "rozsuwanie"], ["rysunek 3", "subdukcja"]], "explain": "Rozsuwanie – magma tworzy nowe dno; subdukcja – płyta oceaniczna pod kontynentalną; kolizja – dwie płyty kontynentalne wypiętrzają góry; przesuwanie – płyty mijają się wzdłuż uskoku.", "pairImages": ["plyty_kolizja", "plyty_rozsuwanie", "plyty_subdukcja"]}, {"id": "b20", "type": "mc", "tag": "l10", "q": "**Zad. 20.** Co powstaje w miejscu rozsuwania się płyt na dnie oceanu?", "options": ["uskok San Andreas", "grzbiet śródoceaniczny", "góry fałdowe jak Himalaje", "rów oceaniczny"], "answer": 1, "explain": "Przy rozsuwaniu wypływa magma i buduje **grzbiet śródoceaniczny** (np. Grzbiet Śródatlantycki z Islandią)."}, {"id": "b21", "type": "open", "tag": "l10", "q": "**Zad. 21.** Wyjaśnij, jak powstały Himalaje i dlaczego wciąż występują tam trzęsienia ziemi.", "keyPoints": ["płyta indoaustralijska zderza się z euroazjatycką", "obie są płytami kontynentalnymi – żadna nie wsuwa się łatwo pod drugą", "skały fałdują się i wypiętrzają – góry fałdowe (fałdowanie alpejskie)", "płyty nadal na siebie napierają – trzęsienia ziemi"], "model": "Himalaje powstały w wyniku zderzenia kontynentalnej płyty indoaustralijskiej z płytą euroazjatycką. Obie płyty są lekkie, więc skały na ich styku zostały zgniecione, sfałdowane i wypiętrzone – to góry fałdowe powstałe w fałdowaniu alpejskim. Płyty wciąż na siebie napierają, dlatego występują tam trzęsienia ziemi, a góry nadal rosną.", "points": 4, "explain": "Za każdy element 1 pkt."}]}, {"id": "sprawdzian-cw-1", "title": "Sprawdzian ćwiczeniowy 1", "minutes": 45, "gradeScale": [[0, "niedostateczny"], [31, "dopuszczający"], [51, "dostateczny"], [71, "dobry"], [86, "bardzo dobry"], [98, "celujący"]], "intro": "Ćwiczeniowa wersja pracy klasowej – **ten sam zakres** co grupy A i B (11 zagadnień), ale **inne pytania, liczby i kolejność**. **45 minut**. Rozciągłość wpisuj w stopniach i minutach (np. **39°15'** albo **39 15**), współrzędne z literą (np. **60°W**). Po oddaniu zobaczysz wyjaśnienia; wynik trafia do rodzica.", "tasks": [{"id": "g1t1", "type": "short", "tag": "l4", "q": "**Zad. 1.** Odczytaj z tego samego rysunku długość geograficzną punktu **B** (z literą).", "accept": ["60°00'W"], "dm": [60, 0], "explain": "B leży 60° na lewo (na zachód) od południka 0° → **60°W** (szerokość 30°S).", "dmDir": "W"}, {"id": "g1t2", "type": "mc", "tag": "l10", "q": "**Zad. 2.** Dlaczego w Polsce nie ma czynnych wulkanów, a trzęsienia ziemi są słabe?", "options": ["Polska leży w środku płyty euroazjatyckiej, z dala od granic płyt", "Polska leży na granicy dwóch płyt", "w Polsce nie ma gór", "lądolód zasypał wulkany"], "answer": 0, "explain": "Wulkany i silne trzęsienia występują na **granicach płyt**. Polska leży w **środku płyty euroazjatyckiej**."}, {"id": "g1t3", "type": "mc", "tag": "l8", "q": "**Zad. 3.** Dlaczego Rysy (2499 m) są wyższe od Śnieżki (1603 m)?", "options": ["Śnieżka leży na nizinie", "Tatry są wulkanem", "Sudety powstały później niż Tatry", "Tatry to góry młode (alpejskie), mniej zniszczone przez erozję"], "answer": 3, "explain": "Tatry (Karpaty) powstały w **fałdowaniu alpejskim** – są młode, wysokie i ostre. Sudety są stare (hercyńskie), długo niszczone, dlatego niższe."}, {"id": "g1t4", "type": "tf", "tag": "l2", "q": "**Zad. 4.** Oceń prawdziwość zdań o siatce geograficznej.", "items": [{"s": "Południki mają kształt półokręgów.", "a": true}, {"s": "Długość równoleżników rośnie w kierunku biegunów.", "a": false}, {"s": "Południk 0° przechodzi przez Greenwich (Londyn).", "a": true}, {"s": "Równoleżniki wyznaczają kierunek północ–południe.", "a": false}], "explain": "Równoleżniki są coraz **krótsze** ku biegunom i wyznaczają kierunek **W–E**; kierunek N–S wyznaczają południki."}, {"id": "g1t5", "type": "short", "tag": "l5", "q": "**Zad. 5.** Oblicz rozciągłość południkową obszaru między 61°25'N a 44°50'N.", "accept": ["16°35'"], "dm": [16, 35], "explain": "Ta sama półkula (N i N) → **odejmujemy**: 61°25' = 60°85'; 60°85' − 44°50' = **16°35'**.", "points": 2}, {"id": "g1t6", "type": "mc", "tag": "l1", "q": "**Zad. 6.** Jaki kierunek jest przeciwny do południowego wschodu (SE)?", "options": ["północny zachód (NW)", "południe (S)", "północny wschód (NE)", "południowy zachód (SW)"], "answer": 0, "explain": "Kierunki przeciwne leżą naprzeciw siebie na róży wiatrów: SE ↔ **NW** (tak jak NE ↔ SW)."}, {"id": "g1t7", "type": "mc", "tag": "l7", "q": "**Zad. 7.** Co ukształtowało pas pojezierzy w północnej Polsce?", "options": ["lądolód skandynawski w czwartorzędzie", "Morze Bałtyckie w paleozoiku", "fałdowanie alpejskie", "wybuchy wulkanów w mezozoiku"], "answer": 0, "explain": "Pojezierza ukształtował **lądolód skandynawski** podczas ostatniego zlodowacenia w **czwartorzędzie**."}, {"id": "g1t8", "type": "short", "tag": "l5", "q": "**Zad. 8.** Oblicz odległość w km między punktami na tym samym południku: 50°45'N i 49°00'N (1° ≈ 111,2 km).", "accept": ["194,6 km", "194,6"], "num": 194.6, "explain": "Różnica: 1°45' = 1,75°. Odległość: 1,75 × 111,2 km ≈ **194,6 km**.", "tol": 1.5, "points": 2}, {"id": "g1t9", "type": "match", "tag": "l3", "q": "**Zad. 9.** Podpisz linie i punkty oznaczone na rysunku literami.", "pairs": [["A", "koło podbiegunowe północne"], ["D", "zwrotnik Koziorożca"], ["G", "Biegun Południowy"], ["H", "południk 0°"]], "explain": "F – Biegun Północny, A – koło podbiegunowe płn. 66°33'N, B – zwrotnik Raka 23°27'N, C – równik 0°, D – zwrotnik Koziorożca 23°27'S, E – koło podbiegunowe płd. 66°33'S, G – Biegun Południowy, H – południk 0°.", "image": "glob_litery"}, {"id": "g1t10", "type": "cat", "tag": "l8", "q": "**Zad. 10.** Przyporządkuj góry do fałdowań, w których powstały.", "categories": ["kaledońskie", "hercyńskie", "alpejskie"], "items": [{"t": "Grampiany", "c": 0}, {"t": "Góry Skandynawskie", "c": 0}, {"t": "Ural", "c": 1}, {"t": "Harz", "c": 1}, {"t": "Andy", "c": 2}, {"t": "Kaukaz", "c": 2}], "explain": "Kaledońskie (starszy paleozoik): Góry Skandynawskie, Grampiany. Hercyńskie (młodszy paleozoik): Ural, Harz, Sudety. Alpejskie (mezozoik i kenozoik): Alpy, Himalaje, Andy, Pireneje, Kaukaz, Karpaty."}, {"id": "g1t11", "type": "mc", "tag": "l9", "q": "**Zad. 11.** W której erze żyły i wymarły dinozaury?", "options": ["w proterozoiku", "w kenozoiku", "w paleozoiku", "w mezozoiku"], "answer": 3, "explain": "Dinozaury panowały w **mezozoiku** (trias, jura, kreda) i wymarły ok. 66 mln lat temu, na końcu tej ery."}, {"id": "g1t12", "type": "short", "tag": "l3", "q": "**Zad. 12.** Podaj szerokość geograficzną zwrotnika Koziorożca (z literą).", "accept": ["23°27'S"], "dm": [23, 27], "explain": "Zwrotnik Koziorożca leży na półkuli południowej: **23°27'S** (zwrotnik Raka – 23°27'N).", "dmDir": "S"}, {"id": "g1t13", "type": "cat", "tag": "l2", "q": "**Zad. 13.** Przyporządkuj cechy do południków lub równoleżników.", "categories": ["cecha południków", "cecha równoleżników"], "items": [{"t": "łączą bieguny", "c": 0}, {"t": "są okręgami", "c": 1}, {"t": "mają jednakową długość (ok. 20 000 km)", "c": 0}, {"t": "najdłuższy ma ok. 40 000 km", "c": 1}, {"t": "zbiegają się na biegunach", "c": 0}, {"t": "są do siebie równoległe", "c": 1}], "explain": "Południki: półokręgi, jednakowa długość, łączą bieguny i tam się zbiegają, kierunek N–S. Równoleżniki: okręgi, równoległe, różnej długości (najdłuższy równik ok. 40 000 km), kierunek W–E."}, {"id": "g1t14", "type": "short", "tag": "l5", "q": "**Zad. 14.** Oblicz rozciągłość równoleżnikową obszaru między 145°30'E a 120°45'W.", "accept": ["93°45'"], "dm": [93, 45], "explain": "Różne półkule (E i W) → **dodajemy**: 145°30' + 120°45' = 265°75' = 266°15'. To więcej niż 180°, więc 360° − 266°15' = **93°45'**.", "points": 2}, {"id": "g1t15", "type": "order", "tag": "l9", "q": "**Zad. 15.** Ułóż ery geologiczne **od najmłodszej do najstarszej**.", "items": ["kenozoik", "mezozoik", "paleozoik", "proterozoik", "archaik"], "explain": "Od najmłodszej: kenozoik → mezozoik → paleozoik → proterozoik → archaik (uwaga: odwrotnie niż zwykle!).", "points": 2}, {"id": "g1t16", "type": "match", "tag": "l6", "q": "**Zad. 16.** Połącz państwa ze stolicami.", "pairs": [["Słowacja", "Bratysława"], ["Litwa", "Wilno"], ["Białoruś", "Mińsk"], ["Niemcy", "Berlin"]], "explain": "Niemcy – Berlin, Czechy – Praga, Słowacja – Bratysława, Ukraina – Kijów, Białoruś – Mińsk, Litwa – Wilno, Rosja – Moskwa."}, {"id": "g1t17", "type": "mc", "tag": "l4", "q": "**Zad. 17.** Który zapis współrzędnych geograficznych jest poprawny?", "options": ["21°01'N, 200°E", "52°14'N, 21°01'E", "52°14', 21°01'", "95°N, 21°E"], "answer": 1, "explain": "Zawsze najpierw szerokość, potem długość – **z literami** N/S i E/W. Szerokość nie przekracza 90°, długość 180°."}, {"id": "g1t18", "type": "mc", "tag": "l4", "q": "**Zad. 18.** Podaj współrzędne geograficzne punktu **C** z rysunku.", "options": ["90°S, 0°", "90°N, 0°", "0°, 90°E", "0°, 90°W"], "answer": 2, "explain": "C leży na równiku (szerokość **0°**) i 90° na wschód od południka 0° → **0°, 90°E**.", "image": "siatka_punkty"}, {"id": "g1t19", "type": "match", "tag": "l10", "q": "**Zad. 19.** Przyporządkuj rysunkom rodzaj ruchu płyt litosfery.", "pairs": [["rysunek 1", "zderzenie płyt kontynentalnych"], ["rysunek 2", "przesuwanie wzdłuż uskoku"], ["rysunek 3", "rozsuwanie"]], "explain": "Rozsuwanie – magma tworzy nowe dno (grzbiet, ryft); subdukcja – płyta oceaniczna pod kontynentalną; zderzenie płyt kontynentalnych – góry fałdowe; przesuwanie – płyty mijają się wzdłuż uskoku.", "pairImages": ["plyty_kolizja", "plyty_przesuwanie", "plyty_rozsuwanie"]}, {"id": "g1t20", "type": "match", "tag": "l6", "q": "**Zad. 20.** Połącz granicę naturalną z sąsiadem, od którego oddziela Polskę.", "pairs": [["Odra i Nysa Łużycka", "Niemcy"], ["Sudety", "Czechy"], ["Tatry", "Słowacja"], ["Bug", "Ukraina i Białoruś"]], "explain": "Odra i Nysa Łużycka – z Niemcami, Sudety – z Czechami, Karpaty (Tatry, Pieniny, Beskidy, Bieszczady) – ze Słowacją, Bug – z Ukrainą i Białorusią."}, {"id": "g1t21", "type": "match", "tag": "l1", "q": "**Zad. 21.** Podaj nazwy kierunków oznaczonych na róży wiatrów cyframi.", "pairs": [["2", "E – wschód"], ["4", "S – południe"], ["6", "W – zachód"], ["7", "NW – północny zachód"]], "explain": "Od N zgodnie z ruchem wskazówek zegara: 1 NE, 2 E, 3 SE, 4 S, 5 SW, 6 W, 7 NW.", "image": "roza_cyfry"}, {"id": "g1t22", "type": "match", "tag": "l6", "q": "**Zad. 22.** Podpisz państwa i morze oznaczone na mapie cyframi i literą.", "pairs": [["1", "Niemcy"], ["4", "Ukraina"], ["6", "Litwa"], ["7", "Rosja"], ["A", "Morze Bałtyckie"]], "explain": "1 Niemcy, 2 Czechy, 3 Słowacja, 4 Ukraina, 5 Białoruś, 6 Litwa, 7 Rosja (Obwód Królewiecki), A – Morze Bałtyckie.", "image": "mapa_numery"}, {"id": "g1t23", "type": "short", "tag": "l5", "q": "**Zad. 23.** Oblicz rozciągłość równoleżnikową obszaru między 12°40'W a 33°35'E.", "accept": ["46°15'"], "dm": [46, 15], "explain": "Różne półkule (W i E) → **dodajemy**: 12°40' + 33°35' = 45°75' = **46°15'**.", "points": 2}, {"id": "g1t24", "type": "mc", "tag": "l6", "q": "**Zad. 24.** Który punkt jest najdalej na północ wysuniętym punktem Polski?", "options": ["zakole Odry koło Osinowa Dolnego", "Opołonek", "Jastrzębia Góra", "zakole Bugu koło Zosina"], "answer": 2, "explain": "Skrajne punkty: N – **Jastrzębia Góra** (54°50'N), S – Opołonek (49°00'N), E – Zosin (24°09'E), W – Osinów Dolny (14°07'E)."}, {"id": "g1t25", "type": "mc", "tag": "l3", "q": "**Zad. 25.** Które linie dzielą Ziemię na półkulę wschodnią i zachodnią?", "options": ["równik", "południk 0° i południk 180°", "zwrotnik Raka i zwrotnik Koziorożca", "koła podbiegunowe"], "answer": 1, "explain": "Półkule wschodnią i zachodnią wyznaczają **południki 0° i 180°**; równik dzieli Ziemię na półkulę północną i południową."}, {"id": "g1t26", "type": "cat", "tag": "l7", "q": "**Zad. 26.** Przyporządkuj zjawiska do procesów endogenicznych lub egzogenicznych.", "categories": ["endogeniczne", "egzogeniczne"], "items": [{"t": "trzęsienie ziemi", "c": 0}, {"t": "powolne podnoszenie się Skandynawii", "c": 0}, {"t": "wulkanizm", "c": 0}, {"t": "usypywanie wydm przez wiatr", "c": 1}, {"t": "tworzenie moren przez lądolód", "c": 1}, {"t": "niszczenie brzegu przez fale morskie", "c": 1}], "explain": "Endogeniczne – energia z wnętrza Ziemi, tworzą nierówności (ruchy górotwórcze, epejrogeniczne, wulkanizm, trzęsienia ziemi). Egzogeniczne – energia Słońca i grawitacja, wyrównują powierzchnię (wietrzenie, erozja, transport, akumulacja: rzeki, lodowce, wiatr, morze)."}, {"id": "g1t27", "type": "open", "tag": "l7", "q": "**Zad. 27.** Wyjaśnij różnicę między procesami endogenicznymi a egzogenicznymi. Podaj po dwa przykłady każdego z nich.", "keyPoints": ["endogeniczne – energia z wnętrza Ziemi, tworzą nierówności", "przykłady endogenicznych: np. ruchy górotwórcze, wulkanizm, trzęsienia ziemi, ruchy epejrogeniczne (dwa)", "egzogeniczne – działają na powierzchni (energia Słońca, grawitacja), wyrównują rzeźbę", "przykłady egzogenicznych: np. wietrzenie, erozja, akumulacja, działalność rzek/lodowców/wiatru/morza (dwa)"], "model": "Procesy endogeniczne mają źródło we wnętrzu Ziemi i tworzą nierówności – to np. ruchy górotwórcze, wulkanizm i trzęsienia ziemi. Procesy egzogeniczne działają na powierzchni dzięki energii Słońca i grawitacji i wyrównują rzeźbę – to np. wietrzenie, erozja i akumulacja (rzeki, lodowce, wiatr, morze). kierunku **północy**."}, {"id": "g2t5", "type": "match", "tag": "l3", "q": "**Zad. 5.** Podpisz linie i punkty oznaczone na rysunku literami.", "pairs": [["A", "koło podbiegunowe północne"], ["E", "koło podbiegunowe południowe"], ["G", "Biegun Południowy"], ["B", "zwrotnik Raka"]], "explain": "F – Biegun Północny, A – koło podbiegunowe płn. 66°33'N, B – zwrotnik Raka 23°27'N, C – równik 0°, D – zwrotnik Koziorożca 23°27'S, E – koło podbiegunowe płd. 66°33'S, G – Biegun Południowy, H – południk 0°.", "image": "glob_litery"}, {"id": "g2t6", "type": "tf", "tag": "l2", "q": "**Zad. 6.** Oceń prawdziwość zdań.", "items": [{"s": "Równik dzieli Ziemię na półkulę północną i południową.", "a": true}, {"s": "Każdy południk ma ok. 40 000 km długości.", "a": false}, {"s": "Bieguny mają szerokość geograficzną 90°.", "a": true}, {"s": "Południki są do siebie równoległe.", "a": false}], "explain": "Południk ma ok. **20 000 km** (40 000 km ma równik). Południki **zbiegają się** na biegunach – równoległe są równoleżniki."}, {"id": "g2t7", "type": "multi", "tag": "l6", "q": "**Zad. 7.** Zaznacz **wszystkie** państwa, od których Polskę oddziela rzeka Bug.", "options": ["Ukraina", "Słowacja", "Białoruś", "Rosja", "Litwa"], "answer": [0, 2], "explain": "Bug jest granicą z **Ukrainą i Białorusią**. Granice z Litwą i Rosją są sztuczne, ze Słowacją – Karpaty."}, {"id": "g2t8", "type": "match", "tag": "l1", "q": "**Zad. 8.** Podaj nazwy kierunków oznaczonych na róży wiatrów cyframi.", "pairs": [["3", "SE – południowy wschód"], ["5", "SW – południowy zachód"], ["7", "NW – północny zachód"], ["2", "E – wschód"]], "explain": "Od N zgodnie z ruchem wskazówek zegara: 1 NE, 2 E, 3 SE, 4 S, 5 SW, 6 W, 7 NW.", "image": "roza_cyfry"}, {"id": "g2t9", "type": "match", "tag": "l6", "q": "**Zad. 9.** Podpisz państwa i morze oznaczone na mapie cyframi i literą.", "pairs": [["2", "Czechy"], ["3", "Słowacja"], ["5", "Białoruś"], ["7", "Rosja"], ["A", "Morze Bałtyckie"]], "explain": "1 Niemcy, 2 Czechy, 3 Słowacja, 4 Ukraina, 5 Białoruś, 6 Litwa, 7 Rosja (Obwód Królewiecki), A – Morze Bałtyckie.", "image": "mapa_numery"}, {"id": "g2t10", "type": "mc", "tag": "l4", "q": "**Zad. 10.** Jaką szerokość geograficzną ma każdy punkt leżący na równiku?", "options": ["0°", "90°", "180°", "23°27'"], "answer": 0, "explain": "Szerokość to odległość od równika – na równiku wynosi **0°**."}, {"id": "g2t11", "type": "mc", "tag": "l4", "q": "**Zad. 11.** Który punkt z rysunku leży na półkuli **południowej i wschodniej**?", "options": ["B", "A", "E", "C"], "answer": 2, "explain": "E (60°S, 150°E) – S i E. B (30°S, 60°W) jest na zachodniej, A (60°N, 30°E) na północnej, C leży na równiku.", "image": "siatka_punkty"}, {"id": "g2t12", "type": "tf", "tag": "l8", "q": "**Zad. 12.** Oceń prawdziwość zdań o górach.", "items": [{"s": "Góry Świętokrzyskie to góry stare.", "a": true}, {"s": "Himalaje powstały w fałdowaniu kaledońskim.", "a": false}, {"s": "Fałdowanie alpejskie trwa do dziś.", "a": true}, {"s": "Góry młode są zwykle niższe od starych.", "a": false}], "explain": "Himalaje są **alpejskie**. Góry młode są **wysokie i ostre**, stare – niskie i łagodne."}, {"id": "g2t13", "type": "mc", "tag": "l1", "q": "**Zad. 13.** Jak odnaleźć Gwiazdę Polarną na niebie?", "options": ["przedłużyć ok. 5 razy tylną ścianę Wielkiego Wozu", "przedłużyć 2 razy dyszel Wielkiego Wozu", "to najjaśniejsza gwiazda, zawsze na południu", "szukać jej nad wschodzącym Słońcem"], "answer": 0, "explain": "Gwiazda Polarna (w Małej Niedźwiedzicy) leży na przedłużeniu **tylnej ściany Wielkiego Wozu (ok. 5 razy)** i wskazuje **północ**.", "image": "gwiazda_polarna"}, {"id": "g2t14", "type": "short", "tag": "l5", "q": "**Zad. 14.** Rozciągłość południkowa wyspy wynosi 2°15'. Ile to kilometrów (1° ≈ 111,2 km)?", "accept": ["250,2 km", "250,2"], "num": 250.2, "explain": "Różnica: 2°15' = 2,25°. Odległość: 2,25 × 111,2 km ≈ **250,2 km**.", "tol": 1.5, "points": 2}, {"id": "g2t15", "type": "match", "tag": "l6", "q": "**Zad. 15.** Połącz państwa ze stolicami.", "pairs": [["Ukraina", "Kijów"], ["Czechy", "Praga"], ["Rosja", "Moskwa"], ["Litwa", "Wilno"]], "explain": "Niemcy – Berlin, Czechy – Praga, Słowacja – Bratysława, Ukraina – Kijów, Białoruś – Mińsk, Litwa – Wilno, Rosja – Moskwa."}, {"id": "g2t16", "type": "short", "tag": "l5", "q": "**Zad. 16.** Oblicz rozciągłość równoleżnikową obszaru między 170°20'W a 155°50'E.", "accept": ["33°50'"], "dm": [33, 50], "explain": "Różne półkule (W i E) → **dodajemy**: 170°20' + 155°50' = 325°70' = 326°10'. To więcej niż 180°, więc 360° − 326°10' = **33°50'**.", "points": 2}, {"id": "g2t17", "type": "short", "tag": "l4", "q": "**Zad. 17.** Odczytaj z tego samego rysunku szerokość geograficzną punktu **A** (z literą).", "accept": ["60°00'N"], "dm": [60, 0], "explain": "A leży 60° nad równikiem → **60°N** (długość 30°E).", "dmDir": "N"}, {"id": "g2t18", "type": "short", "tag": "l5", "q": "**Zad. 18.** Oblicz rozciągłość równoleżnikową obszaru między 93°10'E a 47°45'E.", "accept": ["45°25'"], "dm": [45, 25], "explain": "Ta sama półkula (E i E) → **odejmujemy**: 93°10' = 92°70'; 92°70' − 47°45' = **45°25'**.", "points": 2}, {"id": "g2t19", "type": "mc", "tag": "l10", "q": "**Zad. 19.** Która płyta litosfery jest największa?", "options": ["pacyficzna", "euroazjatycka", "afrykańska", "nazca"], "answer": 0, "explain": "Największa jest płyta **pacyficzna**."}, {"id": "g2t20", "type": "cat", "tag": "l9", "q": "**Zad. 20.** Przyporządkuj wydarzenia do er geologicznych.", "categories": ["archaik", "paleozoik", "mezozoik", "kenozoik"], "items": [{"t": "pierwsze organizmy – bakterie i sinice", "c": 0}, {"t": "powstanie węgla kamiennego (karbon)", "c": 1}, {"t": "sól kamienna w Kłodawie (perm)", "c": 1}, {"t": "panowanie dinozaurów", "c": 2}, {"t": "sól w Wieliczce (miocen)", "c": 3}, {"t": "zlodowacenia i pojawienie się człowieka", "c": 3}], "explain": "Archaik – pierwsze organizmy; paleozoik – węgiel (karbon), sól w Kłodawie (perm); mezozoik – dinozaury; kenozoik – sól w Wieliczce (miocen), zlodowacenia i człowiek (czwartorzęd)."}, {"id": "g2t21", "type": "mc", "tag": "l6", "q": "**Zad. 21.** Z którym sąsiadem Polska ma **najkrótszą** granicę lądową?", "options": ["z Litwą", "z Rosją", "z Niemcami", "z Białorusią"], "answer": 0, "explain": "Najkrótsza – z **Litwą** (ok. 104 km); najdłuższa – z Czechami (ok. 796 km)."}, {"id": "g2t22", "type": "short", "tag": "l3", "q": "**Zad. 22.** Podaj szerokość geograficzną koła podbiegunowego północnego (z literą).", "accept": ["66°33'N"], "dm": [66, 33], "explain": "Koło podbiegunowe północne: **66°33'N** (południowe 66°33'S). 66°33' + 23°27' = 90°.", "dmDir": "N"}, {"id": "g2t23", "type": "short", "tag": "l5", "q": "**Zad. 23.** Oblicz rozciągłość południkową obszaru między 12°35'N a 27°50'S.", "accept": ["40°25'"], "dm": [40, 25], "explain": "Różne półkule (N i S) → **dodajemy**: 12°35' + 27°50' = 39°85' = **40°25'**.", "points": 2}, {"id": "g2t24", "type": "mc", "tag": "l7", "q": "**Zad. 24.** Który proces jest **egzogeniczny**?", "options": ["erozja rzeczna", "ruchy górotwórcze", "trzęsienie ziemi", "wulkanizm"], "answer": 0, "explain": "Erozja (niszczenie przez rzekę) działa na powierzchni – to proces **egzogeniczny**. Pozostałe są endogeniczne."}, {"id": "g2t25", "type": "mc", "tag": "l8", "q": "**Zad. 25.** W którym fałdowaniu powstały Sudety?", "options": ["w alpejskim", "w kaledońskim", "nie powstały w fałdowaniu – to wulkany", "w hercyńskim (później odmłodzone w alpejskim)"], "answer": 3, "explain": "Sudety to góry **hercyńskie** (młodszy paleozoik), **odmłodzone** (ponownie wypiętrzone) w fałdowaniu alpejskim."}, {"id": "g2t26", "type": "mc", "tag": "l2", "q": "**Zad. 26.** Ile kilometrów odpowiada w przybliżeniu 1° wzdłuż południka?", "options": ["360 km", "1,85 km", "111,2 km", "60 km"], "answer": 2, "explain": "1° wzdłuż południka ≈ **111,2 km**; 1' ≈ 1,85 km."}, {"id": "g2t27", "type": "open", "tag": "l5", "q": "**Zad. 27.** Wyjaśnij krok po kroku, jak obliczyć rozciągłość równoleżnikową obszaru między 150°E a 160°W, i podaj wynik.", "keyPoints": ["punkty leżą na różnych półkulach (E i W) → dodajemy", "150° + 160° = 310°", "wynik jest większy niż 180° → odejmujemy od 360°", "360° − 310° = 50°"], "model": "Punkty leżą na różnych półkulach (wschodniej i zachodniej), więc dodajemy: 150° + 160° = 310°. Rozciągłość równoleżnikowa nie może przekroczyć 180°, więc liczymy krótszą drogę: 360° − 310° = 50°.", "points": 4, "explain": "Za każdy krok 1 pkt."}]}, {"id": "sprawdzian-cw-3", "title": "Sprawdzian ćwiczeniowy 3", "minutes": 45, "gradeScale": [[0, "niedostateczny"], [31, "dopuszczający"], [51, "dostateczny"], [71, "dobry"], [86, "bardzo dobry"], [98, "celujący"]], "intro": "Ćwiczeniowa wersja pracy klasowej – **ten sam zakres** co grupy A i B (11 zagadnień), ale **inne pytania, liczby i kolejność**. **45 minut**. Rozciągłość wpisuj w stopniach i minutach (np. **39°15'** albo **39 15**), współrzędne z literą (np. **60°W**). Po oddaniu zobaczysz wyjaśnienia; wynik trafia do rodzica.", "tasks": [{"id": "g3t1", "type": "mc", "tag": "l2", "q": "**Zad. 1.** Który równoleżnik jest najdłuższy?", "options": ["równik (ok. 40 000 km)", "wszystkie są jednakowe", "zwrotnik Raka", "koło podbiegunowe północne"], "answer": 0, "explain": "Najdłuższy jest **równik** – ok. 40 000 km; ku biegunom równoleżniki są coraz krótsze."}, {"id": "g3t2", "type": "short", "tag": "l4", "q": "**Zad. 2.** Odczytaj z tego samego rysunku długość geograficzną punktu **D** (z literą).", "accept": ["120°00'W"], "dm": [120, 0], "explain": "D leży 120° na zachód od południka 0° → **120°W** (szerokość 30°N).", "dmDir": "W"}, {"id": "g3t3", "type": "mc", "tag": "l4", "q": "**Zad. 3.** W jakim zakresie podaje się szerokość geograficzną?", "options": ["od 0° do 360°", "od 0° do 180° (E lub W)", "od 0° do 90° (N lub S)", "od 0° do 90° (E lub W)"], "answer": 2, "explain": "Szerokość φ: **0°–90°, N lub S**. Długość λ: 0°–180°, E lub W."}, {"id": "g3t4", "type": "match", "tag": "l3", "q": "**Zad. 4.** Połącz linię lub punkt z jego szerokością geograficzną.", "pairs": [["zwrotnik Raka", "23°27'N"], ["koło podbiegunowe południowe", "66°33'S"], ["równik", "0°"], ["Biegun Północny", "90°N"]], "explain": "Biegun Północny 90°N, koło podbiegunowe płn. 66°33'N, zwrotnik Raka 23°27'N, równik 0°, zwrotnik Koziorożca 23°27'S, koło podbiegunowe płd. 66°33'S, Biegun Południowy 90°S."}, {"id": "g3t5", "type": "match", "tag": "l8", "q": "**Zad. 5.** Połącz fałdowanie z czasem, w którym zachodziło.", "pairs": [["kaledońskie", "starszy paleozoik"], ["hercyńskie", "młodszy paleozoik"], ["alpejskie", "mezozoik i kenozoik (trwa do dziś)"]], "explain": "Kaledońskie (starszy paleozoik): Góry Skandynawskie, Grampiany. Hercyńskie (młodszy paleozoik): Ural, Harz, Sudety. Alpejskie (mezozoik i kenozoik): Alpy, Himalaje, Andy, Pireneje, Kaukaz, Karpaty."}, {"id": "g3t6", "type": "match", "tag": "l6", "q": "**Zad. 6.** Połącz państwa ze stolicami.", "pairs": [["Niemcy", "Berlin"], ["Ukraina", "Kijów"], ["Słowacja", "Bratysława"], ["Białoruś", "Mińsk"]], "explain": "Niemcy – Berlin, Czechy – Praga, Słowacja – Bratysława, Ukraina – Kijów, Białoruś – Mińsk, Litwa – Wilno, Rosja – Moskwa."}, {"id": "g3t7", "type": "short", "tag": "l5", "q": "**Zad. 7.** Oblicz rozciągłość równoleżnikową obszaru między 21°50'W a 76°35'E.", "accept": ["98°25'"], "dm": [98, 25], "explain": "Różne półkule (W i E) → **dodajemy**: 21°50' + 76°35' = 97°85' = **98°25'**.", "points": 2}, {"id": "g3t8", "type": "mc", "tag": "l1", "q": "**Zad. 8.** Idziesz na zachód i robisz w tył zwrot. W którą stronę teraz idziesz?", "options": ["na wschód", "na zachód", "na północ", "na południe"], "answer": 0, "explain": "W tył zwrot = kierunek przeciwny: W ↔ **E**."}, {"id": "g3t9", "type": "mc", "tag": "l6", "q": "**Zad. 9.** Ile wynosi rozciągłość południkowa Polski (54°50'N i 49°00'N)?", "options": ["4°50'", "5°50'", "10°02'", "6°10'"], "answer": 1, "explain": "Ta sama półkula → odejmujemy: 54°50' − 49°00' = **5°50'** (≈ 649 km). 10°02' to rozciągłość równoleżnikowa."}, {"id": "g3t10", "type": "mc", "tag": "l7", "q": "**Zad. 10.** Czym są ruchy epejrogeniczne?", "options": ["powolnym wznoszeniem się lub obniżaniem dużych obszarów lądu", "osadzaniem materiału przez rzeki", "niszczeniem skał przez wiatr", "gwałtownymi wybuchami wulkanów"], "answer": 0, "explain": "Ruchy epejrogeniczne to **powolne podnoszenie lub obniżanie** dużych obszarów (np. Skandynawia się podnosi) – proces endogeniczny."}, {"id": "g3t11", "type": "match", "tag": "l6", "q": "**Zad. 11.** Połącz sąsiada z długością granicy lądowej z Polską.", "pairs": [["Czechy", "ok. 796 km (najdłuższa)"], ["Litwa", "ok. 104 km (najkrótsza)"], ["Niemcy", "ok. 467 km"], ["Rosja", "ok. 210 km"]], "explain": "Granice (GUS): Czechy 796 km, Słowacja 541, Ukraina 535, Niemcy 467, Białoruś 418, Rosja 210, Litwa 104."}, {"id": "g3t12", "type": "mc", "tag": "l4", "q": "**Zad. 12.** Podaj współrzędne geograficzne punktu **F** z rysunku.", "options": ["30°S, 0°", "0°, 30°E", "30°N, 0°", "30°N, 30°E"], "answer": 2, "explain": "F leży 30° nad równikiem (**30°N**) dokładnie na południku Greenwich (**0°**).", "image": "siatka_punkty"}, {"id": "g3t13", "type": "mc", "tag": "l1", "q": "**Zad. 13.** Gdzie w Polsce znajduje się Słońce w południe?", "options": ["na północy – cień wskazuje południe", "na południu – cień jest wtedy najkrótszy i wskazuje północ", "na wschodzie", "dokładnie nad głową"], "answer": 1, "explain": "W południe Słońce jest w Polsce **na południu**, a najkrótszy cień wskazuje **północ**.", "image": "slonce_poludnie"}, {"id": "g3t14", "type": "match", "tag": "l6", "q": "**Zad. 14.** Podpisz państwa oznaczone na mapie cyframi.", "pairs": [["1", "Niemcy"], ["2", "Czechy"], ["4", "Ukraina"], ["5", "Białoruś"], ["6", "Litwa"]], "explain": "1 Niemcy, 2 Czechy, 3 Słowacja, 4 Ukraina, 5 Białoruś, 6 Litwa, 7 Rosja (Obwód Królewiecki), A – Morze Bałtyckie.", "image": "mapa_numery"}, {"id": "g3t15", "type": "short", "tag": "l5", "q": "**Zad. 15.** Oblicz rozciągłość południkową obszaru między 34°30'S a 9°45'S.", "accept": ["24°45'"], "dm": [24, 45], "explain": "Ta sama półkula (S i S) → **odejmujemy**: 34°30' = 33°90'; 33°90' − 9°45' = **24°45'**.", "points": 2}, {"id": "g3t16", "type": "short", "tag": "l5", "q": "**Zad. 16.** Oblicz rozciągłość południkową obszaru między 68°05'N a 59°40'N.", "accept": ["8°25'"], "dm": [8, 25], "explain": "Ta sama półkula (N i N) → **odejmujemy**: 68°05' = 67°65'; 67°65' − 59°40' = **8°25'**.", "points": 2}, {"id": "g3t17", "type": "tf", "tag": "l10", "q": "**Zad. 17.** Oceń prawdziwość zdań o płytach litosfery.", "items": [{"s": "Skorupa kontynentalna jest grubsza od oceanicznej.", "a": true}, {"s": "Płyty litosfery przesuwają się o kilka metrów rocznie.", "a": false}, {"s": "Rów Mariański powstał przy zderzeniu dwóch płyt oceanicznych.", "a": true}, {"s": "Uskok San Andreas leży na granicy płyty pacyficznej i północnoamerykańskiej.", "a": true}], "explain": "Płyty przesuwają się o **kilka centymetrów** rocznie. Pozostałe zdania są prawdziwe (kontynentalna 30–70 km, oceaniczna 5–10 km)."}, {"id": "g3t18", "type": "short", "tag": "l5", "q": "**Zad. 18.** Oblicz rozciągłość równoleżnikową obszaru między 128°40'W a 112°55'E.", "accept": ["118°25'"], "dm": [118, 25], "explain": "Różne półkule (W i E) → **dodajemy**: 128°40' + 112°55' = 240°95' = 241°35'. To więcej niż 180°, więc 360° − 241°35' = **118°25'**.", "points": 2}, {"id": "g3t19", "type": "cat", "tag": "l2", "q": "**Zad. 19.** Przyporządkuj cechy do południków lub równoleżników.", "categories": ["cecha południków", "cecha równoleżników"], "items": [{"t": "są półokręgami", "c": 0}, {"t": "wyznaczają kierunek W–E", "c": 1}, {"t": "zbiegają się na biegunach", "c": 0}, {"t": "ich długość maleje ku biegunom", "c": 1}, {"t": "wyznaczają kierunek N–S", "c": 0}, {"t": "należy do nich równik", "c": 1}], "explain": "Południki: półokręgi, kierunek N–S, zbiegają się na biegunach. Równoleżniki: okręgi, kierunek W–E, coraz krótsze ku biegunom; najdłuższy – równik."}, {"id": "g3t20", "type": "cat", "tag": "l7", "q": "**Zad. 20.** Przyporządkuj formy terenu do czynnika, który je utworzył.", "categories": ["rzeka", "lądolód", "wiatr", "morze"], "items": [{"t": "delta", "c": 0}, {"t": "głazy narzutowe", "c": 1}, {"t": "sandry", "c": 1}, {"t": "wydmy ruchome", "c": 2}, {"t": "mierzeja", "c": 3}, {"t": "klif", "c": 3}], "explain": "Rzeka – doliny, delty; lądolód – moreny, jeziora rynnowe, sandry, głazy narzutowe; wiatr – wydmy; morze – klify, mierzeje."}, {"id": "g3t21", "type": "tf", "tag": "l1", "q": "**Zad. 21.** Oceń prawdziwość zdań o kierunkach świata.", "items": [{"s": "Na mapie północ jest zwykle u góry.", "a": true}, {"s": "Kierunek przeciwny do NE to SW.", "a": true}, {"s": "Słońce wschodzi na zachodzie.", "a": false}, {"s": "Róża wiatrów pokazuje 4 kierunki główne i 4 pośrednie.", "a": true}], "explain": "Słońce **wschodzi na wschodzie**, zachodzi na zachodzie. Pozostałe zdania są prawdziwe."}, {"id": "g3t22", "type": "mc", "tag": "l3", "q": "**Zad. 22.** Którą linię trzeba przekroczyć, aby z półkuli północnej przejść na południową?", "options": ["południk 180°", "zwrotnik Raka", "południk 0°", "równik"], "answer": 3, "explain": "Półkulę północną od południowej oddziela **równik**."}, {"id": "g3t23", "type": "mc", "tag": "l10", "q": "**Zad. 23.** Co powstaje, gdy płyty rozsuwają się na lądzie?", "options": ["rów oceaniczny", "ryft, np. Rów Wschodnioafrykański", "Himalaje", "łuk wysp wulkanicznych"], "answer": 1, "explain": "Rozsuwanie na lądzie tworzy **ryft** (Rów Wschodnioafrykański), a na dnie oceanu – grzbiet śródoceaniczny."}, {"id": "g3t24", "type": "order", "tag": "l9", "q": "**Zad. 24.** Ułóż wydarzenia od najstarszego do najmłodszego.", "items": ["powstanie Ziemi", "pojawienie się tlenu w atmosferze", "powstanie węgla kamiennego", "wymarcie dinozaurów", "powstanie soli w Wieliczce", "zlodowacenia w Polsce"], "explain": "Ziemia (archaik, 4,6 mld lat) → tlen w atmosferze (proterozoik) → węgiel kamienny (karbon, paleozoik) → wymarcie dinozaurów (66 mln lat, koniec mezozoiku) → sól w Wieliczce (miocen, kenozoik) → zlodowacenia (czwartorzęd).", "points": 2}, {"id": "g3t25", "type": "short", "tag": "l5", "q": "**Zad. 25.** Dwa miasta leżą na tym samym południku: 53°30'N i 50°15'N. Oblicz odległość między nimi w km (1° ≈ 111,2 km).", "accept": ["361,4 km", "361,4"], "num": 361.4, "explain": "Różnica: 3°15' = 3,25°. Odległość: 3,25 × 111,2 km ≈ **361,4 km**.", "tol": 1.5, "points": 2}, {"id": "g3t26", "type": "multi", "tag": "l8", "q": "**Zad. 26.** Zaznacz **wszystkie** góry powstałe w fałdowaniu alpejskim.", "options": ["Grampiany", "Karpaty", "Sudety", "Alpy", "Ural", "Andy"], "answer": [1, 3, 5], "explain": "Alpejskie: Alpy, Andy, Karpaty (też Himalaje, Pireneje, Kaukaz). Ural i Sudety – hercyńskie, Grampiany – kaledońskie."}, {"id": "g3t27", "type": "open", "tag": "l7", "q": "**Zad. 27.** Opisz, jak lądolód skandynawski ukształtował rzeźbę północnej Polski. Podaj okres i dwie formy terenu, które po nim zostały.", "keyPoints": ["czwartorzęd (kenozoik) – kilka zlodowaceń", "lądolód nasuwał się ze Skandynawii i niósł skały", "ostatnie zlodowacenie ukształtowało pas pojezierzy", "dwie formy: np. moreny, jeziora rynnowe, sandry, głazy narzutowe"], "model": "W czwartorzędzie Polskę kilka razy pokrywał lądolód skandynawski, który nasuwał się ze Skandynawii i niósł ze sobą skały. Ostatnie zlodowacenie ukształtowało pas pojezierzy na północy kraju. Zostawił po sobie m.in. moreny, jeziora rynnowe, sandry i głazy narzutowe.", "points": 4, "explain": "Za każdy element 1 pkt."}]}, {"id": "slabe-punkty-geo", "title": "Słabe punkty – geografia", "minutes": 25, "gradeScale": [[0, "niedostateczny"], [31, "dopuszczający"], [51, "dostateczny"], [71, "dobry"], [86, "bardzo dobry"], [98, "celujący"]], "intro": "Krótki sprawdzian **tylko z twoich słabych punktów** z prób 4 października: fałdowania i ery, linie i półkule, Jastrzębia Góra, rozciągłość **w stopniach i minutach**, płyty i jedno pytanie opisowe (schemat przyczyna → proces → skutek → przykład). **25 minut**. Wynik trafia do rodzica.", "tasks": [{"id": "ws1", "type": "match", "tag": "l8", "q": "**Zad. 1.** Przyporządkuj góry do fałdowań.", "pairs": [["Góry Skandynawskie", "kaledońskie"], ["Sudety", "hercyńskie"], ["Himalaje", "alpejskie"]], "explain": "Kaledońskie – Góry Skandynawskie; hercyńskie – Ural, Sudety; alpejskie – Karpaty, Alpy, Himalaje, Andy."}, {"id": "ws2", "type": "mc", "tag": "l8", "q": "**Zad. 2.** Do którego fałdowania należy **Ural**?", "options": ["alpejskiego", "kaledońskiego", "hercyńskiego"], "answer": 2, "explain": "Ural – **hercyńskie** (młodszy paleozoik)."}, {"id": "ws3", "type": "mc", "tag": "l9", "q": "**Zad. 3.** W której erze powstały Karpaty i w której żyjemy obecnie?", "options": ["w paleozoiku", "w mezozoiku", "w kenozoiku", "w archaiku"], "answer": 2, "explain": "Karpaty (fałdowanie alpejskie) – **kenozoik**; w kenozoiku żyjemy też dziś."}, {"id": "ws4", "type": "order", "tag": "l9", "q": "**Zad. 4.** Ułóż wydarzenia od najstarszego do najmłodszego.", "items": ["pierwsze organizmy", "powstanie węgla kamiennego", "wymarcie dinozaurów", "zlodowacenia w Polsce"], "explain": "Pierwsze organizmy (archaik) → węgiel kamienny (karbon) → wymarcie dinozaurów (66 mln lat temu) → zlodowacenia (czwartorzęd).", "points": 2}, {"id": "ws5", "type": "mc", "tag": "l1", "q": "**Zad. 5.** W którą stronę wskazuje w Polsce cień w południe?", "options": ["na północ", "na zachód", "na południe", "na wschód"], "answer": 0, "explain": "Słońce w południe jest w Polsce na południu → cień na **północ**."}, {"id": "ws6", "type": "short", "tag": "l3", "q": "**Zad. 6.** Podaj szerokość geograficzną **zwrotnika Koziorożca** (z literą).", "accept": ["23°27'S"], "dm": [23, 27], "explain": "Zwrotnik Koziorożca leży na półkuli południowej: **23°27′S**.", "dmDir": "S", "noDec": true}, {"id": "ws7", "type": "match", "tag": "l3", "q": "**Zad. 7.** Przyporządkuj linie do szerokości.", "pairs": [["zwrotnik Raka", "23°27′N"], ["koło podbiegunowe północne", "66°33′N"], ["koło podbiegunowe południowe", "66°33′S"]], "explain": "Raka 23°27′N, koło płn. 66°33′N, koło płd. 66°33′S."}, {"id": "ws8", "type": "mc", "tag": "l6", "q": "**Zad. 8.** Najdalej na północ wysunięty punkt Polski to:", "options": ["Jastrzębia Góra", "zakole Odry koło Osinowa Dolnego", "Opołonek", "Hel"], "answer": 0, "explain": "**Jastrzębia Góra** (54°50′N)."}, {"id": "ws9", "type": "mc", "tag": "l3", "q": "**Zad. 9.** Które linie dzielą Ziemię na półkulę wschodnią i zachodnią?", "options": ["równik", "koła podbiegunowe", "zwrotnik Raka i zwrotnik Koziorożca", "południk 0° i południk 180°"], "answer": 3, "explain": "Półkule E/W – **południki 0° i 180°**; równik dzieli na N i S."}, {"id": "ws10", "type": "short", "tag": "l4", "q": "**Zad. 10.** Odczytaj z rysunku **szerokość** geograficzną punktu **E** (tylko szerokość, z literą).", "accept": ["60°00'S"], "dm": [60, 0], "explain": "E leży 2 kratki (2 × 30°) **pod równikiem** → **60°00′S**. Szerokość = równoleżnik; długość (150°E) nie jest tu potrzebna.", "dmDir": "S", "image": "siatka_punkty", "noDec": true}, {"id": "ws11", "type": "short", "tag": "l5", "q": "**Zad. 11.** Oblicz rozciągłość równoleżnikową obszaru między 17°50′W a 28°25′E. Wynik w stopniach i minutach.", "accept": ["46°15'"], "dm": [46, 15], "explain": "Różne półkule (W i E) → **dodajemy**: 17°50′ + 28°25′ = 45°75′. 75′ = 1°15′, więc **46°15′**. (Nie 46,15 ani 45,75 – minut nie zapisujemy po przecinku!)", "points": 2, "noDec": true}, {"id": "ws12", "type": "short", "tag": "l5", "q": "**Zad. 12.** Oblicz rozciągłość równoleżnikową obszaru między 150°20′E a 130°55′W.", "accept": ["78°45'"], "dm": [78, 45], "explain": "Różne półkule → dodajemy: 150°20′ + 130°55′ = 280°75′ = 281°15′. To więcej niż 180° → 360° − 281°15′ = 359°60′ − 281°15′ = **78°45′**.", "points": 2, "noDec": true}, {"id": "ws13", "type": "short", "tag": "l5", "q": "**Zad. 13.** Oblicz rozciągłość południkową obszaru między 63°10′N a 45°35′N.", "accept": ["17°35'"], "dm": [17, 35], "explain": "Ta sama półkula (N i N) → **odejmujemy**. Minut brakuje: 63°10′ = 62°70′; 62°70′ − 45°35′ = **17°35′**.", "points": 2, "noDec": true}, {"id": "ws14", "type": "mc", "tag": "l10", "q": "**Zad. 14.** Co powstaje w miejscu rozsuwania się płyt na dnie oceanu?", "options": ["uskok San Andreas", "rów oceaniczny", "grzbiet śródoceaniczny", "góry fałdowe jak Himalaje"], "answer": 2, "explain": "Magma tworzy nowe dno – **grzbiet śródoceaniczny** (np. Grzbiet Śródatlantycki, Islandia)."}, {"id": "ws15", "type": "cat", "tag": "l7", "q": "**Zad. 15.** Przyporządkuj procesy do grupy.", "categories": ["endogeniczne", "egzogeniczne"], "items": [{"t": "wulkanizm", "c": 0}, {"t": "ruchy górotwórcze", "c": 0}, {"t": "erozja", "c": 1}, {"t": "wietrzenie", "c": 1}], "explain": "Endogeniczne (wnętrze Ziemi, tworzą nierówności): wulkanizm, ruchy górotwórcze. Egzogeniczne (Słońce, grawitacja, wyrównują): erozja, wietrzenie."}, {"id": "ws16", "type": "open", "tag": "l10", "q": "**Zad. 16.** Wyjaśnij, jak powstały Andy (schemat: przyczyna → proces → skutek → przykład). Użyj nazw płyt i pojęcia subdukcja.", "keyPoints": ["przyczyna: płyta nazca (oceaniczna) zderza się z płytą południowoamerykańską (kontynentalną)", "proces: cięższa płyta oceaniczna wsuwa się pod kontynentalną – subdukcja", "skutek: młode góry fałdowe + wulkany / trzęsienia ziemi / rów oceaniczny", "przykład/nazwa: Andy – fałdowanie alpejskie, zachodnie wybrzeże Ameryki Płd."], "model": "Oceaniczna płyta nazca zderza się z kontynentalną płytą południowoamerykańską. Cięższa płyta oceaniczna wsuwa się pod lżejszą kontynentalną – to subdukcja. Skały na krawędzi kontynentu są zgniatane, fałdowane i wypiętrzane. Powstały młode góry fałdowe (fałdowanie alpejskie), a obok nich rów oceaniczny (Rów Atakamski); występują wulkany i trzęsienia ziemi. Andy – zachodnie wybrzeże Ameryki Południowej (np. wulkany w Chile i Peru).", "points": 4, "explain": "Za każdy element 1 pkt."}]}], "cheatSheet": [{"title": "Kierunki świata", "items": ["Główne: N, S, E, W · pośrednie: NE, SE, SW, NW", "Kompas – igła wskazuje N · w południe cień → N (Słońce na S) · Gwiazda Polarna → N (5× tylna ściana Wielkiego Wozu)"], "images": [{"img": "roza", "caption": "róża wiatrów"}]}, {"title": "Południki i równoleżniki", "items": ["Południki: półokręgi, równe, łączą bieguny, N–S, zbiegają się na biegunach; 0° Greenwich, 180°", "Równoleżniki: okręgi, krótsze ku biegunom, równoległe, W–E; równik 0° najdłuższy; bieguny 90° = punkty", "1° południka ≈ 111,2 km"]}, {"title": "Linie i półkule", "items": ["Koła podbiegunowe 66°33'N / 66°33'S", "Zwrotnik Raka 23°27'N · Koziorożca 23°27'S", "Równik → półkule N/S · południk 0° i 180° → E/W", "Polska: półkula N i E"], "images": [{"img": "glob_opisany", "caption": "linie siatki"}]}, {"title": "Współrzędne", "items": ["φ: 0–90° N/S (od równika) · λ: 0–180° E/W (od południka 0°)", "1° = 60' · najpierw φ, potem λ · Warszawa 52°14'N, 21°01'E"]}, {"title": "Rozciągłość – metoda", "items": ["Ta sama półkula → ODEJMIJ · różne → DODAJ", "Długość: suma > 180° → 360° − suma", "Brak minut → pożycz 1° = 60' · ≥60' → +1°", "km (wzdłuż południka) = stopnie × 111,2", "Polska: 54°50'N − 49°00'N = 5°50' (≈649 km) · 24°09'E − 14°07'E = 10°02'"]}, {"title": "Polska – położenie i granice", "items": ["Skrajne: N Jastrzębia Góra 54°50'N · S Opołonek 49°00'N · W Osinów Dolny 14°07'E · E Zosin 24°09'E", "Niemcy–Berlin · Czechy–Praga · Słowacja–Bratysława · Ukraina–Kijów · Białoruś–Mińsk · Litwa–Wilno · Rosja–Moskwa (Obwód Królewiecki)", "Najdłuższa granica: Czechy (796 km) · najkrótsza: Litwa (104 km)", "Naturalne: Bałtyk · Odra i Nysa Łużycka · Sudety · Karpaty (Tatry) · Bug"], "images": [{"img": "mapa_polska", "caption": "Polska i sąsiedzi"}]}, {"title": "Procesy geologiczne", "items": ["Endogeniczne: ruchy górotwórcze, epejrogeniczne, wulkanizm, trzęsienia ziemi", "Egzogeniczne: wietrzenie, erozja, akumulacja – rzeki, lodowiec, wiatr, morze", "Lądolód skandynawski (czwartorzęd) → pojezierza · pasy: pobrzeża, pojezierza, niziny, wyżyny, kotliny, góry"]}, {"title": "Fałdowania", "items": ["Kaledońskie (starszy paleozoik): Góry Skandynawskie · PL: Świętokrzyskie", "Hercyńskie (młodszy paleozoik): Ural, Harz · PL: Sudety, Świętokrzyskie", "Alpejskie (mezozoik–kenozoik): Alpy, Himalaje, Andy · PL: Karpaty", "Sudety odmłodzone w alpejskim · stare góry niskie, młode wysokie"]}, {"title": "Ery", "items": ["Archaik (Ziemia 4,6 mld, pierwsze organizmy) → proterozoik → paleozoik (kaledońskie, hercyńskie; karbon – węgiel; perm – sól) → mezozoik (dinozaury, wymarcie 66 mln) → kenozoik (alpejskie; miocen – sól Wieliczka; czwartorzęd – zlodowacenia, człowiek)"]}, {"title": "Płyty litosfery", "items": ["Główne: euroazjatycka, afrykańska, płn.- i płd.amerykańska, pacyficzna, indoaustralijska, antarktyczna", "Oceaniczna: cienka, ciężka, młoda · kontynentalna: gruba, lekka, stara", "Rozsuwanie → grzbiety, ryfty (Islandia, Rów Wschodnioafrykański)", "Subdukcja → rowy, wulkany, Andy · kolizja → Himalaje · przesuwanie → San Andreas", "Skutki: trzęsienia ziemi, wulkany, tsunami"], "images": [{"img": "plyty_subdukcja", "caption": "subdukcja"}]}], "weakSpots": {"title": "🎯 Twoje słabe punkty", "intro": "Zebrane z twoich **3 próbnych sprawdzianów z 4 października** (Praca klasowa A 69%, B 84%, Sprawdzian ćwiczeniowy 1 83%). To tu tracisz najwięcej punktów – najpierw to, potem reszta. Test we **wtorek 6 października**.", "mistakes": ["Pytania opisowe (Andy, Himalaje, endo/egzo) – **0/4 za każde**, bo puste albo jedno zdanie. To 12 pkt do odzyskania!", "Wynik rozciągłości **93,4** i **45,75** zamiast **93°45′** i **46°15′** – minuty to nie ułamek: 1° = 60′.", "Odczyt z siatki: zamiast samej szerokości wpisane obie współrzędne („30s,60w”), długość punktu B pusta.", "Ural → kaledońskie, Góry Skandynawskie → hercyńskie, Karpaty → kaledońskie (odwrotnie!), Karpaty w mezozoiku (a są w **kenozoiku**).", "Węgiel kamienny ustawiony **po** dinozaurach (a jest z karbonu – **przed** nimi).", "Cień w południe → „na południe” (a jest **na północ**). Zwrotnik Raka/Koziorożca zamienione. Półkule E/W → „równik”. Najdalej na północ → „zakole Odry” (a to **Jastrzębia Góra**).", "Rozsuwanie płyt → „góry fałdowe” (a to **grzbiet śródoceaniczny**)."], "template": [{"k": "1. Przyczyna", "d": "CO się dzieje i KTO bierze udział? Nazwij płyty / siły (np. „płyta nazca zderza się z płytą południowoamerykańską”)."}, {"k": "2. Proces", "d": "JAK to przebiega? Użyj pojęcia z lekcji: subdukcja, fałdowanie, rozsuwanie, energia z wnętrza Ziemi…"}, {"k": "3. Skutek", "d": "CO z tego powstaje? Góry, rów oceaniczny, wulkany, trzęsienia ziemi, nowe dno oceanu…"}, {"k": "4. Przykład", "d": "GDZIE? Podaj nazwę z mapy (Andy, Himalaje, Grzbiet Śródatlantycki, Islandia…)."}], "models": [{"id": "andy", "q": "Wyjaśnij, jak powstały Andy. Użyj nazw płyt i pojęcia subdukcja. Podaj dwa skutki.", "steps": ["Oceaniczna **płyta nazca** zderza się z kontynentalną **płytą południowoamerykańską**.", "Cięższa płyta oceaniczna wsuwa się pod lżejszą kontynentalną – to **subdukcja**. Skały na krawędzi kontynentu są zgniatane, fałdowane i wypiętrzane.", "Powstały **młode góry fałdowe** (fałdowanie alpejskie), a obok nich **rów oceaniczny** (Rów Atakamski); występują **wulkany** i **trzęsienia ziemi**.", "**Andy** – zachodnie wybrzeże Ameryki Południowej (np. wulkany w Chile i Peru)."], "keyPoints": [{"t": "płyta nazca", "kw": ["nazca"]}, {"t": "płyta południowoamerykańska", "kw": ["poludniowoameryk", "ameryk", "ameryki poludniowej"]}, {"t": "subdukcja (płyta wsuwa się pod drugą)", "kw": ["subduk", "wsuw", "podsuw", "pod plyte", "pod kontynent"]}, {"t": "płyta oceaniczna jest cięższa", "kw": ["oceaniczn", "ciezsz"]}, {"t": "góry fałdowe młode / fałdowanie alpejskie", "kw": ["faldow", "mlod", "alpejsk"]}, {"t": "skutek: wulkany / trzęsienia ziemi / rów oceaniczny", "kw": ["wulkan", "trzesien", "row "]}], "model": "Oceaniczna płyta nazca zderza się z kontynentalną płytą południowoamerykańską. Cięższa płyta oceaniczna wsuwa się pod lżejszą kontynentalną – to subdukcja. Skały na krawędzi kontynentu są zgniatane, fałdowane i wypiętrzane. Powstały młode góry fałdowe (fałdowanie alpejskie), a obok nich rów oceaniczny (Rów Atakamski); występują wulkany i trzęsienia ziemi. Andy – zachodnie wybrzeże Ameryki Południowej (np. wulkany w Chile i Peru)."}, {"id": "himalaje", "q": "Wyjaśnij, jak powstały Himalaje i dlaczego wciąż występują tam trzęsienia ziemi.", "steps": ["**Płyta indyjska** (część płyty indoaustralijskiej) zderza się z **płytą euroazjatycką**.", "Obie płyty są **kontynentalne** i lekkie – żadna nie chce się wsunąć pod drugą, więc skały między nimi są **zgniatane i fałdowane** (fałdowanie alpejskie).", "Wypiętrzyły się najwyższe góry świata – **młode góry fałdowe**. Płyty wciąż na siebie napierają, więc góry nadal rosną, a naprężenia wywołują **trzęsienia ziemi**.", "**Himalaje** z **Mount Everestem (8849 m)**; trzęsienia ziemi np. w Nepalu."], "keyPoints": [{"t": "płyta indyjska / indoaustralijska", "kw": ["indyjsk", "indoaustral"]}, {"t": "płyta euroazjatycka", "kw": ["euroazj", "eurazj"]}, {"t": "zderzenie dwóch płyt kontynentalnych", "kw": ["kontynentaln", "zderz"]}, {"t": "fałdowanie – skały zgniatane i wypiętrzane", "kw": ["faldow", "zgniat", "wypietrz"]}, {"t": "płyty wciąż się przesuwają → trzęsienia ziemi", "kw": ["trzesien", "nadal", "wciaz", "ciagle"]}], "model": "Płyta indyjska (część płyty indoaustralijskiej) zderza się z płytą euroazjatycką. Obie płyty są kontynentalne i lekkie – żadna nie chce się wsunąć pod drugą, więc skały między nimi są zgniatane i fałdowane (fałdowanie alpejskie). Wypiętrzyły się najwyższe góry świata – młode góry fałdowe. Płyty wciąż na siebie napierają, więc góry nadal rosną, a naprężenia wywołują trzęsienia ziemi. Himalaje z Mount Everestem (8849 m); trzęsienia ziemi np. w Nepalu."}, {"id": "endoegzo", "q": "Wyjaśnij różnicę między procesami endogenicznymi a egzogenicznymi. Podaj po dwa przykłady.", "steps": ["Procesy **endogeniczne** mają źródło **we wnętrzu Ziemi** (ciepło, ruch płyt). **Egzogeniczne** działają **z zewnątrz** – napędza je energia **Słońca** i **grawitacja** (woda, wiatr, lód).", "Endogeniczne **tworzą nierówności** – wypiętrzają i obniżają powierzchnię. Egzogeniczne **wyrównują** powierzchnię: niszczą (wietrzenie, erozja), przenoszą (transport) i osadzają (akumulacja).", "Dzięki endogenicznym powstają góry, wulkany, rowy; dzięki egzogenicznym – doliny rzeczne, delty, wydmy, moreny, klify.", "Endogeniczne: **ruchy górotwórcze, wulkanizm, trzęsienia ziemi, ruchy epejrogeniczne**. Egzogeniczne: **wietrzenie, erozja rzeczna, akumulacja lodowcowa, działalność wiatru (wydmy w Słowińskim PN)**."], "keyPoints": [{"t": "endogeniczne – energia z wnętrza Ziemi", "kw": ["wnetrz"]}, {"t": "endogeniczne tworzą nierówności", "kw": ["tworz", "nierown", "wypietrz"]}, {"t": "2 przykłady endogenicznych", "kw": ["wulkan", "trzesien", "gorotwor", "epejrogen", "faldow"]}, {"t": "egzogeniczne – z zewnątrz (Słońce, grawitacja, woda, wiatr, lód)", "kw": ["zewnatrz", "slonc", "grawitac"]}, {"t": "egzogeniczne wyrównują powierzchnię", "kw": ["wyrown", "niszcz"]}, {"t": "2 przykłady egzogenicznych", "kw": ["wietrzen", "erozj", "akumulac", "transport", "wiatr", "lodowc", "rzek"]}], "model": "Procesy endogeniczne mają źródło we wnętrzu Ziemi (ciepło, ruch płyt). Egzogeniczne działają z zewnątrz – napędza je energia Słońca i grawitacja (woda, wiatr, lód). Endogeniczne tworzą nierówności – wypiętrzają i obniżają powierzchnię. Egzogeniczne wyrównują powierzchnię: niszczą (wietrzenie, erozja), przenoszą (transport) i osadzają (akumulacja). Dzięki endogenicznym powstają góry, wulkany, rowy; dzięki egzogenicznym – doliny rzeczne, delty, wydmy, moreny, klify. Endogeniczne: ruchy górotwórcze, wulkanizm, trzęsienia ziemi, ruchy epejrogeniczne. Egzogeniczne: wietrzenie, erozja rzeczna, akumulacja lodowcowa, działalność wiatru (wydmy w Słowińskim PN)."}, {"id": "rozsuwanie", "q": "Co dzieje się, gdy płyty litosfery rozsuwają się na dnie oceanu? Wyjaśnij i podaj przykład.", "steps": ["Dwie płyty (np. **północnoamerykańska i euroazjatycka**) **oddalają się** od siebie.", "W szczelinę z płaszcza **wydostaje się magma**, stygnie i tworzy **nowe dno oceaniczne** (nową skorupę oceaniczną) – ocean się poszerza.", "Powstaje podwodne pasmo gór – **grzbiet śródoceaniczny**; są tam **wulkany** i płytkie **trzęsienia ziemi**.", "**Grzbiet Śródatlantycki**, który wynurza się na **Islandii**. (Na lądzie rozsuwanie tworzy ryft – Rów Wschodnioafrykański.)"], "keyPoints": [{"t": "płyty oddalają się (rozsuwają)", "kw": ["oddal", "rozsuw", "rozchodz"]}, {"t": "magma wydostaje się z wnętrza", "kw": ["magm", "law"]}, {"t": "powstaje nowe dno / skorupa oceaniczna", "kw": ["nowe dno", "nowa skorup", "nowej skorup", "nowego dna", "dno ocean"]}, {"t": "grzbiet śródoceaniczny", "kw": ["grzbiet"]}, {"t": "przykład: Grzbiet Śródatlantycki / Islandia", "kw": ["srodatlant", "atlanty", "island"]}], "model": "Dwie płyty (np. północnoamerykańska i euroazjatycka) oddalają się od siebie. W szczelinę z płaszcza wydostaje się magma, stygnie i tworzy nowe dno oceaniczne (nową skorupę oceaniczną) – ocean się poszerza. Powstaje podwodne pasmo gór – grzbiet śródoceaniczny; są tam wulkany i płytkie trzęsienia ziemi. Grzbiet Śródatlantycki, który wynurza się na Islandii. (Na lądzie rozsuwanie tworzy ryft – Rów Wschodnioafrykański.)"}], "dm": {"rules": ["**1° = 60′** (60 minut). Minuty liczymy do 59 – potem robi się z nich stopień. Dlatego **nigdy nie pisz wyniku z przecinkiem** (93,4 ❌) – pisz **93°45′** ✅.", "Dodajesz minuty i wyszło **60′ lub więcej**? Zamień 60′ na 1°: 45°75′ = **46°15′**.", "Odejmujesz i brakuje minut? **Pożycz 1° = 60′**: 63°10′ = 62°70′, więc 62°70′ − 45°35′ = **17°35′**.", "**Rozciągłość południkowa** (N–S) – liczysz z szerokości: ta sama półkula (N i N, S i S) → **odejmij**; różne (N i S) → **dodaj**.", "**Rozciągłość równoleżnikowa** (W–E) – liczysz z długości: ta sama półkula (E i E, W i W) → **odejmij**; różne (E i W) → **dodaj**; jeśli suma > 180° → **360° − suma** (obszar przez południk 180°).", "**Półkule E i W** dzieli **południk 0° i 180°**. **Równik** dzieli na **N i S**. Zwrotnik **Raka 23°27′N**, **Koziorożca 23°27′S**, koła podbiegunowe **66°33′**.", "Odczyt z siatki: **szerokość** = który **równoleżnik** (nad równikiem N, pod S); **długość** = który **południk** (na prawo od 0° E, na lewo W). Pytają o jedną? Podaj **tylko tę jedną**, z literą."], "examples": [["145°30′E i 120°45′W", "Różne półkule → 145°30′ + 120°45′ = 265°75′ = 266°15′ > 180° → 360° − 266°15′ = 359°60′ − 266°15′ = **93°45′**"], ["12°40′W i 33°35′E", "Różne półkule → 12°40′ + 33°35′ = 45°75′ = **46°15′** (nie 45,75!)"]]}, "cards": [{"front": "Fałdowanie kaledońskie – kiedy i co?", "back": "Starszy paleozoik. **Góry Skandynawskie**, Grampiany (Szkocja)."}, {"front": "Fałdowanie hercyńskie – kiedy i co?", "back": "Młodszy paleozoik. **Ural**, **Sudety**, Harz."}, {"front": "Fałdowanie alpejskie – kiedy i co?", "back": "Mezozoik i kenozoik (trwa do dziś). **Karpaty, Alpy, Himalaje, Andy**, Pireneje."}, {"front": "W której erze powstały Karpaty?", "back": "W **kenozoiku** (fałdowanie alpejskie). W kenozoiku żyjemy też my."}, {"front": "Ery od najstarszej", "back": "**Archaik → proterozoik → paleozoik → mezozoik → kenozoik**."}, {"front": "Kiedy powstał węgiel kamienny?", "back": "W **karbonie** (paleozoik) – **przed dinozaurami** (dinozaury: mezozoik)."}, {"front": "Kolejność: węgiel, dinozaury, zlodowacenia", "back": "**Węgiel kamienny** (karbon) → **dinozaury** (mezozoik) → **zlodowacenia w Polsce** (czwartorzęd)."}, {"front": "Gdzie pada cień w Polsce w południe?", "back": "Na **północ** – bo Słońce w południe jest w Polsce na **południu**."}, {"front": "Zwrotniki – szerokości", "back": "Zwrotnik **Raka 23°27′N** (półkula północna), zwrotnik **Kozioro
