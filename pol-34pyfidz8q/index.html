listyczne obecne w Trenie VII Jana\n    Kochanowskiego.\n    1. Używanie zdrobnień przez podmiot liryczny świadczy o ...\n       A. czułości.                                            B. urywanym toku myśli.\n    2. Sen bohaterki został za pomocą ...: żelazny, twardy, nieprzespany.\n       A. peryfraz                                             B. epitetów\n    3. Słowa typu letniczek, uploteczki to z dzisiejszego punktu widzenia ... .\n       A. archaizmy.                                           B. anafory.", "items": [{"type": "pick", "id": "tta1a", "options": ["A. czułości.", "B. urywanym toku myśli."], "answer": 0, "points": 1, "explain": "Klucz: A. czułości.", "label": "1. zdrobnienia świadczą o"}, {"type": "pick", "id": "tta1b", "options": ["A. peryfraz", "B. epitetów"], "answer": 1, "points": 1, "explain": "Klucz: B. epitetów", "label": "2. sen … żelazny, twardy, nieprzespany"}, {"type": "pick", "id": "tta1c", "options": ["A. archaizmy.", "B. anafory."], "answer": 0, "points": 1, "explain": "Klucz: A. archaizmy.", "label": "3. letniczek, uploteczki to"}], "pts": 3}, {"n": 2, "text": "2   Dokończ zdanie. Wybierz odpowiedź A lub B i jej uzasadnienie 1, 2 albo 3.\n    Tren V Jana Kochanowskiego jest przykładem rozbudowanego\n                                                                           zawiera bardzo dużo różnorodnych określeń ubarwiających\n                                                                    1.\n       A. porównania,                                                      czytany tekst.\n                                           ponieważ                        postać Urszulki została w nim zestawiona z drzewem oliwnym\n                                                                    2.\n                                                                           ściętym przedwcześnie.\n       B. epitetu,\n                                                                    3.     obraz umierania został w nim ujęty w skondensowany sposób.", "items": [{"type": "pick", "id": "tta2", "options": ["A + 1 (porównanie + dużo określeń)", "A + 2 (porównanie + drzewo oliwne)", "A + 3 (porównanie + skondensowany obraz)", "B + 1 (epitet + dużo określeń)", "B + 2 (epitet + drzewo oliwne)", "B + 3 (epitet + skondensowany obraz)"], "answer": 1, "points": 1, "explain": "Klucz banku: A2 — rozbudowane porównanie, bo Urszulka zestawiona z drzewem oliwnym ściętym przedwcześnie."}], "pts": 1}, {"n": 3, "text": "3   Określ prawdziwość podanych zdań, które dotyczą Trenu V Jana Kochanowskiego. Przy zdaniach\n    prawdziwych zaznacz literę P, przy zdaniach fałszywych – literę F.\n\n        1.       Wiersz rozpoczyna się od apostrofy.                                                                   P       F\n        2.       Konstrukcja trenu opiera się na porównaniu homeryckim.                                                P       F\n        3.       Utwór opisuje powrót do równowagi wewnętrznej poety.                                                  P       F\n        4.       We wierszu występuje odwołanie do mitologii greckiej.                                                 P       F", "items": [{"type": "tf", "id": "tta3", "items": [{"s": "Wiersz rozpoczyna się od apostrofy.", "a": false}, {"s": "Konstrukcja trenu opiera się na porównaniu homeryckim.", "a": true}, {"s": "Utwór opisuje powrót do równowagi wewnętrznej poety.", "a": false}, {"s": "We wierszu występuje odwołanie do mitologii greckiej.", "a": true}], "points": 2, "explain": "Wiersz rozpoczyna się od apostrofy. – F; Konstrukcja trenu opiera się na por… – P; Utwór opisuje powrót do równowagi w… – F; We wierszu występuje odwołanie do m… – P"}], "pts": 2}, {"n": 4, "text": "4   Jakimi współczesnymi synonimami można by zastąpić podkreślone słowa?\n    Nie dopuściłaś nigdy matce się frasować –  _____\n\n    Z każdego kąta żałość człowieka ujmuje –  _____\n\n    A serce swej pociechy darmo upatruje –  _____", "items": [{"type": "short", "id": "tta4a", "accept": ["martwić się", "martwic sie", "frasować się", "niepokoić się", "martwić"], "points": 1, "explain": "Klucz: martwić się", "label": "frasować"}, {"type": "short", "id": "tta4b", "accept": ["smutek", "żal", "smutek / żal"], "points": 1, "explain": "Klucz: smutek", "label": "żałość"}, {"type": "short", "id": "tta4c", "accept": ["daremnie", "na próżno", "na prozno", "bezskutecznie"], "points": 1, "explain": "Klucz: daremnie", "label": "darmo"}], "pts": 1}, {"n": 5, "text": "5   Napisz, czym jest porównanie homeryckie i zaznacz je w Trenie I. Napisz, jakie zjawisko zostało przez nie\n    scharakteryzowane i z jakim obrazem zestawione.", "items": [{"type": "open", "id": "tta5", "label": "Odpowiedź", "model": "Porównanie homeryckie – porównanie, w którym drugi człon, porównujący, stanowi samodzielny, rozbudowany obraz. W Trenie I zaznaczony fragment o smoku i słowiczkach. Kochanowski przedstawił śmierć porównaną do smoka, który pożera pisklęta na oczach matki.", "kw": [["porównanie homeryckie|homeryck"], ["rozbudowan|samodzieln"], ["smok|słowicz|smierc|śmierć"]], "points": 3, "explain": "Porównaj z modelem z banku odpowiedzi."}], "pts": 3}, {"n": 6, "text": "6   Tren I Jana Kochanowskiego kończy się pytaniem. Wyjaśnij jego znaczenie.\n\n           Nie wiem, co lżej: czy w smutku jawnie żałować,\n           Czyli się z przyrodzeniem gwałtem mocować?", "items": [{"type": "open", "id": "tta6", "label": "Odpowiedź", "model": "Podmiot liryczny zastanawia się, jak ma się zachować w obliczu nieszczęścia: czy poddać się smutkowi i żałobie, czy walczyć z losem. Nie znajduje odpowiedzi — to pytanie retoryczne.", "kw": [["smutk|żałob|zalob"], ["los|bunt|przyrodzen"], ["retoryczn|bez odpowiedzi|nie znajduje"]], "points": 2, "explain": "Porównaj z modelem z banku odpowiedzi."}], "pts": 2}, {"n": 7, "text": "7   Uzupełnij zdania. Wybierz właściwe odpowiedzi spośród podanych.\n\n    Tren VIII Jana Kochanowskiego jest zbudowany na zasadzie A/B. Świadczy o tym C/D.\n    A. kontrastu                                        C. scena ukazująca rozpaczającego ojca\n    B. podobieństw                                      D. obraz radosnego domu i pustka po jej śmierci", "items": [{"type": "multi", "id": "tta7", "options": ["A. kontrastu", "B. podobieństw", "C. scena ukazująca rozpaczającego ojca", "D. obraz radosnego domu i pustka po jej śmierci"], "answer": [0, 3], "points": 1, "explain": "Klucz banku: A, D — zasada kontrastu; obraz radosnego domu i pustka."}], "pts": 1}, {"n": 8, "text": "8   Oceń prawdziwość podanych stwierdzeń w odniesieniu do tekstu Trenu I Jana Kochanowskiego. Przy zdaniu\n    prawdziwym zaznacz literę P, a przy fałszywym – F.\n\n                                 Cytat                                  Wyjaśnienie\n\n    1.    Wszytki płacze, wszytki łzy Heraklitowe\n          I lamenty, i skargi Symonidowe,\n          Wszytki troski na świecie, wszytki wzdychania        Podmiot liryczny kieruje\n          I żale, i frasunki, i rąk łamania,                   swoją wypowiedź do\n          Wszytki a wszytki za raz w dom się mój noście                                          P      F\n                                                               wszystkich smutków na\n                                                               ziemi.\n\n    2.    A mnie płakać mej wdzięcznej dziewki pomoście;\n          Z którą mię niepobożna śmierć rozdzieliła            Podmiot liryczny można\n                                                               utożsamić z ojcem zmarłej         P      F\n                                                               dziewczynki.", "items": [{"type": "tf", "id": "tta8", "items": [{"s": "Podmiot liryczny kieruje wypowiedź do wszystkich smutków na ziemi.", "a": true}, {"s": "Podmiot liryczny można utożsamić z ojcem zmarłej dziewczynki.", "a": true}], "points": 1, "explain": "Podmiot liryczny kieruje wypowiedź … – P; Podmiot liryczny można utożsamić z … – P"}], "pts": 1}, {"n": 9, "text": "9   Zaznacz i i teraźniejszości w Trenie VII Jana\n    Kochanowskiego. Opisz elementy składające się na te dwa obrazy.", "items": [{"type": "open", "id": "tta11", "label": "Odpowiedź", "model": "Obrazy przeszłości i teraźniejszości ukazane za pomocą kontrastu. Ojciec wymienia ubrania i ozdoby Urszulki; zestawia wyprawkę weselną (obiecany posag) ze strojem pogrzebowym; metafora skrzynki/trumną. Uwaga: dwa obrazy domu należą do Trenu VIII, nie VII.", "kw": [["kontrast"], ["ubran|ozdob|wypraw|wesel|pogrzeb|trum|skrzyn"]], "points": 2, "explain": "Porównaj z modelem z banku odpowiedzi."}], "pts": 2}, {"n": 12, "text": "12 Scharakteryzuj bohaterkę Trenu VIII Jana Kochanowskiego.", "items": [{"type": "open", "id": "tta12", "label": "Odpowiedź", "model": "Bohaterką Trenu VIII jest Urszulka. Była radosnym, śpiewającym, czułym dzieckiem; wypełniała dom rozmową. Po śmierci dom stał się pusty i ponury.", "kw": [["Urszul"], ["radosn|śpiew|spiew|czuł|serdecz"], ["pust|cisz|ponur"]], "points": 2, "explain": "Porównaj z modelem z banku odpowiedzi."}], "pts": 2}]}, {"id": "treny-test-b", "title": "Treny — test Nowa Era, grupa B", "kind": "graded", "head": "Klasa  _____", "keyNote": "Klucz: bank odpowiedzi 844585185 — dopasowany treścią pytań do grupy B. Zadania otwarte: słowa kluczowe + wzór.", "gradeScale": [[0, "niedostateczny"], [31, "dopuszczający"], [51, "dostateczny"], [71, "dobry"], [88, "bardzo dobry"], [97, "celujący"]], "minutes": 40, "tasks": [{"n": 1, "text": "1   Zaznacz właściwe uzupełnienia zdań opisujących środki stylistyczne obecne w Trenie VII Jana\n    Kochanowskiego.\n    1. Używanie zdrobnień przez podmiot liryczny świadczy o ...\n       A. urywanym toku myśli.                                 B. czułości.\n    2. Sen bohaterki został za pomocą ...: żelazny, twardy, nieprzespany.\n       A. epitetów                                             B. peryfraz\n    3. Słowa typu letniczek, uploteczki to z dzisiejszego punktu widzenia ... .\n       A. archaizmy.                                           B. anafory.", "items": [{"type": "pick", "id": "ttb1a", "options": ["A. urywanym toku myśli.", "B. czułości."], "answer": 1, "points": 1, "explain": "Klucz: B. czułości.", "label": "1. zdrobnienia świadczą o"}, {"type": "pick", "id": "ttb1b", "options": ["A. epitetów", "B. peryfraz"], "answer": 0, "points": 1, "explain": "Klucz: A. epitetów", "label": "2. sen … żelazny, twardy, nieprzespany"}, {"type": "pick", "id": "ttb1c", "options": ["A. archaizmy.", "B. anafory."], "answer": 0, "points": 1, "explain": "Klucz: A. archaizmy.", "label": "3. letniczek, uploteczki to"}], "pts": 3}, {"n": 2, "text": "2   Dokończ zdanie. Wybierz odpowiedź A lub B i jej uzasadnienie 1, 2 albo 3.\n    Tren V Jana Kochanowskiego jest przykładem rozbudowanego\n                                                                           zawiera bardzo dużo różnorodnych określeń ubarwiających\n                                                                    1.\n       A. epitetu,                                                         czytany tekst.\n                                           ponieważ                 2.     obraz umierania został w nim ujęty w skondensowany sposób.\n\n       B. porównania,                                                      postać Urszulki została w nim zestawiona z drzewem oliwnym\n                                                                    3.\n                                                                           ściętym przedwcześnie.", "items": [{"type": "pick", "id": "ttb2", "options": ["A + 1 (epitet + dużo określeń)", "A + 2 (epitet + skondensowany obraz)", "A + 3 (epitet + drzewo oliwne)", "B + 1 (porównanie + dużo określeń)", "B + 2 (porównanie + skondensowany obraz)", "B + 3 (porównanie + drzewo oliwne)"], "answer": 5, "points": 1, "explain": "Klucz banku: B3 — rozbudowane porównanie, bo Urszulka zestawiona z drzewem oliwnym ściętym przedwcześnie."}], "pts": 1}, {"n": 3, "text": "3   Określ prawdziwość podanych lain": "Porównaj z modelem z banku odpowiedzi."}], "pts": 1}, {"n": 10, "text": "10 Wyjaśnij, dlaczego poniższy utwór można nazwać trenem. Na czym polegało nowatorstwo Kochanowskiego\n    wobec antycznego wzorca?\n\n    Jako oliwka mała pod wysokim sadem\n      Idzie z ziemie ku górze macierzyńskim szladem,\n    Jeszcze ani gałązek, ani listków rodząc,\n      Sama tylko dopiro szczupłym prątkiem wschodząc:\n    Tę jesli, ostre ciernie lub rodne pokrzywy\n      Uprzątając, sadownik podciął ukwapliwy,\n    Mdleje za raz, a zbywszy siły przyrodzonej,\n      Upada przed nogami matki ulubionej.\n    Tak ci sie mej namilszej Orszuli dostało:\n      Przed oczyma rodziców swoich rostąc, mało\n    Od ziemie sie co wzniózwszy, duchem zaraźliwym\n      Srogiej śmierci otchniona, rodzicom troskliwym\n    U nóg martwa upadła. O zła Persefono,\n      Mogłażeś tak wielu łzam dać upłynąć płono?", "items": [{"type": "open", "id": "ttb10", "label": "Odpowiedź", "model": "Tren jest pieśnią żałobną, w której podmiot liryczny opłakuje odejście bliskiej osoby. Nowatorstwo Kochanowskiego: bohaterką jest małe dziecko (w antyku opłakiwano wielkich mężów) oraz cały cykl utworów zamiast jednego wiersza.", "kw": [["żałobn|zalobn|lament|opłak"], ["dzieck|Urszul|córk"], ["cykl|anty|nowator"]], "points": 2, "explain": "Porównaj z modelem z banku odpowiedzi."}], "pts": 2}, {"n": 11, "text": "11 Nazwij środek stylistyczny użyty do zestawienia obrazu przeszłości i teraźniejszości w Trenie VII Jana\n    Kochanowskiego. Opisz elementy składające się na te dwa obrazy.", "items": [{"type": "open", "id": "ttb11", "label": "Odpowiedź", "model": "Obrazy przeszłości i teraźniejszości ukazane za pomocą kontrastu. Ojciec wymienia ubrania i ozdoby Urszulki; zestawia wyprawkę weselną (obiecany posag) ze strojem pogrzebowym; metafora skrzynki/trumną. Uwaga: dwa obrazy domu należą do Trenu VIII, nie VII.", "kw": [["kontrast"], ["ubran|ozdob|wypraw|wesel|pogrzeb|trum|skrzyn"]], "points": 2, "explain": "Porównaj z modelem z banku odpowiedzi."}], "pts": 2}, {"n": 12, "text": "12 Scharakteryzuj bohaterkę Trenu VIII Jana Kochanowskiego.", "items": [{"type": "open", "id": "ttb12", "label": "Odpowiedź", "model": "Bohaterką Trenu VIII jest Urszulka. Była radosnym, śpiewającym, czułym dzieckiem; wypełniała dom rozmową. Po śmierci dom stał się pusty i ponury.", "kw": [["Urszul"], ["radosn|śpiew|spiew|czuł|serdecz"], ["pust|cisz|ponur"]], "points": 2, "explain": "Porównaj z modelem z banku odpowiedzi."}], "pts": 2}]}, {"id": "zbiorczy-a", "title": "Test zbiorczy: fraszki, pieśni, treny — grupa A", "kind": "practice", "head": "Klasa  _____", "tasks": [{"n": 1, "text": "1   Przeczytaj Tren V Jana Kochanowskiego i wykonaj zadania.\n    1. Dokończ zdanie. Wybierz właściwą odpowiedź spośród podanych.\n       Dominującym środkiem stylistycznym w utworze jest\n       A. apostrofa.                                        C. porównanie homeryckie.\n       B. pytanie retoryczne.                               D. wyraz dźwiękonaśladowczy.\n    2. W którym wersie ujawnia się podmiot liryczny? Wybierz właściwą odpowiedź spośród podanych.\n       A. Sama tylko dopiro szczupłym prątkiem wschodząc.\n       B. Upada przed nogami matki ulubionej.\n       C. Tak ci sie mej namilszej Orszuli dostało.\n       D. U nóg martwa upadła.\n    3. Dokończ zdanie. Wybierz właściwą odpowiedź spośród podanych.\n       W sformułowaniu: O zła Persefono występują\n       A. epitet i apostrofa.                               C. epitet i pytanie retoryczne.\n       B. porównanie i metafora.                            D. metafora i wyraz dźwiękonaśladowczy.\n    4. Dokończ zdanie. Wybierz właściwą odpowiedź spośród podanych.\n       Wyrazy rodne, rostąc, łzam to we współczesnej polszczyźnie\n       A. wyrazy zapożyczone.                               C. neologizmy.\n       B. wyrazy potoczne.                                  D. archaizmy."}, {"n": 2, "text": "2   Uzupełnij notatkę dotyczącą Trenu V Jana Kochanowskiego. Wpisz właściwe uzupełnienia spośród\n    podanych.\n    Zamieszczony utwór należy do rodzaju literackiego zwanego (epiką/liryką) ………………\n    W utworze wypowiada się (podmiot liryczny/narrator) ………………………………, który wyraża swój żal\n    po utracie córeczki.\n    Utwór ten zakończony jest (pytaniem retorycznym/puentą) ………………………………."}, {"n": 3, "text": "3   Na podstawie Trenu V Jana Kochanowskiego wyjaśnij, do kogo zostali porównani: Urszulka i Ogrodnik.\n\n    Urszulka – …………………………………………………..……………..………………\n    Ogrodnik – ………………………………………………………..……………….………"}, {"n": 4, "text": "4   Zaznacz właściwe uzupełnienia zdań opisujących środki stylistyczne obecne w Trenie VII Jana\n    Kochanowskiego.\n    1. Używanie zdrobnień przez podmiot liryczny świadczy o ...\n       A. czułości.                                            B. urywanym toku myśli.\n    2. Sen bohaterki został za pomocą ...: żelazny, twardy, nieprzespany.\n       A. peryfraz                                             B. epitetów\n    3. Słowa typu letniczek, uploteczki to z dzisiejszego punktu widzenia ... .\n       A. archaizmy.                                           B. anafory."}, {"n": 5, "text": "5   Dokończ zdanie. Wybierz odpowiedź A lub B i jej uzasadnienie 1, 2 albo 3.\n    Tren V Jana Kochanowskiego jest przykładem rozbudowanego\n                                                                           zawiera bardzo dużo różnorodnych określeń ubarwiających\n                                                                    1.\n       A. porównania,                                                      czytany tekst.\n                                           ponieważ                        postać Urszulki została w nim zestawiona z drzewem oliwnym\n                                                                    2.\n                                                                           ściętym przedwcześnie.\n       B. epitetu,\n                                                                    3.     obraz umierania został w nim ujęty w skondensowany sposób."}, {"n": 6, "text": "6   Przeczytaj fragment Pieśni II Jana Kochanowskiego. Dokończ zdanie, wybierając A lub B oraz 1 lub 2.\n          Jan Kochanowski Pieśń II z Ksiag pierwszych (fragment)\n          Serce roście patrząc na te czasy!\n          Mało przedtym gołe były lasy,\n          Śnieg na ziemi wysszej łokcia leżał,\n          A po rzekach wóz nacięższy zbieżał.\n          Teraz drzewa liście na się wzięły,\n          Polne łąki pięknie zakwitnęły;\n          Lody zeszły, a po czystej wodzie\n          Idą statki i ciosane łodzie.\n    W Pieśni II Jana Kochanowskiego występują\n     A. rymy męskie,                                    1.    składające się półtotej sylaby.\n                                        czyli\n     B. rymy żeńskie,                                   2.    składające się z ostatniej sylaby."}, {"n": 7, "text": "7   Przeczytaj fragment fraszki Na lipę Jana Kochanowskiego. Dokończ zdanie, wybierając właściwe\n    uzupełnienia A lub B oraz 1, 2 lub 3.\n          Jan Kochanowski Na lipę (fragment)\n          Gościu, siądź pod mym liściem, a odpoczni sobie,\n          Nie dojdzie cię tu słońce, przyrzekam ja tobie,\n          Choć się nawysszej wzbije, a proste promienie\n          Ściągną pod swoje drzewa rozstrzelane cienie.\n    Fraszka Na lipę Jana Kochanowskiego jest utworem\n                                                   1.   występują w nim rymy męskie.\n     A. nierytmicznym,\n                                 ponieważ          2.   w niektórych wersach jest różna liczba sylab.\n     B. rytmicznym,                                3.   w każdym wersie jest jednakowa liczba sylab."}, {"n": 8, "text": "8   Wybierz dwa właściwe uzupełnienia zdania.\n    Na młodość Jana Kochanowskiego jest\n     A. fraszką,                         1.     to krótki utwór liryczny zawierający puentę.\n                          ponieważ\n     B. bajką,                           2.     wykorzystuje alegorię i zawiera puentę."}, {"n": 9, "text": "9   Określ prawdziwość podanych zdań, które dotyczą Trenu V Jana Kochanowskiego. Przy zdaniach\n    prawdziwych zaznacz literę P, przy zdaniach fałszywych – literę F.\n\n      1.   Wiersz rozpoczyna się od apostrofy.                                                     P    F\n      2.   Konstrukcja trenu opiera się na porównaniu homeryckim.                                  P    F\n      3.   Utwór opisuje powrót do równowagi wewnętrznej poety.                                    P    F\n      4.   We wierszu występuje odwołanie do mitologii greckiej.                                   P    F"}, {"n": 10, "text": "10 Przeczytaj fragment Pieśni świętojańskiej o sobótce Jana Kochanowskiego i zaznacz właściwe dokończenie\n    zdania.\n    Jan Kochanowski Pieśń świętojańska o sobótce (fragment)\n         Panna XII\n    Wsi spokojna, wsi wesoła,\n    Który głos twej chwale zdoła?\n    Kto twe wczasy, kto pożytki\n    Może wspomnieć za raz wszytki?\n    Człowiek w twej pieczy uczciwie\n    Bez wszelakiej lichwy żywie;\n    Pobożne jego staranie\n    I bezpieczne nabywanie.\n    W Pieśni świętojańskiej o sobótce Jana Kochanowskiego występują rymy\n    A. dokładne, męskie.                                C. niedokładne, męskie.\n    B. dokładne, żeńskie.                               D. niedokładne, żeńskie."}, {"n": 11, "text": "11 Przeczytaj fraszkę i zaznacz właściwe dokończenie zdania.\n   Jan Kochanowski Na nabożną\n   Jeśli nie grzeszysz, jako mi powiadasz,\n   Czego się, miła, tak często spowiadasz?\n   Podmiot liryczny uważa, że bohaterka jest\n   A. obłudna.                  B. naiwna.              C. cnotliwa.          D. konsekwentna."}, {"n": 12, "text": "12 Przeczytaj fraszkę i zaznacz właściwe dokończenie zdania.\n   Jan Kochanowski Na nabożną\n   Jeśli nie grzeszysz, jako mi powiadasz,\n   Czego się, miła, tak często spowiadasz?\n   Bohaterka fraszki Jana Kochanowskiego Na nabożną sądzi o sobie, że jest\n   A. cnotliwa.                 B. naiwna.        C. obłudna.                D. konsekwentna."}, {"n": 13, "text": "13 Przeczytaj fraszkę Na młodość Jana Kochanowskiego. Zaznacz powiedzenie, które ma podobny sens do\n   wymowy fraszki.\n   Jan Kochanowski Na młodość\n   Jakoby też rok bez wiosny mieć chcieli,\n   Którzy chcą, żeby młodzi nie szaleli.\n   A. Aby do wiosny!\n   B. Miłe złego początki, lecz koniec żałosny.\n   C. Wszystko ma swój czas.\n   D. Jedna jaskółka wiosny nie czyni."}, {"n": 14, "text": "14 Przeczytaj fraszkę i zaznacz właściwe dokończenie zdania.\n   Jan Kochanowski Na dom w Czarnolesie\n   Panie, to moja praca, a zdarzenie Twoje;\n   Raczysz bogosławieństwo dać do końca swoje.\n   Inszy niechaj pałace marmórowe mają\n   I szczerym złotogłowem ściany obijają,\n   Ja, Panie, niechaj mieszkam w tym gniaździe ojczystym,\n   A Ty mię zdrowiem opatrz i sumnieniem czystym,\n   Pożywieniem ućciwym, ludzką życzliwością,\n   Obyczajmi znośnymi, nieprzykrą starością.\n   Z fraszki Jana Kochanowskiego Na dom w Czarnolesie wynika, że dla podmiotu lirycznego najważniejsze są\n   wartości\n   A. nieprzemijające i kosztowne.\n   B. uniwersalne i niematerialne.\n   C. trwałe i materialne.\n   D. ulotne i duchowe."}, {"n": 15, "text": "15 Przeczytaj fraszkę Jana Kochanowskiego Do Hanny. Zaznacz frazeologizm, który najtrafniej oddaje\n   zachowanie Hanny wobec podmiotu lirycznego.\n   Jan Kochanowski Do Hanny\n   Na palcu masz dyjament, w sercu twardy krzemięń,\n   Pierścień mi, Hanno, dajesz, już i serce przemięń.\n   A. Mieć serce z kamienia.\n   B. Mieć serce na dłoni.\n   C. Chwycić za serce.\n   D. Stracić serce."}, {"n": 16, "text": "16 Przeczytaj fraszkę Na młodość Jana Kochanowskiego i zaznacz właściwe dokończenie zdania.\n   Jan Kochanowski Na młodość\n   Jakoby też rok bez wiosny mieć chcieli,\n   Którzy chcą, żeby młodzi nie szaleli.\n   We fraszce Na młodość Jana Kochanowskiego młodość została porównana do\n   A. pór roku.\n   B. wiosny.\n   C. szaleństwa.\n   D. roku."}, {"n": 17, "text": "17 Jakimi współczesnymi synonimami można by zastąpić podkreślone słowa?\n   Nie dopuściłaś nigdy matce się frasować –  _____\n\n   Z każdego kąta żałość człowieka ujmuje –  _____\n\n   A serce swej pociechy darmo upatruje –  _____"}, {"n": 18, "text": "18 Napisz, czym jest porównanie homeryckie i zaznacz je w Trenie I. Napisz, jakie zjawisko zostało przez nie\n   scharakteryzowane i z jakim obrazem zestawione."}, {"n": 19, "text": "19 Tren I Jana Kochanowskiego kończy się pytaniem. Wyjaśnij jego znaczenie.\n\n       Nie wiem, co lżej: czy w smutku jawnie żałować,\n       Czyli się z przyrodzeniem gwałtem mocować?"}, {"n": 20, "text": "20 Napisz, do kogo, w jakiej formie i w jakim celu zwraca się podmiot liryczny w ostatniej strofie Pieśni II z\n   Ksiąg pierwszych.\n   Dobra myśli, której nie przywabi,\n   Choć kto ściany drogo ujedwabi,\n   Nie gardź moim chłodnikiem chruścianym,\n   A bądź ze mną, z trzeźwym i z pijanym!"}, {"n": 21, "text": "21 2. a) Z Pieśni świętojańskiej o sobótce Jana Kochanowskiego wypisz fragmenty, które informują o:\n   • stosunku mieszkańców wsi do pieniędzy;\n   • zasadach wychowywania dzieci.\n   b) Czy uważasz te postawy życiowe za wartościowe i godne naśladowania? Uzasadnij swoje stanowisko."}, {"n": 22, "text": "22 Uzasadnij, że Pieśń świętojańska o sobótce Jana Kochanowskiego prezentuje renesansową wizję człowieka i\n   szczęścia. Podaj dwa argumenty.\n   Argument 1:  _____\n   Argument 2:  _____"}, {"n": 23, "text": "23 Zapisz, co według Ciebie, znaczy wyraz „fraszka” występujący w początkowych wersach utworu O żywocie\n   ludzkim Jana Kochanowskiego.\n   Fraszki to wszytko, cokolwiek myślemy,\n   Fraszki to wszytko, cokolwiek czyniemy."}, {"n": 24, "text": "24 Dlaczego według podmiotu lirycznego utworu Do fraszek Jana Kochanowskiego pochwała powinna być\n   skromna?\n   Jan Kochanowski Do fraszek\n   Fraszki moje (coście mi dotąd zachowały),\n   Nie chcę, żebyście kogo źle wspominać miały.\n   Lecz jeśli wam nie g myśli cudze obyczaje,\n   Niechaj karta występom, nie personom łaje!\n   Chcecieli chwalić kogo, chwalciesz, ale skromnie,\n   By pochlebstwa jakiego nie uznano po mnie.\n   To też wiedzcie, że drudzy swej się chwały wstydzą\n   Podobno, że chwalnego w sobie nic nie widzą."}, {"n": 25, "text": "25 Zaznacz w podanej fraszce Jana Kochanowskiego fragment, który ma taki sam sens, jak słowa pochodzące z\n   Monachomachii Ignacego Krasickiego:\n   „I śmiech niekiedy może być nauką,\n   kiedy się z przywar nie z osób natrząsa”.\n   Jan Kochanowski Do fraszek\n   Fraszki moje (coście mi dotąd zachowały),\n   Nie chcę, żebyście kogo źle wspominać miały.\n   Lecz jeśli wam nie g myśli cudze obyczaje,\n   Niechaj karta występom, nie personom łaje!\n   Chcecie li chwalić kogo, chwalcież, ale skromnie,\n   By pochlebstwa jakiego nie uznano po mnie.\n   To też wiedzcie, że drudzy swej się chwały wstydzą\n   Podobno, że chwalnego w sobie nic nie widzą."}, {"n": 26, "text": "26 Jaką myśl zawierają pierwsze cztery wersy fraszki Jana Kochanowskiego Na zdrowie?\n   Ślachetne zdrowie,\n   Nikt się nie dowie,\n   Jako smakujesz,\n   Aż się zepsujesz."}, {"n": 27, "text": "27 Jaką prośbę wypowiada podmiot liryczny fraszki Na zdrowie w końcowej części utworu?"}, {"n": 28, "text": "28 Wypisz z tekstu fraszki Na Zdrowie Jana Kochanowskiego określenie, którym autor zastąpił wyrażenie\n   „szlachetne zdrowie”. O czym świadczy użycie takiego określenia?"}, {"n": 29, "text": "29 Zapisz, jaki środek stylistyczny został wykorzystany w podanej fraszce.\n   Jan Kochanowski Na nabożną\n   Jeśli nie grzeszysz, jako mi powiadasz,\n   Czego się, miła, tak często spowiadasz?"}, {"n": 30, "text": "30 Na podstawie podanych fragmentów i znajomości całych fraszek napisz, czego dowiadujemy się o adresacie\n   lirycznym.\n   A. Panie, to moja praca, a zdarzenie Twoje;\n       Raczysz błogosławieństwo dać do końca swoje!\n                                 Na dom w Czarnolesie\n   B. Gościu, siądź pod mym liściem, a odpoczni sobie!\n       Nie dojdzie cię tu słońce, przyrzekam ja tobie.\n                                             Na lipę\n   C. Na palcu masz dyjament, w sercu twardy krzemień,\n       Pierścień mi, Hanno, dajesz, już i serce przemień!\n                                             Do Hanny"}, {"n": 31, "text": "31 Wpisz do tabeli informacje dotyczące budowy i funkcji tytułów fraszek Kochanowskiego.\n                               Schemat budowy (części mowy\n       Tytuły fraszek                                                        Funkcja tytułów\n                                     tworzące tytuły)\n    Na lipę\n    Na zachowanie\n    Do Hanny"}, {"n": 32, "text": "32 Uzupełnij zdania. Wybierz właściwe odpowiedzi spośród podanych.\n\n   Tren VIII Jana Kochanowskiego jest zbudowany na zasadzie A/B. Świadczy o tym C/D.\n   A. kontrastu                                        C. scena ukazująca rozpaczającego ojca\n   B. podobieństw                                      D. obraz radosnego domu i pustka po jej śmierci"}, {"n": 33, "text": "33 Oceń prawdziwość podanych stwierdzeń w odniesieniu do tekstu Trenu I Jana Kochanowskiego. Przy zdaniu\n   prawdziwym zaznacz literę P, a przy fałszywym – F.\n\n                                Cytat                                      Wyjaśnienie\n\n    1.    Wszytki płacze, wszytki łzy Heraklitowe\n          I lamenty, i skargi Symonidowe,\n          Wszytki troski na świecie, wszytki wzdychania         Podmiot liryczny kieruje\n          I żale, i frasunki, i rąk łamania,                    swoją wypowiedź do\n          Wszytki a wszytki za raz w dom się mój noście                                      P      F\n                                                                wszystkich smutków na\n                                                                ziemi.\n\n    2.    A mnie płakać mej wdzięcznej dziewki pomoście;\n          Z którą mię niepobożna śmierć rozdzieliła             Podmiot liryczny można\n                                                                utożsamić z ojcem zmarłej    P      F\n                                                                dziewczynki."}, {"n": 34, "text": "34 Uzupełnij podane zdania, wybierając właściwe podpowiedzi.\n   Tytuł utworu Jana Kochanowskiego Pieśń II wskazuje na A/B, do którego wiersz ten należy. Ten typ wierszy\n   charakteryzuje się C/D.\n   A. rodzaj literacki                                 C. regularną budową i wyraźną melodyjnością.\n   B. gatunek literacki                                D. wyrafinowaną budową i brakiem rymów."}, {"n": 35, "text": "35 Zaznacz właściwe dokończenie zdania.\n   Fraszka Na zdrowie zaczyna się i kończy\n   A. pytaniem retorycznym.                                C. anaforą.\n   B. metaforą.                                            D. apostrofą."}, {"n": 36, "text": "36 Uzupełnij zdanie, wybierając spośród podanych propozycji.\n   Wyrazy inszy, łacno i snadnie są przykładami A/B. W czasach Jana Kochanowskiego były to wyrazy C/D.\n   A. archaizmów.                                       C. współczesne poecie.\n   B. frazeologizmów.                                   D. które wyszły już w użycia."}, {"n": 37, "text": "37 Wskaż fragment fraszki, w którym ujawnia się podmiot liryczny.\n   A. Inszy niechaj pałace marmórowe mają\n   I szczerym złotogłowem ściany obijają.\n   B. Gościu, siądź pod mym liściem, a odpoczni sobie!\n   Nie dojdzie cię tu słońce, przyrzekam ja tobie.\n   C. Co bez przyjaciół za żywot? Więzienie,\n   W którym niesmaczne żadne dobre mienie.\n   D. Od jednej przyszło aż więc do dziewiąci,\n   A doktorowi mózg się we łbie mąci."}, {"n": 38, "text": "38 Zaznacz fragment Trenu I ukazujący dylemat podmiotu lirycznego. Następnie odpowiedz, czy rozwiązanie\n   tego problemu znajduje się w tekście. Co na to wskazuje?"}, {"n": 39, "text": "39 Wyjaśnij, dlaczego poniższy utwór można nazwać trenem. Na czym polegało nowatorstwo Kochanowskiego\n   wobec antycznego wzorca?\n\n   Jako oliwka mała pod wysokim sadem\n     Idzie z ziemie ku górze macierzyńskim szladem,\n   Jeszcze ani gałązek, ani listków rodząc,\n     Sama tylko dopiro szczupłym prątkiem wschodząc:\n   Tę jesli, ostre ciernie lub rodne pokrzywy\n     Uprzątając, sadownik podciął ukwapliwy,\n   Mdleje za raz, a zbywszy siły przyrodzonej,\n     Upada przed nogami matki ulubionej.\n   Tak ci sie mej namilszej Orszuli dostało:\n     Przed oczyma rodziców swoich rostąc, mało\n   Od ziemie sie co wzniózwszy, duchem zaraźliwym\n     Srogiej śmierci otchniona, rodzicom troskliwym\n   U nóg martwa upadła. O zła Persefono,\n     Mogłażeś tak wielu łzam dać upłynąć płono?"}, {"n": 40, "text": "40 Nazwij środek stylistyczny użyty do zestawienia obrazu przeszłości i teraźniejszości w Trenie VII Jana\n   Kochanowskiego. Opisz elementy składające się na te dwa obrazy."}, {"n": 41, "text": "41 Scharakteryzuj bohaterkę Trenu VIII Jana Kochanowskiego."}], "keyNote": "Ćwiczenie bez pełnego klucza do całego arkusza. Uwaga do pyt. o VII/przeszłość: nie myl z dwoma obrazami domu z VIII."}, {"id": "zbiorczy-b", "title": "Test zbiorczy: fraszki, pieśni, treny — grupa B", "kind": "practice", "head": "Klasa  _____", "tasks": [{"n": 1, "text": "1   Przeczytaj Tren V Jana Kochanowskiego i wykonaj zadania.\n    1. Dokończ zdanie. Wybierz właściwą odpowiedź spośród podanych.\n       Dominującym środkiem stylistycznym w utworze jest\n       A. apostrofa.                                        C. porównanie homeryckie.\n       B. pytanie retoryczne.                               D. wyraz dźwiękonaśladowczy.\n    2. W którym wersie ujawnia się podmiot liryczny? Wybierz właściwą odpowiedź spośród podanych.\n       A. Sama tylko dopiro szczupłym prątkiem wschodząc.\n       B. Upada przed nogami matki ulubionej.\n       C. Tak ci sie mej namilszej Orszuli dostało.\n       D. U nóg martwa upadła.\n    3. Dokończ zdanie. Wybierz właściwą odpowiedź spośród podanych.\n       W sformułowaniu: O zła Persefono występują\n       A. epitet i apostrofa.                               C. epitet i pytanie retoryczne.\n       B. porównanie i metafora.                            D. metafora i wyraz dźwiękonaśladowczy.\n    4. Dokończ zdanie. Wybierz właściwą odpowiedź spośród podanych.\n       Wyrazy rodne, rostąc, łzam to we współczesnej polszczyźnie\n       A. wyrazy zapożyczone.                               C. neologizmy.\n       B. wyrazy potoczne.                                  D. archaizmy."}, {"n": 2, "text": "2   Uzupełnij notatkę dotyczącą Trenu V Jana Kochanowskiego. Wpisz właściwe uzupełnienia spośród\n    podanych.\n    Zamieszczony utwór należy do rodzaju literackiego zwanego (epiką/liryką) ………………\n    W utworze wypowiada się (podmiot liryczny/narrator) ………………………………, który wyraża swój żal\n    po utracie córeczki.\n    Utwór ten zakończony jest (pytaniem retorycznym/puentą) ………………………………."}, {"n": 3, "text": "3   Na podstawie Trenu V Jana Kochanowskiego wyjaśnij, do kogo zostali porównani: Urszulka i Ogrodnik.\n\n    Urszulka – …………………………………………………..……………..………………\n    Ogrodnik – ………………………………………………………..……………….………"}, {"n": 4, "text": "4   Zaznacz właściwe uzupełnienia zdań opisujących środki stylistyczne obecne w Trenie VII Jana\n    Kochanowskiego.\n    1. Używanie zdrobnień przez podmiot liryczny świadczy o ...\n       A. urywanym toku myśli.                                 B. czułości.\n    2. Sen bohaterki został za pomocą ...: żelazny, twardy, nieprzespany.\n       A. epitetów                                             B. peryfraz\n    3. Słowa typu letniczek, uploteczki to z dzisiejszego punktu widzenia ... .\n       A. archaizmy.                                           B. anafory."}, {"n": 5, "text": "5   Dokończ zdanie. Wybierz odpowiedź A lub B i jej uzasadnienie 1, 2 albo 3.\n    Tren V Jana Kochanowskiego jest przykładem rozbudowanego\n                                                                           zawiera bardzo dużo różnorodnych określeń ubarwiających\n                                                                    1.\n       A. epitetu,                                                         czytany tekst.\n                                           ponieważ                 2.     obraz umierania został w nim ujęty w skondensowany sposób.\n\n       B. porównania,                                                      postać Urszulki została w nim zestawiona z drzewem oliwnym\n                                                                    3.\n                                                                           ściętym przedwcześnie."}, {"n": 6, "text": "6   Przeczytaj fragment Pieśni II Jana Kochanowskiego. Dokończ zdanie, wybierając A lub B oraz 1 lub 2.\n          Jan Kochanowski Pieśń II z Ksiag pierwszych (fragment)\n          Serce roście patrząc na te czasy!\n          Mało przedtym gołe były lasy,\n          Śnieg na ziemi wysszej łokcia leżał,\n          A po rzekach wóz nacięższy zbieżał.\n          Teraz drzewa liście na się wzięły,\n          Polne łąki pięknie zakwitnęły;\n          Lody zeszły, a po czystej wodzie\n          Idą statki i ciosane łodzie.\n    W Pieśni II Jana Kochanowskiego występują\n     A. rymy męskie,                                    1.    składające się z ostatniej sylaby.\n                                        czyli\n     B. rymy żeńskie,                                   2.    składające się półtotej sylaby."}, {"n": 7, "text": "7   Przeczytaj fragment fraszki Na lipę Jana Kochanowskiego. Dokończ zdanie, wybierając właściwe\n    uzupełnienia A lub B oraz 1, 2 lub 3.\n          Jan Kochanowski Na lipę (fragment)\n          Gościu, siądź pod mym liściem, a odpoczni sobie,\n          Nie dojdzie cię tu słońce, przyrzekam ja tobie,\n          Choć się nawysszej wzbije, a proste promienie\n          Ściągną pod swoje drzewa rozstrzelane cienie.\n    Fraszka Na lipę Jana Kochanowskiego jest utworem\n                                                   1.   występują w nim rymy męskie.\n     A. rytmicznym,\n                                 ponieważ          2.   w każdym wersie jest jednakowa liczba sylab.\n     B. nierytmicznym,                             3.   w niektórych wersach jest różna liczba sylab."}, {"n": 8, "text": "8   Wybierz dwa właściwe uzupełnienia zdania.\n    Na młodość Jana Kochanowskiego jest\n     A. bajką,                           1.     wykorzystuje alegorię i zawiera puentę.\n                          ponieważ\n     B. fraszką,                         2.     to krótki utwór liryczny zawierający puentę."}, {"n": 9, "text": "9   Określ prawdziwość podanych zdań, które dotyczą Trenu V Jana Kochanowskiego. Przy zdaniach\n    prawdziwych zaznacz literę P, przy zdaniach fałszywych – literę F.\n\n      1.   Konstrukcja trenu opiera się na porównaniu homeryckim.                                  P    F\n      2.   Wiersz rozpoczyna się od apostrofy.                                                     P    F\n      3.   We wierszu występuje odwołanie do mitologii greckiej.                                   P    F\n      4.   Utwór opisuje powrót do równowagi wewnętrznej poety.                                    P    F"}, {"n": 10, "text": "10 Przeczytaj fragment Pieśni świętojańskiej o sobótce Jana Kochanowskiego i zaznacz właściwe dokończenie\n    zdania.\n    Jan Kochanowski Pieśń świętojańska o sobótce (fragment)\n         Panna XII\n    Wsi spokojna, wsi wesoła,\n    Który głos twej chwale zdoła?\n    Kto twe wczasy, kto pożytki\n    Może wspomnieć za raz wszytki?\n    Człowiek w twej pieczy uczciwie\n    Bez wszelakiej lichwy żywie;\n    Pobożne jego staranie\n    I bezpieczne nabywanie.\n    W Pieśni świętojańskiej o sobótce Jana Kochanowskiego występują rymy\n    A. dokładne, żeńskie.                               C. niedokładne, żeńskie.\n    B. dokładne, męskie.                                D. niedokładne, męskie."}, {"n": 11, "text": "11 Przeczytaj fraszkę i zaznacz właściwe dokończenie zdania.\n   Jan Kochanowski Na nabożną\n   Jeśli nie grzeszysz, jako mi powiadasz,\n   Czego się, miła, tak często spowiadasz?\n   Podmiot liryczny uważa, że bohaterka jest\n   A. cnotliwa.                 B. naiwna.              C. obłudna.           D. konsekwentna."}, {"n": 12, "text": "12 Przeczytaj fraszkę i zaznacz właściwe dokończenie zdania.\n   Jan Kochanowski Na nabożną\n   Jeśli nie grzeszysz, jako mi powiadasz,\n   Czego się, miła, tak często spowiadasz?\n   Bohaterka fraszki Jana Kochanowskiego Na nabożną sądzi o sobie, że jest\n   A. obłudna.                 B. naiwna.         C. cnotliwa.               D. konsekwentna."}, {"n": 13, "text": "13 Przeczytaj fraszkę Na młodość Jana Kochanowskiego. Zaznacz powiedzenie, które ma podobny sens do\n   wymowy fraszki.\n   Jan Kochanowski Na młodość\n   Jakoby też rok bez wiosny mieć chcieli,\n   Którzy chcą, żeby młodzi nie szaleli.\n   A. Aby do wiosny!\n   B. Wszystko ma swój czas.\n   C. Jedna jaskółka wiosny nie czyni.\n   D. Miłe złego początki, lecz koniec żałosny."}, {"n": 14, "text": "14 Przeczytaj fraszkę i zaznacz właściwe dokończenie zdania.\n   Jan Kochanowski Na dom w Czarnolesie\n   Panie, to moja praca, a zdarzenie Twoje;\n   Raczysz bogosławieństwo dać do końca swoje.\n   Inszy niechaj pałace marmórowe mają\n   I szczerym złotogłowem ściany obijają,\n   Ja, Panie, niechaj mieszkam w tym gniaździe ojczystym,\n   A Ty mię zdrowiem opatrz i sumnieniem czystym,\n   Pożywieniem ućciwym, ludzką życzliwością,\n   Obyczajmi znośnymi, nieprzykrą starością.\n   Z fraszki Jana Kochanowskiego Na dom w Czarnolesie wynika, że dla podmiotu lirycznego najważniejsze są\n   wartości\n   A. uniwersalne i niematerialne.\n   B. nieprzemijające i kosztowne.\n   C. trwałe i materialne.\n   D. ulotne i duchowe."}, {"n": 15, "text": "15 Przeczytaj fraszkę Jana Kochanowskiego Do Hanny. Zaznacz frazeologizm, który najtrafniej oddaje\n   zachowanie Hanny wobec podmiotu lirycznego.\n   Jan Kochanowski Do Hanny\n   Na palcu masz dyjament, w sercu twardy krzemięń,\n   Pierścień mi, Hanno, dajesz, już i serce przemięń.\n   A. Stracić serce.\n   B. Mieć serce na dłoni.\n   C. Mieć serce z kamienia.\n   D. Chwycić za serce."}, {"n": 16, "text": "16 Przeczytaj fraszkę Na młodość Jana Kochanowskiego i zaznacz właściwe dokończenie zdania.\n   Jan Kochanowski Na młodość\n   Jakoby też rok bez wiosny mieć chcieli,\n   Którzy chcą, żeby młodzi nie szaleli.\n   We fraszce Na młodość Jana Kochanowskiego młodość została porównana do\n   A. wiosny.\n   B. pór roku.\n   C. szaleństwa.\n   D. roku."}, {"n": 17, "text": "17 Jakimi współczesnymi synonimami można by zastąpić podkreślone słowa?\n   Nie dopuściłaś nigdy matce się frasować –  _____\n\n   Z każdego kąta żałość człowieka ujmuje –  _____\n\n   A serce swej pociechy darmo upatruje –  _____"}, {"n": 18, "text": "18 Napisz, czym jest porównanie homeryckie i zaznacz je w Trenie I. Napisz, jakie zjawisko zostało przez nie\n   scharakteryzowane i z jakim obrazem zestawione."}, {"n": 19, "text": "19 Tren I Jana Kochanowskiego kończy się pytaniem. Wyjaśnij jego znaczenie.\n\n       Nie wiem, co lżej: czy w smutku jawnie żałować,\n       Czyli się z przyrodzeniem gwałtem mocować?"}, {"n": 20, "text": "20 Napisz, do kogo, w jakiej formie i w jakim celu zwraca się podmiot liryczny w ostatniej strofie Pieśni II z\n   Ksiąg pierwszych.\n   Dobra myśli, której nie przywabi,\n   Choć kto ściany drogo ujedwabi,\n   Nie gardź moim chłodnikiem chruścianym,\n   A bądź ze mną, z trzeźwym i z pijanym!"}, {"n": 21, "text": "21 2. a) Z Pieśni świętojańskiej o sobótce Jana Kochanowskiego wypisz fragmenty, które informują o:\n   • stosunku mieszkańców wsi do pieniędzy;\n   • zasadach wychowywania dzieci.\n   b) Czy uważasz te postawy życiowe za wartościowe i godne naśladowania? Uzasadnij swoje stanowisko."}, {"n": 22, "text": "22 Uzasadnij, że Pieśń świętojańska o sobótce Jana Kochanowskiego prezentuje renesansową wizję człowieka i\n   szczęścia. Podaj dwa argumenty.\n   Argument 1:  _____\n   Argument 2:  _____"}, {"n": 23, "text": "23 Zapisz, co według Ciebie, znaczy wyraz „fraszka” występujący w początkowych wersach utworu O żywocie\n   ludzkim Jana Kochanowskiego.\n   Fraszki to wszytko, cokolwiek myślemy,\n   Fraszki to wszytko, cokolwiek czyniemy."}, {"n": 24, "text": "24 Dlaczego według podmiotu lirycznego utworu Do fraszek Jana Kochanowskiego pochwała powinna być\n   skromna?\n   Jan Kochanowski Do fraszek\n   Fraszki moje (coście mi dotąd zachowały),\n   Nie chcę, żebyście kogo źle wspominać miały.\n   Lecz jeśli wam nie g myśli cudze obyczaje,\n   Niechaj karta występom, nie personom łaje!\n   Chcecieli chwalić kogo, chwalciesz, ale skromnie,\n   By pochlebstwa jakiego nie uznano po mnie.\n   To też wiedzcie, że drudzy swej się chwały wstydzą\n   Podobno, że chwalnego w sobie nic nie widzą."}, {"n": 25, "text": "25 Zaznacz w podanej fraszce Jana Kochanowskiego fragment, który ma taki sam sens, jak słowa pochodzące z\n   Monachomachii Ignacego Krasickiego:\n   „I śmiech niekiedy może być nauką,\n   kiedy się z przywar nie z osób natrząsa”.\n   Jan Kochanowski Do fraszek\n   Fraszki moje (coście mi dotąd zachowały),\n   Nie chcę, żebyście kogo źle wspominać miały.\n   Lecz jeśli wam nie g myśli cudze obyczaje,\n   Niechaj karta występom, nie personom łaje!\n   Chcecie li chwalić kogo, chwalcież, ale skromnie,\n   By pochlebstwa jakiego nie uznano po mnie.\n   To też wiedzcie, że drudzy swej się chwały wstydzą\n   Podobno, że chwalnego w sobie nic nie widzą."}, {"n": 26, "text": "26 Jaką myśl zawierają pierwsze cztery wersy fraszki Jana Kochanowskiego Na zdrowie?\n   Ślachetne zdrowie,\n   Nikt się nie dowie,\n   Jako smakujesz,\n   Aż się zepsujesz."}, {"n": 27, "text": "27 Jaką prośbę wypowiada podmiot liryczny fraszki Na zdrowie w końcowej części utworu?"}, {"n": 28, "text": "28 Wypisz z tekstu fraszki Na Zdrowie Jana Kochanowskiego określenie, którym autor zastąpił wyrażenie\n   „szlachetne zdrowie”. O czym świadczy użycie takiego określenia?"}, {"n": 29, "text": "29 Zapisz, jaki środek stylistyczny został wykorzystany w podanej fraszce.\n   Jan Kochanowski Na nabożną\n   Jeśli nie grzeszysz, jako mi powiadasz,\n   Czego się, miła, tak często spowiadasz?"}, {"n": 30, "text": "30 Na podstawie podanych fragmentów i znajomości całych fraszek napisz, czego dowiadujemy się o adresacie\n   lirycznym.\n   A. Gościu, siądź pod mym liściem, a odpoczni sobie!\n        Nie dojdzie cię tu słońce, przyrzekam ja tobie.\n                                                                             Na lipę\n    _____\n    _____\n   B. Na palcu masz dyjament, w sercu twardy krzemień,\n        Pierścień mi, Hanno, dajesz, już i serce przemień!\n                                                                           Do Hanny\n    _____\n    _____\n   C. Panie, to moja praca, a zdarzenie Twoje;\n        Raczysz błogosławieństwo dać do końca swoje!\n                                                 Na dom w Czarnolesie\n    _____\n    _____"}, {"n": 31, "text": "31 Wpisz do tabeli informacje dotyczące budowy i funkcji tytułów fraszek Kochanowskiego.\n                                                Schemat budowy (części mowy\n         Tytuły fraszek                                                                                                        Funkcja tytułów\n                                                      tworzące tytuły)\n    Na lipę\n    Na zachowanie\n    Do Hanny"}, {"n": 32, "text": "32 Uzupełnij zdania. Wybierz właściwe odpowiedzi spośród podanych.\n\n   Tren VIII Jana Kochanowskiego jest zbudowany na zasadzie A/B. Świadczy o tym C/D.\n   A. podobieństw                                      C. scena ukazująca rozpaczającego ojca\n   B. kontrastu                                        D. obraz radosnego domu i pustka po jej śmierci"}, {"n": 33, "text": "33 Oceń prawdziwość podanych stwierdzeń w odniesieniu do tekstu Trenu I Jana Kochanowskiego. Przy zdaniu\n   prawdziwym zaznacz literę P, a przy fałszywym – F.\n\n                                Cytat                                     Wyjaśnienie\n\n    1.    Wszytki płacze, wszytki łzy Heraklitowe\n          I lamenty, i skargi Symonidowe,\n          Wszytki troski na świecie, wszytki wzdychania         Podmiot liryczny kieruje\n          I żale, i frasunki, i rąk łamania,                    swoją wypowiedź do\n          Wszytki a wszytki za raz w dom się mój noście                                      P      F\n                                                                wszystkich smutków na\n                                                                ziemi.\n\n    2.    A mnie płakać mej wdzięcznej dziewki pomoście;\n          Z którą mię niepobożna śmierć rozdzieliła             Podmiot liryczny można\n                                                                utożsamić z ojcem zmarłej    P      F\n                                                                dziewczynki."}, {"n": 34, "text": "34 Uzupełnij podane zdania, wybierając właściwe podpowiedzi.\n   Tytuł utworu Jana Kochanowskiego Pieśń II wskazuje na A/B, do którego wiersz ten należy. Ten typ wierszy\n   charakteryzuje się C/D.\n   A. gatunek literacki                                C. wyrafinowaną budową i brakiem rymów.\n   B. rodzaj literacki                                 D. regularną budową i wyraźną melodyjnością."}, {"n": 35, "text": "35 Zaznacz właściwe dokończenie zdania.\n   Fraszka Na zdrowie zaczyna się i kończy\n   A. pytaniem retorycznym.                                C. metaforą.\n   B. apostrofą.                                           D. anaforą."}, {"n": 36, "text": "36 Uzupełnij zdanie, wybierając spośród podanych propozycji.\n   Wyrazy inszy, łacno i snadnie są przykładami A/B. W czasach Jana Kochanowskiego były to wyrazy C/D.\n   A. frazeologizmów.                                   C. współczesne poecie.\n   B. archaizmów.                                       D. które wyszły już w użycia."}, {"n": 37, "text": "37 Wskaż fragment fraszki, w którym ujawnia się podmiot liryczny.\n   A. Od jednej przyszło aż więc do dziewiąci,\n   A doktorowi mózg się we łbie mąci.\n   B. Inszy niechaj pałace marmórowe mają\n   I szczerym złotogłowem ściany obijają.\n   C. Co bez przyjaciół za żywot? Więzienie,\n   W którym niesmaczne żadne dobre mienie.\n   D. Gościu, siądź pod mym liściem, a odpoczni sobie!\n   Nie dojdzie cię tu słońce, przyrzekam ja tobie."}, {"n": 38, "text": "38 Zaznacz fragment Trenu I ukazujący dylemat podmiotu lirycznego. Następnie odpowiedz, czy rozwiązanie\n   tego problemu znajduje się w tekście. Co na to wskazuje?"}, {"n": 39, "text": "39 Wyjaśnij, dlaczego poniższy utwór można nazwać trenem. Na czym polegało nowatorstwo Kochanowskiego\n   wobec antycznego wzorca?\n\n   Jako oliwka mała pod wysokim sadem\n     Idzie z ziemie ku górze macierzyńskim szladem,\n   Jeszcze ani gałązek, ani listków rodząc,\n     Sama tylko dopiro szczupłym prątkiem wschodząc:\n   Tę jesli, ostre ciernie lub rodne pokrzywy\n     Uprzątając, sadownik podciął ukwapliwy,\n   Mdleje za raz, a zbywszy siły przyrodzonej,\n     Upada przed nogami matki ulubionej.\n   Tak ci sie mej namilszej Orszuli dostało:\n     Przed oczyma rodziców swoich rostąc, mało\n   Od ziemie sie co wzniózwszy, duchem zaraźliwym\n     Srogiej śmierci otchniona, rodzicom troskliwym\n   U nóg martwa upadła. O zła Persefono,\n     Mogłażeś tak wielu łzam dać upłynąć płono?"}, {"n": 40, "text": "40 Nazwij środek stylistyczny użyty do zestawienia obrazu przeszłości i teraźniejszości w Trenie VII Jana\n   Kochanowskiego. Opisz elementy składające się na te dwa obrazy."}, {"n": 41, "text": "41 Scharakteryzuj bohaterkę Trenu VIII Jana Kochanowskiego."}], "keyNote": "Ćwiczenie bez pełnego klucza do całego arkusza."}, {"id": "powtorka-41", "title": "Znajomość twórczości — 41 pytań do powtórki", "kind": "practice", "head": "Znajomość twórczości Jana Kochanowskiego.", "tasks": [{"n": 1, "text": "1. W jakiej epocę tworzył Jan Kochanowski?\n _____"}, {"n": 2, "text": "2. W którym wieku żył Jan Kochanowski?\n _____"}, {"n": 3, "text": "3. Co oznacza humanizm?\n _____"}, {"n": 4, "text": "4. W którym wieku tworzył?\n _____"}, {"n": 5, "text": "5. Gdzie zamieszkał Jan Kochanowski?\n _____"}, {"n": 6, "text": "6. Czy Jan Kochanowski miał córkę?\n _____"}, {"n": 7, "text": "7. Jakie gatunki literackie zapoczątkował Jan Kochanowski?\n _____"}, {"n": 8, "text": "8. Jakie fraszki omawialiśmy na lekcji? Podaj nazwy tych\nfraszek.\n _____\n _____"}, {"n": 9, "text": "9. Do kogo podmiot liryczny zwraca się we fraszcę „ Do\nfraszek” ?\n _____"}, {"n": 10, "text": "10. Czy fraszki krytykowały ludzi?\n _____"}, {"n": 11, "text": "11. Czy fraszki mogą pochwalić dobre postępowania?\n _____"}, {"n": 12, "text": "12. Do kogo zwraca się podmiot liryczny we fraszce „ Na\nmłodość” ?\n _____"}, {"n": 13, "text": "13. Jakie wnioski można wyciągnąć z fraszki „Na młodość”?\n _____\n _____"}, {"n": 14, "text": "14. Do kogo zwraca się podmiot liryczny we fraszce „ Do\nHanny” ?\n _____"}, {"n": 15, "text": "15. Jakie wnioski można wyciągnąć z fraszki „Do Hanny”?\n _____\n _____"}, {"n": 16, "text": "16. Kogo krytykuję fraszka „Na nabożną”?\n _____"}, {"n": 17, "text": "17. Do kogo zwraca się podmiot liryczny we fraszce „ Na\nzdrowie” ?\n _____"}, {"n": 18, "text": "18. Jaki komunikat nadaję podmiot liryczny tej fraszki?\n _____\n _____"}, {"n": 19, "text": "19. Czym są epitety?\n _____"}, {"n": 20, "text": "20. Wypisz epitety z fraszki „Na zdrowie” :\n _____\n _____"}, {"n": 21, "text": "21. Czym jest apostrofa?"}, {"n": 22, "text": "22. Jakie są rodzaję rymów?\n _____"}, {"n": 23, "text": "23. Do kogo zwraca się podmiot liryczny we fraszce „ Na\nlipę” ?\n _____"}, {"n": 24, "text": "24. Jaki komunikat nadaję podmiot liryczny tej fraszki?\n _____"}, {"n": 25, "text": "25. O co prosi podmiot liryczny?\n _____"}, {"n": 26, "text": "26. Czym są treny ?\n _____"}, {"n": 27, "text": "27. Jak miała na imię córka Jana Kochanowskiego?\n _____"}, {"n": 28, "text": "28. Co podmiot liryczny przekazuje w trenie VII?\n _____"}, {"n": 29, "text": "29. Z czego podmiot liryczny zdaje sobie sprawę w trenie\nVII?\n _____"}, {"n": 30, "text": "30. Co podmiot liryczny pokazuję w trenie VIII?\n _____"}, {"n": 31, "text": "31. Jakie uczucia pokazuje podmiot liryczny w trenie VIII?\n _____"}, {"n": 32, "text": "32. Czym jest kontrast?\n _____"}, {"n": 33, "text": "33. Co uważa podmiot liryczny o życiu na wsi?"}, {"n": 34, "text": "34. Czy Jan Kochanowski pisał pieśni?\n _____"}, {"n": 35, "text": "35. Czym jest pieśń?\n _____"}, {"n": 36, "text": "36. Jakie obowiązki miał gospodarz i jego żony? Wypisz z\nwiadomości z pieśni „Pieśń świętojańska o sobótce”.\n _____\n _____\n _____\n _____"}, {"n": 37, "text": "37. Jaka jest różnica między życiem w mieście ?\n _____"}, {"n": 38, "text": "38. Jakie są cechy fraszki?\n _____"}, {"n": 39, "text": "39. Jakie są cechy trenu?\n _____"}, {"n": 40, "text": "40. Jakie są cechy pieśni?\n _____"}, {"n": 41, "text": "41. Jakie wartości sąprzedstawione we fraszkach\nKochanowskiego?\n _____\n _____"}], "keyNote": "Bez klucza; lista nie określa zakresu Twojego sprawdzianu."}, {"id": "szerszy", "title": "Test szerszy zakres (m.in. pieśni i środki)", "kind": "practice", "head": "Test szerszy zakres (m.in. pieśni i środki)", "tasks": [{"n": 1, "text": "1   Zaznacz te nazwy miejsc, które nie zostały wymienione w Trenie X Jana Kochanowskiego.                                           ( ... / 2 p.)\n    A. niebo     B. raj       C. czyściec     D. Olimp    E. wyspy szczęśliwe   F. Walhalla                      G. Elizjum"}, {"n": 2, "text": "2   Zaznacz te postacie, które nie pojawiają się w Odprawie posłów greckich.                                                        ( ... / 2 p.)\n    A. Achilles                                            E. Helena\n    B. Hektor                                              F. Kasandra\n    C. Aleksander                                          G. Agamemnon\n    D. Priam"}, {"n": 3, "text": "3   Zaznacz te cechy tragedii antycznej, które są obecne w Odprawie posłów greckich.                                                ( ... / 2 p.)\n    A. parodos                                             D. nie więcej niż trzech aktorów na scenie\n    B. zasada trzech jedności                              E. komentarze chóru\n    C. zasada decorum                                      F. exodos"}, {"n": 4, "text": "4   Zaznacz te tematy, które występują w cyklu Treny.                                                                               ( ... / 2 p.)\n\n    A. Demonstracja żalu.\n    B. Zwrócenie się o pomoc do innych.\n    C. Rozpamiętywanie straty.\n    D. Pochwała zalet i cnót zmarłej osoby.\n    E. Pocieszenie.\n    F. Modlitwa za duszę zmarłych."}, {"n": 5, "text": "5   Określ prawdziwość stwierdzeń. Przy zdaniach prawdziwych zaznacz literę P, a przy fałszywych – F.                               ( ... / 2 p.)\n\n        1.       Jan Kochanowski napisał Treny w okresie czarnoleskim.                                     P          F\n        2.       W Trenach podmiot liryczny znajduje pocieszenie w mądrości starożytnych.                  P          F\n        3.       W Trenach można znaleźć opisy życia rodzinnego Jana Kochanowskiego.                       P          F\n        4.       Jan Kochanowski opisał w Trenach uroczystości żałobne po śmierci córki.                   P          F"}, {"n": 6, "text": "6   Określ prawdziwość podanych stwierdzeń. Przy zdaniach prawdziwych zaznacz literę P, a przy fałszywych –                         ( ... / 2 p.)\n    F.\n                 Cykl Treny zawiera 19 wierszy oraz obszerny wstęp będący opisem\n        1.                                                                                                 P          F\n                 okoliczności śmierci córki.\n                 Jan Kochanowski nigdy nie opublikował Trenów i zostały one odkryte dopiero\n        2.                                                                                                 P          F\n                 w XX w.\n        3.       Cykl Treny składa się z 19 wierszy i jest poświęcony zmarłej córce Urszulce.              P          F\n        4.       Treny są wzorowane na renesansowych utworach pochodzących z Włoch.                        P          F"}, {"n": 7, "text": "7   Oceń, które zdania dotyczące Pieśni V Jana Kochanowskiego są prawdziwe, a które – fałszywe. Przy                                ( ... / 2 p.)\n    zdaniach prawdziwych zaznacz literę P, a przy fałszywych – F.\n        1.       Pieśń V jest również nazywana Pieśnią o spustoszeniu Podola.                              P          F\n        2.       Pieśń V opisuje najazd Turków na Podole.                                                  P          F\n        3.       W Pieśni V występuje przysłowie: człowiek człowiekowi wilkiem.                            P          F\n        4.       Pieśń V została napisana w okresie bezkrólewia.                                           P          F"}, {"n": 8, "text": "8   Oceń, które zdania dotyczące Pieśni XXIV Jana Kochanowskiego są prawdziwe, a które – fałszywe. Przy             ( ... / 2 p.)\n    zdaniach prawdziwych zaznacz literę P, a przy fałszywych – F.\n      1.   Podmiot liryczny Pieśni XXIV nie wierzy w moc i trwałość poezji.                      P   F\n      2.   Osoba mówiąca w Pieśni XXIV uważa, że ma dwoistą naturę: ludzką i ptasią.             P   F\n      3.   Pieśń XXIV jest parafrazą utworu Horacego Wybudowałem pomnik.                         P   F\n      4.   Pieśń XXIV zaczyna się od słów: „Niezwykłym i nie leda piórem opatrzony”.             P   F"}, {"n": 9, "text": "9   Udowodnij, że Odprawa posłów greckich ma znaczenie przenośne, które odnosiło się do czasów                      ( ... / 2 p.)\n    współczesnych autorowi."}, {"n": 10, "text": "10 Uzupełnij notatkę.                                                                                               ( ... / 3 p.)\n    Odprawa posłów greckich nawiązuje do mitu  _____  i do\n     _____  Homera. Akcja rozgrywa się  _____  wojny\n    z Grekami. Na dworze  _____  pojawiają się posłowie greccy z żądaniem\n     _____ . Dalsza część dramatu przedstawia spór między\n     _____  a  _____ ."}, {"n": 11, "text": "11 Uzupełnij tekst.                                                                                                 ( ... / 3 p.)\n    Tren jako gatunek wywodzi się z  _____ . Bohaterem lirycznym Trenów\n    Jana Kochanowskiego jest  _____  piszący o swojej rozpaczy po śmierci\n     _____ . Jan z Czarnolasu przedstawia w Trenach różne fazy radzenia sobie\n    z cierpieniem, od  _____  i  _____  po pogodzenie się z tym faktem\n    i uzyskanie  _____ ."}, {"n": 12, "text": "12 Napisz w trzech punktach, czym różni się Tren XIX Jana Kochanowskiego od innych utworów z tego cyklu.            ( ... / 2 p.)"}, {"n": 13, "text": "13 Wyjaśnij, w czym znajduje pocieszenie bohater Trenu XIX?                                                         ( ... / 2 p.)"}, {"n": 14, "text": "14 Uzupełnij notatkę.                                                                                               ( ... / 3 p.)\n    Tren XIX jest  _____  utworem całego cyklu. Podmiot liryczny opisuje\n    swój sen, w którym pojawia się jego  _____  trzymająca na rękach\n     _____ . Prawie cały tren jest wypowiedzią  _____ .\n    Opowiada ona podmiotowi, jak wygląda  _____ . Mówi mu,\n    że jest wolne od trosk i cierpienia, a także pełne spokoju i poczucia wiecznego szczęścia.\n    Matka radzi mu również, jak uporać się z  _____ ."}, {"n": 15, "text": "15 Udowodnij, że Tren XI jest wyrazem bezradności człowieka wobec losu.                                             ( ... / 2 p.)"}, {"n": 16, "text": "16 Uzupełnij notatkę.                                                                                               ( ... / 3 p.)\n    Tren X jest wynikiem kryzysu  _____ . Podmiot liryczny nie jest pewien,\n    gdzie znajduje się dusza jego dziecka, czy w chrześcijańskim  _____ ,\n    czy może w mitologicznym  _____ . W zakończeniu zaczyna nawet\n    wątpić w  _____  duszy, w to, czy gdziekolwiek ona przebywa.\n    W ostatnich wersach  _____ ukazuje swoje cierpienie i jest gotowy\n    zaakceptować każdą formę obecności  _____ . Może ona stawić się\n    przed nim nawet jako „mara nikczemna”."}, {"n": 17, "text": "17 Dlaczego Tren IX jest wyrazem dramatu renesansowego humanisty?                                                   ( ... / 2 p.)"}, {"n": 18, "text": "18 Napisz, z jakim apelem zwraca się poeta do odbiorców w Pieśni V.                                                 ( ... / 2 p.)"}, {"n": 19, "text": "19 W jaki sposób Jan Kochanowski wykorzystał w Pieśni XXIV motyw ptaka i lotu? Dopisz odpowiednie                   ( ... / 2 p.)\n    dokończenia zdań.\n    A. Pióro to symbol  _____ .\n    B. Lot to symbol  _____ .\n    C. Wysokość lotu symbolizuje  _____ ."}, {"n": 20, "text": "20 Wyjaśnij, jak rozumiesz słowa: „U Fortuny to snadnie / Że kto stojąc upadnie”.                                   ( ... / 2 p.)"}, {"n": 21, "text": "21 Czy Pieśń IX można nazwać utworem biesiadnym? Uzasadnij swoje zdanie.                                            ( ... / 2 p.)"}, {"n": 22, "text": "22 Uzupełnij zdania dotyczące Pieśni IX.                                                                          ( ... / 2 p.)\n   A. Renesansowy twórca odwołuje się w swojej pieśni do myśli  _____ ,\n   która głosiła, że należy dążyć do szczęścia i rozsądnie korzystać z jego uroków.\n   B. Jan Kochanowski w swojej pieśni nawiązuje do znanej sentencji carpe diem, która\n   pochodzi z twórczości  _____  i znaczy:  _____ .\n   C. W pieśni tej można też znaleźć odwołania do  _____  głoszącego,\n   że w życiu należy ograniczać pragnienia i zachowywać umiar."}, {"n": 23, "text": "23 Uzasadnij, że pieśń Czego chcesz od nas, Panie… należy do liryki inwokacyjnej (zwrotu do adresata).            ( ... / 2 p.)"}, {"n": 24, "text": "24 Przypomnij sobie Tren XI Jana Kochanowskiego i wybierz właściwe dokończenie zdania.                            ( ... / 1 p.)\n   Poeta w Trenie XI zakwestionował następujące wartości:\n   A. pobożność, mądrość, odwagę, uczciwość.\n   B. pobożność, dobroć, mądrość, prawość.\n   C. przezorność, uczciwość, dobroć, rycerskość.\n   D. honor, uczciwość, cierpliwość, wyrozumiałość."}, {"n": 25, "text": "25 Zaznacz właściwą odpowiedź na podane pytanie.                                                                  ( ... / 1 p.)\n   Który z królów Polski był obecny na premierze Odprawy posłów greckich Jana Kochanowskiego?\n   A. Stefan Batory                                    C. Zygmunt Stary\n   B. Zygmunt August                                   D. Henryk Walezy"}, {"n": 26, "text": "26 Zaznacz właściwą odpowiedź na podane pytanie.                                                                  ( ... / 1 p.)\n   Kto pojawia się we śnie podmiotu lirycznego w Trenie XIX?\n   A. matka i ojciec         B. matka z Urszulką          C. tylko Urszulka          D. Matka Boska"}, {"n": 27, "text": "27 Wybierz właściwe dokończenie zdania.                                                                           ( ... / 1 p.)\n   Tren X Jana Kochanowskiego rozpoczyna się\n   A. apostrofą do Boga.\n   B. opisem raju, w którym przebywa Urszulka.\n   C. pytaniem retorycznym skierowanym do personifikacji mądrości.\n   D. apostrofą i pytaniem retorycznym skierowanymi do Urszulki."}, {"n": 28, "text": "28 Odpowiedz na pytanie, wybierając A lub B oraz C lub D.                                                         ( ... / 1 p.)\n   Jakie rymy występują w przytoczonym fragmencie Trenu IX Jana Kochanowskiego?\n   Kupić by cię, Mądrości, za drogie pieniądze,\n   Która (jeśli prawdziwie mienią) wszytki żądze,\n   Wszytki ludzkie frasunki umiesz wykorzenić,\n   A człowieka tylko nie w anioła odmienić […].\n   A. rymy krzyżowe                                   C. rymy męskie\n   B. rymy parzyste                                   D. rymy żeńskie"}, {"n": 29, "text": "29 Wybierz właściwe dokończenie zdania.                                                                           ( ... / 1 p.)\n   Jan Kochanowski w Pieśni V porównał Polaków do\n   A. bezbronnych łani ściganych w lesie przez wilki.\n   B. stada owiec, których nie strzegą ani pasterz, ani psy.\n   C. sprytnego lisa, który długo czeka na okazję.\n   D. papugi, która potrafi powtarzać tylko cudze zdanie."}, {"n": 30, "text": "30 Zaznacz właściwą odpowiedź na podane pytanie.                                                                  ( ... / 1 p.)\n   Która z rzymskich bogini została wymieniona w Pieśni IX Jana Kochanowskiego?\n   A. Junona                 B. Fortuna               C. Wenus                D. Prozerpina"}, {"n": 31, "text": "31 Zaznacz właściwą odpowiedź na podane pytanie.                                                                  ( ... / 1 p.)\n   Jaka jest wizja Boga w pieśni Czego chcesz od nas, Panie…?\n   A. Bóg obdarzający ludzi łaską i miłością\n   B. Bóg jako artysta, twórca doskonałego świata\n   C. zbawiciel ludzkości, składający z siebie ofiarę\n   D. groźny starotestamentowy Bóg, karzący za grzechy"}, {"n": 32, "text": "32 Zaznacz właściwą odpowiedź na podane pytanie.                                                                  ( ... / 1 p.)\n   Twórczość którego ze starożytnych poetów była inspiracją dla Pieśni Jana Kochanowskiego?\n   A. Homera               B. Arystofanesa              C. Horacego               D. Wergiliusza"}, {"n": 33, "text": "33 Nazwij środki stylistyczne i zapisz, jaką pełnią funkcje.                                                      ( ... / 2 p.)\n\n    Cytat                         Środek stylistyczny               Funkcja\n\n    I w otchłaniach, i w morzu,\n    na ziemi, na niebie.\n    Czego chcesz od nas,\n    Panie, za Twe hojne dary?\n    w kłosianym wieńcu Lato\n    chodzi"}], "keyNote": "Szerszy niż minimalna lista do sprawdzianu — opcjonalnie. Bez potwierdzonego klucza."}, {"id": "archaizmy", "title": "Archaizmy z Trenu VII — słowniczek", "kind": "study", "cards": [{"f": "ochędóstwo", "b": "stroje, ozdoby, ubiór", "s": "Archaizmy z Trenu VII"}, {"f": "letniczek", "b": "lekka letnia sukienka", "s": "Archaizmy z Trenu VII"}, {"f": "pisany", "b": "tu: wzorzysty, barwny", "s": "Archaizmy z Trenu VII"}, {"f": "uploteczki", "b": "wstążeczki do włosów", "s": "Archaizmy z Trenu VII"}, {"f": "płone", "b": "daremne, bezużyteczne", "s": "Archaizmy z Trenu VII"}, {"f": "łożnica / łożnice", "b": "łoże / dawna forma odmiany", "s": "Archaizmy z Trenu VII"}, {"f": "dziewka", "b": "tu: dziewczynka, córka", "s": "Archaizmy z Trenu VII"}, {"f": "mać", "b": "matka", "s": "Archaizmy z Trenu VII"}, {"f": "giezłeczko", "b": "cienka koszulka", "s": "Archaizmy z Trenu VII"}, {"f": "archaizm", "b": "dawny wyraz, znaczenie lub forma językowa, które wyszły z powszechnego użycia; w dawnym tekście to język epoki, nie współczesna stylizacja", "s": "Pojęcia"}]}, {"id": "bio", "title": "Biografia Jana Kochanowskiego — fiszki", "kind": "study", "cards": [{"f": "Kiedy żył Jan Kochanowski?", "b": "ur. 1530 w Sycynie, zm. 22 sierpnia 1584 w Lublinie", "s": "Biografia"}, {"f": "Epoka", "b": "renesans (odrodzenie)", "s": "Biografia"}, {"f": "Gdzie studiował?", "b": "Akademia Krakowska (wpis 1544); Padwa (ok. 1552–1555); także Królewiec, podróże do Włoch i Francji", "s": "Biografia"}, {"f": "Czarnolas", "b": "po podziale majątku (1559) Janowi przypadł Czarnolas; tu tworzył w okresie czarnoleskim", "s": "Biografia"}, {"f": "Urzędy / funkcje", "b": "sekretarz królewski; wojski sandomierski (1579–1584); m.in. prepozyt poznański", "s": "Biografia"}, {"f": "Znaczenie", "b": "jeden z najwybitniejszych twórców renesansu w Europie; rozwijał polski język literacki", "s": "Biografia"}, {"f": "Najważniejsze gatunki", "b": "fraszki, pieśni, treny; także Odprawa posłów greckich i inne", "s": "Biografia"}, {"f": "Treny — komu poświęcone?", "b": "zmarłej córce Urszulce (Urszuli)", "s": "Biografia"}]}, {"id": "fraszki", "title": "Fraszki — gatunek i przykłady", "kind": "study", "cards": [{"f": "Fraszka — definicja", "b": "krótki utwór wierszowany, często żartobliwy lub refleksyjny, zwykle zakończony puentą; nie każda fraszka musi być komiczna", "s": "Gatunek"}, {"f": "Na lipę — motyw", "b": "apostrofa do lipy; cień, odpoczynek, gościnność natury; puenta o dobrach płynących z drzewa", "s": "Tytuły"}, {"f": "Na dom w Czarnolesie", "b": "pochwała domu i umiaru; błogosławieństwo dla gościa i gospodarza", "s": "Tytuły"}, {"f": "Na zdrowie", "b": "zdrowie jako najwyższe dobro; prośba o jego zachowanie", "s": "Tytuły"}, {"f": "O żywocie ludzkim", "b": "refleksja o ulotności życia; ludzie jak cienie / fraszki", "s": "Tytuły"}, {"f": "Puenta", "b": "zaskakujące, domykające domknięcie myśli na końcu fraszki", "s": "Gatunek"}]}, {"id": "treny-vii-viii", "title": "Treny VII i VIII — fiszki", "kind": "study", "cards": [{"f": "Tren — gatunek", "b": "pieśń żałobna (lament), pochwała zalet zmarłego; w szkole: przyczyna żalu, pochwała, opłakiwanie, pocieszenie, pouczenie — nie każdy pojedynczy tren ma wszystkie części", "s": "Gatunek"}, {"f": "Treny — cykl", "b": "19 utworów Kochanowskiego poświęconych Urszulce; nowatorstwo wobec antyku (dziecko + cały cykl)", "s": "Gatunek"}, {"f": "Tren VII — temat", "b": "ubrania, marzenia rodziców (wesele, posag) skontrastowane z pochówkiem; zdrobnienia = czułość i bezbronność dziecka", "s": "VII i VIII"}, {"f": "Tren VIII — temat", "b": "dwa obrazy domu: radosny za życia Urszulki i pogrążony w ciszy po śmierci; klamra kompozycyjna pustego domu", "s": "VII i VIII"}, {"f": "Podmiot VII/VIII", "b": "ojciec opłakujący córkę; w VII zwraca się do ubranek, potem do córki; w VIII bezpośrednio do Urszulki", "s": "VII i VIII"}, {"f": "Apostrofa", "b": "bezpośredni zwrot do adresata (osoby, rzeczy, abstraktu), np. do ubranek, do Urszulki, do Persefony", "s": "Środki"}, {"f": "Porównanie homeryckie", "b": "rozbudowane porównanie, w którym drugi człon tworzy osobny obraz (np. oliwka / smok i słowiczki)", "s": "Środki"}, {"f": "Kontrast w VIII", "b": "życie pełne śpiewu i ruchu vs cisza i pustka domu po śmierci dziecka", "s": "VII i VIII"}]}, {"id": "piesni", "title": "Pieśń XXV i Panna XII — fiszki", "kind": "study", "cards": [{"f": "Pieśń XXV — adresat", "b": "Bóg; człowiek mówi także w imieniu wspólnoty; hymn dziękczynny za piękny, hojny świat", "s": "Pieśń XXV"}, {"f": "Pieśń XXV — postawa", "b": "wdzięczność, pokora, prośba o opiekę; człowiek mały wobec Stwórcy", "s": "Pieśń XXV"}, {"f": "Klasycyzm w pieśni", "b": "zwrotki 4-wersowe, równa liczba sylab, rymy parzyste, paralelizm, prosty język, apostrofy i anafory", "s": "Pieśń XXV"}, {"f": "Panna XII — kto mówi?", "b": "jedna z dwunastu panien w Pieśni świętojańskiej o sobótce", "s": "Sobótka"}, {"f": "Panna XII — temat", "b": "pochwała wsi: uczciwa praca, gospodarstwo, rodzina, wypoczynek, śpiew, taniec, natura; wizja wyidealizowana (Arkadia)", "s": "Sobótka"}, {"f": "Apostrofa w Pannie XII", "b": "zwrot do wsi (nie do Boga); apostrofa do Boga zaczyna Pieśń XXV — poprawka do omówienia s. 9", "s": "Sobótka"}, {"f": "Motyw Arkadii", "b": "wieś jako oaza spokoju i szczęścia; równowaga pracy i odpoczynku; kontrast z życiem dworskim i „w biegu”", "s": "Sobótka"}]}, {"id": "sciaga", "title": "Ściąga — krótkie przypomnienia", "kind": "cheat", "sheets": [{"title": "Definicje", "items": ["**Fraszka** — krótki utwór wierszowany, często żartobliwy lub refleksyjny, zwykle z **puentą**. Nie musi być komiczna.", "**Tren** — pieśń żałobna (lament) z pochwałą zmarłego. **Treny** (cykl) ≠ jeden tren.", "**Archaizm** — dawny wyraz/forma; w Trenach to język epoki, nie stylizacja.", "**Apostrofa** — bezpośredni zwrot do kogoś/czegoś.", "**Porównanie homeryckie** — rozbudowane porównanie z osobnym obrazem w drugim członie."]}, {"title": "Tren VII vs Tren VIII", "items": ["**VII** — ubrania, posag/wesele vs pogrzeb; zwrot do ubranek; zdrobnienia i czułość.", "**VIII** — **dwa obrazy domu** (radość za życia / cisza po śmierci); klamra pustego domu.", "Nie myl: „dwa obrazy domu” to **VIII**, nie VII."]}, {"title": "Pieśni w zakresie", "items": ["**Pieśń XXV** — do Boga; hymn; wdzięczność za świat.", "**Panna XII** — pochwała wsi; mówi panna; apostrofa do **wsi**."]}, {"title": "Archaizmy (Tren VII)", "table": {"columns": ["Wyraz", "Znaczenie"], "rows": [["ochędóstwo", "stroje, ozdoby, ubiór"], ["letniczek", "lekka letnia sukienka"], ["pisany", "tu: wzorzysty, barwny"], ["uploteczki", "wstążeczki do włosów"], ["płone", "daremne, bezużyteczne"], ["łożnica / łożnice", "łoże / dawna forma odmiany"], ["dziewka", "tu: dziewczynka, córka"], ["mać", "matka"], ["giezłeczko", "cienka koszulka"]]}}]}], "uwagi": "Treny_I–VII, s. 3: opis dwóch obrazów domu wpisany pod Trenem VII dotyczy Trenu VIII. Plik jest w dodatkach. Fragment o ubraniach i wyprawie odnosi się do VII.\n\nTest zbiorczy, pytanie 40 (s. 7 i 14): pytanie o przeszłość i teraźniejszość w VII można poprawnie odnieść do nadziei rodziców i pogrzebu. Nie należy zastępować go analizą dwóch obrazów domu z VIII.\n\nPieśni, s. 9: omówienie mylnie mówi o apostrofie do Boga i wsi. Początkowa apostrofa Panny XII jest zwrotem do wsi; apostrofa do Boga rozpoczyna Pieśń XXV.\n\nPowtórka dla klasy 7, s. 1: odróżniaj tren jako pojedynczy gatunek od Trenów jako cyklu 19 utworów. W tekście są też literówki, np. posąg zamiast posag.\n\nBank odpowiedzi: zawiera kilka zestawów i inną numerację. Porównuj pełną treść pytań; nie przepisuj samych liter do innego testu.\n\nFraszki – zadania z zapisami: s. 1 zawiera odręczne przekreślenia. Ten egzemplarz jest w dodatkach, a czyste ćwiczenia znajdziesz w teście zbiorczym."};</script>
