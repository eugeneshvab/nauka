<script>window.TP_CONTENT={"schemaVersion": 1, "meta": {"id": "hist7-powstanie-listopadowe-demo", "title": "Powstanie listopadowe (1830–1831)", "subtitle": "Królestwo Polskie po kongresie wiedeńskim, noc listopadowa, wojna z Rosją i skutki", "subject": "Historia", "grade": "Klasa 7 SP", "lang": "pl", "explainLangs": ["pl", "en", "ru"], "estimatedMinutes": 75, "sourceNote": "Przykład demonstracyjny przygotowany na podstawie podstawy programowej (klasa 7, dział XX: Ziemie polskie w latach 1815–1848), bez zdjęć podręcznika. Jeśli coś różni się od podręcznika – ważniejszy jest podręcznik i to, co mówił nauczyciel.", "uncertain": []}, "diagnostic": [{"id": "d1", "type": "mc", "tag": "l1", "q": "Kto był królem Królestwa Polskiego utworzonego w 1815 r.?", "options": ["Książę Józef Poniatowski", "Car Rosji", "Król Prus", "Cesarz Austrii"], "answer": 1, "explain": "Królestwo Polskie było połączone z Rosją unią personalną: car Rosji był jednocześnie królem Polski."}, {"id": "d2", "type": "mc", "tag": "l2", "q": "Kiedy wybuchło powstanie listopadowe?", "options": ["3 maja 1791 r.", "29/30 listopada 1830 r.", "22 stycznia 1863 r.", "11 listopada 1918 r."], "answer": 1, "explain": "Noc listopadowa to noc z 29 na 30 listopada 1830 r. (22 stycznia 1863 – to powstanie styczniowe)."}, {"id": "d3", "type": "mc", "tag": "l2", "q": "W jakiej szkole zawiązał się spisek, który rozpoczął powstanie?", "options": ["W Szkole Rycerskiej", "W Szkole Podchorążych Piechoty", "Na Uniwersytecie Jagiellońskim", "W Collegium Nobilium"], "answer": 1, "explain": "Spisek założył w 1828 r. ppor. Piotr Wysocki, instruktor w Szkole Podchorążych Piechoty w Warszawie."}, {"id": "d4", "type": "tf", "tag": "l3", "q": "Oceń zdanie:", "items": [{"s": "Powstanie listopadowe zakończyło się zwycięstwem Polaków.", "a": false}], "explain": "Powstanie upadło – Warszawa skapitulowała we wrześniu 1831 r., a resztki wojska przeszły do Prus w październiku."}, {"id": "d5", "type": "mc", "tag": "l4", "q": "Czym była Wielka Emigracja?", "options": ["Wyjazdem chłopów do Ameryki za pracą", "Wyjazdem ok. 10 tys. Polaków (głównie żołnierzy i polityków) na Zachód po upadku powstania", "Przesiedleniem Polaków na Syberię w XVIII w.", "Ucieczką króla z Warszawy"], "answer": 1, "explain": "Po klęsce powstania ok. 10 tys. osób wyjechało głównie do Francji – to była elita polityczna i kulturalna."}], "lessons": [{"id": "l1", "title": "Królestwo Polskie po kongresie wiedeńskim (1815–1830)", "minutes": 6, "body": ["**Kongres wiedeński (1814–1815)** ustalił nowe granice Europy po wojnach napoleońskich. Z większej części Księstwa Warszawskiego utworzono **Królestwo Polskie** (nazywane też Kongresowym lub Kongresówką).", "Królestwo było połączone z Rosją **unią personalną** – **car Rosji był królem Polski**. Pierwszym królem był car **Aleksander I**, który w 1815 r. nadał Królestwu **konstytucję** – jedną z najbardziej liberalnych w ówczesnej Europie.", "Królestwo miało własny **sejm, rząd, wojsko, sądy, szkolnictwo i walutę**, a językiem urzędowym był **polski**. Władzę w imieniu cara sprawował **namiestnik** (gen. Józef Zajączek), a wojskiem dowodził brat cara – **wielki książę Konstanty**.", "Były też sukcesy: w 1816 r. powstał **Uniwersytet Warszawski**, minister skarbu **Ksawery Drucki-Lubecki** uzdrowił finanse i założył **Bank Polski** (1828), rozwijał się przemysł (np. włókienniczy w okolicach **Łodzi**).", "Jednak władze rosyjskie coraz częściej **łamały konstytucję**: wprowadzono **cenzurę** (1819), zniesiono jawność obrad sejmu (1825), działała tajna policja, a opozycję prześladowano (np. aresztowano **Waleriana Łukasińskiego**, 1822). Legalną opozycję w sejmie tworzyli **kaliszanie** (bracia Niemojowscy)."], "keyPoints": ["1815 – kongres wiedeński tworzy Królestwo Polskie", "Unia personalna: car = król Polski", "Konstytucja 1815 r. – sejm, wojsko, polski język urzędowy", "Łamanie konstytucji: cenzura, tajna policja, prześladowania"], "why": [{"q": "Dlaczego łamanie konstytucji wywoływało tak duży gniew Polaków?", "a": "Bo konstytucja gwarantowała im prawa i autonomię. Kiedy car (który przysięgał jej przestrzegać) ją łamał, Polacy czuli, że tracą resztki samodzielności – rosło przekonanie, że trzeba walczyć."}], "tldr": {"pl": "Po 1815 r. powstało Królestwo Polskie z carem jako królem i liberalną konstytucją, ale Rosja coraz częściej ją łamała.", "en": "After the Congress of Vienna (1815) the Kingdom of Poland was created. The Russian tsar was also King of Poland. It had a liberal constitution, its own parliament (sejm) and army, but Russia increasingly broke the constitution (censorship, secret police, persecution).", "ru": "После Венского конгресса (1815) было создано Царство Польское. Российский царь был одновременно королём Польши. У Царства была либеральная конституция, свой сейм и армия, но Россия всё чаще нарушала конституцию (цензура, тайная полиция, преследования)."}}, {"id": "l2", "title": "Spisek podchorążych i noc listopadowa", "minutes": 6, "body": ["W 1825 r. carem (i królem Polski) został **Mikołaj I** – zwolennik twardych rządów. W 1829 r. koronował się w Warszawie na króla Polski.", "W 1828 r. ppor. **Piotr Wysocki** założył tajne **sprzysiężenie w Szkole Podchorążych Piechoty** w Warszawie. Spiskowcy chcieli bronić konstytucji i odzyskać niepodległość.", "Bezpośrednie przyczyny wybuchu (1830): **rewolucja lipcowa we Francji** i **rewolucja w Belgii**. Car planował użyć **wojska polskiego do tłumienia rewolucji** na Zachodzie. Do tego władze wpadły na trop spisku – groziły aresztowania.", "**W nocy z 29 na 30 listopada 1830 r.** spiskowcy zaatakowali **Belweder** – siedzibę wielkiego księcia Konstantego (Konstanty zdołał uciec) – i zdobyli **Arsenał**, skąd broń trafiła do mieszkańców Warszawy. Wielu polskich generałów odmówiło przyłączenia się, kilku zginęło.", "Na czele powstania stanął **dyktator gen. Józef Chłopicki** (od grudnia 1830 r.). Nie wierzył w zwycięstwo i próbował **porozumieć się z carem**, ale Mikołaj I żądał bezwarunkowej kapitulacji. Chłopicki ustąpił w styczniu 1831 r.", "**25 stycznia 1831 r.** sejm ogłosił **detronizację Mikołaja I** („Nie ma Mikołaja!”). To oznaczało wojnę z Rosją. Powstał **Rząd Narodowy** z księciem **Adamem Jerzym Czartoryskim** na czele. W tym czasie w Warszawie użyto hasła **„Za naszą i waszą wolność”**."], "keyPoints": ["1828 – spisek Piotra Wysockiego w Szkole Podchorążych", "29/30 XI 1830 – atak na Belweder i zdobycie Arsenału", "Dyktator Chłopicki chciał ugody z carem", "25 I 1831 – detronizacja Mikołaja I → wojna"], "why": [{"q": "Dlaczego detronizacja Mikołaja I była punktem bez odwrotu?", "a": "Sejm odebrał carowi tron polski, czyli zerwał unię z Rosją. Po czymś takim car nie mógł już zgodzić się na rozmowy – zostawała tylko wojna."}], "tldr": {"pl": "Spisek Wysockiego wybuchł 29/30 XI 1830 r. (Belweder, Arsenał). Chłopicki chciał ugody, ale 25 I 1831 r. sejm zdetronizował cara – zaczęła się wojna.", "en": "Cadet officer Piotr Wysocki's conspiracy started the uprising on the night of 29/30 November 1830 (attack on the Belweder palace, capture of the Arsenal). Dictator Chłopicki wanted a deal with the tsar, but on 25 January 1831 the sejm dethroned Nicholas I – war with Russia began.", "ru": "Заговор подпоручика Петра Высоцкого начал восстание в ночь с 29 на 30 ноября 1830 г. (нападение на Бельведер, захват Арсенала). Диктатор Хлопицкий хотел договориться с царём, но 25 января 1831 г. сейм низложил Николая I – началась война с Россией."}}, {"id": "l3", "title": "Wojna polsko-rosyjska 1831 i upadek powstania", "minutes": 7, "body": ["W lutym 1831 r. do Królestwa wkroczyła armia rosyjska dowodzona przez feldmarszałka **Iwana Dybicza** – ponad dwa razy liczniejsza od polskiej.", "Najważniejsze bitwy: **Stoczek** (14 II 1831, gen. **Józef Dwernicki** – pierwsze zwycięstwo), **Olszynka Grochowska** (25 II 1831 – krwawa bitwa nierozstrzygnięta, ale Rosjanie nie zdobyli Warszawy), **Wawer i Dębe Wielkie** (31 III 1831) oraz **Iganie** (10 IV 1831) – polskie zwycięstwa.", "Naczelny wódz gen. **Jan Skrzynecki** nie wykorzystał tych zwycięstw. **26 maja 1831 r.** Polacy przegrali bitwę pod **Ostrołęką**. Walki toczyły się też na Litwie – walczyła tam m.in. **Emilia Plater**.", "Dybicz zmarł na cholerę, a dowództwo objął **Iwan Paskiewicz**. **6–7 września 1831 r.** Rosjanie szturmowali Warszawę: na **Woli** zginął gen. **Józef Sowiński**, wysadzono **redutę Ordona** (opisał ją Adam Mickiewicz). Warszawa **skapitulowała 7/8 września**.", "W październiku 1831 r. resztki wojska przeszły do Prus, a **Zamość** skapitulował jako ostatni (21 X 1831).", "**Przyczyny klęski:** przewaga liczebna Rosji, **niezdecydowanie i brak wiary w zwycięstwo dowódców** (Chłopicki, Skrzynecki), **brak pomocy z zagranicy**, spory polityczne oraz **brak reform dla chłopów** – większość chłopów nie poparła powstania."], "keyPoints": ["Stoczek 14 II – pierwsze zwycięstwo (Dwernicki)", "Olszynka Grochowska 25 II – nierozstrzygnięta", "Ostrołęka 26 V – klęska", "Szturm Warszawy 6–7 IX: Wola (Sowiński), reduta Ordona", "Przyczyny klęski: przewaga Rosji, słabi dowódcy, brak pomocy, chłopi bez reform"], "why": [{"q": "Dlaczego brak reform chłopskich osłabił powstanie?", "a": "Chłopi stanowili większość ludności. Gdyby dostali ziemię na własność (uwłaszczenie), mogliby masowo walczyć. Bez tego nie mieli powodu ryzykować życia, więc powstańcy nie mieli rezerw ludzi."}], "tldr": {"pl": "Mimo zwycięstw (Stoczek, Wawer, Dębe Wielkie, Iganie) Polacy przegrali pod Ostrołęką, a we wrześniu 1831 r. upadła Warszawa.", "en": "Despite victories (Stoczek, Wawer, Dębe Wielkie, Iganie) the Poles lost at Ostrołęka (May 1831), and Warsaw fell in September 1831. Reasons: Russia's numbers, indecisive commanders, no foreign help, no reforms for peasants.", "ru": "Несмотря на победы (Сточек, Вавер, Дембе-Вельке, Игане), поляки проиграли под Остроленкой (май 1831), а в сентябре 1831 г. пала Варшава. Причины: численный перевес России, нерешительные командиры, отсутствие помощи извне, нет реформ для крестьян."}}, {"id": "l4", "title": "Skutki powstania i Wielka Emigracja", "minutes": 6, "body": ["Car ukarał Królestwo: w 1832 r. konstytucję zastąpił **Statut Organiczny**, **zlikwidowano sejm i wojsko polskie**. Namiestnikiem został **Iwan Paskiewicz** – jego surowe rządy nazwano **„nocą paskiewiczowską”**.", "W Warszawie zbudowano **Cytadelę** – twierdzę, która miała pilnować miasta. Zamknięto **Uniwersytet Warszawski i Wileński**. Uczestnikom powstania **konfiskowano majątki**, wielu zesłano na **Syberię** lub wcielono do armii rosyjskiej.", "Po klęsce około **10 tysięcy** Polaków – żołnierzy, polityków, artystów – wyjechało na Zachód, głównie do **Francji**. Nazywamy to **Wielką Emigracją**.", "Emigranci podzielili się: **konserwatyści** skupieni wokół księcia **Adama Jerzego Czartoryskiego** (**Hotel Lambert**) liczyli na pomoc dyplomatyczną państw Zachodu; **demokraci** z **Towarzystwa Demokratycznego Polskiego** (1832) chcieli nowego powstania z udziałem chłopów i ich uwłaszczenia.", "Na emigracji tworzyli wielcy artyści: **Adam Mickiewicz** („Pan Tadeusz”), **Juliusz Słowacki**, kompozytor **Fryderyk Chopin**. Ich dzieła podtrzymywały ducha narodowego Polaków."], "keyPoints": ["1832 – Statut Organiczny zamiast konstytucji", "Likwidacja sejmu i wojska, Cytadela, zamknięte uniwersytety", "Konfiskaty, zsyłki na Syberię", "Wielka Emigracja (ok. 10 tys., głównie Francja): Hotel Lambert vs TDP"], "why": [{"q": "Dlaczego Wielka Emigracja była ważna, skoro emigranci żyli poza Polską?", "a": "Wyjechała elita – politycy i artyści. Mogli swobodnie pisać i działać (bez cenzury), przypominali Europie o sprawie polskiej i przygotowywali kolejne powstania."}], "tldr": {"pl": "Po powstaniu: Statut Organiczny, koniec sejmu i armii, Cytadela, represje. Ok. 10 tys. osób wyjechało – Wielka Emigracja.", "en": "After the uprising: the constitution was replaced by the Organic Statute (1832), the sejm and Polish army were abolished, the Warsaw Citadel was built, universities closed, property confiscated, people exiled to Siberia. About 10,000 Poles emigrated, mostly to France – the Great Emigration (Mickiewicz, Chopin).", "ru": "После восстания: конституцию заменил Органический статут (1832), упразднены сейм и польская армия, построена Варшавская цитадель, закрыты университеты, конфискации, ссылки в Сибирь. Около 10 тыс. поляков эмигрировали, в основном во Францию – Великая эмиграция (Мицкевич, Шопен)."}}], "timeline": [{"date": "1815", "label": "Kongres wiedeński – powstaje Królestwo Polskie, konstytucja", "tag": "l1"}, {"date": "1819", "label": "Wprowadzenie cenzury", "tag": "l1"}, {"date": "1825", "label": "Mikołaj I carem i królem Polski", "tag": "l2"}, {"date": "1828", "label": "Spisek Piotra Wysockiego w Szkole Podchorążych", "tag": "l2"}, {"date": "29/30 XI 1830", "label": "Noc listopadowa – Belweder i Arsenał", "tag": "l2", "key": true}, {"date": "25 I 1831", "label": "Detronizacja Mikołaja I", "tag": "l2", "key": true}, {"date": "14 II 1831", "label": "Bitwa pod Stoczkiem – zwycięstwo", "tag": "l3"}, {"date": "25 II 1831", "label": "Bitwa o Olszynkę Grochowską", "tag": "l3"}, {"date": "26 V 1831", "label": "Klęska pod Ostrołęką", "tag": "l3"}, {"date": "6–8 IX 1831", "label": "Szturm i kapitulacja Warszawy", "tag": "l3", "key": true}, {"date": "1832", "label": "Statut Organiczny; Wielka Emigracja", "tag": "l4", "key": true}], "map": {"title": "Bitwy powstania listopadowego (schemat)", "caption": "Schemat – położenie przybliżone. Zielone = zwycięstwo Polaków, szare = nierozstrzygnięta, czerwone = porażka.", "points": [{"name": "Warszawa", "lat": 52.23, "lon": 21.01, "kind": "city", "note": "Kapitulacja 7/8 IX 1831"}, {"name": "Olszynka Grochowska", "lat": 52.245, "lon": 21.11, "kind": "draw", "note": "25 II 1831"}, {"name": "Wawer", "lat": 52.19, "lon": 21.18, "kind": "win", "note": "31 III 1831"}, {"name": "Dębe Wielkie", "lat": 52.2, "lon": 21.44, "kind": "win", "note": "31 III 1831"}, {"name": "Stoczek", "lat": 51.96, "lon": 21.97, "kind": "win", "note": "14 II 1831"}, {"name": "Iganie", "lat": 52.15, "lon": 22.2, "kind": "win", "note": "10 IV 1831"}, {"name": "Ostrołęka", "lat": 53.08, "lon": 21.57, "kind": "loss", "note": "26 V 1831"}]}, "people": [{"name": "Piotr Wysocki", "role": "założyciel spisku w Szkole Podchorążych (1828)"}, {"name": "wielki książę Konstanty", "role": "brat cara, wódz armii Królestwa; uciekł z Belwederu"}, {"name": "Mikołaj I", "role": "car Rosji i król Polski, zdetronizowany 25 I 1831"}, {"name": "Józef Chłopicki", "role": "pierwszy dyktator powstania, chciał ugody"}, {"name": "Adam Jerzy Czartoryski", "role": "prezes Rządu Narodowego, potem Hotel Lambert"}, {"name": "Józef Dwernicki", "role": "zwycięzca spod Stoczka"}, {"name": "Jan Skrzynecki", "role": "naczelny wódz, nie wykorzystał zwycięstw"}, {"name": "Emilia Plater", "role": "walczyła w powstaniu na Litwie"}, {"name": "Józef Sowiński", "role": "generał, zginął w obronie Woli"}, {"name": "Iwan Paskiewicz", "role": "zdobył Warszawę, potem namiestnik"}], "flashcards": [{"front": "Unia personalna (Królestwo Polskie – Rosja)", "back": "Wspólny władca: car Rosji był jednocześnie królem Polski.", "tag": "l1"}, {"front": "Kongres wiedeński", "back": "1814–1815; ustalił granice Europy po Napoleonie, utworzył Królestwo Polskie.", "tag": "l1"}, {"front": "Cenzura", "back": "Kontrola publikacji przed wydaniem przez władze (w Królestwie od 1819 r.).", "tag": "l1"}, {"front": "Kaliszanie", "back": "Legalna opozycja w sejmie Królestwa (bracia Niemojowscy), broniła konstytucji.", "tag": "l1"}, {"front": "Ksawery Drucki-Lubecki", "back": "Minister skarbu; uzdrowił finanse, założył Bank Polski (1828).", "tag": "l1"}, {"front": "Piotr Wysocki", "back": "Ppor., w 1828 r. założył spisek w Szkole Podchorążych Piechoty.", "tag": "l2"}, {"front": "Noc listopadowa – data i cele ataku", "back": "29/30 XI 1830: Belweder (siedziba Konstantego) i Arsenał (broń).", "tag": "l2"}, {"front": "Dyktator", "back": "Osoba z pełnią władzy na czas zagrożenia; pierwszy w powstaniu – gen. Józef Chłopicki.", "tag": "l2"}, {"front": "Detronizacja Mikołaja I", "back": "25 I 1831 sejm odebrał carowi tron polski → wojna z Rosją.", "tag": "l2"}, {"front": "„Za naszą i waszą wolność”", "back": "Hasło z czasów powstania listopadowego (1831) – walka o wolność Polaków i innych narodów.", "tag": "l2"}, {"front": "Bitwa pod Stoczkiem", "back": "14 II 1831, gen. Dwernicki – pierwsze zwycięstwo powstańców.", "tag": "l3"}, {"front": "Olszynka Grochowska", "back": "25 II 1831 – krwawa bitwa nierozstrzygnięta; Rosjanie nie zdobyli Warszawy.", "tag": "l3"}, {"front": "Ostrołęka", "back": "26 V 1831 – klęska wojsk polskich.", "tag": "l3"}, {"front": "Reduta Ordona", "back": "Umocnienie na Woli wysadzone podczas szturmu Warszawy (6 IX 1831); wiersz Mickiewicza.", "tag": "l3"}, {"front": "Statut Organiczny", "back": "1832 – zastąpił konstytucję; Królestwo straciło sejm i wojsko.", "tag": "l4"}, {"front": "Cytadela Warszawska", "back": "Twierdza zbudowana po powstaniu, by kontrolować Warszawę (i więzienie).", "tag": "l4"}, {"front": "Wielka Emigracja", "back": "Wyjazd ok. 10 tys. Polaków (głównie do Francji) po upadku powstania.", "tag": "l4"}, {"front": "Hotel Lambert vs TDP", "back": "Hotel Lambert – konserwatyści, ks. Czartoryski, dyplomacja. TDP – demokraci, nowe powstanie i uwłaszczenie chłopów.", "tag": "l4"}], "quiz": [{"id": "q1", "type": "mc", "tag": "l1", "q": "Która instytucja NIE istniała w Królestwie Polskim w latach 1815–1830?", "options": ["Sejm", "Wojsko polskie", "Własny, niezależny od Rosji król", "Uniwersytet Warszawski"], "answer": 2, "explain": "Królem był car Rosji (unia personalna) – nie było osobnego, niezależnego władcy."}, {"id": "q2", "type": "multi", "tag": "l1", "q": "Zaznacz DWA przykłady łamania konstytucji w Królestwie Polskim.", "options": ["Wprowadzenie cenzury", "Założenie Banku Polskiego", "Prześladowanie opozycji i tajnej organizacji Łukasińskiego", "Utworzenie Un rano konfiskatami i zsyłkami na Syberię, zbudowano Cytadelę, zamknięto uniwersytety. Ok. 10 tys. ludzi wyjechało głównie do Francji – to Wielka Emigracja, m.in. Mickiewicz i Chopin."}], "mockTest": {"title": "Sprawdzian: Powstanie listopadowe – grupa A", "minutes": 30, "intro": "Pracuj jak na prawdziwym sprawdzianie: bez podręcznika i bez podpowiedzi. Wyniki zobaczysz na końcu.", "gradeScale": [[0, "niedostateczny"], [30, "dopuszczający"], [50, "dostateczny"], [70, "dobry"], [90, "bardzo dobry"], [98, "celujący"]], "tasks": [{"id": "m1", "type": "order", "tag": "l3", "points": 2, "q": "Zadanie 1. Uporządkuj wydarzenia chronologicznie.", "items": ["Bitwa pod Stoczkiem", "Bitwa pod Ostrołęką", "Szturm Warszawy", "Statut Organiczny"], "explain": "14 II 1831 → 26 V 1831 → 6–7 IX 1831 → 1832."}, {"id": "m2", "type": "tf", "tag": "l1", "q": "Zadanie 2. Oceń prawdziwość zdań (P/F).", "items": [{"s": "Królestwo Polskie powstało na mocy decyzji kongresu wiedeńskiego.", "a": true}, {"s": "W Królestwie Polskim językiem urzędowym był rosyjski.", "a": false}, {"s": "Pierwszym dyktatorem powstania był Józef Chłopicki.", "a": true}, {"s": "Powstanie listopadowe zakończyło się w 1832 r. bitwą pod Grunwaldem.", "a": false}], "explain": "Językiem urzędowym był polski. Powstanie upadło jesienią 1831 r."}, {"id": "m3", "type": "match", "tag": "l2", "q": "Zadanie 3. Przyporządkuj postaciom ich rolę.", "pairs": [["Mikołaj I", "car, zdetronizowany przez sejm"], ["Adam Jerzy Czartoryski", "prezes Rządu Narodowego"], ["Iwan Paskiewicz", "zdobył Warszawę"], ["wielki książę Konstanty", "uciekł z Belwederu"]], "explain": ""}, {"id": "m4", "type": "cat", "tag": "l4", "q": "Zadanie 4. Określ, czy to przyczyna (P), czy skutek (S) powstania.", "categories": ["Przyczyna", "Skutek"], "items": [{"t": "Wprowadzenie cenzury", "c": 0}, {"t": "Likwidacja sejmu i wojska Królestwa", "c": 1}, {"t": "Zamknięcie Uniwersytetu Warszawskiego", "c": 1}, {"t": "Rewolucja lipcowa we Francji", "c": 0}], "explain": " <template id="tutor-tpl"><elevenlabs-convai agent-id="agent_3101m4193bfqeyy99nqzjkg5mtfh" variant="expanded" action-text="Porozmawiaj z tutorem" start-call-text="Zacznij rozmowę" end-call-text="Zakończ" dynamic-variables="{&quot;subject&quot;: &quot;Historia&quot;, &quot;topic&quot;: &quot;Powstanie listopadowe (1830–1831)&quot;, &quot;material&quot;: &quot;## Królestwo Polskie po kongresie wiedeńskim (1815–1830)\nNajważniejsze: 1815 – kongres wiedeński tworzy Królestwo Polskie; Unia personalna: car = król Polski; Konstytucja 1815 r. – sejm, wojsko, polski język urzędowy; Łamanie konstytucji: cenzura, tajna policja, prześladowania\nKongres wiedeński (1814–1815) ustalił nowe granice Europy po wojnach napoleońskich. Z większej części Księstwa Warszawskiego utworzono Królestwo Polskie (nazywane też Kongresowym lub Kongresówką).\nKrólestwo było połączone z Rosją unią personalną – car Rosji był królem Polski. Pierwszym królem był car Aleksander I, który w 1815 r. nadał Królestwu konstytucję – jedną z najbardziej liberalnych w ówczesnej Europie.\nKrólestwo miało własny sejm, rząd, wojsko, sądy, szkolnictwo i walutę, a językiem urzędowym był polski. Władzę w imieniu cara sprawował namiestnik (gen. Józef Zajączek), a wojskiem dowodził brat cara – wielki książę Konstanty.\nByły też sukcesy: w 1816 r. powstał Uniwersytet Warszawski, minister skarbu Ksawery Drucki-Lubecki uzdrowił finanse i założył Bank Polski (1828), rozwijał się przemysł (np. włókienniczy w okolicach Łodzi).\nJednak władze rosyjskie coraz częściej łamały konstytucję: wprowadzono cenzurę (1819), zniesiono jawność obrad sejmu (1825), działała tajna policja, a opozycję prześladowano (np. aresztowano Waleriana Łukasińskiego, 1822). Legalną opozycję w sejmie tworzyli kaliszanie (bracia Niemojowscy).\nDlaczego? Dlaczego łamanie konstytucji wywoływało tak duży gniew Polaków? – Bo konstytucja gwarantowała im prawa i autonomię. Kiedy car (który przysięgał jej przestrzegać) ją łamał, Polacy czuli, że tracą resztki samodzielności – rosło przekonanie, że trzeba walczyć.\n\n## Spisek podchorążych i noc listopadowa\nNajważniejsze: 1828 – spisek Piotra Wysockiego w Szkole Podchorążych; 29/30 XI 1830 – atak na Belweder i zdobycie Arsenału; Dyktator Chłopicki chciał ugody z carem; 25 I 1831 – detronizacja Mikołaja I → wojna\nW 1825 r. carem (i królem Polski) został Mikołaj I – zwolennik twardych rządów. W 1829 r. koronował się w Warszawie na króla Polski.\nW 1828 r. ppor. Piotr Wysocki założył tajne sprzysiężenie w Szkole Podchorążych Piechoty w Warszawie. Spiskowcy chcieli bronić konstytucji i odzyskać niepodległość.\nBezpośrednie przyczyny wybuchu (1830): rewolucja lipcowa we Francji i rewolucja w Belgii. Car planował użyć wojska polskiego do tłumienia rewolucji na Zachodzie. Do tego władze wpadły na trop spisku – groziły aresztowania.\nW nocy z 29 na 30 listopada 1830 r. spiskowcy zaatakowali Belweder – siedzibę wielkiego księcia Konstantego (Konstanty zdołał uciec) – i zdobyli Arsenał, skąd broń trafiła do mieszkańców Warszawy. Wielu polskich generałów odmówiło przyłączenia się, kilku zginęło.\nNa czele powstania stanął dyktator gen. Józef Chłopicki (od grudnia 1830 r.). Nie wierzył w zwycięstwo i próbował porozumieć się z carem, ale Mikołaj I żądał bezwarunkowej kapitulacji. Chłopicki ustąpił w styczniu 1831 r.\n25 stycznia 1831 r. sejm ogłosił detronizację Mikołaja I („Nie ma Mikołaja!”). To oznaczało wojnę z Rosją. Powstał Rząd Narodowy z księciem Adamem Jerzym Czartoryskim na czele. W tym czasie w Warszawie użyto hasła „Za naszą i waszą wolność”.\nDlaczego? Dlaczego detronizacja Mikołaja I była punktem bez odwrotu? – Sejm odebrał carowi tron polski, czyli zerwał unię z Rosją. Po czymś takim car nie mógł już zgodzić się na rozmowy – zostawała tylko wojna.\n\n## Wojna polsko-rosyjska 1831 i upadek powstania\nNajważniejsze: Stoczek 14 II – pierwsze zwycięstwo (Dwernicki); Olszynka Grochowska 25 II – nierozstrzygnięta; Ostrołęka 26 V – klęska; Szturm Warszawy 6–7 IX: Wola (Sowiński), reduta Ordona; Przyczyny klęski: przewaga Rosji, słabi dowódcy, brak pomocy, chłopi bez reform\nW lutym 1831 r. do Królestwa wkroczyła armia rosyjska dowodzona przez feldmarszałka Iwana Dybicza – ponad dwa razy liczniejsza od polskiej.\nNajważniejsze bitwy: Stoczek (14 II 1831, gen. Józef Dwernicki – pierwsze zwycięstwo), Olszynka Grochowska (25 II 1831 – krwawa bitwa nierozstrzygnięta, ale Rosjanie nie zdobyli Warszawy), Wawer i Dębe Wielkie (31 III 1831) oraz Iganie (10 IV 1831) – polskie zwycięstwa.\nNaczelny wódz gen. Jan Skrzynecki nie wykorzystał tych zwycięstw. 26 maja 1831 r. Polacy przegrali bitwę pod Ostrołęką. Walki toczyły się też na Litwie – walczyła tam m.in. Emilia Plater.\nDybicz zmarł na cholerę, a dowództwo objął Iwan Paskiewicz. 6–7 września 1831 r. Rosjanie szturmowali Warszawę: na Woli zginął gen. Józef Sowiński, wysadzono redutę Ordona (opisał ją Adam Mickiewicz). Warszawa skapitulowała 7/8 września.\nW październiku 1831 r. resztki wojska przeszły do Prus, a Zamość skapitulował jako ostatni (21 X 1831).\nPrzyczyny klęski: przewaga liczebna Rosji, niezdecydowanie i brak wiary w zwycięstwo dowódców (Chłopicki, Skrzynecki), brak pomocy z zagranicy, spory polityczne oraz brak reform dla chłopów – większość chłopów nie poparła powstania.\nDlaczego? Dlaczego brak reform chłopskich osłabił powstanie? – Chłopi stanowili większość ludności. Gdyby dostali ziemię na własność (uwłaszczenie), mogliby masowo walczyć. Bez tego nie mieli powodu ryzykować życia, więc powstańcy nie mieli rezerw ludzi.\n\n## Skutki powstania i Wielka Emigracja\nNajważniejsze: 1832 – Statut Organiczny zamiast konstytucji; Likwidacja sejmu i wojska, Cytadela, zamknięte uniwersytety; Konfiskaty, zsyłki na Syberię; Wielka Emigracja (ok. 10 tys., głównie Francja): Hotel Lambert vs TDP\nCar ukarał Królestwo: w 1832 r. konstytucję zastąpił Statut Organiczny, zlikwidowano sejm i wojsko polskie. Namiestnikiem został Iwan Paskiewicz – jego surowe rządy nazwano „nocą paskiewiczowską”.\nW Warszawie zbudowano Cytadelę – twierdzę, która miała pilnować miasta. Zamknięto Uniwersytet Warszawski i Wileński. Uczestnikom powstania konfiskowano majątki, wielu zesłano na Syberię lub wcielono do armii rosyjskiej.\nPo klęsce około 10 tysięcy Polaków – żołnierzy, polityków, artystów – wyjechało na Zachód, głównie do Francji. Nazywamy to Wielką Emigracją.\nEmigranci podzielili się: konserwatyści skupieni wokół księcia Adama Jerzego Czartoryskiego (Hotel Lambert) liczyli na pomoc dyplomatyczną państw Zachodu; demokraci z Towarzystwa Demokratycznego Polskiego (1832) chcieli nowego powstania z udziałem chłopów i ich uwłaszczenia.\nNa emigracji tworzyli wielcy artyści: Adam Mickiewicz („Pan Tadeusz”), Juliusz Słowacki, kompozytor Fryderyk Chopin. Ich dzieła podtrzymywały ducha narodowego Polaków.\nDlaczego? Dlaczego Wielka Emigracja była ważna, skoro emigranci żyli poza Polską? – Wyjechała elita – politycy i artyści. Mogli swobodnie pisać i działać (bez cenzury), przypominali Europie o sprawie polskiej i przygotowywali kolejne powstania.\n\n## Fiszki\n- Unia personalna (Królestwo Polskie – Rosja) → Wspólny władca: car Rosji był jednocześnie królem Polski.\n- Kongres wiedeński → 1814–1815; ustalił granice Europy po Napoleonie, utworzył Królestwo Polskie.\n- Cenzura → Kontrola publikacji przed wydaniem przez władze (w Królestwie od 1819 r.).\n- Kaliszanie → Legalna opozycja w sejmie Królestwa (bracia Niemojowscy), broniła konstytucji.\n- Ksawery Drucki-Lubecki → Minister skarbu; uzdrowił finanse, założył Bank Polski (1828).\n- Piotr Wysocki → Ppor., w 1828 r. założył spisek w Szkole Podchorążych Piechoty.\n- Noc listopadowa – data i cele ataku → 29/30 XI 1830: Belweder (siedziba Konstantego) i Arsenał (broń).\n- Dyktator → Osoba z pełnią władzy na czas zagrożenia; pierwszy w powstaniu – gen. Józef Chłopicki.\n- Detronizacja Mikołaja I → 25 I 1831 sejm odebrał carowi tron polski → wojna z Rosją.\n- „Za naszą i waszą wolność” → Hasło z czasów powstania listopadowego (1831) – walka o wolność Polaków i innych narodów.\n- Bitwa pod Stoczkiem → 14 II 1831, gen. Dwernicki – pierwsze zwycięstwo powstańców.\n- Olszynka Grochowska → 25 II 1831 – krwawa bitwa nierozstrzygnięta; Rosjanie nie zdobyli Warszawy.\n- Ostrołęka → 26 V 1831 – klęska wojsk polskich.\n- Reduta Ordona → Umocnienie na Woli wysadzone podczas szturmu Warszawy (6 IX 1831); wiersz Mickiewicza.\n- Statut Organiczny → 1832 – zastąpił konstytucję; Królestwo straciło sejm i wojsko.\n- Cytadela Warszawska → Twierdza zbudowana po powstaniu, by kontrolować Warszawę (i więzienie).\n- Wielka Emigracja → Wyjazd ok. 10 tys. Polaków (głównie do Francji) po upadku powstania.\n- Hotel Lambert vs TDP → Hotel Lambert – konserwatyści, ks. Czartoryski, dyplomacja. TDP – demokraci, nowe powstanie i uwłaszczenie chłopów.\n\n## Ściąga\nDaty: 1815 – kongres wiedeński, Królestwo Polskie, konstytucja; 1828 – spisek Wysockiego; 29/30 XI 1830 – noc listopadowa; 25 I 1831 – detronizacja Mikołaja I; 14 II – Stoczek; 25 II – Olszynka Grochowska; 26 V 1831 – Ostrołęka (klęska); 6–8 IX 1831 – szturm i kapitulacja Warszawy; 1832 – Statut Organiczny\nPostacie: Wysocki – spisek; Konstanty – uciekł z Belwederu; Chłopicki – dyktator; Czartoryski – Rząd Narodowy, Hotel Lambert; Dwernicki – Stoczek; Skrzynecki – wódz naczelny; Plater – Litwa; Sowiński – Wola; Paskiewicz – namiestnik\nPrzyczyny: łamanie konstytucji (cenzura, tajna policja); twarde rządy Mikołaja I; rewolucje we Francji i Belgii; groźba wykrycia spisku\nPrzyczyny klęski: przewaga Rosji; niezdecydowani dowódcy; brak pomocy z zagranicy; brak reform chłopskich\nSkutki: Statut Organiczny – koniec sejmu i wojska; Cytadela, zamknięte uniwersytety; konfiskaty, Syberia; Wielka Emigracja (ok. 10 tys., Francja); Hotel Lambert vs TDP&quot;}"></elevenlabs-convai></template>

 case 'mc':return q.options[q.answer];case 'multi':return q.answer.map(function(i){return q.options[i];}).join('; ');
 case 'tf':return q.items.map(function(it){return cut(it.s,40)+' – '+(it.a?'P':'F');}).join('; ');
 case 'order':return q.items.join(' → ');case 'match':return q.pairs.map(function(p){return p[0]+' → '+p[1];}).join('; ');
 case 'cat':return q.items.map(function(it){return it.t+' → '+q.categories[it.c];}).join('; ');
 case 'short':return q.dm?(q.accept&&q.accept[0])||'':(typeof q.num==='number'?String(q.num)+(q.unit?' '+q.unit:''):(q.accept||[])[0]);
 case 'open':return q.model;
 case 'table':return q.rows.map(function(r){return r.head+': '+r.cells.map(function(c){return /^\s*[xX\-–—]\s*$/.test(c)?'X':String(c).split('|')[0];}).join(' | ');}).join('; ');}}catch(e){}return '';}
function boxFor(id){var bs=document.querySelectorAll('#main section.on .qbox[data-qid]');var b=null;for(var i=0;i<bs.length;i++)if(bs[i].dataset.qid===id)b=bs[i];return b;}
function answerText(q,b){if(!b)return '';try{var t=q.type,o;
 if(t==='mc'||t==='multi'){o=[].map.call(b.querySelectorAll('.opt.sel'),function(x){return strip(x.textContent).replace(/^☐\s*/,'');});return o.join('; ')||'(brak)';}
 if(t==='tf'){return [].map.call(b.querySelectorAll('.row'),function(r){var bt=r.querySelectorAll('button'),v='?';for(var i=0;i<bt.length;i++)if(bt[i].style.background)v=i===0?'P':'F';return v;}).join(', ');}
 if(t==='order')return [].map.call(b.querySelectorAll('.ordi span'),function(x){return strip(x.textContent);}).join(' → ');
 if(t==='match'||t==='cat')return [].map.call(b.querySelectorAll('select'),function(s){var lb=s.parentNode.querySelector('.lbl');return cut(lb?lb.textContent:'',30)+' → '+(s.value===''?'(brak)':strip(s.options[s.selectedIndex].text));}).join('; ');
 if(t==='short'){o=b.querySelector('input[type=text]');return o?o.value:'';}
 if(t==='open'){o=b.querySelector('textarea');return o?o.value:'';}
 if(t==='table'){return b.tableAnswers?b.tableAnswers():'';}}catch(e){}return '';}
function wrongItem(id,pts,max){var q=qById(id);if(!q)return null;return {id:String(id).slice(0,60),q:cut(q.q,160),a:cut(answerText(q,boxFor(id)),160),c:cut(correctText(q),160),pts:pts,max:max};}
function uid(){return (now().toString(36)+Math.random().toString(36).slice(2,10));}
function base(mode){return {k:CFG.siteKey,v:1,id:uid(),ts:new Date().toISOString(),slug:slug(),pageId:M.id||'',subject:M.subject||'',topic:M.title||'',mode:mode};}
/* queue */
function lq(){try{return JSON.parse(localStorage.getItem(QK))||[];}catch(e){return [];}}
function sq(a){try{localStorage.setItem(QK,JSON.stringify(a.slice(-MAXQ)));}catch(e){}}
var busy=false;
function flush(){if(busy||!CFG.endpoint||!navigator.onLine&&navigator.onLine!==undefined)return;var a=lq();if(!a.length)return;busy=true;var item=a[0];
 fetch(CFG.endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(item),keepalive:true})
 .then(function(){var b=lq().filter(function(x){return x.id!==item.id;});sq(b);busy=false;if(b.length)setTimeout(flush,400);})
 .catch(function(){busy=false;setTimeout(flush,60000);});}
function send(rec){if(M.child){rec.extra=rec.extra||{};if(!rec.extra.child)rec.extra.child=String(M.child).slice(0,40);}var a=lq();a.push(rec);sq(a);flush();}
window.addEventListener('online',flush);document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')flush();});
setTimeout(flush,1500);
/* quiz runs */
var qz=null;
addEventListener('tp:quiz-start',function(e){qz={t0:now(),ans:{}};});
addEventListener('tp:answer',function(e){var d=e.detail||{};if(qz&&(C.quiz||[]).some(function(q){return q.id===d.id;})&&!qz.ans[d.id])qz.ans[d.id]={pts:d.pts,max:d.max,w:d.pts<d.max?wrongItem(d.id,d.pts,d.max):null};});
addEventListener('tp:quiz-done',function(e){var d=e.detail||{};if(!qz)qz={t0:now(),ans:{}};var pct=d.max?Math.round(100*d.pts/d.max):0,sc=firstScale(),g=gradeFor(pct,sc),v=verdict(pct,g,sc);
 var wr=Object.keys(qz.ans).map(function(k){return qz.ans[k].w;}).filter(Boolean);
 var r=base('quiz');r.variant='Quiz mieszany';r.score=d.pts;r.max=d.max;r.percent=pct;r.grade=g;r.gradeNum=v.gradeNum;r.pass=v.pass;r.durationSec=Math.round((now()-qz.t0)/1000);r.wrongCount=wr.length;r.wrong=wr.slice(0,40);r.extra={questions:d.n};send(r);qz=null;});
/* mock tests */
var mk={};
addEventListener('tp:mock-start',function(e){mk[(e.detail||{}).id]=now();});
addEventListener('tp:mock-done',function(e){var d=e.detail||{},T=mocks()[d.idx]||{},t0=mk[d.id];var v=verdict(d.pct,d.grade,T.gradeScale);
 var wr=(d.tasks||[]).filter(function(t){return t.pts<t.max;}).map(function(t){return wrongItem(t.id,t.pts,t.max);}).filter(Boolean);
 var r=base('mock');r.variant=cut(d.title||d.id,80);r.score=d.pts;r.max=d.max;r.percent=d.pct;r.grade=d.grade||'';r.gradeNum=v.gradeNum;r.pass=v.pass;r.durationSec=t0?Math.round((now()-t0)/1000):null;r.wrongCount=wr.length;r.wrong=wr.slice(0,40);r.extra={mockId:d.id,minutesLimit:d.minutes,tasks:(d.tasks||[]).length};send(r);delete mk[d.id];});
/* generic finished activity (kids template & future pages): detail = {mode,variant,score,max,percent,grade,gradeNum,pass,durationSec,wrong:[{id,q,a,c,pts,max}],extra} */
addEventListener('tp:result',function(e){var d=e.detail||{};var r=base(['quiz','mock','flashcards','other'].indexOf(d.mode)>=0?d.mode:'other');r.variant=cut(d.variant||'',80);r.score=d.score;r.max=d.max;r.percent=d.percent;r.grade=cut(d.grade||'',40);r.gradeNum=d.gradeNum==null?null:d.gradeNum;r.pass=typeof d.pass==='boolean'?d.pass:null;r.durationSec=d.durationSec;
 var wr=(d.wrong||[]).slice(0,40).map(function(x){return {id:String(x.id||'').slice(0,60),q:cut(x.q,160),a:cut(x.a,160),c:cut(x.c,160),pts:x.pts,max:x.max};});r.wrongCount=wr.length;r.wrong=wr;r.extra=(d.extra&&typeof d.extra==='object')?d.extra:{};send(r);});
/* flashcard sessions: summary sent when the page is hidden/closed (only if >=5 cards rated) */
var fc=null;
addEventListener('tp:card',function(e){var d=e.detail||{};if(!fc)fc={t0:now(),n:0,r:{1:0,2:0,3:0}};fc.n++;fc.r[d.rating]=(fc.r[d.rating]||0)+1;fc.known=d.known;fc.total=d.total;fc.t1=now();});
function fcFlush(){if(!fc||fc.n<5){return;}var r=base('flashcards');r.variant='Fiszki';r.score=fc.known;r.max=fc.total;r.percent=fc.total?Math.round(100*fc.known/fc.total):0;r.grade='';r.gradeNum=null;r.pass=null;r.durationSec=Math.round((fc.t1-fc.t0)/1000);r.wrongCount=fc.r[1]||0;r.wrong=[];r.extra={rated:fc.n,nieWiem:fc.r[1]||0,prawie:fc.r[2]||0,wiem:fc.r[3]||0};fc=null;send(r);}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')fcFlush();});addEventListener('pagehide',fcFlush);
window.__tpResults={queue:lq,flush:flush,cfg:{endpoint:!!CFG.endpoint}};
})();</script>
