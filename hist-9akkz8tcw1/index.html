<script>window.TP_CONTENT={"schemaVersion": 1, "meta": {"id": "hist7-powstanie-listopadowe-demo", "title": "Powstanie listopadowe (1830–1831)", "subtitle": "Królestwo Polskie po kongresie wiedeńskim, noc listopadowa, wojna z Rosją i skutki", "subject": "Historia", "grade": "Klasa 7 SP", "lang": "pl", "explainLangs": ["pl", "en", "ru"], "estimatedMinutes": 75, "sourceNote": "Przykład demonstracyjny przygotowany na podstawie podstawy programowej (klasa 7, dział XX: Ziemie polskie w latach 1815–1848), bez zdjęć podręcznika. Jeśli coś różni się od podręcznika – ważniejszy jest podręcznik i to, co mówił nauczyciel.", "uncertain": []}, "diagnostic": [{"id": "d1", "type": "mc", "tag": "l1", "q": "Kto był królem Królestwa Polskiego utworzonego w 1815 r.?", "options": ["Książę Józef Poniatowski", "Car Rosji", "Król Prus", "Cesarz Austrii"], "answer": 1, "explain": "Królestwo Polskie było połączone z Rosją unią personalną: car Rosji był jednocześnie królem Polski."}, {"id": "d2", "type": "mc", "tag": "l2", "q": "Kiedy wybuchło powstanie listopadowe?", "options": ["3 maja 1791 r.", "29/30 listopada 1830 r.", "22 stycznia 1863 r.", "11 listopada 1918 r."], "answer": 1, "explain": "Noc listopadowa to noc z 29 na 30 listopada 1830 r. (22 stycznia 1863 – to powstanie styczniowe)."}, {"id": "d3", "type": "mc", "tag": "l2", "q": "W jakiej szkole zawiązał się spisek, który rozpoczął powstanie?", "options": ["W Szkole Rycerskiej", "W Szkole Podchorążych Piechoty", "Na Uniwersytecie Jagiellońskim", "W Collegium Nobilium"], "answer": 1, "explain": "Spisek założył w 1828 r. ppor. Piotr Wysocki, instruktor w Szkole Podchorążych Piechoty w Warszawie."}, {"id": "d4", "type": "tf", "tag": "l3", "q": "Oceń zdanie:", "items": [{"s": "Powstanie listopadowe zakończyło się zwycięstwem Polaków.", "a": false}], "explain": "Powstanie upadło – Warszawa skapitulowała we wrześniu 1831 r., a resztki wojska przeszły do Prus w październiku."}, {"id": "d5", "type": "mc", "tag": "l4", "q": "Czym była Wielka Emigracja?", "options": ["Wyjazdem chłopów do Ameryki za pracą", "Wyjazdem ok. 10 tys. Polaków (głównie żołnierzy i polityków) na Zachód po upadku powstania", "Przesiedleniem Polaków na Syberię w XVIII w.", "Ucieczką króla z Warszawy"], "answer": 1, "explain": "Po klęsce powstania ok. 10 tys. osób wyjechało głównie do Francji – to była elita polityczna i kulturalna."}], "lessons": [{"id": "l1", "title": "Królestwo Polskie po kongresie wiedeńskim (1815–1830)", "minutes": 6, "body": ["**Kongres wiedeński (1814–1815)** ustalił nowe granice Europy po wojnach napoleońskich. Z większej części Księstwa Warszawskiego utworzono **Królestwo Polskie** (nazywane też Kongresowym lub Kongresówką).", "Królestwo było połączone z Rosją **unią personalną** – **car Rosji był królem Polski**. Pierwszym królem był car **Aleksander I**, który w 1815 r. nadał Królestwu **konstytucję** – jedną z najbardziej liberalnych w ówczesnej Europie.", "Królestwo miało własny **sejm, rząd, wojsko, sądy, szkolnictwo i walutę**, a językiem urzędowym był **polski**. Władzę w imieniu cara sprawował **namiestnik** (gen. Józef Zajączek), a wojskiem dowodził brat cara – **wielki książę Konstanty**.", "Były też sukcesy: w 1816 r. powstał **Uniwersytet Warszawski**, minister skarbu **Ksawery Drucki-Lubecki** uzdrowił finanse i założył **Bank Polski** (1828), rozwijał się przemysł (np. włókienniczy w okolicach **Łodzi**).", "Jednak władze rosyjskie coraz częściej **łamały konstytucję**: wprowadzono **cenzurę** (1819), zniesiono jawność obrad sejmu (1825), działała tajna policja, a opozycję prześladowano (np. aresztowano **Waleriana Łukasińskiego**, 1822). Legalną opozycję w sejmie tworzyli **kaliszanie** (bracia Niemojowscy)."], "keyPoints": ["1815 – kongres wiedeński tworzy Królestwo Polskie", "Unia personalna: car = król Polski", "Konstytucja 1815 r. – sejm, wojsko, polski język urzędowy", "Łamanie konstytucji: cenzura, tajna policja, prześladowania"], "why": [{"q": "Dlaczego łamanie konstytucji wywoływało tak duży gniew Polaków?", "a": "Bo konstytucja gwarantowała im prawa i autonomię. Kiedy car (który przysięgał jej przestrzegać) ją łamał, Polacy czuli, że tracą resztki samodzielności – rosło przekonanie, że trzeba walczyć."}], "tldr": {"pl": "Po 1815 r. powstało Królestwo Polskie z carem jako królem i liberalną konstytucją, ale Rosja coraz częściej ją łamała.", "en": "After the Congress of Vienna (1815) the Kingdom of Poland was created. The Russian tsar was also King of Poland. It had a liberal constitution, its own parliament (sejm) and army, but Russia increasingly broke the constitution (censorship, secret police, persecution).", "ru": "После Венского конгресса (1815) было создано Царство Польское. Российский царь был одновременно королём Польши. У Царства была либеральная конституция, свой сейм и армия, но Россия всё чаще нарушала конституцию (цензура, тайная полиция, преследования)."}}, {"id": "l2", "title": "Spisek podchorążych i noc listopadowa", "minutes": 6, "body": ["W 1825 r. carem (i królem Polski) został **Mikołaj I** – zwolennik twardych rządów. W 1829 r. koronował się w Warszawie na króla Polski.", "W 1828 r. ppor. **Piotr Wysocki** założył tajne **sprzysiężenie w Szkole Podchorążych Piechoty** w Warszawie. Spiskowcy chcieli bronić konstytucji i odzyskać niepodległość.", "Bezpośrednie przyczyny wybuchu (1830): **rewolucja lipcowa we Francji** i **rewolucja w Belgii**. Car planował użyć **wojska polskiego do tłumienia rewolucji** na Zachodzie. Do tego władze wpadły na trop spisku – groziły aresztowania.", "**W nocy z 29 na 30 listopada 1830 r.** spiskowcy zaatakowali **Belweder** – siedzibę wielkiego księcia Konstantego (Konstanty zdołał uciec) – i zdobyli **Arsenał**, skąd broń trafiła do mieszkańców Warszawy. Wielu polskich generałów odmówiło przyłączenia się, kilku zginęło.", "Na czele powstania stanął **dyktator gen. Józef Chłopicki** (od grudnia 1830 r.). Nie wierzył w zwycięstwo i próbował **porozumieć się z carem**, ale Mikołaj I żądał bezwarunkowej kapitulacji. Chłopicki ustąpił w styczniu 1831 r.", "**25 stycznia 1831 r.** sejm ogłosił **detronizację Mikołaja I** („Nie ma Mikołaja!”). To oznaczało wojnę z Rosją. Powstał **Rząd Narodowy** z księciem **Adamem Jerzym Czartoryskim** na czele. W tym czasie w Warszawie użyto hasła **„Za naszą i waszą wolność”**."], "keyPoints": ["1828 – spisek Piotra Wysockiego w Szkole Podchorążych", "29/30 XI 1830 – atak na Belweder i zdobycie Arsenału", "Dyktator Chłopicki chciał ugody z carem", "25 I 1831 – detronizacja Mikołaja I → wojna"], "why": [{"q": "Dlaczego detronizacja Mikołaja I była punktem bez odwrotu?", "a": "Sejm odebrał carowi tron polski, czyli zerwał unię z Rosją. Po czymś takim car nie mógł już zgodzić się na rozmowy – zostawała tylko wojna."}], "tldr": {"pl": "Spisek Wysockiego wybuchł 29/30 XI 1830 r. (Belweder, Arsenał). Chłopicki chciał ugody, ale 25 I 1831 r. sejm zdetronizował cara – zaczęła się wojna.", "en": "Cadet officer Piotr Wysocki's conspiracy started the uprising on the night of 29/30 November 1830 (attack on the Belweder palace, capture of the Arsenal). Dictator Chłopicki wanted a deal with the tsar, but on 25 January 1831 the sejm dethroned Nicholas I – war with Russia began.", "ru": "Заговор подпоручика Петра Высоцкого начал восстание в ночь с 29 на 30 ноября 1830 г. (нападение на Бельведер, захват Арсенала). Диктатор Хлопицкий хотел договориться с царём, но 25 января 1831 г. сейм низложил Николая I – началась война с Россией."}}, {"id": "l3", "title": "Wojna polsko-rosyjska 1831 i upadek powstania", "minutes": 7, "body": ["W lutym 1831 r. do Królestwa wkroczyła armia rosyjska dowodzona przez feldmarszałka **Iwana Dybicza** – ponad dwa razy liczniejsza od polskiej.", "Najważniejsze bitwy: **Stoczek** (14 II 1831, gen. **Józef Dwernicki** – pierwsze zwycięstwo), **Olszynka Grochowska** (25 II 1831 – krwawa bitwa nierozstrzygnięta, ale Rosjanie nie zdobyli Warszawy), **Wawer i Dębe Wielkie** (31 III 1831) oraz **Iganie** (10 IV 1831) – polskie zwycięstwa.", "Naczelny wódz gen. **Jan Skrzynecki** nie wykorzystał tych zwycięstw. **26 maja 1831 r.** Polacy przegrali bitwę pod **Ostrołęką**. Walki toczyły się też na Litwie – walczyła tam m.in. **Emilia Plater**.", "Dybicz zmarł na cholerę, a dowództwo objął **Iwan Paskiewicz**. **6–7 września 1831 r.** Rosjanie szturmowali Warszawę: na **Woli** zginął gen. **Józef Sowiński**, wysadzono **redutę Ordona** (opisał ją Adam Mickiewicz). Warszawa **skapitulowała 7/8 września**.", "W październiku 1831 r. resztki wojska przeszły do Prus, a **Zamość** skapitulował jako ostatni (21 X 1831).", "**Przyczyny klęski:** przewaga liczebna Rosji, **niezdecydowanie i brak wiary w zwycięstwo dowódców** (Chłopicki, Skrzynecki), **brak pomocy z zagranicy**, spory polityczne oraz **brak reform dla chłopów** – większość chłopów nie poparła powstania."], "keyPoints": ["Stoczek 14 II – pierwsze zwycięstwo (Dwernicki)", "Olszynka Grochowska 25 II – nierozstrzygnięta", "Ostrołęka 26 V – klęska", "Szturm Warszawy 6–7 IX: Wola (Sowiński), reduta Ordona", "Przyczyny klęski: przewaga Rosji, słabi dowódcy, brak pomocy, chłopi bez reform"], "why": [{"q": "Dlaczego brak reform chłopskich osłabił powstanie?", "a": "Chłopi stanowili większość ludności. Gdyby dostali ziemię na własność (uwłaszczenie), mogliby masowo walczyć. Bez tego nie mieli powodu ryzykować życia, więc powstańcy nie mieli rezerw ludzi."}], "tldr": {"pl": "Mimo zwycięstw (Stoczek, Wawer, Dębe Wielkie, Iganie) Polacy przegrali pod Ostrołęką, a we wrześniu 1831 r. upadła Warszawa.", "en": "Despite victories (Stoczek, Wawer, Dębe Wielkie, Iganie) the Poles lost at Ostrołęka (May 1831), and Warsaw fell in September 1831. Reasons: Russia's numbers, indecisive commanders, no foreign help, no reforms for peasants.", "ru": "Несмотря на победы (Сточек, Вавер, Дембе-Вельке, Игане), поляки проиграли под Остроленкой (май 1831), а в сентябре 1831 г. пала Варшава. Причины: численный перевес России, нерешительные командиры, отсутствие помощи извне, нет реформ для крестьян."}}, {"id": "l4", "title": "Skutki powstania i Wielka Emigracja", "minutes": 6, "body": ["Car ukarał Królestwo: w 1832 r. konstytucję zastąpił **Statut Organiczny**, **zlikwidowano sejm i wojsko polskie**. Namiestnikiem został **Iwan Paskiewicz** – jego surowe rządy nazwano **„nocą paskiewiczowską”**.", "W Warszawie zbudowano **Cytadelę** – twierdzę, która miała pilnować miasta. Zamknięto **Uniwersytet Warszawski i Wileński**. Uczestnikom powstania **konfiskowano majątki**, wielu zesłano na **Syberię** lub wcielono do armii rosyjskiej.", "Po klęsce około **10 tysięcy** Polaków – żołnierzy, polityków, artystów – wyjechało na Zachód, głównie do **Francji**. Nazywamy to **Wielką Emigracją**.", "Emigranci podzielili się: **konserwatyści** skupieni wokół księcia **Adama Jerzego Czartoryskiego** (**Hotel Lambert**) liczyli na pomoc dyplomatyczną państw Zachodu; **demokraci** z **Towarzystwa Demokratycznego Polskiego** (1832) chcieli nowego powstania z udziałem chłopów i ich uwłaszczenia.", "Na emigracji tworzyli wielcy artyści: **Adam Mickiewicz** („Pan Tadeusz”), **Juliusz Słowacki**, kompozytor **Fryderyk Chopin**. Ich dzieła podtrzymywały ducha narodowego Polaków."], "keyPoints": ["1832 – Statut Organiczny zamiast konstytucji", "Likwidacja sejmu i wojska, Cytadela, zamknięte uniwersytety", "Konfiskaty, zsyłki na Syberię", "Wielka Emigracja (ok. 10 tys., głównie Francja): Hotel Lambert vs TDP"], "why": [{"q": "Dlaczego Wielka Emigracja była ważna, skoro emigranci żyli poza Polską?", "a": "Wyjechała elita – politycy i artyści. Mogli swobodnie pisać i działać (bez cenzury), przypominali Europie o sprawie polskiej i przygotowywali kolejne powstania."}], "tldr": {"pl": "Po powstaniu: Statut Organiczny, koniec sejmu i armii, Cytadela, represje. Ok. 10 tys. osób wyjechało – Wielka Emigracja.", "en": "After the uprising: the constitution was replaced by the Organic Statute (1832), the sejm and Polish army were abolished, the Warsaw Citadel was built, universities closed, property confiscated, people exiled to Siberia. About 10,000 Poles emigrated, mostly to France – the Great Emigration (Mickiewicz, Chopin).", "ru": "После восстания: конституцию заменил Органический статут (1832), упразднены сейм и польская армия, построена Варшавская цитадель, закрыты университеты, конфискации, ссылки в Сибирь. Около 10 тыс. поляков эмигрировали, в основном во Францию – Великая эмиграция (Мицкевич, Шопен)."}}], "timeline": [{"date": "1815", "label": "Kongres wiedeński – powstaje Królestwo Polskie, konstytucja", "tag": "l1"}, {"date": "1819", "label": "Wprowadzenie cenzury", "tag": "l1"}, {"date": "1825", "label": "Mikołaj I carem i królem Polski", "tag": "l2"}, {"date": "1828", "label": "Spisek Piotra Wysockiego w Szkole Podchorążych", "tag": "l2"}, {"date": "29/30 XI 1830", "label": "Noc listopadowa – Belweder i Arsenał", "tag": "l2", "key": true}, {"date": "25 I 1831", "label": "Detronizacja Mikołaja I", "tag": "l2", "key": true}, {"date": "14 II 1831", "label": "Bitwa pod Stoczkiem – zwycięstwo", "tag": "l3"}, {"date": "25 II 1831", "label": "Bitwa o Olszynkę Grochowską", "tag": "l3"}, {"date": "26 V 1831", "label": "Klęska pod Ostrołęką", "tag": "l3"}, {"date": "6–8 IX 1831", "label": "Szturm i kapitulacja Warszawy", "tag": "l3", "key": true}, {"date": "1832", "label": "Statut Organiczny; Wielka Emigracja", "tag": "l4", "key": true}], "map": {"title": "Bitwy powstania listopadowego (schemat)", "caption": "Schemat – położenie przybliżone. Zielone = zwycięstwo Polaków, szare = nierozstrzygnięta, czerwone = porażka.", "points": [{"name": "Warszawa", "lat": 52.23, "lon": 21.01, "kind": "city", "note": "Kapitulacja 7/8 IX 1831"}, {"name": "Olszynka Grochowska", "lat": 52.245, "lon": 21.11, "kind": "draw", "note": "25 II 1831"}, {"name": "Wawer", "lat": 52.19, "lon": 21.18, "kind": "win", "note": "31 III 1831"}, {"name": "Dębe Wielkie", "lat": 52.2, "lon": 21.44, "kind": "win", "note": "31 III 1831"}, {"name": "Stoczek", "lat": 51.96, "lon": 21.97, "kind": "win", "note": "14 II 1831"}, {"name": "Iganie", "lat": 52.15, "lon": 22.2, "kind": "win", "note": "10 IV 1831"}, {"name": "Ostrołęka", "lat": 53.08, "lon": 21.57, "kind": "loss", "note": "26 V 1831"}]}, "people": [{"name": "Piotr Wysocki", "role": "założyciel spisku w Szkole Podchorążych (1828)"}, {"name": "wielki książę Konstanty", "role": "brat cara, wódz armii Królestwa; uciekł z Belwederu"}, {"name": "Mikołaj I", "role": "car Rosji i król Polski, zdetronizowany 25 I 1831"}, {"name": "Józef Chłopicki", "role": "pierwszy dyktator powstania, chciał ugody"}, {"name": "Adam Jerzy Czartoryski", "role": "prezes Rządu Narodowego, potem Hotel Lambert"}, {"name": "Józef Dwernicki", "role": "zwycięzca spod Stoczka"}, {"name": "Jan Skrzynecki", "role": "naczelny wódz, nie wykorzystał zwycięstw"}, {"name": "Emilia Plater", "role": "walczyła w powstaniu na Litwie"}, {"name": "Józef Sowiński", "role": "generał, zginął w obronie Woli"}, {"name": "Iwan Paskiewicz", "role": "zdobył Warszawę, potem namiestnik"}], "flashcards": [{"front": "Unia personalna (Królestwo Polskie – Rosja)", "back": "Wspólny władca: car Rosji był jednocześnie królem Polski.", "tag": "l1"}, {"front": "Kongres wiedeński", "back": "1814–1815; ustalił granice Europy po Napoleonie, utworzył Królestwo Polskie.", "tag": "l1"}, {"front": "Cenzura", "back": "Kontrola publikacji przed wydaniem przez władze (w Królestwie od 1819 r.).", "tag": "l1"}, {"front": "Kaliszanie", "back": "Legalna opozycja w sejmie Królestwa (bracia Niemojowscy), broniła konstytucji.", "tag": "l1"}, {"front": "Ksawery Drucki-Lubecki", "back": "Minister skarbu; uzdrowił finanse, założył Bank Polski (1828).", "tag": "l1"}, {"front": "Piotr Wysocki", "back": "Ppor., w 1828 r. założył spisek w Szkole Podchorążych Piechoty.", "tag": "l2"}, {"front": "Noc listopadowa – data i cele ataku", "back": "29/30 XI 1830: Belweder (siedziba Konstantego) i Arsenał (broń).", "tag": "l2"}, {"front": "Dyktator", "back": "Osoba z pełnią władzy na czas zagrożenia; pierwszy w powstaniu – gen. Józef Chłopicki.", "tag": "l2"}, {"front": "Detronizacja Mikołaja I", "back": "25 I 1831 sejm odebrał carowi tron polski → wojna z Rosją.", "tag": "l2"}, {"front": "„Za naszą i waszą wolność”", "back": "Hasło z czasów powstania listopadowego (1831) – walka o wolność Polaków i innych narodów.", "tag": "l2"}, {"front": "Bitwa pod Stoczkiem", "back": "14 II 1831, gen. Dwernicki – pierwsze zwycięstwo powstańców.", "tag": "l3"}, {"front": "Olszynka Grochowska", "back": "25 II 1831 – krwawa bitwa nierozstrzygnięta; Rosjanie nie zdobyli Warszawy.", "tag": "l3"}, {"front": "Ostrołęka", "back": "26 V 1831 – klęska wojsk polskich.", "tag": "l3"}, {"front": "Reduta Ordona", "back": "Umocnienie na Woli wysadzone podczas szturmu Warszawy (6 IX 1831); wiersz Mickiewicza.", "tag": "l3"}, {"front": "Statut Organiczny", "back": "1832 – zastąpił konstytucję; Królestwo straciło sejm i wojsko.", "tag": "l4"}, {"front": "Cytadela Warszawska", "back": "Twierdza zbudowana po powstaniu, by kontrolować Warszawę (i więzienie).", "tag": "l4"}, {"front": "Wielka Emigracja", "back": "Wyjazd ok. 10 tys. Polaków (głównie do Francji) po upadku powstania.", "tag": "l4"}, {"front": "Hotel Lambert vs TDP", "back": "Hotel Lambert – konserwatyści, ks. Czartoryski, dyplomacja. TDP – demokraci, nowe powstanie i uwłaszczenie chłopów.", "tag": "l4"}], "quiz": [{"id": "q1", "type": "mc", "tag": "l1", "q": "Która instytucja NIE istniała w Królestwie Polskim w latach 1815–1830?", "options": ["Sejm", "Wojsko polskie", "Własny, niezależny od Rosji król", "Uniwersytet Warszawski"], "answer": 2, "explain": "Królem był car Rosji (unia personalna) – nie było osobnego, niezależnego władcy."}, {"id": "q2", "type": "multi", "tag": "l1", "q": "Zaznacz DWA przykłady łamania konstytucji w Królestwie Polskim.", "options": ["Wprowadzenie cenzury", "Założenie Banku Polskiego", "Prześladowanie opozycji i tajnej organizacji Łukasińskiego", "Utworzenie Uniwersytetu Warszawskiego"], "answer": [0, 2], "explain": "Bank i uniwersytet to osiągnięcia Królestwa. Cenzura i prześladowania łamały wolności zapisane w konstytucji."}, {"id": "q3", "type": "order", "tag": "l2", "q": "Ułóż wydarzenia w kolejności chronologicznej (od najwcześniejszego).", "items": ["Kongres wiedeński", "Spisek w Szkole Podchorążych", "Noc listopadowa", "Detronizacja Mikołaja I"], "explain": "1815 → 1828 → 29/30 XI 1830 → 25 I 1831."}, {"id": "q4", "type": "cat", "tag": "l2", "q": "Przyporządkuj: przyczyna czy skutek powstania listopadowego?", "categories": ["Przyczyna", "Skutek"], "items": [{"t": "Łamanie konstytucji przez władze rosyjskie", "c": 0}, {"t": "Statut Organiczny", "c": 1}, {"t": "Plan użycia wojska polskiego przeciw rewolucjom we Francji i Belgii", "c": 0}, {"t": "Wielka Emigracja", "c": 1}], "explain": "Przyczyny to to, co było przed wybuchem (1815–1830); skutki – to, co stało się po upadku (1831–1832)."}, {"id": "q5", "type": "mc", "tag": "l2", "q": "Dlaczego spiskowcy zaatakowali Arsenał?", "options": ["Bo mieszkał tam car", "Żeby zdobyć broń dla mieszkańców Warszawy", "Żeby uwolnić więźniów z Syberii", "Bo obradował tam sejm"], "answer": 1, "explain": "Arsenał był magazynem broni – po jego zdobyciu uzbrojono ludność Warszawy."}, {"id": "q6", "type": "match", "tag": "l3", "q": "Dopasuj postać do opisu.", "pairs": [["Piotr Wysocki", "założył spisek podchorążych"], ["Józef Chłopicki", "dyktator, chciał ugody z carem"], ["Józef Dwernicki", "zwycięzca spod Stoczka"], ["Emilia Plater", "walczyła na Litwie"]], "explain": "Wysocki – spisek (1828); Chłopicki – dyktator; Dwernicki – Stoczek (14 II 1831); Plater – Litwa."}, {"id": "q7", "type": "tf", "tag": "l3", "q": "Prawda czy fałsz?", "items": [{"s": "Bitwa o Olszynkę Grochowską zakończyła się zdobyciem Warszawy przez Rosjan.", "a": false}, {"s": "Pod Ostrołęką w maju 1831 r. Polacy ponieśli klęskę.", "a": true}], "explain": "Olszynka (25 II) była nierozstrzygnięta – Warszawa upadła dopiero we wrześniu. Ostrołęka (26 V) – klęska."}, {"id": "q8", "type": "short", "tag": "l3", "q": "Jak nazywa się generał, który zginął w obronie Woli we wrześniu 1831 r.? (nazwisko)", "accept": ["Sowiński", "Józef Sowiński", "Sowinski"], "explain": "Gen. Józef Sowiński – symbol bohaterskiej obrony Warszawy."}, {"id": "q9", "type": "multi", "tag": "l3", "q": "Zaznacz TRZY przyczyny klęski powstania.", "options": ["Przewaga liczebna armii rosyjskiej", "Pomoc Francji i Wielkiej Brytanii dla Rosji", "Brak reform dla chłopów", "Niezdecydowanie dowódców", "Brak jakichkolwiek zwycięstw Polaków"], "answer": [0, 2, 3], "explain": "Francja i Wielka Brytania nie pomogły nikomu (ani Polakom, ani Rosji). Polacy wygrali kilka bitew (Stoczek, Wawer, Iganie)."}, {"id": "q10", "type": "mc", "tag": "l4", "q": "Co zastąpiło konstytucję Królestwa Polskiego w 1832 r.?", "options": ["Konstytucja 3 maja", "Statut Organiczny", "Kodeks Napoleona", "Artykuły henrykowskie"], "answer": 1, "explain": "Statut Organiczny (1832) – Królestwo straciło sejm i wojsko."}, {"id": "q11", "type": "match", "tag": "l4", "q": "Dopasuj pojęcie do opisu.", "pairs": [["Hotel Lambert", "konserwatyści ks. Czartoryskiego"], ["Towarzystwo Demokratyczne Polskie", "demokraci, uwłaszczenie chłopów"], ["Cytadela", "twierdza pilnująca Warszawy"], ["Noc paskiewiczowska", "surowe rządy namiestnika po 1831 r."]], "explain": "Dwa obozy Wielkiej Emigracji + dwa symbole represji w Królestwie."}, {"id": "q12", "type": "tf", "tag": "l4", "q": "Prawda czy fałsz?", "items": [{"s": "Po powstaniu zamknięto Uniwersytet Warszawski.", "a": true}, {"s": "Większość emigrantów wyjechała do Rosji.", "a": false}], "explain": "Emigranci wyjechali głównie do Francji. Uniwersytety w Warszawie i Wilnie zamknięto."}, {"id": "q13", "type": "mc", "tag": "l2", "q": "Kto mieszkał w Belwederze, gdy wybuchło powstanie?", "options": ["Car Mikołaj I", "Wielki książę Konstanty", "Piotr Wysocki", "Adam Mickiewicz"], "answer": 1, "explain": "Belweder był siedzibą wielkiego księcia Konstantego – zdołał uciec."}, {"id": "q14", "type": "short", "tag": "l2", "q": "Podaj dokładną datę dzienną detronizacji Mikołaja I (np. 1 I 1830).", "accept": ["25 I 1831", "25 stycznia 1831", "25.01.1831", "25 01 1831", "25 1 1831"], "explain": "25 stycznia 1831 r."}], "explainPrompts": [{"id": "e1", "tag": "l2", "prompt": "Wytłumacz młodszemu koledze (jak YouTuber), dlaczego w 1830 r. wybuchło powstanie. Użyj słowa „konstytucja”.", "keyPoints": ["łamanie konstytucji (cenzura, prześladowania)", "car Mikołaj I – twarde rządy", "rewolucje we Francji i Belgii – plan wysłania polskiego wojska", "groźba wykrycia spisku Wysockiego"], "model": "Królestwo Polskie miało konstytucję, ale Rosjanie ją łamali – była cenzura i prześladowania. Car Mikołaj I rządził twardo. W 1830 r. wybuchły rewolucje we Francji i Belgii i car chciał wysłać tam polskie wojsko. Spiskowcy Wysockiego bali się też, że zostaną aresztowani, więc 29 listopada zaczęli powstanie."}, {"id": "e2", "tag": "l3", "prompt": "Wyobraź sobie, że jesteś historykiem. Wyjaśnij w 3–4 zdaniach, dlaczego powstanie przegrało, choć Polacy wygrali kilka bitew.", "keyPoints": ["przewaga liczebna Rosji", "niezdecydowanie dowódców (Chłopicki, Skrzynecki)", "brak pomocy z zagranicy", "chłopi nie poparli powstania – brak uwłaszczenia"], "model": "Rosja miała dużo większą armię. Dowódcy, np. Skrzynecki, nie wykorzystali zwycięstw, bo nie wierzyli w wygraną. Żadne państwo nie pomogło Polakom. Chłopi nie dostali ziemi, więc większość z nich nie walczyła."}, {"id": "e3", "tag": "l4", "prompt": "Opisz skutki powstania dla Królestwa Polskiego i wyjaśnij, czym była Wielka Emigracja.", "keyPoints": ["Statut Organiczny zamiast konstytucji", "likwidacja sejmu i wojska", "represje: konfiskaty, Syberia, Cytadela, zamknięte uniwersytety", "Wielka Emigracja – ok. 10 tys., głównie Francja, elita polityczna i artyści"], "model": "Car zastąpił konstytucję Statutem Organicznym i zlikwidował sejm i wojsko. Uczestników karano konfiskatami i zsyłkami na Syberię, zbudowano Cytadelę, zamknięto uniwersytety. Ok. 10 tys. ludzi wyjechało głównie do Francji – to Wielka Emigracja, m.in. Mickiewicz i Chopin."}], "mockTest": {"title": "Sprawdzian: Powstanie listopadowe – grupa A", "minutes": 30, "intro": "Pracuj jak na prawdziwym sprawdzianie: bez podręcznika i bez podpowiedzi. Wyniki zobaczysz na końcu.", "gradeScale": [[0, "niedostateczny"], [30, "dopuszczający"], [50, "dostateczny"], [70, "dobry"], [90, "bardzo dobry"], [98, "celujący"]], "tasks": [{"id": "m1", "type": "order", "tag": "l3", "points": 2, "q": "Zadanie 1. Uporządkuj wydarzenia chronologicznie.", "items": ["Bitwa pod Stoczkiem", "Bitwa pod Ostrołęką", "Szturm Warszawy", "Statut Organiczny"], "explain": "14 II 1831 → 26 V 1831 → 6–7 IX 1831 → 1832."}, {"id": "m2", "type": "tf", "tag": "l1", "q": "Zadanie 2. Oceń prawdziwość zdań (P/F).", "items": [{"s": "Królestwo Polskie powstało na mocy decyzji kongresu wiedeńskiego.", "a": true}, {"s": "W Królestwie Polskim językiem urzędowym był rosyjski.", "a": false}, {"s": "Pierwszym dyktatorem powstania był Józef Chłopicki.", "a": true}, {"s": "Powstanie listopadowe zakończyło się w 1832 r. bitwą pod Grunwaldem.", "a": false}], "explain": "Językiem urzędowym był polski. Powstanie upadło jesienią 1831 r."}, {"id": "m3", "type": "match", "tag": "l2", "q": "Zadanie 3. Przyporządkuj postaciom ich rolę.", "pairs": [["Mikołaj I", "car, zdetronizowany przez sejm"], ["Adam Jerzy Czartoryski", "prezes Rządu Narodowego"], ["Iwan Paskiewicz", "zdobył Warszawę"], ["wielki książę Konstanty", "uciekł z Belwederu"]], "explain": ""}, {"id": "m4", "type": "cat", "tag": "l4", "q": "Zadanie 4. Określ, czy to przyczyna (P), czy skutek (S) powstania.", "categories": ["Przyczyna", "Skutek"], "items": [{"t": "Wprowadzenie cenzury", "c": 0}, {"t": "Likwidacja sejmu i wojska Królestwa", "c": 1}, {"t": "Zamknięcie Uniwersytetu Warszawskiego", "c": 1}, {"t": "Rewolucja lipcowa we Francji", "c": 0}], "explain": "
