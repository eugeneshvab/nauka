<script>window.TP_CONTENT={"schemaVersion": 1, "meta": {"id": "bio7-pokarmowy", "title": "Biologia: Układ pokarmowy – testy i quizy", "subtitle": "Składniki pokarmowe i ich rola · Budowa i funkcje układu pokarmowego · Gdy układ pokarmowy choruje (podręcznik s. 38–56). Tylko testy: szybkie quizy, pełne testy, sprawdziany, quiz głosowy i trening błędów.", "subject": "Biologia", "grade": "Klasa 7 SP", "lang": "pl", "estimatedMinutes": 90, "layout": "classic", "quickN": 8, "tabs": [["quiz", "⚡ Quizy i testy"], ["mock", "📝 Sprawdziany"], ["trening", "🔁 Trening błędów"]], "lessonNames": {"l1": "1. Składniki pokarmowe", "l2": "2. Budowa i funkcje układu", "l3": "3. Gdy układ choruje"}, "sourceNote": "Pytania wyłącznie na podstawie stron 38–56 podręcznika (numer strony przy każdym wyjaśnieniu). Wyniki zapisują się automatycznie.", "uncertain": ["s. 48: koniec zdania o zębach stałych ucięty na zdjęciu („… co najmniej kilkadziesiąt [lat]”) – nie pytamy o to.", "s. 50: wyniki doświadczeń z jajkami (napoje, pasta z fluorem) nie są podane w podręczniku – pytania dotyczą tylko przebiegu i pytań badawczych.", "s. 38/41: prawy brzeg zdjęcia częściowo ucięty (kilka końcówek słów) – treść jednoznaczna."], "tutorMaterial": "TEMAT: Biologia, klasa 7 – Układ pokarmowy (podręcznik s. 38–56), 3 lekcje. Mów po polsku, krótko. Najpierw pytaj ucznia, potem tłumacz. Tylko fakty z tego materiału.\nL1 Składniki pokarmowe i ich rola: składniki pokarmowe = substancje, z których składają się pokarmy; potrzebne do budowy ciała i energii (ruch, wzrost, rozmnażanie). Podstawowe: białka, cukry, tłuszcze, witaminy, sole mineralne, woda; błonnik ważny, ale nie trawiony. Woda: transport składników i tlenu, nawilża wdychane powietrze, oczyszcza z toksyn, reguluje temperaturę, ułatwia wchłanianie. Zawartość wody: mózg 75%, krew 83%, kości 22%, mięśnie 75%. Organizm zużywa nawet 2,5 l wody na dobę (wydalanie, oddychanie, wypróżnianie, pocenie). Pić 0,03 l wody na kg masy ciała na dobę (np. 50 kg → 1,5 l). Ile pić zależy od wieku, płci, warunków, stanu organizmu; upał i wysiłek – więcej. Badanie nawodnienia: test elastyczności skóry (grzbiet dłoni), kolor i ilość moczu (jasny słomkowy = dobrze; ciemny, rzadko = odwodnienie; poważne – kroplówka), badania laboratoryjne: morfologia (HCT – hematokryt), ogólne badanie moczu (kolor, ciężar właściwy), jonogram (sód, potas, chlor). Objawy odwodnienia: pragnienie, suche usta, ból i zawroty głowy, rzadko oddawany mocz, osłabienie, omdlenia. Białka z aminokwasów – materiał budulcowy: kolagen (skóra), białka kurczliwe (mięśnie), hemoglobina (tlen). Cukry (węglowodany) – łatwo dostępna energia; proste (glukoza) najszybciej; złożone (skrobia) najpierw rozkładane na proste – energia stopniowo; glikogen – zapas w wątrobie. Tłuszcze – materiał zapasowy, energia wolniej, przyswajanie witamin A, D, E, K. Witaminy: C odporność, D kości i zęby, A skóra i oczy. Sole mineralne: kości, sygnały nerwowe, nawodnienie; wapń (ser), żelazo (mięso, liście), potas (banan). Błonnik (celuloza): niestrawiony, pęcznieje, mniej głodu, przyspiesza jelita, zapobiega zaparciom, usuwa resztki – mniej chorób jelit i nowotworów; źródła: owoce, warzywa, strączkowe, zboża, pełnoziarniste, płatki owsiane. Jedz dużo: warzyw, strączkowych, pełnego ziarna; zamieniaj jasne pieczywo na pełnoziarniste, czerwone mięso na ryby/drób/jaja/strączkowe, słodkie napoje na wodę; ograniczaj sól, czerwone mięso, cukier i słodzone napoje; do zdrowia potrzebny też ruch. Za dużo jedzenia + mało ruchu → tkanka tłuszczowa → otyłość, choroby serca, cukrzyca nabyta. Anoreksja, bulimia – źródło w psychice; potrzebny lekarz i psychoterapeuta.\nL2 Budowa i funkcje: układ = przewód pokarmowy + gruczoły trawienne. Trawienie = rozkład na składniki i wchłanianie, dzięki enzymom trawiennym. Droga: jama ustna (zęby, ślina, początek trawienia cukrów) → gardło → przełyk → żołądek (sok żołądkowy) → dwunastnica (początek jelita cienkiego; enzymy trzustki i żółć z wątroby ostatecznie trawią) → jelito cienkie (wchłanianie do krwi; ponad 6 m, najdłuższe) → jelito grube (ok. 1,5 m; odzyskiwanie wody, kał) → odbyt. Przełyk i żołądek z mięśni gładkich. Perystaltyka = skurcze mięśni przesuwające pokarm od przełyku do odbytu. Od zjedzenia do wydalenia nawet 24–27 h; jabłko ok. 40 min, stek ponad 16 h. Gruczoły: ślinianki (ślina, enzymy trawiące cukry), wątroba z pęcherzykiem żółciowym (żółć – trawienie tłuszczów), trzustka (enzymy trawiące białka, cukry, tłuszcze). Zęby: dzieci 20 zębów mlecznych, wypadają ok. 6–12/13 r.ż.; stałe mocniejsze i większe. Budowa: szkliwo, zębina, miazga (naczynia krwionośne i nerwy), dziąsło. Rodzaje: siekacz (odgryzanie), kieł (rozrywanie), przedtrzonowiec i trzonowiec (miażdżenie, rozdrabnianie); mleczne nie mają przedtrzonowców. Próchnica: bakterie żywią się cukrami z resztek, kwasy niszczą szkliwo i zębinę; przyczyny: higiena, słodycze i napoje gazowane, niedobór fluoru, wrodzone skłonności; profilaktyka: szczotkowanie min. 2× dziennie, pasta z fluorem, nitkowanie, stomatolog min. raz na pół roku, witaminy i minerały, mniej słodyczy. Choroby dziąseł: krwawienie, zaczerwienienie, obrzęk, ból, odsłonięte szyjki, ruchome zęby, nieświeży oddech; przyczyny: higiena, płytka i kamień, palenie, hormony, cukrzyca; profilaktyka: szczotkowanie, nitkowanie, płyny antyseptyczne, czyszczenie u stomatologa, bez palenia, witamina C.\nL3 Choroby: przyczyny – złe nawyki żywieniowe, stres, używki, brak higieny, wirusy, bakterie, pasożyty (owsica, tasiemczyca). Zatrucia pokarmowe – bakterie (salmonella), środki ochrony roślin, metale ciężkie. Najgroźniejsze: WZW (biegunka, wymioty, zażółcenie skóry), rak jelita grubego (powoli, długo bez objawów; błonnik, mniej czerwonego mięsa i tłuszczu, badania kontrolne), choroba wrzodowa żołądka (ostry ból brzucha). WZW A – zakażone jedzenie, woda, brudne ręce; mycie rąk, bezpieczna woda, szczepienie. WZW B – płyny ustrojowe (krew, ślina), zabiegi; szczepienie, sterylne igły, nie dotykać igieł. WZW C – płyny ustrojowe, trwałe uszkodzenie wątroby; sterylne igły; brak szczepionki. Flora jelitowa – bakterie w jelitach, mniej więcej tyle co komórek ciała; bifidobakterie (błonnik), bakterie kwasu mlekowego, pałeczka okrężnicy (witamina K; pożyteczna tylko w jelitach), enterokoki, bakterie beztlenowe (Clostridium, resztki). Funkcje: trawienie, witaminy K i z grupy B, ochrona przed patogenami, odporność. Zaburzenia (zła dieta, antybiotyki): zaparcia, biegunki, otyłość, choroby zapalne jelit, słabsza odporność. Antybiotyki niszczą też dobre bakterie. Probiotyki – bakterie: jogurt, kefir, kiszonki. Prebiotyki – odżywiają dobre bakterie: cebula, czosnek, banany."}, "images": {}, "diagnostic": [], "lessons": [{"id": "l1", "title": "Składniki pokarmowe i ich rola"}, {"id": "l2", "title": "Budowa i funkcje układu pokarmowego"}, {"id": "l3", "title": "Gdy układ pokarmowy choruje"}], "flashcards": [], "quiz": [{"id": "p1", "type": "mc", "tag": "l1", "q": "Składniki pokarmowe to:", "options": ["substancje, z których składają się wszystkie pokarmy", "tylko witaminy i sole mineralne", "enzymy wytwarzane przez gruczoły", "wyłącznie cukry i tłuszcze"], "answer": 0, "explain": "Składniki pokarmowe – **substancje, z których składają się wszystkie pokarmy**; są w tym, co jesz i pijesz. *(s. 38)*"}, {"id": "p2", "type": "multi", "tag": "l1", "q": "Zaznacz **wszystkie** najważniejsze (podstawowe) składniki pokarmowe wymienione w podręczniku.", "options": ["białka", "cukry", "tłuszcze", "witaminy", "sole mineralne", "woda", "błonnik", "enzymy"], "answer": [0, 1, 2, 3, 4, 5], "explain": "Podstawowe: **białka, cukry, tłuszcze, witaminy, sole mineralne i woda**. Błonnik jest ważny w diecie, ale organizm go **nie trawi**. *(s. 38)*"}, {"id": "p3", "type": "multi", "tag": "l1", "q": "Do czego organizm potrzebuje składników pokarmowych? Zaznacz poprawne.", "options": ["do budowy ciała", "do uzyskania energii do czynności życiowych (ruch, wzrost, rozmnażanie)", "do wytwarzania pasożytów", "do zatrzymania perystaltyki"], "answer": [0, 1], "explain": "Do **budowy ciała** i **energii** do czynności życiowych, takich jak ruch, wzrost, rozmnażanie. *(s. 38)*"}, {"id": "p4", "type": "match", "tag": "l1", "q": "Dopasuj narząd/tkankę do zawartości wody.", "pairs": [["mózg", "75% wody"], ["krew", "83% wody"], ["kości", "22% wody"]], "explain": "Mózg **75%**, krew **83%**, kości **22%**, mięśnie **75%**. *(s. 38)*"}, {"id": "p5", "type": "short", "tag": "l1", "q": "Ile procent wody zawiera **krew**? (przecinek lub kropka, jednostkę możesz pominąć)", "num": 83, "tol": 0, "accept": ["83%", "83"], "explain": "Krew – **83%** wody (najwięcej z podanych). *(s. 38)*"}, {"id": "p6", "type": "short", "tag": "l1", "q": "Ile procent wody zawierają **kości**? (przecinek lub kropka, jednostkę możesz pominąć)", "num": 22, "tol": 0, "accept": ["22%", "22"], "explain": "Kości – **22%** wody (najmniej z podanych). *(s. 38)*"}, {"id": "p7", "type": "short", "tag": "l1", "q": "Ile procent wody zawierają **mięśnie**? (przecinek lub kropka, jednostkę możesz pominąć)", "num": 75, "tol": 0, "accept": ["75%", "75"], "explain": "Mięśnie – **75%** wody (tyle samo co mózg). *(s. 38)*"}, {"id": "p8", "type": "mc", "tag": "l1", "q": "Która część ciała ma **najwięcej** wody (wg podręcznika)?", "options": ["krew", "mózg", "mięśnie", "kości"], "answer": 0, "explain": "Krew 83% > mózg 75% = mięśnie 75% > kości 22%. *(s. 38)*"}, {"id": "p9", "type": "multi", "tag": "l1", "q": "Zaznacz funkcje wody w organizmie.", "options": ["transport składników odżywczych i tlenu do komórek", "nawilżanie wdychanego powietrza", "oczyszczanie organizmu z toksyn", "regulacja temperatury ciała", "ułatwianie wchłaniania substancji odżywczych", "produkcja witaminy K"], "answer": [0, 1, 2, 3, 4], "explain": "Woda: transportuje składniki odżywcze i tlen, nawilża wdychane powietrze, oczyszcza z toksyn, reguluje temperaturę, ułatwia wchłanianie. Witaminę K wytwarzają **bakterie jelitowe**. *(s. 38)*"}, {"id": "p10", "type": "short", "tag": "l1", "q": "Ile **litrów** wody organizm może zużyć na dobę (wg podręcznika „nawet …”)? (przecinek lub kropka, jednostkę możesz pominąć)", "num": 2.5, "tol": 0, "accept": ["2,5 l", "2,5", "2.5"], "explain": "Organizm zużywa **nawet 2,5 l wody na dobę** – przy wydalaniu, oddychaniu, wypróżnianiu, poceniu się. *(s. 39)*"}, {"id": "p11", "type": "short", "tag": "l1", "q": "Ile litrów wody na **1 kg** masy ciała na dobę należy pić? (przecinek lub kropka, jednostkę możesz pominąć)", "num": 0.03, "tol": 0, "accept": ["0,03 l", "0,03", "0.03"], "explain": "**0,03 l wody na kilogram masy ciała na dobę**. *(s. 39)*"}, {"id": "p12", "type": "short", "tag": "l1", "q": "Oblicz: ile litrów wody na dobę powinna wypić osoba ważąca **50 kg** (0,03 l na kg)? (przecinek lub kropka, jednostkę możesz pominąć)", "num": 1.5, "tol": 0.01, "accept": ["1,5 l", "1,5", "1.5"], "explain": "50 · 0,03 l = **1,5 l** na dobę. *(s. 39)*"}, {"id": "p13", "type": "short", "tag": "l1", "q": "Oblicz: ile litrów wody na dobę powinna wypić osoba ważąca **60 kg**? (przecinek lub kropka, jednostkę możesz pominąć)", "num": 1.8, "tol": 0.01, "accept": ["1,8 l", "1,8", "1.8"], "explain": "60 · 0,03 l = **1,8 l** na dobę. *(s. 39)*"}, {"id": "p14", "type": "multi", "tag": "l1", "q": "Podczas jakich procesów organizm traci wodę (wg podręcznika)?", "options": ["wydalanie", "oddychanie", "wypróżnianie", "pocenie się", "żucie"], "answer": [0, 1, 2, 3], "explain": "Wydalanie, oddychanie, wypróżnianie, pocenie się. *(s. 39)*"}, {"id": "p15", "type": "multi", "tag": "l1", "q": "Od czego zależy, ile trzeba pić?", "options": ["od wieku", "od płci", "od warunków środowiska", "od stanu organizmu", "od koloru oczu"], "answer": [0, 1, 2, 3], "explain": "Wiek, płeć, warunki środowiska, stan organizmu. W upale i przy wysiłku – dużo więcej niż zwykle. *(s. 39)*"}, {"id": "p16", "type": "match", "tag": "l1", "q": "Dopasuj sposób badania nawodnienia do opisu.", "pairs": [["test elastyczności skóry", "uszczypnij skórę na grzbiecie dłoni – czy szybko wraca"], ["obserwacja moczu", "kolor i ilość moczu"], ["badania laboratoryjne", "morfologia krwi, ogólne badanie moczu, jonogram"]], "explain": "3 sposoby: test elastyczności skóry, obserwacja koloru i ilości moczu, badania laboratoryjne. *(s. 39)*"}, {"id": "p17", "type": "mc", "tag": "l1", "q": "Jaki kolor moczu oznacza **prawidłowe** nawodnienie?", "options": ["jasny słomkowy", "ciemny", "czerwony", "zielony"], "answer": 0, "explain": "**Jasny słomkowy** – prawidłowe nawodnienie; ciemny i rzadziej oddawany może wskazywać na odwodnienie. *(s. 39)*"}, {"id": "p18", "type": "match", "tag": "l1", "q": "Badania laboratoryjne nawodnienia – dopasuj.", "pairs": [["morfologia krwi", "HCT – hematokryt"], ["ogólne badanie moczu", "kolor, ciężar właściwy"], ["jonogram", "poziom sodu, potasu, chloru (elektrolity)"]], "explain": "Morfologia (HCT), ogólne badanie moczu (kolor, ciężar właściwy), jonogram (sód, potas, chlor). *(s. 39)*"}, {"id": "p19", "type": "multi", "tag": "l1", "q": "Zaznacz **objawy odwodnienia**.", "options": ["uczucie pragnienia", "suche usta", "ból i zawroty głowy", "rzadko oddawany mocz", "osłabienie, omdlenia", "jasny słomkowy mocz"], "answer": [0, 1, 2, 3, 4], "explain": "Objawy: pragnienie, suche usta, ból i zawroty głowy, rzadko oddawany mocz, osłabienie, omdlenia. *(s. 39)*"}, {"id": "p20", "type": "mc", "tag": "l1", "q": "W przypadku poważnego odwodnienia konieczne są badania laboratoryjne (np. stężenia elektrolitów), a nawodnienie organizmu przez:", "options": ["kroplówkę", "tabletki z witaminą C", "ssanie lodu", "dietę bogatą w błonnik"], "answer": 0, "explain": "Poważne odwodnienie → badania laboratoryjne i nawodnienie przez **kroplówkę**. *(s. 39)*"}, {"id": "p21", "type": "mc", "tag": "l1", "q": "Białka są zbudowane z mniejszych elementów, które nazywamy:", "options": ["aminokwasami", "glukozą", "enzymami", "elektrolitami"], "answer": 0, "explain": "Białka = związki zbudowane z **aminokwasów**. Organizm bierze aminokwasy z białek pożywienia i buduje z nich własne komórki. *(s. 40)*"}, {"id": "p22", "type": "match", "tag": "l1", "q": "Dopasuj białko do roli.", "pairs": [["kolagen", "buduje ciało (np. w skórze)"], ["białka kurczliwe", "powodują skurcze mięśni – umożliwiają ruch"], ["hemoglobina", "białko we krwi – przenosi tlen"]], "explain": "Białka budują ciało (kolagen), powodują skurcze mięśni (białka kurczliwe), transportują substancje (hemoglobina – tlen). *(s. 40)*"}, {"id": "p23", "type": "match", "tag": "l1", "q": "Dopasuj składnik do hasła z podręcznika.", "pairs": [["białka", "materiał budulcowy"], ["cukry", "łatwo dostępna energia"], ["tłuszcze", "materiał zapasowy"]], "explain": "Białka – **materiał budulcowy**, cukry – **łatwo dostępna energia**, tłuszcze – **materiał zapasowy**. *(s. 40)*"}, {"id": "p24", "type": "mc", "tag": "l1", "q": "Cukry to inaczej:", "options": ["węglowodany", "aminokwasy", "elektrolity", "enzymy"], "answer": 0, "explain": "Cukry (**węglowodany**) – z nich organizm czerpie energię. *(s. 40)*"}, {"id": "p25", "type": "cat", "tag": "l1", "q": "Podziel cukry na proste i złożone.", "categories": ["cukier prosty", "cukier złożony"], "items": [{"t": "glukoza (np. w słodyczach)", "c": 0}, {"t": "skrobia (w produktach zbożowych)", "c": 1}, {"t": "glikogen (w wątrobie)", "c": 1}, {"t": "celuloza (błonnik)", "c": 1}], "explain": "Prosty: **glukoza**. Złożone: **skrobia**, **glikogen** (zapas w wątrobie), **celuloza** (błonnik). *(s. 40)*"}, {"id": "p26", "type": "mc", "tag": "l1", "q": "Dlaczego energia z cukrów złożonych (np. skrobi) uwalnia się **stopniowo**?", "options": ["bo najpierw są rozkładane na cukry proste", "bo nie są trawione", "bo zamieniają się w białka", "bo trafiają od razu do kości"], "answer": 0, "explain": "Cukry złożone są najpierw **rozkładane na cukry proste** – dzięki temu energia uwalnia się stopniowo. *(s. 40)*"}, {"id": "p27", "type": "mc", "tag": "l1", "q": "Glikogen to:", "options": ["cukier złożony magazynowany w wątrobie – zapas energii", "białko przenoszące tlen", "witamina wspierająca odporność", "enzym śliny"], "answer": 0, "explain": "**Glikogen** – cukier złożony magazynowany w **wątrobie**, zapas energii. *(s. 40)*"}, {"id": "p28", "type": "mc", "tag": "l1", "q": "Najłatwiej i najszybciej organizm pozyskuje energię z:", "options": ["cukrów prostych", "tłuszczów", "błonnika", "soli mineralnych"], "answer": 0, "explain": "Z **cukrów prostych** (np. glukozy). Tłuszcze to energia wykorzystywana **wolniej**. *(s. 40)*"}, {"id": "p29", "type": "multi", "tag": "l1", "q": "Do czego potrzebne są tłuszcze?", "options": ["stanowią zapas energii", "ułatwiają przyswajanie witamin A, D, E i K", "przenoszą tlen we krwi", "są głównym budulcem zębów"], "answer": [0, 1], "explain": "Tłuszcze: **zapas energii** i ułatwiają przyswajanie witamin **A, D, E i K**. *(s. 41)*"}, {"id": "p30", "type": "short", "tag": "l1", "q": "Wpisz litery witamin, których przyswajanie ułatwiają tłuszcze (np. X, Y, Z i W).", "accept": ["A, D, E i K", "A D E K", "ADEK", "A, D, E, K", "a d e i k"], "explain": "Witaminy **A, D, E i K**. *(s. 41)*"}, {"id": "p31", "type": "match", "tag": "l1", "q": "Dopasuj witaminę do roli.", "pairs": [["witamina C", "wspiera odporność"], ["witamina D", "zdrowe kości i zęby"], ["witamina A", "zdrowie skóry i oczu"]], "explain": "C – odporność, D – kości i zęby, A – skóra i oczy. *(s. 41)*"}, {"id": "p32", "type": "mc", "tag": "l1", "q": "Witaminy:", "options": ["wspierają procesy życiowe i trzeba je dostarczać z pożywieniem", "organizm zawsze sam wytwarza w nadmiarze", "są źródłem głównie energii", "to pierwiastki budujące kości"], "answer": 0, "explain": "Witaminy wspierają przebieg procesów życiowych – **trzeba je dostarczać z pożywieniem**. *(s. 41)*"}, {"id": "p33", "type": "multi", "tag": "l1", "q": "Sole mineralne (pierwiastki) są potrzebne do:", "options": ["budowania kości", "przenoszenia sygnałów nerwowych", "utrzymania odpowiedniego nawodnienia", "rozkładania niestrawionych resztek przez bakterie"], "answer": [0, 1, 2], "explain": "Budowanie kości, przenoszenie sygnałów nerwowych, utrzymanie nawodnienia. *(s. 41)*"}, {"id": "p34", "type": "match", "tag": "l1", "q": "Dopasuj pierwiastek do przykładowego źródła z podręcznika.", "pairs": [["wapń", "ser"], ["potas", "banan"], ["żelazo", "mięso, szpinak/sałata"]], "explain": "Wapń – ser; potas – banany; żelazo – mięso i zielone liście. *(s. 41)*"}, {"id": "p35", "type": "cat", "tag": "l1", "q": "Przyporządkuj produkt do składnika, którego jest dobrym źródłem (wg zdjęć w podręczniku).", "categories": ["białka", "cukry", "tłuszcze"], "items": [{"t": "jajko", "c": 0}, {"t": "ryba, mięso", "c": 0}, {"t": "banan, ziemniaki", "c": 1}, {"t": "makaron, płatki", "c": 1}, {"t": "olej", "c": 2}, {"t": "awokado", "c": 2}], "explain": "Białka: mięso, ryby, jajka, ser, mleko, groch. Cukry: banany, ziemniaki, produkty zbożowe, słodycze, miód. Tłuszcze: olej, masło, awokado, orzechy, pestki. *(s. 40)*"}, {"id": "p36", "type": "mc", "tag": "l1", "q": "Które produkty **roślinne** są źródłem tłuszczu (wg podręcznika)?", "options": ["olej, awokado, orzechy, pestki", "jabłko, pomarańcza", "sałata, szpinak", "ziemniaki, banany"], "answer": 0, "explain": "Rośliny – źródła tłuszczu: **olej, awokado, orzechy, pestki/ziarna**. *(s. 41)*"}, {"id": "p37", "type": "mc", "tag": "l1", "q": "Błonnik zbudowany jest głównie z:", "options": ["cukrów złożonych (np. celulozy)", "aminokwasów", "tłuszczów", "soli mineralnych"], "answer": 0, "explain": "Błonnik – **cukry złożone** (np. **celuloza**) i inne substancje, których organizm człowieka **nie trawi ani nie wchłania**. *(s. 42)*"}, {"id": "p38", "type": "tf", "tag": "l1", "q": "Błonnik – prawda czy fałsz?", "items": [{"s": "Organizm człowieka trawi i wchłania błonnik.", "a": false}, {"s": "Błonnik przechodzi przez układ pokarmowy w niezmienionym składzie.", "a": true}, {"s": "Błonnik wchłania wodę, pęcznieje i zmniejsza uczucie głodu.", "a": true}, {"s": "Błonnik spowalnia ruchy jelit.", "a": false}, {"s": "Błonnik zapobiega zaparciom.", "a": true}], "explain": "Błonnik: niestrawiony, pęcznieje, zmniejsza głód, **przyspiesza** ruchy jelit, zapobiega zaparciom, usuwa resztki – mniejsze ryzyko chorób jelit i niektórych nowotworów. *(s. 42)*"}, {"id": "p39", "type": "multi", "tag": "l1", "q": "Zaznacz źródła błonnika.", "options": ["świeże owoce i warzywa (zwłaszcza strączkowe)", "ziarna zbóż", "pieczywo pełnoziarniste, płatki owsiane", "słodzone napoje", "cukier"], "answer": [0, 1, 2], "explain": "Źródła: owoce i warzywa (zwł. strączkowe), ziarna zbóż, pieczywo pełnoziarniste, płatki owsiane. *(s. 42)*"}, {"id": "p40", "type": "cat", "tag": "l1", "q": "Talerz zdrowego żywienia: co jeść dużo, a co ograniczać?", "categories": ["jedz dużo", "ograniczaj"], "items": [{"t": "warzywa", "c": 0}, {"t": "rośliny strączkowe (np. fasola)", "c": 0}, {"t": "produkty z pełnego ziarna", "c": 0}, {"t": "sól", "c": 1}, {"t": "czerwone mięso", "c": 1}, {"t": "cukier i słodzone napoje", "c": 1}], "explain": "Jedz dużo: warzyw, strączkowych, pełnego ziarna. Ograniczaj: sól, czerwone mięso, cukier i słodzone napoje. *(s. 42)*"}, {"id": "p41", "type": "match", "tag": "l1", "q": "Zamieniaj – dopasuj zdrowszy zamiennik.", "pairs": [["jasne pieczywo", "pieczywo pełnoziarniste"], ["czerwone mięso", "ryby, drób, jaja, rośliny strączkowe"], ["słodkie napoje", "woda"]], "explain": "Zamieniaj: jasne pieczywo → pełnoziarniste; czerwone mięso → ryby, drób, jaja, strączkowe; słodkie napoje → woda. *(s. 42)*"}, {"id": "p42", "type": "mc", "tag": "l1", "q": "Co oprócz zróżnicowanej diety jest potrzebne do zachowania zdrowia?", "options": ["spora dawka ruchu", "więcej soli", "mniej wody", "tylko suplementy"], "answer": 0, "explain": "Dieta to nie wszystko – potrzebujesz też **sporej dawki ruchu**. *(s. 42)*"}, {"id": "p43", "type": "mc", "tag": "l1", "q": "Gdy ktoś je za dużo i jest mało aktywny, nadmiar energii organizm magazynuje jako:", "options": ["tkankę tłuszczową", "glikogen w kościach", "białka kurczliwe", "błonnik"], "answer": 0, "explain": "Zapasy w postaci **tkanki tłuszczowej** pod skórą i wokół narządów wewnętrznych. *(s. 43)*"}, {"id": "p44", "type": "multi", "tag": "l1", "q": "Do jakich chorób może prowadzić nadmiar tkanki tłuszczowej (wg podręcznika)?", "options": ["otyłość", "choroby serca", "cukrzyca nabyta", "próchnica wrodzona"], "answer": [0, 1, 2], "explain": "**Otyłość, choroby serca, cukrzyca nabyta**. *(s. 43)*"}, {"id": "p45", "type": "mc", "tag": "l1", "q": "Anoreksja i bulimia to zaburzenia odżywiania, które mają źródło:", "options": ["w psychice – w zaburzonym postrzeganiu własnej osoby", "w zakażeniu wirusem", "w niedoborze fluoru", "w nadmiarze błonnika"], "answer": 0, "explain": "Źródło **w psychice**. Chorzy głodzą się albo wywołują wymioty – grozi to wyniszczeniem, a nawet śmiercią. Potrzebna stała opieka **lekarza i psychoterapeuty**. *(s. 43)*"}, {"id": "p46", "type": "multi", "tag": "l1", "q": "**Sprawdź, co wiesz (1/2)** – dieta marzeń trzynastolatka: naleśniki z syropem, pizza/nuggetsy z frytkami, tosty z serem i keczupem, słodycze, chipsy, słodkie napoje. Czego w niej **brakuje lub jest za mało**?", "options": ["warzyw", "błonnika (pełne ziarno, strączkowe)", "wody", "cukru", "tłuszczu"], "answer": [0, 1, 2], "explain": "Za dużo: cukrów, tłuszczu, soli. Za mało / brak: **warzyw (i owoców)**, **błonnika**, **wody**, (pełnowartościowego białka np. z ryb, strączkowych). *(s. 44)*"}, {"id": "p47", "type": "mc", "tag": "l1", "q": "**Sprawdź, co wiesz (4)** – wyniki klasowej ankiety o pokarmach z 1 dnia przedstawiamy w postaci diagramu:", "options": ["słupkowego", "kołowego z jednym kolorem", "liniowego temperatury", "żadnego"], "answer": 0, "explain": "Podręcznik: wyniki w postaci **diagramu słupkowego**. *(s. 44)*"}, {"id": "p48", "type": "tf", "tag": "l1", "q": "Zapamiętaj – lekcja 1. Prawda czy fałsz?", "items": [{"s": "Dieta powinna być różnorodna i dostosowana do wieku, płci i stanu zdrowia.", "a": true}, {"s": "Błonnik odgrywa ważną rolę w diecie, chociaż organizm go nie trawi.", "a": true}, {"s": "Niewłaściwa dieta nie może prowadzić do chorób zagrażających życiu.", "a": false}], "explain": "Skutkiem złej diety i złych nawyków mogą być choroby, także **zagrażające życiu**. *(s. 44)*"}, {"id": "b1", "type": "mc", "tag": "l2", "q": "Układ pokarmowy składa się z:", "options": ["przewodu pokarmowego i gruczołów trawiennych", "tylko z żołądka i jelit", "serca i naczyń krwionośnych", "płuc i tchawicy"], "answer": 0, "explain": "Układ pokarmowy = **przewód pokarmowy** + **gruczoły trawienne**. *(s. 45)*"}, {"id": "b2", "type": "mc", "tag": "l2", "q": "Trawienie to:", "options": ["rozkładanie pokarmu na składniki i ich wchłanianie", "tylko żucie pokarmu", "wydalanie moczu", "oddychanie komórkowe"], "answer": 0, "explain": "**Trawienie** – rozkład pokarmu na składniki pokarmowe (mniejsze cząsteczki) i ich wchłanianie. *(s. 45)*"}, {"id": "b3", "type": "mc", "tag": "l2", "q": "Trawienie jest możliwe dzięki substancjom wytwarzanym przez gruczoły trawienne. To:", "options": ["enzymy trawienne", "hormony wzrostu", "przeciwciała", "elektrolity"], "answer": 0, "explain": "Dzięki **enzymom trawiennym** wytwarzanym przez gruczoły trawienne. *(s. 45)*"}, {"id": "b4", "type": "order", "tag": "l2", "q": "Ułóż odcinki przewodu pokarmowego w kolejności, w jakiej przechodzi przez nie pokarm.", "items": ["jama ustna", "gardło", "przełyk", "żołądek", "dwunastnica", "jelito cienkie", "jelito grube", "odbyt"], "explain": "Jama ustna → gardło → przełyk → żołądek → dwunastnica (początek jelita cienkiego) → jelito cienkie → jelito grube → odbyt. *(s. 45)*"}, {"id": "b5", "type": "mc", "tag": "l2", "q": "Gdzie **rozpoczyna się** trawienie (cukrów)?", "options": ["w jamie ustnej", "w żołądku", "w jelicie grubym", "w przełyku"], "answer": 0, "explain": "W **jamie ustnej** pokarm jest rozdrabniany przez zęby i mieszany ze śliną; zaczyna się trawienie **cukrów**. *(s. 45)*"}, {"id": "b6", "type": "mc", "tag": "l2", "q": "W żołądku pokarm jest mieszany z:", "options": ["sokiem żołądkowym", "żółcią", "śliną z enzymami trawiącymi tłuszcze", "krwią"], "answer": 0, "explain": "W żołądku – **sok żołądkowy** i dalsze trawienie. *(s. 45)*"}, {"id": "b7", "type": "mc", "tag": "l2", "q": "Dwunastnica to:", "options": ["początkowy odcinek jelita cienkiego", "końcowy odcinek jelita grubego", "część przełyku", "gruczoł trawienny"], "answer": 0, "explain": "**Dwunastnica** – początkowy odcinek jelita cienkiego. *(s. 45)*"}, {"id": "b8", "type": "multi", "tag": "l2", "q": "Co trafia do dwunastnicy i ostatecznie trawi pokarm?", "options": ["enzymy z trzustki", "żółć z wątroby", "ślina z ślinianek", "sok z jelita grubego"], "answer": [0, 1], "explain": "Do dwunastnicy docierają **enzymy z trzustki** i **żółć z wątroby**, które ostatecznie trawią pokarm. *(s. 45)*"}, {"id": "b9", "type": "mc", "tag": "l2", "q": "Gdzie zachodzi **wchłanianie** większości składników odżywczych do krwi?", "options": ["w jelicie cienkim", "w jamie ustnej", "w przełyku", "w odbycie"], "answer": 0, "explain": "W dalszej części **jelita cienkiego** – przez ścianki jelita i naczyń krwionośnych do krwi; krew rozprowadza je do komórek. *(s. 45)*"}, {"id": "b10", "type": "mc", "tag": "l2", "q": "Co dzieje się w **jelicie grubym**?", "options": ["odzyskiwana jest woda, a z niestrawionych resztek formuje się kał", "zaczyna się trawienie cukrów", "pokarm jest mieszany ze śliną", "powstaje żółć"], "answer": 0, "explain": "W jelicie grubym **odzyskiwana jest woda**, a z niestrawionych resztek **formuje się kał**. *(s. 45)*"}, {"id": "b11", "type": "short", "tag": "l2", "q": "Jak nazywamy skurcze mięśni przewodu pokarmowego przesuwające pokarm od przełyku do odbytu?", "accept": ["perystaltyka", "perystaltyką", "ruchy perystaltyczne"], "explain": "**Perystaltyka**. *(s. 45)*"}, {"id": "b12", "type": "short", "tag": "l2", "q": "Od spożycia pokarmu do wydalenia resztek mija **nawet** ile godzin? Podaj **górną** wartość z podręcznika (24–…). (przecinek lub kropka, jednostkę możesz pominąć)", "num": 27, "tol": 0, "accept": ["27", "24–27", "24-27"], "explain": "Nawet **24–27 godzin**. *(s. 45)*"}, {"id": "b13", "type": "mc", "tag": "l2", "q": "Od spożycia pokarmu do wydalenia resztek mija nawet:", "options": ["24–27 godzin", "2–3 godziny", "40 minut", "7 dni"], "answer": 0, "explain": "**24–27 godzin**; czas trawienia zależy od rodzaju pokarmu. *(s. 45)*"}, {"id": "b14", "type": "match", "tag": "l2", "q": "Czas trawienia zależy od pokarmu – dopasuj.", "pairs": [["jabłko", "ok. 40 minut"], ["stek", "ponad 16 godzin"]], "explain": "Jabłko – ok. **40 min**, stek – ponad **16 godzin**. *(s. 45)*"}, {"id": "b15", "type": "short", "tag": "l2", "q": "Ile **metrów** długości ma jelito cienkie (wg modelu: „ponad … m”)? (przecinek lub kropka, jednostkę możesz pominąć)", "num": 6, "tol": 0, "accept": ["6 m", "6", "ponad 6"], "explain": "Jelito cienkie – **ponad 6 m** – najdłuższy odcinek przewodu pokarmowego. *(s. 46)*"}, {"id": "b16", "type": "short", "tag": "l2", "q": "Ile **metrów** długości ma jelito grube (ok.)? (przecinek lub kropka, jednostkę możesz pominąć)", "num": 1.5, "tol": 0, "accept": ["1,5 m", "1,5", "1.5"], "explain": "Jelito grube – **ok. 1,5 m**. *(s. 46)*"}, {"id": "b17", "type": "mc", "tag": "l2", "q": "Najdłuższy odcinek przewodu pokarmowego to:", "options": ["jelito cienkie", "jelito grube", "przełyk", "żołądek"], "answer": 0, "explain": "**Jelito cienkie** (ponad 6 m); jelito grube ok. 1,5 m. *(s. 46)*"}, {"id": "b18", "type": "cat", "tag": "l2", "q": "Podziel narządy: przewód pokarmowy czy gruczoł trawienny?", "categories": ["przewód pokarmowy", "gruczoł trawienny"], "items": [{"t": "jama ustna", "c": 0}, {"t": "przełyk", "c": 0}, {"t": "żołądek", "c": 0}, {"t": "dwunastnica", "c": 0}, {"t": "jelito grube", "c": 0}, {"t": "ślinianki", "c": 1}, {"t": "wątroba", "c": 1}, {"t": "trzustka", "c": 1}], "explain": "Gruczoły trawienne: **ślinianki, wątroba (z pęcherzykiem żółciowym), trzustka**. Reszta to przewód pokarmowy. *(s. 46)*"}, {"id": "b19", "type": "match", "tag": "l2", "q": "Dopasuj gruczoł trawienny do funkcji.", "pairs": [["ślinianki", "ślina z enzymami trawiącymi cukry"], ["wątroba (z pęcherzykiem żółciowym)", "żółć – umożliwia trawienie tłuszczów"], ["trzustka", "enzymy trawiące białka, cukry i tłuszcze"]], "explain": "1 ślinianki – ślina (trawi cukry), 2 wątroba – żółć (tłuszcze), 3 trzustka – enzymy trawiące białka, cukry i tłuszcze. *(s. 46)*"}, {"id": "b20", "type": "mc", "tag": "l2", "q": "Który gruczoł wytwarza enzymy trawiące **białka, cukry i tłuszcze**?", "options": ["trzustka", "ślinianki", "wątroba", "żołądek"], "answer": 0, "explain": "**Trzustka**. *(s. 46)*"}, {"id": "b21", "type": "mc", "tag": "l2", "q": "Żółć:", "options": ["wytwarza wątroba; umożliwia trawienie tłuszczów", "wytwarza trzustka; trawi białka", "wytwarzają ślinianki; trawi cukry", "powstaje w jelicie grubym z wody"], "answer": 0, "explain": "Żółć – produkuje **wątroba** (z pęcherzykiem żółciowym); umożliwia trawienie **tłuszczów**. *(s. 46)*"}, {"id": "b22", "type": "multi", "tag": "l2", "q": "Które odcinki są zbudowane z **mięśni gładkich** (wg modelu)?", "options": ["przełyk", "żołądek", "ślinianki", "wątroba"], "answer": [0, 1], "explain": "Model: **przełyk** i **żołądek** – zbudowane z mięśni gładkich. *(s. 46)*"}, {"id": "b23", "type": "mc", "tag": "l2", "q": "Model perystaltyki z gumowej rurki – co odpowiada **kęsowi pokarmu**?", "options": ["kulka", "rurka", "woda/żel", "ręce ściskające rurkę"], "answer": 0, "explain": "Kulka = kęs pokarmu; ściskanie rurki = skurcze mięśni gładkich; rurka = przewód pokarmowy; woda/żel = ułatwienie przesuwania (w organizmie – ślina i śluz). *(s. 47)*"}, {"id": "b24", "type": "mc", "tag": "l2", "q": "W modelu perystaltyki wnętrze rurki zwilża się wodą lub żelem. Co pełni podobną funkcję w organizmie?", "options": ["ślina (nawilża kęs)", "żółć", "krew", "szkliwo"], "answer": 0, "explain": "Zwilżenie ułatwia przesuwanie – w organizmie kęs nawilża **ślina**, co ułatwia połknięcie i przesuwanie. *(s. 47)*"}, {"id": "b25", "type": "mc", "tag": "l2", "q": "Dlaczego warto dokładnie gryźć pokarm przed połknięciem (model perystaltyki)?", "options": ["mały, rozdrobniony kęs łatwiej przesunąć niż duży rozpychający ścianki", "żeby pokarm trafił do płuc", "żeby zatrzymać perystaltykę", "nie ma to znaczenia"], "answer": 0, "explain": "Małą kulkę łatwiej przesunąć niż taką, która mocno rozpycha ścianki – dokładnie pogryziony pokarm łatwiej połknąć i strawić. *(s. 47)*"}, {"id": "b26", "type": "short", "tag": "l2", "q": "Ile **zębów mlecznych** mają dzieci? (przecinek lub kropka, jednostkę możesz pominąć)", "num": 20, "tol": 0, "accept": ["20"], "explain": "Dzieci mają **20 zębów mlecznych**. *(s. 48)*"}, {"id": "b27", "type": "mc", "tag": "l2", "q": "Zęby mleczne wypadają zwykle między:", "options": ["ok. 6 a 12–13 rokiem życia", "1 a 3 rokiem życia", "15 a 18 rokiem życia", "nigdy nie wypadają"], "answer": 0, "explain": "Zwykle między **ok. 6 a 12–13 rokiem życia**; zastępują je mocniejsze i większe zęby stałe. *(s. 48)*"}, {"id": "b28", "type": "order", "tag": "l2", "q": "Budowa zęba: ułóż od **zewnątrz** do **środka** zęba.", "items": ["szkliwo", "zębina", "miazga"], "explain": "Szkliwo (na zewnątrz) → zębina → miazga (w środku, z naczyniami krwionośnymi i nerwami). Ząb osadzony jest w dziąśle. *(s. 48)*"}, {"id": "b29", "type": "mc", "tag": "l2", "q": "W której części zęba znajdują się naczynia krwionośne i nerwy?", "options": ["w miazdze", "w szkliwie", "w zębinie", "w dziąśle"], "answer": 0, "explain": "Naczynia krwionośne i nerwy – w **miazdze**. *(s. 48)*"}, {"id": "b30", "type": "mc", "tag": "l2", "q": "Zewnętrzna, twarda warstwa korony zęba to:", "options": ["szkliwo", "miazga", "zębina", "dziąsło"], "answer": 0, "explain": "**Szkliwo**. *(s. 48)*"}, {"id": "b31", "type": "match", "tag": "l2", "q": "Dopasuj rodzaj zęba do funkcji.", "pairs": [["siekacz", "ostra krawędź – odgryzanie kawałków pożywienia"], ["kieł", "spiczaste końce – rozrywanie pokarmu"], ["trzonowiec (i przedtrzonowiec)", "duża powierzchnia – miażdżenie i rozdrabnianie"]], "explain": "Siekacze odgryzają, kły rozrywają, przedtrzonowce i trzonowce miażdżą i rozdrabniają. *(s. 48)*"}, {"id": "b32", "type": "mc", "tag": "l2", "q": "Których zębów **nie ma** w uzębieniu mlecznym (wg rysunku)?", "options": ["przedtrzonowców", "siekaczy", "kłów", "trzonowców"], "answer": 0, "explain": "Mleczne: siekacze, kły, trzonowce. Stałe mają dodatkowo **przedtrzonowce**. *(s. 48)*"}, {"id": "b33", "type": "mc", "tag": "l2", "q": "Dlaczego siekacze mają inny kształt niż zęby trzonowe?", "options": ["bo odgryzają (ostra krawędź), a trzonowce miażdżą (duża powierzchnia)", "bo są zębami mlecznymi", "bo nie mają szkliwa", "bo trzonowce rozrywają pokarm"], "answer": 0, "explain": "Kształt zależy od funkcji: siekacz – ostra krawędź do odgryzania; trzonowiec – duża powierzchnia do miażdżenia. *(s. 48)*"}, {"id": "b34", "type": "mc", "tag": "l2", "q": "Człowiek ma zęby do odgryzania, rozrywania i miażdżenia. Co to mówi o naszej naturalnej diecie?", "options": ["jemy pokarmy roślinne i zwierzęce (niemal wszystkie rodzaje)", "jemy tylko mięso", "jemy tylko rośliny", "nie potrzebujemy gryźć"], "answer": 0, "explain": "Różne rodzaje zębów stałych pozwalają jeść **niemal wszystkie rodzaje pokarmów** (roślinne i zwierzęce). *(s. 48)*"}, {"id": "b35", "type": "multi", "tag": "l2", "q": "Zaznacz elementy jamy ustnej z rysunku.", "options": ["warga górna i dolna", "dziąsło", "podniebienie", "język", "dwunastnica"], "answer": [0, 1, 2, 3], "explain": "Jama ustna: wargi, dziąsła, podniebienie, język (i zęby). *(s. 48)*"}, {"id": "b36", "type": "mc", "tag": "l2", "q": "Próchnica polega na:", "options": ["niszczeniu twardej tkanki zęba przez bakterie", "zapaleniu wątroby", "zbyt szybkim wzroście zębów", "odkładaniu się tłuszczu"], "answer": 0, "explain": "**Próchnica** – niszczenie twardej tkanki zęba przez **bakterie**, które żywią się cukrami z resztek pokarmowych i wytwarzają **kwasy** uszkadzające szkliwo i zębinę. *(s. 49)*"}, {"id": "b37", "type": "multi", "tag": "l2", "q": "Zaznacz **przyczyny próchnicy**.", "options": ["nieprawidłowa higiena jamy ustnej", "nadmierne spożywanie słodyczy i napojów gazowanych", "niedobór fluoru", "wrodzone skłonności", "dieta bogata w witaminy"], "answer": [0, 1, 2, 3], "explain": "Przyczyny: zła higiena, nadmiar słodyczy i napojów gazowanych, **niedobór fluoru**, wrodzone skłonności. *(s. 49)*"}, {"id": "b38", "type": "short", "tag": "l2", "q": "Ile razy dziennie (przynajmniej) trzeba szczotkować zęby? (przecinek lub kropka, jednostkę możesz pominąć)", "num": 2, "tol": 0, "accept": ["2", "dwa", "2 razy"], "explain": "Przynajmniej **2 razy dziennie**, pastą z fluorem. *(s. 49)*"}, {"id": "b39", "type": "mc", "tag": "l2", "q": "Jak często (przynajmniej) odwiedzać stomatologa?", "options": ["raz na pół roku", "raz na 5 lat", "tylko gdy boli", "raz w tygodniu"], "answer": 0, "explain": "Przynajmniej **raz na pół roku**. *(s. 49)*"}, {"id": "b40", "type": "multi", "tag": "l2", "q": "Profilaktyka próchnicy – zaznacz poprawne.", "options": ["szczotkowanie min. 2 razy dziennie", "pasta z fluorem", "nitkowanie przestrzeni między zębami", "wizyty u stomatologa min. raz na pół roku", "więcej napojów gazowanych"], "answer": [0, 1, 2, 3], "explain": "Też: dieta bogata w witaminy i minerały, mniej słodyczy i napojów gazowanych. *(s. 49)*"}, {"id": "b41", "type": "multi", "tag": "l2", "q": "Zaznacz **objawy chorób dziąseł**.", "options": ["krwawienie dziąseł podczas szczotkowania", "zaczerwienienie, obrzęk lub ból", "odsłonięcie szyjek zębowych", "ruchomość zębów", "nieświeży oddech", "zażółcenie skóry"], "answer": [0, 1, 2, 3, 4], "explain": "Choroby dziąseł = stany zapalne tkanek otaczających zęby. Zażółcenie skóry to objaw **WZW**. *(s. 49)*"}, {"id": "b42", "type": "multi", "tag": "l2", "q": "Zaznacz **przyczyny chorób dziąseł**.", "options": ["nieprawidłowa higiena jamy ustnej", "płytka nazębna i kamień nazębny", "palenie tytoniu", "czynniki hormonalne (np. dojrzewanie, ciąża)", "niektóre choroby (np. cukrzyca)", "picie wody"], "answer": [0, 1, 2, 3, 4], "explain": "Przyczyny: zła higiena, płytka i kamień nazębny, palenie, hormony, niektóre choroby (cukrzyca). *(s. 49)*"}, {"id": "b43", "type": "mc", "tag": "l2", "q": "W profilaktyce chorób dziąseł podręcznik zaleca dietę bogatą w witaminę:", "options": ["C", "K", "D", "A"], "answer": 0, "explain": "Dieta bogata w **witaminę C**; też szczotkowanie i nitkowanie, płyny antyseptyczne, profesjonalne czyszczenie, unikanie palenia. *(s. 49)*"}, {"id": "b44", "type": "mc", "tag": "l2", "q": "Doświadczenie z jajkami w napojach: skorupka jajka reprezentuje:", "options": ["zęby (szkliwo)", "żołądek", "ślinę", "dziąsła"], "answer": 0, "explain": "Skorupka = **zęby**. Porównuje się skorupki po kilku godzinach/dniach w wodzie, soku pomarańczowym, coli i mleku. *(s. 50)*"}, {"id": "b45", "type": "mc", "tag": "l2", "q": "Które napoje mogą szkodzić szkliwu (pytanie z doświadczenia)?", "options": ["kwaśne napoje, np. soki owocowe i cola", "woda", "żadne", "tylko mleko"], "answer": 0, "explain": "Pytanie z podręcznika dotyczy **kwaśnych napojów (soki owocowe, cola)**; bezpieczniejsze są woda i mleko. *(Wyników doświadczenia podręcznik nie podaje.)* *(s. 50)*"}, {"id": "b46", "type": "mc", "tag": "l2", "q": "Doświadczenie z pastą z fluorem: połowę jajka smarujemy pastą z fluorem i wkładamy jajko do:", "options": ["octu", "wody", "mleka", "oleju"], "answer": 0, "explain": "Jajko w szklance z **octem**; po kilku godzinach porównujemy obie połowy skorupki. *(s. 50)*"}, {"id": "b47", "type": "tf", "tag": "l2", "q": "Zapamiętaj – lekcja 2. Prawda czy fałsz?", "items": [{"s": "Trawienie rozpoczyna się w jamie ustnej, jest kontynuowane w żołądku, a kończy się w jelicie cienkim.", "a": true}, {"s": "Jelito grube to najdłuższy odcinek przewodu pokarmowego.", "a": false}, {"s": "W jelicie cienkim zachodzi wchłanianie do krwi większości składników odżywczych.", "a": true}, {"s": "Zęby umożliwiają gryzienie i żucie, co ułatwia trawienie.", "a": true}], "explain": "Najdłuższy jest **jelito cienkie**. *(s. 51)*"}, {"id": "c1", "type": "multi", "tag": "l3", "q": "Co może zakłócić działanie układu pokarmowego (przyczyny chorób)?", "options": ["nieprawidłowe nawyki żywieniowe", "stres", "nadmiar używek (np. palenie papierosów)", "brak higieny", "zakażenie wirusami, bakteriami, pasożytami", "picie wody z bezpiecznych źródeł"], "answer": [0, 1, 2, 3, 4], "explain": "Przyczyny: złe nawyki żywieniowe, stres, używki, brak higieny, zakażenia wirusami, bakteriami lub pasożytami. *(s. 52)*"}, {"id": "c2", "type": "mc", "tag": "l3", "q": "Zatrucia pokarmowe mogą powodować produkty zakażone bakteriami, np.:", "options": ["salmonellą", "bifidobakteriami", "bakteriami kwasu mlekowego", "enterokokami w jelitach"], "answer": 0, "explain": "Np. **salmonella**; także szkodliwe substancje w pożywieniu (środki ochrony roślin, metale ciężkie). *(s. 52)*"}, {"id": "c3", "type": "multi", "tag": "l3", "q": "Jakie **szkodliwe substancje** w pożywieniu mogą powodować zatrucia (przykłady z podręcznika)?", "options": ["środki ochrony roślin", "metale ciężkie", "błonnik", "witamina C"], "answer": [0, 1], "explain": "**Środki ochrony roślin** i **metale ciężkie**. *(s. 52)*"}, {"id": "c4", "type": "multi", "tag": "l3", "q": "Do **najgroźniejszych** chorób układu pokarmowego podręcznik zalicza:", "options": ["wirusowe zapalenia wątroby (WZW)", "raka jelita grubego", "chorobę wrzodową żołądka", "próchnicę mlecznych zębów"], "answer": [0, 1, 2], "explain": "WZW, rak jelita grubego, choroba wrzodowa żołądka. *(s. 52)*"}, {"id": "c5", "type": "match", "tag": "l3", "q": "Dopasuj chorobę do objawów.", "pairs": [["WZW", "biegunka, wymioty, zażółcenie skóry"], ["choroba wrzodowa żołądka", "ostry ból brzucha"], ["rak jelita grubego", "długo bez wyraźnych objawów"]], "explain": "WZW – biegunka, wymioty, zażółcenie skóry; wrzody – ostry ból brzucha; rak jelita grubego – rozwija się powoli, długo bez wyraźnych objawów. *(s. 52)*"}, {"id": "c6", "type": "mc", "tag": "l3", "q": "Dlaczego regularne badania są ważne przy raku jelita grubego?", "options": ["rozwija się powoli i długo nie daje wyraźnych objawów – badania pozwalają go wcześnie wykryć", "bo zaraża się przez krew", "bo jest na niego szczepionka", "bo dotyczy tylko dzieci"], "answer": 0, "explain": "Wczesne wykrycie możliwe dzięki **regularnym badaniom**, zwłaszcza osób dorosłych i starszych. *(s. 52)*"}, {"id": "c7", "type": "multi", "tag": "l3", "q": "Jak zapobiegać rakowi jelita grubego?", "options": ["dieta bogata w błonnik", "unikanie nadmiernej ilości czerwonego mięsa i tłuszczów", "regularne badania kontrolne (zwłaszcza u starszych)", "jedzenie dużej ilości słodyczy"], "answer": [0, 1, 2], "explain": "Błonnik, mniej czerwonego mięsa i tłuszczów, regularne badania kontrolne. *(s. 52)*"}, {"id": "c8", "type": "mc", "tag": "l3", "q": "WZW to skrót od:", "options": ["wirusowe zapalenie wątroby", "wrzodowe zapalenie żołądka", "wirusowe zatrucie wody", "wrodzone zapalenie zębów"], "answer": 0, "explain": "**WZW – wirusowe zapalenie wątroby** (typy A, B, C). *(s. 53)*"}, {"id": "c9", "type": "cat", "tag": "l3", "q": "Jak przenosi się wirus? Przyporządkuj.", "categories": ["WZW A", "WZW B", "WZW C"], "items": [{"t": "spożycie zakażonego jedzenia lub wody", "c": 0}, {"t": "niemycie rąk po toalecie i przygotowywanie posiłków", "c": 0}, {"t": "kontakt z płynami ustrojowymi chorego: krew, ślina, inne wydzieliny", "c": 1}, {"t": "zabiegi medyczne lub kosmetyczne (np. przekłucie uszu) niesterylnym sprzętem", "c": 1}, {"t": "kontakt z płynami ustrojowymi chorego; brak szczepionki", "c": 2}], "explain": "WZW A – jedzenie/woda, brudne ręce („choroba brudnych rąk”). WZW B i C – płyny ustrojowe, krew (np. niesterylne igły). Na WZW C **nie ma szczepionki**. *(s. 53)*"}, {"id": "c10", "type": "mc", "tag": "l3", "q": "Na które WZW **nie ma** szczepionki?", "options": ["typu C", "typu A", "typu B", "jest na wszystkie"], "answer": 0, "explain": "Uwaga z podręcznika: **nie ma szczepionki na zapalenie wątroby typu C**. *(s. 53)*"}, {"id": "c11", "type": "mc", "tag": "l3", "q": "Które WZW nazywane jest „chorobą brudnych rąk”?", "options": ["typu A", "typu B", "typu C", "żadne"], "answer": 0, "explain": "**WZW A** – przenosi się przez zakażone jedzenie lub wodę i brudne ręce. *(s. 56)*"}, {"id": "c12", "type": "multi", "tag": "l3", "q": "Jak zapobiegać **WZW A**?", "options": ["myć ręce przed jedzeniem i po skorzystaniu z toalety", "pić wodę tylko z bezpiecznych źródeł", "zaszczepić się", "nie dotykać zużytych igieł"], "answer": [0, 1, 2], "explain": "WZW A: mycie rąk, bezpieczna woda, szczepienie. *(s. 53)*"}, {"id": "c13", "type": "multi", "tag": "l3", "q": "Jak zapobiegać **WZW B**?", "options": ["zaszczepić się", "używać sterylnych igieł do zabiegów medycznych i kosmetycznych (np. przekłucie uszu)", "nie dotykać zużytych igieł ani strzykawek bez opakowania", "jeść więcej czerwonego mięsa"], "answer": [0, 1, 2], "explain": "WZW B: szczepienie, sterylne igły, nie dotykać zużytych igieł i strzykawek. *(s. 53)*"}, {"id": "c14", "type": "mc", "tag": "l3", "q": "Do czego może prowadzić **WZW C**, jeśli nie zostanie wcześnie wykryte i leczone?", "options": ["do trwałego uszkodzenia wątroby", "do próchnicy", "do złamań kości", "do niczego"], "answer": 0, "explain": "WZW C może prowadzić do **trwałego uszkodzenia wątroby**. *(s. 53)*"}, {"id": "c15", "type": "tf", "tag": "l3", "q": "WZW – prawda czy fałsz?", "items": [{"s": "Objawy WZW A i WZW B to biegunka, wymioty i zażółcenie skóry.", "a": true}, {"s": "WZW B przenosi się głównie przez brudne owoce.", "a": false}, {"s": "Przeciw WZW C chronią sterylne igły i niedotykanie igieł bez opakowania.", "a": true}, {"s": "Na WZW A i B można się zaszczepić.", "a": true}], "explain": "WZW B – przez płyny ustrojowe (krew, ślina). Szczepienie: A i B; na C nie ma szczepionki. *(s. 53)*"}, {"id": "c16", "type": "mc", "tag": "l3", "q": "Flora jelitowa to:", "options": ["zestaw różnych bakterii żyjących w jelitach", "rośliny w diecie", "enzymy trzustki", "pasożyty w jelitach"], "answer": 0, "explain": "**Flora jelitowa** – zestaw różnych bakterii żyjących w jelitach; większość jest przyjazna. *(s. 54)*"}, {"id": "c17", "type": "mc", "tag": "l3", "q": "Ile bakterii żyje w twoich jelitach (wg podręcznika)?", "options": ["mniej więcej tyle, ile masz wszystkich komórek w ciele", "kilka", "tylko kilkaset", "żadne u zdrowego człowieka"], "answer": 0, "explain": "Mniej więcej **tyle samo bakterii, ile masz wszystkich komórek w ciele**. *(s. 54)*"}, {"id": "c18", "type": "match", "tag": "l3", "q": "Dopasuj grupę bakterii jelitowych do roli.", "pairs": [["bifidobakterie", "pomagają trawić błonnik, wspierają zdrowie jelit"], ["bakterie kwasu mlekowego", "kwas mlekowy – rozkład cukru, ochrona przed chorobotwórczymi"], ["pałeczka okrężnicy", "wspomaga produkcję witaminy K"], ["enterokoki", "wspierają trawienie, równowaga flory"], ["bakterie beztlenowe (np. Clostridium)", "rozkład niestrawionych resztek"]], "explain": "Pięć najważniejszych grup bakterii jelitowych z s. 54. *(s. 54)*"}, {"id": "c19", "type": "mc", "tag": "l3", "q": "Pałeczka okrężnicy jest pożyteczna:", "options": ["tylko w jelitach – w innych miejscach powoduje choroby", "wszędzie w organizmie", "tylko w żołądku", "nigdy"], "answer": 0, "explain": "Uwaga: pałeczka okrężnicy pożyteczna **tylko w jelitach**; w innych miejscach powoduje choroby. *(s. 54)*"}, {"id": "c20", "type": "match", "tag": "l3", "q": "Funkcje flory jelitowej – dopasuj.", "pairs": [["trawienie", "rozkład pokarmów, których organizm sam nie strawi (błonnik, niektóre węglowodany)"], ["produkcja witamin", "witamina K i niektóre z grupy B"], ["ochrona przed patogenami", "walka ze szkodliwymi drobnoustrojami"], ["wsparcie odporności", "rozpoznawanie i zwalczanie szkodliwych bakterii i wirusów"]], "explain": "4 funkcje flory jelitowej (s. 55). *(s. 55)*"}, {"id": "c21", "type": "multi", "tag": "l3", "q": "Które witaminy wytwarzają niektóre bakterie jelitowe?", "options": ["witamina K", "niektóre witaminy z grupy B", "witamina C", "witamina A"], "answer": [0, 1], "explain": "**Witamina K** i **niektóre z grupy B**. *(s. 55)*"}, {"id": "c22", "type": "multi", "tag": "l3", "q": "Skutki zaburzenia flory jelitowej (np. przez złe odżywianie lub antybiotyki):", "options": ["zaparcia", "biegunki", "otyłość", "choroby zapalne jelit", "osłabiona odporność i większa podatność na infekcje", "lepsze trawienie błonnika"], "answer": [0, 1, 2, 3, 4], "explain": "Jedna grupa bakterii rozmnaża się nadmiernie, innej brakuje → zaparcia, biegunki, otyłość, choroby zapalne jelit, słabsza odporność. *(s. 55)*"}, {"id": "c23", "type": "mc", "tag": "l3", "q": "Antybiotyki to leki, które:", "options": ["zwalczają bakterie – i chorobotwórcze, i pożyteczne bakterie jelitowe", "zwalczają wirusy WZW", "są probiotykami", "odżywiają florę jelitową"], "answer": 0, "explain": "Antybiotyki zwalczają bakterie – niestety atakują też **pożyteczne bakterie jelitowe**. Dlatego warto wtedy stosować dietę wspierającą florę. *(s. 55)*"}, {"id": "c24", "type": "cat", "tag": "l3", "q": "Probiotyki czy prebiotyki? Przyporządkuj produkty.", "categories": ["probiotyki", "prebiotyki"], "items": [{"t": "jogurt", "c": 0}, {"t": "kefir", "c": 0}, {"t": "kiszonki", "c": 0}, {"t": "cebula", "c": 1}, {"t": "czosnek", "c": 1}, {"t": "banany", "c": 1}], "explain": "**Probiotyki** – bakterie odbudowujące florę (jogurt, kefir, kiszonki). **Prebiotyki** – odżywiają dobre bakterie i wspomagają ich wzrost (cebula, czosnek, banany). *(s. 55)*"}, {"id": "c25", "type": "mc", "tag": "l3", "q": "Probiotyki to:", "options": ["bakterie, które pomagają odbudować florę bakteryjną w jelitach", "substancje odżywiające dobre bakterie, np. w cebuli", "leki zwalczające bakterie", "enzymy trzustki"], "answer": 0, "explain": "Probiotyki = **bakterie** odbudowujące florę (jogurt, kefir, kiszonki). *(s. 55)*"}, {"id": "c26", "type": "mc", "tag": "l3", "q": "Prebiotyki to:", "options": ["substancje odżywiające dobre bakterie i wspomagające ich wzrost (np. w cebuli, czosnku, bananach)", "bakterie z jogurtu", "antybiotyki", "sole mineralne"], "answer": 0, "explain": "Prebiotyki **odżywiają** dobre bakterie – cebula, czosnek, banany. *(s. 55)*"}, {"id": "c27", "type": "tf", "tag": "l3", "q": "Zapamiętaj – lekcja 3. Prawda czy fałsz?", "items": [{"s": "Aby uniknąć zakażenia chorobami układu pokarmowego, spożywaj czyste jedzenie i myj ręce przed posiłkiem.", "a": true}, {"s": "Dbanie o florę jelitową nie ma wpływu na działanie układu pokarmowego.", "a": false}, {"s": "Bakterie są też przyczyną próchnicy zębów.", "a": true}], "explain": "Właściwe odżywianie i dbanie o florę jelitową są niezbędne, by układ pokarmowy działał prawidłowo przez długi czas. *(s. 56)*"}, {"id": "c28", "type": "mc", "tag": "l3", "q": "**Sprawdź, co wiesz (3)**: lekarz przepisał chłopcu antybiotyk na anginę. Dlaczego powinien jeść jogurty i kiszonki?", "options": ["bo antybiotyk niszczy też pożyteczne bakterie jelitowe, a probiotyki pomagają odbudować florę", "bo jogurt leczy anginę zamiast antybiotyku", "bo kiszonki zawierają antybiotyk", "bo to prebiotyki z cebuli"], "answer": 0, "explain": "Antybiotyk atakuje też dobre bakterie → **probiotyki** (jogurt, kefir, kiszonki) pomagają odbudować florę jelitową. *(s. 56)*"}, {"id": "c29", "type": "mc", "tag": "l3", "q": "**Sprawdź, co wiesz (2)**: dlaczego dieta bogata w warzywa i produkty pełnoziarniste (błonnik) zmniejsza ryzyko raka jelita grubego?", "options": ["błonnik przyspiesza ruchy jelit i usuwa resztki pokarmów z jelit", "błonnik zabija wirusy WZW", "błonnik jest trawiony w żołądku", "błonnik zawiera dużo tłuszczu"], "answer": 0, "explain": "Błonnik przyspiesza ruchy jelit i **usuwa z jelit resztki pokarmów** – zmniejsza ryzyko chorób jelit i niektórych nowotworów (s. 42); dieta bogata w błonnik to profilaktyka raka jelita grubego (s. 52). *(s. 56)*"}, {"id": "c30", "type": "mc", "tag": "l3", "q": "Przypomnij sobie: jaki pasożyt może żyć w jelitach człowieka (z poprzednich lekcji)?", "options": ["owsik lub tasiemiec", "salmonella", "pałeczka okrężnicy", "bifidobakteria"], "answer": 0, "explain": "Podręcznik przypomina **owsicę** i **tasiemczycę** (pasożyty jelitowe: owsik, tasiemiec). *(s. 52)*"}], "explainPrompts": [], "mocks": [{"id": "sprawdzian-pokarmowy-a", "title": "Sprawdzian – Układ pokarmowy (grupa A)", "minutes": 45, "gradeScale": [[0, "niedostateczny"], [31, "dopuszczający"], [51, "dostateczny"], [71, "dobry"], [88, "bardzo dobry"], [97, "celujący"]], "intro": "Cały dział (s. 38–56), jak w szkole. Liczby: przecinek lub kropka, jednostkę możesz pominąć. Na końcu 2 zadania otwarte – sprawdzisz je ze wzorem.", "tasks": [{"id": "a1", "type": "multi", "tag": "l1", "q": "**Zad. 1.** Zaznacz **wszystkie** najważniejsze (podstawowe) składniki pokarmowe wymienione w podręczniku.", "options": ["białka", "cukry", "tłuszcze", "witaminy", "sole mineralne", "woda", "błonnik", "enzymy"], "answer": [0, 1, 2, 3, 4, 5], "explain": "Podstawowe: **białka, cukry, tłuszcze, witaminy, sole mineralne i woda**. Błonnik jest ważny w diecie, ale organizm go **nie trawi**. *(s. 38)*"}, {"id": "a2", "type": "match", "tag": "l1", "q": "**Zad. 2.** Dopasuj narząd/tkankę do zawartości wody.", "pairs": [["mózg", "75% wody"], ["krew", "83% wody"], ["kości", "22% wody"]], "explain": "Mózg **75%**, krew **83%**, kości **22%**, mięśnie **75%**. *(s. 38)*"}, {"id": "a3", "type": "short", "tag": "l1", "q": "**Zad. 3.** Ile **litrów** wody organizm może zużyć na dobę (wg podręcznika „nawet …”)? (przecinek lub kropka, jednostkę możesz pominąć)", "num": 2.5, "tol": 0, "accept": ["2,5 l", "2,5", "2.5"], "explain": "Organizm zużywa **nawet 2,5 l wody na dobę** – przy wydalaniu, oddychaniu, wypróżnianiu, poceniu się. *(s. 39)*"}, {"id": "a4", "type": "short", "tag": "l1", "q": "**Zad. 4.** Ile litrów wody na **1 kg** masy ciała na dobę należy pić? (przecinek lub kropka, jednostkę możesz pominąć)", "num": 0.03, "tol": 0, "accept": ["0,03 l", "0,03", "0.03"], "explain": "**0,03 l wody na kilogram masy ciała na dobę**. *(s. 39)*"}, {"id": "a5", "type": "short", "tag": "l1", "q": "**Zad. 5.** Oblicz: ile litrów wody na dobę powinna wypić osoba ważąca **50 kg** (0,03 l na kg)? (przecinek lub kropka, jednostkę możesz pominąć)", "num": 1.5, "tol": 0.01, "accept": ["1,5 l", "1,5", "1.5"], "explain": "50 · 0,03 l = **1,5 l** na dobę. *(s. 39)*"}, {"id": "a6", "type": "cat", "tag": "l1", "q": "**Zad. 6.** Podziel cukry na proste i złożone.", "categories": ["cukier prosty", "cukier złożony"], "items": [{"t": "glukoza (np. w słodyczach)", "c": 0}, {"t": "skrobia (w produktach zbożowych)", "c": 1}, {"t": "glikogen (w wątrobie)", "c": 1}, {"t": "celuloza (błonnik)", "c": 1}], "explain": "Prosty: **glukoza**. Złożone: **skrobia**, **glikogen** (zapas w wątrobie), **celuloza** (błonnik). *(s. 40)*"}, {"id": "a7", "type": "multi", "tag": "l1", "q": "**Zad. 7.** Do czego potrzebne są tłuszcze?", "options": ["stanowią zapas energii", "ułatwiają przyswajanie witamin A, D, E i K", "przenoszą tlen we krwi", "są głównym budulcem zębów"], "answer": [0, 1], "explain": "Tłuszcze: **zapas energii** i ułatwiają przyswajanie witamin **A, D, E i K**. *(s. 41)*"}, {"id": "a8", "type": "match", "tag": "l1", "q": "**Zad. 8.** Dopasuj witaminę do roli.", "pairs": [["witamina C", "wspiera odporność"], ["witamina D", "zdrowe kości i zęby"], ["witamina A", "zdrowie skóry i oczu"]], "explain": "C – odporność, D – kości i zęby, A – skóra i oczy. *(s. 41)*"}, {"id": "a9", "type": "tf", "tag": "l1", "q": "**Zad. 9.** Błonnik – prawda czy fałsz?", "items": [{"s": "Organizm człowieka trawi i wchłania błonnik.", "a": false}, {"s": "Błonnik przechodzi przez układ pokarmowy w niezmienionym składzie.", "a": true}, {"s": "Błonnik wchłania wodę, pęcznieje i zmniejsza uczucie głodu.", "a": true}, {"s": "Błonnik spowalnia ruchy jelit.", "a": false}, {"s": "Błonnik zapobiega zaparciom.", "a": true}], "explain": "Błonnik: niestrawiony, pęcznieje, zmniejsza głód, **przyspiesza** ruchy jelit, zapobiega zaparciom, usuwa resztki – mniejsze ryzyko chorób jelit i niektórych nowotworów. *(s. 42)*"}, {"id": "a10", "type": "cat", "tag": "l1", "q": "**Zad. 10.** Talerz zdrowego żywienia: co jeść dużo, a co ograniczać?", "categories": ["jedz dużo", "ograniczaj"], "items": [{"t": "warzywa", "c": 0}, {"t": "rośliny strączkowe (np. fasola)", "c": 0}, {"t": "produkty z pełnego ziarna", "c": 0}, {"t": "sól", "c": 1}, {"t": "czerwone mięso", "c": 1}, {"t": "cukier i słodzone napoje", "c": 1}], "explain": "Jedz dużo: warzyw, strączkowych, pełnego ziarna. Ograniczaj: sól, czerwone mięso, cukier i słodzone napoje. *(s. 42)*"}, {"id": "a11", "type": "order", "tag": "l2", "q": "**Zad. 11.** Ułóż odcinki przewodu pokarmowego w kolejności, w jakiej przechodzi przez nie pokarm.", "items": ["jama ustna", "gardło", "przełyk", "żołądek", "dwunastnica", "jelito cienkie", "jelito grube", "odbyt"], "explain": "Jama ustna → gardło → przełyk → żołądek → dwunastnica (początek jelita cienkiego) → jelito cienkie → jelito grube → odbyt. *(s. 45)*"}, {"id": "a12", "type": "mc", "tag": "l2", "q": "**Zad. 12.** Gdzie zachodzi **wchłanianie** większości składników odżywczych do krwi?", "options": ["w jelicie cienkim", "w jamie ustnej", "w przełyku", "w odbycie"], "answer": 0, "explain": "W dalszej części **jelita cienkiego** – przez ścianki jelita i naczyń krwionośnych do krwi; krew rozprowadza je do komórek. *(s. 45)*"}, {"id": "a13", "type": "short", "tag": "l2", "q": "**Zad. 13.** Od spożycia pokarmu do wydalenia resztek mija **nawet** ile godzin? Podaj **górną** wartość z podręcznika (24–…). (przecinek lub kropka, jednostkę możesz pominąć)", "num": 27, "tol": 0, "accept": ["27", "24–27", "24-27"], "explain": "Nawet **24–27 godzin**. *(s. 45)*"}, {"id": "a14", "type": "short", "tag": "l2", "q": "**Zad. 14.** Ile **metrów** długości ma jelito cienkie (wg modelu: „ponad … m”)? (przecinek lub kropka, jednostkę możesz pominąć)", "num": 6, "tol": 0, "accept": ["6 m", "6", "ponad 6"], "explain": "Jelito cienkie – **ponad 6 m** – najdłuższy odcinek przewodu pokarmowego. *(s. 46)*"}, {"id": "a15", "type": "cat", "tag": "l2", "q": "**Zad. 15.** Podziel narządy: przewód pokarmowy czy gruczoł trawienny?", "categories": ["przewód pokarmowy", "gruczoł trawienny"], "items": [{"t": "jama ustna", "c": 0}, {"t": "przełyk", "c": 0}, {"t": "żołądek", "c": 0}, {"t": "dwunastnica", "c": 0}, {"t": "jelito grube", "c": 0}, {"t": "ślinianki", "c": 1}, {"t": "wątroba", "c": 1}, {"t": "trzustka", "c": 1}], "explain": "Gruczoły trawienne: **ślinianki, wątroba (z pęcherzykiem żółciowym), trzustka**. Reszta to przewód pokarmowy. *(s. 46)*"}, {"id": "a16", "type": "match", "tag": "l2", "q": "**Zad. 16.** Dopasuj gruczoł trawienny do funkcji.", "pairs": [["ślinianki", "ślina z enzymami trawiącymi cukry"], ["wątroba (z pęcherzykiem żółciowym)", "żółć – umożliwia trawienie tłuszczów"], ["trzustka", "enzymy trawiące białka, cukry i tłuszcze"]], "explain": "1 ślinianki – ślina (trawi cukry), 2 wątroba – żółć (tłuszcze), 3 trzustka – enzymy trawiące białka, cukry i tłuszcze. *(s. 46)*"}, {"id": "a17", "type": "short", "tag": "l2", "q": "**Zad. 17.** Ile **zębów mlecznych** mają dzieci? (przecinek lub kropka, jednostkę możesz pominąć)", "num": 20, "tol": 0, "accept": ["20"], "explain": "Dzieci mają **20 zębów mlecznych**. *(s. 48)*"}, {"id": "a18", "type": "order", "tag": "l2", "q": "**Zad. 18.** Budowa zęba: ułóż od **zewnątrz** do **środka** zęba.", "items": ["szkliwo", "zębina", "miazga"], "explain": "Szkliwo (na zewnątrz) → zębina → miazga (w środku, z naczyniami krwionośnymi i nerwami). Ząb osadzony jest w dziąśle. *(s. 48)*"}, {"id": "a19", "type": "match", "tag": "l2", "q": "**Zad. 19.** Dopasuj rodzaj zęba do funkcji.", "pairs": [["siekacz", "ostra krawędź – odgryzanie kawałków pożywienia"], ["kieł", "spiczaste końce – rozrywanie pokarmu"], ["trzonowiec (i przedtrzonowiec)", "duża powierzchnia – miażdżenie i rozdrabnianie"]], "explain": "Siekacze odgryzają, kły rozrywają, przedtrzonowce i trzonowce miażdżą i rozdrabniają. *(s. 48)*"}, {"id": "a20", "type": "multi", "tag": "l2", "q": "**Zad. 20.** Zaznacz **przyczyny próchnicy**.", "options": ["nieprawidłowa higiena jamy ustnej", "nadmierne spożywanie słodyczy i napojów gazowanych", "niedobór fluoru", "wrodzone skłonności", "dieta bogata w witaminy"], "answer": [0, 1, 2, 3], "explain": "Przyczyny: zła higiena, nadmiar słodyczy i napojów gazowanych, **niedobór fluoru**, wrodzone skłonności. *(s. 49)*"}, {"id": "a21", "type": "cat", "tag": "l3", "q": "**Zad. 21.** Jak przenosi się wirus? Przyporządkuj.", "categories": ["WZW A", "WZW B", "WZW C"], "items": [{"t": "spożycie zakażonego jedzenia lub wody", "c": 0}, {"t": "niemycie rąk po toalecie i przygotowywanie posiłków", "c": 0}, {"t": "kontakt z płynami ustrojowymi chorego: krew, ślina, inne wydzieliny", "c": 1}, {"t": "zabiegi medyczne lub kosmetyczne (np. przekłucie uszu) niesterylnym sprzętem", "c": 1}, {"t": "kontakt z płynami ustrojowymi chorego; brak szczepionki", "c": 2}], "explain": "WZW A – jedzenie/woda, brudne ręce („choroba brudnych rąk”). WZW B i C – płyny ustrojowe, krew (np. niesterylne igły). Na WZW C **nie ma szczepionki**. *(s. 53)*"}, {"id": "a22", "type": "mc", "tag": "l3", "q": "**Zad. 22.** Na które WZW **nie ma** szczepionki?", "options": ["typu C", "typu A", "typu B", "jest na wszystkie"], "answer": 0, "explain": "Uwaga z podręcznika: **nie ma szczepionki na zapalenie wątroby typu C**. *(s. 53)*"}, {"id": "a23", "type": "match", "tag": "l3", "q": "**Zad. 23.** Dopasuj grupę bakterii jelitowych do roli.", "pairs": [["bifidobakterie", "pomagają trawić błonnik, wspierają zdrowie jelit"], ["bakterie kwasu mlekowego", "kwas mlekowy – rozkład cukru, ochrona przed chorobotwórczymi"], ["pałeczka okrężnicy", "wspomaga produkcję witaminy K"], ["enterokoki", "wspierają trawienie, równowaga flory"], ["bakterie beztlenowe (np. Clostridium)", "rozkład niestrawionych resztek"]], "explain": "Pięć najważniejszych grup bakterii jelitowych z s. 54. *(s. 54)*"}, {"id": "a24", "type": "cat", "tag": "l3", "q": "**Zad. 24.** Probiotyki czy prebiotyki? Przyporządkuj produkty.", "categories": ["probiotyki", "prebiotyki"], "items": [{"t": "jogurt", "c": 0}, {"t": "kefir", "c": 0}, {"t": "kiszonki", "c": 0}, {"t": "cebula", "c": 1}, {"t": "czosnek", "c": 1}, {"t": "banany", "c": 1}], "explain": "**Probiotyki** – bakterie odbudowujące florę (jogurt, kefir, kiszonki). **Prebiotyki** – odżywiają dobre bakterie i wspomagają ich wzrost (cebula, czosnek, banany). *(s. 55)*"}, {"id": "a25", "type": "multi", "tag": "l3", "q": "**Zad. 25.** Skutki zaburzenia flory jelitowej (np. przez złe odżywianie lub antybiotyki):", "options": ["zaparcia", "biegunki", "otyłość", "choroby zapalne jelit", "osłabiona odporność i większa podatność na infekcje", "lepsze trawienie błonnika"], "answer": [0, 1, 2, 3, 4], "explain": "Jedna grupa bakterii rozmnaża się nadmiernie, innej brakuje → zaparcia, biegunki, otyłość, choroby zapalne jelit, słabsza odporność. *(s. 55)*"}, {"id": "ao1", "type": "open", "tag": "l2", "q": "**Zad. 26.** Opisz drogę pokarmu od jamy ustnej do odbytu: co dzieje się w jamie ustnej, w żołądku, w jelicie cienkim i w jelicie grubym?", "keyPoints": ["jama ustna: rozdrabnianie zębami, ślina, początek trawienia cukrów", "żołądek: sok żołądkowy, dalsze trawienie", "jelito cienkie: koniec trawienia (enzymy trzustki, żółć) i wchłanianie do krwi", "jelito grube: odzyskiwanie wody, formowanie kału"], "kw": [["zeb|slin|rozdrabn|cukr"], ["zoladk"], ["wchlan|krw|trzustk|zolc"], ["odzysk", "kal", "wod+grub"]], "model": "W jamie ustnej pokarm jest rozdrabniany przez zęby i mieszany ze śliną – zaczyna się trawienie cukrów. Przez gardło i przełyk trafia do żołądka, gdzie miesza się z sokiem żołądkowym. W dwunastnicy enzymy trzustki i żółć z wątroby kończą trawienie, a w jelicie cienkim składniki są wchłaniane do krwi. W jelicie grubym odzyskiwana jest woda i formuje się kał, wydalany przez odbyt.", "points": 4, "explain": "Sprawdź, co wiesz – lekcja 2, zad. 1 (s. 45, 51)."}, {"id": "ao2", "type": "open", "tag": "l3", "q": "**Zad. 27.** Podaj po jednej zasadzie profilaktyki dla WZW A oraz dla WZW B i C.", "keyPoints": ["WZW A: mycie rąk / bezpieczna woda / szczepienie", "WZW B i C: sterylne igły / nie dotykać zużytych igieł i strzykawek"], "kw": [["myc", "myj", "rece", "bezpieczn+wod", "szczepi"], ["steryln|igl|igie|strzykaw"]], "model": "WZW A: myć ręce przed jedzeniem i po skorzystaniu z toalety. WZW B i C: używać sterylnych igieł i nie dotykać zużytych igieł ani strzykawek bez opakowania (na WZW B można się też zaszczepić).", "points": 2, "explain": "Sprawdź, co wiesz – lekcja 3, zad. 1 (s. 53, 56)."}]}, {"id": "sprawdzian-pokarmowy-b", "title": "Sprawdzian – Układ pokarmowy (grupa B)", "minutes": 45, "gradeScale": [[0, "niedostateczny"], [31, "dopuszczający"], [51, "dostateczny"], [71, "dobry"], [88, "bardzo dobry"], [97, "celujący"]], "intro": "Cały dział (s. 38–56) – inne zadania niż w grupie A.", "tasks": [{"id": "bb1", "type": "multi", "tag": "l1", "q": "**Zad. 1.** Zaznacz funkcje wody w organizmie.", "options": ["transport składników odżywczych i tlenu do komórek", "nawilżanie wdychanego powietrza", "oczyszczanie organizmu z toksyn", "regulacja temperatury ciała", "ułatwianie wchłaniania substancji odżywczych", "produkcja witaminy K"], "answer": [0, 1, 2, 3, 4], "explain": "Woda: transportuje składniki odżywcze i tlen, nawilża wdychane powietrze, oczyszcza z toksyn, reguluje temperaturę, ułatwia wchłanianie. Witaminę K wytwarzają **bakterie jelitowe**. *(s. 38)*"}, {"id": "bb2", "type": "multi", "tag": "l1", "q": "**Zad. 2.** Zaznacz **objawy odwodnienia**.", "options": ["uczucie pragnienia", "suche usta", "ból i zawroty głowy", "rzadko oddawany mocz", "osłabienie, omdlenia", "jasny słomkowy mocz"], "answer": [0, 1, 2, 3, 4], "explain": "Objawy: pragnienie, suche usta, ból i zawroty głowy, rzadko oddawany mocz, osłabienie, omdlenia. *(s. 39)*"}, {"id": "bb3", "type": "short", "tag": "l1", "q": "**Zad. 3.** Oblicz: ile litrów wody na dobę powinna wypić osoba ważąca **60 kg**? (przecinek lub kropka, jednostkę możesz pominąć)", "num": 1.8, "tol": 0.01, "accept": ["1,8 l", "1,8", "1.8"], "explain": "60 · 0,03 l = **1,8 l** na dobę. *(s. 39)*"}, {"id": "bb4", "type": "match", "tag": "l1", "q": "**Zad. 4.** Dopasuj białko do roli.", "pairs": [["kolagen", "buduje ciało (np. w skórze)"], ["białka kurczliwe", "powodują skurcze mięśni – umożliwiają ruch"], ["hemoglobina", "białko we krwi – przenosi tlen"]], "explain": "Białka budują ciało (kolagen), powodują skurcze mięśni (białka kurczliwe), transportują substancje (hemoglobina – tlen). *(s. 40)*"}, {"id": "bb5", "type": "match", "tag": "l1", "q": "**Zad. 5.** Dopasuj składnik do hasła z podręcznika.", "pairs": [["białka", "materiał budulcowy"], ["cukry", "łatwo dostępna energia"], ["tłuszcze", "materiał zapasowy"]], "explain": "Białka – **materiał budulcowy**, cukry – **łatwo dostępna energia**, tłuszcze – **materiał zapasowy**. *(s. 40)*"}, {"id": "bb6", "type": "mc", "tag": "l1", "q": "**Zad. 6.** Białka są zbudowane z mniejszych elementów, które nazywamy:", "options": ["aminokwasami", "glukozą", "enzymami", "elektrolitami"], "answer": 0, "explain": "Białka = związki zbudowane z **aminokwasów**. Organizm bierze aminokwasy z białek pożywienia i buduje z nich własne komórki. *(s. 40)*"}, {"id": "bb7", "type": "multi", "tag": "l1", "q": "**Zad. 7.** Zaznacz źródła błonnika.", "options": ["świeże owoce i warzywa (zwłaszcza strączkowe)", "ziarna zbóż", "pieczywo pełnoziarniste, płatki owsiane", "słodzone napoje", "cukier"], "answer": [0, 1, 2], "explain": "Źródła: owoce i warzywa (zwł. strączkowe), ziarna zbóż, pieczywo pełnoziarniste, płatki owsiane. *(s. 42)*"}, {"id": "bb8", "type": "multi", "tag": "l1", "q": "**Zad. 8.** Do jakich chorób może prowadzić nadmiar tkanki tłuszczowej (wg podręcznika)?", "options": ["otyłość", "choroby serca", "cukrzyca nabyta", "próchnica wrodzona"], "answer": [0, 1, 2], "explain": "**Otyłość, choroby serca, cukrzyca nabyta**. *(s. 43)*"}, {"id": "bb9", "type": "mc", "tag": "l1", "q": "**Zad. 9.** Anoreksja i bulimia to zaburzenia odżywiania, które mają źródło:", "options": ["w psychice – w zaburzonym postrzeganiu własnej osoby", "w zakażeniu wirusem", "w niedoborze fluoru", "w nadmiarze błonnika"], "answer": 0, "explain": "Źródło **w psychice**. Chorzy głodzą się albo wywołują wymioty – grozi to wyniszczeniem, a nawet śmiercią. Potrzebna stała opieka **lekarza i psychoterapeuty**. *(s. 43)*"}, {"id": "bb10", "type": "multi", "tag": "l2", "q": "**Zad. 10.** Co trafia do dwunastnicy i ostatecznie trawi pokarm?", "options": ["enzymy z trzustki", "żółć z wątroby", "ślina z ślinianek", "sok z jelita grubego"], "answer": [0, 1], "explain": "Do dwunastnicy docierają **enzymy z trzustki** i **żółć z wątroby**, które ostatecznie trawią pokarm. *(s. 45)*"}, {"id": "bb11", "type": "mc", "tag": "l2", "q": "**Zad. 11.** Co dzieje się w **jelicie grubym**?", "options": ["odzyskiwana jest woda, a z niestrawionych resztek formuje się kał", "zaczyna się trawienie cukrów", "pokarm jest mieszany ze śliną", "powstaje żółć"], "answer": 0, "explain": "W jelicie grubym **odzyskiwana jest woda**, a z niestrawionych resztek **formuje się kał**. *(s. 45)*"}, {"id": "bb12", "type": "short", "tag": "l2", "q": "**Zad. 12.** Jak nazywamy skurcze mięśni przewodu pokarmowego przesuwające pokarm od przełyku do odbytu?", "accept": ["perystaltyka", "perystaltyką", "ruchy perystaltyczne"], "explain": "**Perystaltyka**. *(s. 45)*"}, {"id": "bb13", "type": "match", "tag": "l2", "q": "**Zad. 13.** Czas trawienia zależy od pokarmu – dopasuj.", "pairs": [["jabłko", "ok. 40 minut"], ["stek", "ponad 16 godzin"]], "explain": "Jabłko – ok. **40 min**, stek – ponad **16 godzin**. *(s. 45)*"}, {"id": "bb14", "type": "short", "tag": "l2", "q": "**Zad. 14.** Ile **metrów** długości ma jelito grube (ok.)? (przecinek lub kropka, jednostkę możesz pominąć)", "num": 1.5, "tol": 0, "accept": ["1,5 m", "1,5", "1.5"], "explain": "Jelito grube – **ok. 1,5 m**. *(s. 46)*"}, {"id": "bb15", "type": "mc", "tag": "l2", "q": "**Zad. 15.** Który gruczoł wytwarza enzymy trawiące **białka, cukry i tłuszcze**?", "options": ["trzustka", "ślinianki", "wątroba", "żołądek"], "answer": 0, "explain": "**Trzustka**. *(s. 46)*"}, {"id": "bb16", "type": "multi", "tag": "l2", "q": "**Zad. 16.** Które odcinki są zbudowane z **mięśni gładkich** (wg modelu)?", "options": ["przełyk", "żołądek", "ślinianki", "wątroba"], "answer": [0, 1], "explain": "Model: **przełyk** i **żołądek** – zbudowane z mięśni gładkich. *(s. 46)*"}, {"id": "bb17", "type": "mc", "tag": "l2", "q": "**Zad. 17.** Których zębów **nie ma** w uzębieniu mlecznym (wg rysunku)?", "options": ["przedtrzonowców", "siekaczy", "kłów", "trzonowców"], "answer": 0, "explain": "Mleczne: siekacze, kły, trzonowce. Stałe mają dodatkowo **przedtrzonowce**. *(s. 48)*"}, {"id": "bb18", "type": "mc", "tag": "l2", "q": "**Zad. 18.** W której części zęba znajdują się naczynia krwionośne i nerwy?", "options": ["w miazdze", "w szkliwie", "w zębinie", "w dziąśle"], "answer": 0, "explain": "Naczynia krwionośne i nerwy – w **miazdze**. *(s. 48)*"}, {"id": "bb19", "type": "multi", "tag": "l2", "q": "**Zad. 19.** Zaznacz **objawy chorób dziąseł**.", "options": ["krwawienie dziąseł podczas szczotkowania", "zaczerwienienie, obrzęk lub ból", "odsłonięcie szyjek zębowych", "ruchomość zębów", "nieświeży oddech", "zażółcenie skóry"], "answer": [0, 1, 2, 3, 4], "explain": "Choroby dziąseł = stany zapalne tkanek otaczających zęby. Zażółcenie skóry to objaw **WZW**. *(s. 49)*"}, {"id": "bb20", "type": "multi", "tag": "l2", "q": "**Zad. 20.** Zaznacz **przyczyny chorób dziąseł**.", "options": ["nieprawidłowa higiena jamy ustnej", "płytka nazębna i kamień nazębny", "palenie tytoniu", "czynniki hormonalne (np. dojrzewanie, ciąża)", "niektóre choroby (np. cukrzyca)", "picie wody"], "answer": [0, 1, 2, 3, 4], "explain": "Przyczyny: zła higiena, płytka i kamień nazębny, palenie, hormony, niektóre choroby (cukrzyca). *(s. 49)*"}, {"id": "bb21", "type": "match", "tag": "l3", "q": "**Zad. 21.** Dopasuj chorobę do objawów.", "pairs": [["WZW", "biegunka, wymioty, zażółcenie skóry"], ["choroba wrzodowa żołądka", "ostry ból brzucha"], ["rak jelita grubego", "długo bez wyraźnych objawów"]], "explain": "WZW – biegunka, wymioty, zażółcenie skóry; wrzody – ostry ból brzucha; rak jelita grubego – rozwija się powoli, długo bez wyraźnych objawów. *(s. 52)*"}, {"id": "bb22", "type": "multi", "tag": "l3", "q": "**Zad. 22.** Jak zapobiegać **WZW A**?", "options": ["myć ręce przed jedzeniem i po skorzystaniu z toalety", "pić wodę tylko z bezpiecznych źródeł", "zaszczepić się", "nie dotykać zużytych igieł"], "answer": [0, 1, 2], "explain": "WZW A: mycie rąk, bezpieczna woda, szczepienie. *(s. 53)*"}, {"id": "bb23", "type": "multi", "tag": "l3", "q": "**Zad. 23.** Jak zapobiegać **WZW B**?", "options": ["zaszczepić się", "używać sterylnych igieł do zabiegów medycznych i kosmetycznych (np. przekłucie uszu)", "nie dotykać zużytych igieł ani strzykawek bez opakowania", "jeść więcej czerwonego mięsa"], "answer": [0, 1, 2], "explain": "WZW B: szczepienie, sterylne igły, nie dotykać zużytych igieł i strzykawek. *(s. 53)*"}, {"id": "bb24", "type": "match", "tag": "l3", "q": "**Zad. 24.** Funkcje flory jelitowej – dopasuj.", "pairs": [["trawienie", "rozkład pokarmów, których organizm sam nie strawi (błonnik, niektóre węglowodany)"], ["produkcja witamin", "witamina K i niektóre z grupy B"], ["ochrona przed patogenami", "walka ze szkodliwymi drobnoustrojami"], ["wsparcie odporności", "rozpoznawanie i zwalczanie szkodliwych bakterii i wirusów"]], "explain": "4 funkcje flory jelitowej (s. 55). *(s. 55)*"}, {"id": "bb25", "type": "mc", "tag": "l3", "q": "**Zad. 25.** Antybiotyki to leki, które:", "options": ["zwalczają bakterie – i chorobotwórcze, i pożyteczne bakterie jelitowe", "zwalczają wirusy WZW", "są probiotykami", "odżywiają florę jelitową"], "answer": 0, "explain": "Antybiotyki zwalczają bakterie – niestety atakują też **pożyteczne bakterie jelitowe**. Dlatego warto wtedy stosować dietę wspierającą florę. *(s. 55)*"}, {"id": "bo1", "type": "open", "tag": "l1", "q": "**Zad. 26.** Wyjaśnij, do czego w organizmie potrzebny jest błonnik (podaj 2 funkcje).", "keyPoints": ["pęcznieje / wypełnia żołądek – mniej głodu", "przyspiesza ruchy jelit / zapobiega zaparciom / usuwa resztki"], "kw": [["pecznie|wypelni|glod|wchlania wod"], ["przyspiesz|ruchy jelit|zapar|resztk|nowotwor"]], "model": "Błonnik wchłania wodę, pęcznieje i wypełnia żołądek, zmniejszając uczucie głodu. Przyspiesza ruchy jelit, zapobiega zaparciom i usuwa z jelit resztki pokarmów, co zmniejsza ryzyko chorób jelit i niektórych nowotworów.", "points": 2, "explain": "Sprawdź, co wiesz – lekcja 1, zad. 3 (s. 42)."}, {"id": "bo2", "type": "open", "tag": "l2", "q": "**Zad. 27.** Zaproponuj co najmniej trzy działania, by uniknąć próchnicy i chorób dziąseł.", "keyPoints": ["szczotkowanie (min. 2× dziennie) pastą z fluorem", "nitkowanie / płukanie płynem antyseptycznym", "stomatolog (min. raz na pół roku) / profesjonalne czyszczenie", "mniej słodyczy i napojów gazowanych / dieta z witaminami (C)"], "kw": [["szczotk", "fluor", "myc+zeb", "myj+zeb"], ["nitk|plukan|antysept"], ["stomatolog|dentyst"], ["slodycz|gazowan|witamin"]], "model": "Szczotkuję zęby przynajmniej 2 razy dziennie pastą z fluorem, nitkuję przestrzenie między zębami, chodzę do stomatologa przynajmniej raz na pół roku i jem mniej słodyczy i napojów gazowanych.", "points": 4, "explain": "Sprawdź, co wiesz – lekcja 2, zad. 4 (s. 49)."}]}, {"id": "sprawdz-co-wiesz", "title": "„Sprawdź, co wiesz i umiesz!” – wszystkie pytania z 3 lekcji", "minutes": 30, "gradeScale": [[0, "niedostateczny"], [31, "dopuszczający"], [51, "dostateczny"], [71, "dobry"], [88, "bardzo dobry"], [97, "celujący"]], "intro": "Wszystkie 12 pytań z ramek „Sprawdź, co wiesz i umiesz!” (s. 44, 51, 56) + praca w parach. Napisz odpowiedź (albo 🎤 powiedz), potem porównaj ze wzorem – elementy obecne w twojej odpowiedzi zaznaczą się automatycznie.", "tasks": [{"id": "s11", "type": "open", "tag": "l1", "q": "**L1 zad. 1.** Wymień składniki pokarmowe, których codziennie potrzebuje twój organizm.", "keyPoints": ["białka", "cukry (węglowodany)", "tłuszcze", "witaminy", "sole mineralne", "woda"], "kw": [["bialk"], ["cukr|weglowodan"], ["tluszcz"], ["witamin"], ["sol|mineral"], ["wod"]], "model": "Białka, cukry (węglowodany), tłuszcze, witaminy, sole mineralne i woda (oraz błonnik, choć go nie trawimy).", "points": 6, "explain": "s. 38, 44"}, {"id": "s12", "type": "open", "tag": "l1", "q": "**L1 zad. 2a.** Dieta marzeń trzynastolatka: śniadanie – naleśniki z syropem klonowym; obiad – pizza hawajska lub nuggetsy z frytkami; kolacja – tosty z serem i keczupem; między posiłkami – słodycze, chipsy, słodkie napoje, soki owocowe. Określ, czego w niej jest za dużo, a czego mało lub brak.", "keyPoints": ["za dużo cukru (słodycze, słodkie napoje, syrop)", "za dużo tłuszczu / soli (frytki, chipsy, pizza)", "brak / mało warzyw (i owoców)", "mało błonnika (pełne ziarno) i wody"], "kw": [["cukr|slodycz|slodk|syrop"], ["tluszcz|sol|frytk|chips"], ["warzyw|owoc"], ["blonnik|pelnoziarn|pelnego ziarna|wod"]], "model": "Za dużo cukrów prostych (syrop, słodycze, słodkie napoje, soki), tłuszczu i soli (frytki, nuggetsy, chipsy, pizza). Mało lub brak warzyw i owoców, błonnika (pełne ziarno, strączkowe), wody oraz białka z ryb czy roślin strączkowych.", "points": 4, "explain": "s. 42–44"}, {"id": "s13", "type": "open", "tag": "l1", "q": "**L1 zad. 2b.** Zaproponuj, jak można uzupełnić ten jadłospis.", "keyPoints": ["dodać warzywa / owoce", "pieczywo pełnoziarnist
