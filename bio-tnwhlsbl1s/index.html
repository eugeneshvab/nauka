odporność, D kości i zęby, A skóra i oczy. Sole mineralne: kości, sygnały nerwowe, nawodnienie; wapń (ser), żelazo (mięso, liście), potas (banan). Błonnik (celuloza): niestrawiony, pęcznieje, mniej głodu, przyspiesza jelita, zapobiega zaparciom, usuwa resztki – mniej chorób jelit i nowotworów; źródła: owoce, warzywa, strączkowe, zboża, pełnoziarniste, płatki owsiane. Jedz dużo: warzyw, strączkowych, pełnego ziarna; zamieniaj jasne pieczywo na pełnoziarniste, czerwone mięso na ryby/drób/jaja/strączkowe, słodkie napoje na wodę; ograniczaj sól, czerwone mięso, cukier i słodzone napoje; do zdrowia potrzebny też ruch. Za dużo jedzenia + mało ruchu → tkanka tłuszczowa → otyłość, choroby serca, cukrzyca nabyta. Anoreksja, bulimia – źródło w psychice; potrzebny lekarz i psychoterapeuta.\nL2 Budowa i funkcje: układ = przewód pokarmowy + gruczoły trawienne. Trawienie = rozkład na składniki i wchłanianie, dzięki enzymom trawiennym. Droga: jama ustna (zęby, ślina, początek trawienia cukrów) → gardło → przełyk → żołądek (sok żołądkowy) → dwunastnica (początek jelita cienkiego; enzymy trzustki i żółć z wątroby ostatecznie trawią) → jelito cienkie (wchłanianie do krwi; ponad 6 m, najdłuższe) → jelito grube (ok. 1,5 m; odzyskiwanie wody, kał) → odbyt. Przełyk i żołądek z mięśni gładkich. Perystaltyka = skurcze mięśni przesuwające pokarm od przełyku do odbytu. Od zjedzenia do wydalenia nawet 24–27 h; jabłko ok. 40 min, stek ponad 16 h. Gruczoły: ślinianki (ślina, enzymy trawiące cukry), wątroba z pęcherzykiem żółciowym (żółć – trawienie tłuszczów), trzustka (enzymy trawiące białka, cukry, tłuszcze). Zęby: dzieci 20 zębów mlecznych, wypadają ok. 6–12/13 r.ż.; stałe mocniejsze i większe. Budowa: szkliwo, zębina, miazga (naczynia krwionośne i nerwy), dziąsło. Rodzaje: siekacz (odgryzanie), kieł (rozrywanie), przedtrzonowiec i trzonowiec (miażdżenie, rozdrabnianie); mleczne nie mają przedtrzonowców. Próchnica: bakterie żywią się cukrami z resztek, kwasy niszczą szkliwo i zębinę; przyczyny: higiena, słodycze i napoje gazowane, niedobór fluoru, wrodzone skłonności; profilaktyka: szczotkowanie min. 2× dziennie, pasta z fluorem, nitkowanie, stomatolog min. raz na pół roku, witaminy i minerały, mniej słodyczy. Choroby dziąseł: krwawienie, zaczerwienienie, obrzęk, ból, odsłonięte szyjki, ruchome zęby, nieświeży oddech; przyczyny: higiena, płytka i kamień, palenie, hormony, cukrzyca; profilaktyka: szczotkowanie, nitkowanie, płyny antyseptyczne, czyszczenie u stomatologa, bez palenia, witamina C.\nL3 Choroby: przyczyny – złe nawyki żywieniowe, stres, używki, brak higieny, wirusy, bakterie, pasożyty (owsica, tasiemczyca). Zatrucia pokarmowe – bakterie (salmonella), środki ochrony roślin, metale ciężkie. Najgroźniejsze: WZW (biegunka, wymioty, zażółcenie skóry), rak jelita grubego (powoli, długo bez objawów; błonnik, mniej czerwonego mięsa i tłuszczu, badania kontrolne), choroba wrzodowa żołądka (ostry ból brzucha). WZW A – zakażone jedzenie, woda, brudne ręce; mycie rąk, bezpieczna woda, szczepienie. WZW B – płyny ustrojowe (krew, ślina), zabiegi; szczepienie, sterylne igły, nie dotykać igieł. WZW C – płyny ustrojowe, trwałe uszkodzenie wątroby; sterylne igły; brak szczepionki. Flora jelitowa – bakterie w jelitach, mniej więcej tyle co komórek ciała; bifidobakterie (błonnik), bakterie kwasu mlekowego, pałeczka okrężnicy (witamina K; pożyteczna tylko w jelitach), enterokoki, bakterie beztlenowe (Clostridium, resztki). Funkcje: trawienie, witaminy K i z grupy B, ochrona przed patogenami, odporność. Zaburzenia (zła dieta, antybiotyki): zaparcia, biegunki, otyłość, choroby zapalne jelit, słabsza odporność. Antybiotyki niszczą też dobre bakterie. Probiotyki – bakterie: jogurt, kefir, kiszonki. Prebiotyki – odżywiają dobre bakterie: cebula, czosnek, banany.&quot;}"></elevenlabs-convai></template>

ych", "alt": "litera albo treść wariantu", "x": "Układ pokarmowy = przewód pokarmowy + gruczoły trawienne.", "o": ["przewodu pokarmowego i gruczołów trawiennych", "tylko z żołądka i jelit", "serca i naczyń krwionośnych", "płuc i tchawicy"], "ans": "przewodu pokarmowego i gruczołów trawiennych", "qs": "Układ pokarmowy składa się z:", "of": "abc", "st": "Lekcja 2 „Budowa i funkcje układu pokarmowego”, s. 45"}, {"id": "b2", "topic": "l2", "q": "Trawienie to: Warianty: A) rozkładanie pokarmu na składniki i ich wchłanianie; B) tylko żucie pokarmu; C) wydalanie moczu; D) oddychanie komórkowe", "a": "A) rozkładanie pokarmu na składniki i ich wchłanianie", "alt": "litera albo treść wariantu", "x": "Trawienie – rozkład pokarmu na składniki pokarmowe (mniejsze cząsteczki) i ich wchłanianie.", "o": ["rozkładanie pokarmu na składniki i ich wchłanianie", "tylko żucie pokarmu", "wydalanie moczu", "oddychanie komórkowe"], "ans": "rozkładanie pokarmu na składniki i ich wchłanianie", "qs": "Trawienie to:", "of": "abc", "st": "Lekcja 2 „Budowa i funkcje układu pokarmowego”, s. 45"}, {"id": "b3", "topic": "l2", "q": "Trawienie jest możliwe dzięki substancjom wytwarzanym przez gruczoły trawienne. To: Warianty: A) enzymy trawienne; B) hormony wzrostu; C) przeciwciała; D) elektrolity", "a": "A) enzymy trawienne", "alt": "litera albo treść wariantu", "x": "Dzięki enzymom trawiennym wytwarzanym przez gruczoły trawienne.", "o": ["enzymy trawienne", "hormony wzrostu", "przeciwciała", "elektrolity"], "ans": "enzymy trawienne", "qs": "Trawienie jest możliwe dzięki substancjom wytwarzanym przez gruczoły trawienne. To:", "of": "abc", "st": "Lekcja 2 „Budowa i funkcje układu pokarmowego”, s. 45"}, {"id": "b5", "topic": "l2", "q": "Gdzie rozpoczyna się trawienie (cukrów)? Warianty: A) w jamie ustnej; B) w żołądku; C) w jelicie grubym; D) w przełyku", "a": "A) w jamie ustnej", "alt": "litera albo treść wariantu", "x": "W jamie ustnej pokarm jest rozdrabniany przez zęby i mieszany ze śliną; zaczyna ": "6 m", "x": "Jelito cienkie – ponad 6 m – najdłuższy odcinek przewodu pokarmowego.", "st": "Lekcja 2 „Budowa i funkcje układu pokarmowego”, s. 46", "alt": "6, ponad 6; liczba słownie lub cyframi, jednostka niewymagana"}, {"id": "b16", "topic": "l2", "q": "Ile metrów długości ma jelito grube (ok.)?", "a": "1,5 m", "x": "Jelito grube – ok. 1,5 m.", "st": "Lekcja 2 „Budowa i funkcje układu pokarmowego”, s. 46", "alt": "1,5, 1.5; liczba słownie lub cyframi, jednostka niewymagana"}, {"id": "b17", "topic": "l2", "q": "Najdłuższy odcinek przewodu pokarmowego to: Warianty: A) jelito cienkie; B) jelito grube; C) przełyk; D) żołądek", "a": "A) jelito cienkie", "alt": "litera albo treść wariantu", "x": "Jelito cienkie (ponad 6 m); jelito grube ok. 1,5 m.", "o": ["jelito cienkie", "jelito grube", "przełyk", "żołądek"], "ans": "jelito cienkie", "qs": "Najdłuższy odcinek przewodu pokarmowego to:", "of": "abc", "st": "Lekcja 2 „Budowa i funkcje układu pokarmowego”, s. 46"}, {"id": "b20", "topic": "l2", "q": "Który gruczoł wytwarza enzymy trawiące białka, cukry i tłuszcze? Warianty: A) trzustka; B) ślinianki; C) wątroba; D) żołądek", "a": "A) trzustka", "alt": "litera albo treść wariantu", "x": "Trzustka.", "o": ["trzustka", "ślinianki", "wątroba", "żołądek"], "ans": "trzustka", "qs": "Który gruczoł wytwarza enzymy trawiące białka, cukry i tłuszcze?", "of": "abc", "st": "Lekcja 2 „Budowa i funkcje układu pokarmowego”, s. 46"}, {"id": "b21", "topic": "l2", "q": "Żółć: Warianty: A) wytwarza wątroba; umożliwia trawienie tłuszczów; B) wytwarza trzustka; trawi białka; C) wytwarzają ślinianki; trawi cukry; D) powstaje w jelicie grubym z wody", "a": "A) wytwarza wątroba; umożliwia trawienie tłuszczów", "alt": "litera albo treść wariantu", "x": "Żółć – produkuje wątroba (z pęcherzykiem żółciowym); umożliwia trawienie tłuszczów.", "o": ["wytwarza wątroba; umożliwia trawienie tłuszczów", "wytwarza trzustka; trawi białka", "wytwarzają ślinianki; trawi cukry", "powstaje w jelicie grubym z w
