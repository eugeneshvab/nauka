<script>window.TP_CONTENT={"schemaVersion": 1, "meta": {"id": "hist7-ziemie-po-kongresie", "title": "Historia: Ziemie polskie po kongresie wiedeńskim", "subtitle": "Dział II – Królestwo Polskie, powstanie listopadowe, Wielka Emigracja, zabory, 1846–1848, romantyzm", "subject": "Historia", "grade": "Klasa 7 SP", "lang": "pl", "explainLangs": ["pl"], "estimatedMinutes": 90, "sourceNote": "Nauka, ściąga, daty, postacie i pojęcia – wyłącznie z lekcji powtórzeniowej (Dział II). Sprawdziany – dokładne kopie arkuszy GWO i testu podsumowującego, oceniane tylko według oficjalnych kluczy.", "uncertain": ["Mapy, zdjęcia i ilustracje nie są przeniesione – w zadaniach jest dopisek, żeby otworzyć PDF. Odpowiedzi do nich są tylko z klucza.", "Test podsumowujący A, zad. 6 (krzyżówka): klucz podaje hasło 7 „Łukasiewicz” – to literówka; założyciel Towarzystwa Patriotycznego to Walerian Łukasiński. Oceniamy „Łukasiński”.", "Test podsumowujący A, zad. 6: w szkole 7 haseł = 4 pkt (skala progowa); tutaj każde hasło = 1 pkt.", "GWO Sprawdzian 1 B, zad. 7: arkusz ma 4 luki, klucz mówi 5 pkt – tutaj 4 luki po 1 pkt.", "Lekcja powtórzeniowa: przy Paskiewiczu wpisano „rzeź Pragi” – rzeź Pragi była w 1794 r. (Suworow), Paskiewicz zdobył Warszawę w 1831 r. Pominięto. Numeracja „dyktatorów” (Radziwiłł, Skrzynecki) w lekcji jest niepewna – w quizie nie pytamy o nią.", "Pominięto (brak potwierdzonego klucza): test 21 pkt A/B, starszy klucz B, Quizizz, test 30 pytań, notatki społecznościowe. Powstanie styczniowe GWO – poza zakresem, nie dodano."], "tutorMaterial": "TEMAT: Ziemie polskie po kongresie wiedeńskim (historia, klasa 7). Mów po polsku, krótko, najpierw pytaj.\nDaty: 1815 Królestwo Polskie, koniec kongresu; 29.11.1830 wybuch powstania listopadowego; 1831 detronizacja Mikołaja I, wojna polsko-rosyjska, upadek powstania, początek Wielkiej Emigracji; 1846 powstanie krakowskie i rabacja galicyjska; 1848 Wiosna Ludów na ziemiach polskich, uwłaszczenie w Galicji.\nPodział 1815: Rosja – Królestwo Polskie; Prusy – Wielkie Księstwo Poznańskie; Kraków – Rzeczpospolita Krakowska (wolne miasto).\nPostacie: Aleksander I (król, konstytucja), Czartoryski (Hotel Lambert), Lubecki (skarb, Kanał Augustowski), Niemojowscy (opozycja), Łukasiński (Towarzystwo Patriotyczne), Wysocki (spisek podchorążych), Lelewel, Konarski, Flotwell, Dembowski, Szela, Mierosławski, Bem.\nPojęcia: autonomia, konspiracja, detronizacja, emigracja, emisariusz, rabacja, uwłaszczenie, mesjanizm, Statut organiczny.", "mockGroups": [{"id": "kartkowka", "title": "Kartkówka GWO – rozdział 4", "desc": "Kopia kartkówki GWO grupa A i B (9 pkt), klucz GWO."}, {"id": "podsumowujacy", "title": "Test podsumowujący rozdział II", "desc": "Kopia starszego testu (grupa A), klucz A."}, {"id": "sprawdzian", "title": "Sprawdzian 1 GWO", "desc": "Kopia sprawdzianu GWO grupa A i B (36 pkt). Najpierw A, potem popraw błędy, potem B."}]}, "diagnostic": [{"id": "d1", "type": "mc", "tag": "l1", "q": "Co powstało w 1815 r. na większości ziem Księstwa Warszawskiego?", "options": ["Królestwo Polskie", "Wielkie Księstwo Poznańskie", "Rzeczpospolita Krakowska", "Galicja"], "answer": 0, "explain": "**Królestwo Polskie** (Rosja)."}, {"id": "d2", "type": "mc", "tag": "l2", "q": "Kiedy wybuchło powstanie listopadowe?", "options": ["29.11.1830", "1846", "1848", "1815"], "answer": 0, "explain": "**29.11.1830**."}, {"id": "d3", "type": "mc", "tag": "l3", "q": "Kto stał na czele Hotelu Lambert?", "options": ["Adam Jerzy Czartoryski", "Joachim Lelewel", "Piotr Wysocki", "Jakub Szela"], "answer": 0, "explain": "**Czartoryski**."}, {"id": "d4", "type": "mc", "tag": "l4", "q": "Kto stał na czele rabacji galicyjskiej?", "options": ["Jakub Szela", "Edward Dembowski", "Józef Bem", "Edward Flotwell"], "answer": 0, "explain": "**Jakub Szela**, 1846."}, {"id": "d5", "type": "mc", "tag": "l5", "q": "Konspiracja to:", "options": ["tajna, nielegalna działalność przeciw władzy", "pozbawienie władcy tronu", "darowanie kary", "wyjazd z kraju"], "answer": 0, "explain": "Definicja z lekcji powtórzeniowej."}], "lessons": [{"id": "l1", "title": "Po kongresie wiedeńskim. Królestwo Polskie", "minutes": 15, "body": ["**1815** – koniec obrad kongresu wiedeńskiego i powstanie **Królestwa Polskiego**. Ziemie Księstwa Warszawskiego podzielono: **Rosja** – Królestwo Polskie, **Prusy** – **Wielkie Księstwo Poznańskie**, Kraków z okolicą – **Rzeczpospolita Krakowska** (wolne miasto).", "Królestwo Polskie dostało **konstytucję** od cara (konstytucja **oktrojowana**) i było połączone z Rosją **unią personalną** – królem był car.", "Ważne postacie:", "**Aleksander I** – car rosyjski, pierwszy król Królestwa Polskiego; nadał mu konstytucję", "**Antoni Radziwiłł** – namiestnik Wielkiego Księstwa Poznańskiego", "**Józef Zajączek** – generał, namiestnik Królestwa Polskiego 1815–1825", "**Ksawery Drucki-Lubecki** – minister skarbu Królestwa Polskiego; inicjator budowy Kanału Augustowskiego", "**Wincenty i Bonawentura Niemojowscy** – bracia, opozycja w sejmie Królestwa; przeciw łamaniu konstytucji przez cara", "**Walerian Łukasiński** – twórca organizacji spiskowych: Wolnomularstwa Narodowego i Towarzystwa Patriotycznego", "**Tomasz Zan** – konspirator, stał na czele Towarzystwa Filomatów"], "keyPoints": ["1815: Królestwo Polskie (Rosja), Wielkie Księstwo Poznańskie (Prusy), Rzeczpospolita Krakowska", "Aleksander I – konstytucja", "Lubecki – skarb, Kanał Augustowski", "Łukasiński – Towarzystwo Patriotyczne"], "why": "Podział z 1815 r. jest w kartkówce, teście i sprawdzianie.", "tldr": {"pl": "1815: trzy części – Królestwo (Rosja), Księstwo Poznańskie (Prusy), Kraków wolny."}}, {"id": "l2", "title": "Powstanie listopadowe", "minutes": 15, "body": ["**29.11.1830** – wybuch powstania listopadowego (spisek w Szkole Podchorążych, **Piotr Wysocki**).", "**1831** – sejm ogłosił **detronizację** cara **Mikołaja I**, wybuchła wojna polsko-rosyjska; w **1831** powstanie upadło.", "Postacie:", "**Mikołaj I** – car rosyjski; podczas powstania listopadowego zdetronizowany przez Polaków", "**Piotr Wysocki** – podporucznik, twórca spisku w Szkole Podchorążych Piechoty, inicjator powstania listopadowego", "**Józef Chłopicki** – generał, pierwszy dyktator powstania listopadowego", "**Maurycy Mochnacki** – publicysta i pianista, członek Towarzystwa Patriotycznego w powstaniu", "**Józef Skrzynecki** – generał, dowodził w bitwie pod Ostrołęką", "**Jan Krukowiecki** – generał, przywódca powstania listopadowego w ostatniej fazie", "**Ignacy Prądzyński** – generał; zwycięstwa pod Wawrem, Dębem Wielkim i Iganiami", "**Józef Sowiński** – generał, bronił reduty na Woli i zginął; symbol oporu", "**Emilia Plater** – dowodziła powstańczym oddziałem na Litwie", "**Iwan Paskiewicz** – dowodził armią rosyjską w powstaniu listopadowym"], "keyPoints": ["29.11.1830 wybuch", "1831 detronizacja Mikołaja I, wojna, upadek", "Wysocki – inicjator", "Prądzyński – Wawer, Dębe Wielkie, Iganie", "Sowiński – Wola"], "why": "Daty i postacie powstania to dużo punktów.", "tldr": {"pl": "Listopad 1830 – Wysocki; 1831 detronizacja i klęska."}}, {"id": "l3", "title": "Wielka Emigracja i zabory po 1831", "minutes": 15, "body": ["**1831** – początek **Wielkiej Emigracji** (głównie Francja, Belgia, Wielka Brytania). Obozy polityczne: **Hotel Lambert** (Czartoryski), **TDP** (Heltman, Worcell, Krępowiecki), **Komitet Narodowy Polski** (Lelewel).", "W zaborze pruskim po powstaniu – **noc flotwellowska** (Flotwell, polityka antypolska). Na Śląsku polskiej mowy bronił **Józef Lompa**.", "Postacie:", "**Adam Jerzy Czartoryski** – współtwórca konstytucji Królestwa Polskiego; członek Rządu Narodowego w powstaniu listopadowym; na emigracji na czele Hotelu Lambert", "**Joachim Lelewel** – historyk i działacz; w powstaniu – Towarzystwo Patriotyczne; na emigracji na czele Komitetu Narodowego Polskiego", "**Wiktor Heltman, Stanisław Worcell, Tadeusz Krępowiecki** – przywódcy TDP (Towarzystwa Demokratycznego Polskiego) na emigracji", "**Szymon Konarski** – uczestnik powstania listopadowego, emigrant; twórca Stowarzyszenia Ludu Polskiego", "**Edward Flotwell** – naczelny prezes Wielkiego Księstwa Poznańskiego po powstaniu; polityka antypolska – „noc flotwellowska”", "**Józef Lompa** – obrońca polskiej mowy na Śląsku; autor podręczników, poeta"], "keyPoints": ["Hotel Lambert – Czartoryski", "TDP – Heltman, Worcell, Krępowiecki", "Lelewel – Komitet Narodowy Polski", "Konarski – Stowarzyszenie Ludu Polskiego", "Flotwell – noc flotwellowska"], "why": "Obozy emigracji i ich przywódcy są w teście i sprawdzianie.", "tldr": {"pl": "Emigracja: Lambert = Czartoryski, TDP = Heltman."}}, {"id": "l4", "title": "1846 i Wiosna Ludów", "minutes": 12, "body": ["**1846** – **powstanie krakowskie** (Edward Dembowski) i **rabacja galicyjska** (Jakub Szela).", "**1848** – **Wiosna Ludów** na ziemiach polskich (Wielkopolska – **Mierosławski**) i **uwłaszczenie** w Galicji. Józef **Bem** dowodził na Węgrzech.", "Postacie:", "**Edward Dembowski** – rewolucjonista, dowodził powstańcami w powstaniu krakowskim 1846", "**Jakub Szela** – chłop galicyjski, na czele rabacji 1846", "**Ludwik Mierosławski** – generał; dowodził powstaniem w Wielkopolsce w Wiośnie Ludów", "**Józef Bem** – generał; w Wiośnie Ludów naczelny wódz armii powstańczej na Węgrzech"], "keyPoints": ["1846 powstanie krakowskie, rabacja", "1848 Wiosna Ludów, uwłaszczenie w Galicji", "Mierosławski – Wielkopolska", "Bem – Węgry"], "why": "Rok 1846 i 1848 często się myli.", "tldr": {"pl": "1846 Kraków + rabacja; 1848 Wiosna Ludów + uwłaszczenie w Galicji."}}, {"id": "l5", "title": "Kultura romantyzmu i pojęcia", "minutes": 12, "body": ["Romantyzm – twórcy:", "**Adam Mickiewicz** – wielki poeta, wieszcz, romantyzm; filomata; działał na emigracji", "**Juliusz Słowacki** – wielki poeta, wieszcz, romantyzm", "**Fryderyk Chopin** – wielki pianista i kompozytor romantyzmu", "**Piotr Michałowski** – malarz romantyzmu, „Bitwa pod Somosierrą”", "**Stanisław Moniuszko** – kompozytor, pierwsze polskie opery: „Straszny dwór”, „Halka”", "**Artur Grottger** – malarz romantyzmu; cykle „Warszawa”, „Polonia”, „Lituania” o powstaniu styczniowym", "Pojęcia: **Kontrybucja** – danina pieniężna narzucona w traktacie pokojowym przez zwycięzcę pokonanemu; **Protektorat** – państwo z własnym ustrojem zależne w polityce od silniejszego (protektora); **Wolne miasto** – państwo obejmujące obszar miasta; **Unia personalna** – połączenie państw tylko osobą władcy; **Konstytucja oktrojowana** – konstytucja nadana przez panującego; **Autonomia** – częściowa niezależność, np. własne instytucje, język w urzędach i szkołach; **Uwłaszczenie** – nadanie chłopom ziemi, którą uprawiali, za odszkodowaniem lub bez; **Konspiracja** – tajna, nielegalna działalność skierowana przeciwko władzy; **Detronizacja** – pozbawienie władcy tronu; **Romantyzm** – epoka w kulturze od rewolucji francuskiej do Wiosny Ludów; **Amnestia** – darowanie lub złagodzenie kary; **Emigracja** – wyjazd z kraju na dłuższy czas; **Wielka Emigracja** – emigracja po powstaniu listopadowym, głównie do Francji, Belgii, Wielkiej Brytanii; obozy polityczne; **Emisariusz** – tajny wysłannik polityczny zbierający informacje; **Rabacja galicyjska** – powstanie chłopów w Galicji przeciw szlachcie w 1846 r., które uniemożliwiło powstanie w zaborze austriackim; **Serwituty** – prawo do korzystania z należących do pana łąk i lasów; **Wiosna Ludów** – rewolucja 1848–1849; cel: liberalizacja, konstytucje, w Niemczech i Włoszech zjednoczenie; **Mesjanizm** – przekonanie, że naród polski ma misję wyzwolenia świata od zła i zbawienia ludzkości"], "keyPoints": ["Mickiewicz, Słowacki – wieszczowie", "Chopin, Moniuszko – muzyka", "Michałowski, Grottger – malarstwo", "mesjanizm, autonomia, konspiracja, emisariusz"], "why": "Definicje to szybkie punkty.", "tldr": {"pl": "Romantyzm: Mickiewicz, Słowacki, Chopin, Moniuszko."}}], "timeline": [{"date": "1815", "label": "Powstanie Królestwa Polskiego. Koniec obrad kongresu wiedeńskiego.", "t
