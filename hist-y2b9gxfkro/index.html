<script>window.TP_CONTENT={"schemaVersion": 1, "meta": {"id": "hist7-kongres-wiedenski", "title": "Kongres wiedeński i Europa w latach 1815–1856", "subtitle": "Kongres wiedeński, Święte Przymierze, rewolucja przemysłowa, nowe idee, walka ze Świętym Przymierzem, wojna krymska", "subject": "Historia", "grade": "Klasa 7 SP", "lang": "pl", "explainLangs": ["pl", "en", "ru"], "estimatedMinutes": 90, "sourceNote": "Opracowane na podstawie karty powtórzeniowej z lekcji (zad. 1–9 w zakładce „Sprawdzian” to jej wierna kopia) oraz podstawy programowej historii dla klasy 7. Jeśli coś różni się od podręcznika – ważniejszy jest podręcznik i to, co mówił nauczyciel.", "uncertain": []}, "diagnostic": [{"id": "d1", "type": "mc", "tag": "l1", "q": "Kiedy obradował kongres wiedeński?", "options": ["1772–1773", "1830–1831", "1848–1849", "1814–1815"], "answer": 3, "explain": "Kongres zebrał się jesienią 1814 r. po pierwszej abdykacji Napoleona, a akt końcowy podpisano w czerwcu 1815 r."}, {"id": "d2", "type": "mc", "tag": "l2", "q": "W jakim kraju rozpoczęła się rewolucja przemysłowa?", "options": ["W Anglii (Wielkiej Brytanii)", "W Rosji", "We Francji", "We Włoszech"], "answer": 0, "explain": "Anglia miała węgiel, rudę żelaza, kapitał z handlu i kolonii oraz tanią siłę roboczą – dlatego tam zaczęła się rewolucja przemysłowa (2. poł. XVIII w.)."}, {"id": "d3", "type": "mc", "tag": "l3", "q": "Kto napisał Manifest komunistyczny (1848)?", "options": ["Klemens Metternich", "Edmund Burke", "Adam Smith", "Karol Marks i Fryderyk Engels"], "answer": 3, "explain": "Marks i Engels wezwali w nim proletariuszy do rewolucji: „Proletariusze wszystkich krajów, łączcie się!”."}, {"id": "d4", "type": "mc", "tag": "l1", "q": "Które państwa zawarły w 1815 r. Święte Przymierze?", "options": ["Francja, Hiszpania i Włochy", "Wielka Brytania, Francja i Turcja", "Rosja, Austria i Prusy", "Szwecja, Dania i Norwegia"], "answer": 2, "explain": "Święte Przymierze zawarli car Aleksander I, cesarz Austrii Franciszek I i król Prus Fryderyk Wilhelm III."}, {"id": "d5", "type": "tf", "tag": "l4", "q": "Oceń zdania (prawda czy fałsz):", "items": [{"s": "Grecy wywalczyli niepodległość od Turcji – uznano ją w 1830 r.", "a": true}, {"s": "Węgrzy w czasie Wiosny Ludów wywalczyli niepodległość.", "a": false}], "explain": "Grecja uzyskała niepodległość dzięki pomocy mocarstw; powstanie węgierskie stłumiła w 1849 r. Austria z pomocą Rosji."}, {"id": "d6", "type": "mc", "tag": "l5", "q": "Które państwo przegrało wojnę krymską (1853–1856)?", "options": ["Francja", "Turcja", "Rosja", "Wielka Brytania"], "answer": 2, "explain": "Rosja przegrała z koalicją Turcji, Wielkiej Brytanii, Francji i Królestwa Sardynii; pokój podpisano w Paryżu w 1856 r."}], "lessons": [{"id": "l1", "title": "Kongres wiedeński (1814–1815) i Święte Przymierze", "minutes": 8, "body": ["Po pokonaniu Napoleona (abdykacja w 1814 r., zesłanie na wyspę **Elbę**) przedstawiciele państw europejskich zebrali się w **Wiedniu**. **Kongres wiedeński** obradował od **września 1814 do czerwca 1815 r.** Miał na nowo ułożyć granice i porządek w Europie.", "Najważniejsze postacie: car Rosji **Aleksander I**, austriacki minister spraw zagranicznych **Klemens Metternich** (gospodarz kongresu, później kanclerz), przedstawiciel Wielkiej Brytanii **Robert Castlereagh**, król Prus **Fryderyk Wilhelm III** oraz przedstawiciel pokonanej Francji **Charles Talleyrand**, który zręcznie bronił jej interesów.", "Kongres kierował się trzema zasadami: **restauracja** – przywrócenie na trony władców obalonych w czasie rewolucji francuskiej i wojen napoleońskich (np. Burbonów we Francji); **legitymizm** – władza królewska jest święta i należy się tylko prawowitym, dziedzicznym monarchom; **równowaga europejska** – żadne państwo nie może zdobyć przewagi nad innymi.", "W czasie obrad, w **marcu 1815 r.**, Napoleon uciekł z Elby i znów przejął władzę we Francji – to tzw. **„100 dni” Napoleona**. Ostatecznie przegrał **18 czerwca 1815 r. pod Waterloo** (z Brytyjczykami Wellingtona i Prusakami Blüchera) i został zesłany na **Wyspę Świętej Heleny** na Atlantyku, gdzie zmarł w 1821 r.", "**Akt końcowy kongresu** podpisano **9 czerwca 1815 r.** (9 dni przed Waterloo). Postanowienia: z większości Księstwa Warszawskiego powstało **Królestwo Polskie** połączone z Rosją (car królem Polski); Prusy dostały **Wielkie Księstwo Poznańskie**, część Saksonii i Nadrenię; utworzono **Wolne Miasto Kraków**; powstał **Związek Niemiecki** pod przewodnictwem Austrii; Belgię połączono z Holandią w **Królestwo Niderlandów**; **Szwajcaria** otrzymała wieczystą neutralność; Austria zyskała północne Włochy (Lombardię i Wenecję), a Wielka Brytania – ważne kolonie i bazy morskie (np. Maltę).", "**26 września 1815 r.** car Aleksander I, cesarz Austrii Franciszek I i król Prus Fryderyk Wilhelm III zawarli **Święte Przymierze**. Monarchowie obiecali sobie pomoc w obronie **porządku wiedeńskiego** i w **tłumieniu rewolucji** oraz ruchów narodowych. Później przystąpiła do niego większość monarchów Europy (ale nie Wielka Brytania)."], "keyPoints": ["IX 1814 – VI 1815: kongres wiedeński; gospodarz – Metternich", "Zasady: restauracja, legitymizm, równowaga europejska", "III–VI 1815: 100 dni Napoleona; 18 VI 1815 Waterloo; zesłanie na Wyspę Świętej Heleny", "Królestwo Polskie z carem jako królem, Wolne Miasto Kraków, Związek Niemiecki, Królestwo Niderlandów", "26 IX 1815: Święte Przymierze Rosji, Austrii i Prus"], "why": [{"q": "Dlaczego zwycięzcy tak bardzo dbali o równowagę europejską?", "a": "Bo pamiętali, że Francja Napoleona podporządkowała sobie prawie całą Europę. Gdy siły państw są wyrównane, żadne nie może łatwo napaść i zdominować innych – to miało zapewnić pokój."}, {"q": "Dlaczego kongres nie odbudował niepodległej Polski?", "a": "Kongresem rządziły mocarstwa, które wcześniej dokonały rozbiorów (Rosja, Prusy, Austria). Dbały o własne interesy i równowagę sił, a nie o prawa narodów – dlatego Polska pozostała podzielona."}], "tldr": {"pl": "Kongres wiedeński (1814–1815) przywrócił dawnych monarchów (restauracja, legitymizm) i dbał o równowagę sił; w 1815 r. Napoleon przegrał pod Waterloo, a Rosja, Austria i Prusy zawarły Święte Przymierze.", "en": "The Congress of Vienna (1814–1815) redrew the map of Europe after Napoleon. Its principles were restoration (bringing back old dynasties), legitimism (only hereditary monarchs rule rightfully) and the European balance of power. During the 'Hundred Days' Napoleon returned, lost at Waterloo (18 June 1815) and was exiled to Saint Helena. Russia, Austria and Prussia formed the Holy Alliance (September 1815) to defend this order and crush revolutions.", "ru": "Венский конгресс (1814–1815) заново поделил Европу после Наполеона. Его принципы: реставрация (возвращение старых династий), легитимизм (законна только власть наследственных монархов) и европейское равновесие. Во время «Ста дней» Наполеон вернулся, проиграл при Ватерлоо (18 июня 1815) и был сослан на остров Святой Елены. Россия, Австрия и Пруссия создали Священный союз (сентябрь 1815) для защиты этого порядка и подавления революций."}}, {"id": "l2", "title": "Rewolucja przemysłowa", "minutes": 8, "body": ["**Rewolucja przemysłowa** to przejście od pracy ręcznej do **pracy maszyn** w fabrykach. Zaczęła się w drugiej połowie **XVIII w. w Anglii**, bo były tam **złoża węgla i rudy żelaza**, **kapitał** z handlu i kolonii, tania siła robocza (ludzie przenoszący się ze wsi) i duży rynek zbytu.", "Najważniejszy wynalazek to **maszyna parowa**, którą udoskonalił **James Watt** (patent z 1769 r.). Napędzała pompy w kopalniach, maszyny w fabrykach, a później pociągi i statki.", "Inne wynalazki: **krosno mechaniczne** – **Edmund Cartwright** (1785); **statek parowy** – **Robert Fulton** (1807, USA); **parowóz (lokomotywa parowa)** – **Jerzy (George) Stephenson** – jego „Rakieta” jeździła na kolei **Manchester–Liverpool** otwartej w **1830 r.**; **telegraf elektryczny** i alfabet – **Samuel Morse** (1837, pierwsza linia 1844).", "Skutki: **industrializacja** (uprzemysłowienie), powstanie **fabryk**, **urbanizacja** – szybki rozwój miast, pojawienie się **metropolii** (np. Londyn). Powstały nowe grupy społeczne: **burżuazja** – właściciele fabryk, banków i kopalń (środków produkcji), którzy inwestowali **kapitał**, oraz **proletariat** – najubożsi robotnicy żyjący tylko z pracy najemnej.", "Robotnicy pracowali po **14–16 godzin dziennie**, za niskie płace, w złych warunkach; pracowały też dzieci. Aby walczyć o swoje prawa, organizowali **strajki** (zorganizowane przerwanie pracy) i zakładali **związki zawodowe**."], "keyPoints": ["Początek: 2. poł. XVIII w., Anglia", "Watt – maszyna parowa; Cartwright – krosno mechaniczne; Fulton – statek parowy", "Stephenson – parowóz; kolej Manchester–Liverpool 1830; Morse – telegraf", "Skutki: industrializacja, urbanizacja, metropolie, fabryki", "Nowe klasy: burżuazja i proletariat; strajki i związki zawodowe"], "why": [{"q": "Dlaczego maszyna parowa była tak ważna?", "a": "Dała silny i stały napęd niezależny od siły ludzi, zwierząt, wiatru czy rzeki. Fabryki można było budować wszędzie, a parowozy i statki parowe zrewolucjonizowały transport."}, {"q": "Dlaczego miasta tak szybko rosły?", "a": "Fabryki potrzebowały wielu robotników, a na wsi brakowało ziemi i pracy. Ludzie przenosili się więc do miast – to urbanizacja."}], "tldr": {"pl": "Rewolucja przemysłowa zaczęła się w Anglii w XVIII w.: maszyna parowa Watta, krosno Cartwrighta, statek Fultona, parowóz Stephensona, telegraf Morse’a; skutki: fabryki, urbanizacja, burżuazja i proletariat.", "en": "The Industrial Revolution began in England in the second half of the 18th century: machines replaced hand work. Key inventions: Watt's improved steam engine, Cartwright's power loom, Fulton's steamboat, Stephenson's steam locomotive (Manchester–Liverpool railway, 1830), Morse's telegraph. Effects: industrialisation, factories, fast-growing cities (urbanisation), a new rich class (bourgeoisie) and a poor working class (proletariat), strikes and trade unions.", "ru": "Промышленная революция началась в Англии во второй половине XVIII века: машины заменили ручной труд. Главные изобретения: паровая машина Уатта, механический ткацкий станок Картрайта, пароход Фултона, паровоз Стефенсона (железная дорога Манчестер–Ливерпуль, 1830), телеграф Морзе. Последствия: индустриализация, фабрики, быстрый рост городов (урбанизация), буржуазия и пролетариат, забастовки и профсоюзы."}}, {"id": "l3", "title": "Nowe idee: liberalizm, konserwatyzm, socjalizm, komunizm", "minutes": 7, "body": ["**Liberalizm** (łac. *liber* – wolny): najważniejsza jest **wolność i swobodny rozwój jednostki**, równość wobec prawa, ochrona własności, rządy konstytucji. **Liberalizm ekonomiczny** stworzył **Adam Smith** (dzieło „Badania nad naturą i przyczynami bogactwa narodów”, 1776): wolny rynek i konkurencja, państwo nie powinno wtrącać się w gospodarkę.", "**Konserwatyzm** (łac. *conservare* – zachowywać): ważne są **tradycja, religia i silna pozycja Kościoła**, monarchia i dawny porządek; zmiany powinny być powolne, a nie rewolucyjne. Główni ideolodzy: **Edmund Burke** („Rozważania o rewolucji we Francji”, 1790) i **Joseph de Maistre**.", "**Socjalizm** powstał w odpowiedzi na nędzę robotników: jego przedstawiciele dążyli do **poprawy warunków życia i pracy robotników** i sprawiedliwości społecznej. **Socjaliści utopijni** (np. **Robert Owen**, Henri de Saint-Simon, Charles Fourier) marzyli o idealnych wspólnotach bez biedy.", "**Komunizm**: **Karol Marks** i **Fryderyk Engels** w **Manifeście komunistycznym (1848)** głosili, że historia to **walka klas**, a proletariat musi przeprowadzić **rewolucję**, znieść **własność prywatną** i stworzyć społeczeństwo bezklasowe.", "Robotnicy łączyli się w **związki zawodowe** – organizacje broniące ich interesów (wyższe płace, krótszy czas pracy). Ich bronią był **strajk**."], "keyPoints": ["Liberalizm – wolność jednostki; liberalizm ekonomiczny – Adam Smith, wolny rynek", "Konserwatyzm – tradycja, religia, Kościół; Burke, de Maistre", "Socjalizm – poprawa losu robotników; utopijny – Owen", "Komunizm – Marks i Engels, Manifest komunistyczny 1848, rewolucja, walka klas", "Związki zawodowe i strajki – walka robotników o prawa"], "why": [{"q": "Czym różni się socjalizm od komunizmu?", "a": "Socjaliści chcieli poprawić los robotników, często przez reformy i działalność związków zawodowych. Komuniści (Marks, Engels) uważali, że trzeba obalić stary porządek rewolucją i znieść własność prywatną."}], "tldr": {"pl": "Liberalizm stawia na wolność jednostki (Smith – wolny rynek), konserwatyzm na tradycję i religię (Burke, de Maistre), socjalizm na poprawę losu robotników, a komunizm (Marks, Engels, 1848) na rewolucję proletariatu.", "en": "New ideas of the 19th century: liberalism – individual freedom, constitution, free market (economic liberalism – Adam Smith); conservatism – tradition, religion, the Church, slow change (Edmund Burke, Joseph de Maistre); socialism – better living and working conditions for workers (utopian socialism – Robert Owen); communism – class struggle, proletarian revolution, abolition of private property (Marx and Engels, Communist Manifesto, 1848). Workers formed trade unions and organised strikes.", "ru": "Новые идеи XIX века: либерализм – свобода личности, конституция, свободный рынок (экономический либерализм – Адам Смит); консерватизм – традиции, религия, Церковь, медленные перемены (Эдмунд Бёрк, Жозеф де Местр); социализм – улучшение условий жизни и труда рабочих (утопический социализм – Роберт Оуэн); коммунизм – классовая борьба, пролетарская революция, отмена частной собственности (Маркс и Энгельс, «Манифест коммунистической партии», 1848). Рабочие создавали профсоюзы и устраивали забастовки."}}, {"id": "l4", "title": "Walka ze Świętym Przymierzem (1825–1849)", "minutes": 9, "body": ["**Dekabryści (grudzień 1825 r.)** – oficerowie rosyjscy w Petersburgu wystąpili przy wstąpieniu na tron cara **Mikołaja I**, domagając się m.in. konstytucji. Powstanie zostało **stłumione** – przywódców stracono lub zesłano na Syberię. ❌", "**Grecja** – powstanie przeciw Turcji wybuchło w 1821 r. Dzięki pomocy Wielkiej Brytanii, Francji i Rosji Grecy **uzyskali niepodległość (uznaną w 1830 r.)**. ✅", "**Rewolucja lipcowa (lipiec 1830 r.) we Francji** obaliła króla **Karola X** z dynastii Burbonów; królem został **Ludwik Filip**. ✅ Zachęciła do walki inne narody.", "**Belgia (1830–1831)** – Belgowie zbuntowali się przeciw Holandii i **wywalczyli niepodległość**; królem został Leopold I. ✅ **Powstanie listopadowe (1830–1831)** w Królestwie Polskim zakończyło się **klęską** z Rosją. ❌", "**Wiosna Ludów (1848–1849)** – fala rewolucji w Europie. We **Francji** obalono Ludwika Filipa i ogłoszono **republikę** ✅; w Austrii upadł Metternich, a w cesarstwie **zniesiono pańszczyznę** ✅. Parlament we **Frankfurcie nad Menem** próbował zjednoczyć Niemcy – bez skutku ❌. **Węgrzy** pod wodzą **Lajosa Kossutha** walczyli o niepodległość, ale w 1849 r. pokonała ich Austria z pomocą Rosji ❌. **Włosi** walczyli o wyzwolenie spod władzy Austrii i zjednoczenie – przegrali ❌.", "Zapamiętaj: **udało się** Grekom, Belgom i Francuzom (1830 i 1848); **nie udało się** dekabrystom, Polakom (1830–1831), Węgrom, Włochom i Niemcom (zjednoczenie) w latach 1848–1849."], "keyPoints": ["1825 – dekabryści przeciw Mikołajowi I – klęska", "1830 – niepodległość Grecji – sukces", "VII 1830 – rewolucja lipcowa, obalenie Karola X – sukces", "1830–1831 – Belgia niepodległa – sukces; powstanie listopadowe – klęska", "1848–1849 – Wiosna Ludów: Węgry (Kossuth), Włochy, parlament frankfurcki – klęski"], "why": [{"q": "Dlaczego Grekom i Belgom się udało, a Polakom nie?", "a": "Grecy i Belgowie dostali poparcie wielkich mocarstw (Grecy – Wielkiej Brytanii, Francji i Rosji; Belgowie – Wielkiej Brytanii i Francji). Polacy walczyli sami przeciw Rosji, jednemu z najsilniejszych państw Świętego Przymierza."}], "tldr": {"pl": "Ze Świętym Przymierzem wygrali Grecy (1830), Belgowie (1830–1831) i Francuzi (rewolucja lipcowa 1830, republika 1848); przegrali dekabryści (1825), Polacy (1830–1831), Węgrzy, Włosi i Niemcy w czasie Wiosny Ludów (1848–1849).", "en": "Struggles against the Holy Alliance: the Decembrists in Russia (1825) were crushed by Nicholas I; Greece won independence from Turkey (recognised 1830); the July Revolution in France (1830) overthrew Charles X; Belgium broke away from Holland (1830–1831); the Polish November Uprising (1830–1831) failed. During the Spring of Nations (1848–1849) France became a republic and serfdom was abolished in Austria, but the Hungarians (Kossuth), Italians and the Frankfurt Parliament (German unification) failed.", "ru": "Борьба со Священным союзом: восстание декабристов в России (1825) подавил Николай I; Греция добилась независимости от Турции (признана в 1830 г.); Июльская революция во Франции (1830) свергла Карла X; Бельгия отделилась от Голландии (1830–1831); польское Ноябрьское восстание (1830–1831) потерпело поражение. Во время «Весны народов» (1848–1849) Франция стала республикой, в Австрии отменили барщину, но венгры (Кошут), итальянцы и Франкфуртский парламент (объединение Германии) проиграли."}}, {"id": "l5", "title": "Wojna krymska (1853–1856)", "minutes": 6, "body": ["**Przyczyny:** Rosja chciała **kontrolować cieśniny Bosfor i Dardanele** (łączą Morze Czarne z Morzem Śródziemnym) i **osłabić Turcję**. Pretekstem była **opieka nad prawosławnymi** mieszkającymi w państwie tureckim.", "W 1853 r. Rosja zajęła księstwa naddunajskie (Mołdawię i Wołoszczyznę) i rozpoczęła wojnę z Turcją. Turcję poparły **Wielka Brytania i Francja** (1854), a w 1855 r. dołączyło **Królestwo Sardynii**. Car Mikołaj I nie spodziewał się, że mocarstwa zachodnie staną przeciw niemu.", "Główne walki toczyły się na **Krymie**. Najważniejsze było **oblężenie Sewastopola** – rosyjskiej bazy floty czarnomorskiej (1854–1855). Miasto padło we wrześniu 1855 r. W czasie wojny **Florence Nightingale** zorganizowała opiekę nad rannymi żołnierzami. W 1855 r. w Konstantynopolu, organizując polskie oddziały do walki z Rosją, zmarł **Adam Mickiewicz**.", "**Skutki:** **klęska Rosji**; **pokój paryski (1856)** – zakaz utrzymywania **floty wojennej na Morzu Czarnym**. Klęska pokazała zacofanie Rosji, więc nowy car **Aleksander II** przeprowadził **reformy**, m.in. **uwłaszczenie chłopów (1861)** – zniesienie poddaństwa."], "keyPoints": ["Przyczyny: cieśniny Bosfor i Dardanele, osłabienie Turcji, opieka nad prawosławnymi", "Strony: Rosja vs Turcja + Wielka Brytania + Francja + Królestwo Sardynii", "Oblężenie Sewastopola 1854–1855", "Pokój paryski 1856: zakaz floty wojennej na Morzu Czarnym", "Skutek: reformy w Rosji – uwłaszczenie chłopów 1861"], "why": [{"q": "Dlaczego Wielka Brytania i Francja pomogły Turcji?", "a": "Nie chciały, żeby Rosja opanowała cieśniny i stała się zbyt silna na Morzu Śródziemnym – to naruszyłoby równowagę sił i zagroziło ich interesom (m.in. drodze Wielkiej Brytanii do Indii)."}], "tldr": {"pl": "Wojna krymska (1853–1856): Rosja chciała opanować Bosfor i Dardanele, ale przegrała z Turcją, Wielką Brytanią, Francją i Sardynią (Sewastopol); pokój paryski 1856 zakazał jej floty na Morzu Czarnym, a car Aleksander II zaczął reformy (uwłaszczenie 1861).", "en": "The Crimean War (1853–1856): Russia wanted control of the Bosporus and Dardanelles straits and to weaken Turkey (pretext: protecting Orthodox Christians). Turkey was joined by Britain, France and the Kingdom of Sardinia. The key event was the siege of Sevastopol (1854–1855). Russia lost; the Peace of Paris (1856) banned warships on the Black Sea, and Tsar Alexander II began reforms, including the emancipation of the serfs (1861).", "ru": "Крымская война (1853–1856): Россия хотела контролировать проливы Босфор и Дарданеллы и ослабить Турцию (предлог – защита православных). На стороне Турции выступили Великобритания, Франция и Сардинское королевство. Главное событие – осада Севастополя (1854–1855). Россия проиграла; Парижский мир (1856) запретил военный флот на Чёрном море, а Александр II начал реформы, в том числе отмену крепостного права (1861)."}}], "timeline": [{"date": "1769", "label": "James Watt – patent ulepszonej maszyny parowej", "tag": "l2"}, {"date": "1776", "label": "Adam Smith – „Bogactwo narodów” (liberalizm ekonomiczny)", "tag": "l3"}, {"date": "1785", "label": "Krosno mechaniczne Cartwrighta", "tag": "l2"}, {"date": "1790", "label": "Edmund Burke – „Rozważania o rewolucji we Francji”", "tag": "l3"}, {"date": "1807", "label": "Statek parowy Roberta Fultona", "tag": "l2"}, {"date": "IX 1814", "label": "Początek kongresu wiedeńskiego", "tag": "l1", "key": true}, {"date": "III–VI 1815", "label": "„100 dni” Napoleona", "tag": "l1"}, {"date": "9 VI 1815", "label": "Akt końcowy kongresu wiedeńskiego", "tag": "l1"}, {"date": "18 VI 1815", "label": "Bitwa pod Waterloo; Napoleon zesłany na Wyspę Świętej Heleny", "tag": "l1", "key": true}, {"date": "26 IX 1815", "label": "Święte Przymierze: Rosja, Austria, Prusy", "tag": "l1", "key": true}, {"date": "1821", "label": "Wybuch powstania Greków przeciw Turcji", "tag": "l4"}, {"date": "XII 1825", "label": "Powstanie dekabrystów w Rosji (Mikołaj I)", "tag": "l4"}, {"date": "VII 1830", "label": "Rewolucja lipcowa we Francji – obalenie Karola X", "tag": "l4"}, {"date": "1830", "label": "Niepodległość Grecji; kolej Manchester–Liverpool", "tag": "l4", "key": true}, {"date": "1830–1831", "label": "Niepodległość Belgii; powstanie listopadowe (klęska)", "tag": "l4"}, {"date": "1837/1844", "label": "Telegraf Morse’a (patent / pierwsza linia)", "tag": "l2"}, {"date": "1848", "label": "Manifest komunistyczny (Marks, Engels)", "tag": "l3"}, {"date": "1848–1849", "label": "Wiosna Ludów (Węgry – Kossuth, parlament frankfurcki, Włosi)", "tag": "l4", "key": true}, {"date": "1853–1856", "label": "Wojna krymska", "tag": "l5", "key": true}, {"date": "1854–1855", "label": "Oblężenie Sewastopola", "tag": "l5"}, {"date": "1856", "label": "Pokój paryski – zakaz floty wojennej na Morzu Czarnym", "tag": "l5"}, {"date": "1861", "label": "Uwłaszczenie chłopów w Rosji (Aleksander II)", "tag": "l5"}], "people": [{"name": "Aleksander I", "role": "car Rosji (do 1825), uczestnik kongresu wiedeńskiego, inicjator Świętego Przymierza, król Polski"}, {"name": "Klemens Metternich", "role": "austriacki minister spraw zagranicznych, gospodarz kongresu, od 1821 kanclerz; obalony w 1848"}, {"name": "Charles Talleyrand", "role": "przedstawiciel Francji na kongresie wiedeńskim"}, {"name": "Robert Castlereagh", "role": "przedstawiciel Wielkiej Brytanii na kongresie wiedeńskim"}, {"name": "Fryderyk Wilhelm III", "role": "król Prus, współtwórca Świętego Przymierza"}, {"name": "Napoleon Bonaparte", "role": "„100 dni” (1815), klęska pod Waterloo, zesłany na Wyspę Świętej Heleny"}, {"name": "James Watt", "role": "udoskonalił maszynę parową"}, {"name": "Jerzy (George) Stephenson", "role": "konstruktor parowozu „Rakieta”, kolej Manchester–Liverpool (1830)"}, {"name": "Robert Fulton", "role": "statek parowy (1807)"}, {"name": "Samuel Morse", "role": "telegraf elektryczny i alfabet Morse’a"}, {"name": "Edmund Cartwright", "role": "krosno mechaniczne (1785)"}, {"name": "Adam Smith", "role": "twórca liberalizmu ekonomicznego"}, {"name": "Edmund Burke / Joseph de Maistre", "role": "ideolodzy konserwatyzmu"}, {"name": "Karol Marks i Fryderyk Engels", "role": "twórcy komunizmu, Manifest komunistyczny (1848)"}, {"name": "Robert Owen", "role": "socjalista utopijny"}, {"name": "Mikołaj I", "role": "car Rosji od 1825, stłumił powstanie dekabrystów, rozpoczął wojnę krymską"}, {"name": "Karol X", "role": "król Francji obalony w rewolucji lipcowej 1830"}, {"name": "Lajos Kossuth", "role": "przywódca Węgrów w czasie Wiosny Ludów (1848–1849)"}, {"name": "Aleksander II", "role": "car od 1855, uwłaszczenie chłopów w Rosji (1861)"}], "flashcards": [{"front": "Kongres wiedeński – kiedy i po co?", "back": "IX 1814 – VI 1815; nowy ład w Europie po wojnach napoleońskich.", "tag": "l1"}, {"front": "Restauracja", "back": "Przywrócenie na trony władców obalonych w trakcie rewolucji francuskiej i wojen napoleońskich.", "tag": "l1"}, {"front": "Legitymizm", "back": "Zasada, według której władza królewska jest święta i nienaruszalna – należy się prawowitym, dziedzicznym monarchom.", "tag": "l1"}, {"front": "Równowaga europejska", "back": "Zasada, że żadne państwo w Europie nie może zdobyć przewagi nad innymi.", "tag": "l1"}, {"front": "„100 dni” Napoleona", "back": "III–VI 1815: powrót z Elby i ponowne rządy; koniec po klęsce pod Waterloo.", "tag": "l1"}, {"front": "Waterloo", "back": "18 VI 1815 – ostateczna klęska Napoleona; zesłanie na Wyspę Świętej Heleny.", "tag": "l1"}, {"front": "Święte Przymierze", "back": "Sojusz Rosji, Austrii i Prus (26 IX 1815) – obrona porządku wiedeńskiego i tłumienie rewolucji.", "tag": "l1"}, {"front": "Postanowienia kongresu dla ziem polskich", "back": "Królestwo Polskie (car królem), Wielkie Księstwo Poznańskie (Prusy), Wolne Miasto Kraków.", "tag": "l1"}, {"front": "Industrializacja", "back": "Przekształcanie gospodarki: rośnie udział pracy maszyn i zatrudnienia w przemyśle.", "tag": "l2"}, {"front": "Urbanizacja", "back": "Szybki rozwój miast i wzrost liczby ich mieszkańców.", "tag": "l2"}, {"front": "Metropolia", "back": "Duże miasto – centrum administracyjne, gospodarcze i kulturalne.", "tag": "l2"}, {"front": "Burżuazja", "back": "Właściciele środków produkcji: fabryk, banków, kopalń.", "tag": "l2"}, {"front": "Proletariat", "back": "Najuboższa warstwa robotników, żyjących tylko z pracy najemnej.", "tag": "l2"}, {"front": "Kapitał", "back": "Środki finansowe inwestowane po to, by powiększyć zyski.", "tag": "l2"}, {"front": "Fabryka", "back": "Zakład, w którym robotnicy wytwarzają towary przy pomocy maszyn.", "tag": "l2"}, {"front": "Strajk", "back": "Zorganizowane przerwanie pracy, by wymusić spełnienie żądań.", "tag": "l3"}, {"front": "Związki zawodowe", "back": "Organizacje robotników broniące ich interesów (płace, czas pracy).", "tag": "l3"}, {"front": "James Watt", "back": "Udoskonalił maszynę parową (patent 1769).", "tag": "l2"}, {"front": "Jerzy Stephenson", "back": "Parowóz „Rakieta”; kolej Manchester–Liverpool (1830).", "tag": "l2"}, {"front": "Robert Fulton / Samuel Morse / Edmund Cartwright", "back": "Fulton – statek parowy; Morse – telegraf; Cartwright – krosno mechaniczne.", "tag": "l2"}, {"front": "Liberalizm", "back": "Najważniejsza wolność i swobodny rozwój jednostki; konstytucja, równość wobec prawa.", "tag": "l3"}, {"front": "Liberalizm ekonomiczny", "back": "Adam Smith: wolny rynek i konkurencja, państwo nie ingeruje w gospodarkę.", "tag": "l3"}, {"front": "Konserwatyzm", "back": "Tradycja, religia, silna pozycja Kościoła, powolne zmiany; Burke, de Maistre.", "tag": "l3"}, {"front": "Socjalizm", "back": "Dążenie do poprawy warunków życia i pracy robotników; socjalizm utopijny – Owen.", "tag": "l3"}, {"front": "Komunizm", "back": "Marks i Engels, Manifest komunistyczny (1848): walka klas, rewolucja, zniesienie własności prywatnej.", "tag": "l3"}, {"front": "Dekabryści", "back": "XII 1825, Petersburg – bunt oficerów przeciw Mikołajowi I; stłumiony.", "tag": "l4"}, {"front": "Rewolucja lipcowa", "back": "VII 1830, Francja – obalenie Karola X, królem Ludwik Filip.", "tag": "l4"}, {"front": "Komu się udało w latach 1825–1831?", "back": "Udało się: Grecja (1830), Belgia (1830–31), Francja (rewolucja lipcowa). Nie: dekabryści, powstanie listopadowe.", "tag": "l4"}, {"front": "Wiosna Ludów", "back": "1848–1849: rewolucje w Europie; Węgry (Kossuth), Włosi, parlament frankfurcki – klęski; Francja – republika.", "tag": "l4"}, {"front": "Wojna krymska – przyczyny", "back": "Rosja chciała kontroli nad Bosforem i Dardanelami, osłabienia Turcji; pretekst – opieka nad prawosławnymi.", "tag": "l5"}, {"front": "Wojna krymska – strony", "back": "Rosja vs Turcja, Wielka Brytania, Francja, Królestwo Sardynii.", "tag": "l5"}, {"front": "Pokój paryski 1856", "back": "Klęska Rosji; zakaz floty wojennej na Morzu Czarnym.", "tag": "l5"}, {"front": "Uwłaszczenie w Rosji", "back": "1861, car Aleksander II – reforma po klęsce w wojnie krymskiej.", "tag": "l5"}], "quiz": [{"id": "q1", "type": "order", "tag": "l1", "q": "Ułóż wydarzenia z lat 1814–1815 w kolejności chronologicznej.", "items": ["Rozpoczęcie obrad kongresu wiedeńskiego", "Powrót Napoleona z Elby – początek „stu dni”", "Podpisanie aktu końcowego kongresu wiedeńskiego", "Bitwa pod Waterloo", "Zawarcie Świętego Przymierza"], "explain": "IX 1814 → III 1815 → 9 VI 1815 → 18 VI 1815 → 26 IX 1815. Akt końcowy podpisano 9 dni przed Waterloo."}, {"id": "q2", "type": "order", "tag": "l2", "q": "Ułóż wynalazki w kolejności chronologicznej.", "items": ["Ulepszenie maszyny parowej przez Jamesa Watta", "Krosno mechaniczne Edmunda Cartwrighta", "Statek parowy Roberta Fultona", "Otwarcie kolei Manchester–Liverpool", "Telegraf Samuela Morse’a"], "explain": "1769 → 1785 → 1807 → 1830 → 1837/1844. Najpierw udoskonalono maszynę parową, potem zastosowano ją w przemyśle i transporcie."}, {"id": "q3", "type": "order", "tag": "l4", "q": "Ułóż wydarzenia w kolejności chronologicznej.", "items": ["Powstanie dekabrystów w Rosji", "Rewolucja lipcowa we Francji", "Wybuch powstania listopadowego", "Wiosna Ludów", "Wojna krymska"], "explain": "XII 1825 → VII 1830 → XI 1830 → 1848–1849 → 1853–1856. Rewolucja lipcowa zachęciła m.in. Polaków do walki."}, {"id": "q4", "type": "order", "tag": "l3", "q": "Ułóż wydarzenia w kolejności chronologicznej.", "items": ["Wydanie dzieła Adama Smitha „Bogactwo narodów”", "Kongres wiedeński", "Ogłoszenie Manifestu komunistycznego", "Oblężenie Sewastopola", "Uwłaszczenie chłopów w Rosji"], "explain": "1776 → 1814–1815 → 1848 → 1854–1855 → 1861."}, {"id": "q5", "type": "match", "tag": "l1", "q": "Przyporządkuj wydarzeniom właściwe daty.", "pairs": [["Bitwa pod Waterloo", "1815"], ["Powstanie dekabrystów", "1825"], ["Otwarcie kolei Manchester–Liverpool", "1830"], ["Manifest komunistyczny", "1848"], ["Pokój paryski kończący wojnę krymską", "1856"]], "explain": "Waterloo 1815, dekabryści 1825, kolej Manchester–Liverpool 1830, Manifest komunistyczny 1848, pokój paryski 1856 – to „szkielet” historii Europy 1815–1856."}, {"id": "q6", "type": "mc", "tag": "l1", "q": "Którego pojęcia dotyczy definicja: „przywrócenie władzy dynastiom panującym przed rewolucją francuską i Napoleonem oraz dawnego porządku”?", "options": ["restauracja", "legitymizm", "liberalizm", "równowaga europejska"], "answer": 0, "explain": "Restauracja oznaczała m.in. powrót Burbonów na tron Francji (Ludwik XVIII)."}, {"id": "q7", "type": "mc", "tag": "l1", "q": "Którego pojęcia dotyczy definicja: „władza należy się wyłącznie prawowitym, dziedzicznym monarchom”?", "options": ["legitymizm", "konserwatyzm", "równowaga europejska", "restauracja"], "answer": 0, "explain": "Legitymizm uznawał za prawowitą tylko władzę panujących dynastii – władza królewska jest święta i nienaruszalna."}, {"id": "q8", "type": "mc", "tag": "l1", "q": "Którego pojęcia dotyczy definicja: „żadne państwo w Europie nie może uzyskać przewagi nad pozostałymi”?", "options": ["równowaga europejska", "industrializacja", "legitymizm", "restauracja"], "answer": 0, "explain": "Równowaga europejska miała zapobiec powstaniu nowego mocarstwa takiego jak Francja Napoleona."}, {"id": "q9", "type": "mc", "tag": "l2", "q": "Którego pojęcia dotyczy definicja: „proces rozwoju miast i wzrostu liczby ich mieszkańców”?", "options": ["industrializacja", "metropolia", "urbanizacja", "emigracja"], "answer": 2, "explain": "Urbanizacja – ludzie ze wsi przenosili się do miast, w których powstawały fabryki."}, {"id": "q10", "type": "mc", "tag": "l2", "q": "Którego pojęcia dotyczy definicja: „klasa robotników najemnych, którzy utrzymują się tylko z pracy własnych rąk”?", "options": ["proletariat", "burżuazja", "arystokracja", "ziemiaństwo"], "answer": 0, "explain": "Proletariusze nie mieli majątku i pracowali za niewielką płacę w fabrykach."}, {"id": "q11", "type": "mc", "tag": "l2", "q": "Którego pojęcia dotyczy definicja: „bogaci mieszczanie – właściciele fabryk, banków, kopalń i domów handlowych”?", "options": ["arystokracja", "proletariat", "szlachta", "burżuazja"], "answer": 3, "explain": "Burżuazja posiadała środki produkcji i kapitał."}, {"id": "q12", "type": "mc", "tag": "l3", "q": "Którego pojęcia dotyczy definicja: „zorganizowane przerwanie pracy przez robotników w celu wymuszenia spełnienia ich żądań”?", "options": ["industrializacja", "związek zawodowy", "kapitał", "strajk"], "answer": 3, "explain": "Strajk był głównym sposobem walki robotników o lepsze warunki pracy; organizowały go często związki zawodowe."}, {"id": "q13", "type": "mc", "tag": "l3", "q": "Którego pojęcia dotyczy definicja: „ideologia głosząca wolność jednostki, równość wobec prawa, ochronę własności i ograniczenie władzy państwa”?", "options": ["konserwatyzm", "socjalizm", "liberalizm", "komunizm"], "answer": 2, "explain": "Liberalizm wyrósł z idei oświecenia i rewolucji francuskiej."}, {"id": "q14", "type": "mc", "tag": "l3", "q": "Którego pojęcia dotyczy definicja: „ideologia broniąca tradycji, religii i dawnego porządku; zmiany powinny być powolne, a nie rewolucyjne”?", "options": ["liberalizm", "komunizm", "konserwatyzm", "socjalizm"], "answer": 2, "explain": "Konserwatyści, np. Edmund Burke, krytykowali rewolucję francuską."}, {"id": "q15", "type": "match", "tag": "l1", "q": "Dopasuj uczestnika kongresu wiedeńskiego do jego roli.", "pairs": [["Aleksander I", "car Rosji, inicjator Świętego Przymierza"], ["Klemens Metternich", "austriacki minister spraw zagranicznych, gospodarz kongresu"], ["Charles Talleyrand", "przedstawiciel pokonanej Francji"], ["Robert Castlereagh", "przedstawiciel Wielkiej Brytanii"], ["Fryderyk Wilhelm III", "król Prus"]], "explain": "Najważniejsze decyzje podejmowały Rosja, Austria, Prusy i Wielka Brytania, a Talleyrand zręcznie bronił interesów Francji."}, {"id": "q16", "type": "match", "tag": "l2", "q": "Dopasuj wynalazcę do wynalazku.", "pairs": [["James Watt", "ulepszona maszyna parowa"], ["Jerzy Stephenson", "parowóz (lokomotywa) „Rakieta”"], ["Robert Fulton", "statek parowy"], ["Samuel Morse", "telegraf elektryczny"], ["Edmund Cartwright", "krosno mechaniczne"]], "explain": "Te wynalazki zmieniły przemysł (maszyna parowa, krosno), transport (parowóz, statek) i łączność (telegraf)."}, {"id": "q17", "type": "match", "tag": "l3", "q": "Dopasuj myśliciela do ideologii.", "pairs": [["Adam Smith", "liberalizm ekonomiczny"], ["Edmund Burke", "konserwatyzm"], ["Karol Marks i Fryderyk Engels", "komunizm"], ["Robert Owen", "socjalizm utopijny"]], "explain": "Smith bronił wolnego rynku, Burke tradycji, Owen marzył o idealnych osadach robotniczych, a Marks i Engels o rewolucji proletariatu."}, {"id": "q18", "type": "match", "tag": "l4", "q": "Dopasuj postać do wydarzenia.", "pairs": [["Mikołaj I", "stłumienie powstania dekabrystów (1825)"], ["Karol X", "obalony w rewolucji lipcowej (1830)"], ["Lajos Kossuth", "przywódca powstania węgierskiego (1848–1849)"], ["Napoleon Bonaparte", "„sto dni” i klęska pod Waterloo (1815)"], ["Aleksander II", "uwłaszczenie chłopów w Rosji (1861)"]], "explain": "Postacie te łączą się z kolejnymi etapami walki o zmiany w XIX-wiecznej Europie."}, {"id": "q19", "type": "short", "tag": "l1", "q": "Dokończ zdanie: Po klęsce pod Waterloo Napoleon został zesłany na wyspę …", "accept": ["Świętą Helenę", "Święta Helena", "Świętej Heleny", "św. Helena", "Helena", "Helenę"], "explain": "Napoleon zmarł na Wyspie Świętej Heleny na Atlantyku w 1821 r. (wcześniej, w 1814 r., był zesłany na Elbę)."}, {"id": "q20", "type": "short", "tag": "l2", "q": "Dokończ zdanie: Rewolucja przemysłowa rozpoczęła się w XVIII wieku w …", "accept": ["Anglii", "Anglia", "Wielkiej Brytanii", "Wielka Brytania", "Brytanii"], "explain": "Anglia miała węgiel, rudę żelaza, kapitał z handlu i kolonii oraz tanią siłę roboczą."}, {"id": "q21", "type": "short", "tag": "l3", "q": "Dokończ zdanie: Manifest komunistyczny (1848) napisali Karol Marks i Fryderyk …", "accept": ["Engels", "Engelsa"], "explain": "Marks i Engels wzywali proletariuszy do rewolucji i zniesienia własności prywatnej."}, {"id": "q22", "type": "short", "tag": "l1", "q": "Dokończ zdanie: Święte Przymierze zawarły w 1815 r. Rosja, Prusy i …", "accept": ["Austria", "Austrię", "Austrii"], "explain": "Do sojuszu należeli car Rosji, król Prus i cesarz Austrii."}, {"id": "q23", "type": "short", "tag": "l5", "q": "Dokończ zdanie: Wojnę krymską zakończył pokój podpisany w 1856 r. w …", "accept": ["Paryżu", "Paryż"], "explain": "Pokój paryski (1856) zakazał utrzymywania floty wojennej na Morzu Czarnym."}, {"id": "q24", "type": "short", "tag": "l4", "q": "Dokończ zdanie: Na czele powstania węgierskiego w czasie Wiosny Ludów stał Lajos (Ludwik) …", "accept": ["Kossuth", "Kosut", "Koszut"], "explain": "Powstanie węgierskie stłumiła w 1849 r. Austria z pomocą armii rosyjskiej."}, {"id": "q25", "type": "mc", "tag": "l1", "q": "Dokończ zdanie: Z większości ziem Księstwa Warszawskiego kongres wiedeński utworzył …", "options": ["niepodległą Rzeczpospolitą", "Wielkie Księstwo Poznańskie", "Królestwo Polskie połączone z Rosją", "Wolne Miasto Kraków"], "answer": 2, "explain": "Królem Polski został car Aleksander I; Kraków stał się wolnym miastem, a Wielkie Księstwo Poznańskie przypadło Prusom."}, {"id": "q26", "type": "mc", "tag": "l2", "q": "Dokończ zdanie: Na kolei Manchester–Liverpool (1830) jeździły parowozy skonstruowane przez …", "options": ["Roberta Fultona", "Jerzego Stephensona", "Jamesa Watta", "Samuela Morse’a"], "answer": 1, "explain": "Parowóz „Rakieta” Stephensona wygrał w 1829 r. konkurs na lokomotywę dla tej linii."}, {"id": "q27", "type": "mc", "tag": "l5", "q": "Co było przyczyną wojny krymskiej?", "options": ["Chęć przyłączenia Krymu przez Wielką Brytanię", "Wybuch powstania listopadowego", "Spór o kolonie w Afryce", "Dążenie Rosji do kontroli nad cieśninami Bosfor i Dardanele kosztem słabnącej Turcji"], "answer": 3, "explain": "Rosja, pod pretekstem opieki nad prawosławnymi w Turcji, chciała opanować cieśniny i osłabić Turcję."}, {"id": "q28", "type": "mc", "tag": "l5", "q": "Jaki był skutek wojny krymskiej dla Rosji?", "options": ["Zdobycie Konstantynopola", "Zawarcie Świętego Przymierza", "Zakaz utrzymywania floty wojennej na Morzu Czarnym i konieczność reform, m.in. uwłaszczenia chłopów (1861)", "Przejęcie kontroli nad Bosforem i Dardanelami"], "answer": 2, "explain": "Klęska pokazała zacofanie Rosji, dlatego car Aleksander II przeprowadził reformy."}, {"id": "q29", "type": "mc", "tag": "l2", "q": "Dlaczego rewolucja przemysłowa zaczęła się właśnie w Anglii?", "options": ["Anglia nie posiadała żadnych kolonii", "Anglia miała złoża węgla i rudy żelaza, kapitał z handlu i kolonii oraz tanią siłę roboczą", "Anglia była krajem bez miast", "W Anglii zakazano handlu zagranicznego"], "answer": 1, "explain": "Połączenie surowców, pieniędzy i rąk do pracy sprzyjało budowie fabryk."}, {"id": "q30", "type": "mc", "tag": "l2", "q": "Który z poniższych był skutkiem rewolucji przemysłowej?", "options": ["Powrót do gospodarki opartej na pracy ręcznej", "Zanik handlu morskiego", "Szybki rozwój miast (urbanizacja) i powstanie licznej klasy robotników – proletariatu", "Spadek liczby mieszkańców miast"], "answer": 2, "explain": "Fabryki przyciągały ludzi ze wsi, więc miasta szybko rosły."}, {"id": "q31", "type": "mc", "tag": "l1", "q": "Jaki był główny cel zawarcia Świętego Przymierza?", "options": ["Pomoc Grekom w walce z Turcją", "Zjednoczenie Niemiec", "Walka z Napoleonem w czasie „stu dni”", "Obrona porządku ustalonego na kongresie wiedeńskim i wspólne tłumienie ruchów rewolucyjnych i narodowych"], "answer": 3, "explain": "Monarchowie Rosji, Austrii i Prus zobowiązali się wspierać nawzajem przeciw rewolucjom."}, {"id": "q32", "type": "mc", "tag": "l3", "q": "Dlaczego robotnicy zakładali związki zawodowe i organizowali strajki?", "options": ["Z powodu bardzo długiego czasu pracy, niskich płac i złych warunków w fabrykach", "Bo chcieli przywrócenia dawnych dynastii", "Bo domagali się wojny z Rosją", "Bo nie chcieli rozwoju kolei"], "answer": 0, "explain": "Robotnicy pracowali nawet 14–16 godzin dziennie (także dzieci) za bardzo niskie płace."}, {"id": "q33", "type": "mc", "tag": "l4", "q": "Jaki był skutek rewolucji lipcowej 1830 r. we Francji?", "options": ["Ogłoszenie republiki", "Powrót Napoleona do władzy", "Obalenie Karola X i objęcie tronu przez Ludwika Filipa", "Przyłączenie Belgii do Francji"], "answer": 2, "explain": "Rewolucja lipcowa obaliła Karola X z dynastii Burbonów; republikę (II Republikę) ogłoszono dopiero w 1848 r."}, {"id": "q34", "type": "cat", "tag": "l4", "q": "Lata 1825–1831: czy zryw zakończył się sukcesem?", "categories": ["Udało się", "Nie udało się"], "items": [{"t": "Powstanie dekabrystów w Rosji (1825)", "c": 1}, {"t": "Rewolucja lipcowa we Francji (1830)", "c": 0}, {"t": "Walka Greków o niepodległość (uznana w 1830)", "c": 0}, {"t": "Rewolucja w Belgii (1830–1831)", "c": 0}, {"t": "Powstanie listopadowe (1830–1831)", "c": 1}], "explain": "Udało się Francuzom (obalenie Karola X), Grekom i Belgom (pomoc mocarstw). Dekabrystów stłumił Mikołaj I, a powstanie listopadowe przegrało z Rosją."}, {"id": "q35", "type": "cat", "tag": "l4", "q": "Wiosna Ludów 1848–1849: czy cel został osiągnięty?", "categories": ["Udało się", "Nie udało się"], "items": [{"t": "Powstanie Węgrów pod wodzą Kossutha", "c": 1}, {"t": "Walka Włochów o wyzwolenie spod władzy Austrii i zjednoczenie", "c": 1}, {"t": "Zjednoczenie Niemiec przez parlament frankfurcki", "c": 1}, {"t": "Obalenie monarchii we Francji i ogłoszenie republiki (1848)", "c": 0}, {"t": "Zniesienie pańszczyzny w cesarstwie austriackim (1848)", "c": 0}], "explain": "Węgrów pokonała Austria z pomocą Rosji, Włochów – Austria, a król Prus odrzucił koronę z rąk parlamentu frankfurckiego. Udało się obalić monarchię we Francji i znieść pańszczyznę w Austrii."}, {"id": "q36", "type": "mc", "tag": "l1", "q": "Przeczytaj źródło. Jak nazywał się sojusz, którego dotyczy tekst?", "options": ["Święte Przymierze", "Związek Niemiecki", "Wielka koalicja antyrosyjska", "Królestwo Niderlandów"], "answer": 0, "explain": "To fragment aktu Świętego Przymierza zawartego przez monarchów Austrii, Prus i Rosji.", "source": "„W imię Przenajświętszej i Niepodzielnej Trójcy! Ich Królewskie Mości: Cesarz Austrii, Król Pruski i Cesarz Wszechrosji […] postanowili: trzej monarchowie pozostaną złączeni węzłami prawdziwego i nierozerwalnego braterstwa i […] w każdym czasie i w każdym miejscu udzielać sobie będą wsparcia, pomocy i opieki.” (Akt Świętego Przymierza, 1815, fragment)"}, {"id": "q37", "type": "mc", "tag": "l1", "q": "Przeczytaj źródło. W którym roku zawarto ten sojusz i kto był jego inicjatorem?", "options": ["1848, król Fryderyk Wilhelm III", "1856, Klemens Metternich", "1815, car Aleksander I", "1830, car Mikołaj I"], "answer": 2, "explain": "Święte Przymierze zaproponował car Aleksander I we wrześniu 1815 r.", "source": "„W imię Przenajświętszej i Niepodzielnej Trójcy! Ich Królewskie Mości: Cesarz Austrii, Król Pruski i Cesarz Wszechrosji […] postanowili: trzej monarchowie pozostaną złączeni węzłami prawdziwego i nierozerwalnego braterstwa i […] w każdym czasie i w każdym miejscu udzielać sobie będą wsparcia, pomocy i opieki.” (Akt Świętego Przymierza, 1815, fragment)"}, {"id": "q38", "type": "mc", "tag": "l3", "q": "Przeczytaj źródło. Z jakiego dzieła pochodzi fragment i kto jest jego autorem?", "options": ["Akt końcowy kongresu wiedeńskiego – Metternich", "„Bogactwo narodów” – Adam Smith", "„Rozważania o rewolucji we Francji” – Edmund Burke", "„Manifest komunistyczny” – Karol Marks i Fryderyk Engels"], "answer": 3, "explain": "Hasło „Proletariusze wszystkich krajów, łączcie się!” kończy Manifest komunistyczny (1848).", "source": "„Historia wszelkiego dotychczasowego społeczeństwa jest historią walk klasowych. […] Niech drżą panujące klasy przed rewolucją komunistyczną. Proletariusze nie mają w niej nic do stracenia prócz swych kajdan. Do zdobycia mają cały świat. Proletariusze wszystkich krajów, łączcie się!” (fragment dzieła z 1848 r.)"}, {"id": "q39", "type": "mc", "tag": "l3", "q": "Przeczytaj źródło. Jaki sposób zmiany społeczeństwa proponują autorzy tekstu?", "options": ["Stopniowe reformy i współpracę robotników z fabrykantami", "Rewolucję proletariatu i zniesienie własności prywatnej", "Wolny rynek bez żadnej ingerencji państwa", "Powrót do porządku sprzed rewolucji francuskiej"], "answer": 1, "explain": "Komuniści głosili walkę klas i rewolucję – w przeciwieństwie do łagodniejszych socjalistów.", "source": "„Historia wszelkiego dotychczasowego społeczeństwa jest historią walk klasowych. […] Niech drżą panujące klasy przed rewolucją komunistyczną. Proletariusze nie mają w niej nic do stracenia prócz swych kajdan. Do zdobycia mają cały świat. Proletariusze wszystkich krajów, łączcie się!” (fragment dzieła z 1848 r.)"}, {"id": "q40", "type": "mc", "tag": "l5", "q": "Przeczytaj źródło. Które pokonane państwo straciło przez to postanowienie flotę wojenną na Morzu Czarnym i po jakiej wojnie je wprowadzono?", "options": ["Rosja – po wojnie krymskiej", "Francja – po kongresie wiedeńskim", "Austria – po Wiośnie Ludów", "Wielka Brytania – po wojnach napoleońskich"], "answer": 0, "explain": "Pokój paryski (1856) zakazał okrętów wojennych na Morzu Czarnym, co uderzało przede wszystkim w Rosję.", "source": "„Morze Czarne zostaje zneutralizowane: jego wody i porty, otwarte dla żeglugi handlowej wszystkich narodów, są formalnie i na zawsze zamknięte dla okrętów wojennych […].” (traktat pokojowy z 1856 r., fragment)"}, {"id": "q41", "type": "multi", "tag": "l5", "q": "Zaznacz WSZYSTKIE państwa, które walczyły przeciw Rosji w wojnie krymskiej.", "options": ["Austria", "Turcja", "Francja", "Królestwo Sardynii", "Prusy", "Wielka Brytania"], "answer": [1, 2, 3, 5], "explain": "Przeciw Rosji walczyły Turcja, Wielka Brytania, Francja i (od 1855 r.) Królestwo Sardynii. Prusy i Austria nie wzięły udziału w walkach."}, {"id": "q42", "type": "tf", "tag": "l1", "q": "Prawda czy fałsz?", "items": [{"s": "Akt końcowy kongresu wiedeńskiego podpisano po bitwie pod Waterloo.", "a": false}, {"s": "Inicjatorem Świętego Przymierza był car Aleksander I.", "a": true}, {"s": "Szwajcaria otrzymała na kongresie wiedeńskim wieczystą neutralność.", "a": true}], "explain": "Akt końcowy podpisano 9 VI 1815 r., a bitwa pod Waterloo była 18 VI 1815 r. Święte Przymierze zaproponował Aleksander I; neutralność Szwajcarii uznano w 1815 r."}], "explainPrompts": [{"id": "e1", "tag": "l1", "prompt": "Omów trzy zasady, którymi kierował się kongres wiedeński. Każdą wyjaśnij jednym zdaniem.", "keyPoints": ["restauracja – przywrócenie obalonych władców (np. Burbonów)", "legitymizm – władza należy się prawowitym, dziedzicznym monarchom", "równowaga europejska – żadne państwo nie może dominować"], "model": "Restauracja oznaczała przywrócenie na trony władców obalonych przez rewolucję francuską i Napoleona, np. Burbonów we Francji. Legitymizm głosił, że władza królewska jest święta i należy się tylko prawowitym, dziedzicznym monarchom. Równowaga europejska miała sprawić, że żadne państwo nie zdobędzie przewagi nad innymi, tak jak wcześniej Francja Napoleona."}, {"id": "e2", "tag": "l2", "prompt": "Wytłumacz koledze (jak YouTuber), jak rewolucja przemysłowa zmieniła życie ludzi. Użyj słów: fabryka, urbanizacja, proletariat, burżuazja.", "keyPoints": ["maszyna parowa i praca maszyn w fabrykach", "urbanizacja – ludzie przenoszą się do miast", "burżuazja – właściciele fabryk, proletariat – robotnicy", "ciężkie warunki pracy, strajki i związki zawodowe", "nowy transport: kolej, statki parowe"], "model": "Dzięki maszynie parowej Watta powstały fabryki, w których pracowały maszyny. Ludzie ze wsi przenosili się do miast, by tam pracować – to urbanizacja. Właściciele fabryk tworzyli bogatą burżuazję, a robotnicy – ubogi proletariat, który pracował po 14–16 godzin i dlatego organizował strajki i związki zawodowe. Zmienił się też transport: pojawiły się koleje i statki parowe."}, {"id": "e3", "tag": "l3", "prompt": "Porównaj liberalizm, konserwatyzm, socjalizm i komunizm: co było najważniejsze dla każdej z tych ideologii?", "keyPoints": ["liberalizm – wolność jednostki, wolny rynek (Smith)", "konserwatyzm – tradycja, religia, Kościół (Burke)", "socjalizm – poprawa losu robotników", "komunizm – rewolucja, walka klas, zniesienie własności prywatnej (Marks, Engels)"], "model": "Dla liberałów najważniejsza była wolność jednostki, a Adam Smith dodał wolny rynek. Konserwatyści, jak Burke, bronili tradycji, religii i Kościoła. Socjaliści chcieli poprawić warunki życia i pracy robotników. Komuniści – Marks i Engels – wzywali do rewolucji proletariatu i zniesienia własności prywatnej."}, {"id": "e4", "tag": "l4", "prompt": "Wyjaśnij, którym narodom udało się wygrać ze Świętym Przymierzem w latach 1825–1849, a którym nie – i dlaczego.", "keyPoints": ["sukces: Grecja (1830), Belgia (1830–1831), Francja (1830, 1848)", "klęska: dekabryści (1825), powstanie listopadowe", "klęska w Wiośnie Ludów: Węgry (Kossuth), Włosi, parlament frankfurcki", "sukces zależał od pomocy mocarstw / interwencji Rosji i Austrii"], "model": "Udało się Grekom i Belgom, bo poparły ich mocarstwa, oraz Francuzom, którzy w 1830 r. obalili Karola X, a w 1848 r. ogłosili republikę. Nie udało się dekabrystom w Rosji ani Polakom w powstaniu listopadowym. W czasie Wiosny Ludów przegrali Węgrzy Kossutha, Włosi i parlament frankfurcki, bo Austria i Rosja wspólnie tłumiły rewolucje."}, {"id": "e5", "tag": "l5", "prompt": "Opowiedz o wojnie krymskiej: przyczyny, strony konfliktu i skutki.", "keyPoints": ["przyczyny: cieśniny Bosfor i Dardanele, osłabienie Turcji, opieka nad prawosławnymi", "strony: Rosja vs Turcja, Wielka Brytania, Francja, Sardynia", "oblężenie Sewastopola", "skutki: klęska Rosji, pokój paryski 1856, zakaz floty na Morzu Czarnym, uwłaszczenie 1861"], "model": "Rosja chciała opanować cieśniny Bosfor i Dardanele i osłabić Turcję, a pretekstem była opieka nad prawosławnymi. Przeciw Rosji stanęły Turcja, Wielka Brytania, Francja i Sardynia. Najważniejsze było oblężenie Sewastopola. Rosja przegrała, w pokoju paryskim (1856) zakazano jej floty wojennej na Morzu Czarnym, a car Aleksander II musiał przeprowadzić reformy, m.in. uwłaszczenie chłopów w 1861 r."}], "mockTest": {"title": "Karta z lekcji – Zad. 1–9 (wierna kopia)", "minutes": 40, "intro": "To jest **interaktywna kopia karty powtórzeniowej z lekcji** (zadania 1–9, oryginalne polecenia). Pracuj jak na sprawdzianie: bez podręcznika. Po oddaniu przy każdym zadaniu zobaczysz wyjaśnienie. Drugi test – **Sprawdzian próbny (40 pytań)** – wybierzesz przyciskiem na górze tej zakładki.", "gradeScale": [[0, "niedostateczny"], [30, "dopuszczający"], [50, "dostateczny"], [70, "dobry"], [90, "bardzo dobry"], [98, "celujący"]], "tasks": [{"id": "m1", "type": "order", "tag": "l1", "q": "Zadanie 1. Uporządkuj wydarzenia w kolejności chronologicznej (od 1 do 4).", "items": ["Początek kongresu wiedeńskiego", "100 dni Napoleona", "Uzyskanie niepodległości przez Grecję", "Wojna krymska"], "explain": "1 – początek kongresu wiedeńskiego (1814); 2 – 100 dni Napoleona (1815); 3 – niepodległość Grecji (1830); 4 – wojna krymska (1853–1856).", "points": 2}, {"id": "m2", "type": "match", "tag": "l1", "q": "Zadanie 2. Dopasuj pojęcia do definicji.", "pairs": [["Proces przekształcania gospodarki polegający na zwiększaniu udziału pracy maszyn i zatrudnienia w przemyśle", "industrializacja"], ["Ideologia, zgodnie z którą najważniejszy jest swobodny rozwój i wolność jednostki", "liberalizm"], ["Najuboższa warstwa robotników", "proletariat"], ["Zasada kongresu wiedeńskiego, według której władza królewska jest święta i nienaruszalna", "legitymizm"], ["Proces szybkiego rozwoju miast towarzyszący rewolucji przemysłowej", "urbanizacja"], ["Ideologia, w której ważne są tradycja, silna pozycja Kościoła i religia", "konserwatyzm"], ["Grupa społeczna powstała w wyniku rewolucji przemysłowej – właściciele środków produkcji", "burżuazja"], ["Zasada kongresu wiedeńskiego – przywrócenie na trony władców obalonych w trakcie rewolucji francuskiej i wojen napoleońskich", "restauracja"]], "explain": "Industrializacja – uprzemysłowienie; liberalizm (łac. liber – wolny) – wolność jednostki; proletariat – najubożsi robotnicy żyjący z pracy najemnej; legitymizm – władza prawowitych monarchów; urbanizacja – rozwój miast; konserwatyzm – tradycja i religia; burżuazja – właściciele fabryk, banków, kopalń; restauracja – powrót obalonych dynastii (np. Burbonów)."}, {"id": "m3", "type": "multi", "tag": "l2", "q": "Zadanie 3. Przeczytaj tekst źródłowy. Podaj dwa zastosowania wynalazku (parowozu), o którym mowa w tekście – zaznacz DWIE odpowiedzi.", "options": ["Przewóz pasażerów koleją", "Przesyłanie wiadomości na odległość", "Tkanie materiałów w fabrykach", "Transport towarów i surowców (np. węgla, bawełny)", "Żegluga po rzekach i morzach"], "answer": [0, 3], "explain": "Parowóz ciągnął pociągi z pasażerami oraz towarami i surowcami – linia Manchester–Liverpool łączyła ośrodek przemysłu bawełnianego z portem. Wiadomości przesyłał telegraf (Morse), po wodzie pływał statek parowy (Fulton), a tkało krosno mechaniczne (Cartwright).", "source": "„Stephenson, wielki inżynier, opowiadał [...], że jechał [...] [na trasie] Manchester–Liverpool przez wiele mil, z szybkością jednej mili na minutę i że problem polega dla niego nie na tym, jak wielką szybkość jego maszyny mogą osiągnąć, gdyż potrafi uczynić je bardziej chyżymi od ptaka przeszywającego powietrze, lecz na jakiej szybkości należy przestać.”", "points": 2}, {"id": "m4", "type": "match", "tag": "l4", "q": "Zadanie 4. Przyporządkuj postaciom wydarzenia, z którymi są związane.", "pairs": [["Aleksander I", "kongres wiedeński, inicjator Świętego Przymierza"], ["Samuel Morse", "wynalezienie telegrafu"], ["Karol X", "obalony w rewolucji lipcowej 1830 r."], ["Mikołaj I", "stłumienie powstania dekabrystów (1825), wojna krymska"], ["Lajos Kossuth", "Wiosna Ludów na Węgrzech (1848–1849)"], ["Klemens Metternich", "gospodarz kongresu wiedeńskiego, kanclerz Austrii"]], "explain": "Aleksander I – car Rosji na kongresie i twórca Świętego Przymierza; Morse – telegraf i alfabet Morse’a; Karol X – król Francji obalony w lipcu 1830 r.; Mikołaj I – stłumił dekabrystów i rozpoczął wojnę krymską; Kossuth – przywódca Węgrów w latach 1848–1849; Metternich – gospodarz kongresu (minister spraw zagranicznych, od 1821 r. kanclerz Austrii)."}, {"id": "m5_1", "type": "mc", "tag": "l3", "q": "Zadanie 5.1. Ideologia społeczna, której przedstawiciele dążyli m.in. do poprawy warunków życia i pracy robotników:", "options": ["liberalizm", "konserwatyzm", "legitymizm", "socjalizm"], "answer": 3, "explain": "Socjalizm powstał w odpowiedzi na nędzę robotników i domagał się poprawy ich losu."}, {"id": "m5_2", "type": "mc", "tag": "l2", "q": "Zadanie 5.2. Imię i nazwisko twórcy maszyny parowej:", "options": ["Jerzy Stephenson", "Edmund Cartwright", "Robert Fulton", "James Watt"], "answer": 3, "explain": "James Watt w 2. połowie XVIII w. udoskonalił maszynę parową (patent 1769), która stała się napędem fabryk."}, {"id": "m5_3", "type": "mc", "tag": "l2", "q": "Zadanie 5.3. Duże miasto stanowiące centrum administracyjne, gospodarcze i kulturalne:", "options": ["kolonia", "urbanizacja", "fabryka", "metropolia"], "answer": 3, "explain": "Metropolia to wielkie miasto – ośrodek władzy, gospodarki i kultury, np. Londyn."}, {"id": "m5_4", "type": "mc", "tag": "l5", "q": "Zadanie 5.4. Jedna z cieśnin łączących Morze Śródziemne z Morzem Czarnym:", "options": ["Bosfor", "Gibraltar", "Kanał La Manche", "Sund"], "answer": 0, "explain": "Morze Czarne łączy się z Morzem Śródziemnym przez Bosfor i Dardanele (oraz Morze Marmara) – o nie toczyła się wojna krymska."}, {"id": "m5_5", "type": "mc", "tag": "l3", "q": "Zadanie 5.5. Nazwisko jednego z twórców Manifestu komunistycznego:", "options": ["Marks", "Owen", "Burke", "Smith"], "answer": 0, "explain": "Manifest komunistyczny (1848) napisali Karol Marks i Fryderyk Engels."}, {"id": "m5_6", "type": "mc", "tag": "l1", "q": "Zadanie 5.6. Imię rosyjskiego cara, uczestnika kongresu wiedeńskiego:", "options": ["Aleksander II", "Aleksander I", "Mikołaj I", "Piotr I"], "answer": 1, "explain": "Na kongresie wiedeńskim Rosję reprezentował osobiście car Aleksander I."}, {"id": "m5_7", "type": "mc", "tag": "l4", "q": "Zadanie 5.7. Imię rosyjskiego cara, który stłumił powstanie dekabrystów:", "options": ["Mikołaj I", "Piotr I", "Aleksander II", "Aleksander I"], "answer": 0, "explain": "Powstanie dekabrystów wybuchło w grudniu 1825 r. przy wstąpieniu na tron Mikołaja I, który je stłumił."}, {"id": "m5_8", "type": "mc", "tag": "l2", "q": "Zadanie 5.8. Środki finansowe, które są inwestowane, aby powiększyć zyski:", "options": ["związek zawodowy", "kapitał", "metropolia", "burżuazja"], "answer": 1, "explain": "Kapitał to pieniądze (i majątek) inwestowane np. w fabryki, aby przynosiły zysk."}, {"id": "m5_9", "type": "mc", "tag": "l2", "q": "Zadanie 5.9. Miejsce pracy robotników:", "options": ["parlament", "metropolia", "giełda", "fabryka"], "answer": 3, "explain": "W fabrykach robotnicy pracowali przy maszynach, często napędzanych parą."}, {"id": "m5_10", "type": "mc", "tag": "l4", "q": "Zadanie 5.10. Miasto obrad ogólnoniemieckiego parlamentu podczas Wiosny Ludów:", "options": ["Frankfurt nad Menem", "Wiedeń", "Monachium", "Berlin"], "answer": 0, "explain": "W latach 1848–1849 we Frankfurcie nad Menem obradował parlament, który chciał zjednoczyć Niemcy."}, {"id": "m5_11", "type": "mc", "tag": "l2", "q": "Zadanie 5.11. Nazwisko wynalazcy lokomotywy parowej:", "options": ["Morse", "Watt", "Stephenson", "Fulton"], "answer": 2, "explain": "Jerzy Stephenson zbudował parowóz „Rakieta”, który jeździł na linii Manchester–Liverpool (1830)."}, {"id": "m5_12", "type": "mc", "tag": "l3", "q": "Zadanie 5.12. Nazwisko jednego z głównych ideologów konserwatyzmu:", "options": ["Smith", "Owen", "Marks", "Burke"], "answer": 3, "explain": "Edmund Burke (obok Josepha de Maistre’a) był głównym myślicielem konserwatyzmu."}, {"id": "m6", "type": "mc", "tag": "l1", "q": "Zadanie 6. Czym było Święte Przymierze?", "options": ["Związkiem państw niemieckich pod przewodnictwem Austrii", "Porozumieniem rewolucjonistów walczących o niepodległość swoich narodów", "Sojuszem Rosji, Austrii i Prus z 1815 r., którego celem była obrona porządku wiedeńskiego i tłumienie rewolucji", "Sojuszem Wielkiej Brytanii, Francji i Turcji przeciw Rosji w wojnie krymskiej"], "answer": 2, "explain": "Święte Przymierze zawarli 26 IX 1815 r. car Aleksander I, cesarz Austrii Franciszek I i król Prus Fryderyk Wilhelm III, by wspólnie bronić monarchii i ładu wiedeńskiego."}, {"id": "m7", "type": "multi", "tag": "l1", "q": "Zadanie 7. Omów trzy zasady, na których opierał się system kongresu wiedeńskiego – zaznacz TRZY zasady.", "options": ["Restauracja", "Legitymizm", "Wolny handel", "Suwerenność ludu", "Równowaga europejska", "Prawo narodów do niepodległości"], "answer": [0, 1, 4], "explain": "Restauracja – przywrócenie dynastii obalonych przez rewolucję i Napoleona; legitymizm – władza należy się prawowitym, dziedzicznym monarchom; równowaga europejska – żadne państwo nie może dominować. Suwerenność ludu to idea rewolucji francuskiej, prawa narodów kongres pomijał (np. Polaków), a wolny handel to postulat liberalizmu ekonomicznego.", "points": 3}, {"id": "m8", "type": "match", "tag": "l5", "q": "Zadanie 8. Uzupełnij tabelę: przyporządkuj każdemu wydarzeniu jego przyczynę i skutek.", "pairs": [["Kongres wiedeński – przyczyna", "klęska Napoleona i potrzeba ustalenia nowego ładu w Europie"], ["Kongres wiedeński – skutek", "nowy podział Europy, przywrócenie dawnych dynastii, powstanie Świętego Przymierza"], ["Powstanie maszyny parowej – przyczyna", "potrzeba wydajnego napędu (np. do odwadniania kopalń i poruszania maszyn)"], ["Powstanie maszyny parowej – skutek", "rozwój fabryk, kolei i statków parowych – rewolucja przemysłowa"], ["Wojna krymska – przyczyna", "dążenie Rosji do opanowania cieśnin Bosfor i Dardanele kosztem słabnącej Turcji"], ["Wojna krymska – skutek", "klęska Rosji, pokój paryski (1856), reformy w Rosji – uwłaszczenie chłopów (1861)"], ["Powstanie w Grecji – przyczyna", "wieloletnie panowanie i ucisk Greków przez Turcję"], ["Powstanie w Grecji – skutek", "uzyskanie niepodległości przez Grecję (1830)"]], "explain": "Kongres zwołano po upadku Napoleona i ułożył on nową mapę Europy; maszynę parową udoskonalono, bo potrzebny był silny napęd, a ona zapoczątkowała rewolucję przemysłową; Rosja walczyła o cieśniny i przegrała z koalicją Turcji, Wielkiej Brytanii, Francji i Sardynii; Grecy zbuntowali się przeciw panowaniu tureckiemu i z pomocą mocarstw zdobyli niepodległość."}, {"id": "m9a", "type": "mc", "tag": "l2", "q": "Zadanie 9. a) Podaj osobę, która udoskonaliła maszynę parową.", "options": ["Robert Fulton", "Jerzy Stephenson", "Samuel Morse", "James Watt"], "answer": 3, "explain": "James Watt ulepszył maszynę parową (patent z 1769 r.), dzięki czemu można ją było stosować w fabrykach."}, {"id": "m9b", "type": "mc", "tag": "l2", "q": "Zadanie 9. b) Podaj jeden skutek zastosowania maszyny parowej.", "options": ["Upadek górnictwa węglowego", "Spadek produkcji tkanin", "Napęd maszyn w fabrykach i szybki rozwój przemysłu, a potem kolei i statków parowych", "Powrót do ręcznej pracy w manufakturach"], "answer": 2, "explain": "Maszyna parowa napędzała maszyny w fabrykach, parowozy i statki – zapoczątkowała rewolucję przemysłową (rosło też zapotrzebowanie na węgiel)."}]}, "mocks": [{"id": "sprawdzian-probny", "title": "Sprawdzian próbny – 40 pytań", "minutes": 45, "intro": "Sprawdzian próbny w 7 częściach, jak na karcie powtórzeniowej: chronologia, pojęcia, postacie i wydarzenia, dokończ zdania, przyczyny i skutki, udało się / nie udało się, tekst źródłowy. Pracuj bez podręcznika; po oddaniu przy każdym pytaniu zobaczysz wyjaśnienie, a błędne pytania trafią do zakładki **Błędy**.", "gradeScale": [[0, "niedostateczny"], [30, "dopuszczający"], [50, "dostateczny"], [70, "dobry"], [90, "bardzo dobry"], [98, "celujący"]], "tasks": [{"id": "p1", "type": "order", "tag": "l1", "q": "Część 1. Chronologia · Pytanie 1. Ułóż wydarzenia z lat 1814–1815 w kolejności chronologicznej.", "items": ["Rozpoczęcie obrad kongresu wiedeńskiego", "Powrót Napoleona z Elby – początek „stu dni”", "Podpisanie aktu końcowego kongresu wiedeńskiego", "Bitwa pod Waterloo", "Zawarcie Świętego Przymierza"], "explain": "IX 1814 → III 1815 → 9 VI 1815 → 18 VI 1815 → 26 IX 1815. Akt końcowy podpisano 9 dni przed Waterloo."}, {"id": "p2", "type": "order", "tag": "l2", "q": "Część 1. Chronologia · Pytanie 2. Ułóż wynalazki w kolejności chronologicznej.", "items": ["Ulepszenie maszyny parowej przez Jamesa Watta", "Krosno mechaniczne Edmunda Cartwrighta", "Statek parowy Roberta Fultona", "Otwarcie kolei Manchester–Liverpool", "Telegraf Samuela Morse’a"], "explain": "1769 → 1785 → 1807 → 1830 → 1837/1844. Najpierw udoskonalono maszynę parową, potem zastosowano ją w przemyśle i transporcie."}, {"id": "p3", "type": "order", "tag": "l4", "q": "Część 1. Chronologia · Pytanie 3. Ułóż wydarzenia w kolejności chronologicznej.", "items": ["Powstanie dekabrystów w Rosji", "Rewolucja lipcowa we Francji", "Wybuch powstania listopadowego", "Wiosna Ludów", "Wojna krymska"], "explain": "XII 1825 → VII 1830 → XI 1830 → 1848–1849 → 1853–1856. Rewolucja lipcowa zachęciła m.in. Polaków do walki."}, {"id": "p4", "type": "order", "tag": "l3", "q": "Część 1. Chronologia · Pytanie 4. Ułóż wydarzenia w kolejności chronologicznej.", "items": ["Wydanie dzieła Adama Smitha „Bogactwo narodów”", "Kongres wiedeński", "Ogłoszenie Manifestu komunistycznego", "Oblężenie Sewastopola", "Uwłaszczenie chłopów w Rosji"], "explain": "1776 → 1814–1815 → 1848 → 1854–1855 → 1861."}, {"id": "p5", "type": "match", "tag": "l1", "q": "Część 1. Chronologia · Pytanie 5. Przyporządkuj wydarzeniom właściwe daty.", "pairs": [["Bitwa pod Waterloo", "1815"], ["Powstanie dekabrystów", "1825"], ["Otwarcie kolei Manchester–Liverpool", "1830"], ["Manifest komunistyczny", "1848"], ["Pokój paryski kończący wojnę krymską", "1856"]], "explain": "Waterloo 1815, dekabryści 1825, kolej Manchester–Liverpool 1830, Manifest komunistyczny 1848, pokój paryski 1856 – to „szkielet” historii Europy 1815–1856."}, {"id": "p6", "type": "mc", "tag": "l1", "q": "Część 2. Pojęcia · Pytanie 6. Którego pojęcia dotyczy definicja: „przywrócenie władzy dynastiom panującym przed rewolucją francuską i Napoleonem oraz dawnego porządku”?", "options": ["restauracja", "legitymizm", "liberalizm", "równowaga europejska"], "answer": 0, "explain": "Restauracja oznaczała m.in. powrót Burbonów na tron Francji (Ludwik XVIII)."}, {"id": "p7", "type": "mc", "tag": "l1", "q": "Część 2. Pojęcia · Pytanie 7. Którego pojęcia dotyczy definicja: „władza należy się wyłącznie prawowitym, dziedzicznym monarchom”?", "options": ["legitymizm", "konserwatyzm", "równowaga europejska", "restauracja"], "answer": 0, "explain": "Legitymizm uznawał za prawowitą tylko władzę panujących dynastii – władza królewska jest święta i nienaruszalna."}, {"id": "p8", "type": "mc", "tag": "l1", "q": "Część 2. Pojęcia · Pytanie 8. Którego pojęcia dotyczy definicja: „żadne państwo w Europie nie może uzyskać przewagi nad pozostałymi”?", "options": ["równowaga europejska", "industrializacja", "legitymizm", "restauracja"], "answer": 0, "explain": "Równowaga europejska miała zapobiec powstaniu nowego mocarstwa takiego jak Francja Napoleona."}, {"id": "p9", "type": "mc", "tag": "l2", "q": "Część 2. Pojęcia · Pytanie 9. Którego pojęcia dotyczy definicja: „proces rozwoju miast i wzrostu liczby ich mieszkańców”?", "options": ["industrializacja", "metropolia", "urbanizacja", "emigracja"], "answer": 2, "explain": "Urbanizacja – ludzie ze wsi przenosili się do miast, w których powstawały fabryki."}, {"id": "p10", "type": "mc", "tag": "l2", "q": "Część 2. Pojęcia · Pytanie 10. Którego pojęcia dotyczy definicja: „klasa robotników najemnych, którzy utrzymują się tylko z pracy własnych rąk”?", "options": ["proletariat", "burżuazja", "arystokracja", "ziemiaństwo"], "answer": 0, "explain": "Proletariusze nie mieli majątku i pracowali za niewielką płacę w fabrykach."}, {"id": "p11", "type": "mc", "tag": "l2", "q": "Część 2. Pojęcia · Pytanie 11. Którego pojęcia dotyczy definicja: „bogaci mieszczanie – właściciele fabryk, banków, kopalń i domów handlowych”?", "options": ["arystokracja", "proletariat", "szlachta", "burżuazja"], "answer": 3, "explain": "Burżuazja posiadała środki produkcji i kapitał."}, {"id": "p12", "type": "mc", "tag": "l3", "q": "Część 2. Pojęcia · Pytanie 12. Którego pojęcia dotyczy definicja: „zorganizowane przerwanie pracy przez robotników w celu wymuszenia spełnienia ich żądań”?", "options": ["industrializacja", "związek zawodowy", "kapitał", "strajk"], "answer": 3, "explain": "Strajk był głównym sposobem walki robotników o lepsze warunki pracy; organizowały go często związki zawodowe."}, {"id": "p13", "type": "mc", "tag": "l3", "q": "Część 2. Pojęcia · Pytanie 13. Którego pojęcia dotyczy definicja: „ideologia głosząca wolność jednostki, równość wobec prawa, ochronę własności i ograniczenie władzy państwa”?", "options": ["konserwatyzm", "socjalizm", "liberalizm", "komunizm"], "answer": 2, "explain": "Liberalizm wyrósł z idei oświecenia i rewolucji francuskiej."}, {"id": "p14", "type": "mc", "tag": "l3", "q": "Część 2. Pojęcia · Pytanie 14. Którego pojęcia dotyczy definicja: „ideologia broniąca tradycji, religii i dawnego porządku; zmiany powinny być powolne, a nie rewolucyjne”?", "options": ["liberalizm", "komunizm", "konserwatyzm", "socjalizm"], "answer": 2, "explain": "Konserwatyści, np. Edmund Burke, krytykowali rewolucję francuską."}, {"id": "p15", "type": "match", "tag": "l1", "q": "Część 3. Postacie i wydarzenia · Pytanie 15. Dopasuj uczestnika kongresu wiedeńskiego do jego roli.", "pairs": [["Aleksander I", "car Rosji, inicjator Świętego Przymierza"], ["Klemens Metternich", "austriacki minister spraw zagranicznych, gospodarz kongresu"], ["Charles Talleyrand", "przedstawiciel pokonanej Francji"], ["Robert Castlereagh", "przedstawiciel Wielkiej Brytanii"], ["Fryderyk Wilhelm III", "król Prus"]], "explain": "Najważniejsze decyzje podejmowały Rosja, Austria, Prusy i Wielka Brytania, a Talleyrand zręcznie bronił interesów Francji."}, {"id": "p16", "type": "match", "tag": "l2", "q": "Część 3. Postacie i wydarzenia · Pytanie 16. Dopasuj wynalazcę do wynalazku.", "pairs": [["James Watt", "ulepszona maszyna parowa"], ["Jerzy Stephenson", "parowóz (lokomotywa) „Rakieta”"], ["Robert Fulton", "statek parowy"], ["Samuel Morse", "telegraf elektryczny"], ["Edmund Cartwright", "krosno mechaniczne"]], "explain": "Te wynalazki zmieniły przemysł (maszyna parowa, krosno), transport (parowóz, statek) i łączność (telegraf)."}, {"id": "p17", "type": "match", "tag": "l3", "q": "Część 3. Postacie i wydarzenia · Pytanie 17. Dopasuj myśliciela do ideologii.", "pairs": [["Adam Smith", "liberalizm ekonomiczny"], ["Edmund Burke", "konserwatyzm"], ["Karol Marks i Fryderyk Engels", "komunizm"], ["Robert Owen", "socjalizm utopijny"]], "explain": "Smith bronił wolnego rynku, Burke tradycji, Owen marzył o idealnych osadach robotniczych, a Marks i Engels o rewolucji proletariatu."}, {"id": "p18", "type": "match", "tag": "l4", "q": "Część 3. Postacie i wydarzenia · Pytanie 18. Dopasuj postać do wydarzenia.", "pairs": [["Mikołaj I", "stłumienie powstania dekabrystów (1825)"], ["Karol X", "obalony w rewolucji lipcowej (1830)"], ["Lajos Kossuth", "przywódca powstania węgierskiego (1848–1849)"], ["Napoleon Bonaparte", "„sto dni” i klęska pod Waterloo (1815)"], ["Aleksander II", "uwłaszczenie chłopów w Rosji (1861)"]], "explain": "Postacie te łączą się z kolejnymi etapami walki o zmiany w XIX-wiecznej Europie."}, {"id": "p19", "type": "short", "tag": "l1", "q": "Część 4. Dokończ zdania · Pytanie 19. Dokończ zdanie: Po klęsce pod Waterloo Napoleon został zesłany na wyspę …", "accept": ["Świętą Helenę", "Święta Helena", "Świętej Heleny", "św. Helena", "Helena", "Helenę"], "explain": "Napoleon zmarł na Wyspie Świętej Heleny na Atlantyku w 1821 r. (wcześniej, w 1814 r., był zesłany na Elbę)."}, {"id": "p20", "type": "short", "tag": "l2", "q": "Część 4. Dokończ zdania · Pytanie 20. Dokończ zdanie: Rewolucja przemysłowa rozpoczęła się w XVIII wieku w …", "accept": ["Anglii", "Anglia", "Wielkiej Brytanii", "Wielka Brytania", "Brytanii"], "explain": "Anglia miała węgiel, rudę żelaza, kapitał z handlu i kolonii oraz tanią siłę roboczą."}, {"id": "p21", "type": "short", "tag": "l3", "q": "Część 4. Dokończ zdania · Pytanie 21. Dokończ zdanie: Manifest komunistyczny (1848) napisali Karol Marks i Fryderyk …", "accept": ["Engels", "Engelsa"], "explain": "Marks i Engels wzywali proletariuszy do rewolucji i zniesienia własności prywatnej."}, {"id": "p22", "type": "short", "tag": "l1", "q": "Część 4. Dokończ zdania · Pytanie 22. Dokończ zdanie: Święte Przymierze zawarły w 1815 r. Rosja, Prusy i …", "accept": ["Austria", "Austrię", "Austrii"], "explain": "Do sojuszu należeli car Rosji, król Prus i cesarz Austrii."}, {"id": "p23", "type": "short", "tag": "l5", "q": "Część 4. Dokończ zdania · Pytanie 23. Dokończ zdanie: Wojnę krymską zakończył pokój podpisany w 1856 r. w …", "accept": ["Paryżu", "Paryż"], "explain": "Pokój paryski (1856) zakazał utrzymywania floty wojennej na Morzu Czarnym."}, {"id": "p24", "type": "short", "tag": "l4", "q": "Część 4. Dokończ zdania · Pytanie 24. Dokończ zdanie: Na czele powstania węgierskiego w czasie Wiosny Ludów stał Lajos (Ludwik) …", "accept": ["Kossuth", "Kosut", "Koszut"], "explain": "Powstanie węgierskie stłumiła w 1849 r. Austria z pomocą armii rosyjskiej."}, {"id": "p25", "type": "mc", "tag": "l1", "q": "Część 4. Dokończ zdania · Pytanie 25. Dokończ zdanie: Z większości ziem Księstwa Warszawskiego kongres wiedeński utworzył …", "options": ["niepodległą Rzeczpospolitą", "Wielkie Księstwo Poznańskie", "Królestwo Polskie połączone z Rosją", "Wolne Miasto Kraków"], "answer": 2, "explain": "Królem Polski został car Aleksander I; Kraków stał się wolnym miastem, a Wielkie Księstwo Poznańskie przypadło Prusom."}, {"id": "p26", "type": "mc", "tag": "l2", "q": "Część 4. Dokończ zdania · Pytanie 26. Dokończ zdanie: Na kolei Manchester–Liverpool (1830) jeździły parowozy skonstruowane przez …", "options": ["Roberta Fultona", "Jerzego Stephensona", "Jamesa Watta", "Samuela Morse’a"], "answer": 1, "explain": "Parowóz „Rakieta” Stephensona wygrał w 1829 r. konkurs na lokomotywę dla tej linii."}, {"id": "p27", "type": "mc", "tag": "l5", "q": "Część 5. Przyczyny i skutki · Pytanie 27. Co było przyczyną wojny krymskiej?", "options": ["Chęć przyłączenia Krymu przez Wielką Brytanię", "Wybuch powstania listopadowego", "Spór o kolonie w Afryce", "Dążenie Rosji do kontroli nad cieśninami Bosfor i Dardanele kosztem słabnącej Turcji"], "answer": 3, "explain": "Rosja, pod pretekstem opieki nad prawosławnymi w Turcji, chciała opanować cieśniny i osłabić Turcję."}, {"id": "p28", "type": "mc", "tag": "l5", "q": "Część 5. Przyczyny i skutki · Pytanie 28. Jaki był skutek wojny krymskiej dla Rosji?", "options": ["Zdobycie Konstantynopola", "Zawarcie Świętego Przymierza", "Zakaz utrzymywania floty wojennej na Morzu Czarnym i konieczność reform, m.in. uwłaszczenia chłopów (1861)", "Przejęcie kontroli nad Bosforem i Dardanelami"], "answer": 2, "explain": "Klęska pokazała zacofanie Rosji, dlatego car Aleksander II przeprowadził reformy."}, {"id": "p29", "type": "mc", "tag": "l2", "q": "Część 5. Przyczyny i skutki · Pytanie 29. Dlaczego rewolucja przemysłowa zaczęła się właśnie w Anglii?", "options": ["Anglia nie posiadała żadnych kolonii", "Anglia miała złoża węgla i rudy żelaza, kapitał z handlu i kolonii oraz tanią siłę roboczą", "Anglia była krajem bez miast", "W Anglii zakazano handlu zagranicznego"], "answer": 1, "explain": "Połączenie surowców, pieniędzy i rąk do pracy sprzyjało budowie fabryk."}, {"id": "p30", "type": "mc", "tag": "l2", "q": "Część 5. Przyczyny i skutki · Pytanie 30. Który z poniższych był skutkiem rewolucji przemysłowej?", "options": ["Powrót do gospodarki opartej na pracy ręcznej", "Zanik handlu morskiego", "Szybki rozwój miast (urbanizacja) i powstanie licznej klasy robotników – proletariatu", "Spadek liczby mieszkańców miast"], "answer": 2, "explain": "Fabryki przyciągały ludzi ze wsi, więc miasta szybko rosły."}, {"id": "p31", "type": "mc", "tag": "l1", "q": "Część 5. Przyczyny i skutki · Pytanie 31. Jaki był główny cel zawarcia Świętego Przymierza?", "options": ["Pomoc Grekom w walce z Turcją", "Zjednoczenie Niemiec", "Walka z Napoleonem w czasie „stu dni”", "Obrona porządku ustalonego na kongresie wiedeńskim i wspólne tłumienie ruchów rewolucyjnych i narodowych"], "answer": 3, "explain": "Monarchowie Rosji, Austrii i Prus zobowiązali się wspierać nawzajem przeciw rewolucjom."}, {"id": "p32", "type": "mc", "tag": "l3", "q": "Część 5. Przyczyny i skutki · Pytanie 32. Dlaczego robotnicy zakładali związki zawodowe i organizowali strajki?", "options": ["Z powodu bardzo długiego czasu pracy, niskich płac i złych warunków w fabrykach", "Bo chcieli przywrócenia dawnych dynastii", "Bo domagali się wojny z Rosją", "Bo nie chcieli rozwoju kolei"], "answer": 0, "explain": "Robotnicy pracowali nawet 14–16 godzin dziennie (także dzieci) za bardzo niskie płace."}, {"id": "p33", "type": "mc", "tag": "l4", "q": "Część 5. Przyczyny i skutki · Pytanie 33. Jaki był skutek rewolucji lipcowej 1830 r. we Francji?", "options": ["Ogłoszenie republiki", "Powrót Napoleona do władzy", "Obalenie Karola X i objęcie tronu przez Ludwika Filipa", "Przyłączenie Belgii do Francji"], "answer": 2, "explain": "Rewolucja lipcowa obaliła Karola X z dynastii Burbonów; republikę (II Republikę) ogłoszono dopiero w 1848 r."}, {"id": "p34", "type": "cat", "tag": "l4", "q": "Część 6. Udało się czy nie udało? · Pytanie 34. Lata 1825–1831: czy zryw zakończył się sukcesem?", "categories": ["Udało się", "Nie udało się"], "items": [{"t": "Powstanie dekabrystów w Rosji (1825)", "c": 1}, {"t": "Rewolucja lipcowa we Francji (1830)", "c": 0}, {"t": "Walka Greków o niepodległość (uznana w 1830)", "c": 0}, {"t": "Rewolucja w Belgii (1830–1831)", "c": 0}, {"t": "Powstanie listopadowe (1830–1831)", "c": 1}], "explain": "Udało się Francuzom (obalenie Karola X), Grekom i Belgom (pomoc mocarstw). Dekabrystów stłumił Mikołaj I, a powstanie listopadowe przegrało z Rosją."}, {"id": "p35", "type": "cat", "tag": "l4", "q": "Część 6. Udało się czy nie udało? · Pytanie 35. Wiosna Ludów 1848–1849: czy cel został osiągnięty?", "categories": ["Udało się", "Nie udało się"], "items": [{"t": "Powstanie Węgrów pod wodzą Kossutha", "c": 1}, {"t": "Walka Włochów o wyzwolenie spod władzy Austrii i zjednoczenie", "c": 1}, {"t": "Zjednoczenie Niemiec przez parlament frankfurcki", "c": 1}, {"t": "Obalenie monarchii we Francji i ogłoszenie republiki (1848)", "c": 0}, {"t": "Zniesienie pańszczyzny w cesarstwie austriackim (1848)", "c": 0}], "explain": "Węgrów pokonała Austria z pomocą Rosji, Włochów – Austria, a król Prus odrzucił koronę z rąk parlamentu frankfurckiego. Udało się obalić monarchię we Francji i znieść pańszczyznę w Austrii."}, {"id": "p36", "type": "mc", "tag": "l1", "q": "Część 7. Tekst źródłowy · Pytanie 36. Przeczytaj źródło. Jak nazywał się sojusz, którego dotyczy tekst?", "options": ["Święte Przymierze", "Związek Niemiecki", "Wielka koalicja antyrosyjska", "Królestwo Niderlandów"], "answer": 0, "explain": "To fragment aktu Świętego Przymierza zawartego przez monarchów Austrii, Prus i Rosji.", "source": "„W imię Przenajświętszej i Niepodzielnej Trójcy! Ich Królewskie Mości: Cesarz Austrii, Król Pruski i Cesarz Wszechrosji […] postanowili: trzej monarchowie pozostaną złączeni węzłami prawdziwego i nierozerwalnego braterstwa i […] w każdym czasie i w każdym miejscu udzielać sobie będą wsparcia, pomocy i opieki.” (Akt Świętego Przymierza, 1815, fragment)"}, {"id": "p37", "type": "mc", "tag": "l1", "q": "Część 7. Tekst źródłowy · Pytanie 37. Przeczytaj źródło. W którym roku zawarto ten sojusz i kto był jego inicjatorem?", "options": ["1848, król Fryderyk Wilhelm III", "1856, Klemens Metternich", "1815, car Aleksander I", "1830, car Mikołaj I"], "answer": 2, "explain": "Święte Przymierze zaproponował car Aleksander I we wrześniu 1815 r.", "source": "„W imię Przenajświętszej i Niepodzielnej Trójcy! Ich Królewskie Mości: Cesarz Austrii, Król Pruski i Cesarz Wszechrosji […] postanowili: trzej monarchowie pozostaną złączeni węzłami prawdziwego i nierozerwalnego braterstwa i […] w każdym czasie i w każdym miejscu udzielać sobie będą wsparcia, pomocy i opieki.” (Akt Świętego Przymierza, 1815, fragment)"}, {"id": "p38", "type": "mc", "tag": "l3", "q": "Część 7. Tekst źródłowy · Pytanie 38. Przeczytaj źródło. Z jakiego dzieła pochodzi fragment i kto jest jego autorem?", "options": ["Akt końcowy kongresu wiedeńskiego – Metternich", "„Bogactwo narodów” – Adam Smith", "„Rozważania o rewolucji we Francji” – Edmund Burke", "„Manifest komunistyczny” – Karol Marks i Fryderyk Engels"], "answer": 3, "explain": "Hasło „Proletariusze wszystkich krajów, łączcie się!” kończy Manifest komunistyczny (1848).", "source": "„Historia wszelkiego dotychczasowego społeczeństwa jest historią walk klasowych. […] Niech drżą panujące klasy przed rewolucją komunistyczną. Proletariusze nie mają w niej nic do stracenia prócz swych kajdan. Do zdobycia mają cały świat. Proletariusze wszystkich krajów, łączcie się!” (fragment dzieła z 1848 r.)"}, {"id": "p39", "type": "mc", "tag": "l3", "q": "Część 7. Tekst źródłowy · Pytanie 39. Przeczytaj źródło. Jaki s
