posób zmiany społeczeństwa proponują autorzy tekstu?", "options": ["Stopniowe reformy i współpracę robotników z fabrykantami", "Rewolucję proletariatu i zniesienie własności prywatnej", "Wolny rynek bez żadnej ingerencji państwa", "Powrót do porządku sprzed rewolucji francuskiej"], "answer": 1, "explain": "Komuniści głosili walkę klas i rewolucję – w przeciwieństwie do łagodniejszych socjalistów.", "source": "„Historia wszelkiego dotychczasowego społeczeństwa jest historią walk klasowych. […] Niech drżą panujące klasy przed rewolucją komunistyczną. Proletariusze nie mają w niej nic do stracenia prócz swych kajdan. Do zdobycia mają cały świat. Proletariusze wszystkich krajów, łączcie się!” (fragment dzieła z 1848 r.)"}, {"id": "p40", "type": "mc", "tag": "l5", "q": "Część 7. Tekst źródłowy · Pytanie 40. Przeczytaj źródło. Które pokonane państwo straciło przez to postanowienie flotę wojenną na Morzu Czarnym i po jakiej wojnie je wprowadzono?", "options": ["Rosja – po wojnie krymskiej", "Francja – po kongresie wiedeńskim", "Austria – po Wiośnie Ludów", "Wielka Brytania – po wojnach napoleońskich"], "answer": 0, "explain": "Pokój paryski (1856) zakazał okrętów wojennych na Morzu Czarnym, co uderzało przede wszystkim w Rosję.", "source": "„Morze Czarne zostaje zneutralizowane: jego wody i porty, otwarte dla żeglugi handlowej wszystkich narodów, są formalnie i na zawsze zamknięte dla okrętów wojennych […].” (traktat pokojowy z 1856 r., fragment)"}]}], "cheatSheet": [{"title": "Zad. 1 – Chronologia", "items": ["**1814–1815** – kongres wiedeński (początek obrad: IX **1814**)", "**1815** – 100 dni Napoleona (III–VI); **18 VI 1815 Waterloo** → Wyspa Świętej Heleny", "**1830** – niepodległość Grecji", "**1853–1856** – wojna krymska", "Kolejność: 1 kongres → 2 100 dni → 3 Grecja → 4 wojna krymska"]}, {"title": "Zad. 2 – Pojęcia", "items": ["**industrializacja** – rośnie udział pracy maszyn i zatrudnienia w przemyśle", "**urbanizacja** – szybki rozwój miast", "**proletariat** – najuboższa warstwa robotników", "**burżuazja** – właściciele środków produkcji (fabryk, banków, kopalń)", "**liberalizm** – najważniejsza wolność i swobodny rozwój jednostki", "**liberalizm ekonomiczny** – wolny rynek, państwo się nie wtrąca (A. Smith)", "**konserwatyzm** – tradycja, religia, silna pozycja Kościoła", "**socjalizm** – poprawa warunków życia i pracy robotników", "**komunizm** – rewolucja proletariatu, zniesienie własności prywatnej (Marks, Engels)", "**strajk** – zorganizowane przerwanie pracy, by wymusić żądania", "**restauracja** – powrót na trony władców obalonych przez rewolucję i Napoleona", "**legitymizm** – władza królewska święta i nienaruszalna (prawowici monarchowie)", "**równowaga europejska** – żadne państwo nie może dominować nad innymi"]}, {"title": "Zad. 3 – Parowóz (tekst o Stephensonie)", "items": ["Jerzy **Stephenson** – parowóz „Rakieta”; kolej **Manchester–Liverpool 1830**", "Zastosowania: **przewóz pasażerów** oraz **transport towarów i surowców** (węgiel, bawełna)", "Nie myl: telegraf – Morse, statek parowy – Fulton, krosno – Cartwright"]}, {"title": "Zad. 4 – Postacie", "items": ["**Aleksander I** – car Rosji na kongresie, inicjator Świętego Przymierza", "**Metternich** – gospodarz kongresu wiedeńskiego, kanclerz Austrii", "**Mikołaj I** – stłumił dekabrystów (1825); car w wojnie krymskiej", "**Karol X** – król Francji obalony w rewolucji lipcowej (1830)", "**Kossuth** – przywódca Węgrów w Wiośnie Ludów (1848–1849)", "**Morse** – telegraf", "**Watt** – udoskonalił maszynę parową", "**Stephenson** – parowóz (lokomotywa parowa)", "**Marks i Engels** – Manifest komunistyczny (1848), komunizm", "**Adam Smith** – liberalizm ekonomiczny", "**Edmund Burke** – konserwatyzm"]}, {"title": "Zad. 5 – Odpowiedzi (1–12)", "items": ["1 **socjalizm** · 2 **James Watt** · 3 **metropolia**", "4 **Bosfor** (lub Dardanele) · 5 **Marks** (lub Engels) · 6 **Aleksander I**", "7 **Mikołaj I** · 8 **kapitał** · 9 **fabryka**", "10 **Frankfurt nad Menem** · 11 **Stephenson** · 12 **Burke** (lub de Maistre)"]}, {"title": "Zad. 6 – Święte Przymierze", "items": ["**1815** (26 IX): **Rosja + Austria + Prusy**, z inicjatywy cara Aleksandra I", "Cel: obrona porządku wiedeńskiego, wspólne **tłumienie rewolucji** i ruchów narodowych"]}, {"title": "Zad. 7 – Trzy zasady kongresu", "items": ["**Restauracja** – przywrócenie obalonych dynastii (np. Burbonów)", "**Legitymizm** – władza należy się prawowitym, dziedzicznym monarchom", "**Równowaga europejska** – żadne mocarstwo nie dominuje"]}, {"title": "Zad. 8 – Przyczyna → skutek", "items": ["**Kongres wiedeński:** klęska Napoleona → nowy podział Europy, powrót dynastii, Święte Przymierze", "**Maszyna parowa:** potrzeba wydajnego napędu (kopalnie, maszyny) → fabryki, kolej, statki – rewolucja przemysłowa", "**Wojna krymska:** Rosja chce Bosforu i Dardaneli, osłabienia Turcji → klęska Rosji, pokój paryski 1856 (zakaz floty na Morzu Czarnym), uwłaszczenie 1861", "**Powstanie w Grecji:** panowanie i ucisk Turcji → niepodległość Grecji (1830)"]}, {"title": "Zad. 9 – Maszyna parowa", "items": ["Udoskonalił: **James Watt** (patent 1769)", "Skutek: napęd maszyn w fabrykach → rozwój przemysłu, potem kolej i statki parowe"]}, {"title": "Udało się / nie udało się (niepodległość i rewolucje)", "items": ["✅ **Grecja** 1830 · **Belgia** 1830–1831 · **Francja** 1830 (obalenie Karola X)", "❌ **dekabryści** 1825 · **powstanie listopadowe** 1830–1831 · **Węgrzy** 1848–1849 · **Włosi** 1848–1849 · **parlament frankfurcki** (zjednoczenie Niemiec)"]}]};</script>
<script>
(function(){

var C = window.TP_CONTENT;
var M = C.meta, KEY = 'testprep:' + M.id;

function load(){try{var p=JSON.parse(localStorage.getItem(KEY));if(p&&p.v===1)return p;}catch(e){}return {v:1,q:{},cards:{},mistakes:{},diag:null,lessons:{},explain:{},mock:null,lang:'pl',testDate:''};}

function tpEmit(t,d){try{window.dispatchEvent(new CustomEvent('tp:'+t,{detail:d||{}}));}catch(e){}}
/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');}
var IMGS=C.images||{};
function IMG(key,cls){var m=IMGS[key];if(!m)return '';var src=m.svg?('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(m.svg)):(/^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(m.data||'')?m.data:'');if(!src)return '';return '<img class="tpimg'+(m.wide?' wide':'')+(cls?' '+cls:'')+'" alt="'+esc(m.alt||'')+'" src="'+src+'">';}
function gallery(list){if(!list||!list.length)return '';return '<div class="gal">'+list.map(function(g){return '<figure'+((IMGS[g.img]||{}).wide?' class="wide"':'')+'>'+IMG(g.img)+(g.caption?'<figcaption>'+fmt(g.caption)+'</figcaption>':'')+'</figure>';}).join('')+'</div>';}
function el(tag,attrs,html){var e=document.createElement(tag);if(attrs)for(var k in attrs){if(k==='class')e.className=attrs[k];else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k]);}if(html!=null)e.innerHTML=html;return e;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function dmParse(s){s=String(s).replace(/[′’`´]/g,"'").replace(/[″”]/g,'"');var mDec=s.match(/^\s*(\d+)[.,](\d+)\s*°?\s*[A-Za-ząćęłńóśźżĄĆĘŁŃÓŚŹŻ. ]*$/);
 if(mDec&&!(mDec[2].length===2&&+mDec[2]<60))return Math.round(parseFloat(mDec[1]+'.'+mDec[2])*60*100)/100;
 var t=s.match(/\d+/g);if(!t)return null;var d=+t[0],m=t.length>1?+t[1]:0;if(m>=60)return null;return d*60+m;}
function dmDirOf(s){var w=String(s).toUpperCase().replace(/[^A-ZĄĆĘŁŃÓŚŹŻ]+/g,' ').trim().split(' ').filter(Boolean);var f={};
 w.forEach(function(x){if(x==='N'||/^P[ŁL]N|^PÓŁN|^POLN/.test(x))f.N=1;else if(x==='S'||/^P[ŁL]?D|^POŁUD|^POLUD/.test(x))f.S=1;else if(x==='E'||/^WSCH/.test(x))f.E=1;else if(x==='W'||/^ZACH/.test(x))f.W=1;});return Object.keys(f);}

<template id="tutor-tpl"><elevenlabs-convai agent-id="agent_3101m4193bfqeyy99nqzjkg5mtfh" variant="expanded" action-text="Porozmawiaj z tutorem" start-call-text="Zacznij rozmowę" end-call-text="Zakończ" dynamic-variables="{&quot;subject&quot;: &quot;Historia&quot;, &quot;topic&quot;: &quot;Kongres wiedeński i Europa w latach 1815–1856&quot;, &quot;material&quot;: &quot;## Kongres wiedeński (1814–1815) i Święte Przymierze\nNajważniejsze: IX 1814 – VI 1815: kongres wiedeński; gospodarz – Metternich; Zasady: restauracja, legitymizm, równowaga europejska; III–VI 1815: 100 dni Napoleona; 18 VI 1815 Waterloo; zesłanie na Wyspę Świętej Heleny; Królestwo Polskie z carem jako królem, Wolne Miasto Kraków, Związek Niemiecki, Królestwo Niderlandów; 26 IX 1815: Święte Przymierze Rosji, Austrii i Prus\nPo pokonaniu Napoleona (abdykacja w 1814 r., zesłanie na wyspę Elbę) przedstawiciele państw europejskich zebrali się w Wiedniu. Kongres wiedeński obradował od września 1814 do czerwca 1815 r. Miał na nowo ułożyć granice i porządek w Europie.\nNajważniejsze postacie: car Rosji Aleksander I, austriacki minister spraw zagranicznych Klemens Metternich (gospodarz kongresu, później kanclerz), przedstawiciel Wielkiej Brytanii Robert Castlereagh, król Prus Fryderyk Wilhelm III oraz przedstawiciel pokonanej Francji Charles Talleyrand, który zręcznie bronił jej interesów.\nKongres kierował się trzema zasadami: restauracja – przywrócenie na trony władców obalonych w czasie rewolucji francuskiej i wojen napoleońskich (np. Burbonów we Francji); legitymizm – władza królewska jest święta i należy się tylko prawowitym, dziedzicznym monarchom; równowaga europejska – żadne państwo nie może zdobyć przewagi nad innymi.\nW czasie obrad, w marcu 1815 r., Napoleon uciekł z Elby i znów przejął władzę we Francji – to tzw. „100 dni” Napoleona. Ostatecznie przegrał 18 czerwca 1815 r. pod Waterloo (z Brytyjczykami Wellingtona i Prusakami Blüchera) i został zesłany na Wyspę Świętej Heleny na Atlantyku, gdzie zmarł w 1821 r.\nAkt końcowy kongresu podpisano 9 czerwca 1815 r. (9 dni przed Waterloo). Postanowienia: z większości Księstwa …\n\n## Rewolucja przemysłowa\nNajważniejsze: Początek: 2. poł. XVIII w., Anglia; Watt – maszyna parowa; Cartwright – krosno mechaniczne; Fulton – statek parowy; Stephenson – parowóz; kolej Manchester–Liverpool 1830; Morse – telegraf; Skutki: industrializacja, urbanizacja, metropolie, fabryki; Nowe klasy: burżuazja i proletariat; strajki i związki zawodowe\nRewolucja przemysłowa to przejście od pracy ręcznej do pracy maszyn w fabrykach. Zaczęła się w drugiej połowie XVIII w. w Anglii, bo były tam złoża węgla i rudy żelaza, kapitał z handlu i kolonii, tania siła robocza (ludzie przenoszący się ze wsi) i duży rynek zbytu.\nNajważniejszy wynalazek to maszyna parowa, którą udoskonalił James Watt (patent z 1769 r.). Napędzała pompy w kopalniach, maszyny w fabrykach, a później pociągi i statki.\nInne wynalazki: krosno mechaniczne – Edmund Cartwright (1785); statek parowy – Robert Fulton (1807, USA); parowóz (lokomotywa parowa) – Jerzy (George) Stephenson – jego „Rakieta” jeździła na kolei Manchester–Liverpool otwartej w 1830 r.; telegraf elektryczny i alfabet – Samuel Morse (1837, pierwsza linia 1844).\nSkutki: industrializacja (uprzemysłowienie), powstanie fabryk, urbanizacja – szybki rozwój miast, pojawienie się metropolii (np. Londyn). Powstały nowe grupy społeczne: burżuazja – właściciele fabryk, banków i kopalń (środków produkcji), którzy inwestowali kapitał, oraz proletariat – najubożsi robotnicy żyjący tylko z pracy najemnej.\nRobotnicy pracowali po 14–16 godzin dziennie, za niskie płace, w złych warunkach; pracowały też dzieci. Aby walczyć o swoje prawa, organizowali strajki (zorganizowane przerwanie pracy) i zakładali związki zawodowe.\nDlaczego? Dlaczego maszyna parowa była tak ważna? – Dała silny i stały napęd niezależny od siły …\n\n## Nowe idee: liberalizm, konserwatyzm, socjalizm, komunizm\nNajważniejsze: Liberalizm – wolność jednostki; liberalizm ekonomiczny – Adam Smith, wolny rynek; Konserwatyzm – tradycja, religia, Kościół; Burke, de Maistre; Socjalizm – poprawa losu robotników; utopijny – Owen; Komunizm – Marks i Engels, Manifest komunistyczny 1848, rewolucja, walka klas; Związki zawodowe i strajki – walka robotników o prawa\nLiberalizm (łac. *liber* – wolny): najważniejsza jest wolność i swobodny rozwój jednostki, równość wobec prawa, ochrona własności, rządy konstytucji. Liberalizm ekonomiczny stworzył Adam Smith (dzieło „Badania nad naturą i przyczynami bogactwa narodów”, 1776): wolny rynek i konkurencja, państwo nie powinno wtrącać się w gospodarkę.\nKonserwatyzm (łac. *conservare* – zachowywać): ważne są tradycja, religia i silna pozycja Kościoła, monarchia i dawny porządek; zmiany powinny być powolne, a nie rewolucyjne. Główni ideolodzy: Edmund Burke („Rozważania o rewolucji we Francji”, 1790) i Joseph de Maistre.\nSocjalizm powstał w odpowiedzi na nędzę robotników: jego przedstawiciele dążyli do poprawy warunków życia i pracy robotników i sprawiedliwości społecznej. Socjaliści utopijni (np. Robert Owen, Henri de Saint-Simon, Charles Fourier) marzyli o idealnych wspólnotach bez biedy.\nKomunizm: Karol Marks i Fryderyk Engels w Manifeście komunistycznym (1848) głosili, że historia to walka klas, a proletariat musi przeprowadzić rewolucję, znieść własność prywatną i stworzyć społeczeństwo bezklasowe.\nRobotnicy łączyli się w związki zawodowe – organizacje broniące ich interesów (wyższe płace, krótszy czas pracy). Ich bronią był strajk.\nDlaczego? Czym różni się socjalizm od komunizmu? – Socjaliści chcieli poprawić los robotników, często przez reformy i …\n\n## Walka ze Świętym Przymierzem (1825–1849)\nNajważniejsze: 1825 – dekabryści przeciw Mikołajowi I – klęska; 1830 – niepodległość Grecji – sukces; VII 1830 – rewolucja lipcowa, obalenie Karola X – sukces; 1830–1831 – Belgia niepodległa – sukces; powstanie listopadowe – klęska; 1848–1849 – Wiosna Ludów: Węgry (Kossuth), Włochy, parlament frankfurcki – klęski\nDekabryści (grudzień 1825 r.) – oficerowie rosyjscy w Petersburgu wystąpili przy wstąpieniu na tron cara Mikołaja I, domagając się m.in. konstytucji. Powstanie zostało stłumione – przywódców stracono lub zesłano na Syberię. ❌\nGrecja – powstanie przeciw Turcji wybuchło w 1821 r. Dzięki pomocy Wielkiej Brytanii, Francji i Rosji Grecy uzyskali niepodległość (uznaną w 1830 r.). ✅\nRewolucja lipcowa (lipiec 1830 r.) we Francji obaliła króla Karola X z dynastii Burbonów; królem został Ludwik Filip. ✅ Zachęciła do walki inne narody.\nBelgia (1830–1831) – Belgowie zbuntowali się przeciw Holandii i wywalczyli niepodległość; królem został Leopold I. ✅ Powstanie listopadowe (1830–1831) w Królestwie Polskim zakończyło się klęską z Rosją. ❌\nWiosna Ludów (1848–1849) – fala rewolucji w Europie. We Francji obalono Ludwika Filipa i ogłoszono republikę ✅; w Austrii upadł Metternich, a w cesarstwie zniesiono pańszczyznę ✅. Parlament we Frankfurcie nad Menem próbował zjednoczyć Niemcy – bez skutku ❌. Węgrzy pod wodzą Lajosa Kossutha walczyli o niepodległość, ale w 1849 r. pokonała ich Austria z pomocą Rosji ❌. Włosi walczyli o wyzwolenie spod władzy Austrii i zjednoczenie – przegrali ❌.\nZapamiętaj: udało się Grekom, Belgom i Francuzom (1830 i 1848); nie udało się dekabrystom, Polakom (1830–1831), Węgrom, Włochom i Niemcom (zjednoczenie) w latach 1848–1849.\nDlaczego? Dlaczego Grekom i Belgom się …\n\n## Wojna krymska (1853–1856)\nNajważniejsze: Przyczyny: cieśniny Bosfor i Dardanele, osłabienie Turcji, opieka nad prawosławnymi; Strony: Rosja vs Turcja + Wielka Brytania + Francja + Królestwo Sardynii; Oblężenie Sewastopola 1854–1855; Pokój paryski 1856: zakaz floty wojennej na Morzu Czarnym; Skutek: reformy w Rosji – uwłaszczenie chłopów 1861\nPrzyczyny: Rosja chciała kontrolować cieśniny Bosfor i Dardanele (łączą Morze Czarne z Morzem Śródziemnym) i osłabić Turcję. Pretekstem była opieka nad prawosławnymi mieszkającymi w państwie tureckim.\nW 1853 r. Rosja zajęła księstwa naddunajskie (Mołdawię i Wołoszczyznę) i rozpoczęła wojnę z Turcją. Turcję poparły Wielka Brytania i Francja (1854), a w 1855 r. dołączyło Królestwo Sardynii. Car Mikołaj I nie spodziewał się, że mocarstwa zachodnie staną przeciw niemu.\nGłówne walki toczyły się na Krymie. Najważniejsze było oblężenie Sewastopola – rosyjskiej bazy floty czarnomorskiej (1854–1855). Miasto padło we wrześniu 1855 r. W czasie wojny Florence Nightingale zorganizowała opiekę nad rannymi żołnierzami. W 1855 r. w Konstantynopolu, organizując polskie oddziały do walki z Rosją, zmarł Adam Mickiewicz.\nSkutki: klęska Rosji; pokój paryski (1856) – zakaz utrzymywania floty wojennej na Morzu Czarnym. Klęska pokazała zacofanie Rosji, więc nowy car Aleksander II przeprowadził reformy, m.in. uwłaszczenie chłopów (1861) – zniesienie poddaństwa.\nDlaczego? Dlaczego Wielka Brytania i Francja pomogły Turcji? – Nie chciały, żeby Rosja opanowała cieśniny i stała się zbyt silna na Morzu Śródziemnym – to naruszyłoby równowagę sił i zagroziło ich interesom (m.in. drodze Wielkiej Brytanii do Indii).\n\n## Fiszki\n- Kongres wiedeński – kiedy i po co? → IX 1814 – VI 1815; nowy ład w Europie po wojnach napoleońskich.\n- Restauracja → Przywrócenie na trony władców obalonych w trakcie rewolucji francuskiej i wojen napoleońskich.\n- Legitymizm → Zasada, według której władza królewska jest święta i nienaruszalna – należy się prawowitym, dziedzicznym monarchom.\n- Równowaga europejska → Zasada, że żadne państwo w Europie nie może zdobyć przewagi nad innymi.\n- „100 dni” Napoleona → III–VI 1815: powrót z Elby i ponowne rządy; koniec po klęsce pod Waterloo.\n- Waterloo → 18 VI 1815 – ostateczna klęska Napoleona; zesłanie na Wyspę Świętej Heleny.\n- Święte Przymierze → Sojusz Rosji, Austrii i Prus (26 IX 1815) – obrona porządku wiedeńskiego i tłumienie rewolucji.\n- Postanowienia kongresu dla ziem polskich → Królestwo Polskie (car królem), Wielkie Księstwo Poznańskie (Prusy), Wolne Miasto Kraków.\n- Indu
