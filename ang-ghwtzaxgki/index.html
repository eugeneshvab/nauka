<style>

.fc{perspective:1000px;height:210px;cursor:pointer;margin:6px 0 10px}.fc.hasimg{height:280px}

.tpimg{display:inline-block;vertical-align:middle;object-fit:contain;max-width:100%}
.qimg{margin:6px 0 10px}.qimg .tpimg{width:140px;height:140px}

.qimg .tpimg.wide{width:100%;max-width:560px;height:auto}.opt .tpimg.wide{width:110px;height:auto}.row .lbl .tpimg.wide{width:210px;max-width:60vw;height:auto}.fc .tpimg.wide{width:auto;max-width:100%;height:150px}.gal figure.wide{width:100%;max-width:560px}.gal figure.wide .tpimg{width:100%;height:auto}.cheat .gal figure.wide{width:48%;max-width:340px}.cheat .gal figure.wide .tpimg{width:100%;height:auto}
@media print{.cheat .gal figure.wide{width:30%}.cheat .gal figure.wide .tpimg{width:100%;height:auto}}
.fc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;font-size:1.15rem;border:2px solid var(--line)}
.fc .f{background:#fff;font-weight:700}.fc .b{background:var(--pri2);transform:rotateY(180deg)}
.dots{display:flex;gap:4px;flex-wrap:wrap}.dots i{width:12px;height:12px;border-radius:3px;background:var(--line)}.dots i.b1{background:#fca5a5}.dots i.b2{background:#fcd34d}.dots i.b3{background:#86efac}
.meter{height:10px;background:var(--line);border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:var(--ok)}
.score{font-size:2rem;font-weight:800}
.why summary{cursor:pointer;color:var(--pri);font-weight:600}
.tldr{background:#f0fdf4;border-radius:10px;padding:8px 12px;margin-top:8px;font-size:.95rem}
.langsw button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;cursor:pointer;font:inherit;font-size:.85rem}.langsw button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
svg text{font:12px system-ui,sans-serif}
.cheat{columns:2 260px;column-gap:24px}.cheat .blk{break-inside:avoid;margin-bottom:10px}.cheat h3{margin:0 0 4px;color:var(--pri)}.cheat ul{margin:0;padding-left:18px}

 header,nav,footer,.noprint{display:none!important}body{background:#fff;font-size:12px}
 section{display:none!important}#s-cheat{display:block!important}.card{border:0;box-shadow:none;padding:0}
 main{padding:0}.cheat{columns:2}
}
@media (max-width:560px){.tl b{display:block}header h1{font-size:1.2rem}}
.weakbanner{border:2px solid #f59e0b;background:#fffbeb}.weakbanner h2{margin-top:0}.weakhd{border-left:6px solid #f59e0b}.wjump{flex-wrap:wrap;gap:8px}.wjump a{text-decoration:none}
.wtpl{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}.wtpl>div{flex:1 1 140px;border-radius:10px;padding:8px 10px;font-size:.92rem}.wtpl>div b{display:block}.wtpl i{align-self:center;font-style:normal;color:#94a3b8}
.ws0{background:#fee2e2}.ws1{background:#fef3c7}.ws2{background:#dcfce7}.ws3{background:#dbeafe}.wsteps>div{border-radius:10px;padding:8px 10px;margin:6px 0}

.wcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}.wcard{min-height:110px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px;text-align:left;font:inherit;cursor:pointer;color:inherit}

.cheat .blk.wide{column-span:all}.ftab td,.ftab tbody th{font-size:.92rem}@media print{.ftab{font-size:9pt}.ftab th,.ftab td{padding:2px 4px}}
.qbox .opt.ok{border-color:var(--ok);background:var(--okbg)}.qbox .opt.bad{border-color:var(--bad);background:var(--badbg)}

.qbox .btn.tfok{background:var(--okbg);border-color:var(--ok);color:var(--ink)}.qbox .btn.tfbad{border-color:var(--bad);color:var(--ink)}
.ttwrap{overflow-x:auto;margin:6px 0}.ttab{border-collapse:collapse;width:100%;font-size:.95rem}.ttab th,.ttab td{border:1px solid var(--line);padding:6px;vertical-align:top;text-align:left}

.ttab input[type=text]{width:100%;box-sizing:border-box;min-width:0;padding:6px 8px;font-size:16px}.ttab input.ok{border-color:var(--ok);background:var(--okbg)}.ttab input.bad{border-color:var(--bad);background:var(--badbg)}
.ttab .tcor{display:block;font-size:.85rem;margin-top:3px;color:var(--ink)}.ttab tr.tnr td{background:var(--badbg);font-size:.88rem;color:var(--ink)}.ttab tr.tnr[hidden]{display:none}
.tdscore{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (max-width:640px){.ttab thead{display:none}.ttab,.ttab tbody,.ttab tr,.ttab th,.ttab td{display:block;width:auto}
 .ttab tr{border:1px solid var(--line);border-radius:12px;margin:0 0 10px;padding:8px 10px;background:var(--card)}.ttab tbody th{background:none;border:0;font-size:1.08rem;color:var(--pri);padding:2px 0 4px;white-space:normal}
 .ttab td{border:0;padding:4px 0}.ttab td:before{content:attr(data-label);display:block;font-size:.78rem;color:var(--muted);font-weight:600;margin-bottom:2px}.ttab tr.tnr{margin-top:-6px;border-color:var(--bad)}.ttab tr.tnr td:before{content:none}}
@media (max-width:560px){.wtpl i{display:none}.wtpl>div{flex-basis:100%}}
.mic{margin:6px 0 4px}.micbtn{font-size:1.05rem;padding:10px 16px}.btn.micbtn.rec{background:#fee2e2!important;color:#991b1b!important;border-color:#fca5a5;animation:micp 1.2s infinite}@keyframes micp{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.45)}50%{box-shadow:0 0 0 8px rgba(220,38,38,0)}}.miclive{min-height:1.2em;margin-top:6px;color:var(--muted,#6b6b6b)}.miclive i{color:var(--ink)}.mic-hint{margin:4px 0}
.lvpills{display:flex;flex-wrap:wrap;gap:6px}.lvpill{display:inline-block;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--pri2);color:var(--pri);text-decoration:none;font-weight:700;font-size:.9rem}.lvpill.done{background:var(--okbg);border-color:var(--ok);color:var(--ink)}
.lvcard{border-left:6px solid var(--pri)}.lvcard.lv1{border-left-color:#86efac}.lvcard.lv2{border-left-color:#5eead4}.lvcard.lv3{border-left-color:#93c5fd}.lvcard.lv4{border-left-color:#c4b5fd}.lvcard.lv5{border-left-color:#f9a8d4}.lvlab{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:4px 0}.lvcard h3{margin:2px 0 8px}
.d5chk{margin:4px 2px}.d5ex{margin:0 0 6px}.d5next{margin:0 0 18px}.d5lesson{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}.d5lesson summary,.d5more summary{cursor:pointer;color:var(--pri);font-weight:700;padding:6px 0}.d5more details{border-top:1px solid var(--line);padding:4px 0}.d5more details>div{padding-top:6px}
.d5topics{flex-direction:column;align-items:stretch;gap:6px}@media (max-width:560px){html.l5 #vq-launch>span:not(.ic),html.l5 #tutor-launch>span:not(.ic){display:none}html.l5 #vq-launch,html.l5 #tutor-launch{padding:9px;gap:0}html.l5 #vq-launch .ic,html.l5 #tutor-launch .ic{width:34px;height:34px;font-size:18px}html.l5 .d5topics .btn{padding-right:64px}}.d5topics .btn{text-align:left;white-space:normal;width:100%}.lifel{padding-left:22px}.lifel li{margin:0 0 10px}.d5rec{border:2px solid var(--pri)}.d5recl{display:flex;flex-direction:column;gap:6px;align-items:flex-start}.d5recl .btn{text-align:left;white-space:normal}.d5slabe{margin-top:14px}

<style id="ogarnio-theme">
:root{--og-canvas:#F7F3EB;--og-surface:#FFFCF6;--og-ink:#292D29;--og-ink-soft:#68665D;--og-hair:#DDD9D0;--og-sage:#607361;--og-sage-pale:#E3E9DF;
--og-olive:#454E40;--og-clay:#9B614B;--og-clay-pale:#F2E3D9;--og-ochre:#8A642F;--og-ochre-pale:#F6EDDA;--og-lake:#596F79;--og-lake-pale:#E4EAEC;
--bg:var(--og-canvas);--card:var(--og-surface);--ink:var(--og-ink);--muted:var(--og-ink-soft);--pri:var(--og-sage);--pri2:var(--og-sage-pale);
--ok:#4E7A52;--okbg:var(--og-sage-pale);--bad:var(--og-clay);--badbg:var(--og-clay-pale);--warn:var(--og-ochre);--warnbg:var(--og-ochre-pale);--line:var(--og-hair);--r:22px;
--og-shadow:0 1px 1px rgba(0,0,0,.05),0 6px 22px rgba(0,0,0,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",Roboto,Ubuntu,sans-serif;background:var(--og-canvas);color:var(--og-ink);-webkit-font-smoothing:antialiased}
h1,h2,h3,.score{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,"Segoe UI",Roboto,sans-serif;font-weight:600;letter-spacing:-.02em}
header{position:relative;overflow:hidden;background:var(--og-canvas);color:var(--og-ink);padding:18px 20px 16px}
header h1{font-size:2rem;line-height:1.15;margin-top:4px;padding-right:120px}header p{opacity:1;color:var(--og-ink-soft)}
header .wrap{position:relative;z-index:1}
.og-brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.05rem;letter-spacing:-.01em;color:var(--og-olive);margin-bottom:10px}

.chips .chip:nth-child(3n+2){background:var(--og-ochre-pale);color:var(--og-ochre)}.chips .chip:nth-child(3n){background:var(--og-lake-pale);color:var(--og-lake)}
.bar{background:var(--og-hair);height:8px}.bar i{background:var(--og-sage)}
nav{background:color-mix(in srgb,var(--og-canvas) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:0;padding:6px 0 8px}

nav .badge{background:var(--og-clay)}
main{padding:12px 16px 90px}
.card{background:var(--og-surface);border:0;border-radius:var(--r);padding:18px 18px;box-shadow:var(--og-shadow)}
.btn{border-radius:15px;padding:11px 18px;background:var(--og-sage)}.btn.sec{background:var(--og-sage-pale);color:var(--og-olive)}
.btn.ghost{border-color:var(--og-hair);color:var(--og-ink-soft);background:transparent}

.fb,.warn,.tldr{border-radius:15px}.warn{color:#5E4520}.tldr{background:var(--og-sage-pale)}

<script>window.TP_CONTENT={"schemaVersion": 1, "meta": {"id": "ang7-unit1-plus", "title": "Język angielski: Unit 1 – ludzie, ubrania, uczucia (wersja rozszerzona)", "subtitle": "Pełny słowniczek Unit 1 · phrasal verbs (put on, try on…) · fit/suit/go with · to be, have got · Present Simple vs Continuous · -ed/-ing · przyimki · body language · Miau Café · zwroty do rozmowy.", "subject": "Język angielski", "grade": "Klasa 7 SP", "lang": "pl", "explainLangs": ["pl", "en"], "estimatedMinutes": 80, "sourceNote": "Źródło: zdjęcia podręcznika, Unit 1, s. 4–9 (Słowniczek, 1.1 Vocabulary, 1.2 Grammar, 1.3 Reading „Miau Café”, 1.4 Listening, 1.5 Functions). Bez zdjęć z podręcznika – rysunki własne.", "uncertain": ["Nagrań (1.4 Listening, 1.5/5) nie ma – luka 4 w notatce „Body language” (tapping your fingers → bored / impatient / nervous) i opisy z zadania 3 to wniosek, nie odsłuch.", "Rozwiązania zadań z podręcznika (np. 1.1/3, 1.2/3–5, 1.5/2, 4, 6) są moje – w książce nie ma klucza.", "Przykłady w „W życiu”, zdania w sprawdzianach próbnych i zadania opisowe są dopisane (nie z podręcznika)."], "tutorMaterial": "TEMAT: Język angielski, klasa 7 – Unit 1 (ludzie, ubrania, uczucia; gramatyka: to be, have got, Present Simple vs Present Continuous; Reading: Miau Café; Listening: body language; Functions: hobby i podtrzymywanie rozmowy). Tłumacz po polsku, przykłady i ćwiczenia po angielsku. Najpierw pytaj ucznia.\n\nNAJWAŻNIEJSZE\n1) Opis osoby: What does he look like? = wygląd; What is he like? = charakter. He's tall/slim/of medium height, in his teens/twenties, middle-aged, elderly. He's got curly/straight/wavy/spiky hair, a fringe, a pony tail, freckles, a beard, a moustache, a scar, wrinkles. Charakter: ambitious, brave, calm, clever, confident, creative, decisive, generous, hard-working, honest, kind, lazy, loyal, mean (złośliwy/skąpy), modest, patient, polite, practical, quiet, responsible, selfish, sensitive, sociable, stubborn, talkative, tidy. Przeciwieństwa: un- (unfriendly, unkind, unfair, untidy), dis- (dishonest, disloyal), im- (impatient, impolite), ir- (irresponsible).\n2) Dane osobowe: first name, middle name, surname, age, date/place of birth, address, nationality, occupation, marital status (single, married, divorced, widow/widower), fill in a form.\n3) Ubrania: blouse, boxer shorts, coat, dress, hoody, fleece, jacket, jumper, raincoat, shirt, shorts, skirt, socks, suit, sweatshirt, tie, tights, tracksuit, trousers, underwear; boots, high heels, slippers, trainers, wellingtons; belt, bracelet, cap, earrings, gloves, hat, jewellery, necklace, scarf, umbrella; button, pocket, sleeve, zip; cotton, leather, silk, woolen. Styl: casual, comfortable, smart/elegant, fashionable, formal, loose, scruffy, tight. Wzory przed rzeczownikiem: striped socks, a spotted dress, checked, flowery, patterned, plain.\n4) Czasowniki: put on / take off, try (it) on, dress up as, get dressed, wear, go with, match, fit (rozmiar), suit (pasuje komuś).\n5) Gramatyka: to be (am/is/are; wiek: She is 18), have got/has got (Have you got…? Has she got…? hasn't got). Present Simple: zwyczaje i fakty (always, usually, often, never, every day; he/she/it + s; do/does). Present Continuous: teraz/tymczasowo (now, at the moment, Look!, Don't disturb her; am/is/are + -ing). Czasowniki stanu bez -ing: know, like, love, hate, want, need, mean, understand, believe, belong, think (=sądzić).\n6) Uczucia: amazed, amused, angry, annoyed, bored, confused, depressed, disappointed, embarrassed, excited, exhausted, frightened, hopeful, jealous, lonely, pleased, proud, stressed, surprised, tired. -ed = jak się czuję, -ing = jaka jest rzecz (I was bored by the play / The play was boring).\n7) Wyrażenia: afraid of, angry with sb, bored to death, fond of, good/bad/useless at, keen on, worried about, belong to, bite nails, blink eyes, change your mind, cross arms, hide/keep feelings inside, mental health, a piece of cake, put sb in a good/bad mood, sense of humour, tap fingers.\n8) Body language: crossing arms → unfriendly; biting nails → stress; blinking too much → maybe not telling the truth; tapping fingers → bored/impatient.\n9) Reading Miau Café: Ania helps stray cats; café = home for cats, cakes, playing with cats; start not a piece of cake – not enough money; almost 2,000 people gave 68,000 zloty via crowdfunding; House Rules: stroke only when the cat comes to you, don't disturb sleeping cats, no flash, don't speak too loud, don't feed, watch your kids.\n10) Functions: What do you like doing in your free time? Do you prefer A or B? What's your favourite…? What kind of… do you like? I'm interested in / into…; I like/enjoy/love/dislike/hate/can't stand + -ing; I prefer A to B. Sorry, I didn't understand/catch that. How do you say … in English? What's the Polish for…? Could you repeat that / say that again? Could you explain that? What do you mean? Do you mean…? Upcycling = giving a new life to old things.\n\nJAK POMAGAĆ\n- Przy czasach: zapytaj o sygnał (now? every day?).\n- Przy -ed/-ing: „Kto się czuje, a co jest takie?”\n- Przy fit/suit: „Rozmiar czy kolor?”\n- Poproś ucznia o własne zdanie po angielsku i popraw delikatnie.\n", "layout": "steps5"}, "images": {"wzory": {"svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 660 150\" font-family=\"sans-serif\"><g><clipPath id=\"c0\"><rect x=\"10\" y=\"10\" width=\"96\" height=\"96\" rx=\"8\"/><\/clipPath><g clip-path=\"url(#c0)\"><rect x=\"10\" y=\"10\" width=\"96\" height=\"96\" fill=\"#f4f1ea\"/><polyline points=\"10,18 22,26 34,18 46,26 58,18 70,26 82,18 94,26 106,18 118,26\" fill=\"none\" stroke=\"#c0392b\" stroke-width=\"4\"/><polyline points=\"10,34 22,42 34,34 46,42 58,34 70,42 82,34 94,42 106,34 118,42\" fill=\"none\" stroke=\"#2c7a7b\" stroke-width=\"4\"/><polyline points=\"10,50 22,58 34,50 46,58 58,50 70,58 82,50 94,58 106,50 118,58\" fill=\"none\" stroke=\"#d68910\" stroke-width=\"4\"/><polyline points=\"10,66 22,74 34,66 46,74 58,66 70,74 82,66 94,74 106,66 118,74\ \"/><circle cx=\"252\" cy=\"36\" r=\"2\" fill=\"#333\"/><path d=\"M245 60 L245 115 M245 115 L230 150 M245 115 L260 150\"/><path d=\"M245 72 L267 90 L249 52\"/><path d=\"M245 72 L220 100\"/><text x=\"245\" y=\"170\" text-anchor=\"middle\" font-size=\"13\" fill=\"#222\" stroke=\"none\">biting his nails<\/text><text x=\"245\" y=\"185\" text-anchor=\"middle\" font-size=\"12\" fill=\"#555\" stroke=\"none\">→ stressed<\/text><circle cx=\"410\" cy=\"40\" r=\"20\" fill=\"#fde9d9\"/><path d=\"M399 36 l8 0 M413 36 l8 0\"/><path d=\"M394 26 l4 4 M426 26 l-4 4\" stroke-width=\"2\"/><path d=\"M410 60 L410 115 M410 115 L395 150 M410 115 L425 150\"/><path d=\"M410 72 L385 100 M410 72 L435 100\"/><text x=\"410\" y=\"170\" text-anchor=\"middle\" font-size=\"13\" fill=\"#222\" stroke=\"none\">blinking a lot<\/text><text x=\"410\" y=\"185\" text-anchor=\"middle\" font-size=\"12\" fill=\"#555\" stroke=\"none\">→ not telling the truth?<\/text><circle cx=\"575\" cy=\"40\" r=\"20\" fill=\"#fde9d9\"/><circle cx=\"568\" cy=\"36\" r=\"2\" fill=\"#333\"/><circle cx=\"582\" cy=\"36\" r=\"2\" fill=\"#333\"/><path d=\"M575 60 L575 115 M575 115 L560 150 M575 115 L590 150\"/><path d=\"M530 105 L620 105\" stroke=\"#8a6d3b\" stroke-width=\"6\"/><path d=\"M575 72 L603 100 M575 72 L550 100\"/><path d=\"M605 96 l0 -6 M611 96 l0 -6\" stroke-width=\"2\"/><text x=\"575\" y=\"170\" text-anchor=\"middle\" font-size=\"13\" fill=\"#222\" stroke=\"none\">tapping her fingers<\/text><text x=\"575\" y=\"185\" text-anchor=\"middle\" font-size=\"12\" fill=\"#555\" stroke=\"none\">→ bored / impatient<\/text><\/svg>", "alt": "Mowa ciała: skrzyżowane ramiona, obgryzanie paznokci, częste mruganie, stukanie palcami (własny rysunek)", "source": "własny rysunek", "wide": true}}, "diagnostic": [{"id": "d1", "type": "mc", "tag": "l1", "q": "What is your best friend like? – o co pyta?", "options": ["o wygląd", "o charakter", "o to, co lubi", "o wiek"], "answer": 1, "explain": "**be like** = jaki jest (charakter). Wygląd: What does he look like?"}, {"id": "d2", "type": "mc", "tag": "l2", "q": "Które słowo znaczy „przymierzyć”?", "options": ["put on", "take off", "try on", "dress up"], "answer": 2, "explain": "**try on** = przymierzyć (try it on before you buy it)."}, {"id": "d3", "type": "mc", "tag": "l3", "q": "Choose: Look! My brother …… football in the garden.", "options": ["plays", "is playing", "play", "has played"], "answer": 1, "explain": "**Look!** = teraz → Present Continuous: is playing."}, {"id": "d4", "type": "mc", "tag": "l3", "q": "Choose: My sister …… 18.", "options": ["has", "has got", "is", "are"], "answer": 2, "explain": "Wiek: **to be** – She is 18."}, {"id": "d5", "type": "mc", "tag": "l4", "q": "The film was really ……. I almost fell asleep.", "options": ["bored", "boring", "boredom", "bore"], "answer": 1, "explain": "Film (rzecz) → **-ing**: boring."}, {"id": "d6", "type": "mc", "tag": "l5", "q": "Nie usłyszałeś imienia. Co mówisz?", "options": ["Sorry, I didn't catch your name.", "Sorry, I didn't take your name.", "What's the Polish for name?", "I prefer your name."], "answer": 0, "explain": "**Sorry, I didn't catch (your name).** – Nie dosłyszałem."}], "lessons": [{"id": "l1", "title": "Ludzie: dane, wygląd, charakter", "minutes": 15, "body": ["Słowniczek (s. 4) – część **ludzie**. Na sprawdzianie: opis osoby (wygląd + charakter), dane w formularzu i pytania typu What does he look like? / What is she like?", "⚠️ **What does she look like?** = jak wygląda (wygląd). **What is she like?** = jaka jest (charakter). **What does she like?** = co lubi.", "Kolejność w opisie: She's **tall** and **slim**. She's **in her twenties**. She's got **long, wavy, dark** hair and **freckles**. She's **sociable** and **hard-working**.", "Przeczenia przez przedrostek: **un-** (unfriendly, unkind, unfair, untidy, unattractive), **dis-** (dishonest, disloyal), **im-** (impatient, impolite), **ir-** (irresponsible).", "**Dane osobowe:** address – adres, age – wiek, date/place of birth – data/miejsce urodzenia, divorced – rozwiedziony/rozwiedziona, fill in a form – wypełnić formularz, first name – imię, male/female – męski/żeński, marital status – stan cywilny, married – żonaty/zamężna, middle name – drugie imię, nationality – narodowość, occupation – zawód, personal data – dane osobowe, single – stanu wolnego, surname – nazwisko, widow/widower – wdowa/wdowiec", "**Opis wyglądu:** (un)attractive – (nie)atrakcyjny, be similar to – być podobnym do, description – opis, good-looking – atrakcyjny, look like – wyglądać jak", "**Wzrost i budowa ciała:** be of medium height – być średniego wzrostu, be overweight – mieć nadwagę, fat – gruby, plump – pulchny, short – niski, slim – szczupły, tall – wysoki, thin – chudy, well-built – dobrze zbudowany", "**Wiek:** adult – dorosły, osoba dorosła, elderly – w podeszłym wieku, in his/her twenties – po dwudziestce, in his/her teens – nastoletni/nastoletnia, middle-aged – w średnim wieku, old – stary, young – młody", "**Twarz:** beard – broda, freckles – piegi, full/thin lips – pełne/wąskie usta, high forehead – wysokie czoło, moustache – wąsy, pale – blady, pimple – pryszcz, scar – blizna, snub nose – zadarty nos, strong chin – wydatny podbródek, tiny eyes – małe oczy, wrinkles – zmarszczki", "**Włosy:** bald – łysy, blond/fair/dark/red/grey – blond/jasne/ciemne/rude/siwe, curly – kręcone, dyed – farbowane, fringe – grzywka, pony tail – kucyk, spiky – sterczące, straight – proste, wavy – falujące", "**Cechy charakteru:** ambitious – ambitny, boring – nudny, brave – odważny, calm – spokojny, clever – bystry, confident – pewny siebie, creative – kreatywny, decisive – zdecydowany, (un)fair – (nie)sprawiedliwy, (un)friendly – (nie)miły, generous – szczodry, hard-working – pracowity, (dis)honest – (nie)uczciwy, inspiring – inspirujący, (un)kind – (nie)życzliwy, lazy – leniwy, (dis)loyal – (nie)lojalny, mean – złośliwy, skąpy, modest – skromny, (im)patient – (nie)cierpliwy, (im)polite – (nie)uprzejmy, practical – praktyczny, quiet – cichy, (ir)responsible – (nie)odpowiedzialny, selfish – samolubny, sensitive – wrażliwy, sociable – towarzyski, stubborn – uparty, talkative – rozmowny, (un)tidy – (nie)schludny"], "keyPoints": ["look like = wygląd, be like = charakter", "She's got + włosy/oczy/broda; She's + tall/slim/in her teens", "un-/dis-/im-/ir- tworzą przeciwieństwa cech", "mean = złośliwy/skąpy (nie „średni”)", "dane osobowe: first name, surname, nationality, occupation, marital status"], "why": [{"q": "Po co znać dane osobowe po angielsku?", "a": "Formularze (fill in a form), media społecznościowe, rejestracja na obozie – i typowe zadanie na sprawdzianie."}, {"q": "Czemu tyle przedrostków?", "a": "Z jednego słowa robisz dwa: patient → impatient. Szybko podwajasz słownictwo i łatwiej zgadujesz znaczenie."}], "tldr": {"pl": "Opis osoby = wygląd (She's got…, She's tall…) + charakter (She's kind…). look like ≠ be like. Przeczenia: un-, dis-, im-, ir-.", "en": "Describe people: appearance (She's got long hair, she's tall) + character (she's kind). look like ≠ be like. Opposites: un-, dis-, im-, ir-."}}, {"id": "l2", "title": "Ubrania, styl i czasowniki złożone", "minutes": 15, "body": ["Słowniczek – część **ubrania** + zadania 3 i 5 (s. 5).", "**Czasowniki złożone (phrasal verbs):** put on (załóż) ↔ take off (zdejmij), try on (przymierz), dress up as (przebierz się za), go with (pasuje do). Zaimek idzie **w środek**: try **it** on, take **it** off.", "**fit / suit / match / go with:** fit = rozmiar (It doesn't fit – za duże/za małe); suit = pasuje **komuś** (kolor, fason: Red suits you); match / go with = pasuje **do czegoś** (This scarf doesn't go with your coat).", "**Wear** = mieć na sobie, nosić (She's wearing a hoody). **Put on** = czynność zakładania. **Get dressed** = ubrać się.", "**Polish versus English:** przymiotnik wzoru stoi **przed** rzeczownikiem: striped socks (skarpety w paski), a spotted dress (sukienka w kropki), a checked shirt, flowery, patterned, plain.", "Liczba mnoga zawsze: trousers, jeans, shorts, tights, pyjamas → These are too tight, a pair of jeans.", "**Styl:** casual – nieformalny, comfortable – wygodny, elegant/smart – elegancki, fashionable – modny, formal – odświętny, oficjalny, loose – luźny, scruffy – obdarty, tight – obcisły", "**Części garderoby:** blouse – bluzka, boxer shorts – bokserki, coat – płaszcz, dress – sukienka, hoody – bluza z kapturem, fleece – polar, jacket – kurtka, jumper – sweter, pair of (jeans) – para (dżinsów), raincoat – płaszcz przeciwdeszczowy, shirt – koszula, shorts – krótkie spodenki, skirt – spódnica, socks – skarpetki, suit – garnitur, sweater – sweter, sweatshirt – bluza, tie – krawat, tights – rajstopy, tracksuit – dres, trousers – spodnie, underwear – bielizna", "**Buty:** boots – buty za kostkę, kozaki, high heels – buty na wysokim obcasie, shoes – buty, slippers – kapcie, trainers – obuwie sportowe, wellingtons – kalosze", "**Dodatki:** belt – pasek, bracelet – bransoletka, cap – czapka z daszkiem, earrings – kolczyki, gloves – rękawiczki, hat – czapka, kapelusz, jewellery – biżuteria, necklace – naszyjnik, scarf – szalik, umbrella – parasolka", "**Części ubrań:** button – guzik, pocket – kieszeń, sleeve – rękaw, zip – zamek błyskawiczny", "**Materiały:** cotton – bawełniany, leather – skórzany, plain – gładki, silk – jedwabny, woolen – wełniany", "**Czasowniki (ubrania):** dress – ubierać się, nosić (ubrania), dress up as sth – przebrać się za coś, fit – pasować (rozmiarem), get dressed – ubrać się, go with sth – pasować do czegoś, look (good) – wyglądać (dobrze), match – pasować (do czegoś), put on – założyć, suit – pasować (kolorem lub fasonem), take off – zdjąć, try on – przymierzyć, wear – nosić (ubranie)", "**Wzory na tkaninach (s. 5):** patterned – we wzory, spotted – w kropki, checked – w kratkę, striped – w paski, flowery – w kwiaty, plain – gładki"], "keyPoints": ["put on ↔ take off, try on, dress up as, go with", "fit = rozmiar, suit = pasuje komuś, match/go with = pasuje do czegoś", "try it on – zaimek w środku", "striped socks: wzór przed rzeczownikiem", "trousers/jeans/tights – zawsze liczba mnoga"], "why": [{"q": "Czemu fit i suit to nie to samo?", "a": "Sweter może pasować rozmiarem (fits), ale kolor ci nie pasuje (doesn't suit you). Na sprawdzianie to częsta pułapka."}, {"q": "Po co phrasal verbs?", "a": "Anglicy używają ich cały czas – put on your coat, take off your shoes. W zadaniu 5 (s. 5) wybierasz właściwy."}], "tldr": {"pl": "put on/take off/try on/dress up/go with; fit (rozmiar) ≠ suit (pasuje komuś) ≠ match (do czegoś); striped socks; trousers = l.mn.", "en": "put on/take off/try on/dress up/go with; fit (size) ≠ suit (looks good on you) ≠ match/go with (with sth); striped socks; trousers are plural."}, "images": [{"img": "wzory", "caption": "Polish versus English: wzory na tkaninach (własny rysunek)"}]}, {"id": "l3", "title": "Grammar: to be, have got, Present Simple vs Continuous", "minutes": 18, "body": ["**To be:** I **am** / you, we, they **are** / he, she, it **is**. Przeczenie: isn't, aren't, I'm not. Pytanie: Are you…? Is she…? Wiek: My sister **is** 18 (nie ✗ has!).", "**Have got:** I/you/we/they **have got** / he, she, it **has got**. Przeczenie: haven't got / hasn't got. Pytanie: **Have** you **got**…? **Has** she **got**…? (s. 6, zad. 1).", "**Present Simple** – zwyczaje, fakty, rutyna: Bob often **goes** to the cinema. The Earth **moves** around the Sun. Słówka: always, usually, often, sometimes, never, every day. **He/she/it + -s**; przeczenie doesn't + bezokolicznik; pytanie Do/Does…?", "**Present Continuous** – teraz, w tej chwili, sytuacja tymczasowa: I **am reading** a great book. Sorry, I can't talk now – I'**m getting** ready. Słówka: now, at the moment, today, this week, Look!, Listen!, Don't disturb her!", "**Czasowniki stanu** (nie mają formy -ing): know, like, love, hate, want, need, mean, understand, believe, belong, think (=sądzić). ✅ I don't understand. ❌ I'm not understanding. This skirt **belongs** to my sister.", "**Have** jako czynność może mieć -ing: We **are having** lunch. Ale posiadanie: He **has got** a beard.", "**Here's The News** (s. 6, zad. 5): William and Harry **are** the sons of… They **don't use** their surname… everybody **knows** who they are… a person who **hasn't got** enough strength… simply **doesn't want** to tell… The princes **hope** to encourage… At the moment they **are running** several projects."], "keyPoints": ["is/are + wiek: She is 18", "have got / has got; Have you got…?", "Present Simple: zwyczaje i fakty, he/she/it + -s, does/doesn't", "Present Continuous: teraz / tymczasowo, am/is/are + -ing", "czasowniki stanu (know, like, want, mean, belong) – bez -ing"], "why": [{"q": "Skąd wiem, który czas?", "a": "Szukaj sygnału: every day / usually / never → Simple; now / at the moment / Look! → Continuous. Czasownik stanu → zawsze Simple."}, {"q": "Czemu „She is 18”, a nie „has”?", "a": "Po angielsku wiek wyrażamy przez **to be** – I am 13 (years old)."}], "tldr": {"pl": "to be (am/is/are), have got/has got; Simple = zwyczaje/fakty (-s przy he/she/it), Continuous = teraz (am/is/are + -ing); know/like/want/mean/belong bez -ing.", "en": "to be (am/is/are), have got/has got; Present Simple = habits/facts (he/she/it + s), Present Continuous = now (am/is/are + -ing); state verbs (know, like, want, mean, belong) no -ing."}}, {"id": "l4", "title": "Uczucia: -ed/-ing, przyimki, mowa ciała", "minutes": 15, "body": ["**Przymiotniki -ed / -ing (Słowotwórstwo, s. 4):** **-ed** = jak **ja się czuję** (I was **bored** by the play – byłem znudzony), **-ing** = jaka jest **rzecz/osoba/sytuacja** (The play was really **boring** – sztuka była nudna). Tak samo: amused/amusing, excited/exciting, embarrassed/embarrassing, tired/tiring, surprised/surprising, frightened/frightening, interested/interesting, annoyed/annoying, confused/confusing, disappointed/disappointing, exhausted/exhausting, amazed/amazing.", "**Przyimki po przymiotnikach (s. 5, zad. 6):** afraid **of**, fond **of**, angry **with** sb (angry **about** sth), keen **on**, good/bad/useless **at**, worried **about**, interested **in**, put sb **in** a good/bad mood, have a sense **of** humour, belong **to**.", "**Mowa ciała (Listening, s. 8):** crossing your arms in front of your chest makes you look **unfriendly**; some people **bite their nails** when they are under stress; someone may not be telling the truth if they **blink** too much; tapping your fingers can show that you are bored / impatient.", "Zdania z zad. 4 (s. 8): She is **biting** her nails. She is **tapping** her fingers. She is **crossing** her arms. She is **blinking** her eyes. (Present Continuous – opis zdjęcia).", "Przysłowie z s. 8: You will never get a second chance to make a first impression. – Nie będzie drugiej szansy na zrobienie pierwszego wrażenia.", "**Uczucia i emocje:** amazed – zdumiony, amused – rozbawiony, angry – zły, rozgniewany, annoyed – rozdrażniony, bored – znudzony, confused – zdezorientowany, zagubiony, depressed – przygnębiony, disappointed – rozczarowany, embarrassed – zawstydzony, excited – podekscytowany, exhausted – wyczerpany, frightened – przestraszony, hopeful – pełen nadziei, jealous – zazdrosny, lonely – samotny, pleased – zadowolony, proud – dumny, stressed – zestresowany, surprised – zaskoczony, tired – zmęczony", "**Zwroty i wyrażenia:** be afraid of sth – bać się czegoś, be angry with sb – być złym na kogoś, be bored to death – śmiertelnie się nudzić, be fond of sth – lubić coś, be good/bad at sth – być dobrym/kiepskim w czymś, be keen on sth – interesować się czymś, be useless at sth – być beznadziejnym w czymś, be worried about sth – martwić się czymś, belong to – należeć do, bite (your) nails – obgryzać paznokcie, blink (your) eyes – mrugać oczami, change (your) mind – zmienić zdanie, cross (your) arms – skrzyżować ramiona, hide (your) feelings – ukrywać swoje uczucia, keep (your) feelings inside – nie okazywać uczuć, mental health – zdrowie psychiczne, (it's) a piece of cake – (to) bułka z masłem, łatwizna, put sb in a good/bad mood – wprawiać kogoś w dobry/zły nastrój, sense of humour – poczucie humoru, tap (your) fingers – stukać palcami"], "keyPoints": ["-ed = co czuję, -ing = jaka jest rzecz/sytuacja", "afraid of, fond of, angry with, keen on, good at, worried about, interested in", "crossed arms → unfriendly; biting nails → stress; blinking a lot → maybe lying; tapping fingers → bored/impatient", "opis zdjęcia: She is biting/tapping/crossing/blinking"], "why": [{"q": "Czemu „I'm boring” to wpadka?", "a": "„I'm boring” = jestem nudny (dla innych). Jeśli ci się nudzi, mówisz **I'm bored**."}, {"q": "Czy mowa ciała jest ważna?", "a": "Tak – zanim coś powiesz, ludzie już oceniają twoją postawę (first impression)."}], "tldr": {"pl": "-ed = czuję się, -ing = coś jest takie. afraid of, fond of, angry with, keen on, good at, worried about. Mowa ciała: arms crossed, biting nails, blinking, tapping fingers.", "en": "-ed = how I feel, -ing = what something is like. afraid of, fond of, angry with, keen on, good at, worried about. Body language: crossed arms, biting nails, blinking, tapping fingers."}, "images": [{"img": "mowaciala", "caption": "Mowa ciała – 4 sygnały z lekcji 1.4 (własny rysunek)"}]}, {"id": "l5", "title": "Reading & Functions: Miau Café, hobby, rozmowa", "minutes": 15, "body": ["**Reading – Miau Café (s. 7):** Ania is **passionate about** helping **stray** cats (bezpańskie). The café is a safe and caring home for cats; people can eat cakes and play with the cats. The start was **not a piece of cake** – Ania **did not have enough money**. Almost 2,000 people gave her 68,000 zloty through **crowdfunding** (zbiórka w internecie). Stroking a cat makes you forget about your problems – cats are 'the best anti-depressants'. Open Tuesday–Sunday 11 a.m.–9 p.m.", "**House Rules:** not every cat likes **to be stroked** – do it only when it comes to you; cats don't enjoy being stroked when they are **asleep**; no **flash** when taking pictures; don't speak too loud – cats **avoid noise**; don't **feed** the cats; watch your kids so they don't **scare** the cats.", "**Słówka z kawiarni (zad. 2):** I'm **fond of** sport, I'm **keen on** board games, I **love** cakes, I **enjoy** live music → The Whistle (football), The Ice Dice (Scrabble), The Sweet Tooth (cakes), The High Note (concert), The Coffee Bookworm (magazines).", "**Functions – zainteresowania (s. 9):** What do you like **doing** in your free time? Do you prefer (action films) **or** (comedies)? What's your favourite (sport)? What kind of (computer games) do you like? I'm interested **in** (film). I'm into (film). I like/enjoy/love **(bowling)**. I dislike/don't like/hate/can't stand **(making my bed)**. I prefer (reading books) **to** (watching films). Po like/enjoy/love/hate/prefer/can't stand → **-ing**.", "**Prowadzenie rozmowy:** Sorry, I didn't understand that. How do you say 'polar' in English? What's the Polish for 'mean'? Sorry, I didn't catch (your name). Could you repeat that, please? / Could you say that again? Could you explain that? What do you mean? Do you mean (Poland)?", "**Upcycling (s. 9):** giving a new life to old things – Are you **looking** for a new pastime? If you **prefer** creative hobbies to video games… What does upcycling actually **mean**? … **grow** plants in old shoes … You just need to **use** your imagination. (zad. 2: looking, prefer, mean, grow, use; zbędne: catch, enjoying, matters).", "**Use of English (zad. 4 i 6, s. 9):** What **do you like doing** in your free time? What kind of music **do you listen to**? **Do you prefer playing** computer games or reading books? What's **your favourite type of** TV programme? **Do you enjoy taking** pictures? What kind of sport **do you dislike**? · Where **do you come** from? And what **do you do** for a living? Sorry, I didn't catch it. **Could you say that** again? **Do you mean** you grow something…?"], "keyPoint ."}, {"id": "q11", "type": "mc", "tag": "l2", "q": "Don't …… your coat; it's very cold here. (s. 5)", "options": ["take away", "take off", "put up", "go on"], "answer": 1, "explain": "**take off** = zdjąć."}, {"id": "q12", "type": "mc", "tag": "l2", "q": "I like this dress, but I must …… before I buy it.", "options": ["try it out", "try it on", "put it up", "dress it up"], "answer": 1, "explain": "**try it on** – zaimek w środku."}, {"id": "q13", "type": "mc", "tag": "l2", "q": "This scarf doesn't …… your coat. It's the wrong colour.", "options": ["go on", "go with", "fit", "dress"], "answer": 1, "explain": "**go with** = pasować do czegoś."}, {"id": "q14", "type": "mc", "tag": "l2", "q": "Last year I …… as a goblin for the school party.", "options": ["dressed up", "dressed down", "put on", "got dressed"], "answer": 0, "explain": "**dress up as** = przebrać się za."}, {"id": "q15", "type": "mc", "tag": "l2", "q": "This sweatshirt doesn't fit. – pasująca odpowiedź (s. 5, zad. 3):", "options": ["It's too large and the sleeves are too long.", "They won't match.", "I only like plain underwear.", "You look really smart."], "answer": 0, "explain": "doesn't fit = zły **rozmiar** → too large."}, {"id": "q16", "type": "mc", "tag": "l2", "q": "Do you really want to wear a striped tie with a checked shirt?", "options": ["They won't match.", "These are too tight.", "It's too large.", "I like loose pyjamas."], "answer": 0, "explain": "Paski + krata → **They won't match**."}, {"id": "q17", "type": "mc", "tag": "l2", "q": "Skarpety w paski to po angielsku:", "options": ["socks striped", "striped socks", "socks in stripes", "stripe's socks"], "answer": 1, "explain": "Przymiotnik wzoru **przed** rzeczownikiem: striped socks."}, {"id": "q18", "type": "mc", "tag": "l2", "q": "Które słowo znaczy „obdarty, niechlujny” (styl)?", "options": ["scruffy", "smart", "casual", "formal"], "answer": 0, "explain": "scruffy = obdarty."}, {"id": "q19", "type": "mc", "tag": "l2", "q": "Red really …… thes because he cares about animals.", "options": ["wear", "wears", "is wearing", "wearing"], "answer": 1, "explain": "never + he → **wears**."}, {"id": "q31", "type": "mc", "tag": "l3", "q": "Don't disturb her, please. She …… for a test.", "options": ["studies", "is studying", "study", "studying"], "answer": 1, "explain": "Don't disturb = teraz → **is studying**."}, {"id": "q32", "type": "mc", "tag": "l3", "q": "What …… about the film? (he / think = sądzić)", "options": ["is he thinking", "does he think", "he thinks", "do he think"], "answer": 1, "explain": "think = sądzić → stan → **does he think**."}, {"id": "q33", "type": "mc", "tag": "l3", "q": "Które zdanie jest poprawne?", "options": ["I'm not understanding what they are saying.", "I don't understand what they are saying.", "I not understand what they say.", "I am not understand."], "answer": 1, "explain": "understand – czasownik stanu: **I don't understand**."}, {"id": "q34", "type": "mc", "tag": "l3", "q": "This checked skirt …… my sister. (należy do)", "options": ["is belonging to", "belongs to", "belong to", "has got"], "answer": 1, "explain": "**belongs to** – stan, bez -ing."}, {"id": "q35", "type": "short", "tag": "l3", "q": "Uzupełnij (s. 6): Mike …… a beard. (ma brodę) – 2–3 słowa", "accept": ["has got", "has", "s got"], "explain": "**has got** a beard."}, {"id": "q36", "type": "mc", "tag": "l4", "q": "I was …… by the play.", "options": ["bored", "boring"], "answer": 0, "explain": "Ja się czułem → **bored**."}, {"id": "q37", "type": "mc", "tag": "l4", "q": "What sort of things are you afraid ……?", "options": ["at", "of", "on"], "answer": 1, "explain": "afraid **of**."}, {"id": "q38", "type": "mc", "tag": "l4", "q": "What sort of things put you …… a bad mood?", "options": ["in", "on", "to"], "answer": 0, "explain": "put sb **in** a bad mood."}, {"id": "q39", "type": "mc", "tag": "l4", "q": "Are you sometimes angry …… your friends?", "options": ["on", "to", "with"], "answer": 2, "explain": "angry **with** sb."}, {"id": "q40", "type": "mc", "tag": "l4", "q": "Are you fond …… animals?", "options": ["about", "of", "to"], "answer": 1, "explain": "fond **of**."}, {"id": "q41", "type": "mc", "tag": "l4", "q": "Do you think it is important to have a …… of humour?", "options": ["feeling", "sense", "sensation"], "answer": 1, "explain": "**sense** of humour."}, {"id": "q42", "type": "mc", "tag": "l4", "q": "Ktoś krzyżuje ramiona na piersi – według nagrania wygląda na:", "options": ["unfriendly", "excited", "proud", "amused"], "answer": 0, "explain": "Crossing your arms… makes you look **unfriendly**."}, {"id": "q43", "type": "mc", "tag": "l4", "q": "Ludzie obgryzają paznokcie, gdy są:", "options": ["under stress", "bored to death", "proud", "amazed"], "answer": 0, "explain": "Some people **bite their nails** when they are under stress."}, {"id": "q44", "type": "mc", "tag": "l4", "q": "The news was really ……! (zaskakujące)", "options": ["surprised", "surprising"], "answer": 1, "explain": "news (rzecz) → **surprising**."}, {"id": "q45", "type": "short", "tag": "l4", "q": "Wpisz po angielsku: **zazdrosny**", "accept": ["jealous"], "explain": "**jealous**."}, {"id": "q46", "type": "mc", "tag": "l5", "q": "Miau Café helps:", "options": ["stray cats", "stray dogs", "old people", "football fans"], "answer": 0, "explain": "Ania helps **stray cats**."}, {"id": "q47", "type": "mc", "tag": "l5", "q": "Why was the start of the café 'not a piece of cake'?", "options": ["Ania didn't like cats", "Ania didn't have enough money", "the cats were ill", "nobody came"], "answer": 1, "explain": "Ania did not have enough money – pomógł crowdfunding."}, {"id": "q48", "type": "mc", "tag": "l5", "q": "**crowdfunding** to:", "options": ["zbiórka pieniędzy od wielu osób w internecie", "kredyt w banku", "koncert charytatywny", "sprzedaż ciast"], "answer": 0, "explain": "raising small amounts of money from a large number of people, typically via the Internet."}, {"id": "q49", "type": "mc", "tag": "l5", "q": "House rule: why shouldn't you speak too loud?", "options": ["cats avoid noise", "cats are asleep", "cats are hungry", "the café is closed"], "answer": 0, "explain": "cats avoid noise."}, {"id": "q50", "type": "mc", "tag": "l5", "q": "Which café for someone who says I'm fond of sport?", "options": ["The Whistle", "The Sweet Tooth", "The Ice Dice", "The High Note"], "answer": 0, "explain": "The Whistle – football on a huge screen."}, {"id": "q51", "type": "mc", "tag": "l5", "q": "What do you like …… in your free time?", "options": ["do", "doing", "to doing", "done"], "answer": 1, "explain": "like **doing**."}, {"id": "q52", "type": "mc", "tag": "l5", "q": "I prefer reading books …… watching films.", "options": ["than", "to", "from", "as"], "answer": 1, "explain": "prefer A **to** B."}, {"id": "q53", "type": "mc", "tag": "l5", "q": "Chcesz, żeby ktoś powtórzył. Mówisz:", "options": ["Could you say that again?", "Could you explain me?", "What's the Polish for again?", "Do you mean again?"], "answer": 0, "explain": "Could you repeat that, please? / Could you say that again?"}, {"id": "q54", "type": "mc", "tag": "l5", "q": "Are you …… for a new pastime? (upcycling, zad. 2)", "options": ["looking", "catch", "matters", "enjoying"], "answer": 0, "explain": "look **for** = szukać → Are you looking for…"}, {"id": "q55", "type": "short", "tag": "l5", "q": "Uzupełnij (s. 9): X: Where …… from? Y: I'm from Canada. (come)", "accept": ["do you come"], "explain": "**do you come** from."}], "explainPrompts": [{"id": "e1", "tag": "l1", "prompt": "Opisz po angielsku swojego przyjaciela/przyjaciółkę: wygląd (2 cechy) i charakter (2 cechy). 3–4 zdania.", "keyPoints": ["wygląd: He's/She's tall/slim… albo He's/She's got … hair/eyes", "drugi element wyglądu (włosy, oczy, piegi, broda, wiek)", "charakter: 2 przymiotniki (kind, sociable, clever…)"], "model": "My best friend is Ola. She's tall and slim and she's got long, wavy, dark hair and freckles. She's sociable and hard-working, and she's got a great sense of humour.", "kw": [["tall|short|slim|thin|plump|well built|medium height|overweight|good looking|attractive"], ["hair|eyes|freckles|beard|moustache|fringe|pony|curly|wavy|straight|teens|twenties|glasses"], ["kind|sociable|clever|friendly|generous|funny|honest|confident|creative|brave|calm|hard working|talkative|polite|patient|modest|loyal|lazy|stubborn|selfish|quiet|tidy"]]}, {"id": "e2", "tag": "l2", "prompt": "Wyjaśnij po polsku różnicę między fit, suit i go with/match. Podaj angielski przykład do jednego z nich.", "keyPoints": ["fit = rozmiar", "suit = pasuje komuś (kolor, fason)", "go with / match = pasuje do innej rzeczy"], "model": "Fit – pasuje rozmiarem (This sweatshirt doesn't fit – it's too large). Suit – pasuje komuś kolorem lub fasonem (Red suits you). Go with / match – pasuje do czegoś (This scarf doesn't go with your coat).", "kw": [["fit+rozmiar|size|large|small|duz|mal|ciasn|tight"], ["suit+kolor|fason|komus|you|wyglad|colour|color"], ["go with|match+do czegos|coat|scarf|inn|tie|shirt|pasuje do"]]}, {"id": "e3", "tag": "l3", "prompt": "Wyjaśnij, kiedy używamy Present Simple, a kiedy Present Continuous. Podaj po jednym angielskim przykładzie.", "keyPoints": ["Present Simple: zwyczaje / fakty / rutyna (always, usually, every day)", "Present Continuous: teraz / w tej chwili / tymczasowo (now, at the moment)", "poprawne przykłady (np. He goes… / She is reading…)"], "model": "Present Simple – zwyczaje i fakty: Bob often goes to the cinema. The Earth moves around the Sun. Present Continuous – to, co dzieje się teraz lub tymczasowo: I am reading a great book now. Look! He is playing football.", "kw": [["zwycza|fakt|rutyn|regular|czesto|always|usually|often|every|never|habit|codzien"], ["teraz|now|moment|chwil|tymczas|w tej chwili|look|listen|aktualn"], ["goes|plays|works|lives|likes|moves|watches|reads|studies|^does|^do$", "^am$|^is$|^are$|^m$|^re$+ing$"]]}, {"id": "e4", "tag": "l4", "prompt": "Wyjaśnij różnicę między bored i boring i ułóż po jednym zdaniu z każdym.", "keyPoints": ["-ed (bored) = jak się czuję", "-ing (boring) = jaka jest rzecz/osoba/sytuacja", "dwa poprawne zdania"], "model": "Bored – opisuje, jak się czuję (I'm bored – nudzi mi się). Boring – opisuje rzecz lub osobę (The play was boring – sztuka była nudna). I was bored by the film because it was really boring.", "kw": [["bored+czuj|^ja$|znudzon|feel|nudzi mi|emocj|^ja s"], ["boring+rzecz|film|sytuac|nudn|ksiazk|lekcj|sztuk|play|ktos jest|osoba jest"], ["^i m bored|^i was bored|^i am bored|^im bored+was boring|is boring|are boring|s boring|very boring|really boring"]]}, {"id": "e5", "tag": "l5", "prompt": "Napisz 2 pytania o czyjeś zainteresowania i 1 zwrot, gdy czegoś nie zrozumiesz (po angielsku).", "keyPoints": ["pytanie o czas wolny / hobby (What do you like doing…? Do you prefer…? What kind of…?)", "drugie pytanie o zainteresowania", "zwrot naprawczy (Sorry, I didn't catch/understand… Could you repeat/say that again? What do you mean?)"], "model": "What do you like doing in your free time? What kind of music do you listen to? Sorry, I didn't catch that. Could you say that again?", "kw": [["free time|like doing|prefer|favourite|favorite|what kind|enjoy|interested|hobby|into"], ["=? +what|do you|are you|which"], ["catch|understand|repeat|again|explain|what do you mean|do you mean|how do you say|polish for"]]}], "mockTest": {"id": "kartkowka-ang-u1", "title": "Kartkówka – Unit 1 (10 min)", "minutes": 10, "gradeScale": [[0, "niedostateczny"], [31, "dopuszczający"], [51, "dostateczny"], [71, "dobry"], [88, "bardzo dobry"], [97, "celujący"]], "intro": "Szybki test na rozgrzewkę – po każdej odpowiedzi zobaczysz wyjaśnienie.", "tasks": [{"id": "k1", "type": "mc", "tag": "l3", "q": "She usually …… to school by bus.", "options": ["go", "is going", "goes", "going"], "answer": 2, "explain": "usually + she → **goes**."}, {"id": "k2", "type": "mc", "tag": "l3", "q": "Please be quiet! She …… for a test.", "options": ["studies", "is s
