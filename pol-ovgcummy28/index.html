<title>Głoski, litery i alfabet</title>
<style>
/* Kids template v1 (Ogarnio). Tokens come from theme_ogarnio.KIDS_CSS (fallbacks here). */
:root{--k-bg:#FBF6EC;--k-card:#FFFDF8;--k-ink:#292D29;--k-soft:#68665D;--k-line:#E6E0D3;--k-pri:#5E8F62;--k-pri-d:#45704A;--k-pri-pale:#E3EFDF;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

 user-select:none;-webkit-user-select:none;padding-bottom:env(safe-area-inset-bottom)}

.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:color-mix(in srgb,var(--k-bg) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.top .ttl{flex:1;font-weight:800;font-size:1.05rem;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:52px;height:52px;border-radius:18px;background:var(--k-card);box-shadow:var(--k-shadow);font-size:1.5rem;display:grid;place-items:center;flex:none}
.ib[hidden]{display:none}

.wrap{max-width:980px;margin:0 auto;padding:0 14px 40px}
/* stage: mascot + bubble */
.stage{display:flex;align-items:flex-end;gap:10px;margin:4px 0 14px;min-height:118px}
.ogi-box{width:118px;height:126px;flex:none;cursor:pointer}
.bubble{position:relative;flex:1;margin-top:30px;background:var(--k-card);border-radius:24px;padding:14px 18px;box-shadow:var(--k-shadow);font-weight:700;font-size:1.08rem;min-height:64px;display:flex;align-items:center;gap:10px}

.bubble .rep{margin-left:auto;font-size:1.3rem;width:46px;height:46px;border-radius:15px;background:var(--k-pri-pale);flex:none}

@media(min-width:760px){.ogi-box{width:150px;height:150px}.stage{min-height:150px}.bubble{font-size:1.2rem}}
/* mascots: bear (Miś Bury) + lemming gang – original characters */
.bear{width:100%;height:100%;overflow:visible}
.bear .bd{transform-origin:100px 215px;animation:breathe 3.4s ease-in-out infinite}
.bear .lid{transform-origin:center;transform-box:fill-box;transform:scaleY(0);animation:blink 5s infinite}
.bear .mo{transform-origin:center;transform-box:fill-box;transform:scaleY(.15)}
.bear .armL{transform-origin:58px 150px;transition:transform .35s}.bear .armR{transform-origin:142px 150px;transition:transform .35s}
.bear .head{transform-origin:100px 130px;transition:transform .4s}.bear .brow{transition:transform .3s}.bear .sweat{opacity:0}.bear .hap{opacity:0}
.bear.talk .mo{animation:jaw .2s ease-in-out infinite alternate}.bear.talk .head{animation:nod .5s ease-in-out infinite alternate}
.bear.cheer .bd{animation:bjump .6s cubic-bezier(.3,.7,.4,1) 2}.bear.cheer .armL{transform:rotate(130deg)}.bear.cheer .armR{transform:rotate(-130deg)}
.bear.cheer .eyes{opacity:0}.bear.cheer .hap{opacity:1}.bear.cheer .mo{transform:scaleY(1)}
.bear.oops .head{transform:rotate(-8deg)}.bear.oops .armR{transform:rotate(-145deg)}.bear.oops .brow{transform:translateY(-5px)}.bear.oops .sweat{opacity:1;animation:drip 1.2s ease-in 1}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.985)}}
@keyframes blink{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
@keyframes jaw{from{transform:scaleY(.2)}to{transform:scaleY(1)}}@keyframes nod{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
@keyframes bjump{0%{transform:translateY(0)}25%{transform:translateY(3px) scale(1.04,.96)}55%{transform:translateY(-16px)}100%{transform:translateY(0)}}
@keyframes drip{from{transform:translateY(0)}to{transform:translateY(14px);opacity:0}}
.lem{width:100%;height:100%;overflow:visible}.lem .lb{transform-origin:30px 62px}.lem .pp{transition:transform .25s}
.lem .lid{transform-origin:center;transform-box:fill-box;transform:scaleY(0);animation:blink 4.2s infinite}
.gang{position:absolute;right:16px;top:-30px;display:flex;gap:2px;pointer-events:none}
.gang .lw{width:40px;height:44px;transform-origin:50% 100%;animation:gbob var(--d,3s) cubic-bezier(.45,0,.55,1) var(--dl,0s) infinite}.gang .lw:nth-child(2){width:34px}
@keyframes gbob{0%,100%{translate:0 0;scale:1 1}38%{translate:0 -3px;scale:1.02 .985}68%{translate:0 0;scale:1 1}74%{scale:1.05 .93}80%{scale:.98 1.03}87%{scale:1 1}}
.gang.cheer .lw{animation:gjump var(--jd,.55s) cubic-bezier(.3,.7,.4,1) var(--dl2,0s) 2}
@keyframes gjump{0%,100%{translate:0 0;rotate:0deg;scale:1 1}15%{scale:1.08 .9}50%{translate:0 calc(var(--h,22px) * -1);rotate:var(--r,8deg);scale:.96 1.05}85%{translate:0 0;scale:1.05 .95}}
.gang.oops .lw{animation:gshake .55s cubic-bezier(.36,.07,.19,.97) var(--dl2,0s) 2}
@keyframes gshake{10%,90%{translate:-1px 0}20%,80%{translate:3px -1px}30%,50%,70%{translate:-4px 0}40%,60%{translate:4px -2px}}
@keyframes peek{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-9px)}}
@keyframes hopBig{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-26px) rotate(12deg)}}@keyframes panic{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
.bubble.lem{background:#E8EEF4}.bubble.lem:before{border-right-color:#E8EEF4}
.lemlayer{position:fixed;left:0;right:0;bottom:0;height:120px;pointer-events:none;z-index:60;overflow:hidden}
.lemlayer .lw{position:absolute;bottom:4px;width:58px;height:62px}
.lemlayer .run{animation:run var(--d,1.8s) cubic-bezier(.42,.08,.62,.96) var(--dl,0s) both}.lemlayer .run .lb{transform-origin:50% 100%;animation:hoparc var(--hd,.26s) cubic-bezier(.2,.6,.4,1) infinite alternate}
@keyframes hoparc{from{translate:0 0;rotate:-7deg;scale:1.04 .96}to{translate:0 -14px;rotate:6deg;scale:.97 1.03}}
.lemlayer .trip{animation:run var(--d,2.1s) cubic-bezier(.42,.08,.62,.96) var(--dl,0s) both}.lemlayer .trip .lb{animation:tumble var(--d,2.1s) cubic-bezier(.45,.05,.55,.95) var(--dl,0s) both}
.lemlayer .pop{animation:popup 1.5s cubic-bezier(.3,.7,.4,1) forwards}
.lemlayer .party{animation:pin .25s ease-out both,partyhop var(--d,.55s) cubic-bezier(.2,.6,.4,1) var(--dl,0s) infinite alternate}
@keyframes pin{from{opacity:0}to{opacity:1}}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(calc(-100vw - 160px))}}
@keyframes waddle{from{transform:rotate(-8deg) translateY(0)}to{transform:rotate(8deg) translateY(-6px)}}
@keyframes tumble{0%,40%{transform:rotate(0)}55%{transform:rotate(-200deg) translateY(-10px)}70%{transform:rotate(-360deg)}100%{transform:rotate(-360deg)}}
@keyframes popup{0%{transform:translateY(90px)}35%{transform:translateY(-30px) rotate(-10deg)}55%{transform:translateY(0) rotate(8deg)}75%{transform:translateY(-12px)}100%{transform:translateY(100px)}}
@keyframes partyhop{from{translate:0 0;rotate:calc(var(--r,6deg) * -1);scale:1.06 .94}to{translate:0 calc(var(--h,40px) * -1);rotate:var(--r,6deg);scale:.97 1.04}}
.peeker{position:fixed;right:-10px;bottom:-70px;width:70px;height:76px;z-index:55;pointer-events:none;transition:bottom .5s cubic-bezier(.3,.7,.4,1)}.peeker.on{bottom:-14px}
/* image mascots (C.mascotImg): stacked pose images, CSS picks the visible one; transforms animate the wrapper */
.mimg{position:relative;width:100%;height:100%}.mimg .bd,.mimg .fl{position:absolute;inset:0}
.mimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%;opacity:0;pointer-events:none;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none;transition:opacity .2s ease,scale .24s cubic-bezier(.3,.7,.4,1)}
.mimg .p-idle{opacity:1}
/* bear layers: root = event jumps, .bd = slow breathing, .amp = JS speech motion (sway + amplitude bounce) */
.bear.mimg{transform-origin:50% 100%}.bear.mimg .amp{position:absolute;inset:0;transform-origin:50% 100%}
.bear.mimg .bd{transform-origin:50% 100%;animation:bbreathe 3.6s cubic-bezier(.45,0,.55,1) infinite alternate}
@keyframes bbreathe{from{scale:1 1}to{scale:1.012 1.018}}
.bear.mimg img{opacity:0;scale:.97}
.bear.mimg[data-pose=idle] .p-idle,.bear.mimg[data-pose=talk] .p-talk,.bear.mimg[data-pose=cheer] .p-cheer,.bear.mimg[data-pose=oops] .p-oops{opacity:1;scale:1}
.bear.mimg.cheer{animation:bjump2 .65s cubic-bezier(.3,.7,.4,1) 1}
@keyframes bjump2{0%{translate:0 0;scale:1 1}20%{translate:0 2px;scale:1.04 .95}55%{translate:0 -12px;scale:.98 1.03}80%{translate:0 0;scale:1.02 .98}100%{translate:0 0;scale:1 1}}
.bear.mimg.oops{animation:boops .9s cubic-bezier(.36,.07,.19,.97) 1}
@keyframes boops{0%,100%{rotate:0deg}25%{rotate:-3deg}55%{rotate:2deg}80%{rotate:-1deg}}
.lem.mimg .lb{position:absolute;inset:0;transform-origin:50% 100%}
.gang.laugh .lem.mimg img:not(.p-laugh){opacity:0}.gang.laugh .lem.mimg .p-laugh{opacity:1}
.gang.cheer .lem.mimg img:not(.p-cheer),.lemlayer .party .lem.mimg img:not(.p-cheer),.lemlayer .pop .lem.mimg img:not(.p-cheer){opacity:0!important}
.gang.cheer .lem.mimg .p-cheer,.lemlayer .party .lem.mimg .p-cheer,.lemlayer .pop .lem.mimg .p-cheer{opacity:1!important}
.lemlayer .party.alt .lem.mimg .p-cheer,.lemlayer .pop.alt .lem.mimg .p-cheer{opacity:0!important}.lemlayer .party.alt .lem.mimg .p-laugh,.lemlayer .pop.alt .lem.mimg .p-laugh{opacity:1!important}
.gang.oops .lem.mimg img:not(.p-panic),.lemlayer .run .lem.mimg img:not(.p-panic),.lemlayer .trip .lem.mimg img:not(.p-panic){opacity:0!important}
.gang.oops .lem.mimg .p-panic,.lemlayer .run .lem.mimg .p-panic,.lemlayer .trip .lem.mimg .p-panic{opacity:1!important}
.lemlayer .run .lem.mimg .fl,.lemlayer .trip .lem.mimg .fl{transform:scaleX(var(--pf,1))!important}
body.imgm .lemlayer{height:150px}body.imgm .lemlayer .lw{width:76px;height:82px}body.imgm .gang .lw{width:46px;height:50px}body.imgm .gang .lw:nth-child(2){width:40px}
body.imgm .peeker{width:84px;height:90px}
.start .gangpic{width:min(330px,86vw);margin-top:-30px;animation:gpic 1.5s cubic-bezier(.45,0,.55,1) infinite alternate;transform-origin:50% 100%}
@keyframes gpic{from{translate:0 0;scale:1 1}to{translate:0 -6px;scale:1.01 .99}}.start .gangpic img{display:block;width:100%;height:auto;max-height:240px;object-fit:contain}
body.imgm .start .ogi-box{width:220px;height:250px}
@media(prefers-reduced-motion:reduce){.bear,.bear *,.lem *,.gang *,.lemlayer *,.start .gangpic,.mimg img{transition-duration:.01s!important;animation-duration:.01s!important;animation-iteration-count:1!important}}
/* cards & tiles */
.card{background:var(--k-card);border-radius:var(--k-r);box-shadow:var(--k-shadow);padding:18px;margin:0 0 14px}
h2{font-size:1.5rem;margin:6px 0 12px;letter-spacing:-.02em}h3{margin:0 0 8px;font-size:1.2rem}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tile{background:var(--k-card);border-radius:var(--k-r);box-shadow:var(--k-shadow);padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-weight:800;min-height:140px;justify-content:center;transition:transform .12s}
.tile:active{transform:scale(.96)}.tile .em{font-size:3rem;line-height:1}.tile small{font-weight:600;color:var(--k-soft);font-size:.85rem}
.tile.big{grid-column:span 2;min-height:150px}.tile.pri{background:var(--k-pri);color:#fff}.tile.pri small{color:#E8F2E5}
.tile.vq{flex-direction:row;gap:14px;background:linear-gradient(135deg,#F3E3CF,#E6D2B8);font-size:1.35rem;text-align:left}.tile.vq .vqb{width:96px;height:96px;object-fit:contain;flex:none}.tile.vq small{display:block;margin-top:4px}
.tile.sun{background:var(--k-sun-pale)}.tile.vow{background:var(--k-vow-pale)}.tile.con{background:var(--k-con-pale)}
.st{color:var(--k-sun);letter-spacing:2px;font-size:1.05rem}.st i{font-style:normal;color:#D9D2C2}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:60px;padding:12px 26px;border-radius:20px;background:var(--k-pri);color:#fff;font-weight:800;font-size:1.15rem;box-shadow:0 4px 0 var(--k-pri-d);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--k-pri-d)}.btn.sec{background:var(--k-card);color:var(--k-ink);box-shadow:0 4px 0 var(--k-line)}
.btn.sun{background:var(--k-sun);color:#3a2a06;box-shadow:0 4px 0 #C98F22}.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center}
.center{text-align:center}.muted{color:var(--k-soft)}
/* letters */
.L{display:inline-grid;place-items:center;min-width:58px;height:66px;padding:0 10px;border-radius:18px;background:var(--k-card);box-shadow:0 3px 0 var(--k-line),0 4px 10px rgba(0,0,0,.05);font-size:2rem;font-weight:800}
.L.v{color:var(--k-vow)}.L.c{color:var(--k-con)}.L.vb{background:var(--k-vow);color:#fff;box-shadow:0 3px 0 #A63F2E}.L.cb{background:var(--k-con);color:#fff;box-shadow:0 3px 0 #2A5A8A}
.L.hl{outline:4px solid var(--k-sun);transform:scale(1.12);transition:transform .15s}
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.abc .L{width:100%}
.word{font-size:2.6rem;font-weight:900;letter-spacing:.02em;text-align:center;margin:4px 0}
.emoji{font-size:4.2rem;line-height:1;text-align:center}
.say{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:16px;background:var(--k-pri-pale);font-size:1.4rem;vertical-align:middle}
.groups{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.grp{display:flex;gap:3px;padding:6px;border-radius:18px;background:var(--k-pri-pale)}.grp.dz{background:var(--k-sun-pale);outline:3px dashed var(--k-sun)}
.grp .L{min-width:46px;height:56px;font-size:1.7rem}.grp .L.soft{opacity:.55;font-size:1.3rem}
.syl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.syl span{background:var(--k-sun-pale);border-radius:16px;padding:8px 16px;font-size:1.8rem;font-weight:900;animation:pop .35s both}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
/* exercise UI */
.prog{display:flex;gap:6px;justify-content:center;margin:0 0 12px}.prog i{width:14px;height:14px;border-radius:50%;background:var(--k-line)}
.prog i.ok{background:var(--k-pri)}.prog i.no{background:var(--k-vow)}.prog i.cur{background:var(--k-sun);transform:scale(1.3)}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:460px;margin:10px auto}
.num{height:66px;border-radius:20px;background:var(--k-card);box-shadow:0 4px 0 var(--k-line);font-size:1.9rem;font-weight:900}
.num.sel{background:var(--k-sun);box-shadow:0 4px 0 #C98F22}.num.ok{background:var(--k-pri);color:#fff}.num.no{background:var(--k-vow);color:#fff}
.clap{width:150px;height:150px;border-radius:50%;background:var(--k-sun);box-shadow:0 6px 0 #C98F22;font-size:4.2rem;margin:6px auto;display:grid;place-items:center}
.clap:active{transform:translateY(4px) scale(.96);box-shadow:0 2px 0 #C98F22}
.dots{display:flex;gap:10px;justify-content:center;min-height:40px;margin:8px 0}.dots b{width:34px;height:34px;border-radius:50%;background:var(--k-sun);animation:pop .25s both;display:grid;place-items:center;font-size:1rem}
.q{font-size:1.35rem;font-weight:800;text-align:center;margin:4px 0 12px}
.opts{display:grid;gap:12px;max-width:640px;margin:0 auto}
.opt{display:flex;align-items:center;gap:12px;min-height:66px;border-radius:20px;background:var(--k-card);box-shadow:0 4px 0 var(--k-line);padding:10px 14px;text-align:left;font-weight:700;font-size:1.1rem}
.opt .say{width:44px;height:44px;font-size:1.2rem;flex:none}.opt .tx{flex:1}
.opts.bigs{grid-template-columns:repeat(3,1fr);max-width:480px}.opts.bigs .opt{justify-content:center;font-size:2.2rem;min-height:90px;font-weight:900}
.opt.sel{background:var(--k-sun-pale);outline:3px solid var(--k-sun)}.opt.ok{background:var(--k-pri-pale);outline:3px solid var(--k-pri)}.opt.no{background:var(--k-vow-pale);outline:3px solid var(--k-vow)}
.slots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 16px}
.slot{min-width:130px;min-height:92px;border-radius:20px;border:3px dashed var(--k-line);display:flex;align-items:center;justify-content:center;position:relative;padding:4px}
.slot:before{content:attr(data-n);position:absolute;top:-12px;left:-8px;width:30px;height:30px;border-radius:50%;background:var(--k-pri);color:#fff;font-size:1rem;font-weight:900;display:grid;place-items:center}
.slot.ok{border-color:var(--k-pri);background:var(--k-pri-pale)}.slot.no{border-color:var(--k-vow);background:var(--k-vow-pale)}.slot.over{border-color:var(--k-sun);background:var(--k-sun-pale)}
.wc{min-width:120px;min-height:80px;border-radius:18px;background:var(--k-card);box-shadow:0 4px 0 var(--k-line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:1.35rem;padding:6px 12px;touch-action:none}
.wc .e{font-size:2rem;line-height:1}.wc.sel{outline:3px solid var(--k-sun)}
.pool{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:90px}
.baskets{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.basket{min-height:170px;border-radius:26px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center;transition:transform .15s}
.basket.v{background:var(--k-vow-pale);border:4px solid var(--k-vow)}.basket.c{background:var(--k-con-pale);border:4px solid var(--k-con)}
.basket.over{transform:scale(1.03)}.basket h4{margin:0;font-size:1.05rem}.basket .in{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.basket .in .L{min-width:48px;height:54px;font-size:1.6rem}
.dragging{position:fixed!important;z-index:99;pointer-events:none;margin:0!important;transform:scale(1.08);opacity:.97;box-shadow:0 10px 24px rgba(0,0,0,.18)!important;transition:none}
.L,.wc{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;cursor:grab}
.L.sel{outline:4px solid var(--k-sun);transform:translateY(-4px)}.baskets.armed .basket{box-shadow:0 0 0 5px var(--k-sun-pale);cursor:pointer}
.ghosted{opacity:.3}
.shake{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.seq{display:flex;gap:10px;justify-content:center;margin:10px 0 18px;flex-wrap:wrap}.seq .L.gap{background:var(--k-sun-pale);color:var(--k-sun);outline:3px dashed var(--k-sun)}
.feedback{text-align:center;font-weight:800;font-size:1.2rem;min-height:30px;margin:10px 0}

 short, no real words"}, "parent": {"intro": "Strona do ćwiczeń przed sprawdzianem „Sprawdź siebie” (klasa 2): głoski, litery, sylaby, alfabet, samogłoski i spółgłoski. Każda zabawa i każdy sprawdzian zapisuje wynik w arkuszu rodzica.", "rules": ["<b>Głoska<\/b> – najmniejsza część wyrazu, którą słyszymy i wymawiamy. <b>Litera<\/b> – znak głoski; litery widzimy i piszemy.", "<b>Alfabet<\/b> – wszystkie litery w ustalonej kolejności. Polski alfabet ma <b>32 litery<\/b> (bez q, v, x).", "<b>Samogłoski (9)<\/b>: a, ą, e, ę, i, o, ó, u, y – na czerwono. <b>Spółgłoski (23)<\/b> – pozostałe – na niebiesko.", "<b>Sylaba<\/b> – część wyrazu, którą wymawiamy jednym „klaśnięciem”; w każdej sylabie jest samogłoska.", "<b>Dwuznaki<\/b>: ch, cz, dz, dź, dż, rz, sz – 2 litery = 1 głoska (szafa: 5 liter, 4 głoski).", "<b>Zmiękczenia<\/b>: si, ci, zi, ni, dzi przed samogłoską = ś, ć, ź, ń, dź; „i” nie jest wtedy osobną głoską (nie: 3 litery, 2 głoski; pies: 4 litery, 3 głoski).", "<b>Kolejność alfabetyczna<\/b>: decyduje pierwsza litera, a gdy jest taka sama – druga (mama, mleko, mysz). Pamiętaj: l → ł, z → ź → ż."], "tips": ["10–15 minut dziennie wystarczy: lekcja + jedna zabawa.", "Klaszczcie razem sylaby w imionach i nazwach zabawek.", "Przy liczeniu głosek wymawiajcie wyraz powoli; litery liczcie palcem w zapisie.", "Przed sprawdzianem zróbcie jeden „Sprawdź siebie” – wynik zobaczysz w arkuszu."], "sheet": {"syl": ["ryba", "samolot", "słoń", "hulajnoga", "tęcza", "pomidor"], "cnt": ["kot", "szafa", "chleb", "nie", "dzwon", "ciocia", "pszczoła", "dżem"], "ord": [["kot", "dom", "ryba"], ["lody", "łódka", "arbuz"], ["mysz", "mama", "mleko"]], "vow": "barkonuściemyżą", "gap": [["a", "_", "b"], ["k", "l", "_"], ["_", "s", "ś"], ["u", "w", "_", "z"]]}, "key": {"syl": [["ryba", 2], ["samolot", 3], ["słoń", 1], ["hulajnoga", 4], ["tęcza", 2], ["pomidor", 3]], "cnt": [["kot", 3, 3], ["szafa", 5, 4], ["chleb", 5, 4], ["nie", 3, 2], ["dzwon", 5, 4], ["ciocia", 6, 4], ["pszczoła", 8, 6], [ y. Klaśnij przy każdej sylabie: ma, ma. Sa, mo, lot. W każdej sylabie jest samogłoska. Ile klaśnięć, tyle sylab!", "les_l5": "Dwuznak to dwie litery, które razem oznaczają jedną głoskę. Słyszymy je w słowach: chleb, czapka, dzwon, dźwig, dżem, rzeka i szafa. Wyraz szafa ma pięć liter, ale tylko cztery głoski.", "les_l6": "Litera i przed samogłoską tylko zmiękcza i nie jest osobną głoską. Posłuchaj: siano, ciocia, ziarno, niebo, dzień. Wyraz nie ma trzy litery, ale tylko dwie głoski. Tak samo wyraz się.", "les_l7": "Żeby ułożyć wyrazy alfabetycznie, patrzymy na pierwszą literę. Kot jest przed rybą, bo k jest w alfabecie przed r. Gdy pierwsze litery są takie same, patrzymy na drugą literę: mama, mleko, mysz.", "w_kot": "Kot.", "w_samolot": "Samolot.", "w_szafa": "Szafa.", "w_nie": "Nie.", "g_syl_intro": "Posłuchaj wyrazu i klaśnij przy każdej sylabie. Potem sprawdź!", "g_syl_hint": "Powiedz wyraz powoli i klaśnij przy każdej sylabie.", "w_ryba": "Ryba.", "w_balon": "Balon.", "w_zyrafa": "Żyrafa.", "w_slon": "Słoń.", "w_hulajnoga": "Hulajnoga.", "w_motyl": "Motyl.", "w_biedronka": "Biedronka.", "w_czekolada": "Czekolada.", "w_pomidor": "Pomidor.", "w_lokomotywa": "Lokomotywa.", "w_dom": "Dom.", "w_tecza": "Tęcza.", "w_kapelusz": "Kapelusz.", "g_cnt_intro": "Policz litery, a potem głoski. Uważaj na dwuznaki i na literę i!", "g_cnt_hint": "Pamiętaj: dwuznak, na przykład sz albo cz, to dwie litery, ale jedna głoska.", "w_chleb": "Chleb.", "w_rzeka": "Rzeka.", "w_dzem": "Dżem.", "w_sie": "Się.", "w_ciocia": "Ciocia.", "w_czapka": "Czapka.", "w_dzwon": "Dzwon.", "w_kon": "Koń.", "w_pies": "Pies.", "w_dzien": "Dzień.", "w_chomik": "Chomik.", "w_muszla": "Muszla.", "w_pszczola": "Pszczoła.", "w_siano": "Siano.", "w_kurczak": "Kurczak.", "g_sort_intro": "Przenieś samogłoski do czerwonego koszyka, a spółgłoski do niebieskiego.", "g_sort_hint": "Samogłoski możesz śpiewać długo, na przykład aaa albo ooo. One idą do czerwonego koszyka.", "g_ord_intro": "Ułóż wyrazy w kolejności al addEventListener('tp:quiz-done',function(e){var d=e.detail||{};if(!qz)qz={t0:now(),ans:{}};var pct=d.max?Math.round(100*d.pts/d.max):0,sc=firstScale(),g=gradeFor(pct,sc),v=verdict(pct,g,sc);
 var wr=Object.keys(qz.ans).map(function(k){return qz.ans[k].w;}).filter(Boolean);
 var r=base('quiz');r.variant='Quiz mieszany';r.score=d.pts;r.max=d.max;r.percent=pct;r.grade=g;r.gradeNum=v.gradeNum;r.pass=v.pass;r.durationSec=Math.round((now()-qz.t0)/1000);r.wrongCount=wr.length;r.wrong=wr.slice(0,40);r.extra={questions:d.n};send(r);qz=null;});
/* mock tests */
var mk={};
addEventListener('tp:mock-start',function(e){mk[(e.detail||{}).id]=now();});
addEventListener('tp:mock-done',function(e){var d=e.detail||{},T=mocks()[d.idx]||{},t0=mk[d.id];var v=verdict(d.pct,d.grade,T.gradeScale);
 var wr=(d.tasks||[]).filter(function(t){return t.pts<t.max;}).map(function(t){return wrongItem(t.id,t.pts,t.max);}).filter(Boolean);
 var r=base('mock');r.variant=cut(d.title||d.id,80);r.score=d.pts;r.max=d.max;r.percent=d.pct;r.grade=d.grade||'';r.gradeNum=v.gradeNum;r.pass=v.pass;r.durationSec=t0?Math.round((now()-t0)/1000):null;r.wrongCount=wr.length;r.wrong=wr.slice(0,40);r.extra={mockId:d.id,minutesLimit:d.minutes,tasks:(d.tasks||[]).length};send(r);delete mk[d.id];});
/* generic finished activity (kids template & future pages): detail = {mode,variant,score,max,percent,grade,gradeNum,pass,durationSec,wrong:[{id,q,a,c,pts,max}],extra} */
addEventListener('tp:result',function(e){var d=e.detail||{};var r=base(['quiz','mock','flashcards','other'].indexOf(d.mode)>=0?d.mode:'other');r.variant=cut(d.variant||'',80);r.score=d.score;r.max=d.max;r.percent=d.percent;r.grade=cut(d.grade||'',40);r.gradeNum=d.gradeNum==null?null:d.gradeNum;r.pass=typeof d.pass==='boolean'?d.pass:null;r.durationSec=d.durationSec;
 var wr=(d.wrong||[]).slice(0,40).map(function(x){return {id:String(x.id||'').slice(0,60),q:cut(x.q,160),a:cut(x.a,160),c:cut(x.c,160),pts:x.pts,max:x.max};});r.wrongCount=wr.length;r.wrong=wr;r.extra=(d.extra&&typeof d.extra==='object')?d.extra:{};send(r);});
/* flashcard sessions: summary sent when the page is hidden/closed (only if >=5 cards rated) */
var fc=null;
addEventListener('tp:card',function(e){var d=e.detail||{};if(!fc)fc={t0:now(),n:0,r:{1:0,2:0,3:0}};fc.n++;fc.r[d.rating]=(fc.r[d.rating]||0)+1;fc.known=d.known;fc.total=d.total;fc.t1=now();});
function fcFlush(){if(!fc||fc.n<5){return;}var r=base('flashcards');r.variant='Fiszki';r.score=fc.known;r.max=fc.total;r.percent=fc.total?Math.round(100*fc.known/fc.total):0;r.grade='';r.gradeNum=null;r.pass=null;r.durationSec=Math.round((fc.t1-fc.t0)/1000);r.wrongCount=fc.r[1]||0;r.wrong=[];r.extra={rated:fc.n,nieWiem:fc.r[1]||0,prawie:fc.r[2]||0,wiem:fc.r[3]||0};fc=null;send(r);}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')fcFlush();});addEventListener('pagehide',fcFlush);
window.__tpResults={queue:lq,flush:flush,cfg:{endpoint:!!CFG.endpoint}};
