<script>window.TP_CONTENT={"schemaVersion": 1, "meta": {"id": "ez7-szczepienia", "title": "Edukacja zdrowotna: szczepienia i choroby – testy", "subtitle": "Kalendarz szczepień (PSO), bezpieczeństwo, dawki · szczepionka a antybiotyk · łańcuch epidemiczny · choroby przewlekłe i cywilizacyjne. 4 testy, szybkie quizy, trening błędów i ściąga.", "subject": "Edukacja zdrowotna", "grade": "Klasa 7 SP", "lang": "pl", "uiLangs": ["pl", "ru"], "estimatedMinutes": 60, "layout": "classic", "quickN": 8, "tabs": [["quiz", "⚡ Quizy"], ["mock", "📝 Testy 1–4"], ["trening", "🔁 Trening błędów"], ["cheat", "📄 Ściąga"]], "lessonNames": {"l1": "1. Szczepienia (PSO)", "l2": "2. Szczepionka, antybiotyk, łańcuch", "l3": "3. Choroby cywilizacyjne i przewlekłe"}, "sourceNote": "Pytania wyłącznie na podstawie notatek z lekcji (2 strony) i karty pracy „Choroby cywilizacyjne i przewlekłe”. Wyniki zapisują się automatycznie.", "uncertain": ["Notatki s. 1: prawy brzeg zdjęcia ucięty – „obowiązkowe (bezpłatne)”, „WZW [B]” i ostatnia choroba („różyczka”) odczytane z ucięciem; przyjęto WZW B i różyczkę.", "Karta pracy, zad. 4 „Prawda czy fałsz”: cztery zdania były czytane na głos i nie ma ich na kartce – nie odtwarzamy ich (zadania P/F na stronie są nowe, z treści notatek).", "Notatki s. 2: przekreślony początek nagłówka przed „Szczepionka a antybiotyk” – bez wpływu na treść."], "tutorMaterial": "TEMAT: Edukacja zdrowotna, klasa 7 – szczepienia, choroby zakaźne, choroby cywilizacyjne i przewlekłe. Mów po polsku, krótko, pytaj ucznia. Tylko fakty z tego materiału:\nPSO = Program Szczepień Ochronnych – kalendarz szczepień.\nSzczepienia obowiązkowe (bezpłatne) i zalecane.\nPrzykłady chorób: gruźlica, WZW B, błonica, tężec, krztusiec, polio, odra, świnka, różyczka.\nDawki przypominające: niektóre szczepionki trzeba powtórzyć, żeby odporność trwała.\nGrypa – szczepimy się co roku, bo wirus się zmienia.\nPrzed: lekarz bada dziecko = kwalifikacja.\nPo: czekamy chwilę w przychodni.\nOdczyn poszczepienny: zaczerwienienie, obrzęk lub ból w miejscu wkłucia, czasem lekka gorączka – normalne, mija zwykle w 1–2 dni.\nSzczepionka zapobiega chorobie.\nAntybiotyk leczy zakażenia bakteryjne – na wirusy nie działa.\nźródło zakażenia → droga szerzenia się → osoba podatna\nPrzewlekła – trwa miesiące lub lata.\nCywilizacyjna – związek z warunkami życia.\nCukrzyca typu 2 może należeć do obu grup.\nMit: „to na pewno przez słodycze” ❌ – nie wiemy, jak ktoś się odżywia; liczą się też np. mało ruchu, choroba w rodzinie.\nPomoc szanuje potrzeby i decyzje osoby – najpierw zapytaj.\nCukrzyca typu 1 (Maja): zgoda na przerwę, poczekaj.\nPo udarze (Adam): więcej czasu, nie poganiaj."}, "images": {}, "diagnostic": [], "lessons": [{"id": "l1", "title": "Szczepienia (PSO)"}, {"id": "l2", "title": "Szczepionka, antybiotyk, łańcuch"}, {"id": "l3", "title": "Choroby cywilizacyjne i przewlekłe"}], "flashcards": [], "quiz": [{"id": "q_pso", "type": "mc", "tag": "l1", "q": "Co oznacza skrót **PSO**?", "q_ru": "Что значит PSO?", "options": ["Program Szczepień Ochronnych", "Powszechny System Opieki", "Profilaktyka Schorzeń Ostrych", "Państwowa Służba Ochrony"], "answer": 0, "explain": "**PSO = Program Szczepień Ochronnych** – to kalendarz szczepień. *(notatki, s. 1)*", "explain_ru": "PSO – Программа защитных прививок (календарь прививок)."}, {"id": "q_pso2", "type": "mc", "tag": "l1", "q": "Program Szczepień Ochronnych to inaczej…", "q_ru": "Программа защитных прививок – это…", "options": ["kalendarz szczepień", "lista antybiotyków", "plan lekcji WF", "spis chorób przewlekłych"], "answer": 0, "explain": "PSO to **kalendarz szczepień**. *(notatki, s. 1)*", "explain_ru": "Это календарь прививок."}, {"id": "q_dwa", "type": "multi", "tag": "l1", "q": "Jakie **dwa rodzaje** szczepień są w kalendarzu szczepień (PSO)?", "q_ru": "Какие два вида прививок есть в календаре?", "options": ["obowiązkowe", "zalecane", "antybiotykowe", "przewlekłe"], "answer": [0, 1], "explain": "W kalendarzu są szczepienia **obowiązkowe (bezpłatne)** i **zalecane**. *(notatki, s. 1)*", "explain_ru": "Обязательные (бесплатные) и рекомендуемые."}, {"id": "q_bezpl", "type": "mc", "tag": "l1", "q": "Które szczepienia z PSO są **bezpłatne**?", "q_ru": "Какие прививки бесплатные?", "options": ["obowiązkowe", "zalecane", "tylko szczepienie przeciw grypie", "żadne"], "answer": 0, "explain": "W notatce: **obowiązkowe (bezpłatne)** i zalecane. *(notatki, s. 1)*", "explain_ru": "Обязательные – бесплатные."}, {"id": "q_dis", "type": "multi", "tag": "l1", "q": "Zaznacz choroby, które są w notatce **przykładami chorób z kalendarza szczepień**.", "q_ru": "Отметь болезни из примеров календаря прививок.", "options": ["gruźlica", "tężec", "odra", "cukrzyca typu 2", "krztusiec", "udar"], "answer": [0, 1, 2, 4], "explain": "Przykłady: gruźlica, WZW B, błonica, tężec, krztusiec, polio, odra, świnka, różyczka. **Cukrzyca typu 2 i udar** to nie są choroby z listy szczepień. *(notatki, s. 1)*", "explain_ru": "Примеры: туберкулёз, гепатит B, дифтерия, столбняк, коклюш, полиомиелит, корь, свинка, краснуха. Диабет 2 типа и инсульт – нет."}, {"id": "q_dis2", "type": "multi", "tag": "l1", "q": "Które z tych chorób są na liście przykładów z PSO?", "q_ru": "Какие болезни есть в списке примеров PSO?", "options": ["błonica", "polio", "świnka", "różyczka", "grypa", "WZW B"], "answer": [0, 1, 2, 3, 5], "explain": "Na liście przykładów: **błonica, polio, świnka, różyczka, WZW B** (oraz gruźlica, tężec, krztusiec, odra). Grypa jest w notatce osobno – szczepimy się **co roku**. *(notatki, s. 1)*", "explain_ru": "Грипп в заметке отдельно – прививка каждый год."}, {"id": "q_dawki", "type": "mc", "tag": "l1", "q": "Po co są **dawki przypominające**?", "q_ru": "Зачем нужны повторные (бустерные) дозы?", "options": ["niektóre szczepionki trzeba powtórzyć, żeby odporność trwała", "żeby wyleczyć zakażenie bakteryjne", "żeby szybciej minęła gorączka", "żeby zastąpić kwalifikację"], "answer": 0, "explain": "**Niektóre szczepionki trzeba powtórzyć, żeby odporność trwała.** *(notatki, s. 1)*", "explain_ru": "Некоторые прививки надо повторять, чтобы иммунитет сохранялся."}, {"id": "q_dawki_s", "type": "short", "tag": "l1", "q": "Jak nazywamy kolejną dawkę szczepionki, którą podaje się po to, żeby odporność trwała? (2 słowa)", "q_ru": "Как называется повторная доза? (2 слова)", "accept": ["dawka przypominająca", "dawki przypominające", "dawkę przypominającą", "przypominająca"], "explain": "To **dawka przypominająca**. *(notatki, s. 1)*", "explain_ru": "Бустерная (напоминающая) доза."}, {"id": "q_grypa", "type": "mc", "tag": "l1", "q": "Dlaczego przeciw **grypie** szczepimy się **co roku**?", "q_ru": "Почему от гриппа прививаются каждый год?", "options": ["bo wirus grypy się zmienia", "bo antybiotyk nie działa", "bo szczepionka jest zalecana", "bo to choroba przewlekła"], "answer": 0, "explain": "Szczepimy się co roku, **bo wirus się zmienia**. *(notatki, s. 1)*", "explain_ru": "Потому что вирус гриппа меняется."}, {"id": "q_kwal", "type": "mc", "tag": "l1", "q": "Co robi lekarz **przed** szczepieniem?", "q_ru": "Что делает врач перед прививкой?", "options": ["bada dziecko – to kwalifikacja", "podaje antybiotyk", "wypisuje dawkę przypominającą", "nic, szczepi od razu"], "answer": 0, "explain": "Przed szczepieniem lekarz **bada dziecko (kwalifikacja)**. *(notatki, s. 1)*", "explain_ru": "Врач осматривает ребёнка – это допуск (квалификация)."}, {"id": "q_kwal_s", "type": "short", "tag": "l1", "q": "Jak nazywa się badanie dziecka przez lekarza przed szczepieniem? (1 słowo)", "q_ru": "Как называется осмотр перед прививкой? (1 слово)", "accept": ["kwalifikacja", "kwalifikację", "kwalifikacja do szczepienia"], "explain": "To **kwalifikacja**. *(notatki, s. 1)*", "explain_ru": "Квалификация (допуск к прививке)."}, {"id": "q_czekaj", "type": "mc", "tag": "l1", "q": "Co robimy **zaraz po** szczepieniu?", "q_ru": "Что делаем сразу после прививки?", "options": ["czekamy chwilę w przychodni", "od razu idziemy na trening", "bierzemy antybiotyk", "wracamy na kwalifikację"], "answer": 0, "explain": "Po szczepieniu **czeka się chwilę w przychodni**. *(notatki, s. 1)*", "explain_ru": "Немного ждём в поликлинике."}, {"id": "q_odczyn", "type": "multi", "tag": "l1", "q": "Zaznacz objawy, które w notatce opisano jako **normalny odczyn poszczepienny**.", "q_ru": "Отметь нормальные реакции после прививки.", "options": ["zaczerwienienie w miejscu wkłucia", "obrzęk w miejscu wkłucia", "ból w miejscu wkłucia", "czasem lekka gorączka", "objawy przez kilka miesięcy"], "answer": [0, 1, 2, 3], "explain": "Odczyn poszczepienny: **zaczerwienienie, obrzęk lub ból w miejscu wkłucia, czasem lekka gorączka**. To normalne i zwykle mija w **1–2 dni** (nie miesiące). *(notatki, s. 1)*", "explain_ru": "Покраснение, отёк или боль в месте укола, иногда лёгкая температура; проходит за 1–2 дня."}, {"id": "q_dni", "type": "short", "tag": "l1", "q": "Odczyn poszczepienny zwykle mija w ciągu ilu dni? Podaj **górną** liczbę (1–…).", "q_ru": "Через сколько дней обычно проходит реакция? Верхнее число (1–…).", "accept": ["2", "1-2", "1–2", "2 dni"], "explain": "Zwykle mija w **1–2 dni**. *(notatki, s. 1)*", "explain_ru": "Обычно за 1–2 дня.", "num": 2, "tol": 0}, {"id": "q_kolej", "type": "order", "tag": "l1", "q": "Ułóż w kolejności, jak wygląda szczepienie.", "q_ru": "Расставь по порядку этапы прививки.", "items": ["lekarz bada dziecko (kwalifikacja)", "szczepienie", "czekanie chwilę w przychodni", "ewentualny odczyn: zaczerwienienie, obrzęk lub ból, mija w 1–2 dni"], "explain": "Kwalifikacja → szczepienie → chwila w przychodni → możliwy odczyn, który zwykle mija w 1–2 dni. *(notatki, s. 1)*", "explain_ru": "Осмотр → прививка → ожидание → возможная реакция 1–2 дня."}, {"id": "q_tf1", "type": "tf", "tag": "l1", "q": "Prawda czy fałsz?", "q_ru": "Правда или ложь?", "items": [{"s": "PSO to kalendarz szczepień.", "a": true}, {"s": "Wszystkie szczepienia w PSO są zalecane, żadne nie jest obowiązkowe.", "a": false}, {"s": "Lekka gorączka po szczepieniu może się zdarzyć i zwykle mija w 1–2 dni.", "a": true}, {"s": "Przeciw grypie wystarczy zaszczepić się raz w życiu.", "a": false}], "explain": "PSO = kalendarz: **obowiązkowe i zalecane**. Grypa – **co roku**, bo wirus się zmienia. Lekka gorączka – normalny odczyn. *(notatki, s. 1)*", "explain_ru": "Есть обязательные и рекомендуемые; от гриппа – каждый год."}, {"id": "q_vsa", "type": "match", "tag": "l2", "q": "Dopasuj.", "q_ru": "Сопоставь.", "pairs": [["szczepionka", "zapobiega chorobie"], ["antybiotyk", "leczy zakażenia bakteryjne"]], "explain": "**Szczepionka zapobiega** chorobie. **Antybiotyk leczy** zakażenia **bakteryjne**. *(notatki, s. 2)*", "explain_ru": "Вакцина предотвращает болезнь; антибиотик лечит бактериальные инфекции."}, {"id": "q_wir", "type": "mc", "tag": "l2", "q": "Czy antybiotyk działa na **wirusy**?", "q_ru": "Действует ли антибиотик на вирусы?", "options": ["nie – na wirusy nic nie działa", "tak, zawsze", "tak, ale tylko na grypę", "tylko razem ze szczepionką"], "answer": 0, "explain": "Antybiotyk leczy **zakażenia bakteryjne**; **na wirusy nic nie działa**. *(notatki, s. 2)*", "explain_ru": "Нет, на вирусы антибиотик не действует."}, {"id": "q_antyb", "type": "mc", "tag": "l2", "q": "Antybiotyk służy do…", "q_ru": "Антибиотик нужен для…", "options": ["leczenia zakażeń bakteryjnych", "zapobiegania grypie", "leczenia zakażeń wirusowych", "zastąpienia dawek przypominających"], "answer": 0, "explain": "Antybiotyk **leczy zakażenia bakteryjne**. *(notatki, s. 2)*", "explain_ru": "Лечения бактериальных инфекций."}, {"id": "q_szcz", "type": "mc", "tag": "l2", "q": "Szczepionka…", "q_ru": "Вакцина…", "options": ["zapobiega chorobie", "leczy zakażenie bakteryjne, które już jest", "działa tylko na wirusy po zachorowaniu", "jest tym samym co antybiotyk"], "answer": 0, "explain": "Szczepionka **zapobiega** chorobie (działa zanim zachorujesz). *(notatki, s. 2)*", "explain_ru": "Предотвращает болезнь."}, {"id": "q_tf2", "type": "tf", "tag": "l2", "q": "Prawda czy fałsz?", "q_ru": "Правда или ложь?", "items": [{"s": "Antybiotyk leczy zakażenia bakteryjne.", "a": true}, {"s": "Antybiotyk dobrze działa na wirusy.", "a": false}, {"s": "Szczepionka zapobiega chorobie.", "a": true}, {"s": "Szczepionka i antybiotyk działają tak samo.", "a": false}], "explain": "Szczepionka – **zapobiega**; antybiotyk – **leczy bakteryjne**, na wirusy nie działa. *(notatki, s. 2)*", "explain_ru": "Вакцина предотвращает, антибиотик лечит только бактериальные."}, {"id": "q_lan", "type": "order", "tag": "l2", "q": "Ułóż ogniwa **łańcucha epidemicznego** w kolejności.", "q_ru": "Расставь звенья эпидемической цепи.", "items": ["źródło zakażenia", "droga szerzenia się", "osoba podatna"], "explain": "Łańcuch epidemiczny: **źródło zakażenia → droga szerzenia się → osoba podatna**. *(notatki, s. 2)*", "explain_ru": "Источник инфекции → путь распространения → восприимчивый человек."}, {"id": "q_lan1", "type": "mc", "tag": "l2", "q": "Jakie jest **pierwsze** ogniwo łańcucha epidemicznego?", "q_ru": "Первое звено эпидемической цепи?", "options": ["źródło zakażenia", "droga szerzenia się", "osoba podatna", "antybiotyk"], "answer": 0, "explain": "Pierwsze – **źródło zakażenia**, potem droga szerzenia się, na końcu osoba podatna. *(notatki, s. 2)*", "explain_ru": "Источник инфекции."}, {"id": "q_lan2", "type": "mc", "tag": "l2", "q": "Które ogniwo łańcucha epidemicznego jest **w środku**?", "q_ru": "Среднее звено цепи?", "options": ["droga szerzenia się", "źródło zakażenia", "osoba podatna", "kwalifikacja"], "answer": 0, "explain": "Środkowe ogniwo – **droga szerzenia się**. *(notatki, s. 2)*", "explain_ru": "Путь распространения."}, {"id": "q_lan3", "type": "short", "tag": "l2", "q": "Uzupełnij łańcuch: źródło zakażenia → droga szerzenia się → … (2 słowa)", "q_ru": "Дополни: источник → путь → … (2 слова)", "accept": ["osoba podatna", "osobą podatną", "osoby podatne"], "explain": "Ostatnie ogniwo: **osoba podatna**. *(notatki, s. 2)*", "explain_ru": "Восприимчивый человек."}, {"id": "q_def", "type": "match", "tag": "l3", "q": "Dopasuj pojęcie do opisu.", "q_ru": "Сопоставь понятие и описание.", "pairs": [["choroba przewlekła", "trwa miesiące lub lata"], ["choroba cywilizacyjna", "określenie opisuje związek z warunkami życia"]], "explain": "**Przewlekła** – trwa **miesiące lub lata**. **Cywilizacyjna** – opisuje **związek z warunkami życia**. *(karta pracy „Choroby cywilizacyjne i przewlekłe”)*", "explain_ru": "Хроническая – длится месяцы или годы; болезнь цивилизации – связана с условиями жизни."}, {"id": "q_przew", "type": "short", "tag": "l3", "q": "Uzupełnij: Choroba ………… trwa miesiące lub lata. (1 słowo)", "q_ru": "Дополни: … болезнь длится месяцы или годы.", "accept": ["przewlekła", "przewlekla"], "explain": "Choroba **przewlekła** trwa miesiące lub lata. *(karta pracy „Choroby cywilizacyjne i przewlekłe”)*", "explain_ru": "Хроническая."}, {"id": "q_cyw", "type": "short", "tag": "l3", "q": "Uzupełnij: Określenie „choroby …………” opisuje związek z warunkami życia. (1 słowo)", "q_ru": "Дополни: «болезни …» связаны с условиями жизни.", "accept": ["cywilizacyjne", "cywilizacyjna", "cywilizacyjnych"], "explain": "**Choroby cywilizacyjne** – określenie opisuje związek z warunkami życia. *(karta pracy „Choroby cywilizacyjne i przewlekłe”)*", "explain_ru": "Болезни цивилизации."}, {"id": "q_cuk2", "type": "mc", "tag": "l3", "q": "Która choroba wg karty pracy może należeć do **obu grup** (przewlekłe i cywilizacyjne)?", "q_ru": "Какая болезнь может быть в обеих группах?", "options": ["cukrzyca typu 2", "grypa", "odra", "tężec"], "answer": 0, "explain": "**Cukrzyca typu 2** może należeć do obu grup. *(karta pracy „Choroby cywilizacyjne i przewlekłe”)*", "explain_ru": "Диабет 2 типа."}, {"id": "q_cukwhy", "type": "mc", "tag": "l3", "q": "Dlaczego cukrzyca typu 2 może należeć do **obu** grup?", "q_ru": "Почему диабет 2 типа – в обеих группах?", "options": ["bo trwa długo (miesiące, lata) i ma związek z warunkami życia", "bo wywołują ją wirusy", "bo leczy się ją antybiotykiem", "bo jest w kalendarzu szczepień"], "answer": 0, "explain": "Jest **przewlekła** (trwa długo) i **cywilizacyjna** (związek z warunkami życia). *(karta pracy „Choroby cywilizacyjne i przewlekłe”)*", "explain_ru": "Длится долго и связана с условиями жизни."}, {"id": "q_mit", "type": "mc", "tag": "l3", "q": "Sąsiad pana Tomasza mówi o cukrzycy typu 2: „To na pewno przez jedzenie słodyczy”. Jak to ocenić?", "q_ru": "Сосед говорит: «Это точно от сладкого». Как оценить?", "options": ["to błąd – nie wiemy, jak Tomasz się odżywia, a ważne są też mało ruchu i choroba taty", "to prawda – cukrzyca typu 2 zawsze jest od słodyczy", "to prawda, bo to choroba zakaźna", "nie da się nic powiedzieć, bo to choroba przewlekła"], "answer": 0, "explain": "W tekście: **nie wiemy, jak Tomasz się odżywia**. Tomasz pracuje głównie **siedząc i rzadko się rusza**, a jego **tata też chorował** na cukrzycę typu 2. Słowo „na pewno” jest więc błędne. *(karta pracy „Choroby cywilizacyjne i przewlekłe”)*", "explain_ru": "Мы не знаем, как он питается; он мало двигается, папа тоже болел – «точно от сладкого» неверно."}, {"id": "q_tomczyn", "type": "multi", "tag": "l3", "q": "Które informacje z historii pana Tomasza mogą mieć związek z cukrzycą typu 2? Zaznacz wszystkie podane w tekście.", "q_ru": "Какие факты из истории Томаша могут быть связаны с диабетом?", "options": ["pracuje głównie siedząc", "rzadko ma okazję do ruchu", "jego tata też chorował na cukrzycę typu 2", "na pewno je dużo słodyczy", "był szczepiony przeciw grypie"], "answer": [0, 1, 2], "explain": "W tekście: praca **głównie siedząca**, **mało ruchu**, **tata chorował**. O słodyczach – **nie wiemy**. *(karta pracy „Choroby cywilizacyjne i przewlekłe”)*", "explain_ru": "Сидячая работа, мало движения, папа болел; о сладком мы не знаем."}, {"id": "q_tomhelp", "type": "mc", "tag": "l3", "q": "Które działanie najbardziej pasuje do sytuacji pana Tomasza (praca siedząca, mało ruchu)?", "q_ru": "Что больше всего поможет Томашу?", "options": ["więcej ruchu w ciągu dnia", "antybiotyk", "dawka przypominająca szczepionki", "unikanie lekarza"], "answer": 0, "explain": "Tomasz **rzadko się rusza** – pomocne jest **więcej ruchu**. *(karta pracy „Choroby cywilizacyjne i przewlekłe”)*", "explain_ru": "Больше движения."}, {"id": "q_maja", "type": "mc", "tag": "l3", "q": "Maja ma cukrzycę typu 1 i podczas pracy w parze potrzebuje przerwy, żeby zająć się swoim zdrowiem. Co jest dobrą pomocą?", "q_ru": "Мае (диабет 1 типа) нужен перерыв. Как помочь?", "options": ["zgodzić się na przerwę i poczekać, uszanować jej potrzebę", "powiedzieć, że przerwy są niesprawiedliwe", "zrobić wszystko za nią bez pytania", "opowiedzieć klasie o jej chorobie"], "answer": 0, "explain": "Pomoc ma **uszanować potrzeby i decyzje** osoby: Maja potrzebuje przerwy – dajemy jej czas. *(karta pracy „Choroby cywilizacyjne i przewlekłe”)*", "explain_ru": "Уважать её потребности: дать перерыв."}, {"id": "q_adam", "type": "mc", "tag": "l3", "q": "Adam po udarze wolniej chodzi i mówi. Co jest dobrą pomocą?", "q_ru": "Адам после инсульта медленнее ходит и говорит. Как помочь?", "options": ["dać mu więcej czasu, nie poganiać, zapytać, czy potrzebuje pomocy", "kończyć za niego zdania", "iść szybciej, żeby się przyzwyczaił", "robić wszystko za niego, nawet gdy nie chce"], "answer": 0, "explain": "Dajemy **więcej czasu**, nie poganiamy i **pytamy**, czy chce pomocy – szanujemy jego **potrzeby i decyzje**. *(karta pracy „Choroby cywilizacyjne i przewlekłe”)*", "explain_ru": "Дать время, не торопить, спросить, нужна ли помощь."}, {"id": "q_szac", "type": "tf", "tag": "l3", "q": "Wsparcie osób chorych – prawda czy fałsz?", "q_ru": "Поддержка больных – правда или ложь?", "items": [{"s": "Dobra pomoc szanuje potrzeby i decyzje osoby chorej.", "a": true}, {"s": "Warto zapytać, czy ktoś potrzebuje pomocy.", "a": true}, {"s": "Najlepiej decydować za osobę chorą, bez pytania.", "a": false}, {"s": "Osobę po udarze trzeba poganiać, żeby szybciej mówiła.", "a": false}], "explain": "Pomoc **uszanowuje potrzeby i decyzje**, warto **zapytać**. Nie decydujemy za kogoś i nie poganiamy. *(karta pracy „Choroby cywilizacyjne i przewlekłe”)*", "explain_ru": "Уважать решения, спрашивать, не торопить."}, {"id": "q_cat", "type": "cat", "tag": "l1", "q": "Przyporządkuj: co **zapobiega**, a co **leczy**?", "q_ru": "Что предотвращает, а что лечит?", "categories": ["zapobiega", "leczy"], "items": [{"t": "szczepionka", "c": 0}, {"t": "dawka przypominająca", "c": 0}, {"t": "szczepienie przeciw grypie co roku", "c": 0}, {"t": "antybiotyk (zakażenia bakteryjne)", "c": 1}], "explain": "Szczepionki (także przypominające i co roku przeciw grypie) **zapobiegają**; antybiotyk **leczy** zakażenia bakteryjne. *(notatki, s. 1)*", "explain_ru": "Вакцины предотвращают, антибиотик лечит."}], "explainPrompts": [], "mocks": [{"id": "test1", "title": "📝 Test 1 – Szczepienia i choroby", "minutes": 20, "gradeScale": [[0, "niedostateczny"], [31, "dopuszczający"], [51, "dostateczny"], [71, "dobry"], [88, "bardzo dobry"], [97, "celujący"]], "intro": "Wszystko z notatek i karty pracy. Wyjaśnienia zobaczysz po oddaniu, błędy trafią do „🔁 Trening błędów”. Na końcu zadania otwarte – porównaj ze wzorem.", "tasks": [{"id": "t1_pso", "type": "mc", "tag": "l1", "q": "**1.** Co oznacza skrót **PSO**?", "q_ru": "Что значит PSO?", "options": ["Program Szczepień Ochronnych", "Powszechny System Opieki", "Profilaktyka Schorzeń Ostrych", "Państwowa Służba Ochrony"], "answer": 0, "explain": "**PSO = Program Szczepień Ochronnych** – to kalendarz szczepień. *(notatki, s. 1)*", "explain_ru": "PSO – Программа защитных прививок (календарь прививок)."}, {"id": "t1_dwa", "type": "multi", "tag": "l1", "q": "**2.** Jakie **dwa rodzaje** szczepień są w kalendarzu szczepień (PSO)?", "q_ru": "Какие два вида прививок есть в календаре?", "options": ["obowiązkowe", "zalecane", "antybiotykowe", "przewlekłe"], "answer": [0, 1], "explain": "W kalendarzu są szczepienia **obowiązkowe (bezpłatne)** i **zalecane**. *(notatki, s. 1)*", "explain_ru": "Обязательные (бесплатные) и рекомендуемые."}, {"id": "t1_dis", "type": "multi", "tag": "l1", "q": "**3.** Zaznacz choroby, które są w notatce **przykładami chorób z kalendarza szczepień**.", "q_ru": "Отметь болезни из примеров календаря прививок.", "options": ["gruźlica", "tężec", "odra", "cukrzyca typu 2", "krztusiec", "udar"], "answer": [0, 1, 2, 4], "explain": "Przykłady: gruźlica, WZW B, błonica, tężec, krztusiec, polio, odra, świnka, różyczka. **Cukrzyca typu 2 i udar** to nie są choroby z listy szczepień. *(notatki, s. 1)*", "explain_ru": "Примеры: туберкулёз, гепатит B, дифтерия, столбняк, коклюш, полиомиелит, корь, свинка, краснуха. Диабет 2 типа и инсульт – нет."}, {"id": "t1_dawki", "type": "mc", "tag": "l1", "q": "**4.** Po co są **dawki przypominające**?", "q_ru": "Зачем нужны повторные (бустерные) дозы?", "options": ["niektóre szczepionki trzeba powtórzyć, żeby odporność trwała", "żeby wyleczyć zakażenie bakteryjne", "żeby szybciej minęła gorączka", "żeby zastąpić kwalifikację"], "answer": 0, "explain": "**Niektóre szczepionki trzeba powtórzyć, żeby odporność trwała.** *(notatki, s. 1)*", "explain_ru": "Некоторые прививки надо повторять, чтобы иммунитет сохранялся."}, {"id": "t1_grypa", "type": "mc", "tag": "l1", "q": "**5.** Dlaczego przeciw **grypie** szczepimy się **co roku**?", "q_ru": "Почему от гриппа прививаются каждый год?", "options": ["bo wirus grypy się zmienia", "bo antybiotyk nie działa", "bo szczepionka jest zalecana", "bo to choroba przewlekła"], "answer": 0, "explain": "Szczepimy się co roku, **bo wirus się zmienia**. *(notatki, s. 1)*", "explain_ru": "Потому что вирус гриппа меняется."}, {"id": "t1_kwal", "type": "mc", "tag": "l1", "q": "**6.** Co robi lekarz **przed** szczepieniem?", "q_ru": "Что делает врач перед прививкой?", "options": ["bada dziecko – to kwalifikacja", "podaje antybiotyk", "wypisuje dawkę przypominającą", "nic, szczepi od razu"], "answer": 0, "explain": "Przed szczepieniem lekarz **bada dziecko (kwalifikacja)**. *(notatki, s. 1)*", "explain_ru": "Врач осматривает ребёнка – это допуск (квалификация)."}, {"id": "t1_odczyn", "type": "multi", "tag": "l1", "q": "**7.** Zaznacz objawy, które w notatce opisano jako **normalny odczyn poszczepienny**.", "q_ru": "Отметь нормальные реакции после прививки.", "options": ["zaczerwienienie w miejscu wkłucia", "obrzęk w miejscu wkłucia", "ból w miejscu wkłucia", "czasem lekka gorączka", "objawy przez kilka miesięcy"], "answer": [0, 1, 2, 3], "explain": "Odczyn poszczepienny: **zaczerwienienie, obrzęk lub ból w miejscu wkłucia, czasem lekka gorączka**. To normalne i zwykle mija w **1–2 dni** (nie miesiące). *(notatki, s. 1)*", "explain_ru": "Покраснение, отёк или боль в месте укола, иногда лёгкая температура; проходит за 1–2 дня."}, {"id": "t1_vsa", "type": "match", "tag": "l2", "q": "**8.** Dopasuj.", "q_ru": "Сопоставь.", "pairs": [["szczepionka", "zapobiega chorobie"], ["antybiotyk", "leczy zakażenia bakteryjne"]], "explain": "**Szczepionka zapobiega** chorobie. **Antybiotyk leczy** zakażenia **bakteryjne**. *(notatki, s. 2)*", "explain_ru": "Вакцина предотвращает болезнь; антибиотик лечит бактериальные инфекции."}, {"id": "t1_wir", "type": "mc", "tag": "l2", "q": "**9.** Czy antybiotyk działa na **wirusy**?", "q_ru": "Действует ли антибиотик на вирусы?", "options": ["nie – na wirusy nic nie działa", "tak, zawsze", "tak, ale tylko na grypę", "tylko razem ze szczepionką"], "answer": 0, "explain": "Antybiotyk leczy **zakażenia bakteryjne**; **na wirusy nic nie działa**. *(notatki, s. 2)*", "explain_ru": "Нет, на вирусы антибиотик не действует."}, {"id": "t1_lan", "type": "order", "tag": "l2", "q": "**10.** Ułóż ogniwa **łańcucha epidemicznego** w kolejności.", "q_ru": "Расставь звенья эпидемической цепи.", "items": ["źródło zakażenia", "droga szerzenia się", "osoba podatna"], "explain": "Łańcuch epidemiczny: **źró mc", "tag": "l3", "q": "**14.** Maja ma cukrzycę typu 1 i podczas pracy w parze potrzebuje przerwy, żeby zająć się swoim zdrowiem. Co jest dobrą pomocą?", "q_ru": "Мае (диабет 1 типа) нужен перерыв. Как помочь?", "options": ["zgodzić się na przerwę i poczekać, uszanować jej potrzebę", "powiedzieć, że przerwy są niesprawiedliwe", "zrobić wszystko za nią bez pytania", "opowiedzieć klasie o jej chorobie"], "answer": 0, "explain": "Pomoc ma **uszanować potrzeby i decyzje** osoby: Maja potrzebuje przerwy – dajemy jej czas. *(karta pracy „Choroby cywilizacyjne i przewlekłe”)*", "explain_ru": "Уважать её потребности: дать перерыв."}, {"id": "t1_o_lan", "type": "open", "tag": "l2", "q": "**15.** Wymień po kolei 3 ogniwa łańcucha epidemicznego.", "q_ru": "Назови 3 звена эпидемической цепи.", "keyPoints": ["źródło zakażenia", "droga szerzenia się", "osoba podatna"], "kw": [["zrodl"], ["drog|szerzen"], ["podatn"]], "model": "Źródło zakażenia → droga szerzenia się → osoba podatna.", "points": 3, "explain": "Porównaj ze wzorem. *(notatki, s. 2)*", "explain_ru": "Источник → путь → восприимчивый человек."}, {"id": "t1_o_cuk", "type": "open", "tag": "l3", "q": "**16.** Dlaczego cukrzyca typu 2 może należeć do obu grup chorób (przewlekłych i cywilizacyjnych)?", "q_ru": "Почему диабет 2 типа – в обеих группах?", "keyPoints": ["trwa długo – miesiące lub lata (przewlekła)", "ma związek z warunkami życia (cywilizacyjna)"], "kw": [["dlug|miesiac|lat|przewlek"], ["warunk|zycia|styl|ruch|cywiliz"]], "model": "Bo trwa długo – miesiące lub lata (choroba przewlekła), a jednocześnie ma związek z warunkami życia, np. z małą ilością ruchu (choroba cywilizacyjna).", "points": 2, "explain": "Porównaj ze wzorem. *(karta pracy „Choroby cywilizacyjne i przewlekłe”)*", "explain_ru": "Длится долго и связана с условиями жизни."}]}, {"id": "test2", "title": "📝 Test 2 – Szczepienia i choroby", "minutes": 20, "gradeScale": [[0, "niedostateczny"], [31, "dopuszczający"], [51, "dostateczny"], [71, "dobry"], [ ческой цепи?", "options": ["źródło zakażenia", "droga szerzenia się", "osoba podatna", "antybiotyk"], "answer": 0, "explain": "Pierwsze – **źródło zakażenia**, potem droga szerzenia się, na końcu osoba podatna. *(notatki, s. 2)*", "explain_ru": "Источник инфекции."}, {"id": "t2_przew", "type": "short", "tag": "l3", "q": "**11.** Uzupełnij: Choroba ………… trwa miesiące lub lata. (1 słowo)", "q_ru": "Дополни: … болезнь длится месяцы или годы.", "accept": ["przewlekła", "przewlekla"], "explain": "Choroba **przewlekła** trwa miesiące lub lata. *(karta pracy „Choroby cywilizacyjne i przewlekłe”)*", "explain_ru": "Хроническая."}, {"id": "t2_cyw", "type": "short", "tag": "l3", "q": "**12.** Uzupełnij: Określenie „choroby …………” opisuje związek z warunkami życia. (1 słowo)", "q_ru": "Дополни: «болезни …» связаны с условиями жизни.", "accept": ["cywilizacyjne", "cywilizacyjna", "cywilizacyjnych"], "explain": "**Choroby cywilizacyjne** – określenie opisuje związek z warunkami życia. *(karta pracy „Choroby cywilizacyjne i przewlekłe”)*", "explain_ru": "Болезни цивилизации."}, {"id": "t2_cukwhy", "type": "mc", "tag": "l3", "q": "**13.** Dlaczego cukrzyca typu 2 może należeć do **obu** grup?", "q_ru": "Почему диабет 2 типа – в обеих группах?", "options": ["bo trwa długo (miesiące, lata) i ma związek z warunkami życia", "bo wywołują ją wirusy", "bo leczy się ją antybiotykiem", "bo jest w kalendarzu szczepień"], "answer": 0, "explain": "Jest **przewlekła** (trwa długo) i **cywilizacyjna** (związek z warunkami życia). *(karta pracy „Choroby cywilizacyjne i przewlekłe”)*", "explain_ru": "Длится долго и связана с условиями жизни."}, {"id": "t2_adam", "type": "mc", "tag": "l3", "q": "**14.** Adam po udarze wolniej chodzi i mówi. Co jest dobrą pomocą?", "q_ru": "Адам после инсульта медленнее ходит и говорит. Как помочь?", "options": ["dać mu więcej czasu, nie poganiać, zapytać, czy potrzebuje pomocy", "kończyć za niego zdania", "iść szybciej, żeby się przyzwyczaił", "robić wszystko za nie
