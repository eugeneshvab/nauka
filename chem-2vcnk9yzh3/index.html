<title>Chemia: bezpieczeństwo w pracowni, szkło laboratoryjne i gęstość</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1d2433;--muted:#5d6678;--pri:#4f46e5;--pri2:#eef2ff;--ok:#16a34a;--okbg:#dcfce7;--bad:#dc2626;--badbg:#fee2e2;--warn:#b45309;--warnbg:#fef3c7;--line:#e3e6ee;--r:14px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:18px 16px 14px}
header .wrap{max-width:980px;margin:auto}
header h1{margin:0;font-size:1.45rem;line-height:1.25}
header p{margin:4px 0 0;opacity:.9;font-size:.95rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{background:rgba(255,255,255,.18);border-radius:99px;padding:2px 10px;font-size:.8rem}
.bar{height:8px;background:rgba(255,255,255,.25);border-radius:99px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:#a7f3d0;width:0;transition:width .4s}
nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
nav .wrap{max-width:980px;margin:auto;display:flex;gap:2px;padding:0 8px}
nav button{border:0;background:none;padding:12px 10px;font:inherit;font-size:.92rem;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:var(--pri);border-color:var(--pri);font-weight:600}
nav .badge{background:var(--bad);color:#fff;border-radius:99px;font-size:.7rem;padding:0 6px;margin-left:3px}
main{max-width:980px;margin:auto;padding:16px}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:0 0 14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
h2{font-size:1.25rem;margin:0 0 8px}h3{font-size:1.05rem;margin:0 0 8px}
.muted{color:var(--muted)}.small{font-size:.88rem}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--pri);color:#fff;margin:4px 6px 4px 0}
.btn.sec{background:var(--pri2);color:var(--pri)}.btn.ghost{background:none;color:var(--muted);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;margin:6px 0;font:inherit;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:#c7d2fe}.opt.sel{border-color:var(--pri);background:var(--pri2)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.fb{border-radius:10px;padding:10px 12px;margin-top:10px}.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.warn{background:var(--warnbg);color:#78350f;border-radius:10px;padding:10px 12px;margin:0 0 14px}
.q{margin-bottom:6px;font-weight:600}.src{border-left:4px solid #a5b4fc;background:#f8f9ff;padding:8px 12px;font-style:italic;margin:6px 0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.row .lbl{flex:1 1 220px}select,input[type=text],input[type=date],textarea{font:inherit;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{width:100%;min-height:110px}select{max-width:100%}
.ordi{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:10px;padding:6px 8px;margin:5px 0;background:#fff}
.ordi span{flex:1}.ordi button{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:30px;cursor:pointer}
.ordi.ok{border-color:var(--ok)}.ordi.bad{border-color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.kp li{margin:3px 0}
.tl{position:relative;margin:8px 0 0 8px;padding-left:18px;border-left:3px solid #c7d2fe}
.tl div{position:relative;margin:0 0 10px}.tl div:before{content:"";position:absolute;left:-26px;top:5px;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--pri)}
.tl div.key:before{background:var(--pri)}.tl b{display:inline-block;min-width:118px;color:var(--pri)}
.fc{perspective:1000px;height:210px;cursor:pointer;margin:6px 0 10px}.fc.hasimg{height:280px}
/* optional images (schema: images{}, q.image, q.optionImages, q.pairImages, cat item img, flashcard frontImage/backImage, lesson/cheat images[]) */
.tpimg{display:inline-block;vertical-align:middle;object-fit:contain;max-width:100%}
.qimg{margin:6px 0 10px}.qimg .tpimg{width:140px;height:140px}
.opt .tpimg{width:72px;height:72px;margin-right:10px}.opt.hasimg{display:inline-flex;align-items:center;width:auto;min-width:46%;margin-right:6px}
.row .lbl .tpimg{width:64px;height:64px;margin-right:8px}
.fc .tpimg{width:120px;height:120px;display:block;margin:0 auto 8px}.fc .cw{display:flex;flex-direction:column;align-items:center}
.gal{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}.gal figure{margin:0;width:118px;text-align:center;font-size:.82rem;line-height:1.25}.gal .tpimg{width:100px;height:100px;display:block;margin:0 auto 4px}
.cheat .gal{gap:4px}.cheat .gal figure{width:84px;font-size:.72rem}.cheat .gal .tpimg{width:64px;height:64px}
@media print{.cheat .gal figure{width:62px;font-size:8px}.cheat .gal .tpimg{width:44px;height:44px}}
.qimg .tpimg.wide{width:100%;max-width:560px;height:auto}.opt .tpimg.wide{width:110px;height:auto}.row .lbl .tpimg.wide{width:210px;max-width:60vw;height:auto}.fc .tpimg.wide{width:auto;max-width:100%;height:150px}.gal figure.wide{width:100%;max-width:560px}.gal figure.wide .tpimg{width:100%;height:auto}.cheat .gal figure.wide{width:48%;max-width:340px}.cheat .gal figure.wide .tpimg{width:100%;height:auto}
@media print{.cheat .gal figure.wide{width:30%}.cheat .gal figure.wide .tpimg{width:100%;height:auto}}
.fc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;font-size:1.15rem;border:2px solid var(--line)}
.fc .f{background:#fff;font-weight:700}.fc .b{background:var(--pri2);transform:rotateY(180deg)}
.dots{display:flex;gap:4px;flex-wrap:wrap}.dots i{width:12px;height:12px;border-radius:3px;background:var(--line)}.dots i.b1{background:#fca5a5}.dots i.b2{background:#fcd34d}.dots i.b3{background:#86efac}
.meter{height:10px;background:var(--line);border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:var(--ok)}
.score{font-size:2rem;font-weight:800}
.why summary{cursor:pointer;color:var(--pri);font-weight:600}
.tldr{background:#f0fdf4;border-radius:10px;padding:8px 12px;margin-top:8px;font-size:.95rem}
.langsw button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;cursor:pointer;font:inherit;font-size:.85rem}.langsw button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
svg text{font:12px system-ui,sans-serif}
.cheat{columns:2 260px;column-gap:24px}.cheat .blk{break-inside:avoid;margin-bottom:10px}.cheat h3{margin:0 0 4px;color:var(--pri)}.cheat ul{margin:0;padding-left:18px}
footer{max-width:980px;margin:0 auto 30px;padding:0 16px;color:var(--muted);font-size:.82rem}
@media print{
 header,nav,footer,.noprint{display:none!important}body{background:#fff;font-size:12px}
 section{display:none!important}#s-cheat{display:block!important}.card{border:0;box-shadow:none;padding:0}
 main{padding:0}.cheat{columns:2}
}
@media (max-width:560px){.tl b{display:block}header h1{font-size:1.2rem}}
.weakbanner{border:2px solid #f59e0b;background:#fffbeb}.weakbanner h2{margin-top:0}.weakhd{border-left:6px solid #f59e0b}.wjump{flex-wrap:wrap;gap:8px}.wjump a{text-decoration:none}
.wtpl{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}.wtpl>div{flex:1 1 140px;border-radius:10px;padding:8px 10px;font-size:.92rem}.wtpl>div b{display:block}.wtpl i{align-self:center;font-style:normal;color:#94a3b8}
.ws0{background:#fee2e2}.ws1{background:#fef3c7}.ws2{background:#dcfce7}.ws3{background:#dbeafe}.wsteps>div{border-radius:10px;padding:8px 10px;margin:6px 0}
.wmodel textarea{width:100%;box-sizing:border-box;min-height:110px;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line)}.wkw{list-style:none;padding-left:0}.wkw li{margin:3px 0}.wkw li.no{color:#9a3412}
.wcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}.wcard{min-height:110px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px;text-align:left;font:inherit;cursor:pointer;color:inherit}
.wcard .b{display:none}.wcard.flip{background:#ecfdf5}.wcard.flip .f{display:none}.wcard.flip .b{display:block}.wcard .f{font-weight:700}.wsol{margin:6px 0 0;padding-left:20px}.weaktest{border:2px solid var(--accent,#4f46e5)}
.cheat .blk.wide{column-span:all}.ftab td,.ftab tbody th{font-size:.92rem}@media print{.ftab{font-size:9pt}.ftab th,.ftab td{padding:2px 4px}}
.qbox .opt.ok{border-color:var(--ok);background:var(--okbg)}.qbox .opt.bad{border-color:var(--bad);background:var(--badbg)}
.qbox .opt.ok::after,.qbox .btn.tfok::after{content:" ✓";color:var(--ok);font-weight:800;margin-left:6px}.qbox .opt.bad::after,.qbox .btn.tfbad::after{content:" ✗";color:var(--bad);font-weight:800;margin-left:6px}
.qbox .btn.tfok{background:var(--okbg);border-color:var(--ok);color:var(--ink)}.qbox .btn.tfbad{border-color:var(--bad);color:var(--ink)}
.ttwrap{overflow-x:auto;margin:6px 0}.ttab{border-collapse:collapse;width:100%;font-size:.95rem}.ttab th,.ttab td{border:1px solid var(--line);padding:6px;vertical-align:top;text-align:left}
.ttab thead th{background:var(--pri2);color:var(--pri);font-size:.8rem;line-height:1.2}.ttab tbody th{background:var(--bg);white-space:nowrap}
.ttab input[type=text]{width:100%;box-sizing:border-box;min-width:0;padding:6px 8px;font-size:16px}.ttab input.ok{border-color:var(--ok);background:var(--okbg)}.ttab input.bad{border-color:var(--bad);background:var(--badbg)}
.ttab .tcor{display:block;font-size:.85rem;margin-top:3px;color:var(--ink)}.ttab tr.tnr td{background:var(--badbg);font-size:.88rem;color:var(--ink)}.ttab tr.tnr[hidden]{display:none}
.tdscore{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (max-width:640px){.ttab thead{display:none}.ttab,.ttab tbody,.ttab tr,.ttab th,.ttab td{display:block;width:auto}
 .ttab tr{border:1px solid var(--line);border-radius:12px;margin:0 0 10px;padding:8px 10px;background:var(--card)}.ttab tbody th{background:none;border:0;font-size:1.08rem;color:var(--pri);padding:2px 0 4px;white-space:normal}
 .ttab td{border:0;padding:4px 0}.ttab td:before{content:attr(data-label);display:block;font-size:.78rem;color:var(--muted);font-weight:600;margin-bottom:2px}.ttab tr.tnr{margin-top:-6px;border-color:var(--bad)}.ttab tr.tnr td:before{content:none}}
@media (max-width:560px){.wtpl i{display:none}.wtpl>div{flex-basis:100%}}
.mic{margin:6px 0 4px}.micbtn{font-size:1.05rem;padding:10px 16px}.btn.micbtn.rec{background:#fee2e2!important;color:#991b1b!important;border-color:#fca5a5;animation:micp 1.2s infinite}@keyframes micp{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.45)}50%{box-shadow:0 0 0 8px rgba(220,38,38,0)}}.miclive{min-height:1.2em;margin-top:6px;color:var(--muted,#6b6b6b)}.miclive i{color:var(--ink)}.mic-hint{margin:4px 0}
</style>
<style id="ogarnio-theme">
:root{--og-canvas:#F7F3EB;--og-surface:#FFFCF6;--og-ink:#292D29;--og-ink-soft:#68665D;--og-hair:#DDD9D0;--og-sage:#607361;--og-sage-pale:#E3E9DF;
--og-olive:#454E40;--og-clay:#9B614B;--og-clay-pale:#F2E3D9;--og-ochre:#8A642F;--og-ochre-pale:#F6EDDA;--og-lake:#596F79;--og-lake-pale:#E4EAEC;
--bg:var(--og-canvas);--card:var(--og-surface);--ink:var(--og-ink);--muted:var(--og-ink-soft);--pri:var(--og-sage);--pri2:var(--og-sage-pale);
--ok:#4E7A52;--okbg:var(--og-sage-pale);--bad:var(--og-clay);--badbg:var(--og-clay-pale);--warn:var(--og-ochre);--warnbg:var(--og-ochre-pale);--line:var(--og-hair);--r:22px;
--og-shadow:0 1px 1px rgba(0,0,0,.05),0 6px 22px rgba(0,0,0,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",Roboto,Ubuntu,sans-serif;background:var(--og-canvas);color:var(--og-ink);-webkit-font-smoothing:antialiased}
h1,h2,h3,.score{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,"Segoe UI",Roboto,sans-serif;font-weight:600;letter-spacing:-.02em}
header{position:relative;overflow:hidden;background:var(--og-canvas);color:var(--og-ink);padding:18px 20px 16px}
header h1{font-size:2rem;line-height:1.15;margin-top:4px;padding-right:120px}header p{opacity:1;color:var(--og-ink-soft)}
header .wrap{position:relative;z-index:1}
.og-brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.05rem;letter-spacing:-.01em;color:var(--og-olive);margin-bottom:10px}
.og-brand .og-dot{width:28px;height:28px;border-radius:9px;background:var(--og-sage);display:grid;place-items:center}
.og-brand small{font-weight:500;color:var(--og-ink-soft);font-size:.85rem}
.og-kite{position:absolute;right:max(12px,calc(50% - 480px));top:8px;width:116px;height:150px;opacity:.95;pointer-events:none;z-index:0}
@media (max-width:640px){.og-kite{width:74px;height:96px;right:8px;top:6px;opacity:.6}header h1{font-size:1.55rem;padding-right:58px}}
.chips .chip{background:var(--og-sage-pale);color:var(--og-olive);font-weight:500;padding:3px 11px}
.chips .chip:nth-child(3n+2){background:var(--og-ochre-pale);color:var(--og-ochre)}.chips .chip:nth-child(3n){background:var(--og-lake-pale);color:var(--og-lake)}
.bar{background:var(--og-hair);height:8px}.bar i{background:var(--og-sage)}
nav{background:color-mix(in srgb,var(--og-canvas) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:0;padding:6px 0 8px}
nav .wrap{gap:4px;padding:4px;margin:0 auto;max-width:980px;background:#ECE6DA;border-radius:999px;width:max-content;max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none}
nav .wrap::-webkit-scrollbar{display:none}
nav button{border:0;border-radius:999px;padding:8px 14px;color:var(--og-ink-soft);font-weight:500}
nav button.on{background:var(--og-surface);color:var(--og-ink);border:0;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.06)}
nav .badge{background:var(--og-clay)}
main{padding:12px 16px 90px}
.card{background:var(--og-surface);border:0;border-radius:var(--r);padding:18px 18px;box-shadow:var(--og-shadow)}
.btn{border-radius:15px;padding:11px 18px;background:var(--og-sage)}.btn.sec{background:var(--og-sage-pale);color:var(--og-olive)}
.btn.ghost{border-color:var(--og-hair);color:var(--og-ink-soft);background:transparent}
.opt,.ordi,select,input[type=text],input[type=date],textarea{border-color:var(--og-hair);border-radius:15px;background:var(--og-surface)}
.opt:hover{border-color:#BFCBBB}.opt.sel{border-color:var(--og-sage);background:var(--og-sage-pale)}
.fb,.warn,.tldr{border-radius:15px}.warn{color:#5E4520}.tldr{background:var(--og-sage-pale)}
.src{border-left-color:var(--og-ochre);background:var(--og-ochre-pale)}
.tl{border-left-color:#C9D3C5}.tl div:before{border-color:var(--og-sage);background:var(--og-surface)}.tl div.key:before{background:var(--og-sage)}.tl b{color:var(--og-olive)}
.fc .f,.fc .b{border-color:var(--og-hair);border-radius:22px}.fc .f{background:var(--og-surface)}.fc .b{background:var(--og-sage-pale)}
.dots i.b1{background:#D9A48F}.dots i.b2{background:#E3C68F}.dots i.b3{background:#A9BCA6}
.meter{background:var(--og-hair)}.meter i{background:var(--og-sage)}
.why summary,.cheat h3{color:var(--og-olive)}
.langsw button{border-radius:999px;border-color:var(--og-hair);background:var(--og-surface)}.langsw button.on{background:var(--og-sage);border-color:var(--og-sage)}
footer{color:var(--og-ink-soft)}
@media print{body{background:#fff}.card{box-shadow:none}.og-kite{display:none}}
</style>
</head>

ncja drażniąca", "substancja utleniająca", "substancja toksyczna", "substancja żrąca"], "answer": 3, "explain": "To GHS05: ciecz z probówek niszczy powierzchnię i dłoń – substancja **żrąca** (np. wodorotlenek sodu). Toksyczna = czaszka, drażniąca = wykrzyknik, utleniająca = płomień nad okręgiem.", "image": "GHS05"}, {"id": "d2", "type": "tf", "tag": "l2", "q": "Prawda czy fałsz?", "items": [{"s": "W pracowni chemicznej możesz przebywać tylko w obecności nauczyciela.", "a": true}, {"s": "Doświadczenie można wykonać po swojemu, byle szybko.", "a": false}], "explain": "Złota szóstka: 1) przebywasz w pracowni tylko z nauczycielem; 3) każde doświadczenie wykonujesz **zgodnie z opisem**, zachowując ostrożność."}, {"id": "d3", "type": "mc", "tag": "l3", "q": "Jak nazywa się to naczynie?", "options": ["kolba stożkowa", "krystalizator", "kolba kulista płaskodenna", "zlewka"], "answer": 0, "explain": "Szerokie dno, zwężające się ku górze ścianki i wąska szyjka – to **kolba stożkowa**. Zlewka ma proste ścianki i dzióbek, kolba kulista ma kulisty brzuch.", "image": "kolba_stozkowa"}, {"id": "d4", "type": "mc", "tag": "l4", "q": "Które zdanie jest **obserwacją**?", "options": ["Na ściankach probówki pojawiają się krople bezbarwnej cieczy.", "Na ściankach probówki pojawia się woda.", "Otrzymanym gazem jest dwutlenek węgla.", "Doświadczenie się powiodło."], "answer": 0, "explain": "Obserwacja opisuje tylko to, co rejestrują zmysły: widzimy **krople bezbarwnej cieczy**. To, że ta ciecz jest wodą, to już wniosek – wymaga wiedzy (oczami nie odróżnisz wody od innej bezbarwnej cieczy)."}, {"id": "d5", "type": "mc", "tag": "l5", "q": "Jaki jest wzór na gęstość?", "options": ["d = m + V", "d = V / m", "d = m / V", "d = m · V"], "answer": 2, "explain": "Gęstość to masa przypadająca na jednostkę objętości: **d = m / V** (masa podzielona przez objętość)."}, {"id": "d6", "type": "short", "tag": "l6", "q": "Oblicz gęstość substancji: m = 54 g, V = 20 cm³. Podaj wynik w g/cm³.", "accept": ["2,7 g/cm³", "2,7"], "num": 2.7, "explain": "d = m / V = 54 g : 20 cm³ = **2,7 g/cm³** (taką gęstość ma glin).", "tol": 0.05}, {"id": "d7", "type": "mc", "tag": "l7", "q": "Do probówki wlano najpierw oliwę, a potem wodę i wstrząśnięto. Co zobaczymy po chwili?", "options": ["ciecze wymieszają się na stałe", "oliwa opadnie na dno", "woda będzie na górze, bo wlano ją później", "oliwa zbierze się na górze, woda na dole"], "answer": 3, "explain": "Oliwa ma mniejszą gęstość (ok. 0,92 g/cm³) niż woda (1 g/cm³), więc zawsze wypływa na powierzchnię – **kolejność wlewania nie ma znaczenia** (Doświadczenie 4)."}, {"id": "d8", "type": "mc", "tag": "l5", "q": "Ile to jest 1 g/cm³ w kg/m³?", "options": ["100 kg/m³", "1 kg/m³", "1000 kg/m³", "0,001 kg/m³"], "answer": 2, "explain": "1 m³ = 1 000 000 cm³. Jeśli 1 cm³ waży 1 g, to 1 m³ waży 1 000 000 g = 1000 kg. Więc **1 g/cm³ = 1000 kg/m³**."}], "lessons": [{"id": "l1", "title": "Piktogramy GHS, etykiety i karty charakterystyki", "minutes": 15, "body": ["Wiele substancji w pracowni (i w domu!) może być niebezpiecznych. Dlatego **każdy odczynnik musi mieć czytelną etykietę**, a jeśli wymagają tego jego właściwości – także **piktogramy ostrzegawcze**.", "Piktogramy GHS to **czerwone romby (kwadraty postawione na rogu) z białym tłem i czarnym symbolem**. Jest ich 9 – na obrazkach poniżej każdy ma podpis. Naucz się ich tak, by rozpoznawać je bez podpisu.", "**Wybuchowa** (GHS01) – wybuchająca bomba. **Łatwopalna** (GHS02) – płomień. **Utleniająca** (GHS03) – płomień **nad okręgiem** (podtrzymuje palenie innych substancji). **Gaz pod ciśnieniem** (GHS04) – butla.", "**Żrąca** (GHS05) – ciecz kapiąca z probówek niszczy powierzchnię i dłoń. **Toksyczna** (GHS06) – czaszka i skrzyżowane piszczele. **Drażniąca** (GHS07) – wykrzyknik.", "**Rakotwórcza / mutagenna** (GHS08) – sylwetka człowieka z „gwiazdą” na piersi (poważne, często długotrwałe zagrożenie dla zdrowia). **Niebezpieczna dla środowiska** (GHS09) – uschnięte drzewo i martwa ryba.", "Uwaga na podobne pary: **płomień** (łatwopalna) ≠ **płomień nad okręgiem** (utleniająca); **czaszka** (toksyczna) ≠ **wykrzyknik** (drażniąca).", "Więcej informacji o substancji znajdziesz w **karcie charakterystyki**. To dokument, który podaje m.in. zastosowanie, zagrożenia dla zdrowia i środowiska, pierwszą pomoc, środki ochrony (rękawice, okulary) i właściwości (np. barwę, stan skupienia).", "Przykład (zad. 3 z podręcznika): **wodorotlenek sodu** – stosowany np. do produkcji mydła i w środkach do udrażniania rur; jest **żrący** (GHS05) – powoduje poważne oparzenia skóry i uszkodzenie oczu; oczy chronimy **okularami ochronnymi**; to **białe** ciało stałe (granulki, płatki)."], "keyPoints": ["Odczynnik = czytelna etykieta + piktogramy (jeśli trzeba)", "9 piktogramów GHS: czerwony romb, białe tło, czarny symbol", "Płomień = łatwopalna; płomień nad okręgiem = utleniająca", "Czaszka = toksyczna; wykrzyknik = drażniąca; ciecz niszcząca dłoń = żrąca", "Karta charakterystyki = wszystkie ważne informacje o substancji"], "why": [{"q": "Dlaczego piktogramy są obrazkami, a nie tylko napisem?", "a": "Obrazek każdy rozpozna szybko, niezależnie od języka. Dlatego piktogramy są takie same w całej Unii Europejskiej i w wielu krajach świata."}, {"q": "Czym się różni substancja łatwopalna od utleniającej?", "a": "Łatwopalna sama łatwo się zapala (np. benzyna, aceton). Utleniająca nie musi się palić, ale **podtrzymuje palenie innych** substancji (np. tlen w butli), więc pożar jest gwałtowniejszy."}], "tldr": {"pl": "Każdy odczynnik ma etykietę z piktogramami. 9 piktogramów GHS (czerwony romb): wybuchowa, łatwopalna, utleniająca, gaz pod ciśnieniem, żrąca, toksyczna, drażniąca, rakotwórcza, niebezpieczna dla środowiska. Szczegóły – w karcie charakterystyki.", "en": "Every reagent has a label with hazard pictograms. 9 GHS pictograms (red diamond): explosive, flammable, oxidising, gas under pressure, corrosive, toxic, irritant, carcinogenic/mutagenic, hazardous to the environment. Details are in the safety data sheet.", "ru": "У каждого реактива есть этикетка с пиктограммами. 9 пиктограмм GHS (красный ромб): взрывоопасное, легковоспламеняющееся, окисляющее, газ под давлением, едкое, токсичное, раздражающее, канцерогенное/мутагенное, опасное для окружающей среды. Подробности – в паспорте безопасности."}, "images": [{"img": "GHS01", "caption": "wybuchowa (GHS01)"}, {"img": "GHS02", "caption": "łatwopalna (GHS02)"}, {"img": "GHS03", "caption": "utleniająca (GHS03)"}, {"img": "GHS04", "caption": "gaz pod ciśnieniem (GHS04)"}, {"img": "GHS05", "caption": "żrąca (GHS05)"}, {"img": "GHS06", "caption": "toksyczna (GHS06)"}, {"img": "GHS07", "caption": "drażniąca (GHS07)"}, {"img": "GHS08", "caption": "rakotwórcza / mutagenna (GHS08)"}, {"img": "GHS09", "caption": "niebezpieczna dla środowiska (GHS09)"}]}, {"id": "l2", "title": "Złota szóstka – zasady pracy w pracowni chemicznej", "minutes": 8, "body": ["W podręczniku zasady bezpiecznej pracy zebrano w **złotą szóstkę**:", "**1.** W pracowni możesz przebywać tylko w obecności nauczyciela.", "**2.** Podczas niektórych zajęć będą wykonywane doświadczenia. Zanim do nich przystąpisz, musisz zadbać o czystość swojego miejsca pracy.", "**3.** Każde doświadczenie wykonuj zgodnie z opisem, zachowując ostrożność.", "**4.** Dbaj o bezpieczeństwo swoje i osób, z którymi przebywasz w sali chemicznej.", "**5.** Słuchaj uważnie poleceń nauczyciela i dokładnie je wykonuj.", "**6.** Pamiętaj o przestrzeganiu regulaminu pracowni chemicznej.", "Do tego dochodzi „W skrócie”: każdy odczynnik ma czytelną etykietę z piktogramami, przydatne informacje o substancjach są w **kartach charakterystyki**, a doświadczenia wykonuje się w specjalnym **szkle laboratoryjnym** z odpowiednim sprzętem."], "keyPoints": ["Tylko z nauczycielem", "Czyste miejsce pracy przed doświadczeniem", "Zgodnie z opisem i ostrożnie", "Bezpieczeństwo swoje i innych", "Słuchaj poleceń nauczyciela", "Przestrzegaj regulaminu pracowni"], "why": [{"q": "Po co sprzątać stanowisko przed doświadczeniem?", "a": "Na zagraconym stole łatwo coś przewrócić albo pomylić substancje, a resztki poprzedniego doświadczenia mogą zareagować z nowymi odczynnikami."}, {"q": "Dlaczego trzeba trzymać się opisu doświadczenia?", "a": "Opis jest sprawdzony – podaje bezpieczne ilości i kolejność. Zmiana „na oko” może skończyć się rozpryskiem, oparzeniem albo nieudanym doświadczeniem."}], "tldr": {"pl": "Złota szóstka: tylko z nauczycielem; czyste stanowisko; doświadczenie zgodnie z opisem i ostrożnie; dbaj o bezpieczeństwo swoje i innych; słuchaj poleceń; przestrzegaj regulaminu.", "en": "Golden six: only with the teacher; clean workplace; follow the procedure carefully; keep yourself and others safe; listen to the teacher; obey the lab rules.", "ru": "Золотая шестёрка: только при учителе; чистое рабочее место; опыт строго по описанию и осторожно; береги себя и других; слушай учителя; соблюдай правила кабинета."}}, {"id": "l3", "title": "Szkło i sprzęt laboratoryjny", "minutes": 12, "body": ["Doświadczenia wykonuje się w specjalnym **szkle laboratoryjnym** – jest odporne na ogrzewanie i na działanie wielu substancji. Każde naczynie ma swój kształt i swoje zadanie. Obejrzyj rysunki i zapamiętaj kształty.", "**Zlewka** – przechowywanie, mieszanie i ogrzewanie cieczy, przygotowywanie roztworów (ma dzióbek do przelewania).", "**Probówka** – doświadczenia z małymi ilościami substancji, także ogrzewanie (trzymana w uchwycie).", "**Kolba stożkowa** – mieszanie cieczy przez wstrząsanie bez rozlewania, ogrzewanie; wąska szyjka ogranicza rozpryskiwanie.", "**Kolba kulista płaskodenna** – równomierne ogrzewanie cieczy, otrzymywanie gazów; płaskie dno – można ją postawić na stole.", "**Szkiełko zegarkowe** – odważanie małych ilości substancji stałych, przykrywanie zlewki, odparowywanie kropli cieczy.", "**Pipeta Pasteura z podziałką** – pobieranie i odmierzanie małych ilości cieczy, dodawanie kroplami.", "**Moździerz z tłuczkiem** – rozcieranie (rozdrabnianie) substancji stałych na proszek.", "**Krystalizator** – krystalizacja – odparowanie cieczy i otrzymywanie kryształów; płaskie, szerokie naczynie.", "Jak je odróżnić? **Zlewka** – walec z dzióbkiem. **Kolba stożkowa** – stożek z wąską szyjką. **Kolba kulista płaskodenna** – kula z szyjką i płaskim dnem. **Krystalizator** – niskie, szerokie naczynie. **Szkiełko zegarkowe** – wypukła szklana miseczka. **Pipeta Pasteura** – rurka z bańką, z podziałką. **Moździerz** – gruba miska z tłuczkiem."], "keyPoints": ["zlewka: ciecze, mieszanie, roztwory", "probówka: małe ilości substancji", "kolba stożkowa: mieszanie przez wstrząsanie", "kolba kulista płaskodenna: ogrzewanie cieczy, otrzymywanie gazów", "szkiełko zegarkowe: odważanie, przykrywanie zlewki", "pipeta Pasteura z podziałką: małe ilości cieczy, kroplami", "moździerz z tłuczkiem: rozcieranie substancji stałych", "krystalizator: otrzymywanie kryształów"], "why": [{"q": "Dlaczego w kolbie stożkowej łatwiej mieszać niż w zlewce?", "a": "Wąska szyjka sprawia, że przy wstrząsaniu ciecz nie wylewa się ani nie pryska, a szerokie dno pozwala jej swobodnie się poruszać."}, {"q": "Dlaczego probówkę ogrzewa się w uchwycie?", "a": "Szkło szybko się nagrzewa – trzymanie palcami grozi oparzeniem. Wylot probówki kieruje się w bok, nigdy na siebie ani na kolegę."}], "tldr": {"pl": "Zlewka – ciecze, roztwory; probówka – małe ilości; kolba stożkowa – mieszanie bez rozlewania; kolba kulista płaskodenna – ogrzewanie; szkiełko zegarkowe – odważanie, przykrywanie; pipeta Pasteura – małe ilości cieczy; moździerz – rozcieranie; krystalizator – krystalizacja.", "en": "Beaker – liquids, solutions; test tube – small amounts; conical (Erlenmeyer) flask – mixing without spilling; flat-bottomed round flask – heating; watch glass – weighing small amounts, covering; graduated Pasteur pipette – small volumes of liquid; mortar and pestle – grinding; crystallising dish – crystallisation.", "ru": "Стакан – жидкости, растворы; пробирка – малые количества; коническая колба – перемешивание без разливания; круглая плоскодонная колба – нагревание; часовое стекло – взвешивание, накрывание; пипетка Пастера – малые объёмы жидкости; ступка с пестиком – растирание; кристаллизатор – кристаллизация."}, "images": [{"img": "zlewka", "caption": "zlewka"}, {"img": "probowka", "caption": "probówka"}, {"img": "kolba_stozkowa", "caption": "kolba stożkowa"}, {"img": "kolba_kulista", "caption": "kolba kulista płaskodenna"}, {"img": "szkielko_zegarkowe", "caption": "szkiełko zegarkowe"}, {"img": "pipeta_pasteura", "caption": "pipeta Pasteura z podziałką"}, {"img": "mozdzierz", "caption": "moździerz z tłuczkiem"}, {"img": "krystalizator", "caption": "krystalizator"}]}, {"id": "l4", "title": "Obserwacje i wnioski", "minutes": 10, "body": ["Podczas doświadczenia zapisujemy **obserwacje**, a na końcu formułujemy **wnioski**. To nie to samo!", "**Obserwacja** opisuje to, co rejestrują **zmysły** (wzrok, słuch, węch, dotyk): barwę, dym, pęcherzyki, krople, ciepło, warstwy. Nie zawiera nazw substancji, których nie da się rozpoznać „na oko”, ani ocen.", "**Wniosek** to obserwacje połączone z **wiedzą naukową** – wyjaśnienie, co się stało i dlaczego: nazwa powstałej substancji, jej właściwość, ocena doświadczenia.", "Przykład: widzisz **krople bezbarwnej cieczy** na ściankach probówki – to obserwacja. Stwierdzasz, że **to woda** – to wniosek (oczami nie odróżnisz wody od np. alkoholu; potrzebna jest wiedza).", "Obserwacje z podręcznika: po ogrzaniu pojawia się siwy dym; na ściankach probówki pojawiają się krople bezbarwnej cieczy; zawartość szalki robi się ciepła; w zlewce pojawiły się dwie warstwy płynów.", "Wnioski z podręcznika: otrzymanym gazem jest dwutlenek węgla; na ściankach probówki pojawia się woda; doświadczenie się powiodło; tlen podtrzymuje spalanie.", "Sposób na zapamiętanie: zapytaj „**Czy zobaczę / poczuję to bez wiedzy z chemii?**”. Tak → obserwacja. Nie, trzeba coś wiedzieć albo ocenić → wniosek."], "keyPoints": ["Obserwacja = to, co rejestrują zmysły", "Wniosek = obserwacje + wiedza naukowa", "Nazwa substancji (woda, CO₂) → wniosek", "„Doświadczenie się powiodło” → wniosek (ocena)"], "why": [{"q": "Dlaczego „pojawia się woda” to wniosek, skoro widać krople?", "a": "Widać krople bezbarwnej cieczy, ale nie widać, że to woda – wiele cieczy jest bezbarwnych. Nazwanie jej wodą wymaga wiedzy, więc to wniosek."}, {"q": "Dlaczego „zawartość szalki robi się ciepła” to obserwacja?", "a": "Ciepło czujemy dotykiem (zmysłem). Nie ma tu wyjaśnienia – tylko opis tego, co odczuwamy."}], "tldr": {"pl": "Obserwacja – to, co widzisz, czujesz, słyszysz (dym, krople, ciepło, warstwy). Wniosek – wyjaśnienie z użyciem wiedzy (to woda, to CO₂, doświadczenie się powiodło, tlen podtrzymuje spalanie).", "en": "Observation – what your senses register (smoke, droplets, warmth, layers). Conclusion – explanation using scientific knowledge (it is water, it is CO₂, the experiment worked, oxygen supports burning).", "ru": "Наблюдение – то, что фиксируют органы чувств (дым, капли, тепло, слои). Вывод – объяснение с помощью знаний (это вода, это CO₂, опыт удался, кислород поддерживает горение)."}}, {"id": "l5", "title": "Gęstość – wzór, jednostki, tabela", "minutes": 15, "body": ["Dlaczego olej, mleko i miód wlane do jednego naczynia tworzą warstwy? Dlaczego balonik z helem się unosi? Odpowiedź to **gęstość**.", "**Gęstość (d)** to masa jednostki objętości substancji: **d = m / V**, gdzie m – masa, V – objętość. W niektórych książkach gęstość oznacza się grecką literą **ρ** (ro).", "Przekształcenia wzoru: **m = d · V** (masa) oraz **V = m / d** (objętość).", "Jednostka w układzie SI: **kg/m³**. W praktyce (w chemii) najczęściej **g/cm³** (zapisywane też g·cm⁻³). **1 g/cm³ = 1000 kg/m³**.", "**Woda** ma gęstość ok. **1 g/cm³** (dokładnie w temperaturze 4 °C): 1 cm³ wody ma masę ok. 1 g, a 1 dm³ (1 litr) – ok. 1 kg.", "Zamiana jednostek masy: **1 kg = 1000 g**, **1 kg = 100 dag**, **1 g = 1000 mg** (1 dag = 10 g).", "Zamiana jednostek objętości: **1 m³ = 1000 dm³**, **1 dm³ = 1000 cm³**, **1 cm³ = 1000 mm³** (1 dm³ = 1 litr, 1 cm³ = 1 ml).", "Tabela gęstości (g/cm³): woda 1 · lód 0,92 · oliwa ok. 0,92 · glin 2,7 · żelazo 7,87 · miedź 8,9 · ołów 11,3 · rtęć 13,54 · złoto 19,3 (g/cm³). Największą gęstość ma **osm** (ok. 22,6 g/cm³), najmniejszą z metali – **lit** (ok. 0,53 g/cm³; pływałby po wodzie).", "Gęstość jest **cechą charakterystyczną** substancji – po niej można rozpoznać substancję (np. 19,3 g/cm³ → złoto, 2,7 g/cm³ → glin). Nie zależy od wielkości próbki: mały i duży kawałek żelaza mają tę samą gęstość."], "keyPoints": ["d = m / V; m = d · V; V = m / d", "Jednostki: g/cm³ i kg/m³; 1 g/cm³ = 1000 kg/m³", "Woda ≈ 1 g/cm³ (4 °C)", "1 kg = 1000 g = 100 dag; 1 g = 1000 mg", "1 m³ = 1000 dm³; 1 dm³ = 1000 cm³; 1 cm³ = 1000 mm³", "Gęstość pozwala rozpoznać substancję"], "why": [{"q": "Dlaczego 1 g/cm³ to aż 1000 kg/m³?", "a": "1 m³ to 1 000 000 cm³. Jeśli każdy cm³ ma masę 1 g, to cały m³ ma 1 000 000 g = 1000 kg."}, {"q": "Czy kilogram żelaza jest cięższy niż kilogram pierza?", "a": "Nie – oba mają masę 1 kg! Różnią się objętością: pierze ma bardzo małą gęstość, więc kilogram pierza zajmuje ogromną objętość, a kilogram żelaza – małą kostkę."}], "tldr": {"pl": "Gęstość d = m/V (m = d·V, V = m/d). Jednostki g/cm³ i kg/m³, 1 g/cm³ = 1000 kg/m³. Woda ≈ 1 g/cm³. 1 dm³ = 1000 cm³, 1 kg = 1000 g.", "en": "Density d = m/V (m = d·V, V = m/d). Units g/cm³ and kg/m³, 1 g/cm³ = 1000 kg/m³. Water ≈ 1 g/cm³. 1 dm³ = 1000 cm³, 1 kg = 1000 g.", "ru": "Плотность d = m/V (m = d·V, V = m/d). Единицы г/см³ и кг/м³, 1 г/см³ = 1000 кг/м³. Вода ≈ 1 г/см³. 1 дм³ = 1000 см³, 1 кг = 1000 г."}}, {"id": "l6", "title": "Obliczenia z gęstością – metoda 5 kroków", "minutes": 18, "body": ["Każde zadanie rozwiązuj w **5 krokach**: **1)** dane i szukane; **2)** wzór i ewentualne przekształcenie; **3)** zamiana jednostek (jeśli trzeba); **4)** obliczenie z jednostką; **5)** odpowiedź pełnym zdaniem.", "**Przykład 1 (złoto).** Dane: m = 2000 g, V = 103,7 cm³. Szukane: d. Wzór: d = m / V. Obliczenie: d = 2000 g : 103,7 cm³ ≈ **19,3 g/cm³**. Z tabeli: to **złoto**. Odpowiedź: Sztabka jest wykonana ze złota.", "**Przykład 2 (rtęć w termometrze).** Dane: V = 0,03 cm³, d = 13,54 g/cm³. Szukane: m. Wzór: m = d · V. Obliczenie: m = 13,54 g/cm³ · 0,03 cm³ ≈ **0,41 g**. Odpowiedź: W termometrze jest ok. 0,41 g rtęci.", "**Przykład 3 (gwoździe z miedzi).** Dane: m = 0,5 kg, d = 8,9 g/cm³. Szukane: V. Wzór: V = m / d. Zamiana: 0,5 kg = **500 g** (jednostki muszą pasować do g/cm³!). Obliczenie: V = 500 g : 8,9 g/cm³ ≈ **56,2 cm³**. Odpowiedź: Gwoździe zajmują ok. 56,2 cm³.", "Najczęstszy błąd: mieszanie jednostek. Jeśli gęstość jest w **g/cm³**, masę zamień na **g**, a objętość na **cm³**. Jeśli w **kg/m³** – na kg i m³. Np. 700 kg/m³ = 0,7 g/cm³ (dzielimy przez 1000).", "Sprawdzaj wynik zdrowym rozsądkiem: przy tej samej masie substancja o mniejszej gęstości musi mieć **większą** objętość."], "keyPoints": ["Krok 1: dane i szukane", "Krok 2: wzór i przekształcenie", "Krok 3: zamiana jednostek", "Krok 4: obliczenie z jednostką", "Krok 5: odpowiedź zdaniem", "g/cm³ ↔ g i cm³; kg/m³ ↔ kg i m³"], "why": [{"q": "Po co pisać jednostki w obliczeniach?", "a": "Jednostki skracają się jak liczby: g/cm³ · cm³ = g. Jeśli na końcu wychodzi dziwna jednostka, od razu widać, że wzór był źle przekształcony."}, {"q": "Dlaczego w przykładzie 3 zamieniamy 0,5 kg na 500 g?", "a": "Bo gęstość podana jest w g/cm³. Gdybyśmy podzielili 0,5 przez 8,9, wyszłoby ok. 0,056 – bez sensu, bo jednostki do siebie nie pasują."}], "tldr": {"pl": "5 kroków: dane/szukane → wzór → zamiana jednostek → obliczenie z jednostką → odpowiedź. Złoto: 2000 g : 103,7 cm³ = 19,3 g/cm³; rtęć: 13,54 · 0,03 = 0,41 g; miedź: 500 g : 8,9 = 56,2 cm³.", "en": "5 steps: given/unknown → formula → unit conversion → calculation with units → answer sentence. Gold: 2000 g / 103.7 cm³ = 19.3 g/cm³; mercury: 13.54 · 0.03 = 0.41 g; copper: 500 g / 8.9 = 56.2 cm³.", "ru": "5 шагов: дано/найти → формула → перевод единиц → вычисление с единицами → ответ. Золото: 2000 г / 103,7 см³ = 19,3 г/см³; ртуть: 13,54 · 0,03 = 0,41 г; медь: 500 г / 8,9 = 56,2 см³."}}, {"id": "l7", "title": "Gęstość wokół nas – doświadczenia i zjawiska", "minutes": 10, "body": ["**Doświadczenie 4 – porównanie gęstości wody i oliwy.** Do probówki wlewamy wodę (ok. 1/4 objętości), potem tyle samo oliwy, zamykamy korkiem i wstrząsamy. W drugiej probówce odwrotnie: najpierw oliwa, potem woda.", "**Obserwacje:** po chwili ciecze się rozdzielają, w **obu** probówkach oliwa jest na powierzchni. **Wnioski:** gęstość oliwy jest **mniejsza** od gęstości wody; ciecz o mniejszej gęstości wypływa na powierzchnię; **kolejność dodawania nie ma znaczenia**.", "**Warstwy olej – mleko – miód:** ciecze, które się nie mieszają, układają się od najgęstszej na dole do najmniej gęstej na górze: **miód** (ok. 1,4 g/cm³) na dnie, **mleko** (ok. 1,03 g/cm³) w środku, **olej** (ok. 0,92 g/cm³) na górze.", "**Lód pływa po wodzie**, bo ma gęstość 0,92 g/cm³ – mniejszą niż woda (1 g/cm³).", "**Morze Martwe** jest bardzo zasolone, więc jego woda ma dużą gęstość – człowiek unosi się na niej bez wysiłku. Bałtyk jest mało słony, więc jego woda ma gęstość niewiele większą od wody słodkiej.", "**Jajko:** w wodzie z kranu tonie, a gdy rozpuścimy w wodzie dużo soli, gęstość wody rośnie i jajko **wypływa**.", "**Balon z helem** unosi się, bo hel ma **mniejszą gęstość niż powietrze** (powietrze ok. 1,29 kg/m³, hel ok. 0,18 kg/m³)."], "keyPoints": ["Mniejsza gęstość → na górze, większa → na dole", "Oliwa na wodzie niezależnie od kolejności", "Od dołu: miód, mleko, olej", "Lód 0,92 < woda 1 → lód pływa", "Słona woda ma większą gęstość → jajko wypływa, w Morzu Martwym łatwo się unosić", "Hel ma mniejszą gęstość niż powietrze → balon się unosi"], "why": [{"q": "Dlaczego w Morzu Martwym łatwiej się unosić niż w Bałtyku?", "a": "Im więcej soli rozpuszczonej w wodzie, tym większa jej gęstość. Gęstsza woda mocniej wypycha ciało do góry, więc człowiek unosi się bez wysiłku."}, {"q": "Co by było, gdyby balon napełnić powietrzem z płuc?", "a": "Nie uniósłby się – gaz w środku ma podobną (a nawet trochę większą) gęstość niż powietrze dookoła, więc balon opadnie."}], "tldr": {"pl": "Mniej gęste na górę: oliwa nad wodą (zawsze), lód na wodzie, od dołu miód–mleko–olej. Słona woda jest gęstsza (jajko wypływa, Morze Martwe). Hel ma mniejszą gęstość niż powietrze – balon leci w górę.", "en": "Less dense goes up: olive oil above water (always), ice floats, from the bottom honey–milk–oil. Salty water is denser (egg floats, Dead Sea). Helium is less dense than air – the balloon rises.", "ru": "Менее плотное – наверх: масло над водой (всегда), лёд плавает, снизу мёд–молоко–масло. Солёная вода плотнее (яйцо всплывает, Мёртвое море). Гелий менее плотный, чем воздух – шар поднимается."}, "images": [{"img": "woda_oliwa", "caption": "Doświadczenie 4: oliwa zawsze na górze"}, {"img": "warstwy", "caption": "Od dołu: miód, mleko, olej"}]}], "flashcards": [{"front": "Co oznacza ten piktogram?", "frontImage": "GHS01", "back": "Substancja wybuchowa (GHS01) – wybuchająca bomba.", "tag": "l1"}, {"front": "Co oznacza ten piktogram?", "frontImage": "GHS02", "back": "Substancja łatwopalna (GHS02) – płomień.", "tag": "l1"}, {"front": "Co oznacza ten piktogram?", "frontImage": "GHS03", "back": "Substancja utleniająca (GHS03) – płomień nad okręgiem.", "tag": "l1"}, {"front": "Co oznacza ten piktogram?", "frontImage": "GHS04", "back": "Substancja gaz pod ciśnieniem (GHS04) – butla gazowa.", "tag": "l1"}, {"front": "Co oznacza ten piktogram?", "frontImage": "GHS05", "back": "Substancja żrąca (GHS05) – ciecz z probówek niszczy powierzchnię i dłoń.", "tag": "l1"}, {"front": "Co oznacza ten piktogram?", "frontImage": "GHS06", "back": "Substancja toksyczna (GHS06) – czaszka i skrzyżowane piszczele.", "tag": "l1"}, {"front": "Co oznacza ten piktogram?", "frontImage": "GHS07", "back": "Substancja drażniąca (GHS07) – wykrzyknik.", "tag": "l1"}, {"front": "Co oznacza ten piktogram?", "frontImage": "GHS08", "back": "Substancja rakotwórcza / mutagenna (GHS08) – sylwetka człowieka z „gwiazdą” na piersi.", "tag": "l1"}, {"front": "Co oznacza ten piktogram?", "frontImage": "GHS09", "back": "Substancja niebezpieczna dla środowiska (GHS09) – uschnięte drzewo i martwa ryba.", "tag": "l1"}, {"front": "Jak się nazywa i do czego służy?", "frontImage": "zlewka", "back": "Zlewka – przechowywanie, mieszanie i ogrzewanie cieczy, przygotowywanie roztworów (ma dzióbek do przelewania).", "tag": "l3"}, {"front": "Jak się nazywa i do czego służy?", "frontImage": "probowka", "back": "Probówka – doświadczenia z małymi ilościami substancji, także ogrzewanie (trzymana w uchwycie).", "tag": "l3"}, {"front": "Jak się nazywa i do czego służy?", "frontImage": "kolba_stozkowa", "back": "Kolba stożkowa – mieszanie cieczy przez wstrząsanie bez rozlewania, ogrzewanie; wąska szyjka ogranicza rozpryskiwanie.", "tag": "l3"}, {"front": "Jak się nazywa i do czego służy?", "frontImage": "kolba_kulista", "back": "Kolba kulista płaskodenna – równomierne ogrzewanie cieczy, otrzymywanie gazów; płaskie dno – można ją postawić na stole.", "tag": "l3"}, {"front": "Jak się nazywa i do czego służy?", "frontImage": "szkielko_zegarkowe", "back": "Szkiełko zegarkowe – odważanie małych ilości substancji stałych, przykrywanie zlewki, odparowywanie kropli cieczy.", "tag": "l3"}, {"front": "Jak się nazywa i do czego służy?", "frontImage": "pipeta_pasteura", "back": "Pipeta Pasteura z podziałką – pobieranie i odmierzanie małych ilości cieczy, dodawanie kroplami.", "tag": "l3"}, {"front": "Jak się nazywa i do czego służy?", "frontImage": "mozdzierz", "back": "Moździerz z tłuczkiem – rozcieranie (rozdrabnianie) substancji stałych na proszek.", "tag": "l3"}, {"front": "Jak się nazywa i do czego służy?", "frontImage": "krystalizator", "back": "Krystalizator – krystalizacja – odparowanie cieczy i otrzymywanie kryształów; płaskie, szerokie naczynie.", "tag": "l3"}, {"front": "Karta charakterystyki – co to?", "back": "Dokument z informacjami o substancji: zastosowanie, zagrożenia, pierwsza pomoc, środki ochrony, właściwości (np. barwa).", "tag": "l1"}, {"front": "Wodorotlenek sodu – piktogram i zagrożenie?", "back": "Żrący (GHS05): poważne oparzenia skóry i uszkodzenie oczu. Ochrona: okulary ochronne, rękawice. Biały, ciało stałe.", "backImage": "GHS05", "tag": "l1"}, {"front": "Złota szóstka – wymień 6 zasad", "back": "1) tylko z nauczycielem; 2) czyste stanowisko przed doświadczeniem; 3) zgodnie z opisem, ostrożnie; 4) bezpieczeństwo swoje i innych; 5) słuchaj poleceń; 6) przestrzegaj regulaminu.", "tag": "l2"}, {"front": "Obserwacja – definicja", "back": "To, co rejestrują zmysły (widzę, czuję, słyszę), np. siwy dym, krople bezbarwnej cieczy, ciepło.", "tag": "l4"}, {"front": "Wniosek – definicja", "back": "Obserwacje połączone z wiedzą naukową, np. „powstała woda”, „gazem jest CO₂”, „tlen podtrzymuje spalanie”.", "tag": "l4"}, {"front": "Wzór na gęstość i jego przekształcenia", "back": "d = m / V;  m = d · V;  V = m / d", "tag": "l5"}, {"front": "1 g/cm³ = ? kg/m³", "back": "1000 kg/m³ (np. 0,7 g/cm³ = 700 kg/m³).", "tag": "l5"}, {"front": "Jednostki masy", "back": "1 kg = 1000 g = 100 dag; 1 dag = 10 g; 1 g = 1000 mg.", "tag": "l5"}, {"front": "Jednostki objętości", "back": "1 m³ = 1000 dm³; 1 dm³ = 1000 cm³ (= 1 litr); 1 cm³ = 1000 mm³ (= 1 ml).", "tag": "l5"}, {"front": "Gęstość wody", "back": "ok. 1 g/cm³ = 1000 kg/m³ (w temp. 4 °C). 1 litr wody ma masę ok. 1 kg.", "tag": "l5"}, {"front": "Gęstości metali z tabeli", "back": "glin 2,7; żelazo 7,87; miedź 8,9; ołów 11,3; rtęć 13,54; złoto 19,3 (g/cm³). Osm ok. 22,6 (największa), lit ok. 0,53 (najmniejsza).", "tag": "l5"}, {"front": "5 kroków rozwiązywania zadań", "back": "1) dane i szukane, 2) wzór (przekształcenie), 3) zamiana jednostek, 4) obliczenie z jednostką, 5) odpowiedź.", "tag": "l6"}, {"front": "Doświadczenie 4: woda i oliwa – wynik?", "back": "Oliwa zawsze na górze (niezależnie od kolejności) – ma mniejszą gęstość niż woda.", "backImage": "woda_oliwa", "tag": "l7"}, {"front": "Dlaczego balon z helem się unosi?", "back": "Hel ma mniejszą gęstość niż powietrze.", "tag": "l7"}, {"front": "Jajko w wodzie z solą", "back": "W czystej wodzie tonie; po dosypaniu dużej ilości soli gęstość wody rośnie i jajko wypływa (jak ludzie w Morzu Martwym).", "tag": "l7"}], "quiz": [{"id": "q1", "type": "mc", "tag": "l1", "q": "Co oznacza ten piktogram?", "options": ["substancja drażniąca", "substancja utleniająca", "substancja łatwopalna", "substancja wybuchowa"], "answer": 2, "explain": "To GHS02: płomień. Sam płomień = łatwopalna. Gdyby płomień był **nad okręgiem**, byłaby to substancja utleniająca.", "image": "GHS02"}, {"id": "q2", "type": "mc", "tag": "l1", "q": "Co oznacza ten piktogram?", "options": ["substancja utleniająca", "substancja gaz pod ciśnieniem", "substancja łatwopalna", "substancja wybuchowa"], "answer": 0, "explain": "To GHS03: płomień nad okręgiem. Płomień **nad okręgiem** = utleniająca – podtrzymuje palenie innych substancji. Sam płomień oznaczałby łatwopalną.", "image": "GHS03"}, {"id": "q3", "type": "mc", "tag": "l1", "q": "Co oznacza ten piktogram?", "options": ["substancja drażniąca", "substancja toksyczna", "substancja rakotwórcza / mutagenna", "substancja żrąca"], "answer": 1, "explain": "To GHS06: czaszka i skrzyżowane piszczele. Czaszka i skrzyżowane piszczele = toksyczna (trująca). Wykrzyknik oznaczałby „tylko” drażniącą.", "image": "GHS06"}, {"id": "q4", "type": "mc", "tag": "l1", "q": "Co oznacza ten piktogram?", "options": ["substancja żrąca", "substancja toksyczna", "substancja drażniąca", "substancja rakotwórcza / mutagenna"], "answer": 2, "explain": "To GHS07: wykrzyknik. Wykrzyknik = drażniąca (podrażnia skórę, oczy, drogi oddechowe). Czaszka oznaczałaby toksyczną.", "image": "GHS07"}, {"id": "q5", "type": "mc", "tag": "l1", "q": "Co oznacza ten piktogram?", "options": ["substancja niebezpieczna dla środowiska", "substancja rakotwórcza / mutagenna", "substancja drażniąca", "substancja toksyczna"], "answer": 1, "explain": "To GHS08: sylwetka człowieka z „gwiazdą” na piersi. Sylwetka człowieka z „gwiazdą” na piersi = rakotwórcza / mutagenna – poważne, długotrwałe zagrożenie dla zdrowia.", "image": "GHS08"}, {"id": "q6", "type": "mc", "tag": "l1", "q": "Co oznacza ten piktogram?", "options": ["substancja rakotwórcza / mutagenna", "substancja toksyczna", "substancja niebezpieczna dla środowiska", "substancja żrąca"], "answer": 2, "explain": "To GHS09: uschnięte drzewo i martwa ryba. Uschnięte drzewo i martwa ryba = niebezpieczna dla środowiska (szkodzi zwłaszcza organizmom wodnym).", "image": "GHS09"}, {"id": "q7", "type": "mc", "tag": "l1", "q": "Który piktogram oznacza: **substancja utleniająca**?", "options": ["A", "B", "C", "D"], "optionImages": ["GHS03", "GHS04", "GHS02", "GHS01"], "answer": 0, "explain": "Prawidłowy jest piktogram z symbolem: płomień nad okręgiem. Płomień **nad okręgiem** = utleniająca – podtrzymuje palenie innych substancji. Sam płomień oznaczałby łatwopalną."}, {"id": "q8", "type": "mc", "tag": "l1", "q": "Który piktogram oznacza: **substancja żrąca**?", "options": ["A", "B", "C", "D"], "optionImages": ["GHS09", "GHS07", "GHS06", "GHS05"], "answer": 3, "explain": "Prawidłowy jest piktogram z symbolem: ciecz z probówek niszczy powierzchnię i dłoń. Ciecz z probówek niszcząca powierzchnię i dłoń = żrąca."}, {"id": "q9", "type": "mc", "tag": "l1", "q": "Który piktogram oznacza: **substancja toksyczna**?", "options": ["A", "B", "C", "D"], "optionImages": ["GHS05", "GHS08", "GHS07", "GHS06"], "answer": 3, "explain": "Prawidłowy jest piktogram z symbolem: czaszka i skrzyżowane piszczele. Czaszka i skrzyżowane piszczele = toksyczna (trująca). Wykrzyknik oznaczałby „tylko” drażniącą."}, {"id": "q10", "type": "mc", "tag": "l1", "q": "Który piktogram oznacza: **substancja wybuchowa**?", "options": ["A", "B", "C", "D"], "optionImages": ["GHS01", "GHS02", "GHS03", "GHS04"], "answer": 0, "explain": "Prawidłowy jest piktogram z symbolem: wybuchająca bomba. Wybuchająca bomba = wybuchowa."}, {"id": "q11", "type": "mc", "tag": "l1", "q": "Który piktogram oznacza **gaz pod ciśnieniem**?", "options": ["A", "B", "C", "D"], "optionImages": ["GHS04", "GHS01", "GHS03", "GHS09"], "answer": 0, "explain": "Prawidłowy jest piktogram z symbolem: butla gazowa. Butla gazowa = gaz pod ciśnieniem (np. tlen w butli, propan-butan)."}, {"id": "q12", "type": "match", "tag": "l1", "q": "Przyporządkuj piktogramom rodzaje niebezpieczeństwa (jak w zad. 1 z podręcznika).", "pairs": [["piktogram 1", "substancja żrąca"], ["piktogram 2", "substancja niebezpieczna dla środowiska"], ["piktogram 3", "substancja toksyczna"], ["piktogram 4", "substancja łatwopalna"]], "explain": "1 – ciecz niszcząca dłoń = żrąca; 2 – drzewo i ryba = niebezpieczna dla środowiska; 3 – czaszka = toksyczna; 4 – płomień = łatwopalna.", "pairImages": ["GHS05", "GHS09", "GHS06", "GHS02"]}, {"id": "q13", "type": "match", "tag": "l1", "q": "Połącz piktogram z jego znaczeniem.", "pairs": [["piktogram 1", "gaz pod ciśnieniem"], ["piktogram 2", "substancja wybuchowa"], ["piktogram 3", "substancja rakotwórcza / mutagenna"], ["piktogram 4", "substancja drażniąca"], ["piktogram 5", "substancja utleniająca"]], "explain": "Butla = gaz pod ciśnieniem; bomba = wybuchowa; sylwetka z gwiazdą = rakotwórcza; wykrzyknik = drażniąca; płomień nad okręgiem = utleniająca.", "pairImages": ["GHS04", "GHS01", "GHS08", "GHS07", "GHS03"]}, {"id": "q14", "type": "mc", "tag": "l1", "q": "Gdzie znajdziesz informację, jak chronić oczy podczas pracy z daną substancją i jaką ma ona barwę?", "options": ["w regulaminie szkoły", "na rysunku szkła laboratoryjnego", "w tabeli gęstości", "w karcie charakterystyki substancji"], "answer": 3, "explain": "Karta charakterystyki zawiera najważniejsze informacje o substancji: zastosowanie, zagrożenia, środki ochrony (np. okulary), pierwszą pomoc i właściwości (np. barwę)."}, {"id": "q15", "type": "multi", "tag": "l1", "q": "Wodorotlenek sodu (karta charakterystyki). Zaznacz **wszystkie** prawdziwe informacje.", "options": ["jest białym ciałem stałym", "jest gazem pod ciśnieniem", "oczy chroni się okularami ochronnymi", "jest niebieską cieczą", "jest substancją żrącą (piktogram GHS05)", "powoduje poważne oparzenia skóry i uszkodzenie oczu"], "answer": [0, 2, 4, 5], "explain": "NaOH: biały, stały (granulki/płatki), żrący – parzy skórę i niszczy oczy, więc pracuje się w okularach i rękawicach. Stosowany np. do produkcji mydła i w środkach do udrażniania rur.", "image": "GHS05"}, {"id": "q16", "type": "mc", "tag": "l1", "q": "Do czego stosuje się wodorotlenek sodu?", "options": ["do napełniania baloników", "jako przyprawę do potraw", "do produkcji mydła i środków do udrażniania rur", "jako paliwo do samochodów"], "answer": 2, "explain": "Wodorotlenek sodu to składnik środków do udrażniania rur i surowiec do produkcji mydła. Jest żrący – na pewno nie do jedzenia!"}, {"id": "q17", "type": "tf", "tag": "l2", "q": "Złota szóstka. Prawda czy fałsz?", "items": [{"s": "Zanim zaczniesz doświadczenie, musisz zadbać o czystość swojego miejsca pracy.", "a": true}, {"s": "Jeśli nauczyciel wyjdzie na chwilę, można dokończyć doświadczenie samemu.", "a": false}, {"s": "Dbasz o bezpieczeństwo swoje i osób, z którymi przebywasz w sali chemicznej.", "a": true}, {"s": "Polecenia nauczyciela wystarczy przeczytać pobieżnie.", "a": false}, {"s": "Trzeba przestrzegać regulaminu pracowni chemicznej.", "a": true}], "explain": "Złota szóstka: tylko z nauczycielem; czyste stanowisko; zgodnie z opisem i ostrożnie; bezpieczeństwo swoje i innych; **uważnie** słuchać poleceń i **dokładnie** je wykonywać; przestrzegać regulaminu."}, {"id": "q18", "type": "mc", "tag": "l2", "q": "Kolega chce „dla efektu” dosypać więcej substancji, niż podano w opisie doświadczenia. Którą zasadę złotej szóstki łamie?", "options": ["Zadbaj o czystość swojego miejsca pracy.", "Pamiętaj o przestrzeganiu regulaminu pracowni chemicznej.", "Każde doświadczenie wykonuj zgodnie z opisem, zachowując ostrożność.", "W pracowni możesz przebywać tylko w obecności nauczyciela."], "answer": 2, "explain": "Zmiana ilości substancji to wykonywanie doświadczenia **niezgodnie z opisem** (zasada 3). Grozi to gwałtowną reakcją i wypadkiem."}, {"id": "q19", "type": "mc", "tag": "l3", "q": "Jak nazywa się ten sprzęt laboratoryjny?", "options": ["zlewka", "probówka", "krystalizator", "kolba stożkowa"], "answer": 0, "explain": "To **zlewka** – przechowywanie, mieszanie i ogrzewanie cieczy, przygotowywanie roztworów (ma dzióbek do przelewania).", "image": "zlewka"}, {"id": "q20", "type": "mc", "tag": "l3", "q": "Jak nazywa się ten sprzęt laboratoryjny?", "options": ["zlewka", "kolba stożkowa", "pipeta Pasteura z podziałką", "kolba kulista płaskodenna"], "answer": 3, "explain": "To **kolba kulista płaskodenna** – równomierne ogrzewanie cieczy, otrzymywanie gazów; płaskie dno – można ją postawić na stole.", "image": "kolba_kulista"}, {"id": "q21", "type": "mc", "tag": "l3", "q": "Jak nazywa się ten sprzęt laboratoryjny?", "options": ["szkiełko zegarkowe", "kolba stożkowa", "probówka", "zlewka"], "answer": 0, "explain": "To **szkiełko zegarkowe** – odważanie małych ilości substancji stałych, przykrywanie zlewki, odparowywanie kropli cieczy.", "image": "szkielko_zegarkowe"}, {"id": "q22", "type": "mc", "tag": "l3", "q": "Jak nazywa się ten sprzęt laboratoryjny?", "options": ["pipeta Pasteura z podziałką", "kolba stożkowa", "probówka", "zlewka"], "answer": 0, "explain": "To **pipeta Pasteura z podziałką** – pobieranie i odmierzanie małych ilości cieczy, dodawanie kroplami.", "image": "pipeta_pasteura"}, {"id": "q23", "type": "mc", "tag": "l3", "q": "Jak nazywa się ten sprzęt laboratoryjny?", "options": ["moździerz z tłuczkiem", "szkiełko zegarkowe", "pipeta Pasteura z podziałką", "probówka"], "answer": 0, "explain": "To **moździerz z tłuczkiem** – rozcieranie (rozdrabnianie) substancji stałych na proszek.", "image": "mozdzierz"}, {"id": "q24", "type": "mc", "tag": "l3", "q": "Jak nazywa się ten sprzęt laboratoryjny?", "options": ["krystalizator", "probówka", "moździerz z tłuczkiem", "szkiełko zegarkowe"], "answer": 0, "explain": "To **krystalizator** – krystalizacja – odparowanie cieczy i otrzymywanie kryształów; płaskie, szerokie naczynie.", "image": "krystalizator"}, {"id": "q25", "type": "match", "tag": "l3", "q": "Połącz rysunek z nazwą szkła lub sprzętu (jak w zad. 2 z podręcznika).", "pairs": [["rysunek 1", "probówka"], ["rysunek 2", "kolba stożkowa"], ["rysunek 3", "zlewka"], ["rysunek 4", "krystalizator"], ["rysunek 5", "moździerz z tłuczkiem"]], "explain": "Probówka – wąska rurka; kolba stożkowa – stożek z szyjką; zlewka – walec z dzióbkiem; krystalizator – płaskie, szerokie naczynie; moździerz – miska z tłuczkiem.", "pairImages": ["probowka", "kolba_stozkowa", "zlewka", "krystalizator", "mozdzierz"]}, {"id": "q26", "type": "match", "tag": "l3", "q": "Połącz sprzęt z jego zastosowaniem.", "pairs": [["moździerz z tłuczkiem", "rozcieranie substancji stałych"], ["pipeta Pasteura", "pobieranie małych ilości cieczy, kroplami"], ["szkiełko zegarkowe", "odważanie małej ilości substancji stałej"], ["krystalizator", "otrzymywanie kryształów"], ["probówka", "doświadczenia z małymi ilościami substancji"]], "explain": "Każde naczynie ma swoje zadanie – zapamiętaj kształt razem z zastosowaniem."}, {"id": "q27", "type": "mc", "tag": "l3", "q": "Na którym rysunku jest **kolba kulista płaskodenna**?", "options": ["A", "B", "C", "D"], "optionImages": ["zlewka", "kolba_kulista", "krystalizator", "kolba_stozkowa"], "answer": 1, "explain": "Kolba kulista płaskodenna ma kulisty „brzuch”, wąską szyjkę i spłaszczone dno, dzięki któremu stoi na stole."}, {"id": "q28", "type": "mc", "tag": "l3", "q": "Na którym rysunku jest **pipeta Pasteura z podziałką**?", "options": ["A", "B", "C", "D"], "optionImages": ["szkielko_zegarkowe", "probowka", "mozdzierz", "pipeta_pasteura"], "answer": 3, "explain": "Pipeta Pasteura to cienka rurka z bańką na górze i podziałką – służy do pobierania i odmierzania małych ilości cieczy."}, {"id": "q29", "type": "mc", "tag": "l3", "q": "Które naczynie najlepiej wybrać, aby wymieszać ciecz przez wstrząsanie tak, by jej nie rozlać?", "options": ["szkiełko zegarkowe", "moździerz", "krystalizator", "kolbę stożkową"], "answer": 3, "explain": "Kolba stożkowa ma szerokie dno i wąską szyjkę – ciecz można energicznie mieszać ruchem okrężnym bez wylewania."}, {"id": "q30", "type": "cat", "tag": "l4", "q": "Zad. 4 z podręcznika: przyporządkuj zdania do obserwacji lub wniosków.", "categories": ["obserwacja", "wniosek"], "items": [{"t": "Po ogrzaniu pojawia się siwy dym.", "c": 0}, {"t": "Otrzymanym gazem jest dwutlenek węgla.", "c": 1}, {"t": "Na ściankach probówki pojawiają się krople bezbarwnej cieczy.", "c": 0}, {"t": "Na ściankach probówki pojawia się woda.", "c": 1}, {"t": "Zawartość szalki robi się ciepła.", "c": 0}, {"t": "Doświadczenie się powiodło.", "c": 1}, {"t": "W zlewce pojawiły się dwie warstwy płynów.", "c": 0}, {"t": "Tlen podtrzymuje spalanie.", "c": 1}], "explain": "Obserwacje to to, co rejestrują zmysły: dym, krople, ciepło, dwie warstwy. Wnioski wymagają wiedzy lub oceny: nazwa gazu (CO₂), nazwa cieczy (woda), „doświadczenie się powiodło”, właściwość tlenu."}, {"id": "q31", "type": "cat", "tag": "l4", "q": "Doświadczenie 4 (woda i oliwa). Obserwacja czy wniosek?", "categories": ["obserwacja", "wniosek"], "items": [{"t": "Ciecze rozdzieliły się na dwie warstwy.", "c": 0}, {"t": "W obu probówkach oliwa jest na powierzchni.", "c": 0}, {"t": "Oliwa ma mniejszą gęstość niż woda.", "c": 1}, {"t": "Kolejność dodawania cieczy nie ma wpływu na wynik.", "c": 1}, {"t": "Ciecz o mniejszej gęstości wypływa na powierzchnię.", "c": 1}], "explain": "Widać dwie warstwy i oliwę na górze – to obserwacje. Porównanie gęstości i uogólnienia (kolejność nie ma znaczenia, ciecz o mniejszej gęstości wypływa) to wnioski."}, {"id": "q32", "type": "mc", "tag": "l4", "q": "Czym jest wniosek?", "options": ["rysunkiem doświadczenia", "listą użytego sprzętu", "obserwacjami połączonymi z wiedzą naukową", "opisem tego, co widać i czuć"], "answer": 2, "explain": "Wniosek łączy obserwacje z wiedzą naukową – wyjaśnia, co się stało. Opis tego, co rejestrują zmysły, to obserwacja."}, {"id": "q33", "type": "short", "tag": "l5", "q": "Zamień jednostki: **2,5 kg = ? g** (wpisz liczbę).", "accept": ["2500 g", "2500"], "num": 2500, "explain": "1 kg = 1000 g, więc 2,5 · 1000 = **2500 g**.", "tol": 2.5}, {"id": "q34", "type": "short", "tag": "l5", "q": "Zamień jednostki: **3 dm³ = ? cm³** (wpisz liczbę).", "accept": ["3000 cm³", "3000"], "num": 3000, "explain": "1 dm³ = 1000 cm³, więc 3 · 1000 = **3000 cm³**.", "tol": 3.0}, {"id": "q35", "type": "short", "tag": "l5", "q": "Zamień jednostki: **750 mg = ? g** (wpisz liczbę).", "accept": ["0,75 g", "0,75"], "num": 0.75, "explain": "1 g = 1000 mg, więc 750 : 1000 = **0,75 g**.", "tol": 0.00075}, {"id": "q36", "type": "short", "tag": "l5", "q": "Zamień jednostki: **4 dag = ? g** (wpisz liczbę).", "accept": ["40 g", "40"], "num": 40, "explain": "1 dag = 10 g (bo 1 kg = 100 dag = 1000 g), więc 4 · 10 = **40 g**.", "tol": 0.04}, {"id": "q37", "type": "short", "tag": "l5", "q": "Zamień jednostki: **0,5 m³ = ? dm³** (wpisz liczbę).", "accept": ["500 dm³", "500"], "num": 500, "explain": "1 m³ = 1000 dm³, więc 0,5 · 1000 = **500 dm³**.", "tol": 0.5}, {"id": "q38", "type": "short", "tag": "l5", "q": "Zamień jednostki: **2000 mm³ = ? cm³** (wpisz liczbę).", "accept": ["2 cm³", "2"], "num": 2, "explain": "1 cm³ = 1000 mm³, więc 2000 : 1000 = **2 cm³**.", "tol": 0.002}, {"id": "q39", "type": "short", "tag": "l5", "q": "Zamień jednostki: **2,7 g/cm³ = ? kg/m³** (wpisz liczbę).", "accept": ["2700 kg/m³", "2700"], "num": 2700, "explain": "1 g/cm³ = 1000 kg/m³, więc 2,7 · 1000 = **2700 kg/m³**.", "tol": 2.7}, {"id": "q40", "type": "short", "tag": "l5", "q": "Zamień jednostki: **13 540 kg/m³ = ? g/cm³** (wpisz liczbę).", "accept": ["13,54 g/cm³", "13,54"], "num": 13.54, "explain": "Dzielimy przez 1000: 13 540 : 1000 = **13,54 g/cm³** (rtęć).", "tol": 0.01354}, {"id": "q41", "type": "match", "tag": "l5", "q": "Połącz substancję z jej gęstością (tabela).", "pairs": [["woda", "1 g/cm³"], ["glin", "2,7 g/cm³"], ["żelazo", "7,87 g/cm³"], ["ołów", "11,3 g/cm³"], ["rtęć", "13,54 g/cm³"], ["złoto", "19,3 g/cm³"]], "explain": "Zapamiętaj kolejność: woda 1 < glin 2,7 < żelazo 7,87 < miedź 8,9 < ołów 11,3 < rtęć 13,54 < złoto 19,3 (g/cm³)."}, {"id": "q42", "type": "order", "tag": "l5", "q": "Ułóż substancje od **najmniejszej** do **największej** gęstości.", "items": ["lód", "woda", "glin", "żelazo", "miedź", "rtęć", "złoto"], "explain": "lód 0,92 < woda 1 < glin 2,7 < żelazo 7,87 < miedź 8,9 < rtęć 13,54 < złoto 19,3 (g/cm³)."}, {"id": "q43", "type": "mc", "tag": "l5", "q": "Która jednostka jest jednostką gęstości?", "options": ["g/cm³", "cm³", "g · cm³", "kg"], "answer": 0, "explain": "Gęstość = masa : objętość, więc jej jednostka to jednostka masy podzielona przez jednostkę objętości: **g/cm³** lub kg/m³."}, {"id": "q44", "type": "mc", "tag": "l5", "q": "Przekształć wzór d = m / V, aby obliczyć objętość.", "options": ["V = d / m", "V = m − d", "V = m / d", "V = d · m"], "answer": 2, "explain": "Mnożymy obie strony przez V: d · V = m, potem dzielimy przez d: **V = m / d**."}, {"id": "q45", "type": "short", "tag": "l6", "q": "Przykład 1. Sztabka metalu ma masę 2000 g i objętość 103,7 cm³. Oblicz jej gęstość (g/cm³). Wpisz wynik (przecinek lub kropka).", "accept": ["19,3 g/cm³", "19,3"], "num": 19.3, "explain": "1) Dane: m = 2000 g, V = 103,7 cm³; szukane: d. 2) d = m / V. 3) Jednostki pasują. 4) d = 2000 g : 103,7 cm³ ≈ **19,3 g/cm³**. 5) Taką gęstość ma złoto.", "tol": 0.1}, {"id": "q46", "type": "short", "tag": "l6", "q": "Przykład 2. W termometrze jest 0,03 cm³ rtęci (d = 13,54 g/cm³). Oblicz masę rtęci (g). Wpisz wynik (przecinek lub kropka).", "accept": ["0,41 g", "0,41"], "num": 0.41, "explain": "1) Dane: V = 0,03 cm³, d = 13,54 g/cm³; szukane: m. 2) m = d · V. 3) Jednostki pasują. 4) m = 13,54 · 0,03 = 0,4062 ≈ **0,41 g**. 5) W termometrze jest ok. 0,41 g rtęci.", "tol": 0.01}, {"id": "q47", "type": "short", "tag": "l6", "q": "Przykład 3. Gwoździe z miedzi (d = 8,9 g/cm³) mają masę 0,5 kg. Oblicz ich objętość (cm³). Wpisz wynik (przecinek lub kropka).", "accept": ["56,2 cm³", "56,2"], "num": 56.2, "explain": "1) Dane: m = 0,5 kg, d = 8,9 g/cm³; szukane: V. 2) V = m / d. 3) 0,5 kg = 500 g. 4) V = 500 g : 8,9 g/cm³ ≈ **56,2 cm³**. 5) Gwoździe zajmują ok. 56,2 cm³.", "tol": 0.15}, {"id": "q48", "type": "short", "tag": "l6", "q": "Klocek drewna ma masę 600 g i objętość 1000 cm³. Oblicz gęstość drewna (g/cm³). Wpisz wynik (przecinek lub kropka).", "accept": ["0,6 g/cm³", "0,6"], "num": 0.6, "explain": "1) m = 600 g, V = 1000 cm³; szukane d. 2) d = m / V. 3) Jednostki pasują. 4) d = 600 : 1000 = **0,6 g/cm³**. 5) Gęstość drewna to 0,6 g/cm³ – mniej niż woda, więc drewno pływa.", "tol": 0.01}, {"id": "q49", "type": "short", "tag": "l6", "q": "Kostka lodu ma objętość 20 cm³ (d = 0,92 g/cm³). Oblicz jej masę (g). Wpisz wynik (przecinek lub kropka).", "accept": ["18,4 g", "18,4"], "num": 18.4, "explain": "1) V = 20 cm³, d = 0,92 g/cm³; szukane m. 2) m = d · V. 3) Jednostki pasują. 4) m = 0,92 · 20 = **18,4 g**. 5) Kostka lodu ma masę 18,4 g.", "tol": 0.05}, {"id": "q50", "type": "short", "tag": "l6", "q": "Żelazny gwóźdź ma masę 15,74 g (d = 7,87 g/cm³). Oblicz jego objętość (cm³). Wpisz wynik (przecinek lub kropka).", "accept": ["2 cm³", "2"], "num": 2, "explain": "1) m = 15,74 g, d = 7,87 g/cm³; szukane V. 2) V = m / d. 3) Jednostki pasują. 4) V = 15,74 : 7,87 = **2 cm³**. 5) Gwóźdź ma objętość 2 cm³.", "tol": 0.02}, {"id": "q51", "type": "short", "tag": "l6", "q": "Ołowiany ciężarek wędkarski ma objętość 5 cm³ (d = 11,3 g/cm³). Oblicz jego masę (g). Wpisz wynik (przecinek lub kropka).", "accept": ["56,5 g", "56,5"], "num": 56.5, "explain": "1) V = 5 cm³, d = 11,3 g/cm³; szukane m. 2) m = d · V. 3) Jednostki pasują. 4) m = 11,3 · 5 = **56,5 g**. 5) Ciężarek ma masę 56,5 g.", "tol": 0.1}, {"id": "q52", "type": "short", "tag": "l6", "q": "Złota obrączka ma masę 5,79 g (d = 19,3 g/cm³). Oblicz jej objętość (cm³). Wpisz wynik (przecinek lub kropka).", "accept": ["0,3 cm³", "0,3"], "num": 0.3, "explain": "1) m = 5,79 g, d = 19,3 g/cm³; szukane V. 2) V = m / d. 3) Jednostki pasują. 4) V = 5,79 : 19,3 = **0,3 cm³**. 5) Obrączka ma objętość 0,3 cm³.", "tol": 0.005}, {"id": "q53", "type": "short", "tag": "l6", "q": "Butelka zawiera 1,5 dm³ wody (d = 1 g/cm³). Oblicz masę wody w **kilogramach**. Wpisz wynik (przecinek lub kropka).", "accept": ["1,5 kg", "1,5"], "num": 1.5, "explain": "1) V = 1,5 dm³, d = 1 g/cm³; szukane m. 2) m = d · V. 3) 1,5 dm³ = 1500 cm³. 4) m = 1 · 1500 = 1500 g = **1,5 kg**. 5) Woda ma masę 1,5 kg.", "tol": 0.01}, {"id": "q54", "type": "short", "tag": "l6", "q": "Próbka metalu ma masę 0,445 kg i objętość 50 cm³. Oblicz gęstość (g/cm³). Wpisz wynik (przecinek lub kropka).", "accept": ["8,9 g/cm³", "8,9"], "num": 8.9, "explain": "1) m = 0,445 kg, V = 50 cm³; szukane d. 2) d = m / V. 3) 0,445 kg = 445 g. 4) d = 445 : 50 = **8,9 g/cm³**. 5) Z tabeli – to miedź.", "tol": 0.05}, {"id": "q55", "type": "short", "tag": "l6", "q": "Ile gramów ma 1 dm³ mleka o gęstości 1,03 g/cm³? Wpisz wynik (przecinek lub kropka).", "accept": ["1030 g", "1030"], "num": 1030, "explain": "1) V = 1 dm³, d = 1,03 g/cm³; szukane m. 2) m = d · V. 3) 1 dm³ = 1000 cm³. 4) m = 1,03 · 1000 = **1030 g**. 5) Litr mleka ma masę 1030 g (trochę więcej niż litr wody).", "tol": 2}, {"id": "q56", "type": "short", "tag": "l6", "q": "Akwarium zawiera 0,05 m³ wody (d = 1000 kg/m³). Oblicz masę wody (kg). Wpisz wynik (przecinek lub kropka).", "accept": ["50 kg", "50"], "num": 50, "explain": "1) V = 0,05 m³, d = 1000 kg/m³; szukane m. 2) m = d · V. 3) Jednostki pasują (kg/m³ i m³). 4) m = 1000 · 0,05 = **50 kg**. 5) Woda w akwarium ma masę 50 kg.", "tol": 0.5}, {"id": "q57", "type": "short", "tag": "l6", "q": "Jaką objętość zajmuje 1 kg rtęci (d = 13,54 g/cm³)? Wynik zaokrąglij do 0,1 cm³. Wpisz wynik (przecinek lub kropka).", "accept": ["73,9 cm³", "73,9"], "num": 73.9, "explain": "1) m = 1 kg, d = 13,54 g/cm³; szukane V. 2) V = m / d. 3) 1 kg = 1000 g. 4) V = 1000 : 13,54 ≈ **73,9 cm³**. 5) Kilogram rtęci zmieści się w naczyniu o pojemności ok. 74 ml!", "tol": 0.15}, {"id": "q58", "type": "short", "tag": "l6", "q": "Klocek glinu (d = 2,7 g/cm³) ma masę 270 g. Oblicz jego objętość (cm³). Wpisz wynik (przecinek lub kropka).", "accept": ["100 cm³", "100"], "num": 100, "explain": "1) m = 270 g, d = 2,7 g/cm³; szukane V. 2) V = m / d. 3) Jednostki pasują. 4) V = 270 : 2,7 = **100 cm³**. 5) Klocek ma objętość 100 cm³.", "tol": 0.5}, {"id": "q59", "type": "order", "tag": "l6", "q": "Ułóż kroki rozwiązywania zadania we właściwej kolejności.", "items": ["dane i szukane", "wzór i ewentualne przekształcenie", "zamiana jednostek", "obliczenie z jednostką", "odpowiedź"], "explain": "Metoda z podręcznika: najpierw zapisz dane i szukane, potem wzór, zamień jednostki, oblicz (z jednostką!) i napisz odpowiedź."}, {"id": "q60", "type": "mc", "tag": "l6", "q": "Gęstość wynosi 8,9 g/cm³, masa 0,5 kg. Co trzeba zrobić **przed** dzieleniem?", "options": ["zamienić 8,9 g/cm³ na 8,9 kg/m³", "zamienić 0,5 kg na 500 g", "pomnożyć masę przez gęstość", "nic, można od razu podzielić 0,5 : 8,9"], "answer": 1, "explain": "Jednostki muszą pasować: gęstość jest w g/cm³, więc masę zamieniamy na gramy: 0,5 kg = 500 g. Dopiero wtedy V = 500 : 8,9 ≈ 56,2 cm³."}, {"id": "q61", "type": "mc", "tag": "l7", "q": "Na rysunku są probówki z Doświadczenia 4. Jaki wniosek z niego wynika?", "options": ["Oliwa ma większą gęstość niż woda.", "Oliwa ma mniejszą gęstość niż woda, a kolejność wlewania nie ma znaczenia.", "Woda i oliwa dobrze się mieszają.", "Ciecz wlana później zawsze jest na górze."], "answer": 1, "explain": "W obu probówkach oliwa jest na powierzchni, choć wlewano ją w różnej kolejności. Wniosek: oliwa (ok. 0,92 g/cm³) ma mniejszą gęstość niż woda (1 g/cm³).", "image": "woda_oliwa"}, {"id": "q62", "type": "order", "tag": "l7", "q": "Do szklanki wlano miód, olej i mleko. Ułóż warstwy **od dołu do góry**.", "items": ["miód", "mleko", "olej"], "explain": "Na dole najgęstsza ciecz: miód (ok. 1,4 g/cm³), potem mleko (ok. 1,03), na górze olej (ok. 0,92 g/cm³)."}, {"id": "q63", "type": "tf", "tag": "l7", "q": "Gęstość w przyrodzie. Prawda czy fałsz?", "items": [{"s": "Balon z helem unosi się, bo hel ma mniejszą gęstość niż powietrze.", "a": true}, {"s": "Lód tonie w wodzie, bo jest ciałem stałym.", "a": false}, {"s": "Woda w Morzu Martwym ma dużą gęstość, bo jest bardzo zasolona.", "a": true}, {"s": "Jajko, które tonie w czystej wodzie, może wypłynąć w bardzo słonej wodzie.", "a": true}, {"s": "Gęstość dużego kawałka żelaza jest większa niż małego.", "a": false}], "explain": "Hel < powietrze; lód (0,92) < woda (1), więc lód pływa; sól zwiększa gęstość wody (Morze Martwe, jajko); gęstość to cecha substancji – nie zależy od wielkości próbki."}, {"id": "q64", "type": "mc", "tag": "l7", "q": "Dlaczego w Bałtyku trudniej unosić się na wodzie niż w Morzu Martwym?", "options": ["Woda Bałtyku ma większą gęstość.", "Bałtyk jest zimniejszy, więc woda jest rzadsza.", "Bałtyk jest mało zasolony, więc jego woda ma mniejszą gęstość.", "W Bałtyku jest więcej fal."], "answer": 2, "explain": "Gęstość wody rośnie wraz z zasoleniem. Morze Martwe jest bardzo słone (duża gęstość, łatwo się unosić), Bałtyk – mało słony."}], "explainPrompts": [{"id": "e1", "tag": "l1", "prompt": "Opisz, jak odróżnić piktogram substancji łatwopalnej od utleniającej oraz toksycznej od drażniącej.", "keyPoints": ["łatwopalna – sam płomień", "utleniająca – płomień nad okręgiem, podtrzymuje palenie", "toksyczna – czaszka i piszczele", "drażniąca – wykrzyknik"], "model": "Substancja łatwopalna ma na piktogramie sam płomień, a utleniająca – płomień nad okręgiem; utleniająca podtrzymuje palenie innych substancji. Substancja toksyczna ma czaszkę ze skrzyżowanymi piszczelami (trucizna), a drażniąca – wykrzyknik (podrażnia skórę i oczy)."}, {"id": "e2", "tag": "l2", "prompt": "Wymień zasady złotej szóstki.", "keyPoints": ["tylko w obecności nauczyciela", "czyste miejsce pracy", "zgodnie z opisem, ostrożnie", "bezpieczeństwo swoje i innych", "słuchaj poleceń nauczyciela", "przestrzegaj regulaminu pracowni"], "model": "1) W pracowni przebywam tylko z nauczycielem. 2) Przed doświadczeniem dbam o czystość miejsca pracy. 3) Każde doświadczenie wykonuję zgodnie z opisem, ostrożnie. 4) Dbam o bezpieczeństwo swoje i innych. 5) Uważnie słucham poleceń nauczyciela i dokładnie je wykonuję. 6) Przestrzegam regulaminu pracowni chemicznej."}, {"id": "e3", "tag": "l4", "prompt": "Wyjaśnij różnicę między obserwacją a wnioskiem. Podaj po jednym przykładzie.", "keyPoints": ["obserwacja – to, co rejestrują zmysły", "wniosek – obserwacje + wiedza naukowa", "przykład obserwacji (np. krople bezbarwnej cieczy)", "przykład wniosku (np. powstała woda)"], "model": "Obserwacja opisuje to, co rejestrują nasze zmysły, np. „na ściankach probówki pojawiają się krople bezbarwnej cieczy”. Wniosek łączy obserwacje z wiedzą naukową i wyjaśnia, co się stało, np. „na ściankach probówki pojawia się woda”."}, {"id": "e4", "tag": "l6", "prompt": "Rozwiąż metodą 5 kroków: oblicz objętość 1000 g benzyny o gęstości 700 kg/m³.", "keyPoints": ["dane: m = 1000 g, d = 700 kg/m³; szukane V", "wzór V = m / d", "zamiana: 700 kg/m³ = 0,7 g/cm³", "V = 1000 : 0,7 ≈ 1428,6 cm³", "odpowiedź zdaniem"], "model": "Dane: m = 1000 g, d = 700 kg/m³. Szukane: V. Wzór: V = m / d. Zamiana jednostek: 700 kg/m³ = 0,7 g/cm³. Obliczenie: V = 1000 g : 0,7 g/cm³ ≈ 1428,6 cm³. Odpowiedź: 1000 g benzyny zajmuje ok. 1428,6 cm³ (ok. 1,43 dm³)."}, {"id": "e5", "tag": "l7", "prompt": "Opisz Doświadczenie 4 (woda i oliwa): wykonanie, obserwacje i wnioski.", "keyPoints": ["woda i oliwa w probówce, korek, wstrząsanie; druga probówka w odwrotnej kolejności", "obserwacja: ciecze się rozdzielają, oliwa na powierzchni w obu probówkach", "wniosek: oliwa ma mniejszą gęstość niż woda", "kolejność dodawania nie ma znaczenia"], "model": "Do probówki wlewamy wodę do 1/4 objętości, potem tyle samo oliwy, zamykamy korkiem i wstrząsamy; w drugiej probówce wlewamy ciecze w odwrotnej kolejności. Obserwacje: ciecze rozdzielają się, w obu probówkach oliwa jest na powierzchni. Wnioski: gęstość oliwy jest mniejsza od gęstości wody, ciecz o mniejszej gęstości wypływa na powierzchnię, a kolejność dodawania nie ma znaczenia."}], "mockTest": {"id": "sprawdz-sie-str11", "title": "Czy już umiesz? Sprawdź się – bezpieczeństwo, szkło, obserwacje (str. 11)", "minutes": 25, "gradeScale": [[0, "niedostateczny"], [31, "dopuszczający"], [51, "dostateczny"], [71, "dobry"], [88, "bardzo dobry"], [97, "celujący"]], "intro": "Zadania 1–4 to **interaktywna wersja „Sprawdź się” ze str. 11** podręcznika, dalej kilka zadań w tym samym stylu. Pracuj bez podręcznika. Po oddaniu przy każdym zadaniu zobaczysz wyjaśnienie. Drugi test – **gęstość (str. 25)** – wybierzesz przyciskiem na górze zakładki.", "tasks": [{"id": "p1", "type": "match", "tag": "l1", "q": "**Zad. 1.** Przyporządkuj podanym piktogramom odpowiednie rodzaje niebezpieczeństwa.", "pairs": [["a)", "substancja żrąca"], ["b)", "substancja niebezpieczna dla środowiska"], ["c)", "substancja toksyczna"], ["d)", "substancja łatwopalna"]], "explain": "a) GHS05 – ciecz niszczy dłoń = żrąca; b) GHS09 – drzewo i ryba = niebezpieczna dla środowiska; c) GHS06 – czaszka = toksyczna; d) GHS02 – płomień = łatwopalna. (Pozostałe nazwy z podręcznika – drażniąca, utleniająca, gaz pod ciśnieniem, rakotwórcza – nie pasują do tych obrazków.)", "pairImages": ["GHS05", "GHS09", "GHS06", "GHS02"]}, {"id": "p2", "type": "mc", "tag": "l1", "q": "**Zad. 1 – dodatkowe.** Który piktogram oznacza **substancję utleniającą**?", "options": ["A", "B", "C", "D"], "optionImages": ["GHS01", "GHS07", "GHS03", "GHS02"], "answer": 2, "explain": "Utleniająca (GHS03) to płomień **nad okręgiem**. Sam płomień = łatwopalna, bomba = wybuchowa, wykrzyknik = drażniąca."}, {"id": "p3", "type": "mc", "tag": "l1", "q": "**Zad. 1 – dodatkowe.** Co oznacza ten piktogram?", "options": ["substancja rakotwórcza / mutagenna", "substancja drażniąca", "substancja toksyczna", "substancja utleniająca"], "answer": 1, "explain": "Wykrzyknik (GHS07) = substancja drażniąca. Toksyczna to czaszka, rakotwórcza – sylwetka człowieka z gwiazdą.", "image": "GHS07"}, {"id": "p4", "type": "match", "tag": "l3", "q": "**Zad. 2.** Przyporządkuj rysunkom nazwy szkła i sprzętu laboratoryjnego.", "pairs": [["a)", "zlewka"], ["b)", "probówka"], ["c)", "kolba stożkowa"], ["d)", "kolba kulista płaskodenna"], ["e)", "szkiełko zegarkowe"], ["f)", "pipeta Pasteura z podziałką"], ["g)", "moździerz z tłuczkiem"], ["h)", "krystalizator"]], "explain": "a) zlewka, b) probówka, c) kolba stożkowa, d) kolba kulista płaskodenna, e) szkiełko zegarkowe, f) pipeta Pasteura z podziałką, g) moździerz z tłuczkiem, h) krystalizator.", "pairImages": ["zlewka", "probowka", "kolba_stozkowa", "kolba_kulista", "szkielko_zegarkowe", "pipeta_pasteura", "mozdzierz", "krystalizator"]}, {"id": "p5", "type": "mc", "tag": "l1", "q": "**Zad. 3a.** Na podstawie karty charakterystyki wodorotlenku sodu: do czego się go stosuje?", "options": ["do gaszenia pożarów", "do produkcji mydła i środków do udrażniania rur", "do napełniania balonów", "do słodzenia napojów"], "answer": 1, "explain": "Wodorotlenek sodu jest surowcem do produkcji mydła i składnikiem środków do udrażniania rur."}, {"id": "p6", "type": "mc", "tag": "l1", "q": "**Zad. 3b.** Jakie zagrożenie dla zdrowia stwarza wodorotlenek sodu?", "options": ["jest gazem pod ciśnieniem", "nie stwarza żadnego zagrożenia", "jest wybuchowy", "powoduje poważne oparzenia skóry i uszkodzenie oczu"], "answer": 3, "explain": "NaOH jest substancją **żrącą** (piktogram GHS05) – niszczy skórę i oczy.", "image": "GHS05"}, {"id": "p7", "type": "mc", "tag": "l1", "q": "**Zad. 3c.** Jak należy chronić oczy podczas pracy z wodorotlenkiem sodu?", "options": ["nie trzeba ich chronić", "założyć okulary przeciwsłoneczne", "mrużyć oczy", "nosić okulary ochronne (lub osłonę twarzy)"], "answer": 3, "explain": "Przy substancjach żrących obowiązują **okulary ochronne** (gogle lub osłona twarzy) i rękawice."}, {"id": "p8", "type": "mc", "tag": "l1", "q": "**Zad. 3d.** Jaką barwę ma wodorotlenek sodu?", "options": ["czerwona", "niebieska", "czarna", "biała"], "answer": 3, "explain": "Wodorotlenek sodu to **białe** ciało stałe (granulki, płatki lub proszek)."}, {"id": "p9", "type": "cat", "tag": "l4", "q": "**Zad. 4.** Przyporządkuj podane zdania do obserwacji lub wniosków.", "categories": ["obserwacja", "wniosek"], "items": [{"t": "Po ogrzaniu pojawia się siwy dym.", "c": 0}, {"t": "Otrzymanym gazem jest dwutlenek węgla.", "c": 1}, {"t": "Na ściankach probówki pojawiają się krople bezbarwnej cieczy.", "c": 0}, {"t": "Na ściankach probówki pojawia się woda.", "c": 1}, {"t": "Zawartość szalki robi się ciepła.", "c": 0}, {"t": "Doświadczenie się powiodło.", "c": 1}, {"t": "W zlewce pojawiły się dwie warstwy płynów.", "c": 0}, {"t": "Tlen podtrzymuje spalanie.", "c": 1}], "explain": "Obserwacje to to, co rejestrują zmysły: dym, krople, ciepło, dwie warstwy. Wnioski wymagają wiedzy lub oceny: nazwa gazu (CO₂), nazwa cieczy (woda), „doświadczenie się powiodło”, właściwość tlenu."}, {"id": "p10", "type": "tf", "tag": "l2", "q": "**Zad. 5.** Zasady pracy w pracowni. Prawda czy fałsz?", "items": [{"s": "W pracowni możesz przebywać tylko w obecności nauczyciela.", "a": true}, {"s": "Odczynnik bez etykiety można użyć, jeśli wygląda jak woda.", "a": false}, {"s": "Każde doświadczenie wykonuje się zgodnie z opisem, zachowując ostrożność.", "a": true}, {
