"s": "Informacje o zagrożeniach substancji znajdziemy w karcie charakterystyki.", "a": true}], "explain": "Złota szóstka i „W skrócie”: tylko z nauczycielem; odczynnik musi mieć **czytelną etykietę** (nieznanej substancji nigdy nie używamy!); doświadczenie zgodnie z opisem; informacje – w karcie charakterystyki."}, {"id": "p11", "type": "mc", "tag": "l3", "q": "**Zad. 6.** Do czego służy przedstawiony sprzęt?", "options": ["do rozcierania substancji stałych", "do odmierzania małych ilości cieczy", "do otrzymywania kryształów", "do ogrzewania cieczy"], "answer": 0, "explain": "To moździerz z tłuczkiem – służy do rozdrabniania i rozcierania substancji stałych na proszek.", "image": "mozdzierz"}, {"id": "p12", "type": "open", "tag": "l4", "q": "**Zad. 7.** Wyjaśnij, czym różni się obserwacja od wniosku. Podaj po jednym przykładzie.", "keyPoints": ["obserwacja – to, co rejestrują zmysły", "wniosek – obserwacje połączone z wiedzą naukową", "poprawny przykład obserwacji", "poprawny przykład wniosku"], "model": "Obserwacja opisuje to, co rejestrują zmysły, np. „po ogrzaniu pojawia się siwy dym”. Wniosek łączy obserwacje z wiedzą naukową, np. „otrzymanym gazem jest dwutlenek węgla”.", "points": 4, "explain": "Najważniejsze: obserwacja = zmysły (widzę, czuję), wniosek = wyjaśnienie z użyciem wiedzy."}]}, "mocks": [{"id": "sprawdz-sie-str25", "title": "Czy już umiesz? Sprawdź się – gęstość substancji (str. 25)", "minutes": 30, "gradeScale": [[0, "niedostateczny"], [31, "dopuszczający"], [51, "dostateczny"], [71, "dobry"], [88, "bardzo dobry"], [97, "celujący"]], "intro": "Zadania 1–4 to **interaktywna wersja „Sprawdź się” ze str. 25**, dalej zadania w tym samym stylu. Licz na kartce metodą 5 kroków, w okienko wpisz sam wynik (przecinek lub kropka). Tabela gęstości: woda 1 · lód 0,92 · oliwa ok. 0,92 · glin 2,7 · żelazo 7,87 · miedź 8,9 · ołów 11,3 · rtęć 13,54 · złoto 19,3 (g/cm³).", "tasks": [{"id": "m1", "type": "short", "tag": "l6", "q": "**Zad. 1.** Oblicz masę 200 cm³ oleju słonecznikowego, którego gęstość wynosi 0,92 g/cm³. Wynik w gramach.", "accept": ["184 g", "184"], "num": 184, "explain": "Dane: V = 200 cm³, d = 0,92 g/cm³. Wzór: m = d · V. m = 0,92 g/cm³ · 200 cm³ = **184 g**. Odp.: Olej ma masę 184 g.", "tol": 0.5, "points": 2}, {"id": "m2", "type": "short", "tag": "l6", "q": "**Zad. 2a.** Kostka metalu o masie 108 g ma objętość 40 cm³. Oblicz gęstość metalu (g/cm³).", "accept": ["2,7 g/cm³", "2,7"], "num": 2.7, "explain": "Dane: m = 108 g, V = 40 cm³. Wzór: d = m / V. d = 108 g : 40 cm³ = **2,7 g/cm³**.", "tol": 0.02, "points": 2}, {"id": "m3", "type": "mc", "tag": "l5", "q": "**Zad. 2b.** Z jakiego metalu jest ta kostka (d = 2,7 g/cm³)? Skorzystaj z tabeli.", "options": ["miedź", "glin", "żelazo", "ołów"], "answer": 1, "explain": "Z tabeli: 2,7 g/cm³ to gęstość **glinu** (aluminium). Żelazo 7,87, miedź 8,9, ołów 11,3."}, {"id": "m4", "type": "short", "tag": "l5", "q": "**Zad. 3a.** Gęstość benzyny wynosi 700 kg/m³. Zamień ją na g/cm³.", "accept": ["0,7 g/cm³", "0,7"], "num": 0.7, "explain": "1 g/cm³ = 1000 kg/m³, więc 700 kg/m³ : 1000 = **0,7 g/cm³**.", "tol": 0.001}, {"id": "m5", "type": "short", "tag": "l6", "q": "**Zad. 3b.** Oblicz objętość 1000 g benzyny (d = 700 kg/m³). Wynik w cm³ z dokładnością do 0,1.", "accept": ["1428,6 cm³", "1428,6"], "num": 1428.6, "explain": "Dane: m = 1000 g, d = 700 kg/m³ = 0,7 g/cm³. Wzór: V = m / d. V = 1000 g : 0,7 g/cm³ ≈ **1428,6 cm³** (≈ 1,43 dm³). Odp.: Benzyna zajmuje ok. 1428,6 cm³.", "tol": 0.6, "points": 2}, {"id": "m6", "type": "mc", "tag": "l5", "q": "**Zad. 4a.** Który metal ma **największą** gęstość?", "options": ["rtęć (13,54 g/cm³)", "osm (ok. 22,6 g/cm³)", "złoto (19,3 g/cm³)", "ołów (11,3 g/cm³)"], "answer": 1, "explain": "Największą gęstość ze wszystkich metali ma **osm** – ok. 22,6 g/cm³. Złoto (19,3) jest dopiero dalej."}, {"id": "m7", "type": "mc", "tag": "l5", "q": "**Zad. 4b.** Który metal ma **najmniejszą** gęstość?", "options": ["miedź (8,9 g/cm³)", "lit (ok. 0,53 g/cm³)", "żelazo (7,87 g/cm³)", "glin (2,7 g/cm³)"], "answer": 1, "explain": "Najmniejszą gęstość z metali ma **lit** – ok. 0,53 g/cm³, mniej niż woda, więc pływałby po jej powierzchni."}, {"id": "m8", "type": "short", "tag": "l6", "q": "**Zad. 5.** Oblicz masę 0,5 dm³ rtęci (d = 13,54 g/cm³). Wynik w gramach.", "accept": ["6770 g", "6770"], "num": 6770, "explain": "Dane: V = 0,5 dm³ = 500 cm³, d = 13,54 g/cm³. Wzór: m = d · V. m = 13,54 · 500 = **6770 g** (6,77 kg). Pół litra rtęci ma masę prawie 7 kg!", "tol": 5, "points": 2}, {"id": "m9", "type": "short", "tag": "l6", "q": "**Zad. 6.** Ołowiana kulka ma masę 113 g (d = 11,3 g/cm³). Oblicz jej objętość w cm³.", "accept": ["10 cm³", "10"], "num": 10, "explain": "Dane: m = 113 g, d = 11,3 g/cm³. Wzór: V = m / d. V = 113 : 11,3 = **10 cm³**.", "tol": 0.05, "points": 2}, {"id": "m10", "type": "short", "tag": "l5", "q": "**Zad. 7.** Zamień: 1,2 kg = ? dag", "accept": ["120 dag", "120"], "num": 120, "explain": "1 kg = 100 dag, więc 1,2 · 100 = **120 dag**.", "tol": 0.1}, {"id": "m11", "type": "short", "tag": "l5", "q": "**Zad. 8.** Zamień: 2,5 dm³ = ? cm³", "accept": ["2500 cm³", "2500"], "num": 2500, "explain": "1 dm³ = 1000 cm³, więc 2,5 · 1000 = **2500 cm³**.", "tol": 0.5}, {"id": "m12", "type": "mc", "tag": "l7", "q": "**Zad. 9.** Do probówki wlano wodę, a potem tyle samo oliwy, zamknięto korkiem i wstrząśnięto. Do drugiej – najpierw oliwę, potem wodę. Co zaobserwowano po chwili?", "options": ["W obu probówkach oliwa jest na powierzchni.", "W pierwszej oliwa jest na górze, w drugiej woda.", "W obu probówkach woda jest na powierzchni.", "Ciecze zmieszały się na stałe."], "answer": 0, "explain": "Oliwa ma mniejszą gęstość niż woda, więc zawsze wypływa na powierzchnię – kolejność wlewania nie ma znaczenia."}, {"id": "m13", "type": "order", "tag": "l7", "q": "**Zad. 10.** Ułóż warstwy cieczy w szklance **od dołu do góry**.", "items": ["miód", "mleko", "olej"], "explain": "Najgęstszy miód opada na dno, olej (najmniejsza gęstość) jest na górze, mleko pośrodku."}, {"id": "m14", "type": "tf", "tag": "l7", "q": "**Zad. 11.** Prawda czy fałsz?", "items": [{"s": "Balonik z helem unosi się, bo hel ma mniejszą gęstość niż powietrze.", "a": true}, {"s": "Lód pływa po wodzie, bo jego gęstość (0,92 g/cm³) jest mniejsza niż wody.", "a": true}, {"s": "Po rozpuszczeniu dużej ilości soli w wodzie jej gęstość maleje.", "a": false}, {"s": "Gęstość wody wynosi ok. 1 g/cm³, czyli 1000 kg/m³.", "a": true}], "explain": "Sól **zwiększa** gęstość wody (dlatego jajko wypływa w słonej wodzie, a w Morzu Martwym łatwo się unosić). Pozostałe zdania są prawdziwe."}, {"id": "m15", "type": "open", "tag": "l6", "q": "**Zad. 12.** Rozwiąż metodą 5 kroków: sztabka ma masę 2 kg i objętość 103,7 cm³. Oblicz gęstość i podaj, z jakiego metalu jest wykonana.", "keyPoints": ["dane i szukane (m = 2 kg, V = 103,7 cm³, szukane d)", "wzór d = m / V", "zamiana 2 kg = 2000 g", "obliczenie ≈ 19,3 g/cm³", "odpowiedź: złoto"], "model": "Dane: m = 2 kg, V = 103,7 cm³. Szukane: d. Wzór: d = m / V. Zamiana: 2 kg = 2000 g. Obliczenie: d = 2000 g : 103,7 cm³ ≈ 19,3 g/cm³. Odpowiedź: Sztabka jest wykonana ze złota.", "points": 5, "explain": "Za każdy krok po punkcie. Najczęstszy błąd: brak zamiany kg na g (wyszłoby ok. 0,019 – bez sensu)."}]}, {"id": "sprawdzian-cw-1", "title": "Sprawdzian ćwiczeniowy 1", "minutes": 40, "gradeScale": [[0, "niedostateczny"], [31, "dopuszczający"], [51, "dostateczny"], [71, "dobry"], [88, "bardzo dobry"], [97, "celujący"]], "intro": "Ćwiczeniowy sprawdzian z **całego zakresu** obu kartkówek „Sprawdź się” (str. 11 i str. 25): piktogramy, złota szóstka, karta charakterystyki, szkło, obserwacje i wnioski, gęstość. Pytania są nowe, liczby inne, kolejność wymieszana. **40 minut**. Licz metodą 5 kroków, w okienko wpisz sam wynik (przecinek lub kropka). Tabela gęstości: woda 1 · lód 0,92 · oliwa ok. 0,92 · glin 2,7 · żelazo 7,87 · miedź 8,9 · ołów 11,3 · rtęć 13,54 · złoto 19,3 (g/cm³).", "tasks": [{"id": "c1t1", "type": "order", "tag": "l7", "q": "**Zad. 1.** W naczyniu są miód, mleko i olej. Ułóż je **od góry do dołu**.", "items": ["olej", "mleko", "miód"], "explain": "Na górze najmniejsza gęstość: olej (ok. 0,92) → mleko (ok. 1,03) → miód (ok. 1,4 g/cm³) na dnie."}, {"id": "c1t2", "type": "mc", "tag": "l1", "q": "**Zad. 2.** Który piktogram oznacza substancję **drażniącą**?", "options": ["A", "B", "C", "D"], "optionImages": ["GHS05", "GHS02", "GHS06", "GHS07"], "answer": 3, "explain": "Drażniąca – **wykrzyknik** (GHS07). Nie myl z czaszką (toksyczna) ani z cieczą niszczącą dłoń (żrąca)."}, {"id": "c1t3", "type": "short", "tag": "l5", "q": "**Zad. 3.** Zamień: 350 cm³ = ? dm³", "accept": ["0,35 dm³", "0,35"], "num": 0.35, "explain": "1 dm³ = 1000 cm³, więc 350 cm³ = 350 : 1000 = **0,35 dm³**."}, {"id": "c1t4", "type": "short", "tag": "l5", "q": "**Zad. 4.** Zamień: 4 dag = ? g", "accept": ["40 g", "40"], "num": 40, "explain": "1 dag = 10 g, więc 4 dag = **40 g**."}, {"id": "c1t5", "type": "mc", "tag": "l7", "q": "**Zad. 5.** Dlaczego lód pływa po wodzie?", "options": ["bo ma większą gęstość niż woda", "bo jest twardszy od wody", "bo ma mniejszą gęstość (0,92 g/cm³) niż woda (1 g/cm³)", "bo jest zimniejszy od wody"], "answer": 2, "explain": "Substancja o **mniejszej gęstości** wypływa na powierzchnię: lód 0,92 g/cm³ < woda 1 g/cm³."}, {"id": "c1t6", "type": "short", "tag": "l6", "q": "**Zad. 6.** Oblicz masę 250 cm³ oliwy (d ≈ 0,92 g/cm³). Wynik w gramach.", "accept": ["230 g", "230"], "num": 230, "explain": "m = d · V = 0,92 g/cm³ · 250 cm³ = **230 g**."}, {"id": "c1t7", "type": "tf", "tag": "l2", "q": "**Zad. 7.** Złota szóstka. Prawda czy fałsz?", "items": [{"s": "Przed doświadczeniem trzeba zadbać o czystość swojego miejsca pracy.", "a": true}, {"s": "Na przerwie można wejść do pracowni, gdy nie ma nauczyciela.", "a": false}, {"s": "Należy dbać o bezpieczeństwo swoje i innych osób w sali.", "a": true}, {"s": "Polecenia nauczyciela to tylko wskazówki – można je pominąć.", "a": false}], "explain": "W pracowni przebywasz **tylko z nauczycielem**, a jego polecenia **wykonujesz dokładnie**. Czyste miejsce pracy i bezpieczeństwo swoje i innych – to też zasady złotej szóstki."}, {"id": "c1t8", "type": "short", "tag": "l6", "q": "**Zad. 8.** Kawałek metalu o masie 445 g ma objętość 50 cm³. Oblicz gęstość metalu (g/cm³).", "accept": ["8,9 g/cm³", "8,9"], "num": 8.9, "explain": "d = m / V = 445 g : 50 cm³ = **8,9 g/cm³**."}, {"id": "c1t9", "type": "short", "tag": "l5", "q": "**Zad. 9.** Zamień 2,7 g/cm³ na kg/m³.", "accept": ["2700 kg/m³", "2700"], "num": 2700, "explain": "1 g/cm³ = 1000 kg/m³, więc 2,7 g/cm³ = **2700 kg/m³**."}, {"id": "c1t10", "type": "mc", "tag": "l5", "q": "**Zad. 10.** Który wzór pozwala obliczyć gęstość?", "options": ["d = m − V", "d = V / m", "d = m / V", "d = m · V"], "answer": 2, "explain": "Gęstość to masa jednostki objętości: **d = m / V** (stąd m = d · V i V = m / d)."}, {"id": "c1t11", "type": "mc", "tag": "l3", "q": "**Zad. 11.** Do czego służy przedstawione naczynie?", "options": ["do krystalizacji – odparowania cieczy i otrzymywania kryształów", "do rozcierania substancji stałych", "do dodawania cieczy kroplami", "do mieszania cieczy przez wstrząsanie"], "answer": 0, "explain": "To **krystalizator** – płaskie, szerokie naczynie do krystalizacji.", "image": "krystalizator"}, {"id": "c1t12", "type": "match", "tag": "l3", "q": "**Zad. 12.** Przyporządkuj rysunkom nazwy szkła i sprzętu laboratoryjnego.", "pairs": [["rysunek 1", "zlewka"], ["rysunek 2", "kolba stożkowa"], ["rysunek 3", "moździerz z tłuczkiem"], ["rysunek 4", "szkiełko zegarkowe"]], "explain": "Zlewka – walec z dzióbkiem; kolba stożkowa – stożek z wąską szyjką; moździerz – gruba miska z tłuczkiem; szkiełko zegarkowe – wypukła szklana miseczka.", "pairImages": ["zlewka", "kolba_stozkowa", "mozdzierz", "szkielko_zegarkowe"]}, {"id": "c1t13", "type": "short", "tag": "l6", "q": "**Zad. 13.** Oblicz objętość 1 kg glinu (d = 2,7 g/cm³). Wynik w cm³ z dokładnością do 0,1.", "accept": ["370,4 cm³", "370,4"], "num": 370.4, "explain": "Zamiana: 1 kg = 1000 g. V = m / d = 1000 g : 2,7 g/cm³ ≈ **370,4 cm³**.", "tol": 0.3}, {"id": "c1t14", "type": "match", "tag": "l1", "q": "**Zad. 14.** Przyporządkuj piktogramom rodzaj zagrożenia.", "pairs": [["piktogram 1", "łatwopalna"], ["piktogram 2", "toksyczna"], ["piktogram 3", "niebezpieczna dla środowiska"], ["piktogram 4", "gaz pod ciśnieniem"]], "explain": "GHS: płomień – łatwopalna; płomień nad okręgiem – utleniająca; bomba – wybuchowa; butla – gaz pod ciśnieniem; ciecz niszcząca dłoń – żrąca; czaszka – toksyczna; wykrzyknik – drażniąca; sylwetka z „gwiazdą” – rakotwórcza/mutagenna; drzewo i ryba – niebezpieczna dla środowiska.", "pairImages": ["GHS02", "GHS06", "GHS09", "GHS04"]}, {"id": "c1t15", "type": "cat", "tag": "l4", "q": "**Zad. 15.** Przyporządkuj zdania do obserwacji lub wniosków.", "categories": ["obserwacja", "wniosek"], "items": [{"t": "z cieczy wydobywają się pęcherzyki gazu", "c": 0}, {"t": "powstała woda", "c": 1}, {"t": "zawartość zlewki zrobiła się ciepła", "c": 0}, {"t": "tlen podtrzymuje spalanie", "c": 1}, {"t": "w probówce widać dwie warstwy cieczy", "c": 0}, {"t": "doświadczenie się powiodło", "c": 1}], "explain": "Obserwacja = to, co rejestrują zmysły (barwa, dym, pęcherzyki, warstwy, ciepło). Wniosek = obserwacje + wiedza: nazwa substancji, jej właściwość, ocena doświadczenia."}, {"id": "c1t16", "type": "mc", "tag": "l5", "q": "**Zad. 16.** Z jakiego metalu jest kawałek z poprzedniego zadania (d = 8,9 g/cm³)? Skorzystaj z tabeli.", "options": ["z glinu", "z ołowiu", "z żelaza", "z miedzi"], "answer": 3, "explain": "Z tabeli: 8,9 g/cm³ – **miedź** (żelazo 7,87, glin 2,7, ołów 11,3)."}, {"id": "c1t17", "type": "mc", "tag": "l1", "q": "**Zad. 17.** Gdzie znajdziesz informacje o pierwszej pomocy i środkach ochrony przy pracy z daną substancją?", "options": ["w karcie charakterystyki", "w regulaminie szkoły", "w tabeli gęstości", "na paragonie ze sklepu"], "answer": 0, "explain": "**Karta charakterystyki** podaje m.in. zastosowanie, zagrożenia, pierwszą pomoc, środki ochrony i właściwości substancji."}, {"id": "c1t18", "type": "open", "tag": "l6", "q": "**Zad. 18.** Rozwiąż metodą 5 kroków: oblicz masę ołowianego ciężarka o objętości 20 cm³ (d = 11,3 g/cm³).", "keyPoints": ["dane: V = 20 cm³, d = 11,3 g/cm³; szukane: m", "wzór: m = d · V", "obliczenie: 11,3 g/cm³ · 20 cm³ = 226 g", "odpowiedź zdaniem: ciężarek ma masę 226 g"], "model": "Dane: V = 20 cm³, d = 11,3 g/cm³. Szukane: m. Wzór: m = d · V. Obliczenie: m = 11,3 g/cm³ · 20 cm³ = 226 g. Odpowiedź: Ciężarek ma masę 226 g.", "points": 4, "explain": "Za każdy element 1 pkt."}]}, {"id": "sprawdzian-cw-2", "title": "Sprawdzian ćwiczeniowy 2", "minutes": 40, "gradeScale": [[0, "niedostateczny"], [31, "dopuszczający"], [51, "dostateczny"], [71, "dobry"], [88, "bardzo dobry"], [97, "celujący"]], "intro": "Ćwiczeniowy sprawdzian z **całego zakresu** obu kartkówek „Sprawdź się” (str. 11 i str. 25): piktogramy, złota szóstka, karta charakterystyki, szkło, obserwacje i wnioski, gęstość. Pytania są nowe, liczby inne, kolejność wymieszana. **40 minut**. Licz metodą 5 kroków, w okienko wpisz sam wynik (przecinek lub kropka). Tabela gęstości: woda 1 · lód 0,92 · oliwa ok. 0,92 · glin 2,7 · żelazo 7,87 · miedź 8,9 · ołów 11,3 · rtęć 13,54 · złoto 19,3 (g/cm³).", "tasks": [{"id": "c2t1", "type": "mc", "tag": "l1", "q": "**Zad. 1.** Co oznacza ten piktogram?", "options": ["substancja rakotwórcza / mutagenna – poważne zagrożenie dla zdrowia", "substancja niebezpieczna dla środowiska", "substancja toksyczna", "substancja drażniąca"], "answer": 0, "explain": "Sylwetka człowieka z „gwiazdą” na piersi (GHS08) – **rakotwórcza / mutagenna**.", "image": "GHS08"}, {"id": "c2t2", "type": "mc", "tag": "l3", "q": "**Zad. 2.** Jak nazywa się przedstawione naczynie?", "options": ["krystalizator", "kolba kulista płaskodenna", "kolba stożkowa", "zlewka"], "answer": 1, "explain": "Kula z szyjką i płaskim dnem – **kolba kulista płaskodenna** (równomierne ogrzewanie cieczy, otrzymywanie gazów).", "image": "kolba_kulista"}, {"id": "c2t3", "type": "multi", "tag": "l2", "q": "**Zad. 3.** Zaznacz **wszystkie** zasady, które należą do złotej szóstki.", "options": ["Doświadczenie możesz zmienić po swojemu, jeśli będzie ciekawiej.", "Każde doświadczenie wykonujesz zgodnie z opisem, ostrożnie.", "Regulaminu pracowni przestrzega tylko nauczyciel.", "W pracowni przebywasz tylko w obecności nauczyciela.", "Słuchasz uważnie poleceń nauczyciela i dokładnie je wykonujesz."], "answer": [1, 3, 4], "explain": "Złota szóstka: tylko z nauczycielem; czyste miejsce pracy; zgodnie z opisem i ostrożnie; bezpieczeństwo swoje i innych; słuchaj poleceń; przestrzegaj regulaminu pracowni (ty też!)."}, {"id": "c2t4", "type": "match", "tag": "l1", "q": "**Zad. 4.** Połącz opis symbolu na piktogramie z rodzajem zagrożenia.", "pairs": [["czaszka i skrzyżowane piszczele", "toksyczna"], ["wykrzyknik", "drażniąca"], ["wybuchająca bomba", "wybuchowa"], ["uschnięte drzewo i martwa ryba", "niebezpieczna dla środowiska"], ["ciecz niszcząca powierzchnię i dłoń", "żrąca"]], "explain": "GHS: płomień – łatwopalna; płomień nad okręgiem – utleniająca; bomba – wybuchowa; butla – gaz pod ciśnieniem; ciecz niszcząca dłoń – żrąca; czaszka – toksyczna; wykrzyknik – drażniąca; sylwetka z „gwiazdą” – rakotwórcza/mutagenna; drzewo i ryba – niebezpieczna dla środowiska."}, {"id": "c2t5", "type": "short", "tag": "l5", "q": "**Zad. 5.** Zamień 0,8 g/cm³ na kg/m³.", "accept": ["800 kg/m³", "800"], "num": 800, "explain": "1 g/cm³ = 1000 kg/m³, więc 0,8 g/cm³ = **800 kg/m³**."}, {"id": "c2t6", "type": "mc", "tag": "l7", "q": "**Zad. 6.** Dlaczego balon napełniony helem unosi się w górę?", "options": ["balon jest lżejszy od helu", "hel jest gorący", "hel ma większą gęstość niż powietrze", "hel ma mniejszą gęstość niż powietrze"], "answer": 3, "explain": "Hel (ok. 0,18 kg/m³) ma **mniejszą gęstość** niż powietrze (ok. 1,29 kg/m³)."}, {"id": "c2t7", "type": "mc", "tag": "l5", "q": "**Zad. 7.** Jaka jest jednostka gęstości w układzie SI?", "options": ["m³", "g/cm³", "kg/m³", "kg"], "answer": 2, "explain": "W układzie SI: **kg/m³**. W chemii najczęściej używa się g/cm³ (1 g/cm³ = 1000 kg/m³)."}, {"id": "c2t8", "type": "tf", "tag": "l4", "q": "**Zad. 8.** Obserwacje i wnioski. Prawda czy fałsz?", "items": [{"s": "„Na ściankach probówki pojawiły się krople bezbarwnej cieczy” – to obserwacja.", "a": true}, {"s": "„Powstała woda” – to obserwacja.", "a": false}, {"s": "Wniosek łączy obserwacje z wiedzą naukową.", "a": true}, {"s": "„Doświadczenie się powiodło” – to obserwacja.", "a": false}], "explain": "Nazwa substancji („woda”) i ocena („się powiodło”) to **wnioski** – nie da się ich stwierdzić samymi zmysłami."}, {"id": "c2t9", "type": "mc", "tag": "l5", "q": "**Zad. 9.** Z jakiej substancji jest próbka z poprzedniego zadania (d = 2,7 g/cm³)?", "options": ["z glinu", "z lodu", "z żelaza", "z miedzi"], "answer": 0, "explain": "Z tabeli: 2,7 g/cm³ – **glin**. Gęstość jest cechą charakterystyczną substancji."}, {"id": "c2t10", "type": "mc", "tag": "l1", "q": "**Zad. 10.** Co oznacza ten piktogram?", "options": ["substancja żrąca", "substancja łatwopalna", "substancja utleniająca – podtrzymuje palenie innych substancji", "substancja wybuchowa"], "answer": 2, "explain": "Płomień **nad okręgiem** (GHS03) – substancja **utleniająca**. Sam płomień (bez okręgu) – łatwopalna.", "image": "GHS03"}, {"id": "c2t11", "type": "match", "tag": "l3", "q": "**Zad. 11.** Połącz sprzęt z jego zastosowaniem.", "pairs": [["pipeta Pasteura", "pobieranie małych ilości cieczy, dodawanie kroplami"], ["moździerz z tłuczkiem", "rozcieranie substancji stałych"], ["probówka", "doświadczenia z małymi ilościami substancji"], ["szkiełko zegarkowe", "odważanie małych ilości substancji stałych"]], "explain": "Pipeta Pasteura – kroplami; moździerz – rozcieranie; probówka – małe ilości substancji; szkiełko zegarkowe – odważanie, przykrywanie zlewki."}, {"id": "c2t12", "type": "short", "tag": "l6", "q": "**Zad. 12.** Próbka substancji o masie 54 g ma objętość 20 cm³. Oblicz jej gęstość (g/cm³).", "accept": ["2,7 g/cm³", "2,7"], "num": 2.7, "explain": "d = m / V = 54 g : 20 cm³ = **2,7 g/cm³**."}, {"id": "c2t13", "type": "short", "tag": "l5", "q": "**Zad. 13.** Zamień: 0,75 kg = ? g", "accept": ["750 g", "750"], "num": 750, "explain": "1 kg = 1000 g, więc 0,75 kg = **750 g**."}, {"id": "c2t14", "type": "mc", "tag": "l1", "q": "**Zad. 14.** Jak wyglądają piktogramy ostrzegawcze GHS?", "options": ["żółty trójkąt z czarnym symbolem", "czerwony romb, białe tło, czarny symbol", "niebieskie koło z białym symbolem", "zielony kwadrat z białym symbolem"], "answer": 1, "explain": "Piktogramy GHS to **czerwone romby** (kwadraty postawione na rogu) z **białym tłem i czarnym symbolem**."}, {"id": "c2t15", "type": "mc", "tag": "l7", "q": "**Zad. 15.** W wodzie z kranu jajko tonie. Co się stanie po rozpuszczeniu w tej wodzie dużej ilości soli?", "options": ["jajko się rozpuści", "nic się nie zmieni – sól nie zmienia gęstości", "jajko opadnie jeszcze szybciej", "jajko wypłynie, bo gęstość wody wzrośnie"], "answer": 3, "explain": "Słona woda ma **większą gęstość**, więc jajko **wypływa** (tak jak człowiek unosi się w Morzu Martwym)."}, {"id": "c2t16", "type": "short", "tag": "l6", "q": "**Zad. 16.** Oblicz objętość 1,5 kg miedzi (d = 8,9 g/cm³). Wynik w cm³ z dokładnością do 0,1.", "accept": ["168,5 cm³", "168,5"], "num": 168.5, "explain": "Zamiana: 1,5 kg = 1500 g. V = m / d = 1500 g : 8,9 g/cm³ ≈ **168,5 cm³**.", "tol": 0.2}, {"id": "c2t17", "type": "short", "tag": "l5", "q": "**Zad. 17.** Zamień: 3 m³ = ? dm³", "accept": ["3000 dm³", "3000"], "num": 3000, "explain": "1 m³ = 1000 dm³, więc 3 m³ = **3000 dm³**."}, {"id": "c2t18", "type": "short", "tag": "l6", "q": "**Zad. 18.** Oblicz masę 0,2 dm³ rtęci (d = 13,54 g/cm³). Wynik w gramach.", "accept": ["2708 g", "2708"], "num": 2708, "explain": "Zamiana: 0,2 dm³ = 200 cm³. m = d · V = 13,54 g/cm³ · 200 cm³ = **2708 g**.", "tol": 2}, {"id": "c2t19", "type": "open", "tag": "l4", "q": "**Zad. 19.** Do zlewki z wodą wlano oliwę. Zapisz jedną obserwację i jeden wniosek z tego doświadczenia i wyjaśnij, czym się różnią.", "keyPoints": ["obserwacja: powstały dwie warstwy, oliwa jest na górze", "wniosek: oliwa ma mniejszą gęstość niż woda", "obserwacja = zmysły, wniosek = obserwacje + wiedza"], "model": "Obserwacja: ciecze rozdzieliły się na dwie warstwy, oliwa jest na górze. Wniosek: gęstość oliwy jest mniejsza od gęstości wody. Obserwację rejestrujemy zmysłami, a wniosek to obserwacja połączona z wiedzą naukową.", "points": 3, "explain": "Za każdy element 1 pkt."}]}, {"id": "sprawdzian-cw-3", "title": "Sprawdzian ćwiczeniowy 3", "minutes": 40, "gradeScale": [[0, "niedostateczny"], [31, "dopuszczający"], [51, "dostateczny"], [71, "dobry"], [88, "bardzo dobry"], [97, "celujący"]], "intro": "Ćwiczeniowy sprawdzian z **całego zakresu** obu kartkówek „Sprawdź się” (str. 11 i str. 25): piktogramy, złota szóstka, karta charakterystyki, szkło, obserwacje i wnioski, gęstość. Pytania są nowe, liczby inne, kolejność wymieszana. **40 minut**. Licz metodą 5 kroków, w okienko wpisz sam wynik (przecinek lub kropka). Tabela gęstości: woda 1 · lód 0,92 · oliwa ok. 0,92 · glin 2,7 · żelazo 7,87 · miedź 8,9 · ołów 11,3 · rtęć 13,54 · złoto 19,3 (g/cm³).", "tasks": [{"id": "c3t1", "type": "mc", "tag": "l2", "q": "**Zad. 1.** Co według złotej szóstki trzeba zrobić, zanim przystąpisz do doświadczenia?", "options": ["wymieszać wszystkie odczynniki", "wyjść z pracowni po nauczyciela", "zadbać o czystość swojego miejsca pracy", "spróbować substancji, żeby ją poznać"], "answer": 2, "explain": "Zasada 2: zanim przystąpisz do doświadczenia, zadbaj o **czystość swojego miejsca pracy**."}, {"id": "c3t2", "type": "cat", "tag": "l4", "q": "**Zad. 2.** Przyporządkuj zdania do obserwacji lub wniosków.", "categories": ["obserwacja", "wniosek"], "items": [{"t": "z probówki wydobywa się siwy dym", "c": 0}, {"t": "kostka lodu pływa na powierzchni wody", "c": 0}, {"t": "metal ma srebrzystą barwę", "c": 0}, {"t": "otrzymanym gazem jest tlen", "c": 1}, {"t": "lód ma mniejszą gęstość niż woda", "c": 1}, {"t": "doświadczenie się nie powiodło", "c": 1}], "explain": "Obserwacja = to, co rejestrują zmysły (barwa, dym, pęcherzyki, warstwy, ciepło). Wniosek = obserwacje + wiedza: nazwa substancji, jej właściwość, ocena doświadczenia."}, {"id": "c3t3", "type": "short", "tag": "l6", "q": "**Zad. 3.** Kawałek metalu o masie 78,7 g ma objętość 10 cm³. Oblicz jego gęstość (g/cm³).", "accept": ["7,87 g/cm³", "7,87"], "num": 7.87, "explain": "d = m / V = 78,7 g : 10 cm³ = **7,87 g/cm³**."}, {"id": "c3t4", "type": "mc", "tag": "l3", "q": "**Zad. 4.** Które naczynie ma dzióbek do przelewania cieczy?", "options": ["probówka", "zlewka", "kolba stożkowa", "kolba kulista płaskodenna"], "answer": 1, "explain": "**Zlewka** – walec z dzióbkiem do przelewania; służy do przechowywania, mieszania i ogrzewania cieczy."}, {"id": "c3t5", "type": "tf", "tag": "l7", "q": "**Zad. 5.** Gęstość wokół nas. Prawda czy fałsz?", "items": [{"s": "W Morzu Martwym łatwo unosić się na wodzie, bo jest bardzo zasolone.", "a": true}, {"s": "Oliwa jest na górze tylko wtedy, gdy wlejemy ją jako drugą.", "a": false}, {"s": "Miód opada na dno pod mleko i olej.", "a": true}, {"s": "Lit pływałby po wodzie, bo ma gęstość ok. 0,53 g/cm³.", "a": true}], "explain": "Oliwa zawsze wypływa na wierzch – **kolejność wlewania nie ma znaczenia**. Pozostałe zdania są prawdziwe."}, {"id": "c3t6", "type": "mc", "tag": "l5", "q": "**Zad. 6.** Mały gwóźdź i duża sztabka z żelaza mają:", "options": ["taką samą gęstość", "różne gęstości – większa sztabka ma większą", "różne gęstości – mniejszy gwóźdź ma większą", "taką samą masę"], "answer": 0, "explain": "Gęstość **nie zależy od wielkości próbki** – to cecha substancji (żelazo: 7,87 g/cm³)."}, {"id": "c3t7", "type": "match", "tag": "l3", "q": "**Zad. 7.** Przyporządkuj rysunkom nazwy szkła i sprzętu laboratoryjnego.", "pairs": [["rysunek 1", "probówka"], ["rysunek 2", "pipeta Pasteura z podziałką"], ["rysunek 3", "kolba kulista płaskodenna"], ["rysunek 4", "krystalizator"]], "explain": "Probówka – wąska rurka; pipeta Pasteura – rurka z bańką i podziałką; kolba kulista – kula z szyjką i płaskim dnem; krystalizator – niskie, szerokie naczynie.", "pairImages": ["probowka", "pipeta_pasteura", "kolba_kulista", "krystalizator"]}, {"id": "c3t8", "type": "short", "tag": "l6", "q": "**Zad. 8.** Oblicz masę 40 cm³ złota (d = 19,3 g/cm³). Wynik w gramach.", "accept": ["772 g", "772"], "num": 772, "explain": "m = d · V = 19,3 g/cm³ · 40 cm³ = **772 g**."}, {"id": "c3t9", "type": "short", "tag": "l6", "q": "**Zad. 9.** Oblicz objętość 0,46 kg oliwy (d ≈ 0,92 g/cm³). Wynik w cm³.", "accept": ["500 cm³", "500"], "num": 500, "explain": "Zamiana: 0,46 kg = 460 g. V = m / d = 460 g : 0,92 g/cm³ = **500 cm³**."}, {"id": "c3t10", "type": "mc", "tag": "l5", "q": "**Zad. 10.** Z jakiego metalu jest kawałek z poprzedniego zadania (d = 7,87 g/cm³)?", "options": ["z miedzi", "z ołowiu", "z żelaza", "ze złota"], "answer": 2, "explain": "Z tabeli: 7,87 g/cm³ – **żelazo**."}, {"id": "c3t11", "type": "order", "tag": "l6", "q": "**Zad. 11.** Ułóż kroki metody rozwiązywania zadań z gęstością we właściwej kolejności.", "items": ["dane i szukane", "wzór i przekształcenie", "zamiana jednostek", "obliczenie z jednostką", "odpowiedź pełnym zdaniem"], "explain": "Metoda 5 kroków: dane i szukane → wzór → zamiana jednostek → obliczenie z jednostką → odpowiedź zdaniem."}, {"id": "c3t12", "type": "short", "tag": "l5", "q": "**Zad. 12.** Zamień: 2500 mg = ? g", "accept": ["2,5 g", "2,5"], "num": 2.5, "explain": "1 g = 1000 mg, więc 2500 mg = **2,5 g**."}, {"id": "c3t13", "type": "mc", "tag": "l1", "q": "**Zad. 13.** Który piktogram oznacza substancję **wybuchową**?", "options": ["A", "B", "C", "D"], "optionImages": ["GHS01", "GHS04" "**Zad. 19.** Uczeń obliczył objętość 0,5 kg miedzi (d = 8,9 g/cm³) tak: V = 0,5 : 8,9 ≈ 0,056 cm³. Wskaż błąd i podaj poprawne rozwiązanie.", "keyPoints": ["błąd: nie zamienił kg na g – jednostki nie pasują do g/cm³", "zamiana: 0,5 kg = 500 g", "wzór: V = m / d = 500 g : 8,9 g/cm³", "wynik: V ≈ 56,2 cm³"], "model": "Uczeń nie zamienił jednostek: przy gęstości w g/cm³ masę trzeba podać w gramach. 0,5 kg = 500 g. V = m / d = 500 g : 8,9 g/cm³ ≈ 56,2 cm³.", "points": 4, "explain": "Za każdy element 1 pkt."}]}], "cheatSheet": [{"title": "Piktogramy GHS (czerwony romb)", "items": ["płomień = łatwopalna; płomień NAD OKRĘGIEM = utleniająca", "czaszka = toksyczna; wykrzyknik = drażniąca", "ciecz niszcząca dłoń = żrąca; bomba = wybuchowa; butla = gaz pod ciśnieniem", "sylwetka z gwiazdą = rakotwórcza; drzewo i ryba = środowisko"], "images": [{"img": "GHS01", "caption": "wybuchowa"}, {"img": "GHS02", "caption": "łatwopalna"}, {"img": "GHS03", "caption": "utleniająca"}, {"img": "GHS04", "caption": "gaz pod ciśnieniem"}, {"img": "GHS05", "caption": "żrąca"}, {"img": "GHS06", "caption": "toksyczna"}, {"img": "GHS07", "caption": "drażniąca"}, {"img": "GHS08", "caption": "rakotwórcza / mutagenna"}, {"img": "GHS09", "caption": "niebezpieczna dla środowiska"}]}, {"title": "Bezpieczeństwo", "items": ["Złota szóstka: tylko z nauczycielem · czyste stanowisko · zgodnie z opisem, ostrożnie · bezpieczeństwo swoje i innych · słuchaj poleceń · regulamin", "Odczynnik = czytelna etykieta + piktogramy", "Karta charakterystyki: zastosowanie, zagrożenia, ochrona, właściwości", "NaOH: żrący (GHS05), mydło i udrażnianie rur, okulary ochronne, biały"]}, {"title": "Szkło i sprzęt", "items": ["zlewka – ciecze, mieszanie, roztwory", "probówka – małe ilości substancji", "kolba stożkowa – mieszanie przez wstrząsanie", "kolba kulista płaskodenna – ogrzewanie cieczy, otrzymywanie gazów", "szkiełko zegarkowe – odważanie, przykrywanie zlewki", "pipeta Pasteura z podziałką – małe ilości cieczy, kroplami", " function dmParse(s){s=String(s).replace(/[′’`´]/g,"'").replace(/[″”]/g,'"');var mDec=s.match(/^\s*(\d+)[.,](\d+)\s*°?\s*[A-Za-ząćęłńóśźżĄĆĘŁŃÓŚŹŻ. ]*$/);
 if(mDec&&!(mDec[2].length===2&&+mDec[2]<60))return Math.round(parseFloat(mDec[1]+'.'+mDec[2])*60*100)/100;
 var t=s.match(/\d+/g);if(!t)return null;var d=+t[0],m=t.length>1?+t[1]:0;if(m>=60)return null;return d*60+m;}

 if(q.dmDir){var d=dmDirOf(v);return d.length===1&&d[0]===q.dmDir;}return true;}

<template id="tutor-tpl"><elevenlabs-convai agent-id="agent_3101m4193bfqeyy99nqzjkg5mtfh" variant="expanded" action-text="Porozmawiaj z tutorem" start-call-text="Zacznij rozmowę" end-call-text="Zakończ" dynamic-variables="{&quot;subject&quot;: &quot;Chemia&quot;, &quot;topic&quot;: &quot;Chemia: bezpieczeństwo w pracowni, szkło laboratoryjne i gęstość&quot;, &quot;material&quot;: &quot;## Piktogramy GHS, etykiety i karty charakterystyki\nNajważniejsze: Odczynnik = czytelna etykieta + piktogramy (jeśli trzeba); 9 piktogramów GHS: czerwony romb, białe tło, czarny symbol; Płomień = łatwopalna; płomień nad okręgiem = utleniająca; Czaszka = toksyczna; wykrzyknik = drażniąca; ciecz niszcząca dłoń = żrąca; Karta charakterystyki = wszystkie ważne informacje o substancji\nWiele substancji w pracowni (i w domu!) może być niebezpiecznych. Dlatego każdy odczynnik musi mieć czytelną etykietę, a jeśli wymagają tego jego właściwości – także piktogramy ostrzegawcze.\nPiktogramy GHS to czerwone romby (kwadraty postawione na rogu) z białym tłem i czarnym symbolem. Jest ich 9 – na obrazkach poniżej każdy ma podpis. Naucz się ich tak, by rozpoznawać je bez podpisu.\nWybuchowa (GHS01) – wybuchająca bomba. Łatwopalna (GHS02) – płomień. Utleniająca (GHS03) – płomień nad okręgiem (podtrzymuje palenie innych substancji). Gaz pod ciśnieniem (GHS04) – butla.\nŻrąca (GHS05) – ciecz kapiąca z probówek niszczy powierzchnię i dłoń. Toksyczna (GHS06) – czaszka i skrzyżowane piszczele. Drażniąca (GHS07) – wykrzyknik.\nRakotwórcza / mutagenna (GHS08) – sylwetka człowieka …\n\n## Złota szóstka – zasady pracy w pracowni chemicznej\nNajważniejsze: Tylko z nauczycielem; Czyste miejsce pracy przed doświadczeniem; Zgodnie z opisem i ostrożnie; Bezpieczeństwo swoje i innych; Słuchaj poleceń nauczyciela; Przestrzegaj regulaminu pracowni\nW podręczniku zasady bezpiecznej pracy zebrano w złotą szóstkę:\n1. W pracowni możesz przebywać tylko w obecności nauczyciela.\n2. Podczas niektórych zajęć będą wykonywane doświadczenia. Zanim do nich przystąpisz, musisz zadbać o czystość swojego miejsca pracy.\n3. Każde doświadczenie wykonuj zgodnie z opisem, zachowując ostrożność.\n4. Dbaj o bezpieczeństwo swoje i osób, z którymi przebywasz w sali chemicznej.\n5. Słuchaj uważnie poleceń nauczyciela i dokładnie je wykonuj.\n6. Pamiętaj o przestrzeganiu regulaminu pracowni chemicznej.\nDo tego dochodzi „W skrócie”: każdy odczynnik ma czytelną etykietę z piktogramami, przydatne informacje o substancjach są w kartach charakterystyki, a doświadczenia wykonuje się w specjalnym szkle laboratoryjnym z odpowiednim sprzętem.\nDlaczego? Po co sprzątać stanowisko przed doświadczeniem? – Na zagraconym stole łatwo coś przewrócić albo pomylić substancje, a resztki …\n\n## Szkło i sprzęt laboratoryjny\nNajważniejsze: zlewka: ciecze, mieszanie, roztwory; probówka: małe ilości substancji; kolba stożkowa: mieszanie przez wstrząsanie; kolba kulista płaskodenna: ogrzewanie cieczy, otrzymywanie gazów; szkiełko zegarkowe: odważanie, przykrywanie zlewki; pipeta Pasteura z podziałką: małe ilości cieczy, kroplami; moździerz z tłuczkiem: rozcieranie substancji stałych; krystalizator: otrzymywanie kryształów\nDoświadczenia wykonuje się w specjalnym szkle laboratoryjnym – jest odporne na ogrzewanie i na działanie wielu substancji. Każde naczynie ma swój kształt i swoje zadanie. Obejrzyj rysunki i zapamiętaj kształty.\nZlewka – przechowywanie, mieszanie i ogrzewanie cieczy, przygotowywanie roztworów (ma dzióbek do przelewania).\nProbówka – doświadczenia z małymi ilościami substancji, także ogrzewanie (trzymana w uchwycie).\nKolba stożkowa – mieszanie cieczy przez wstrząsanie bez rozlewania, ogrzewanie; wąska szyjka ogranicza rozpryskiwanie.\nKolba kulista płaskodenna – równomierne ogrzewanie cieczy, otrzymywanie gazów; płaskie dno – można ją postawić na stole.\nSzkiełko zegarkowe – odważanie małych ilości substancji stałych, …\n\n## Obserwacje i wnioski\nNajważniejsze: Obserwacja = to, co rejestrują zmysły; Wniosek = obserwacje + wiedza naukowa; Nazwa substancji (woda, CO₂) → wniosek; „Doświadczenie się powiodło” → wniosek (ocena)\nPodczas doświadczenia zapisujemy obserwacje, a na końcu formułujemy wnioski. To nie to samo!\nObserwacja opisuje to, co rejestrują zmysły (wzrok, słuch, węch, dotyk): barwę, dym, pęcherzyki, krople, ciepło, warstwy. Nie zawiera nazw substancji, których nie da się rozpoznać „na oko”, ani ocen.\nWniosek to obserwacje połączone z wiedzą naukową – wyjaśnienie, co się stało i dlaczego: nazwa powstałej substancji, jej właściwość, ocena doświadczenia.\nPrzykład: widzisz krople bezbarwnej cieczy na ściankach probówki – to obserwacja. Stwierdzasz, że to woda – to wniosek (oczami nie odróżnisz wody od np. alkoholu; potrzebna jest wiedza).\nObserwacje z podręcznika: po ogrzaniu pojawia się siwy dym; na ściankach probówki pojawiają się krople bezbarwnej cieczy; zawartość szalki robi się ciepła; w zlewce pojawiły się dwie warstwy płynów.\nWnioski z podręcznika: otrzymanym gazem jest dwutlenek węgla; na ściankach probówki pojawia się woda; doświadczenie się powiodło; …\n\n## Gęstość – wzór, jednostki, tabela\nNajważniejsze: d = m / V; m = d · V; V = m / d; Jednostki: g/cm³ i kg/m³; 1 g/cm³ = 1000 kg/m³; Woda ≈ 1 g/cm³ (4 °C); 1 kg = 1000 g = 100 dag; 1 g = 1000 mg; 1 m³ = 1000 dm³; 1 dm³ = 1000 cm³; 1 cm³ = 1000 mm³; Gęstość pozwala rozpoznać substancję\nDlaczego olej, mleko i miód wlane do jednego naczynia tworzą warstwy? Dlaczego balonik z helem się unosi? Odpowiedź to gęstość.\nGęstość (d) to masa jednostki objętości substancji: d = m / V, gdzie m – masa, V – objętość. W niektórych książkach gęstość oznacza się grecką literą ρ (ro).\nPrzekształcenia wzoru: m = d · V (masa) oraz V = m / d (objętość).\nJednostka w układzie SI: kg/m³. W praktyce (w chemii) najczęściej g/cm³ (zapisywane też g·cm⁻³). 1 g/cm³ = 1000 kg/m³.\nWoda ma gęstość ok. 1 g/cm³ (dokładnie w temperaturze 4 °C): 1 cm³ wody ma masę ok. 1 g, a 1 dm³ (1 litr) – ok. 1 kg.\nZamiana jednostek masy: 1 kg = 1000 g, 1 kg = 100 dag, 1 g = 1000 mg (1 dag = 10 g).\nZamiana jednostek objętości: 1 m³ = 1000 dm³, 1 dm³ = 1000 cm³, 1 cm³ = 1000 mm³ (1 dm³ = 1 litr, 1 cm³ = 1 ml).\nTabela gęstości (g/cm³): woda 1 · lód 0,92 · oliwa ok. 0,92 · glin 2,7 · żelazo 7,87 · miedź …\n\n## Obliczenia z gęstością – metoda 5 kroków\nNajważniejsze: Krok 1: dane i szukane; Krok 2: wzór i przekształcenie; Krok 3: zamiana jednostek; Krok 4: obliczenie z jednostką; Krok 5: odpowiedź zdaniem; g/cm³ ↔ g i cm³; kg/m³ ↔ kg i m³\nKażde zadanie rozwiązuj w 5 krokach: 1) dane i szukane; 2) wzór i ewentualne przekształcenie; 3) zamiana jednostek (jeśli trzeba); 4) obliczenie z jednostką; 5) odpowiedź pełnym zdaniem.\nPrzykład 1 (złoto). Dane: m = 2000 g, V = 103,7 cm³. Szukane: d. Wzór: d = m / V. Obliczenie: d = 2000 g : 103,7 cm³ ≈ 19,3 g/cm³. Z tabeli: to złoto. Odpowiedź: Sztabka jest wykonana ze złota.\nPrzykład 2 (rtęć w termometrze). Dane: V = 0,03 cm³, d = 13,54 g/cm³. Szukane: m. Wzór: m = d · V. Obliczenie: m = 13,54 g/cm³ · 0,03 cm³ ≈ 0,41 g. Odpowiedź: W termometrze jest ok. 0,41 g rtęci.\nPrzykład 3 (gwoździe z miedzi). Dane: m = 0,5 kg, d = 8,9 g/cm³. Szukane: V. Wzór: V = m / d. Zamiana: 0,5 kg = 500 g (jednostki muszą pasować do g/cm³!). Obliczenie: V = 500 g : 8,9 g/cm³ ≈ 56,2 cm³. Odpowiedź: Gwoździe zajmują ok. 56,2 cm³.\nNajczęstszy błąd: mieszanie jednostek. Jeśli gęstość jest w g/cm³, masę zamień na g, a objętość na cm³. Jeśli w …\n\n## Gęstość wokół nas – doświadczenia i zjawiska\nNajważniejsze: Mniejsza gęstość → na górze, większa → na dole; Oliwa na wodzie niezależnie od kolejności; Od dołu: miód, mleko, olej; Lód 0,92 &lt; woda 1 → lód pływa; Słona woda ma większą gęstość → jajko wypływa, w Morzu Martwym łatwo się unosić; Hel ma mniejszą gęstość niż powietrze → balon się unosi\nDoświadczenie 4 – porównanie gęstości wody i oliwy. Do probówki wlewamy wodę (ok. 1/4 objętości), potem tyle samo oliwy, zamykamy korkiem i wstrząsamy. W drugiej probówce odwrotnie: najpierw oliwa, potem woda.\nObserwacje: po chwili ciecze się rozdzielają, w obu probówkach oliwa jest na powierzchni. Wnioski: gęstość oliwy jest mniejsza od gęstości wody; ciecz o mniejszej gęstości wypływa na powierzchnię; kolejność dodawania nie ma znaczenia.\nWarstwy olej – mleko – miód: ciecze, które się nie mieszają, układają się od najgęstszej na dole do najmniej gęstej na górze: miód (ok. 1,4 g/cm³) na dnie, mleko (ok. 1,03 g/cm³) w środku, olej (ok. 0,92 g/cm³) na górze.\nLód pływa po wodzie, bo ma gęstość 0,92 g/cm³ – mniejszą niż woda (1 g/cm³).\nMorze Martwe jest bardzo zasolone, więc jego woda ma dużą gęstość – …\n\n## Fiszki\n- Co oznacza ten piktogram? → Substancja wybuchowa (GHS01) – wybuchająca bomba.\n- Co oznacza ten piktogram? → Substancja łatwopalna (GHS02) – płomień.\n- Co oznacza ten piktogram? → Substancja utleniająca (GHS03) – płomień nad okręgiem.\n- Co oznacza ten piktogram? → Substancja gaz pod ciśnieniem (GHS04) – butla gazowa.\n- Co oznacza ten piktogram? → Substancja żrąca (GHS05) – ciecz z probówek niszczy powierzchnię i dłoń.\n- Co oznacza ten piktogram? → Substancja toksyczna (GHS06) – czaszka i skrzyżowane piszczele.\n- Co oznacza ten piktogram? → Substancja drażniąca (GHS07) – wykrzyknik.\n- Co oznacza ten piktogram? → Substancja rakotwórcza / mutagenna (GHS08) – sylwetka człowieka z „gwiazdą” na piersi.\n- Co oznacza ten piktogram? → Substancja niebezpieczna dla środowiska (GHS09) – uschnięte drzewo i martwa ryba.\n- Jak się nazywa i do czego służy? → Zlewka – przechowywanie, mieszanie i ogrzewanie cieczy, przygotowywanie roztworów (ma dzióbek do przelewania).\n- Jak się nazywa i do czego służy? → Probówka – doświadczenia z małymi ilościami substancji, także ogrzewanie (trzymana w uchwycie).\n- Jak się nazywa i do czego służy? → Kolba stożkowa – mieszanie cieczy przez wstrząsanie bez rozlewania, ogrzewanie; wąska szyjka ogranicza rozpryskiwanie.\n- Jak się nazywa i do czego służy? → Kolba kulista płaskodenna – równomierne ogrzewanie ciec
