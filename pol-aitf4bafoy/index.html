<script>window.TP_CONTENT={"schemaVersion": 1, "meta": {"id": "pol7-imieslowy", "title": "Język polski: imiesłowy", "subtitle": "Imiesłowy przymiotnikowe (czynne i bierne) i przysłówkowe (współczesne i uprzednie): jak je tworzyć, kiedy formy nie ma, pisownia „nie”, przecinki i imiesłowowy równoważnik zdania", "subject": "Język polski", "grade": "Klasa 7 SP", "lang": "pl", "explainLangs": ["pl", "en", "ru"], "estimatedMinutes": 90, "sourceNote": "Opracowane na podstawie karty pracy z zeszytu (tabela imiesłowów) i zasad z podręcznika do klasy 7. Formy sprawdzone ze Słownikiem języka polskiego PWN; pisownia „nie” według zasad obowiązujących od 1 stycznia 2026 r. Jeśli coś różni się od tego, co mówiła nauczycielka – ważniejsze jest to, co było na lekcji.", "uncertain": [], "tutorMaterial": "TEMAT: imiesłowy (język polski, klasa 7). Mów po polsku, prosto, krótkimi zdaniami. Pytaj ucznia, nie podawaj od razu odpowiedzi.\n\nNAJWAŻNIEJSZE ZASADY\n1. Imiesłów przymiotnikowy czynny: 3 osoba liczby mnogiej czasu teraźniejszego + -cy (-ca, -ce): czytają → czytający, piszą → piszący, śpią → śpiący. Tylko od czasowników NIEDOKONANYCH. Odmienia się jak przymiotnik.\n2. Imiesłów przymiotnikowy bierny: przyrostki -ny, -ony, -ty: czytany, malowany, niesiony, zrobiony, myty, otwarty, zamknięty. Tylko od czasowników PRZECHODNICH (łączą się z dopełnieniem w bierniku: kogo? co?), od obu aspektów (wykonywany i wykonany). Odmienia się jak przymiotnik.\n3. Imiesłów przysłówkowy współczesny: 3 os. lm czasu teraźniejszego + -c: czytając, myjąc, biegnąc. Tylko od NIEDOKONANYCH. Czynność w tym samym czasie co orzeczenie. Nieodmienny.\n4. Imiesłów przysłówkowy uprzedni: od czasu przeszłego (on): po samogłosce -wszy (przeczytał → przeczytawszy, utył → utywszy), po spółgłosce -łszy (przyniósł → przyniósłszy, przyszedł → przyszedłszy, zjadł → zjadłszy, usiadł → usiadłszy). Tylko od DOKONANYCH. Czynność wcześniejsza. Nieodmienny.\n5. X w tabeli = formy nie ma. Dokonany → brak czynnego i współczesnego (nie ma czasu teraźniejszego). Niedokonany → brak uprzedniego. Nieprzechodni (siedzieć, świecić, spać, iść, przyjść, utyć, śmiać się, wrócić, usiąść) → brak biernego. Test: „co robić / co zrobić?” oraz „czy mogę dodać kogo? co?”.\n6. „Nie” z imiesłowami przymiotnikowymi piszemy łącznie (niemyty, nieczytający, nieprzeczytany) – od 1 stycznia 2026 zawsze, bez wyjątków. „Nie” z imiesłowami przysłówkowymi piszemy osobno (nie czytając, nie wiedząc, nie przeczytawszy).\n7. Imiesłowowy równoważnik zdania = imiesłów przysłówkowy z wyrazami zależnymi (wróciwszy do domu, czytając książkę). Oddzielamy go przecinkiem; w środku zdania przecinki z obu stron: „Ola, zobaczywszy psa, uciekła.”\n8. Ten sam wykonawca: czynność w równoważniku musi wykonywać podmiot zdania głównego. Błąd: „Idąc do szkoły, padał deszcz” (deszcz nie szedł). Poprawnie: „Kiedy szedłem do szkoły, padał deszcz” albo „Idąc do szkoły, zmokłem”. Też błędnie: „Wchodząc do klasy, zadzwonił dzwonek”, „Przeczytawszy książkę, spodobała mi się”, zdania bezosobowe: „Jadąc pociągiem, było mi zimno”.\n9. Przymiotnikowe odmieniają się (czytający, czytającego, czytającej, czytającym), przysłówkowe się nie zmieniają.\n\nKARTA PRACY Z ZESZYTU (czasownik: czynny | bierny | współczesny | uprzedni; X = brak formy)\n- myć: myjący | myty | myjąc | X\n- świecić: świecący | X | świecąc | X\n- dostawić: X | dostawiony | X | dostawiwszy\n- wykonywać/wykonać: wykonujący | wykonywany/wykonany | wykonując | wykonawszy\n- siedzieć: siedzący | X | siedząc | X\n- przestraszyć: X | przestraszony | X | przestraszywszy\n- dołączyć: X | dołączony | X | dołączywszy\n- rodzić/urodzić: rodzący | rodzony/urodzony | rodząc | urodziwszy\n- malować: malujący | malowany | malując | X\n- utyć: X | X | X | utywszy\nPrzy parach (wykonywać/wykonać, rodzić/urodzić) bierny ma dwie formy: wykonywany/wykonany, rodzony/urodzony; czynny i współczesny od niedokonanego, uprzedni od dokonanego.\n\nDODATKOWE CZASOWNIKI (trening tabeli)\n- czytać: czytający | czytany | czytając | X\n- przeczytać: X | przeczytany | X | przeczytawszy\n- pisać: piszący | pisany | pisząc | X\n- napisać: X | napisany | X | napisawszy\n- iść: idący | X | idąc | X\n- przyjść: X | X | X | przyszedłszy\n- spać: śpiący | X | śpiąc | X\n- biec: biegnący | X | biegnąc | X\n- budować: budujący | budowany | budując | X\n- zbudować: X | zbudowany | X | zbudowawszy\n- nieść: niosący | niesiony | niosąc | X\n- przynieść: X | przyniesiony | X | przyniósłszy\n- robić: robiący | robiony | robiąc | X\n- zrobić: X | zrobiony | X | zrobiwszy\n- kochać: kochający | kochany | kochając | X\n- otwierać: otwierający | otwierany | otwierając | X\n- otworzyć: X | otwarty | X | otworzywszy\n- umyć: X | umyty | X | umywszy\n- śmiać się: śmiejący się | X | śmiejąc się | X\n- jeść: jedzący | jedzony | jedząc | X\n- zjeść: X | zjedzony | X | zjadłszy\n- pić: pijący | pity | pijąc | X\n- wypić: X | wypity | X | wypiwszy\n- zamknąć: X | zamknięty | X | zamknąwszy\n- wrócić: X | X | X | wróciwszy\n- usiąść: X | X | X | usiadłszy\n- płakać: płaczący | X | płacząc | X\n- kupować: kupujący | kupowany | kupując | X\n- kupić: X | kupiony | X | kupiwszy\n\nJAK POMAGAĆ\n- Gdy uczeń się myli w tabeli, zapytaj: „Czy to co robić, czy co zrobić?” i „Czy da się powiedzieć … kogo? co?”.\n- Przy uprzednim każ najpierw powiedzieć czas przeszły „on …ł”.\n- Przy przecinkach każ znaleźć cały równoważnik (imiesłów + wyrazy zależne).\n- Przy błędzie podmiotu zapytaj: „Kto wykonuje czynność z imiesłowu? A kto jest podmiotem zdania?”.\n", "layout": "steps5"}, "diagnostic": [{"id": "d1", "type": "mc", "tag": "l1", "q": "Który wyraz to imiesłów przymiotnikowy czynny?", "options": ["czytając", "przeczytawszy", "czytany", "czytający"], "answer": 3, "explain": "**Czytający** – od „oni czytają” + -cy, odpowiada na pytanie jaki? i opisuje kogoś, kto sam czyta."}, {"id": "d2", "type": "mc", "tag": "l1", "q": "Jak brzmi imiesłów przysłówkowy uprzedni od „przynieść”?", "options": ["przyniósłszy", "przynieśwszy", "przyniósszy", "przyniesłszy"], "answer": 0, "explain": "Czas przeszły: **przyniósł** – kończy się spółgłoską, więc dodajemy -szy do całego „przyniósł”: **przyniósłszy**."}, {"id": "d3", "type": "mc", "tag": "l2", "q": "Którego imiesłowu NIE da się utworzyć od czasownika „siedzieć”?", "options": ["biernego", "czynnego", "współczesnego", "wszystkie się da"], "answer": 0, "explain": "Siedzieć jest **nieprzechodni** (nie „siedzieć coś”), więc nie ma biernego. Ma: siedzący, siedząc."}, {"id": "d4", "type": "mc", "tag": "l3", "q": "Która pisownia jest poprawna?", "options": ["nieczytając, nieumyty", "nie czytając, nie umyty", "nie czytając, nieumyty", "nieczytając, nie umyty"], "answer": 2, "explain": "Przysłówkowy z „nie” **osobno** (nie czytając), przymiotnikowy **łącznie** (nieumyty)."}, {"id": "d5", "type": "mc", "tag": "l4", "q": "Które zdanie jest poprawne?", "options": ["Idąc do szkoły spotkałem kolegę.", "Idąc do szkoły, zrobiło się zimno.", "Idąc do szkoły, padał deszcz.", "Idąc do szkoły, spotkałem kolegę."], "answer": 3, "explain": "Tylko w pierwszym ten sam podmiot (ja idę, ja spotykam) **i** jest przecinek. W drugim „deszcz szedł”, w trzecim brak przecinka, w czwartym zdanie bezosobowe."}], "lessons": [{"id": "l1", "title": "Cztery imiesłowy – jak je tworzyć", "minutes": 20, "body": ["**Imiesłów** to forma czasownika, która zachowuje się jak przymiotnik albo jak przysłówek. Są **dwa przymiotnikowe** (czynny i bierny) i **dwa przysłówkowe** (współczesny i uprzedni).", "**Imiesłów przymiotnikowy czynny** – mówi o kimś/czymś, kto **sam wykonuje czynność** (pytanie: jaki? – „co robiący?”). Tworzymy go od **3 osoby liczby mnogiej czasu teraźniejszego + -cy (-ca, -ce)**: czytają → **czytający**, piszą → **piszący**, śpią → **śpiący**, idą → **idący**. Powstaje **tylko od czasowników niedokonanych** (bo tylko one mają czas teraźniejszy).", "**Imiesłów przymiotnikowy bierny** – mówi o kimś/czymś, **na kim czynność jest wykonywana**: czytana książka (ktoś ją czyta). Przyrostki: **-ny** (czytany, malowany, kochany), **-ony** (niesiony, zrobiony, dołączony), **-ty** (myty, pity, otwarty, zamknięty). Powstaje **tylko od czasowników przechodnich** – takich, które łączą się z dopełnieniem w **bierniku** (kogo? co?): czytam **książkę** → czytana. Może być od **niedokonanych i dokonanych**: wykonywany i wykonany.", "**Imiesłów przysłówkowy współczesny** – czynność dzieje się **w tym samym czasie** co czynność orzeczenia: „Czytając, piłem herbatę.” Tworzymy go od **3 os. lm czasu teraźniejszego + -c**: czytają → **czytając**, myją → **myjąc**, biegną → **biegnąc**. **Tylko od niedokonanych.**", "**Imiesłów przysłówkowy uprzedni** – czynność odbyła się **wcześniej** niż czynność orzeczenia: „Przeczytawszy list, schowałem go.” Tworzymy go od **czasu przeszłego (on)**: gdy temat kończy się samogłoską → **-wszy** (przeczytał → przeczytawszy, zrobił → zrobiwszy, utył → utywszy); gdy spółgłoską → **-łszy** (przyniósł → **przyniósłszy**, przyszedł → **przyszedłszy**, zjadł → zjadłszy, usiadł → usiadłszy). **Tylko od dokonanych.**", "Trik: najpierw powiedz „**oni …**” (czytają, piszą, śpią) – od tego zrobisz czynny (+cy) i współczesny (+c). Potem „**on …ł**” od dokonanego (przeczytał, przyniósł) – od tego zrobisz uprzedni."], "keyPoints": ["czynny: oni czytają + -cy → czytający (tylko niedokonane)", "bierny: -ny/-ony/-ty (tylko przechodnie, oba aspekty)", "współczesny: oni czytają + -c → czytając (tylko niedokonane)", "uprzedni: przeczytał → -wszy, przyniósł → -łszy (tylko dokonane)"], "table": {"columns": ["imiesłów", "jak tworzymy", "przykład", "od jakich czasowników", "odmiana"], "rows": [["przymiotnikowy **czynny**", "3 os. lm cz. teraźn. + **-cy** (-ca, -ce)", "czytają → czytający", "tylko **niedokonane**", "odmienny (jak przymiotnik)"], ["przymiotnikowy **bierny**", "**-ny / -ony / -ty**", "czytany, niesiony, myty", "tylko **przechodnie** (oba aspekty)", "odmienny (jak przymiotnik)"], ["przysłówkowy **współczesny**", "3 os. lm cz. teraźn. + **-c**", "czytają → czytając", "tylko **niedokonane**", "nieodmienny"], ["przysłówkowy **uprzedni**", "cz. przeszły: **-wszy / -łszy**", "przeczytał → przeczytawszy; przyniósł → przyniósłszy", "tylko **dokonane**", "nieodmienny"]]}, "why": [{"q": "Od jakiej formy tworzymy imiesłów przymiotnikowy czynny i przysłówkowy współczesny?", "a": "Od 3 osoby liczby mnogiej czasu teraźniejszego (oni czytają) + -cy albo + -c: czytający, czytając."}, {"q": "Dlaczego „czytający” ma -cy, a „czytając” -c?", "a": "Oba robimy od „oni czytają”. Przymiotnikowy (jaki?) dostaje **-cy** i odmienia się (czytająca, czytającego), przysłówkowy (jak? kiedy?) dostaje tylko **-c** i się nie zmienia."}, {"q": "Kiedy uprzedni ma -wszy, a kiedy -łszy?", "a": "Patrz na czas przeszły „on”: **przeczytał** (przed ł samogłoska) → przeczyta**wszy**; **przyniósł**, **przyszedł** (przed ł spółgłoska) → przyniósł**szy**, przyszedł**szy** – zostawiamy całe „-ł” i dodajemy „-szy”."}], "tldr": {"pl": "Czynny: oni czytają + -cy → czytający (niedokonane). Bierny: -ny/-ony/-ty → czytany, niesiony, myty (przechodnie). Współczesny: oni czytają + -c → czytając (niedokonane). Uprzedni: przeczytał → przeczytawszy, przyniósł → przyniósłszy (dokonane).", "en": "Active adjectival participle: 3rd person plural present + -cy (imperfective verbs only). Passive: -ny/-ony/-ty (transitive verbs, both aspects). Contemporary adverbial: 3rd pl. present + -c (imperfective). Anterior adverbial: past tense + -wszy/-łszy (perfective only).", "ru": "Действительное причастие: 3 л. мн. ч. наст. вр. + -cy (только несов. вид). Страдательное: -ny/-ony/-ty (только переходные, оба вида). Деепричастие одновременности: 3 л. мн. ч. + -c (несов.). Деепричастие предшествования: прош. вр. + -wszy/-łszy (только сов. вид)."}}, {"id": "l2", "title": "Dlaczego w tabeli są X – aspekt i przechodniość", "minutes": 15, "body": ["W tabeli wpisujemy **X** (albo „–”), gdy danej formy **nie ma w języku**. O tym decydują dwie rzeczy: **aspekt** czasownika i to, czy jest **przechodni**.", "**Aspekt.** Czasownik **niedokonany** odpowiada na pytanie „co robić?” (myć, czytać, siedzieć) – ma czas teraźniejszy, więc ma **czynny** i **współczesny**, ale **nie ma uprzedniego**. Czasownik **dokonany** odpowiada na „co zrobić?” (umyć, przeczytać, dostawić) – nie ma czasu teraźniejszego, więc **nie ma czynnego ani współczesnego**, ale **ma uprzedni**.", "**Przechodniość.** Czasownik **przechodni** łączy się z dopełnieniem w bierniku: myć **co?** naczynia, przestraszyć **kogo?** kota, dołączyć **co?** zdjęcie → ma **bierny** (myty, przestraszony, dołączony). Czasownik **nieprzechodni** nie ma takiego dopełnienia: siedzieć, świecić, spać, iść, przyjść, utyć, śmiać się → **nie ma biernego**.", "Przykład z karty pracy: **utyć** jest dokonany (brak czynnego i współczesnego) i nieprzechodni (brak biernego) – zostaje tylko **utywszy**. **Siedzieć** jest niedokonany i nieprzechodni – ma tylko siedzący i siedząc.", "Pary aspektowe (wykonywać/wykonać, rodzić/urodzić) dzielą się formami: czynny i współczesny bierzemy od niedokonanego (wykonujący, wykonując), uprzedni od dokonanego (wykonawszy), a bierny od obu (wykonywany, wykonany).", "Szybki test: 1) „Co robić” czy „co zrobić”? 2) Czy mogę powiedzieć „… **kogo? co?**” (myję naczynia – tak; siedzę krzesło – nie)? Z tych dwóch odpowiedzi od razu wiesz, gdzie wpisać X."], "keyPoints": ["niedokonany: jest czynny i współczesny, brak uprzedniego", "dokonany: jest uprzedni, brak czynnego i współczesnego", "nieprzechodni (bez biernika): brak biernego", "bierny – od obu aspektów, jeśli czasownik jest przechodni"], "why": [{"q": "Dlaczego czasownik „siedzieć” nie ma imiesłowu biernego i uprzedniego?", "a": "Bo jest nieprzechodni (nie łączy się z biernikiem) – brak biernego, i niedokonany – brak uprzedniego."}, {"q": "Skąd wiem, że czasownik jest przechodni?", "a": "Spróbuj dodać **kogo? co?** w bierniku: myję **naczynia** – tak, przechodni. Siedzę… **krzesło**? – nie, nieprzechodni. Przechodni da się też zamienić na stronę bierną: naczynia są **myte**."}], "tldr": {"pl": "X = forma nie istnieje. Dokonany → brak czynnego i współczesnego. Niedokonany → brak uprzedniego. Nieprzechodni (bez biernika) → brak biernego.", "en": "X = the form does not exist. Perfective verbs have no active participle and no contemporary adverbial; imperfective verbs have no anterior adverbial; intransitive verbs (no accusative object) have no passive participle.", "ru": "X = такой формы нет. У совершенного вида нет действительного причастия и деепричастия на -c; у несовершенного нет формы на -wszy; у непереходных глаголов нет страдательного причастия."}}, {"id": "l3", "title": "Pisownia „nie” i odmiana imiesłowów", "minutes": 10, "body": ["**Imiesłowy przymiotnikowe** (czynne i bierne) **odmieniają się jak przymiotniki** – przez przypadki, liczby i rodzaje: czytający chłopiec, czytającej dziewczyny, czytające dzieci; umyty talerz, umytą szklankę, umyte okna.", "**Imiesłowy przysłówkowe** (współczesne i uprzednie) **są nieodmienne** – jak przysłówki: czytając, przeczytawszy (zawsze tak samo).", "**„Nie” z imiesłowami przymiotnikowymi piszemy łącznie**: niemyty, nieczytający, nieprzeczytany, niepalący, niezauważony. Od 1 stycznia 2026 r. **zawsze łącznie, bez wyjątków** – nawet gdy jest przeciwstawienie (to list nieprzeczytany, lecz tylko przejrzany).", "**„Nie” z imiesłowami przysłówkowymi piszemy osobno**: nie czytając, nie wiedząc, nie przeczytawszy, nie zauważywszy.", "Skojarzenie: przymiotnikowe zachowują się jak **przymiotniki** (nieładny → **niemyty**), przysłówkowe jak **czasowniki** (nie czytam → **nie czytając**)."], "keyPoints": ["przymiotnikowe odmieniają się jak przymiotniki", "przysłówkowe są nieodmienne", "nie + przymiotnikowy = łącznie (niemyty, nieczytający)", "nie + przysłówkowy = osobno (nie czytając, nie przeczytawszy)"], "why": [{"q": "Jak napiszesz: (nie)umyte okna, (nie)wiedząc, (nie)przeczytawszy, (nie)palący?", "a": "nieumyte okna, nie wiedząc, nie przeczytawszy, niepalący."}, {"q": "Czy można jeszcze pisać „nie czytany” osobno?", "a": "Nie. Od 1 stycznia 2026 r. „nie” z imiesłowami przymiotnikowymi piszemy **zawsze łącznie**: nieczytany, nieprzeczytany – także w przeciwstawieniach."}], "tldr": {"pl": "Przymiotnikowe odmieniają się jak przymiotniki i piszemy je z „nie” łącznie (niemyty). Przysłówkowe są nieodmienne i piszemy je z „nie” osobno (nie czytając).", "en": "Adjectival participles decline like adjectives and are written together with 'nie' (niemyty). Adverbial participles never change and are written separately from 'nie' (nie czytając).", "ru": "Причастия склоняются как прилагательные и пишутся с „nie” слитно (niemyty). Деепричастия не изменяются и пишутся с „nie” раздельно (nie czytając)."}}, {"id": "l4", "title": "Imiesłowowy równoważnik zdania – przecinki i ten sam podmiot", "minutes": 15, "body": ["**Imiesłowowy równoważnik zdania** to imiesłów przysłówkowy (współczesny lub uprzedni) razem z wyrazami, które od niego zależą: „wracając ze szkoły”, „zjadłszy obiad”. Zastępuje całe zdanie podrzędne: „Kiedy wracałem ze szkoły, …” → „Wracając ze szkoły, …”", "**Przecinki:** równoważnik **oddzielamy przecinkiem** od reszty zdania. Na początku: „Zjadłszy obiad, odrobiłem lekcje.” Na końcu: „Odrobiłem lekcje, słuchając muzyki.” W środku – **przecinki z obu stron**: „Tomek, zobaczywszy psa, uśmiechnął się.”", "**Zasada tego samego podmiotu:** czynność z równoważnika musi wykonywać **ten sam ktoś**, kto jest podmiotem zdania głównego. „Idąc do szkoły, spotkałem kolegę” – idę ja i spotykam ja ✅.", "**Błąd:** „Idąc do szkoły, padał deszcz.” ❌ – wychodzi na to, że to **deszcz szedł do szkoły**. Poprawnie: „Kiedy szedłem do szkoły, padał deszcz.” albo „Idąc do szkoły, zmokłem.”", "Inne typowe błędy: „Wchodząc do klasy, zadzwonił dzwonek” ❌ (dzwonek nie wchodził) → „Kiedy wchodziłem do klasy, zadzwonił dzwonek.” „Przeczytawszy książkę, spodobała mi się” ❌ (książka nie czytała) → „Przeczytawszy książkę, polubiłem ją” / „Kiedy przeczytałem książkę, spodobała mi się.”", "Równoważnika **nie używamy** też w zdaniach **bez podmiotu** (bezosobowych): „Jadąc pociągiem, było mi zimno” ❌ → „Kiedy jechałem pociągiem, było mi zimno.”", "Kolejność czynności: **współczesny** = w tym samym czasie („Czytając, jadł”), **uprzedni** = najpierw jedno, potem drugie („Przeczytawszy, zamknął książkę”)."], "keyPoints": ["równoważnik = imiesłów przysłówkowy + wyrazy od niego zależne", "oddzielamy go przecinkiem (w środku – z obu stron)", "ten sam wykonawca czynności w równoważniku i w zdaniu głównym", "błąd: „Idąc do szkoły, padał deszcz” – deszcz nie szedł"], "why": [{"q": "Popraw zdanie: „Wchodząc do klasy, zadzwonił dzwonek”.", "a": "Kiedy wchodziłem do klasy, zadzwonił dzwonek. (albo: Wchodząc do klasy, usłyszałem dzwonek.)"}, {"q": "Czy każdy imiesłów przysłówkowy oddzielamy przecinkiem?", "a": "Tak, gdy tworzy imiesłowowy równoważnik zdania – czyli w praktyce prawie zawsze: „Siedząc, czytałem.” „Czytałem, siedząc przy oknie.”"}], "tldr": {"pl": "Imiesłowowy równoważnik zdania oddzielamy przecinkiem (w środku – z obu stron). Czynność w równoważniku i w zdaniu głównym wykonuje ta sama osoba. Błąd: „Idąc do szkoły, padał deszcz”.", "en": "A participial phrase is separated by commas (on both sides if in the middle). Its action must be done by the same subject as the main clause. Error: 'Idąc do szkoły, padał deszcz' (the rain did not walk to school).", "ru": "Деепричастный оборот выделяется запятыми. Действие оборота и главного предложения выполняет один и тот же субъект. Ошибка: „Idąc do szkoły, padał deszcz” (дождь не шёл в школу)."}}], "flashcards": [{"front": "Imiesłów przymiotnikowy czynny – jak go tworzymy?", "back": "3 os. lm czasu teraźniejszego + **-cy** (-ca, -ce): czytają → czytający. Tylko od niedokonanych.", "tag": "l1"}, {"front": "Imiesłów przymiotnikowy bierny – jak go tworzymy?", "back": "Przyrostki **-ny, -ony, -ty**: czytany, niesiony, myty. Tylko od przechodnich, od obu aspektów.", "tag": "l1"}, {"front": "Imiesłów przysłówkowy współczesny – jak go tworzymy?", "back": "3 os. lm czasu teraźniejszego + **-c**: czytają → czytając. Tylko od niedokonanych.", "tag": "l1"}, {"front": "Imiesłów przysłówkowy uprzedni – jak go tworzymy?", "back": "Od czasu przeszłego: **-wszy** po samogłosce (przeczytał → przeczytawszy), **-łszy** po spółgłosce (przyniósł → przyniósłszy). Tylko od dokonanych.", "tag": "l1"}, {"front": "przynieść → imiesłów uprzedni?", "back": "**przyniósłszy** (przyniósł + -szy; „ó” zostaje)", "tag": "l1"}, {"front": "przyjść → imiesłów uprzedni?", "back": "**przyszedłszy** (przyszedł + -szy)", "tag": "l1"}, {"front": "zjeść → imiesłów uprzedni?", "back": "**zjadłszy** (zjadł + -szy)", "tag": "l1"}, {"front": "spać → czynny i współczesny?", "back": "**śpiący, śpiąc** (od: oni śpią)", "tag": "l1"}, {"front": "nieść → czynny, bierny, współczesny?", "back": "**niosący, niesiony, niosąc**", "tag": "l1"}, {"front": "otworzyć → bierny i uprzedni?", "back": "**otwarty, otworzywszy**", "tag": "l1"}, {"front": "biec → czynny i współczesny?", "back": "**biegnący, biegnąc** (oni biegną)", "tag": "l1"}, {"front": "Którego imiesłowu NIE MA czasownik niedokonany?", "back": "**Uprzedniego** (-wszy/-łszy). Ma za to czynny i współczesny.", "tag": "l2"}, {"front": "Których imiesłowów NIE MA czasownik dokonany?", "back": "**Czynnego** (-cy) i **współczesnego** (-c), bo nie ma czasu teraźniejszego.", "tag": "l2"}, {"front": "Którego imiesłowu nie ma czasownik nieprzechodni (np. siedzieć, spać)?", "back": "**Biernego** – nie łączy się z biernikiem (kogo? co?).", "tag": "l2"}, {"front": "utyć – jakie imiesłowy?", "back": "Tylko **utywszy**. Dokonany (brak czynnego i współczesnego) i nieprzechodni (brak biernego).", "tag": "l2"}, {"front": "myć – jakie imiesłowy?", "back": "**myjący, myty, myjąc**; uprzedniego brak (umywszy jest od umyć).", "tag": "l2"}, {"front": "świecić – dlaczego nie ma biernego?", "back": "Bo jest **nieprzechodni** – słońce świeci, nie „świeci coś”.", "tag": "l2"}, {"front": "„nie” + imiesłów przymiotnikowy", "back": "**Łącznie**: niemyty, nieczytający, nieprzeczytany (od 2026 r. zawsze).", "tag": "l3"}, {"front": "„nie” + imiesłów przysłówkowy", "back": "**Osobno**: nie czytając, nie wiedząc, nie przeczytawszy.", "tag": "l3"}, {"front": "Które imiesłowy się odmieniają?", "back": "**Przymiotnikowe** (czynne i bierne) – jak przymiotniki. Przysłówkowe są nieodmienne.", "tag": "l3"}, {"front": "Co to jest imiesłowowy równoważnik zdania?", "back": "Imiesłów przysłówkowy z wyrazami od niego zależnymi, np. „wróciwszy do domu”, „czytając książkę”. Zastępuje zdanie podrzędne.", "tag": "l4"}, {"front": "Przecinki przy imiesłowowym równoważniku zdania", "back": "Oddzielamy go przecinkiem; w środku zdania – **z obu stron**: „Ola, zobaczywszy psa, uciekła.”", "tag": "l4"}, {"front": "Co jest źle: „Idąc do szkoły, padał deszcz”?", "back": "Inny podmiot! Wychodzi, że deszcz szedł do szkoły. Poprawnie: „Kiedy szedłem do szkoły, padał deszcz.”", "tag": "l4"}, {"front": "Współczesny czy uprzedni: „Zjadłszy obiad, wyszedł”?", "back": "**Uprzedni** – najpierw zjadł, potem wyszedł.", "tag": "l4"}], "tableDrill": {"title": "Tabela imiesłowów – trening", "setSize": 5, "columns": ["CZASOWNIK", "imiesłów przymiotnikowy czynny", "imiesłów przymiotnikowy bierny", "imiesłów przysłówkowy współczesny", "imiesłów przysłówkowy uprzedni"], "rows": [{"head": "czytać", "cells": ["czytający", "czytany", "czytając", "X"], "note": "Niedokonany, przechodni (czytać **co?** książkę): czytają → czytający, czytając; czytany. Uprzedni tylko od **przeczytać**."}, {"head": "przeczytać", "cells": ["X", "przeczytany", "X", "przeczytawszy"], "note": "Dokonany: brak czynnego i współczesnego. Przeczytał → **przeczytawszy**; przeczytany."}, {"head": "pisać", "cells": ["piszący", "pisany", "pisząc", "X"], "note": "Niedokonany: piszą → **piszący, pisząc**; przechodni → pisany. Brak uprzedniego."}, {"head": "napisać", "cells": ["X", "napisany", "X", "napisawszy"], "note": "Dokonany: tylko bierny (napisany) i uprzedni (napisał → **napisawszy**)."}, {"head": "iść", "cells": ["idący", "X", "idąc", "X"], "note": "Niedokonany i **nieprzechodni** (nie „iść coś”) → brak biernego; brak uprzedniego. Idą → idący, idąc."}, {"head": "przyjść", "cells": ["X", "X", "X", "przyszedłszy"], "note": "Dokonany i nieprzechodni → tylko uprzedni. Czas przeszły **przyszedł** kończy się spółgłoską → **-łszy**: **przyszedłszy**."}, {"head": "spać", "cells": ["śpiący", "X", "śpiąc", "X"], "note": "Niedokonany, nieprzechodni. 3 os. lm: **śpią** → śpiący, śpiąc (nie „spiący”)."}, {"head": "biec", "cells": ["biegnący", "X", "biegnąc", "X"], "note": "Niedokonany, nieprzechodni. 3 os. lm: **biegną** → biegnący, biegnąc."}, {"head": "budować", "cells": ["budujący", "budowany", "budując", "X"], "note": "Niedokonany, przechodni: budują → budujący, budując; budowany."}, {"head": "zbudować", "cells": ["X", "zbudowany", "X", "zbudowawszy"], "note": "Dokonany: zbudowany; zbudował → **zbudowawszy**."}, {"head": "nieść", "cells": ["niosący", "niesiony", "niosąc", "X"], "note": "Niedokonany: **niosą** → niosący, niosąc; bierny **niesiony** (-ony)."}, {"head": "przynieść", "cells": ["X", "przyniesiony", "X", "przyniósłszy"], "note": "Dokonany: przyniesiony; czas przeszły **przyniósł** (spółgłoska) → **przyniósłszy** – „ó” zostaje!"}, {"head": "robić", "cells": ["robiący", "robiony", "robiąc", "X"], "note": "Niedokonany, przechodni: robią → robiący, robiąc; robiony."}, {"head": "zrobić", "cells": ["X", "zrobiony", "X", "zrobiwszy"], "note": "Dokonany: zrobiony; zrobił → **zrobiwszy**."}, {"head": "kochać", "cells": ["kochający", "kochany", "kochając", "X"], "note": "Niedokonany, przechodni (kochać **kogo?**): kochający, kochany, kochając."}, {"head": "otwierać", "cells": ["otwierający", "otwierany", "otwierając", "X"], "note": "Niedokonany: otwierają → otwierający, otwierając; otwierany."}, {"head": "otworzyć", "cells": ["X", "otwarty", "X", "otworzywszy"], "note": "Dokonany: bierny z **-ty**: **otwarty**; otworzył → **otworzywszy**."}, {"head": "umyć", "cells": ["X", "umyty", "X", "umywszy"], "note": "Dokonany (para do myć): umyty (-ty); umył → **umywszy**."}, {"head": "śmiać się", "cells": ["śmiejący się", "X", "śmiejąc się", "X"], "note": "Niedokonany, zwrotny i **nieprzechodni** → brak biernego. „się” zostaje: **śmiejący się, śmiejąc się**."}, {"head": "jeść", "cells": ["jedzący", "jedzony", "jedząc", "X"], "note": "Niedokonany: **jedzą** → jedzący, jedząc; jedzony."}, {"head": "zjeść", "cells": ["X", "zjedzony", "X", "zjadłszy"], "note": "Dokonany: zjedzony; czas przeszły **zjadł** → **zjadłszy**."}, {"head": "pić", "cells": ["pijący", "pity", "pijąc", "X"], "note": "Niedokonany: piją → pijący, pijąc; bierny z **-ty**: pity."}, {"head": "wypić", "cells": ["X", "wypity", "X", "wypiwszy"], "note": "Dokonany: wypity; wypił → **wypiwszy**."}, {"head": "zamknąć", "cells": ["X", "zamknięty", "X", "zamknąwszy"], "note": "Dokonany: **zamknięty** (-ty); zamknął → **zamknąwszy**."}, {"head": "wrócić", "cells": ["X", "X", "X", "wróciwszy"], "note": "Dokonany i nieprzechodni (nie „wrócić coś”; „zwrócić książkę” to inny czasownik) → tylko **wróciwszy**."}, {"head": "usiąść", "cells": ["X", "X", "X", "usiadłszy"], "note": "Dokonany, nieprzechodni. Czas przeszły **usiadł** → **usiadłszy**."}, {"head": "płakać", "cells": ["płaczący", "X", "płacząc", "X"], "note": "Niedokonany, nieprzechodni: **płaczą** → płaczący, płacząc."}, {"head": "kupować", "cells": ["kupujący", "kupowany", "kupując", "X"], "note": "Niedokonany, przechodni: kupują → kupujący, kupując; kupowany."}, {"head": "kupić", "cells": ["X", "kupiony", "X", "kupiwszy"], "note": "Dokonany: kupiony (-ony); kupił → **kupiwszy**."}], "intro": "29 nowych czasowników (inne niż w karcie pracy): pary dokonane i niedokonane, przechodnie i nieprzechodnie. Każda seria to 5 losowych czasowników; „Cała tabela” – wszystkie naraz. Najpierw zadaj sobie dwa pytania: **co robić czy co zrobić?** oraz **czy jest „kogo? co?”**."}, "quiz": [{"id": "q1", "type": "mc", "tag": "l1", "q": "Jaki to imiesłów? „Śpiący kot leżał na kanapie.” – wyraz **śpiący**", "options": ["przysłówkowy współczesny", "przymiotnikowy bierny", "przymiotnikowy czynny", "przysłówkowy uprzedni"], "answer": 2, "explain": "**Śpiący** = jaki kot? Ten, który sam śpi; od „oni śpią” + -cy → **przymiotnikowy czynny**."}, {"id": "q2", "type": "mc", "tag": "l1", "q": "Jaki to imiesłów? „Na stole leżała przeczytana gazeta.” – wyraz **przeczytana**", "options": ["przysłówkowy uprzedni", "przymiotnikowy czynny", "przymiotnikowy bierny", "przysłówkowy współczesny"], "answer": 2, "explain": "**Przeczytana** – ktoś ją przeczytał (czynność wykonana na gazecie), przyrostek -na → **przymiotnikowy bierny**."}, {"id": "q3", "type": "mc", "tag": "l1", "q": "Jaki to imiesłów? „Wracając ze szkoły, kupiłem bułki.” – wyraz **wracając**", "options": ["przysłówkowy współczesny", "przysłówkowy uprzedni", "przymiotnikowy czynny", "przymiotnikowy bierny"], "answer": 0, "explain": "**Wracając** – od „oni wracają” + -c; wracałem i w tym samym czasie kupiłem → **przysłówkowy współczesny**."}, {"id": "q4", "type": "mc", "tag": "l1", "q": "Jaki to imiesłów? „Zamknąwszy okno, usiadł do lekcji.” – wyraz **zamknąwszy**", "options": ["przymiotnikowy czynny", "przysłówkowy uprzedni", "przymiotnikowy bierny", "przysłówkowy współczesny"], "answer": 1, "explain": "**Zamknąwszy** – najpierw zamknął, potem usiadł; od „zamknął” + -wszy → **przysłówkowy uprzedni**."}, {"id": "q5", "type": "mc", "tag": "l1", "q": "Jaki to imiesłów? „Umyte naczynia stały na suszarce.” – wyraz **umyte**", "options": ["przysłówkowy uprzedni", "przymiotnikowy czynny", "przymiotnikowy bierny", "przysłówkowy współczesny"], "answer": 2, "explain": "**Umyte** – ktoś je umył; przyrostek **-te** (-ty) też tworzy imiesłów **bierny**."}, {"id": "q6", "type": "mc", "tag": "l1", "q": "Jaki to imiesłów? „Ola słuchała muzyki, odrabiając lekcje.” – wyraz **odrabiając**", "options": ["przysłówkowy uprzedni", "przysłówkowy współczesny", "przymiotnikowy czynny", "przymiotnikowy bierny"], "answer": 1, "explain": "**Odrabiając** – od „odrabiają” + -c, czynność w tym samym czasie co słuchanie → **współczesny**."}, {"id": "q7", "type": "mc", "tag": "l1", "q": "Jaki to imiesłów? „Przyszedłszy do domu, Tomek zdjął buty.” – wyraz **przyszedłszy**", "options": ["przysłówkowy współczesny", "przymiotnikowy czynny", "przysłówkowy uprzedni", "przymiotnikowy bierny"], "answer": 2, "explain": "**Przyszedłszy** – od „przyszedł” + -szy, czynność wcześniejsza → **uprzedni**."}, {"id": "q8", "type": "mc", "tag": "l1", "q": "Jaki to imiesłów? „Dzieci obserwowały biegnącego psa.” – wyraz **biegnącego**", "options": ["przymiotnikowy czynny", "przysłówkowy uprzedni", "przymiotnikowy bierny", "przysłówkowy współczesny"], "answer": 0, "explain": "**Biegnącego** – jakiego psa? Tego, który sam biegnie; to odmieniona forma (dopełniacz) imiesłowu **czynnego** biegnący."}, {"id": "q9", "type": "cat", "tag": "l1", "q": "Przyporządkuj imiesłowy do rodzajów.", "categories": ["przymiotnikowy czynny", "przymiotnikowy bierny", "przysłówkowy współczesny", "przysłówkowy uprzedni"], "items": [{"t": "piszący", "c": 0}, {"t": "niesiony", "c": 1}, {"t": "otwarty", "c": 1}, {"t": "idąc", "c": 2}, {"t": "myjąc", "c": 2}, {"t": "zjadłszy", "c": 3}, {"t": "kochający", "c": 0}, {"t": "napisawszy", "c": 3}], "explain": "Czynny: **-cy** (piszący, kochający). Bierny: **-ny/-ony/-ty** (niesiony, otwarty). Współczesny: **-c** (idąc, myjąc). Uprzedni: **-wszy/-łszy** (zjadłszy, napisawszy)."}, {"id": "q10", "type": "mc", "tag": "l1", "q": "Wybierz poprawny imiesłów uprzedni od „przynieść”.", "options": ["przyniesiwszy", "przynióswszy", "przyniesłszy", "przyniósłszy"], "answer": 3, "explain": "Czas przeszły **przyniósł** → dodajemy -szy: **przyniósłszy** („ó” zostaje, bo tak jest w „przyniósł”)."}, {"id": "q11", "type": "mc", "tag": "l1", "q": "Wybierz poprawny imiesłów przymiotnikowy czynny od „spać”.", "options": ["śpący", "spający", "spiący", "śpiący"], "answer": 3, "explain": "Oni **śpią** → śpią + -cy = **śpiący**."}, {"id": "q12", "type": "mc", "tag": "l1", "q": "Wybierz poprawny imiesłów bierny od „otworzyć”.", "options": ["otwarty", "otworzony", "otworzyty", "otwierający"], "answer": 0, "explain": "Od otworzyć bierny ma przyrostek -ty: **otwarty** (drzwi są otwarte). „Otwierający” to czynny od otwierać."}, {"id": "q13", "type": "mc", "tag": "l1", "q": "Wybierz poprawny imiesłów uprzedni od „przyjść”.", "options": ["przyszedłszy", "przyszedwszy", "przyjdąwszy", "przyszłszy"], "answer": 0, "explain": "Czas przeszły (on) **przyszedł** – po spółgłosce dodajemy -szy: **przyszedłszy**."}, {"id": "q14", "type": "mc", "tag": "l1", "q": "Wybierz poprawny imiesłów przymiotnikowy bierny od „nieść”.", "options": ["niosony", "niesięty", "nieśony", "niesiony"], "answer": 3, "explain": "Bierny od nieść ma przyrostek -ony: **niesiony** (np. niesiony plecak)."}, {"id": "q15", "type": "mc", "tag": "l1", "q": "Wybierz poprawny imiesłów przysłówkowy współczesny od „biec”.", "options": ["biegnąwszy", "biegąc", "biegnąc", "biecąc"], "answer": 2, "explain": "Oni **biegną** → biegną + -c = **biegnąc**."}, {"id": "q16", "type": "short", "tag": "l1", "q": "Utwórz imiesłów przysłówkowy uprzedni od czasownika **zjeść**.", "accept": ["zjadłszy"], "explain": "Czas przeszły **zjadł** (spółgłoska) → **zjadłszy**."}, {"id": "q17", "type": "short", "tag": "l1", "q": "Utwórz imiesłów przymiotnikowy czynny od czasownika **pisać**.", "accept": ["piszący"], "explain": "Oni **piszą** → piszą + -cy = **piszący**."}, {"id": "q18", "type": "short", "tag": "l1", "q": "Utwórz imiesłów przymiotnikowy bierny od czasownika **zamknąć**.", "accept": ["zamknięty"], "explain": "Bierny z przyrostkiem -ty: **zamknięty** (zamknięte drzwi)."}, {"id": "q19", "type": "mc", "tag": "l2", "q": "Który imiesłów da się utworzyć od czasownika „utyć”?", "options": ["bierny: utyty", "tylko uprzedni: utywszy", "tylko czynny: tyjący", "współczesny: utyjąc"], "answer": 1, "explain": "Utyć jest **dokonany** (brak czynnego i współczesnego) i **nieprzechodni** (brak biernego) → tylko **utywszy**."}, {"id": "q20", "type": "mc", "tag": "l2", "q": "Dlaczego od „przestraszyć” nie ma imiesłowu czynnego ani współczesnego?", "options": ["bo jest nieprzechodni", "bo jest zwrotny", "bo jest dokonany", "bo jest w czasie przeszłym"], "answer": 2, "explain": "Przestraszyć jest **dokonany** (co zrobić?) – nie ma czasu teraźniejszego, więc nie powstaną formy na -cy i -c."}, {"id": "q21", "type": "mc", "tag": "l2", "q": "Dlaczego od „spać” nie ma imiesłowu biernego?", "options": ["bo jest nieprzechodni", "bo jest dokonany", "bo jest niedokonany", "bo jest zbyt krótki"], "answer": 0, "explain": "Spać jest **nieprzechodni** – nie łączy się z biernikiem (nie „śpię coś”), więc nie ma biernego."}, {"id": "q22", "type": "tf", "tag": "l2", "q": "Czy ta forma istnieje? Oceń: prawda = forma poprawna i istnieje, fałsz = takiej formy nie ma.", "items": [{"s": "siedzący (od siedzieć)", "a": true}, {"s": "siedziany (od siedzieć)", "a": false}, {"s": "umywszy (od umyć)", "a": true}, {"s": "mywszy (od myć)", "a": false}, {"s": "dostawiający (od dostawić)", "a": false}, {"s": "świecony (od świecić)", "a": false}], "explain": "Siedzieć – niedokonany, nieprzechodni: jest **siedzący**, nie ma biernego. Uprzedni ma tylko dokonany: **umywszy** tak, „mywszy” nie. Dostawić jest dokonany → brak czynnego. Świecić jest nieprzechodni → brak biernego (święcony to od **święcić**)."}, {"id": "q23", "type": "multi", "tag": "l2", "q": "Zaznacz czasowniki, od których **nie** utworzysz imiesłowu biernego.", "options": ["siedzieć", "iść", "myć", "utyć", "dołączyć", "malować"], "answer": [0, 1, 3], "explain": "Bierny tworzą tylko **przechodnie** (z biernikiem): myć naczynia, dołączyć zdjęcie, malować obraz. Siedzieć, iść, utyć są nieprzechodnie."}, {"id": "q24", "type": "mc", "tag": "l2", "q": "Który czasownik ma imiesłów uprzedni?", "options": ["dołączyć", "malować", "świecić", "siedzieć"], "answer": 0, "explain": "Uprzedni tworzą tylko **dokonane**: dołączyć → **dołączywszy**. Pozostałe są niedokonane."}, {"id": "q25", "type": "mc", "tag": "l3", "q": "Wybierz poprawną pisownię: „Dzieci weszły do (nie)posprzątanego pokoju, (nie)wiedząc, co robić.”", "options": ["nieposprzątanego, niewiedząc", "nieposprzątanego, nie wiedząc", "nie posprzątanego, nie wiedząc", "nie posprzątanego, niewiedząc"], "answer": 1, "explain": "Przymiotnikowy (nieposprzątany) – **łącznie**, przysłówkowy (nie wiedząc) – **osobno**."}, {"id": "q26", "type": "tf", "tag": "l3", "q": "Oceń pisownię.", "items": [{"s": "niepalący wagon", "a": true}, {"s": "nie przeczytawszy lektury", "a": true}, {"s": "niezauważając błędu", "a": false}, {"s": "nie umyte okna", "a": false}, {"s": "nieumyte okna", "a": true}], "explain": "Z przymiotnikowymi łącznie: niepalący, nieumyte. Z przysłówkowymi osobno: nie przeczytawszy, **nie zauważając**. „Nie umyte” osobno to błąd – od 2026 r. zawsze łącznie."}, {"id": "q27", "type": "mc", "tag": "l3", "q": "Które zdanie jest prawdziwe?", "options": ["Żaden imiesłów się nie odmienia.", "Imiesłowy przymiotnikowe odmieniają się, przysłówkowe nie.", "Imiesłowy przysłówkowe odmieniają się, przymiotnikowe nie.", "Wszystkie imiesłowy się odmieniają."], "answer": 1, "explain": "Przymiotnikowe odmieniają się jak przymiotniki (czytający, czytającego, czytającej), przysłówkowe są nieodmienne (czytając)."}, {"id": "q28", "type": "mc", "tag": "l3", "q": "Uzupełnij odmienioną formę: „Przyglądałem się (bawiący się) dzieciom.”", "options": ["bawiący się", "bawiąc się", "bawiących się", "bawiącym się"], "answer": 3, "explain": "Komu? czemu? dzieciom → celownik lm: **bawiącym się**. Imiesłów przymiotnikowy odmienia się jak przymiotnik (zgadza się z rzeczownikiem)."}, {"id": "q29", "type": "mc", "tag": "l4", "q": "Które zdanie ma poprawne przecinki?", "options": ["Babcia, usłyszawszy dzwonek otworzyła drzwi.", "Babcia, usłyszawszy dzwonek, otworzyła drzwi.", "Babcia usłyszawszy dzwonek, otworzyła drzwi.", "Babcia usłyszawszy dzwonek otworzyła drzwi."], "answer": 1, "explain": "Równoważnik w środku zdania oddzielamy przecinkami **z obu stron**."}, {"id": "q30", "type": "mc", "tag": "l4", "q": "Gdzie postawić przecinek? „Odrabiałem lekcje słuchając muzyki.”", "options": ["Odrabiałem lekcje, słuchając muzyki.", "Odrabiałem, lekcje słuchając muzyki.", "Przecinek nie jest potrzebny.", "Odrabiałem lekcje słuchając, muzyki."], "answer": 0, "explain": "Równoważnik **słuchając muzyki** oddzielamy przecinkiem od reszty zdania."}, {"id": "q31", "type": "mc", "tag": "l4", "q": "Które zdanie jest **błędne** (inny wykonawca czynności)?", "options": ["Wchodząc do klasy, zadzwonił dzwonek.", "Wchodząc do klasy, usłyszałem dzwonek.", "Zjadłszy śniadanie, Ania wyszła.", "Czytając książkę, Ola się uśmiechała."], "answer": 0, "explain": "W „Wchodząc do klasy, zadzwonił dzwonek” podmiotem jest **dzwonek** – wychodzi, że to on wchodził do klasy. Poprawnie: „Kiedy wchodziłem do klasy, zadzwonił dzwonek.”"}, {"id": "q32", "type": "mc", "tag": "l4", "q": "Jak poprawić zdanie „Idąc do szkoły, padał deszcz”?", "options": ["Idąc do szkoły padał deszcz.", "Kiedy szedłem do szkoły, padał deszcz.", "Idąc do szkoły, padał deszcz na mnie.", "Padał deszcz, idąc do szkoły."], "answer": 1, "explain": "Trzeba zamienić równoważnik na zdanie z własnym podmiotem (**Kiedy szedłem…**), bo deszcz nie mógł iść do szkoły. Przestawienie członów nie pomaga."}, {"id": "q33", "type": "tf", "tag": "l4", "q": "Czy zdanie jest poprawne (ten sam wykonawca + przecinki)?", "items": [{"s": "Zrobiwszy zadanie, poszedłem na boisko.", "a": true}, {"s": "Jadąc rowerem, było mi gorąco.", "a": false}, {"s": "Przeczytawszy książkę, spodobała mi się.", "a": false}, {"s": "Kasia, myjąc naczynia, nuciła piosenkę.", "a": true}], "explain": "„Jadąc rowerem, było mi gorąco” – zdanie bezosobowe, nie ma kto jechać. „Przeczytawszy książkę, spodobała mi się” – podmiotem jest książka, a ona nie czytała. Pozostałe są poprawne."}, {"id": "q34", "type": "mc", "tag": "l4", "q": "Zamień zdanie podrzędne na imiesłowowy równoważnik: „Kiedy Piotrek zjadł obiad, wyszedł z psem.”", "options": ["Zjadłszy obiad, Piotrek wyszedł z psem.", "Zjedzony obiad, Piotrek wyszedł z psem.", "Jedząc obiad, Piotrek wyszedł z psem.", "Zjadłszy obiad Piotrek wyszedł z psem."], "answer": 0, "explain": "Najpierw zjadł, potem wyszedł → **uprzedni** (zjadłszy) i przecinek. „Jedząc” znaczyłoby, że wychodził w trakcie jedzenia."}], "explainPrompts": [{"id": "e1", "tag": "l1", "prompt": "Wyjaśnij koledze, jak utworzyć cztery imiesłowy od czasowników czytać/przeczytać. Podaj formy.", "keyPoints": ["czynny: czytają + -cy → czytający", "bierny: czytany / przeczytany (-ny)", "współczesny: czytają + -c → czytając", "uprzedni: przeczytał → przeczytawszy"], "model": "Od „oni czytają” robię czynny, dodając -cy: czytający, i współczesny, dodając -c: czytając. Bierny tworzę przyrostkiem -ny: czytany (i od dokonanego: przeczytany). Uprzedni robię od czasu przeszłego dokonanego: przeczytał → przeczytawszy.", "kw": [["czytajacy"], ["czytany"], ["czytajac$"], ["przeczytawszy"]]}, {"id": "e2", "tag": "l2", "prompt": "Wyjaśnij, dlaczego czasownik „utyć” ma tylko jeden imiesłów.", "keyPoints": ["utyć jest dokonany", "dokonany nie ma czynnego ani współczesnego (brak czasu teraźniejszego)", "utyć jest nieprzechodni – brak biernego", "zostaje uprzedni: utywszy"], "model": "Utyć to czasownik dokonany (co zrobić?), więc nie ma czasu teraźniejszego – nie powstaną czynny ani współczesny. Jest też nieprzechodni (nie można „utyć coś”), więc nie ma biernego. Zostaje tylko uprzedni: utył → utywszy.", "kw": [["dokonan"], ["terazniej|czynn|wspolczes"], ["przechodn|biern|dopelnien"], ["utywszy"]]}, {"id": "e3", "tag": "l3", "prompt": "Wyjaśnij, kiedy „nie” z imiesłowem piszemy łącznie, a kiedy osobno. Podaj po dwa przykłady.", "keyPoints": ["z przymiotnikowymi łącznie", "przykłady: niemyty, nieczytający", "z przysłówkowymi osobno", "przykłady: nie wiedząc, nie przeczytawszy"], "model": "Imiesłowy przymiotnikowe (czynne i bierne) piszemy z „nie” łącznie, np. niemyty, nieczytający – od 2026 r. zawsze. Imiesłowy przysłówkowe piszemy z „nie” osobno, np. nie wiedząc, nie przeczytawszy.", "kw": [["przymiotnik+lacz|razem", "czynn|biern+lacz|razem"], ["niemyt|nieczyt|niepisan|nieprzecz|niezrob|nieznan|niezamk|nieumyt|nieuczon|niekochan|niewidz|nieswiec|niezjed|nieskon|niepalac|niegotow|niechcian|niespiac|nieuczac|niemyjac|niepiszac|niemowiac|nieidac|nieumiejac|nieznajac|niebiegn|niesluchaj|niejedz|niepij|niegraj|niezaplac|nieprzygot|nieposprz|niewyprasow|nieuprasow"], ["przyslowk+osobn|oddziel|rozdziel", "wspolczes|uprzedn+osobn"], ["^nie wiedzac|^nie majac|^nie czytajac$|^nie przeczytaw|^nie patrzac|^nie myslac|^nie zrobiw|^nie idac|^nie sluchaj|^nie mowiac|^nie pytajac|^nie czekajac|^nie znajac|^nie umiejac|^nie chcac|^nie mogac|^nie bedac|^nie piszac|^nie jedzac|^nie spiac|^nie myjac|^nie uczac|^nie biegnac", "^nie$+wszy$"]]}, {"id": "e4", "tag": "l4", "prompt": "Co jest nie tak w zdaniu „Idąc do szkoły, padał deszcz”? Popraw je na dwa sposoby.", "keyPoints": ["podmiotem zdania jest deszcz", "równoważnik musi mieć tego samego wykonawcę czynności", "poprawka: Kiedy szedłem do szkoły, padał deszcz.", "albo: Idąc do szkoły, zmokłem."], "model": "Podmiotem zdania głównego jest „deszcz”, więc wychodzi, że to deszcz szedł do szkoły. W imiesłowowym równoważniku zdania czynność musi wykonywać ten sam ktoś co w zdaniu głównym. Poprawnie: „Kiedy szedłem do szkoły, padał deszcz” albo „Idąc do szkoły, zmokłem”.", "kw": [["podmiot+deszcz", "deszcz+szedl|idzie|chodz|szedl"], ["ten sam", "tego samego", "ta sama", "tej samej", "wykonaw"], ["kiedy|gdy|podczas+szedl|szla|szl"], ["idac+zmokl|zmokn|zlapal|zobaczyl|wzial|otworz|^mial|zauwaz|poczul|^bylem|^bylam|^ja$|spotkal|uslysz"]]}, {"id": "e5", "tag": "l4", "prompt": "Wyjaśnij, czym różni się imiesłów współczesny od uprzedniego i gdzie postawisz przecinki w zdaniu „Kasia zobaczywszy psa uciekła”.", "keyPoints": ["współczesny – czynności w tym samym czasie", "uprzedni – czynność wcześniejsza", "równoważnik oddzielamy przecinkami", "Kasia, zobaczywszy psa, uciekła."], "model": "Współczesny (czytając) pokazuje, że dwie czynności dzieją się jednocześnie, a uprzedni (zobaczywszy) – że jedna była wcześniej. Równoważnik w środku zdania oddzielam przecinkami z obu stron: „Kasia, zobaczywszy psa, uciekła.”", "kw": [["wspolczes+jednocz|tym samym|rownoczes|naraz|podczas"], ["uprzedn+wczes|^przed$|najpierw|potem|^po$|zakoncz|skonczon"], ["przecink+oddziel|^obu|^oba|^dwa|^2$|stron|rownowaz", "oddziel"], ["=kasia,zobaczywszy psa,", "=,zobaczywszy psa,"]]}], "mockTest": {"id": "karta-pracy-tabela", "title": "Karta pracy z zeszytu – tabela imiesłowów", "minutes": 20, "gradeScale": [[0, "niedostateczny"], [31, "dopuszczający"], [51, "dostateczny"], [71, "dobry"], [88, "bardzo dobry"], [97, "celujący"]], "intro": "To **dokładna kopia tabeli z zeszytu**: te same czasowniki i kolumny. Uzupełnij wszystkie 40 kratek bez zaglądania do lekcji. Jeśli formy nie ma, wpisz **X** (albo „–”). Przy parach (wykonywać/wykonać, rodzić/urodzić) w kolumnie biernej wpisz **obie** formy, np. „pisany/napisany”. Po oddaniu zobaczysz poprawne formy i wyjaśnienie przy każdym czasowniku z błędem.", "tasks": [{"id": "m1-tabela", "type": "table", "tag": "l2", "q": "Uzupełnij tabelę imiesłowów (karta pracy z zeszytu).", "columns": ["CZASOWNIK", "imiesłów przymiotnikowy czynny", "imiesłów przymiotnikowy bierny", "imiesłów przysłówkowy współczesny", "imiesłów przysłówkowy uprzedni"], "rows": [{"head": "myć", "cells": ["myjący", "myty", "myjąc", "X"], "note": "**myć** – niedokonany (więc nie ma uprzedniego), przechodni (myć **co?** naczynia → myty). Uprzedni ma dopiero dokonane **umyć → umywszy**."}, {"head": "świecić", "cells": ["świecący", "X", "świecąc", "X"], "note": "**świecić** – niedokonany i **nieprzechodni** (słońce świeci – nie da się „świecić coś”), więc nie ma biernego; jako niedokonany nie ma uprzedniego. Uwaga: „święcony” to od innego czasownika – **święcić** (np. jajka)."}, {"head": "dostawić", "cells": ["X", "dostawiony", "X", "dostawiwszy"], "note": "**dostawić** – **dokonany** (co zrobić?), więc nie ma czynnego ani współczesnego (brak czasu teraźniejszego). Przechodni: dostawić **co?** krzesło → dostawiony; dostawił → **dostawiwszy**."}, {"head": "wykonywać/wykonać", "cells": ["wykonujący", "wykonywany/wykonany", "wykonując", "wykonawszy"], "note": "Para aspektowa: czynny i współczesny tylko od **wykonywać** (wykonują → wykonujący, wykonując), uprzedni tylko od **wykonać** (wykonał → wykonawszy). Bierny mają **oba**: wykonywany i wykonany – wpisz obie formy (np. wykonywany/wykonany)."}, {"head": "siedzieć", "cells": ["siedzący", "X", "siedząc", "X"], "note": "**siedzieć** – niedokonany, **nieprzechodni** (nie „siedzi się coś”) → brak biernego i uprzedniego."}, {"head": "przestraszyć", "cells": ["X", "przestraszony", "X", "przestraszywszy"], "note": "**przestraszyć** – dokonany → brak czynnego i współczesnego. Przechodni: przestraszyć **kogo?** kota → przestraszony; przestraszył → **przestraszywszy**."}, {"head": "dołączyć", "cells": ["X", "dołączony", "X", "dołączywszy"], "note": "**dołączyć** – dokonany → brak czynnego i współczesnego. Przechodni: dołączyć **co?** zdjęcie → dołączony; dołączył → **dołączywszy**."}, {"head": "rodzić/urodzić", "cells": ["rodzący", "rodzony/urodzony", "rodząc", "urodziwszy"], "note": "Para: **rodzić** (niedok.) → rodzący, rodząc, rodzony; **urodzić** (dok.) → urodzony, urodził → **urodziwszy**. Bierny od obu – wpisz obie formy."}, {"head": "malować", "cells": ["malujący", "malowany", "malując", "X"], "note": "**malować** – niedokonany → brak uprzedniego (ten ma dopiero **pomalować → pomalowawszy**). Przechodni: malować **co?** obraz → malowany."}, {"head": "utyć", "cells": ["X", "X", "X", "utywszy"], "note": "**utyć** – dokonany (brak czynnego i współczesnego) i **nieprzechodni** (nie „utyć coś”) → brak biernego. Zostaje tylko uprzedni: utył → **utywszy**."}], "explain": "Klucz: niedokonany → czynny (-cy) i współczesny (-c), brak uprzedniego; dokonany → uprzedni (-wszy/-łszy), brak czynnego i współczesnego; nieprzechodni → brak biernego. Pod każdym czasownikiem z błędem jest wyjaśnienie."}]}, "mocks": [{"id": "praca-klasowa-imieslowy", "title": "Praca klasowa – imiesłowy", "minutes": 40, "gradeScale": [[0, "niedostateczny"], [31, "dopuszczający"], [51, "dostateczny"], [71, "dobry"], [88, "bardzo dobry"], [97, "celujący"]], "intro": "Próbna **praca klasowa** w stylu szkolnym: tabela, rozpoznawanie imiesłowów, formy, pisownia „nie”, przecinki i błędy w równoważnikach. Pracuj sam, bez lekcji i ściągi. Po oddaniu przy każdym zadaniu zobaczysz wyjaśnienie.", "tasks": [{"id": "k1", "type": "table", "tag": "l2", "q": "Zadanie 1. Uzupełnij tabelę. Jeśli formy nie ma, wpisz X.", "columns": ["CZASOWNIK", "imiesłów przymiotnikowy czynny", "imiesłów przymiotnikowy bierny", "imiesłów przysłówkowy współczesny", "imiesłów przysłówkowy uprzedni"], "rows": [{"head": "prać", "cells": ["piorący", "prany", "piorąc", "X"], "note": "Niedokonany, przechodni (prać **co?** koszulę): oni **piorą** → piorący, piorąc; prany. Brak uprzedniego."}, {"head": "wyprać", "cells": ["X", "wyprany", "X", "wyprawszy"], "note": "Dokonany: brak czynnego i współczesnego; wyprany; wyprał → **wyprawszy**."}, {"head": "leżeć", "cells": ["leżący", "X", "leżąc", "X"], "note": "Niedokonany, **nieprzechodni** → brak biernego i uprzedniego."}, {"head": "zgubić", "cells": ["X", "zgubiony", "X", "zgubiwszy"], "note": "Dokonany, przechodni (zgubić **co?** klucze): zgubiony; zgubił → **zgubiwszy**."}], "explain": "Aspekt decyduje o czynnym, współczesnym i uprzednim, przechodniość – o biernym."}, {"id": "k2", "type": "cat", "tag": "l1", "q": "Zadanie 2. Określ rodzaj podkreślonych imiesłowów z tekstu: „**Zmęczony** tata, **wróciwszy** z pracy, usiadł w fotelu. **Śpiący** pies leżał obok, **chrapiąc** cicho. Na stole stała **nakryta** kolacja, a mama, **nalawszy** zupy, zawołała dzieci **bawiące się** w ogrodzie. **Patrząc** na nich, tata się uśmiechnął.”", "categories": ["przymiotnikowy czynny", "przymiotnikowy bierny", "przysłówkowy współczesny", "przysłówkowy uprzedni"], "items": [{"t": "zmęczony", "c": 1}, {"t": "wróciwszy", "c": 3}, {"t": "śpiący", "c": 0}, {"t": "chrapiąc", "c": 2}, {"t": "nakryta", "c": 1}, {"t": "nalawszy", "c": 3}, {"t": "bawiące się", "c": 0}, {"t": "patrząc", "c": 2}], "explain": "Czynne: śpiący, bawiące się (-cy/-ce). Bierne: zmęczony, nakryta (-ony/-na). Współczesne: chrapiąc, patrząc (-c). Uprzednie: wróciwszy, nalawszy (-wszy)."}, {"id": "k3", "type": "mc", "tag": "l1", "q": "Zadanie 3a. Imiesłów uprzedni od „usiąść” to:", "options": ["usiedłszy", "usiadwszy", "usiąwszy", "usiadłszy"], "answer": 3, "explain": "Czas przeszły **usiadł** → **usiadłszy**."}, {"id": "k4", "type": "mc", "tag": "l1", "q": "Zadanie 3b. Imiesłów czynny od „jeść” to:", "options": ["jeszczący", "jedający", "jedzący", "jedząc"], "answer": 2, "explain": "Oni **jedzą** → jedzą + -cy = **jedzący**. „Jedząc” to współczesny."}, {"id": "k5", "type": "mc", "tag": "l1", "q": "Zadanie 3c. Imiesłów bierny od „pić” to:", "options": ["pijony", "pijany", "pity", "pijący"], "answer": 2, "explain": "Bierny od pić ma przyrostek -ty: **pity** (pity sok). „Pijący” to czynny."}, {"id": "k6", "type": "tf", "tag": "l2", "q": "Zadanie 4. Czy taka forma istnieje? (prawda = istnieje)", "items": [{"s": "przeczytawszy", "a": true}, {"s": "czytawszy", "a": false}, {"s": "idący", "a": true}, {"s": "idziony", "a": false}, {"s": "zrobiący", "a": false}], "explain": "Uprzedni tylko od dokonanych: przeczytawszy ✅, „czytawszy” ❌. Iść – niedokonany i nieprzechodni: idący ✅, bierny ❌. Zrobić – dokonany: czynnego brak ❌."}, {"id": "k7", "type": "tf", "tag": "l3", "q": "Zadanie 5. Oceń pisownię.", "items": [{"s": "niewyprasowana koszula", "a": true}, {"s": "nie śpiąc całą noc", "a": true}, {"s": "niepatrząc pod nogi", "a": false}, {"s": "nie zapięty pas", "a": false}, {"s": "nieczytający uczniowie", "a": true}], "explain": "Przymiotnikowe z „nie” **łącznie** (niewyprasowana, niezapięty, nieczytający), przysłówkowe **osobno** (nie śpiąc, nie patrząc)."}, {"id": "k8", "type": "mc", "tag": "l4", "q": "Zadanie 6a. Wybierz zdanie z poprawną interpunkcją.", "options": ["Mama, wróciwszy z zakupów zrobiła obiad.", "Mama, wróciwszy z zakupów, zrobiła obiad.", "Mama wróciwszy z zakupów, zrobiła obiad.", "Mama wróciwszy z zakupów zrobiła obiad."], "answer": 1, "explain": "Równoważnik w środku – przecinki **z obu stron**."}, {"id": "k9", "type": "mc", "tag": "l4", "q": "Zadanie 6b. Gdzie postawić przecinek? „Siedząc przy oknie obserwowałem ptaki.”", "options": ["Siedząc przy oknie, obserwowałem ptaki.", "Nie trzeba przecinka.", "Siedząc przy oknie obserwowałem, ptaki.", "Siedząc, przy oknie obserwowałem ptaki."], "answer": 0, "explain": "Cały równoważnik to **siedząc przy oknie** – przecinek po nim."}, {"id": "k10", "type": "multi", "tag": "l4", "q": "Zadanie 7. Zaznacz zdania z błędem (różni wykonawcy czynności albo zdanie bezosobowe).", "options": ["Wróciwszy do domu, odrobiłem lekcje.", "Idąc do szkoły, padał deszcz.", "Biegnąc, Ola zgubiła czapkę.", "Czytając lekturę, zrobiło mi się smutno."], "answer": [1, 3], "explain": "Deszcz nie szedł do szkoły; w „zrobiło mi się smutno” nie ma podmiotu (zdanie bezosobowe). Poprawne: ja wróciłem i ja odrobiłem; Ola biegła i Ola zgubiła.", "points": 2}, {"id": "k11", "type": "open", "tag": "l4", "q": "Zadanie 8. Popraw zdania tak, by były poprawne: a) „Wchodząc do klasy, zadzwonił dzwonek.” b) „Przeczytawszy książkę, spodobała mi się.”", "keyPoints": ["a) zamiana na zdanie z własnym podmiotem, np. Kiedy wchodziłem do klasy, zadzwonił dzwonek.", "a) albo ten sam podmiot: Wchodząc do klasy, usłyszałem dzwonek.", "b) np. Kiedy przeczytałem książkę, spodobała mi się.", "b) albo: Przeczytawszy książkę, polubiłem ją. (przecinki zachowane)"], "model": "a) Kiedy wchodziłem do klasy, zadzwonił dzwonek. / Wchodząc do klasy, usłyszałem dzwonek. b) Kiedy przeczytałem książkę, spodobała mi się. / Przeczytawszy książkę, polubiłem ją.", "points": 4, "explain": "W obu zdaniach podmiot zdania głównego (dzwonek, książka) nie wykonuje czynności z równoważnika. Trzeba albo zmienić podmiot, albo zamienić równoważnik na zdanie podrzędne.", "kw": [["kiedy|gdy|podczas+wchodzil|weszl|wszedl+dzwon", "wchodzac+uslysz|slysz|zobacz|^ja$|^bylem|^bylam|spoznil"], ["kiedy|gdy|podczas+wchodzil|weszl|wszedl+dzwon", "wchodzac+uslysz|slysz|zobacz|^ja$|^bylem|^bylam|spoznil"], ["kiedy|gdy|po tym jak+przeczytal+spodoba|podoba", "po przeczytaniu+spodob|podoba", "przeczytawszy+polubil|zachwyc|pokochal|uznal|stwierdz|zrozumial|ocenil|polecil|^bylem|^bylam"], ["kiedy|gdy|po tym jak+przeczytal+spodoba|podoba", "po przeczytaniu+spodob|podoba", "przeczytawszy+polubil|zachwyc|pokochal|uznal|stwierdz|zrozumial|ocenil|polecil|^bylem|^bylam"]]}, {"id": "k12", "type": "short", "tag": "l1", "q": "Zadanie 9. Przekształć zdanie, używając imiesłowu uprzedniego: „Kiedy Ania przyniosła książki, usiadła.” – wpisz tylko imiesłów.", "accept": ["przyniósłszy", "przyniósłszy książki"], "explain": "Najpierw przyniosła, potem usiadła → uprzedni od przynieść: **przyniósłszy** (Przyniósłszy książki, Ania usiadła)."}]}], "cheatSheet": [{"title": "Jak tworzymy imiesłowy", "items": ["Trik: powiedz „oni …” (czytają, śpią, niosą) → +cy = czynny, +c = współczesny", "„on …ł” od dokonanego (przeczytał, przyniósł) → -wszy po samogłosce, -łszy po spółgłosce"], "table": {"columns": ["imiesłów", "jak tworzymy", "przykład", "od jakich czasowników", "odmiana"], "rows": [["przymiotnikowy **czynny**", "3 os. lm cz. teraźn. + **-cy** (-ca, -ce)", "czytają → czytający", "tylko **niedokonane**", "odmienny (jak przymiotnik)"], ["przymiotnikowy **bierny**", "**-ny / -ony / -ty**", "czytany, niesiony, myty", "tylko **przechodnie** (oba aspekty)", "odmienny (jak przymiotnik)"], ["przysłówkowy **współczesny**", "3 os. lm cz. teraźn. + **-c**", "czytają → czytając", "tylko **niedokonane**", "nieodmienny"], ["przysłówkowy **uprzedni**", "cz. przeszły: **-wszy / -łszy**", "przeczytał → przeczytawszy; przyniósł → przyniósłszy", "tylko **dokonane**", "nieodmienny"]]}}, {"title": "Kiedy X (formy nie ma)", "items": ["dokonany (co zrobić?) → X w czynnym i współczesnym", "niedokonany (co robić?) → X w uprzednim", "nieprzechodni (bez „kogo? co?”) → X w biernym", "utyć → tylko utywszy; siedzieć → siedzący, siedząc"]}, {"title": "Pisownia „nie”", "items": ["przymiotnikowe – ŁĄCZNIE: niemyty, nieczytający, nieprzeczytany (od 2026 r. zawsze)", "przysłówkowe – OSOBNO: nie czytając, nie wiedząc, nie przeczytawszy"]}, {"title": "Imiesłowowy równoważnik zdania", "items": ["= imiesłów przysłówkowy + wyrazy zależne: wróciwszy do domu", "przecinek; w środku zdania z obu stron: Ola, zobaczywszy psa, uciekła.", "ten sam wykonawca czynności co w zdaniu głównym", "❌ Idąc do szkoły, padał deszcz → ✅ Kiedy szedłem do szkoły, padał deszcz.", "❌ w zdaniach bezosobowych: Jadąc pociągiem, było mi zimno."]}, {"title": "Pułapki", "items": ["przyniósłszy · przyszedłszy · zjadłszy · usiadłszy (-łszy)", "śpiący/śpiąc · biegnący/biegnąc · jedzący/jedząc · piorący/piorąc", "niosący, niesiony · otwarty · zamknięty · umyty", "śmiejący się, śmiejąc się – „się” zostaje"]}, {"title": "Karta pracy (czynny · bierny · współczesny · uprzedni)", "items": ["myć: myjący · myty · myjąc · X", "świecić: świecący · X · świecąc · X", "dostawić: X · dostawiony · X · dostawiwszy", "wykonywać/wykonać: wykonujący · wykonywany/wykonany · wykonując · wykonawszy", "siedzieć: siedzący · X · siedząc · X", "przestraszyć: X · przestraszony · X · przestraszywszy", "dołączyć: X · dołączony · X · dołączywszy", "rodzić/urodzić: rodzący · rodzony/urodzony · rodząc · urodziwszy", "malować: malujący · malowany · malując · X", "utyć: X · X · X · utywszy"]}], "steps": [{"id": "tworzenie", "title": "Cztery imiesłowy – jak je tworzyć", "tags": ["l1"], "levels": [{"n": 1, "title": "Czasownik „przebrany” za przymiotnik albo przysłówek", "tags": ["l1"], "body": ["Imiesłów to **czasownik w przebraniu**. Raz udaje przymiotnik (jaki?): **śpiący** kot, **umyty** talerz. Raz udaje przysłówek (jak? kiedy?): **czytając**, **przeczytawszy**.", "Są **4 imiesłowy**: 2 przymiotnikowe (czynny, bierny) i 2 przysłówkowe (współczesny, uprzedni)."], "checks": [{"ref": "d1"}, {"ref": "q1"}], "keyPoints": ["czynny: czytający (ktoś sam czyta)", "bierny: czytany (ktoś go czyta)", "współczesny: czytając (w tym samym czasie)", "uprzedni: przeczytawszy (wcześniej)"]}, {"n": 2, "title": "Rozpoznaj imiesłów w zdaniu", "tags": ["l1"], "body": ["Zadaj pytanie: **jaki?** → przymiotnikowy (czynny: sam coś robi – śpiący; bierny: ktoś mu coś robi – przeczytana). **Jak? kiedy?** → przysłówkowy (współczesny **-ąc**: wracając; uprzedni **-wszy/-łszy**: zamknąwszy)."], "checks": [{"ref": "q2"}, {"ref": "q3"}, {"ref": "q4"}]}, {"n": 3, "title": "Końcówki: -cy, -ny/-ony/-ty, -c, -wszy/-łszy", "tags": ["l1"], "body": ["**Czynny:** 3 os. l.mn. czasu teraźniejszego + **-cy**: piszą → piszący. **Bierny:** **-ny / -ony / -ty**: malowany, zrobiony, otwarty.", "**Współczesny:** 3 os. l.mn. + **-c**: czytają → czytając. **Uprzedni:** od czasownika dokonanego, **-łszy / -wszy**: zjadłszy, przeczytawszy."], "checks": [{"ref": "q9"}, {"ref": "q11"}, {"ref": "q16"}], "lessons": ["l1"]}, {"n": 4, "title": "Trudniejsze czasowniki", "tags": ["l1"], "body": ["Uważaj na tematy: otworzyć → otwarty, nieść → niesiony, pisać → piszący (piszą!), zamknąć → zamknięty."], "checks": [{"ref": "q12"}, {"ref": "q14"}, {"ref": "q17"}]}, {"n": 5, "title": "Na sprawdzian i wyżej: utwórz sam", "tags": ["l1"], "body": ["Ekspert od jednej pary czytać/przeczytać tworzy wszystkie 4 imiesłowy i wyjaśnia, od którego czasownika bierze każdą formę: czytający, czytany/przeczytany, czytając, przeczytawszy."], "checks": [{"ref": "q13"}, {"ref": "q18"}, {"ref": "e1"}]}]}, {"id": "aspekt", "title": "Aspekt, przechodniość i dlaczego w tabeli są X", "tags": ["l2"], "levels": [{"n": 1, "title": "Co robić? Co zrobić?", "tags": ["l2"], "body": ["Czasownik **niedokonany** odpowiada na „co robić?” (myć, czytać), **dokonany** – na „co zrobić?” (umyć, przeczytać). Dokonany nie ma czasu teraźniejszego."], "checks": [{"ref": "d3"}, {"q": {"id": "as1", "type": "mc", "tag": "l2", "q": "Jakiego aspektu jest czasownik **przeczytać**?", "options": ["niedokonanego – co robić?", "dokonanego – co zrobić?", "nie ma aspektu", "to imiesłów"], "answer": 1, "explain": "**Przeczytać** odpowiada na pytanie „co zrobić?” – jest **dokonany**, więc ma uprzedni (przeczytawszy), ale nie ma czynnego ani współczesnego."}}]}, {"n": 2, "title": "Aspekt i przechodniość decydują o X", "tags": ["l2"], "body": ["**Niedokonany** ma czynny i współczesny, **nie ma uprzedniego**. **Dokonany** ma uprzedni, **nie ma czynnego ani współczesnego**.", "**Bierny** tylko od czasowników **przechodnich** (myć co? → myty). Nieprzechodnie (siedzieć, spać, utyć) – X w kolumnie biernego."], "checks": [{"ref": "q20"}, {"ref": "q21"}]}, {"n": 3, "title": "Tabela z zeszytu", "tags": ["l2"], "body": ["Poniżej dokładnie ta tabela z zeszytu – uzupełnij ją. Przy każdym czasowniku zadaj 2 pytania: co robić / co zrobić? i czy da się dodać **kogo? co?**"], "checks": [{"ref": "q19"}, {"ref": "q24"}], "lessons": ["l2"], "exercise": {"type": "worksheet", "ref": "m1-tabela"}}, {"n": 4, "title": "Trening tabeli", "tags": ["l2"], "body": ["Losowe czasowniki – wpisz wszystkie 4 imiesłowy albo X. Pary aspektowe dzielą się formami: wykonujący, wykonując (niedok.), wykonawszy (dok.), wykonywany/wykonany (oba)."], "checks": [{"ref": "q22"}, {"ref": "q23"}], "exercise": {"type": "tableDrill"}}, {"n": 5, "title": "Na sprawdzian i wyżej: uzasadnij X", "tags": ["l2"], "body": ["Ekspert przy każdym X podaje powód: „brak uprzedniego, bo niedokonany”, „brak biernego, bo nieprzechodni”, „brak czynnego i współczesnego, bo dokonany”."], "checks": [{"ref": "e2"}, {"q": {"id": "as2", "type": "mc", "tag": "l2", "q": "Które imiesłowy ma czasownik **myć**?", "options": ["myjący, myty, myjąc – brak uprzedniego", "myjący, myjąc, umywszy – brak biernego", "tylko myty", "wszystkie cztery: myjący, myty, myjąc, mywszy"], "answer": 0, "explain": "**Myć** jest niedokonany (brak uprzedniego) i przechodni (myć co? → jest bierny **myty**). Zostają: myjący, myty, myjąc."}}]}]}, {"id": "pisownia-nie", "title": "Pisownia „nie”, odmiana i przecinki", "tags": ["l3"], "levels": [{"n": 1, "title": "Łącznie czy osobno?", "tags": ["l3"], "body": ["**Przymiotnikowe** (czynne i bierne) piszemy z „nie” **łącznie**: niemyty, nieczytający. **Przysłówkowe** (współczesne i uprzednie) – **osobno**: nie wiedząc, nie zauważywszy."], "checks": [{"ref": "d4"}, {"q": {"id": "ni1", "type": "mc", "tag": "l3", "q": "Wybierz poprawną pisownię: „Na stole stały (nie)umyte szklanki.”", "options": ["nie umyte", "nieumyte", "nie-umyte", "obie formy są poprawne"], "answer": 1, "explain": "**Umyte** to imiesłów przymiotnikowy bierny – z „nie” piszemy **łącznie**: nieumyte."}}]}, {"n": 2, "title": "Odmiana imiesłowów", "tags": ["l3"], "body": ["Przymiotnikowe **odmieniają się** jak przymiotniki (bawiącym się dzieciom, umytą szklankę). Przysłówkowe są **nieodmienne** (czytając – zawsze tak samo)."], "checks": [{"ref": "q27"}, {"ref": "q28"}]}, {"n": 3, "title": "Zdania z dwoma imiesłowami", "tags": ["l3"], "body": ["W jednym zdaniu może być imiesłów pisany łącznie i osobno: „Weszły do **nieposprzątanego** pokoju, **nie wiedząc**, co robić.” Rozpoznaj rodzaj, potem pisz."], "checks": [{"ref": "q25"}, {"q": {"id": "ni2", "type": "mc", "tag": "l3", "q": "Wybierz poprawną pisownię: „(Nie)wiedząc, co powiedzieć, uśmiechnął się.”", "options": ["Niewiedząc", "Nie wiedząc", "Nie-wiedząc", "obie formy są poprawne"], "answer": 1, "explain": "**Wiedząc** to imiesłów przysłówkowy współczesny – z „nie” piszemy **osobno**: Nie wiedząc."}}], "lessons": ["l3"]}, {"n": 4, "title": "Nowa zasada 2026: zawsze łącznie", "tags": ["l3"], "body": ["Od 1 stycznia 2026 r. „nie” z imiesłowami przymiotnikowymi piszemy **zawsze łącznie** – także w przeciwstawieniu: „list nieprzeczytany, lecz przejrzany”."], "checks": [{"ref": "q26"}, {"q": {"id": "ni3", "type": "mc", "tag": "l3", "q": "Jak zapiszesz według zasad od 2026 r.: „To był list (nie)przeczytany, lecz tylko przejrzany.”?", "options": ["nie przeczytany – bo jest przeciwstawienie", "nieprzeczytany – zawsze łącznie", "obie formy są poprawne", "nie-przeczytany"], "answer": 1, "explain": "Od 2026 r. imiesłowy przymiotnikowe piszemy z „nie” **zawsze łącznie**, bez wyjątku dla przeciwstawień."}}]}, {"n": 5, "title": "Na sprawdzian i wyżej: pisownia i przecinki", "tags": ["l3", "l4"], "body": ["Ekspert wyjaśnia pisownię „nie” z przykładami i od razu stawia przecinki przy imiesłowie przysłówkowym: „Odrabiałem lekcje**,** słuchając muzyki.”"], "checks": [{"ref": "e3"}, {"ref": "q30"}, {"ref": "q29"}]}]}, {"id": "rownowaznik", "title": "Ten sam wykonawca – równoważnik w zdaniach", "tags": ["l4"], "levels": [{"n": 1, "title": "Co to jest równoważnik?", "tags": ["l4"], "body": ["**Imiesłowowy równoważnik zdania** to imiesłów przysłówkowy z wyrazami od niego zależnymi: „wracając ze szkoły”, „zjadłszy obiad”. Zastępuje zdanie podrzędne i oddzielamy go przecinkiem."], "checks": [{"ref": "d5"}, {"q": {"id": "rw1", "type": "mc", "tag": "l4", "q": "Który fragment to imiesłowowy równoważnik zdania? „Zamknąwszy drzwi na klucz, Ania zeszła na dół.”", "options": ["Ania zeszła na dół", "Zamknąwszy drzwi na klucz", "na dół", "drzwi na klucz, Ania"], "answer": 1, "explain": "Równoważnik = imiesłów przysłówkowy (**zamknąwszy**) + wyrazy od niego zależne (drzwi na klucz)."}}]}, {"n": 2, "title": "Zamiana zdania na równoważnik", "tags": ["l4"], "body": ["„Kiedy wracałem ze szkoły, kupiłem bułki.” → „Wracając ze szkoły, kupiłem bułki.” Wykonawca obu czynności musi być ten sam."], "checks": [{"ref": "q34"}, {"q": {"id": "rw2", "type": "mc", "tag": "l4", "q": "Zamień na równoważnik: „Gdy Ola skończyła lekcje, poszła na rower.”", "options": ["Skończywszy lekcje, Ola poszła na rower.", "Skończywszy lekcje, rower pojechał.", "Kończąc lekcje Ola poszła na rower", "Skończone lekcje, Ola poszła na rower."], "answer": 0, "explain": "Najpierw skończyła, potem poszła → imiesłów **uprzedni** (skończywszy); wykonawca ten sam (Ola) i przecinek."}}]}, {"n": 3, "title": "Ten sam wykonawca!", "tags": ["l4"], "body": ["„Idąc do szkoły, padał deszcz” ❌ (deszcz nie idzie). Poprawnie: „Kiedy szedłem do szkoły, padał deszcz” albo „Idąc do szkoły, zmokłem”."], "checks": [{"ref": "q31"}, {"ref": "q32"}], "lessons": ["l4"]}, {"n": 4, "title": "Zdania bez podmiotu", "tags": ["l4"], "body": ["Równoważnika nie używamy w zdaniach **bezosobowych**: „Jadąc pociągiem, było mi zimno” ❌ → „Kiedy jechałem pociągiem, było mi zimno.”"], "checks": [{"ref": "q33"}, {"q": {"id": "rw3", "type": "mc", "tag": "l4", "q": "Które zdanie jest **błędne**?", "options": ["Zjadłszy obiad, odrobiłem lekcje.", "Zjadłszy obiad, zrobiło mi się niedobrze.", "Kiedy zjadłem obiad, zrobiło mi się niedobrze.", "Odrobiłem lekcje, zjadłszy obiad."], "answer": 1, "explain": "„Zrobiło mi się niedobrze” to zdanie **bez podmiotu** – nie ma wykonawcy, który zjadł obiad. Poprawnie: „Kiedy zjadłem obiad, zrobiło mi się niedobrze.”"}}]}, {"n": 5, "title": "Na sprawdzian i wyżej: popraw i wyjaśnij", "tags": ["l4"], "body": ["Ekspert poprawia błędne zdanie na dwa sposoby (zdanie podrzędne albo zmiana podmiotu) i odróżnia współczesny (w tym samym czasie) od uprzedniego (wcześniej)."], "checks": [{"ref": "e4"}, {"ref": "e5"}]}]}], "life": [{"concept": "Imiesłowy w codziennym języku", "intro": "Imiesłowy są wszędzie – na tabliczkach, w aplikacjach i w szkole.", "examples": [{"t": "Tabliczki w metrze i w sklepie", "d": "„Drzwi **zamykane** automatycznie”, „Towar **przeceniony**” – to imiesłowy bierne (ktoś zamyka drzwi, ktoś przecenił towar)."}, {"t": "Wiadomości w telefonie", "d": "„Wiadomość **odczytana**”, „plik **pobrany**”, „zdjęcie **dołączone**” – tak, to imiesłowy bierne."}, {"t": "Rozkład jazdy", "d": "„Pociąg **opóźniony**”, „autobus **odjeżdżający** z przystanku Metro Wilanowska” – bierny i czynny w jednej podróży."}, {"t": "Napisy na produktach", "d": "„Woda **niegazowana**”, „sok **niesłodzony**”, „chleb **krojony**” – imiesłowy bierne; z „nie” zawsze łącznie."}, {"t": "Gry i seriale", "d": "„Misja **ukończona**”, „poziom **odblokowany**”, „gracz **czekający** w lobby” – imiesłowy."}, {"t": "Szkolne ogłoszenia", "d": "„Uczniowie **spóźniający się** proszeni są o…” – czynny (spóźniają się → spóźniający się) i bierny (proszeni)."}, {"t": "Opis zdjęcia na Instagramie", "d": "„**Siedząc** na plaży w Jastarni, **zjadłszy** gofra, oglądałem zachód słońca” – dwa imiesłowy przysłówkowe: współczesny i uprzedni."}]}, {"concept": "Imiesłowowy równoważnik zdania i przecinki", "intro": "Równoważnik skraca zdanie – ale łatwo zrobić śmieszny błąd.", "examples": [{"t": "SMS do mamy", "d": "„**Wracając ze szkoły**, kupię chleb.” – wracam ja i kupuję ja ✅, a przecinek oddziela równoważnik."}, {"t": "Śmieszne błędy w memach", "d": "„Jadąc tramwajem, zepsuła się klimatyzacja” ❌ – wychodzi na to, że klimatyzacja jechała tramwajem. Poprawnie: „Kiedy jechałem tramwajem, zepsuła się klimatyzacja”."}, {"t": "Wypracowanie z polskiego", "d": "„**Przeczytawszy** lekturę, bohater…” brzmi dojrzale i oszczędza słowa – za poprawny równoważnik z przecinkiem łatwiej o lepszą ocenę stylu."}, {"t": "Instrukcja w przepisie", "d": "„**Wymieszawszy** składniki, wlej ciasto do formy.” – najpierw mieszasz, potem wlewasz (uprzedni = wcześniej)."}, {"t": "Relacja z meczu", "d": "„Lewandowski, **minąwszy** obrońcę, strzelił gola.” – równoważnik w środku zdania ma przecinki **z obu stron**."}, {"t": "Notatka z wycieczki", "d": "„**Zwiedzając** Stare Miasto, robiliśmy zdjęcia.” – zwiedzamy i robimy zdjęcia w tym samym czasie (współczesny)."}, {"t": "Regulamin basenu", "d": "„**Wychodząc** z basenu, zabierz klucz do szafki.” – wychodzisz Ty i zabierasz Ty ✅ (współczesny, przecinek po równoważniku)."}]}, {"concept": "Aspekt: co robić / co zrobić", "intro": "Ta sama różnica decyduje, czy mówisz „robię”, czy „zrobiłem”.", "examples": [{"t": "Lista zadań w telefonie", "d": "„**Zrobione**” przy odhaczonym zadaniu to imiesłów bierny od dokonanego **zrobić** – zadanie jest skończone."}, {"t": "Status w komunikatorze", "d": "„**Pisze…**” – czynność trwa (niedokonany **pisać**). Gdy wiadomość przyjdzie, jest „**wysłana**” – od dokonanego **wysłać**."}, {"t": "Zamówienie w sklepie internetowym", "d": "„Zamówienie **realizowane**” (trwa, niedokonany) i „zamówienie **zrealizowane**” (koniec, dokonany)."}, {"t": "Pralka", "d": "Na wyświetlaczu: „**piorę**” w trakcie, a po końcu „pranie **uprane**” – dokonany: co zrobić? uprać."}, {"t": "Zadanie domowe", "d": "„Odrabiając lekcje, słuchałem muzyki” (w tym samym czasie – niedokonany) vs „**Odrobiwszy** lekcje, wyszedłem” (najpierw – dokonany)."}, {"t": "Gry komputerowe", "d": "„Poziom **ukończony**” pojawia się dopiero po końcu poziomu – od dokonanego **ukończyć**."}, {"t": "Miejsce siedzące w autobusie", "d": "Od **siedzieć** nie ma imiesłowu biernego – bo nie da się „siedzieć coś”. Dlatego mówimy „siedzący pasażer”, ale nigdy „siedziany”."}]}, {"concept": "Pisownia „nie” z imiesłowami", "intro": "Na tabliczkach i w ogłoszeniach widać obie zasady.", "examples": [{"t": "Tabliczka „Dla niepalących”", "d": "**Niepalący** to imiesłów przymiotnikowy czynny – z „nie” razem."}, {"t": "Pokój w hotelu", "d": "„Pokój **nieposprzątany**” – przymiotnikowy bierny, więc łącznie."}, {"t": "Wiadomości nieprzeczytane", "d": "W skrzynce mailowej: „3 **nieprzeczytane** wiadomości” – imiesłów przymiotnikowy, łącznie."}, {"t": "Mandat za parkowanie", "d": "„Kierowca, **nie zauważywszy** znaku, zaparkował” – przysłówkowy uprzedni, więc osobno."}, {"t": "Rozmowa z kolegą", "d": "„**Nie wiedząc**, co odpowiedzieć, wzruszył ramionami” – przysłówkowy współczesny, osobno."}, {"t": "Kartkówka", "d": "„Zadanie **nierozwiązane**” – przymiotnikowy bierny, łącznie, nawet jeśli dodasz „lecz zaczęte” (zasada od 2026 r.)."}, {"t": "Ogłoszenie w szkole", "d": "„Uczniowie **nie mając** legitymacji…” – przysłówkowy, osobno (i z przecinkami: „Uczniowie, nie mając legitymacji, …”)."}]}]};</script>

/* ---------- helpers ---------- */

function el(tag,attrs,html){var e=document.createElement(tag);if(attrs)for(var k in attrs){if(k==='class')e.className=attrs[k];else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k]);}if(html!=null)e.innerHTML=html;return e;}

function dmParse(s){s=String(s).replace(/[′’`´]/g,"'").replace(/[″”]/g,'"');var mDec=s.match(/^\s*(\d+)[.,](\d+)\s*°?\s*[A-Za-ząćęłńóśźżĄĆĘŁŃÓŚŹŻ. ]*$/);
 if(mDec&&!(mDec[2].length===2&&+mDec[2]<60))return Math.round(parseFloat(mDec[1]+'.'+mDec[2])*60*100)/100;
 var t=s.match(/\d+/g);if(!t)return null;var d=+t[0],m=t.length>1?+t[1]:0;if(m>=60)return null;return d*60+m;}

/* open-answer rubric: q.kw[i] = list of alternatives for keyPoints[i]; an alternative is "a|b+c|d" (every +part needs one |option); ^x = word start, x$ = word end, =text = raw match keeping punctuation (spaces ignored) */
function kwRaw(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/g,'l').replace(/\s+/g,'');}
function kwPart(text,o){o=String(o).trim();if(!o)return false;if(o.charAt(0)==='=')return kwRaw(text).indexOf(kwRaw(o.slice(1)))>=0;if(kwPart1(text,o))return true;var b=o.replace(/\$$/,''),e=o.length>b.length?'$':'';/* stem end folds differently before a vowel / z / h (czaszk|a, pojezier|zy, wloc|hy) */return (/[zs][ck]$/.test(b)?['a','o','u']:/r$/.test(b)?['z']:/c$/.test(b)?['h']:[]).some(function(x){return kwPart1(text,b+x+e);});}
