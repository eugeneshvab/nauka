<script>window.TP_CONTENT={"schemaVersion": 1, "meta": {"id": "fiz7-wektory-cechy", "title": "Fizyka: wektor i jego cechy", "subtitle": "Punkt przyłożenia, kierunek, zwrot, wartość · opisywanie i rysowanie na kratce · jednostki SI i wzorce · skutki statyczne i dynamiczne. Wskazówka: na kartkówkę zabierz linijkę, ołówek i gumkę.", "subject": "Fizyka", "grade": "Klasa 7 SP", "lang": "pl", "explainLangs": ["pl", "en", "ru"], "estimatedMinutes": 70, "sourceNote": "Zakres kartkówki: cechy wektora i opisywanie wektorów na kratce; dodatkowo jednostki SI (m, kg, s, K, A), wzorce (metr — światło; sekunda — cez-133; kg — Sèvres/Planck) oraz skutki statyczne vs dynamiczne. Poziom SP7. Wskazówka praktyczna: linijka, ołówek, gumka.", "uncertain": ["Dokładne brzmienie definicji kilograma w konkretnym podręczniku (Sèvres vs stała Plancka) — podano obie wersje na poziomie SP7."], "tutorMaterial": "TEMAT: wektor i jego cechy (fizyka, klasa 7 SP). Mów po polsku, krótko, konkretnie. Najpierw pytaj ucznia.\n\nNAJWAŻNIEJSZE\n1) Wektor ma 4 cechy: punkt przyłożenia, kierunek, zwrot, wartość (długość).\n2) Kierunek = prosta (pozioma/pionowa/ukośna). Zwrot = strona na tej prostej (grot). Nie mylić kierunku ze zwrotem.\n3) Punkt przyłożenia = początek strzałki (P). Wartość = długość (na kratce: liczba kratek / Δx, Δy).\n4) Skalar (masa, czas, temperatura) ma tylko wartość. Siła, prędkość — wektory.\n5) Opis na kratce: P → kierunek → zwrot → wartość. Rysowanie z opisu: ta sama kolejność; grot na końcu.\n6) Dystraktory: odwrócony zwrot, inna długość, inny punkt P, mylenie ukosu z poziomem/pionem.\n7) SI podstawowe: m, kg, s, K, A. Metr = droga światła w próżni w 1/299792458 s. Sekunda = cez-133. Kilogram: historycznie wzorzec z Sèvres (IPK), od 2019 stała Plancka. Niuton = pochodna (siła).\n8) Skutek statyczny = zmiana kształtu/objętości. Dynamiczny = zmiana ruchu (prędkości).\n9) Na kartkówkę: linijka, ołówek, gumka.\n\nJAK POMAGAĆ\n- Przy myleniu kierunku i zwrotu: „Na jakiej prostej leży? A w którą stronę pokazuje grot?”\n- Przy kratce: każ policzyć Δx i Δy.\n- Przy SI: najpierw „co mierzymy?”, potem wzorzec.\n- Przy skutkach: „Czy zmienił się kształt, czy ruch?”\n", "layout": "steps5"}, "images": {"v_cechy_demo": {"svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 344 366\" width=\"344\" height=\"366\"><rect width=\"344\" height=\"366\" fill=\"#FFFCF6\"/><text x=\"172.0\" y=\"14\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" font-size=\"12\" fill=\"#292D29\">4 cechy wektora<\/text><line x1=\"28\" y1=\"334\" x2=\"28\" y2=\"46\" stroke=\"#D9D2C5\" stroke-width=\"1\"/><line x1=\"28\" y1=\"334\" x2=\"316\" y2=\"334\" stroke=\"#D9D2C5\" stroke-width=\"1\"/><line x1=\"64\" y1=\"334\" x2=\"64\" y2=\"46\" stroke=\"#D9D2C5\" stroke-width=\"1\"/><line x1=\"28\" y1=\"298\" x2=\"316\" y2=\"298\" stroke=\"#D9D2C5\" stroke-width=\"1\"/><line x1=\"100\" y1=\"334\" x2=\"100\" y2=\"46\" stroke=\"#D9D2C5\" stroke-width=\"1\"/><line x1=\"28\" y1=\"262\" x2=\"316\" y2=\"262\" stroke=\"#D9D2C5\" stroke-width=\"1\"/><line x1=\"136\" y1=\"334\" x2=\"136\" y2=\"46\" stroke=\"#D9D2C5\" stroke-width=\"1\"/><line x1=\"28\" y1=\"226\" x2=\"316\" y2=\"226\" stroke=\"#D9D2C5\" stroke-width=\"1\"/><line x1=\"172\" y1=\"334\" x2=\"172\" y2=\"46\" stroke=\"#D9D2C5\" stroke-width=\"1\"/><line x1=\"28\" y1=\"190\" x2=\"316\" y2=\"190\" stroke=\"#D9D2C5\" stroke-width=\"1\"/><line x1=\"208\" y1=\"334\" x2=\"208\" y2=\"46\" stroke=\"#D9D2C5\" stroke-width=\"1\"/><line x1=\"28\" y1=\"154\" x2=\"316\" y2=\"154\" stroke=\"#D9D2C5\" stroke-width=\"1\"/><line x1=\"244\" y1=\"334\" x2=\"244\" y2=\"46\" stroke=\"#D9D2C5\" stroke-width=\"1\"/><line x1=\"28\" y1=\"118\" x2=\"316\" y2=\"118\" stroke=\"#D9D2C5\" stroke-width=\"1\"/><line x1=\"280\" y1=\"334\" x2=\"280\" y2=\"46\" stroke=\"#D9D2C5\" stroke-width=\"1\"/><line x1=\"28\" y1=\"82\" x2=\"316\" y2=\"82\" stroke=\"#D9D2C5\" stroke-width=\"1\"/><line x1=\"316\" y1=\"334\" x2=\"316\" y2=\"46\" stroke=\"#D9D2C5\" " stroke=\"#D9D2C5\" stroke-width=\"1\"/><line x1=\"28\" y1=\"82\" x2=\"280\" y2=\"82\" stroke=\"#D9D2C5\" stroke-width=\"1\"/><line x1=\"280\" y1=\"298\" x2=\"280\" y2=\"46\" stroke=\"#D9D2C5\" stroke-width=\"1\"/><line x1=\"28\" y1=\"46\" x2=\"280\" y2=\"46\" stroke=\"#D9D2C5\" stroke-width=\"1\"/><rect x=\"28\" y=\"46\" width=\"252\" height=\"252\" fill=\"none\" stroke=\"#596F79\" stroke-width=\"1.5\"/><text x=\"24\" y=\"312\" font-family=\"system-ui,sans-serif\" font-size=\"10\" fill=\"#607361\">0<\/text><defs><marker id=\"ah7840\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#9B614B\"/><\/marker><\/defs><line x1=\"64\" y1=\"190\" x2=\"244\" y2=\"190\" stroke=\"#9B614B\" stroke-width=\"3\" marker-end=\"url(#ah7840)\"/><circle cx=\"64\" cy=\"190\" r=\"5\" fill=\"#9B614B\" stroke=\"#FFFCF6\" stroke-width=\"1.5\"/><text x=\"54\" y=\"182\" font-family=\"system-ui,sans-serif\" font-size=\"11\" font-weight=\"600\" fill=\"#9B614B\">P<\/text><text x=\"160.0\" y=\"204.0\" font-family=\"system-ui,sans-serif\" font-size=\"10\" fill=\"#607361\">długość = wartość<\/text><\/svg>", "alt": "Wartość — długość strzałki", "wide": true}}, "diagnostic": [{"id": "d1", "type": "mc", "tag": "l1", "q": "Ile cech ma wektor w fizyce (klasa 7)?", "options": ["1 — tylko wartość", "2 — kierunek i zwrot", "3 — wartość, kierunek, zwrot", "4 — punkt przyłożenia, kierunek, zwrot, wartość"], "answer": 3, "explain": "Wektor opisujemy **czterema** cechami: punkt przyłożenia, kierunek, zwrot, wartość."}, {"id": "d2", "type": "mc", "tag": "l1", "q": "Co na rysunku wektora pokazuje **zwrot**?", "options": ["długość strzałki", "prosta, na której leży strzałka", "grot (ostrze) strzałki", "punkt, w którym strzałka się zaczyna"], "answer": 2, "explain": "**Zwrot** = w którą stronę — pokazuje go **grot**."}, {"id": "d3", "type": "mc", "tag": "l2", "q": "Na kratce wektor zaczyna się w P i idzie 4 kratki w prawo. Jaki to kierunek i zwrot?", "options": ["kierunek pionowy, zwrot w prawo", "kierunek poziomy, zwrot w prawo", "kierunek poziomy, zwrot w lewo", "kierunek ukośny, zwrot w górę"], "answer": 1, "explain": "Ruch tylko w poziomie → **kierunek poziomy**; grot w prawo → **zwrot w prawo**."}, {"id": "d4", "type": "mc", "tag": "l4", "q": "Która jednostka należy do podstawowych jednostek SI?", "options": ["niuton (N)", "metr (m)", "dżul (J)", "wolt (V)"], "answer": 1, "explain": "**Metr** jest jednostką podstawową. Niuton, dżul, wolt są pochodne."}, {"id": "d5", "type": "tf", "tag": "l5", "q": "Skutki oddziaływań — prawda czy fałsz?", "items": [{"s": "Skutek statyczny to zmiana kształtu lub objętości ciała.", "a": true}, {"s": "Skutek dynamiczny to zawsze tylko zmiana temperatury.", "a": false}, {"s": "Kopnięcie piłki, po którym piłka przyspiesza, to skutek dynamiczny.", "a": true}], "explain": "Statyczne = kształt/objętość. Dynamiczne = zmiana **ruchu** (prędkości), nie temperatury."}, {"id": "d6", "type": "short", "tag": "l4", "q": "Podaj symbol jednostki masy w układzie SI.", "accept": ["kg", "KG", "kilogram"], "explain": "Jednostką masy w SI jest **kilogram (kg)**."}], "lessons": [{"id": "l1", "title": "Co to jest wektor i 4 cechy", "minutes": 12, "body": ["**Wektor** to wielkość fizyczna, którą rysujemy jako **strzałkę**. Do pełnego opisu potrzebujemy **4 cech**: **punkt przyłożenia**, **kierunek**, **zwrot** i **wartość** (długość).", "**Punkt przyłożenia** — miejsce, w którym zaczyna się strzałka (gdzie „przyczepiamy” wektor do ciała).", "**Kierunek** — prosta, na której leży wektor (pozioma, pionowa albo ukośna). Na jednej prostej mogą leżeć wektory o różnych zwrotach.", "**Zwrot** — w którą stronę na tej prostej działa wektor (w prawo / w lewo, w górę / w dół). Na rysunku pokazuje go **grot** strzałki.", "**Wartość** — ile „ma” wektor (np. 5 N, 3 m/s); na kratce to **długość** strzałki w kratkach (w ustalonej skali).", "Wielkości **skalarne** (np. masa, czas, temperatura) mają tylko wartość — bez kierunku i zwrotu."], "keyPoints": ["wektor = 4 cechy: punkt przyłożenia, kierunek, zwrot, wartość", "kierunek = prosta; zwrot = strona (grot); wartość = długość", "punkt przyłożenia = początek strzałki", "skalar ma tylko wartość"], "why": [{"q": "Dlaczego sama wartość nie wystarczy do opisu siły?", "a": "Bo siła 10 N w prawo to coś innego niż 10 N w lewo albo w górę — zmienia się ruch albo kształt ciała inaczej."}, {"q": "Czym różni się kierunek od zwrotu?", "a": "Kierunek to prosta (np. pozioma). Zwrot mówi, w którą stronę na tej prostej (w prawo czy w lewo)."}], "tldr": {"pl": "Wektor ma 4 cechy: punkt przyłożenia (start strzałki), kierunek (prosta), zwrot (grot), wartość (długość). Skalar ma tylko wartość.", "en": "A vector has 4 features: point of application, direction (line), sense (arrowhead), magnitude (length).", "ru": "У вектора 4 признака: точка приложения, направление (прямая), смысл/ориентация (остриё), значение (длина)."}, "images": [{"img": "v_cechy_demo", "caption": "Na kratce widać wszystkie 4 cechy naraz"}]}, {"id": "l2", "title": "Opisywanie wektorów na kratce", "minutes": 14, "body": ["Na **kratce** (kwadratach w zeszycie) łatwo opisać wektor krok po kroku:", "1. Znajdź **punkt przyłożenia** — kratkę, w której zaczyna się strzałka (oznaczamy P).", "2. Spójrz wzdłuż strzałki: czy leży **poziomo**, **pionowo**, czy **ukośnie**? To jest **kierunek**.", "3. Dokąd wskazuje **grot**? W prawo, lewo, górę, dół albo ukośnie (np. w prawo i w górę) — to **zwrot**.", "4. Policz, o ile kratek strzałka „przeskakuje” w poziomie i w pionie. Długość = wartość (czasem podają „3 kratki w prawo”).", "Uwaga: wektor o tym samym kierunku i wartości, ale **przeciwnym zwrocie**, to już **inny** wektor. Zmiana punktu przyłożenia też daje inny wektor siły w fizyce."], "keyPoints": ["kolejność opisu: P → kierunek → zwrot → wartość", "na kratce licz kratki Δx i Δy", "przeciwny zwrot = inny wektor", "inny punkt przyłożenia = inny wektor siły"], "why": [{"q": "Dlaczego na sprawdzianie rysują wektory na kratce?", "a": "Żeby dało się dokładnie policzyć długość i porównać kierunek oraz zwrot bez linijki w skali — wystarczy policzyć kwadraty."}, {"q": "Czy dwa wektory o tej samej długości to zawsze to samo?", "a": "Nie — muszą mieć też ten sam kierunek, zwrot i (dla siły) punkt przyłożenia."}], "tldr": {"pl": "Opis na kratce: punkt P, kierunek (poz./pion./ukośny), zwrot (grot), wartość (ile kratek).", "en": "On a grid: point P, line direction, arrow sense, length in squares.", "ru": "На сетке: точка P, направление, ориентация стрелки, длина в клетках."}, "images": [{"img": "v_h_p24_r3", "caption": "P(2,4), kierunek poziomy, zwrot w prawo, wartość 3 kratki"}, {"img": "v_diag_p22_ne3", "caption": "Ukośny: Δx=3, Δy=3"}]}, {"id": "l3", "title": "Rysowanie wektora z opisu", "minutes": 12, "body": ["Gdy dostajesz **opis słowny**, rysujesz odwrotnie:", "1. Zaznacz **punkt przyłożenia** (np. „w punkcie A” albo „na środku dolnej krawędzi”).", "2. Poprowadź prostą we wskazanym **kierunku** (poziomo / pionowo / pod kątem).", "3. Odłóż długość odpowiadającą **wartości** (np. 4 kratki) i narysuj **grot** we wskazanym **zwrocie**.", "Na kartkówce zwykle masz linijkę, ołówek i gumkę — rysuj cienko, grot wyraźny, punkt P zaznacz kropką.", "Najczęstsze pułapki: pomylenie zwrotu (grot w drugą stronę), zła długość, start w złym punkcie, kierunek „ukośny” narysowany jak poziomy."], "keyPoints": ["kolejność rysowania: P → kierunek → długość → grot", "grot musi zgadzać się ze zwrotem z opisu", "sprawdź Δx i Δy na kratce", "zabierz linijkę, ołówek, gumkę"], "why": [{"q": "Dlaczego najpierw punkt, a dopiero potem grot?", "a": "Bo strzałka zaczyna się w punkcie przyłożenia — bez niego nie wiadomo, gdzie przyłożyć wektor do ciała."}, {"q": "Co zrobić, gdy opis mówi „przeciwnie do poprzedniego”?", "a": "Ten sam kierunek i wartość, ale odwrócony zwrot (grot w drugą stronę); punkt przyłożenia zwykle ten sam, jeśli nie napisano inaczej."}], "tldr": {"pl": "Z opisu: zaznacz P, kierunek, odłóż wartość, dorysuj grot (zwrot). Sprawdź pułapki: zwrot, długość, punkt.", "en": "From a description: mark P, direction, length, arrowhead.", "ru": "По описанию: точка P, направление, длина, остриё."}, "images": [{"img": "v_v_p33_u4", "caption": "Opis: P(3,3), pionowo, w górę, 4 kratki"}]}, {"id": "l4", "title": "Jednostki SI i wzorce", "minutes": 10, "body": ["Układ **SI** ma **podstawowe jednostki**. Na kartkówkę warto znać szczególnie:", "• **metr (m)** — długość", "• **kilogram (kg)** — masa", "• **sekunda (s)** — czas", "• **kelwin (K)** — temperatura", "• **amper (A)** — natężenie prądu", "**Wzorce** (definicje na poziomie SP7):", "• **metr** — droga, jaką światło przebywa w próżni w czasie **1/299 792 458** sekundy", "• **sekunda** — związana z drganiami atomu **cezu-133** (określona liczba okresów promieniowania)", "• **kilogram** — historycznie wzorzec z platyny i irydu przechowywany w **Sèvres** (Międzynarodowy Wzorzec Kilograma, IPK); od 2019 r. kilogram definiuje się przez stałą Plancka (to samo „ile waży”, nowa definicja)", "Pamiętaj: jednostka siły **niuton (N)** to jednostka pochodna (1 N = 1 kg·m/s²) — siła jest wektorem."], "keyPoints": ["SI: m, kg, s, K, A (podstawowe)", "metr ↔ światło w próżni / 299792458", "sekunda ↔ cez-133", "kg: historycznie Sèvres / dziś stała Plancka", "niuton = jednostka siły (pochodna)"], "why": [{"q": "Po co wzorce jednostek?", "a": "Żeby metr i kilogram oznaczały to samo w każdym laboratorium na świecie — pomiary da się porównywać."}, {"q": "Czy kelwin i stopień Celsjusza to to samo?", "a": "Nie. Różnica temperatur jest taka sama (1 K = 1 °C różnicy), ale zero jest inne: 0 K to zero bezwzględne, 0 °C to topnienie lodu."}], "tldr": {"pl": "SI: m, kg, s, K, A. Metr — światło; sekunda — cez-133; kg — Sèvres / stała Plancka.", "en": "SI base: m, kg, s, K, A. Metre from light speed; second from caesium-133; kilogram historically IPK, now Planck.", "ru": "СИ: м, кг, с, К, А. Метр — свет; секунда — цезий-133; кг — Севр / постоянная Планка."}}, {"id": "l5", "title": "Skutki statyczne i dynamiczne", "minutes": 10, "body": ["Oddziaływania między ciałami mogą mieć dwa rodzaje skutków:", "**Skutki statyczne** — zmienia się **kształt** lub **objętość** ciała (albo ciało jest odkształcone sprężyście), ale nie musi zmieniać się ruch. Przykłady: ściśnięta gąbka, ugięta deska, rozciągnięta sprężyna, wgnieciona puszka.", "**Skutki dynamiczne** — zmienia się **ruch** ciała: prędkość (wartość lub kierunek), ciało rusza, przyspiesza, hamuje albo skręca. Przykłady: kopnięta piłka, rower, który nabiera prędkości, hamujący samochód.", "To samo oddziaływanie (np. pchanie) może dawać skutek statyczny albo dynamiczny — zależy od sytuacji (czy ciało może się swobodnie ruszyć)."], "keyPoints": ["statyczne → zmiana kształtu/objętości", "dynamiczne → zmiana ruchu (prędkości)", "siła może dawać oba typy skutków", "odkształcenie ≠ zawsze ruch"], "why": [{"q": "Dlaczego ściśnięcie piłki ręką to skutek statyczny?", "a": "Bo zmienia się kształt piłki (jest spłaszczona), a niekoniecznie jej prędkość jako całości."}, {"q": "Czy hamowanie to skutek dynamiczny?", "a": "Tak — zmienia się prędkość (maleje), czyli zmienia się ruch."}], "tldr": {"pl": "Statyczne = kształt/objętość. Dynamiczne = zmiana ruchu (prędkości).", "en": "Static effects change shape/volume; dynamic effects change motion.", "ru": "Статические — форма/объём; динамические — изменение движения."}}], "flashcards": [{"front": "4 cechy wektora?", "back": "punkt przyłożenia, kierunek, zwrot, wartość", "tag": "l1"}, {"front": "Co to kierunek wektora?", "back": "Prosta, na której leży wektor (pozioma / pionowa / ukośna).", "tag": "l1"}, {"front": "Co to zwrot?", "back": "W którą stronę na danej prostej — pokazuje grot strzałki.", "tag": "l1"}, {"front": "Co to wartość wektora?", "back": "„Ile ma” wektor — na rysunku długość strzałki (np. w kratkach lub w niutonach).", "tag": "l1"}, {"front": "Punkt przyłożenia", "back": "Miejsce początku strzałki — gdzie wektor „dotyka” ciała.", "tag": "l1"}, {"front": "Skalar vs wektor", "back": "Skalar: tylko wartość (masa, czas). Wektor: 4 cechy (np. siła, prędkość).", "tag": "l1"}, {"front": "Jak opisać wektor na kratce?", "back": "P → kierunek → zwrot → ile kratek (Δx, Δy).", "tag": "l2"}, {"front": "Przeciwny zwrot", "back": "Ten sam kierunek i często ta sama wartość, ale grot w drugą stronę = inny wektor.", "tag": "l2"}, {"front": "Kolejność rysowania z opisu", "back": "1) P 2) kierunek 3) długość 4) grot", "tag": "l3"}, {"front": "Pułapki przy rysowaniu", "back": "Zły zwrot, zła długość, zły punkt P, mylenie poziomu z ukosem.", "tag": "l3"}, {"front": "Jednostki podstawowe SI (5)", "back": "m, kg, s, K, A", "tag": "l4"}, {"front": "Wzorzec metra", "back": "Droga światła w próżni w czasie 1/299 792 458 s.", "tag": "l4"}, {"front": "Wzorzec sekundy", "back": "Definicja oparta o atom cezu-133.", "tag": "l4"}, {"front": "Wzorzec kilograma", "back": "Historycznie IPK w Sèvres; od 2019 r. — stała Plancka.", "tag": "l4"}, {"front": "Skutek statyczny", "back": "Zmiana kształtu lub objętości ciała.", "tag": "l5"}, {"front": "Skutek dynamiczny", "back": "Zmiana ruchu — prędkości (wartości lub kierunku).", "tag": "l5"}, {"front": "Przykład statyczny", "back": "Ściśnięta gąbka, ugięta linijka, rozciągnięta sprężyna.", "tag": "l5"}, {"front": "Przykład dynamiczny", "back": "Kopnięta piłka, hamujący rower, zmiana kierunku po odbiciu.", "tag": "l5"}, {"front": "Jednostka siły", "back": "Niuton (N) — jednostka pochodna; siła jest wektorem.", "tag": "l4"}, {"front": "Na kartkówkę zabierz…", "back": "Linijkę, ołówek i gumkę (do rysowania wektorów).", "tag": "l3"}], "quiz": [{"id": "q1", "type": "mc", "tag": "l1", "q": "Które zestawienie to poprawne 4 cechy wektora?", "options": ["masa, czas, długość, temperatura", "punkt przyłożenia, kierunek, zwrot, wartość", "kierunek, zwrot, kolor, grubość", "punkt, odcinek, prosta, okrąg"], "answer": 1, "explain": "Cechy wektora: **punkt zwy cech", "kierunek ≠ zwrot"]}, {"n": 3, "title": "Kierunek vs zwrot vs wartość", "tags": ["l1"], "body": ["Kierunek = prosta. Zwrot = strona (grot). Wartość = długość. Na jednej prostej poziomej możesz mieć zwrot w prawo albo w lewo."], "checks": [{"ref": "q4"}, {"ref": "q26"}, {"ref": "q28"}], "lessons": ["l1"], "images": [{"img": "v_cechy_demo", "caption": "wszystkie cechy"}]}, {"n": 4, "title": "Skalar czy wektor?", "tags": ["l1"], "body": ["Siła, prędkość, przyspieszenie → wektory. Masa, czas, temperatura, energia (na tym poziomie) → skalary."], "checks": [{"ref": "q34"}, {"ref": "q30"}]}, {"n": 5, "title": "Na kartkówkę: wyjaśnij różnicę", "tags": ["l1"], "body": ["Ekspert jednym zdaniem odróżnia kierunek od zwrotu i podaje przykład z pchaniem drzwi."], "checks": [{"ref": "e1"}, {"ref": "q27"}]}]}, {"id": "opis-kratka", "title": "Opisywanie wektorów na kratce", "tags": ["l2"], "levels": [{"n": 1, "title": "Kratka jak mapa strzałki", "tags": ["l2"], "body": ["Zeszyt w kratkę = siatka. Liczysz, skąd startuje strzałka i dokąd idzie grot."], "checks": [{"ref": "d3"}, {"q": {"id": "k1a", "type": "mc", "tag": "l2", "q": "Od czego zaczynasz opis wektora na kratce?", "options": ["od koloru kredki", "od punktu przyłożenia P", "od jednostki SI", "od temperatury"], "answer": 1, "explain": "Najpierw **punkt przyłożenia P**."}}], "images": [{"img": "v_h_p24_r3", "caption": "przykład poziomy"}]}, {"n": 2, "title": "Odczytaj kierunek i zwrot", "tags": ["l2"], "body": ["Tylko w poziomie / tylko w pionie / ukos. Grot mówi zwrot."], "checks": [{"ref": "q5"}, {"ref": "q8"}]}, {"n": 3, "title": "Co się zmienia: zwrot, wartość, punkt?", "tags": ["l2"], "body": ["Porównuj rysunki: ten sam kierunek, ale inny grot → inny zwrot. Dłuższa strzałka → inna wartość. Start wyżej → inny P."], "checks": [{"ref": "q6"}, {"ref": "q7"}, {"ref": "q15"}], "lessons": ["l2"], "images": [{"img": "v_h_p24_r5", "caption": "inna wartość"}, {"img": "v_h_p26_r3", "caption": "inny P"}]}, {"n": 4, "title": "Ukos i pełny opis", "tags": ["l2"], "body": ["Przy ukosie podaj Δx i Δy. Opis otwarty = wszystkie 4 cechy."], "checks": [{"ref": "q14"}, {"ref": "q29"}]}, {"n": 5, "title": "Ekspert: opisz jak na kartkówce", "tags": ["l2"], "body": ["Pełny opis własnymi słowami + sprawdzenie na innym rysunku."], "checks": [{"ref": "e2"}, {"q": {"id": "k5a", "type": "mc", "tag": "l2", "q": "Na kratce wektor o przeciwnym zwrocie to:", "options": ["ten sam wektor", "inny wektor", "tylko inna jednostka", "skalar"], "answer": 1, "explain": "Przeciwny zwrot oznacza **inny** wektor."}}]}]}, {"id": "rysowanie", "title": "Rysowanie wektora z opisu", "tags": ["l3"], "levels": [{"n": 1, "title": "Od słów do strzałki", "tags": ["l3"], "body": ["Opis → najpierw P, potem kierunek, długość, grot. Na kartkówkę: linijka, ołówek, gumka."], "checks": [{"q": {"id": "r1a", "type": "mc", "tag": "l3", "q": "Pierwszy krok rysowania wektora z opisu to:", "options": ["narysować grot", "zaznaczyć punkt przyłożenia", "policzć ampery", "zmienić temperaturę"], "answer": 1, "explain": "Zaczynamy od **P**."}}, {"q": {"id": "r1b", "type": "mc", "tag": "l3", "q": "Co zabrać na kartkówkę z rysowaniem wektorów?", "options": ["kalkulator naukowy obowiązkowo", "linijkę, ołówek i gumkę", "mikroskop", "nic — tylko długopis zły do gumki"], "answer": 1, "explain": "**Linijka, ołówek, gumka** — wskazówka na kartkówkę."}}]}, {"n": 2, "title": "Wybierz rysunek do opisu", "tags": ["l3"], "body": ["Ćwiczenie jak na kartkówce: czytasz opis i wybierasz właściwą strzałkę spośród dystraktorów."], "checks": [{"ref": "q9"}, {"ref": "q10"}]}, {"n": 3, "title": "Pułapki: zwrot, wartość, punkt", "tags": ["l3"], "body": ["Dystraktory często odwracają grot, zmieniają długość albo przesuwają P."], "checks": [{"ref": "q11"}, {"ref": "q12"}, {"ref": "q13"}], "lessons": ["l3"]}, {"n": 4, "title": "Kolejność kroków", "tags": ["l3"], "body": ["Ułóż algorytm: P → kierunek → długość → grot."], "checks": [{"ref": "q32"}, {"ref": "e3"}]}, {"n": 5, "title": "Ekspert: narysuj w głowie i wybierz", "tags": ["l3"], "body": ["Trudniejsze opisy (ukośne, przeciwny zwrot) — wybór spośród 4 rysunków."], "checks": [{"ref": "q31"}, {"q": {"id": "r5a", "type": "mc", "tag": "l3", "q": "Opis: „przeciwnie do wektora w prawo” przy tym samym kierunku oznacza:", "options": ["ten sam zwrot", "przeciwny zwrot (grot w lewo)", "inną jednostkę SI", "skutek statyczny"], "answer": 1, "explain": "Przeciwny zwrot = grot w drugą stronę."}}]}]}, {"id": "si-wzorce", "title": "Jednostki SI i wzorce", "tags": ["l4"], "levels": [{"n": 1, "title": "Pięć jednostek na start", "tags": ["l4"], "body": ["Zapamiętaj: **m, kg, s, K, A**. Niuton to już jednostka pochodna siły."], "checks": [{"ref": "d4"}, {"ref": "q16"}, {"ref": "d6"}]}, {"n": 2, "title": "Co mierzy każda jednostka?", "tags": ["l4"], "body": ["m — długość, kg — masa, s — czas, K — temperatura, A — prąd."], "checks": [{"ref": "q20"}, {"ref": "q21"}, {"ref": "q33"}]}, {"n": 3, "title": "Wzorce: metr i sekunda", "tags": ["l4"], "body": ["Metr ↔ światło w próżni. Sekunda ↔ cez-133."], "checks": [{"ref": "q17"}, {"ref": "q18"}], "lessons": ["l4"]}, {"n": 4, "title": "Kilogram: Sèvres i Planck", "tags": ["l4"], "body": ["Historycznie wzorzec z Sèvres (IPK). Od 2019 r. definicja przez stałą Plancka — na kartkówce często bywa wersja z Sèvres."], "checks": [{"ref": "q19"}, {"q": {"id": "si4a", "type": "mc", "tag": "l4", "q": "Niuton (N) to jednostka:", "options": ["podstawowa masy", "pochodna siły", "podstawowa czasu", "wzorzec cezu"], "answer": 1, "explain": "**N** = jednostka siły, pochodna (kg·m/s²)."}}]}, {"n": 5, "title": "Na kartkówkę: szybka ściąga SI", "tags": ["l4"], "body": ["Wyjaśnij wzorce własnymi słowami i odróżnij podstawowe od pochodnych."], "checks": [{"ref": "e4"}, {"q": {"id": "si5a", "type": "mc", "tag": "l4", "q": "Kelwin to jednostka:", "options": ["masy", "temperatury", "siły", "długości"], "answer": 1, "explain": "**K** — temperatura."}}, {"q": {"id": "si5b", "type": "mc", "tag": "l4", "q": "Która lista to jednostki podstawowe SI?", "options": ["m, kg, s, K, A", "N, J, W", "cm, g, min", "km, t, h"], "answer": 0, "explain": "Podstawowe: **m, kg, s, K, A**."}}]}]}, {"id": "skutki", "title": "Skutki statyczne i dynamiczne", "tags": ["l5"], "levels": [{"n": 1, "title": "Dwa rodzaje skutków", "tags": ["l5"], "body": ["**Statyczne** = kształt/objętość. **Dynamiczne** = zmiana ruchu."], "checks": [{"ref": "d5"}, {"ref": "q22"}]}, {"n": 2, "title": "Przykłady z życia", "tags": ["l5"], "body": ["Gąbka, sprężyna, puszka vs kopnięcie, hamowanie, skręt."], "checks": [{"ref": "q23"}, {"ref": "q24"}]}, {"n": 3, "title": "Prawda czy fałsz + kategorie", "tags": ["l5"], "body": ["Ćwicz rozróżnianie — to typowe krótkie zadanie na kartkówce."], "checks": [{"ref": "q25"}, {"q": {"id": "sk3a", "type": "mc", "tag": "l5", "q": "Wgniecenie puszki to skutek:", "options": ["dynamiczny", "statyczny", "tylko SI", "brak oddziaływania"], "answer": 1, "explain": "Zmiana kształtu = **statyczny**."}}], "lessons": ["l5"]}, {"n": 4, "title": "To samo pchnięcie — różny skutek", "tags": ["l5"], "body": ["Pchasz ścianę → raczej odkształcenie (statyczny). Pchasz wózek → rusza (dynamiczny)."], "checks": [{"q": {"id": "sk4a", "type": "mc", "tag": "l5", "q": "Pchanie ciężkiej szafy, która się nie rusza, ale lekko ugina ściankę, to głównie skutek:", "options": ["dynamiczny", "statyczny", "tylko optyczny", "brak oddziaływania"], "answer": 1, "explain": "Zmiana kształtu (ugięcie) przy braku ruchu szafy → **statyczny**."}}, {"q": {"id": "sk4b", "type": "mc", "tag": "l5", "q": "Wózek po pchnięciu jedzie coraz szybciej. Skutek:", "options": ["statyczny", "dynamiczny", "tylko SI", "tylko wzorzec"], "answer": 1, "explain": "Zmiana prędkości → **dynamiczny**."}}]}, {"n": 5, "title": "Ekspert: wyjaśnij parę przykładów", "tags": ["l5"], "body": ["Opisz różnicę własnymi słowami z przykładami."], "checks": [{"ref": "e5"}, {"q": {"id": "sk5a", "type": "mc", "tag": "l5", "q": "Hamowanie roweru zmienia prędkość. To skutek:", "options": ["statyczny", "dynamiczny", "tylko chemiczny", "wzorzec metra"], "answer": 1, "explain": "Zmiana ruchu = **dynamiczny**."}}]}]}], "life": [{"concept": "Cechy wektora w sporcie i ruchu", "intro": "Wektor to nie tylko strzałka w zeszycie — w sporcie cały czas masz kierunek i zwrot.", "examples": [{"t": "Podanie piłki", "d": "Piłka leci z konkretną prędkością: ma wartość (jak szybko), kierunek i zwrot (dokąd)."}, {"t": "Pchnięcie drzwi", "d": "Ta sama siła „mocno”, ale w prawo albo w lewo — inny zwrot, inne otwarcie drzwi."}, {"t": "Rzut do kosza", "d": "Tor i „moc” rzutu: za krótka wartość → pudło; zły zwrot → piłka obok obręczy."}, {"t": "Start sprintera", "d": "Wybija się w przód (zwrot), nie w tył — ten sam tor bieżni (kierunek), inny zwrot = dyskwalifikacja wyobraźni."}, {"t": "Winda w bloku", "d": "Ruch pionowy: kierunek pionowy, zwrot w górę albo w dół."}, {"t": "Hokej / unihokej", "d": "Kij nadaje krążkowi zwrot — odbicie pod złym kątem to strata okazji."}, {"t": "Rower na ścieżce", "d": "Hamujesz: siła tarcia ma zwrot przeciwny do jazdy → skutek dynamiczny (zwalniasz)."}]}, {"concept": "GPS, mapy i „dokąd”", "intro": "Nawigacja to ciągłe wektory przemieszczenia.", "examples": [{"t": "Nawigacja w telefonie", "d": "„Skręć w prawo za 100 m” = kierunek drogi + zwrot skrętu + wartość odległości."}, {"t": "Krokometr / spacja", "d": "Aplikacja liczy przebyty dystans (wartość) po trasie (kierunek)."}, {"t": "Kompas w lesie", "d": "Azymut to kierunek na mapie; idziesz ze zwrotem „tam”, nie „stąd uciekaj w przeciwną”."}, {"t": "Tramwaj na pętli", "d": "Linia ma kierunek toru; zwrot mówi, czy jedziesz do centrum, czy z powrotem."}, {"t": "Winda vs schody", "d": "Schody ruchome: zwrot „w górę” albo „w dół” na tym samym torze."}, {"t": "Strzałka na przystanku", "d": "Piktogram „kierunek do centrum” to uproszczony wektor na planie miasta."}, {"t": "Gra miejska / quest", "d": "„Idź 200 m na północ” = wartość + kierunek + zwrot."}]}, {"concept": "Siły w domu i szkole", "intro": "Siła jest wektorem — punkt przyłożenia ma znaczenie.", "examples": [{"t": "Otwieranie drzwi za klamkę", "d": "Punkt przyłożenia daleko od zawiasów → łatwiej (większy moment w praktyce)."}, {"t": "Pchanie szafy", "d": "Jak szafa nie jedzie, zostaje ugięcie / nacisk — bliżej skutku statycznego."}, {"t": "Wózek sklepowy", "d": "Pchnięcie z tyłu: P na rękojeści, zwrot do przodu → wózek przyspiesza."}, {"t": "Plecak na ramionach", "d": "Ciężar działa w dół (zwrot), punkt w środku masy plecaka."}, {"t": "Odkręcanie butelki", "d": "Siła na nakrętkę ma zwrot „w lewo/w prawo” przy odkręcaniu."}, {"t": "Przycisk w windzie", "d": "Mała siła, konkretny punkt przyłożenia na przycisku."}, {"t": "Przeciąganie liny na WF", "d": "Przeciwne zwroty sił — kto ma większą wartość wypadkową."}]}, {"concept": "Jednostki SI na co dzień", "intro": "Metry, kilogramy i sekundy są wszędzie — kelwin rzadziej, ale temperatura też.", "examples": [{"t": "Etykieta w sklepie", "d": "Masa w **kg**, objętość w litrach (pochodne od m³)."}, {"t": "Limit prędkości", "d": "km/h — zbudowane z metra i sekundy."}, {"t": "Timer do jajek", "d": "Czas w **sekundach** i minutach."}, {"t": "Termometr za oknem", "d": "W domu zwykle °C, ale w SI temperatura to **kelwin**."}, {"t": "Ładowarka / bezpiecznik", "d": "Natężenie w **amperach (A)**."}, {"t": "Wzrost na badaniach", "d": "Podają wzrost w **metrach** lub cm."}, {"t": "Przepis kulinarny", "d": "200 g mąki — gram to część kilograma."}]}, {"concept": "Wzorce i „po co to komu”", "intro": "Wzorce sprawiają, że metr w Polsce i w Japonii to to samo.", "examples": [{"t": "Zakupy na wagę", "d": "Waga w sklepie musi być wzorcowana — kilogram ma być uczciwy."}, {"t": "Sportowy finisz", "d": "Czas mierzy się dokładnie — definicja sekundy musi być wspólna."}, {"t": "GPS i satelity", "d": "Pozycja zależy od precyzyjnego czasu i długości fal / sygnałów."}, {"t": "Fizyka w pracowni", "d": "Linijka w cm odwołuje się do metra."}, {"t": "Apteka", "d": "Dawki leków w miligramach — część kilograma."}, {"t": "Pogoda w aplikacji", "d": "Temperatura porównywalna na całym świecie dzięki skali."}, {"t": "Ładowanie telefonu", "d": "Ampery i wolty na zasilaczu — wspólne jednostki."}]}, {"concept": "Skutki statyczne wokół ciebie", "intro": "Gdy coś się ugina, wygina, ściska — bez koniecznej jazdy w dal.", "examples": [{"t": "Gąbka do naczyń", "d": "Ściskasz — zmienia kształt (statyczny)."}, {"t": "Gumka recepturka", "d": "Rozciągasz — większa długość, inny kształt."}, {"t": "Piłka do ściskania antystresowa", "d": "Odkształcasz dłonią."}, {"t": "Materac / sofa", "d": "Siadasz — ugięcie (statyczne), zanim „toniesz” w miejscu."}, {"t": "Puszka po napoju", "d": "Jak ktoś wgniecie — zmiana objętości/kształtu."}, {"t": "Linijka wystająca z biurka", "d": "Zbyt mocno naciśnięta — ugięcie."}, {"t": "Buty na śniegu", "d": "Śnieg się ugnia pod stopą — odkształcenie podłoża."}]}, {"concept": "Skutki dynamiczne wokół ciebie", "intro": "Gdy coś przyspiesza, hamuje albo skręca.", "examples": [{"t": "Autobus rusza", "d": "Czujesz szarpnięcie — zmiana prędkości."}, {"t": "Hamowanie na rowerze", "d": "Siła tarcia zmienia ruch."}, {"t": "Piłka nożna po strzale", "d": "Nabiera prędkości — skutek dynamiczny."}, {"t": "Hulajnoga na zakręcie", "d": "Zmiana kierunku ruchu."}, {"t": "Piłka odbija się od ściany", "d": "Zmiana zwrotu prędkości."}, {"t": "Start windy", "d": "Przez chwilę „ciężko” — przyspieszenie w górę."}, {"t": "Puck / krążek po uderzeniu", "d": "Z spoczynku w ruch — klasyczny skutek dynamiczny."}]}]};</script>
