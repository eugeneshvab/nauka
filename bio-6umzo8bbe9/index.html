<style>

 header,nav,footer,.noprint{display:none!important}body{background:#fff;font-size:12px}

}

 .ttab tr{border:1px solid var(--line);border-radius:12px;margin:0 0 10px;padding:8px 10px;background:var(--card)}.ttab tbody th{background:none;border:0;font-size:1.08rem;color:var(--pri);padding:2px 0 4px;white-space:normal}
 .ttab td{border:0;padding:4px 0}.ttab td:before{content:attr(data-label);display:block;font-size:.78rem;color:var(--muted);font-weight:600;margin-bottom:2px}.ttab tr.tnr{margin-top:-6px;border-color:var(--bad)}.ttab tr.tnr td:before{content:none}}
@media (max-width:560px){.wtpl i{display:none}.wtpl>div{flex-basis:100%}}

<style id="ogarnio-theme">
:root{--og-canvas:#F7F3EB;--og-surface:#FFFCF6;--og-ink:#292D29;--og-ink-soft:#68665D;--og-hair:#DDD9D0;--og-sage:#607361;--og-sage-pale:#E3E9DF;

--bg:var(--og-canvas);--card:var(--og-surface);--ink:var(--og-ink);--muted:var(--og-ink-soft);--pri:var(--og-sage);--pri2:var(--og-sage-pale);
--ok:#4E7A52;--okbg:var(--og-sage-pale);--bad:var(--og-clay);--badbg:var(--og-clay-pale);--warn:var(--og-ochre);--warnbg:var(--og-ochre-pale);--line:var(--og-hair);--r:22px;
--og-shadow:0 1px 1px rgba(0,0,0,.05),0 6px 22px rgba(0,0,0,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",Roboto,Ubuntu,sans-serif;background:var(--og-canvas);color:var(--og-ink);-webkit-font-smoothing:antialiased}
h1,h2,h3,.score{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,"Segoe UI",Roboto,sans-serif;font-weight:600;letter-spacing:-.02em}
header{position:relative;overflow:hidden;background:var(--og-canvas);color:var(--og-ink);padding:18px 20px 16px}

.card{background:var(--og-surface);border:0;border-radius:var(--r);padding:18px 18px;box-shadow:var(--og-shadow)}

<script>window.TP_CONTENT={"schemaVersion": 1, "meta": {"id": "bio7-skora", "title": "Biologia: skóra – budowa, funkcje i choroby", "subtitle": "Funkcje skóry · termoregulacja · warstwy skóry i wytwory naskórka · melanina i witamina D · grzybica, trądzik młodzieńczy · czerniak i objawy ABCDE. Sprawdzian: czwartek 8 października.", "subject": "Biologia", "grade": "Klasa 7 SP", "lang": "pl", "explainLangs": ["pl", "en", "ru"], "estimatedMinutes": 75, "sourceNote": "Źródło: zdjęcia podręcznika, s. 14, 15, 18, 19 (funkcje skóry, melanina, „Zapamiętaj”, „Sprawdź, co wiesz i umiesz!”, grzybica, czerniak, trądzik młodzieńczy, ABCDE). Stron 16–17 (budowa skóry) nie było na zdjęciach – szczegóły warstw (warstwa rozrodcza i zrogowaciała, skład skóry właściwej, tkanka podskórna, wytwory naskórka) uzupełniono według podstawy programowej kl. 7 – porównaj z zeszytem.", "uncertain": ["Strony 16–17 (budowa skóry) – brak zdjęć; opis warstw naskórka (rozrodcza, zrogowaciała, keratyna), skład skóry właściwej (tkanka łączna, włókna kolagenowe i sprężyste, mięśnie przywłosowe), funkcje tkanki podskórnej oraz wytwory naskórka (włosy, paznokcie) uzupełnione z podstawy programowej kl. 7.", "Odpowiedź wzorcowa na pytanie o 20% skóry (odwodnienie, utrata ciepła, wstrząs) to wniosek z funkcji skóry – na zdjęciach podręcznika nie ma gotowej odpowiedzi.", "Przykłady w zakładce „W życiu” i część rad (np. ponowne smarowanie kremem co ok. 2 h) są spoza podręcznika."], "tutorMaterial": "TEMAT: skóra – budowa, funkcje i choroby (biologia, klasa 7 SP). Mów po polsku, krótko, konkretnie. Najpierw pytaj ucznia.\n\nNAJWAŻNIEJSZE\n1) Funkcje skóry (5): chroni (bakterie, wirusy, chemikalia, nadmiar UV, urazy); reguluje temperaturę; wydziela i wydala (pot: nadmiar soli, mocznik; sebum); produkuje witaminę D pod wpływem słońca (kości i zęby); odbiera bodźce – receptory: dotyk/nacisk, ciepło, zimno, ból.\n2) Termoregulacja: gorąco → naczynia krwionośne się ROZSZERZAJĄ, ciało oddaje ciepło; gruczoły potowe wydzielają pot, który PARUJE i ochładza. Zimno → naczynia się KURCZĄ, ciepło zostaje w środku.\n3) Uszkodzenie już 1% skóry (≈ powierzchnia dłoni) jest groźne. Utrata 20% skóry jest śmiertelnie niebezpieczna: brak bariery (zakażenia), utrata wody i soli (odwodnienie), utrata ciepła (termoregulacja), ból i wstrząs.\n4) Budowa: skóra = naskórek + skóra właściwa; pod nią tkanka podskórna. Naskórek: nabłonek; warstwa rozrodcza (komórki się dzielą, melanina) i zrogowaciała (martwe komórki z keratyną, złuszczają się); BEZ naczyń krwionośnych. Skóra właściwa: tkanka łączna (włókna kolagenowe i sprężyste), naczynia krwionośne, zakończenia nerwowe (receptory), gruczoły potowe i łojowe, mieszki włosowe. Tkanka podskórna: tłuszcz – izolacja, zapas energii, amortyzacja. Wytwory naskórka: włosy, paznokcie (keratyna), gruczoły.\n5) Gruczoł potowy → pot (chłodzenie, wydalanie). Gruczoł łojowy → łój = sebum (natłuszcza skórę i włosy).\n6) Melanina: barwnik w naskórku, mieszkach włosowych i tęczówce; chroni komórki przed UV; opalenizna. Więcej melaniny = ciemniejsza skóra, włosy, oczy. Dużo melaniny częściowo blokuje syntezę witaminy D → osoby o ciemnej karnacji potrzebują trochę więcej słońca.\n7) Choroby skóry: trądzik, łupież, opryszczka, alergie, grzybice; przyczyny bakteryjne, wirusowe, alergiczne, grzybicze.\n8) Grzybica: grzyby; skóra zaczerwieniona, łuszczy się, swędzi; paznokcie zmieniają kolor, kruszą się, odkształcają. Zarażenie: wilgotne miejsca (basen, siłownia), kontakt z zakażoną powierzchnią. Profilaktyka: klapki na basenie, nie dzielić się ręcznikami i butami, skóra sucha i czysta.\n9) Trądzik młodzieńczy: hormony w okresie dojrzewania; twarz, czasem plecy, klatka piersiowa, ramiona; nasilają: dieta, stres, brak higieny, zanieczyszczenie powietrza. Etapy: 1) hormony → nadmiar sebum, 2) zatkane pory, 3) zaskórniki, 4) krosty i stany zapalne. Długotrwały stan zapalny → blizny; leczenie dobiera dermatolog.\n10) Czerniak: jeden z najgroźniejszych nowotworów skóry; nadmiar UV; z pieprzyków (znamion) lub na zdrowej skórze; zmiany w materiale genetycznym komórek → komórki nowotworowe. Profilaktyka: oglądać skórę, zmiany do lekarza; nakrycie głowy, ubranie, krem z filtrem SPF; nie korzystać z solarium.\n11) ABCDE: A – asymetria; B – brzegi niewyraźne, poszarpane, ze zgrubieniami; C – (k)olor łaciaty, nierówny; D – duży rozmiar, średnica powyżej 6 mm; E – ewolucja: zmiana koloru, kształtu, wielkości.\n\nPYTANIA Z PODRĘCZNIKA („Sprawdź, co wiesz i umiesz!”): 1) Wymień warstwy skóry i cechy każdej. 2) Jak skóra utrzymuje stałą temperaturę? 3) Który element skóry pomaga ustrzec się poparzenia lub skłania do zakupu gładkiego, miękkiego koca? (receptory) 4) Dlaczego utrata 20% skóry jest śmiertelnie niebezpieczna? Inne: funkcje potu, rola witaminy D, rola receptorów, gdzie można zarazić się grzybicą i jak się chronić, co poradzić osobie, która lubi się opalać, co zrobić, gdy na skórze pojawi się nowa zmiana.\n\nJAK POMAGAĆ\n- Przy termoregulacji: „Czerwona twarz po biegu – naczynia szersze czy węższe?”\n- Przy warstwach: „Płytkie zadrapanie nie krwawi – dlaczego?”\n- Przy pomyłce pot/łój albo melanina/witamina D: poproś o różnicę jednym zdaniem.\n- Przy ABCDE: poproś, żeby wymienił litery po kolei.\n", "layout": "steps5"}, "images": {"funkcje": {"data": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAHoAhUDASIAAhEBAxEB/8QAGwAAAQUBAQAAAAAAAAAAAAAAAQACAwQFBgf/xABKEAABAwMDAQUGAwUFBwMEAQUBAgMRAAQhBRIxQRMiUWFxBhQygZGhQrHBFSNS0fAzYnKS4RYkQ1OCovE0Y7IHJaPCRHOzw9Li/8QAGgEAAwEBAQEAAAAAAAAAAAAAAAECAwQFBv/EACcRAAICAgICAgICAwEAAAAAAAABAhEDEiExE1EiQQQyM2EUI3FC/9oADAMBAAIRAxEAPwDId1S6Zt2JIK2H3PeyUgEtoWAY9QtP0NXnbo7btS7hLCU3PYMrDYcUopwQE9SVT44HFAaWwXr14Ak3iNi0yIAjMeE8/KkdO7Kzs2bd9xty0UFIdKQokwQdwnMhR+teTtjZ3UyunUrn3V7snG3HG71thLzrBQFJVt5TjOSOnFWmrp9t69Yubln9whtabhbYSl
