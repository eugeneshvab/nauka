CCKEIVR//Z", "alt": "Objawy ABCDE czerniaka: asymetria, brzegi, kolor, duży rozmiar, ewolucja", "source": "podręcznik s. 19", "wide": true}}, "diagnostic": [{"id": "d1", "type": "mc", "tag": "l1", "q": "Która funkcja **nie** jest funkcją skóry?", "options": ["ochrona przed drobnoustrojami", "regulacja temperatury ciała", "wytwarzanie witaminy D", "trawienie pokarmu"], "answer": 3, "explain": "Skóra chroni, reguluje temperaturę, wydala, wytwarza witaminę D i odbiera bodźce. **Trawienie** to praca układu pokarmowego."}, {"id": "d2", "type": "mc", "tag": "l2", "q": "Z jakich warstw składa się skóra (według podręcznika)?", "options": ["z naskórka i skóry właściwej, pod którą jest tkanka podskórna", "tylko z naskórka", "z mięśni i kości", "z naskórka i tkanki nerwowej"], "answer": 0, "explain": "Skóra = **naskórek + skóra właściwa**; pod nią leży **tkanka podskórna**."}, {"id": "d3", "type": "mc", "tag": "l3", "q": "Melanina to:", "options": ["witamina", "barwnik chroniący przed UV", "hormon dojrzewania", "rodzaj grzyba"], "answer": 1, "explain": "**Melanina** – barwnik w naskórku, mieszkach włosowych i tęczówce; chroni przed **UV**."}, {"id": "d4", "type": "mc", "tag": "l4", "q": "Gdzie najłatwiej zarazić się grzybicą stóp?", "options": ["w bibliotece", "na basenie i w szatni siłowni", "na mrozie", "w samolocie"], "answer": 1, "explain": "Grzybica – **miejsca wilgotne** (baseny, siłownie), kontakt z zakażoną powierzchnią."}, {"id": "d5", "type": "tf", "tag": "l5", "q": "Czerniak – prawda czy fałsz?", "items": [{"s": "Czerniak jest związany z nadmiernym promieniowaniem UV.", "a": true}, {"s": "Czerniak może rozwinąć się z pieprzyka.", "a": true}, {"s": "Solarium chroni przed czerniakiem.", "a": false}], "explain": "Czerniak – nadmiar **UV**; rozwija się z **pieprzyków** lub na zdrowej skórze. **Solarium** = bardzo silne UV – szkodzi."}, {"id": "d6", "type": "short", "tag": "l5", "q": "Od jakiej średnicy (w mm) znamię jest podejrzane według zasady ABCDE? Podaj liczbę.", "accept": ["6", "6 mm", "powyżej 6", "powyżej 6 mm"], "num": 6, "tol": 0, "explain": "**D – duży rozmiar**: średnica **powyżej 6 mm**."}], "lessons": [{"id": "l1", "title": "Funkcje skóry", "minutes": 12, "body": ["Skóra to **największy narząd** człowieka – pokrywa całe ciało. Pełni funkcje ważne dla prawidłowej pracy całego organizmu.", "**1. Chroni i broni** – przed **zagrożeniami zewnętrznymi**: bakteriami, wirusami, substancjami chemicznymi, nadmiarem **promieniowania ultrafioletowego (UV)** i urazami. Skóra nie przepuszcza ich w głąb organizmu.", "**2. Reguluje temperaturę ciała** (utrzymuje **stałą temperaturę**): gdy organizm jest **przegrzany**, naczynia krwionośne w skórze **rozszerzają się** – więcej krwi płynie przy powierzchni i ciało **oddaje ciepło**. Gdy jest **zimno**, naczynia **kurczą się** – ciało **zatrzymuje ciepło** wewnątrz. Gdy jest gorąco, **gruczoły potowe** wydzielają **pot**, który **paruje** i **ochładza** ciało.", "**3. Wydziela i wydala** – wraz z potem usuwane są **szkodliwe substancje**, np. **nadmiar soli** i **mocznik**. Skóra wydziela też **sebum** (łój).", "**4. Produkuje witaminę D** – pod wpływem **promieniowania słonecznego**. Witamina D jest potrzebna m.in. do utrzymania w zdrowiu **kości i zębów**.", "**5. Odbiera bodźce** – w skórze są **zakończenia nerwowe** i specjalne komórki, czyli **receptory**. Dzięki nim czujesz **dotyk (nacisk), ciepło, zimno i ból** i reagujesz na zmiany, np. odsuwasz rękę od gorącego przedmiotu, zanim się oparzysz.", "**Pomyśl o tym:** uszkodzenie choćby **1% powierzchni skóry** (np. w wyniku oparzenia) jest groźne dla zdrowia. 1% to mniej więcej **powierzchnia dłoni**."], "keyPoints": ["chroni (drobnoustroje, chemikalia, UV, urazy)", "termoregulacja: gorąco → naczynia się rozszerzają + pot paruje; zimno → naczynia się kurczą", "wydalanie z potem: nadmiar soli, mocznik", "witamina D pod wpływem słońca → kości i zęby", "receptory: dotyk, ciepło, zimno, ból"], "why": [{"q": "Dlaczego pot ochładza ciało?", "a": "Bo pot **paruje** z powierzchni skóry, a do parowania potrzebne jest ciepło – zabiera je ze skóry."}, {"q": "Dlaczego zimą masz blade dłonie, a po biegu czerwoną twarz?", "a": "Zimą naczynia w skórze się **kurczą** (mniej krwi przy powierzchni – ciało oszczędza ciepło). Po wysiłku się **rozszerzają** (więcej krwi przy skórze – ciało oddaje ciepło)."}], "tldr": {"pl": "Skóra: chroni, reguluje temperaturę (naczynia + pot), wydala (sól, mocznik), wytwarza witaminę D, odbiera bodźce (receptory).", "en": "Skin protects, regulates temperature (vessels + sweat), excretes (salt, urea), makes vitamin D, senses stimuli (receptors).", "ru": "Кожа защищает, регулирует температуру (сосуды + пот), выделяет (соль, мочевина), образует витамин D, воспринимает раздражители (рецепторы)."}, "images": [{"img": "funkcje", "caption": "Funkcje skóry (podręcznik s. 14)"}]}, {"id": "l2", "title": "Budowa skóry: warstwy i wytwory naskórka", "minutes": 15, "body": ["**Zapamiętaj (podręcznik):** skóra składa się z **naskórka** i **skóry właściwej**, pod którą znajduje się **tkanka podskórna**. W skórze znajdują się **gruczoły potowe i łojowe, mieszki włosowe, zakończenia nerwowe i naczynia krwionośne**.", "**Naskórek** – zewnętrzna, cienka warstwa zbudowana z **nabłonka wielowarstwowego płaskiego**. **Nie ma naczyń krwionośnych** (komórki odżywiane są z leżącej niżej skóry właściwej).", "• **Warstwa rozrodcza** (najgłębsza część naskórka) – żywe komórki **ciągle się dzielą** i tworzą nowe komórki naskórka. Tu są też komórki wytwarzające **melaninę** (barwnik).", "• **Warstwa zrogowaciała** (na powierzchni) – **martwe, spłaszczone komórki** wypełnione twardym białkiem – **keratyną**. Stale się **złuszczają** i są zastępowane nowymi z warstwy rozrodczej. Chronią przed wysychaniem, urazami i drobnoustrojami.", "**Skóra właściwa** – grubsza warstwa z **tkanki łącznej**, z **włóknami kolagenowymi** (wytrzymałość) i **sprężystymi** (sprężystość). Tu są: **naczynia krwionośne** (odżywianie, termoregulacja), **zakończenia nerwowe – receptory**, **gruczoły potowe** (pot) i **łojowe** (łój = sebum – natłuszcza skórę i włosy, chroni przed wysychaniem), **mieszki włosowe** z korzeniami włosów i drobne **mięśnie przywłosowe** (gęsia skórka).", "**Tkanka podskórna** – leży pod skórą właściwą; to głównie **tkanka tłuszczowa**: **izoluje** przed utratą ciepła, jest **magazynem energii** i **amortyzuje** uderzenia (chroni narządy).", "**Wytwory naskórka:** **włosy** i **paznokcie** (zbudowane z keratyny) oraz **gruczoły potowe i łojowe**. Włosy chronią (np. brwi i rzęsy – oczy przed potem i kurzem), paznokcie chronią opuszki palców i ułatwiają chwytanie drobnych rzeczy.", "_Uwaga: tej części (s. 16–17) nie było na zdjęciach – opis według podstawy programowej kl. 7. Sprawdź z zeszytem, jak nazywał to nauczyciel._"], "keyPoints": ["skóra = naskórek + skóra właściwa; pod nią tkanka podskórna", "naskórek: warstwa rozrodcza (dzieli się) + zrogowaciała (martwe komórki, keratyna); bez naczyń", "skóra właściwa: tkanka łączna, naczynia, receptory, gruczoły potowe i łojowe, mieszki włosowe", "tkanka podskórna: tłuszcz – izolacja, zapas energii, amortyzacja", "wytwory naskórka: włosy, paznokcie, gruczoły"], "why": [{"q": "Dlaczego płytkie zadrapanie naskórka nie krwawi?", "a": "Bo **naskórek nie ma naczyń krwionośnych** – krew pojawia się dopiero, gdy uszkodzona jest skóra właściwa."}, {"q": "Skąd się bierze kurz z „martwego naskórka” w domu?", "a": "Komórki **warstwy zrogowaciałej** stale się złuszczają, a od spodu **warstwa rozrodcza** wytwarza nowe."}], "tldr": {"pl": "Naskórek (rozrodcza + zrogowaciała, bez naczyń) → skóra właściwa (tkanka łączna, naczynia, nerwy, gruczoły, mieszki) → tkanka podskórna (tłuszcz). Włosy i paznokcie = wytwory naskórka.", "en": "Epidermis (basal + cornified layer, no vessels) → dermis (connective tissue, vessels, nerves, glands, follicles) → hypodermis (fat). Hair and nails come from the epidermis.", "ru": "Эпидермис (ростковый + роговой слой, без сосудов) → дерма (соединительная ткань, сосуды, нервы, железы, фолликулы) → подкожная клетчатка (жир). Волосы и ногти — производные эпидермиса."}, "images": [{"img": "przekroj", "caption": "Schemat warstw skóry (rysunek do uzupełnienia brakujących stron)"}]}, {"id": "l3", "title": "Melanina, słońce i witamina D", "minutes": 8, "body": ["**Melanina** to **barwnik**, który znajduje się w **naskórku**, **mieszkach włosowych** i **tęczówce oka**.", "Pełni tam **funkcję ochronną** – zabezpiecza komórki przed szkodliwym działaniem **promieniowania UV**. To dzięki melaninie na skórze pojawia się **opalenizna** (skóra broni się przed słońcem).", "**Im więcej melaniny, tym ciemniejsza barwa skóry, włosów czy oczu.**", "Wysokie stężenie melaniny **częściowo blokuje syntezę witaminy D** w skórze. Dlatego osoby o **ciemnej karnacji** potrzebują **nieco więcej czasu na słońcu**, aby ich skóra wyprodukowała odpowiednią ilość witaminy D.", "Słońce jest więc i potrzebne (witamina D), i groźne (nadmiar UV → oparzenia, przyspieszone starzenie skóry, **czerniak**). Klucz: rozsądek i ochrona."], "keyPoints": ["melanina = barwnik: naskórek, mieszki włosowe, tęczówka", "chroni komórki przed UV; opalenizna", "więcej melaniny → ciemniejsza skóra/włosy/oczy", "dużo melaniny częściowo blokuje wytwarzanie witaminy D"], "why": [{"q": "Dlaczego opalenizna to sygnał obronny skóry?", "a": "Bo skóra pod wpływem UV wytwarza **więcej melaniny**, żeby chronić komórki przed promieniowaniem – czyli już „poczuła” zagrożenie."}, {"q": "Dlaczego osoba o ciemnej karnacji potrzebuje dłużej przebywać na słońcu, by wytworzyć witaminę D?", "a": "Bo duża ilość **melaniny częściowo blokuje** wytwarzanie witaminy D w skórze."}], "tldr": {"pl": "Melanina – barwnik chroniący przed UV (opalenizna). Więcej melaniny = ciemniejsza karnacja i wolniejsza produkcja witaminy D.", "en": "Melanin is a pigment protecting against UV (tan). More melanin = darker skin and slower vitamin D production.", "ru": "Меланин — пигмент, защищающий от УФ (загар). Больше меланина — темнее кожа и медленнее синтез витамина D."}}, {"id": "l4", "title": "Choroby skóry: grzybica i trądzik młodzieńczy", "minutes": 12, "body": ["Choroby skóry to m.in. **trądzik, łupież, opryszczka, alergie skórne i grzybice**. Mogą mieć różne przyczyny: **bakteryjne, wirusowe, alergiczne, grzybicze**.", "**Grzybica** – niektóre **grzyby** atakują skórę lub paznokcie. Skóra jest **zaczerwieniona, łuszczy się**, czasem dokuczliwie **swędzi**. **Paznokcie zmieniają kolor, kruszą się i odkształcają.**", "**Jak się zarażasz?** Zwykle w **miejscach wilgotnych** (np. **baseny, siłownie**) przez **bezpośredni kontakt z zakażoną powierzchnią**.", "**Profilaktyka grzybicy:** zawsze noś **klapki na basenie**; **nie dziel się ręcznikami ani butami**; utrzymuj skórę **suchą i czystą**.", "**Trądzik młodzieńczy** – choroba skóry związana ze **zmianami hormonalnymi w okresie dojrzewania**. Zmiany pojawiają się głównie na **twarzy**, czasem na **plecach, klatce piersiowej i ramionach**. Na nasilenie wpływają m.in. **nieodpowiednia dieta, stres, brak higieny** i czynniki środowiskowe (np. **zanieczyszczenie powietrza**).", "**Jak powstaje trądzik (4 etapy):** 1) wzrost poziomu **hormonów** → **nadmierna produkcja sebum** (łoju); 2) **pory skóry się zatykają**; 3) tworzą się **zaskórniki**; 4) **krosty oraz stany zapalne**.", "**Uwaga!** Długotrwały proces zapalny może pozostawić **trwałe blizny**. Leczenie powinien dobrać **lekarz dermatolog** (nie wyciskaj krost!)."], "keyPoints": ["przyczyny chorób skóry: bakterie, wirusy, alergie, grzyby", "grzybica: zaczerwienienie, łuszczenie, swędzenie; paznokcie zmieniają kolor, kruszą się", "zarażenie: wilgotne miejsca (basen, siłownia), kontakt z zakażoną powierzchnią", "profilaktyka: klapki, własny ręcznik i buty, sucha i czysta skóra", "trądzik: hormony → sebum → zatkane pory → zaskórniki → krosty i stany zapalne; leczy dermatolog"], "why": [{"q": "Dlaczego grzybicą najłatwiej zarazić się na basenie?", "a": "Bo grzyby lubią **ciepło i wilgoć**, a na basenie wiele osób chodzi boso po tej samej mokrej powierzchni."}, {"q": "Dlaczego trądzik dotyczy głównie nastolatków?", "a": "Bo w **okresie dojrzewania** rośnie poziom **hormonów**, a to zwiększa produkcję **sebum**, które zatyka pory."}], "tldr": {"pl": "Grzybica – grzyby, wilgotne miejsca; klapki, własny ręcznik, sucha skóra. Trądzik – hormony → sebum → zatkane pory → zaskórniki → krosty; leczy dermatolog.", "en": "Fungal infection – damp places; flip-flops, own towel, dry skin. Acne – hormones → sebum → blocked pores → blackheads → pimples; see a dermatologist.", "ru": "Грибок — влажные места; шлёпанцы, своё полотенце, сухая кожа. Акне — гормоны → кожное сало → закупорка пор → угри → воспаление; лечит дерматолог."}, "images": [{"img": "tradzik", "caption": "Jak powstaje trądzik – 4 etapy (podręcznik s. 19)"}]}, {"id": "l5", "title": "Rak skóry: czerniak i objawy ABCDE", "minutes": 10, "body": ["Jeden z **najgroźniejszych nowotworów skóry** to **czerniak**. Jest związany z **nadmiernym wystawianiem skóry na działanie promieniowania UV**. Rozwija się z **niegroźnych znamion** (tzw. **pieprzyków**) lub powstaje **na zdrowej skórze**.", "**Jak powstaje?** W wyniku **zmian w materiale genetycznym** komórek skóry powstają **komórki nowotworowe**.", "**Profilaktyka:** regularnie **oglądaj dokładnie całą skórę** i **zgłaszaj lekarzowi** wszelkie zmiany; **nie przebywaj na słońcu bez ochrony**: **nakrycie głowy, ubranie i krem z filtrem SPF**; **nie korzystaj z solarium** – promieniowanie UV jest tam bardzo silne.", "**Objawy ABCDE czerniaka** (kiedy znamię jest podejrzane):", "• **A – Asymetria**: znamię ma niesymetryczny kształt.", "• **B – Brzegi**: niewyraźne, poszarpane, ze zgrubieniami.", "• **C – (K)olor**: łaciate, nierówno zabarwione.", "• **D – Duży rozmiar**: średnica **powyżej 6 mm**.", "• **E – Ewolucja**: zmiana wyglądu – koloru, kształtu, wielkości.", "Gdy na skórze pojawi się zmiana, której wcześniej nie było (albo stare znamię się zmienia) – **pokaż ją lekarzowi (dermatologowi)**. Wcześnie wykryty czerniak jest wyleczalny."], "keyPoints": ["czerniak – groźny nowotwór skóry, związany z nadmiarem UV", "powstaje z pieprzyków (znamion) lub na zdrowej skórze; zmiany w materiale genetycznym komórek", "profilaktyka: oglądać skórę, zgłaszać zmiany lekarzowi, nakrycie głowy + ubranie + krem SPF, bez solarium", "ABCDE: asymetria, brzegi, kolor, duży rozmiar (>6 mm), ewolucja"], "why": [{"q": "Dlaczego solarium jest groźne?", "a": "Bo promieniowanie **UV jest tam bardzo silne**, a nadmiar UV uszkadza materiał genetyczny komórek skóry i zwiększa ryzyko **czerniaka**."}, {"q": "Po co regularnie oglądać pieprzyki?", "a": "Żeby zauważyć **ewolucję** (zmianę koloru, kształtu, wielkości) i jak najszybciej pokazać zmianę lekarzowi."}], "tldr": {"pl": "Czerniak – nowotwór skóry od nadmiaru UV. ABCDE: asymetria, brzegi, kolor, duży (>6 mm), ewolucja. Chroń się: czapka, ubranie, SPF, bez solarium, kontrola u lekarza.", "en": "Melanoma – skin cancer linked to UV. ABCDE: asymmetry, border, colour, diameter >6 mm, evolution. Hat, clothes, SPF, no sunbeds, see a doctor.", "ru": "Меланома — рак кожи от избытка УФ. ABCDE: асимметрия, границы, цвет, диаметр >6 мм, эволюция. Шляпа, одежда, SPF, без солярия, к врачу."}, "images": [{"img": "abcde", "caption": "Objawy ABCDE czerniaka (podręcznik s. 19)"}]}], "flashcards": [{"front": "5 funkcji skóry", "back": "chroni, reguluje temperaturę, wydziela i wydala, produkuje witaminę D, odbiera bodźce", "tag": "l1"}, {"front": "Gorąco – co robią naczynia w skórze?", "back": "**Rozszerzają się** → ciało oddaje ciepło. Do tego pot paruje i chłodzi.", "tag": "l1"}, {"front": "Zimno – co robią naczynia w skórze?", "back": "**Kurczą się** → ciało zatrzymuje ciepło.", "tag": "l1"}, {"front": "Co wydalamy z potem?", "back": "Wodę, **nadmiar soli**, **mocznik**.", "tag": "l1"}, {"front": "Witamina D", "back": "Powstaje w skórze pod wpływem słońca; potrzebna dla **kości i zębów**.", "tag": "l1"}, {"front": "Receptory", "back": "Zakończenia nerwowe i komórki odbierające bodźce: dotyk, ciepło, zimno, ból.", "tag": "l1"}, {"front": "1% powierzchni skóry", "back": "≈ powierzchnia **dłoni**; takie oparzenie już jest groźne.", "tag": "l1"}, {"front": "Warstwy skóry", "back": "**naskórek** + **skóra właściwa**; pod nią **tkanka podskórna**.", "tag": "l2"}, {"front": "Warstwa zrogowaciała", "back": "Martwe komórki z keratyną na powierzchni naskórka; złuszczają się.", "tag": "l2"}, {"front": "Warstwa rozrodcza", "back": "Najgłębsza część naskórka; komórki się dzielą; tu melanina.", "tag": "l2"}, {"front": "Skóra właściwa – co zawiera?", "back": "Tkanka łączna (kolagen, włókna sprężyste), naczynia, receptory, gruczoły potowe i łojowe, mieszki włosowe.", "tag": "l2"}, {"front": "Tkanka podskórna", "back": "Tkanka tłuszczowa: izolacja cieplna, zapas energii, amortyzacja.", "tag": "l2"}, {"front": "Wytwory naskórka", "back": "Włosy, paznokcie, gruczoły potowe i łojowe.", "tag": "l2"}, {"front": "Melanina", "back": "Barwnik w naskórku, mieszkach włosowych, tęczówce; chroni przed UV; opalenizna.", "tag": "l3"}, {"front": "Melanina a witamina D", "back": "Dużo melaniny częściowo blokuje syntezę witaminy D → ciemna karnacja potrzebuje więcej słońca.", "tag": "l3"}, {"front": "Grzybica – objawy", "back": "Skóra zaczerwieniona, łuszczy się, swędzi; paznokcie zmieniają kolor, kruszą się, odkształcają.", "tag": "l4"}, {"front": "Grzybica – profilaktyka", "back": "Klapki na basenie, własny ręcznik i buty, sucha i czysta skóra.", "tag": "l4"}, {"front": "Trądzik – 4 etapy", "back": "1) hormony → dużo sebum 2) zatkane pory 3) zaskórniki 4) krosty i stany zapalne", "tag": "l4"}, {"front": "Czerniak – przyczyna", "back": "Nadmiar UV → zmiany w materiale genetycznym komórek → komórki nowotworowe.", "tag": "l5"}, {"front": "ABCDE", "back": "Asymetria, Brzegi, C(k)olor, Duży rozmiar (>6 mm), Ewolucja.", "tag": "l5"}, {"front": "Czerniak – profilaktyka", "back": "Oglądaj skórę, zmiany do lekarza; nakrycie głowy, ubranie, krem SPF; bez solarium.", "tag": "l5"}], "quiz": [{"id": "q1", "type": "mc", "tag": "l1", "q": "Co dzieje się z naczyniami krwionośnymi w skórze, gdy organizm jest **przegrzany**?", "options": ["kurczą się", "rozszerzają się", "znikają", "zamieniają się w gruczoły"], "answer": 1, "explain": "Gdy jest gorąco, naczynia się **rozszerzają** → więcej krwi przy powierzchni → ciało **oddaje ciepło**."}, {"id": "q2", "type": "mc", "tag": "l1", "q": "Co dzieje się z naczyniami krwionośnymi w skórze, gdy jest **zimno**?", "options": ["rozszerzają się", "kurczą się", "pękają", "wytwarzają pot"], "answer": 1, "explain": "Na zimnie naczynia się **kurczą** – mniej krwi przy skórze, ciało **zatrzymuje ciepło**."}, {"id": "q3", "type": "mc", "tag": "l1", "q": "Dlaczego pot ochładza ciało?", "options": ["bo jest zimny już w gruczole", "bo paruje i zabiera ciepło ze skóry", "bo zatyka pory", "bo zawiera melaninę"], "answer": 1, "explain": "Pot **paruje**, a parowanie zabiera ciepło ze skóry – ciało się **ochładza**."}, {"id": "q4", "type": "mc", "tag": "l1", "q": "Jakie szkodliwe substancje są wydalane razem z potem?", "options": ["tlen i witamina D", "nadmiar soli i mocznik", "melanina i keratyna", "cukier i białko mięśni"], "answer": 1, "explain": "Z potem wydalane są np. **nadmiar soli** i **mocznik**."}, {"id": "q5", "type": "mc", "tag": "l1", "q": "Do czego służy witamina D produkowana przez skórę?", "options": ["do utrzymania w zdrowiu kości i zębów", "do trawienia tłuszczów", "do widzenia w ciemności", "do krzepnięcia krwi"], "answer": 0, "explain": "Witamina D (powstaje pod wpływem **słońca**) jest potrzebna m.in. dla zdrowych **kości i zębów**."}, {"id": "q6", "type": "mc", "tag": "l1", "q": "Jaka jest rola **receptorów** w skórze?", "options": ["wytwarzają pot", "odbierają bodźce z otoczenia (dotyk, ciepło, zimno, ból)", "barwią skórę", "magazynują tłuszcz"], "answer": 1, "explain": "**Receptory** (zakończenia nerwowe i specjalne komórki) odbierają **bodźce** – dzięki nim reagujesz na zmiany."}, {"id": "q7", "type": "tf", "tag": "l1", "q": "Funkcje skóry – prawda czy fałsz?", "items": [{"s": "Skóra chroni przed bakteriami, wirusami i substancjami chemicznymi.", "a": true}, {"s": "Witamina D powstaje w skórze pod wpływem promieniowania słonecznego.", "a": true}, {"s": "Gdy jest gorąco, gruczoły potowe przestają pracować.", "a": false}], "explain": "Gdy jest gorąco, gruczoły potowe **wydzielają więcej potu** – to chłodzi ciało."}, {"id": "q8", "type": "short", "tag": "l1", "q": "Jaką część ciała ma mniej więcej powierzchnię równą 1% powierzchni skóry?", "accept": ["dłoń", "dłoni", "powierzchnia dłoni", "ręka", "reka", "dlon"], "explain": "**1% skóry ≈ powierzchnia dłoni** – a już takie oparzenie jest groźne dla zdrowia."}, {"id": "q9", "type": "cat", "tag": "l1", "q": "Przyporządkuj przykład do funkcji skóry.", "categories": ["ochrona", "termoregulacja", "odbieranie bodźców"], "items": [{"t": "skóra zatrzymuje bakterie", "c": 0}, {"t": "pocisz się na WF", "c": 1}, {"t": "czujesz, że kubek jest gorący", "c": 2}, {"t": "rumieniec po biegu (rozszerzone naczynia)", "c": 1}, {"t": "czujesz ukłucie igły", "c": 2}, {"t": "skóra nie przepuszcza nadmiaru UV w głąb ciała", "c": 0}], "explain": "Ochrona = bariera; termoregulacja = pot i naczynia; bodźce = receptory."}, {"id": "q10", "type": "mc", "tag": "l2", "q": "Która warstwa skóry jest **zewnętrzna**?", "options": ["tkanka podskórna", "skóra właściwa", "naskórek", "mięśniówka"], "answer": 2, "explain": "Na zewnątrz jest **naskórek**, pod nim skóra właściwa, a jeszcze niżej tkanka podskórna."}, {"id": "q11", "type": "mc", "tag": "l2", "q": "W której warstwie **nie ma** naczyń krwionośnych?", "options": ["w naskórku", "w skórze właściwej", "w tkance podskórnej", "we wszystkich są"], "answer": 0, "explain": "**Naskórek nie ma naczyń krwionośnych** – dlatego płytkie zadrapanie nie krwawi."}, {"id": "q12", "type": "mc", "tag": "l2", "q": "Warstwa zrogowaciała naskórka zbudowana jest z:", "options": ["żywych, dzielących się komórek", "martwych komórek wypełnionych keratyną", "komórek tłuszczowych", "naczyń krwionośnych"], "answer": 1, "explain": "Warstwa **zrogowaciała** = **martwe** komórki z **keratyną**; stale się złuszczają."}, {"id": "q13", "type": "mc", "tag": "l2", "q": "Co robią komórki **warstwy rozrodczej** naskórka?", "options": ["wydzielają pot", "ciągle się dzielą i tworzą nowe komórki naskórka", "magazynują tłuszcz", "odbierają dźwięki"], "answer": 1, "explain": "Warstwa **rozrodcza** – komórki się **dzielą** i zastępują złuszczone komórki."}, {"id": "q14", "type": "mc", "tag": "l2", "q": "Gdzie znajdują się gruczoły potowe i łojowe, mieszki włosowe, naczynia i zakończenia nerwowe?", "options": ["w warstwie zrogowaciałej", "w skórze właściwej", "w paznokciach", "w kościach"], "answer": 1, "explain": "Te elementy leżą w **skórze właściwej** (tkanka łączna)."}, {"id": "q15", "type": "mc", "tag": "l2", "q": "Z jakiej tkanki zbudowana jest głównie tkanka podskórna?", "options": ["z tkanki tłuszczowej", "z tkanki kostnej", "z nabłonka", "z tkanki nerwowej"], "answer": 0, "explain": "Tkanka podskórna = głównie **tłuszcz**: izolacja, zapas energii, amortyzacja."}, {"id": "q16", "type": "mc", "tag": "l2", "q": "Co wydzielają gruczoły łojowe?", "options": ["pot", "łój (sebum), który natłuszcza skórę i włosy", "melaninę", "witaminę D"], "answer": 1, "explain": "Gruczoły **łojowe** → **łój (sebum)** – natłuszcza i chroni przed wysychaniem."}, {"id": "q17", "type": "multi", "tag": "l2", "q": "Zaznacz wszystkie **wytwory naskórka**.", "options": ["włosy", "paznokcie", "gruczoły potowe i łojowe", "kości"], "answer": [0, 1, 2], "explain": "Wytwory naskórka: **włosy, paznokcie, gruczoły potowe i łojowe**. Kości – nie."}, {"id": "q18", "type": "match", "tag": "l2", "q": "Dopasuj warstwę do opisu.", "pairs": [["naskórek", "nabłonek, bez naczyń krwionośnych"], ["skóra właściwa", "tkanka łączna z naczyniami, gruczołami i receptorami"], ["tkanka podskórna", "tkanka tłuszczowa – izolacja i zapas energii"]], "explain": "Od góry: naskórek → skóra właściwa → tkanka podskórna."}, {"id": "q19", "type": "short", "tag": "l2", "q": "Jak nazywa się twarde białko budujące włosy, paznokcie i warstwę zrogowaciałą?", "accept": ["keratyna", "keratyny", "keratynę"], "explain": "**Keratyna** – białko rogowe."}, {"id": "q20", "type": "order", "tag": "l2", "q": "Ułóż warstwy od **powierzchni** w głąb ciała.", "items": ["warstwa zrogowaciała naskórka", "warstwa rozrodcza naskórka", "skóra właściwa", "tkanka podskórna"], "explain": "Zrogowaciała → rozrodcza → skóra właściwa → tkanka podskórna."}, {"id": "q21", "type": "mc", "tag": "l3", "q": "Gdzie znajduje się melanina?", "options": ["w naskórku, mieszkach włosowych i tęczówce oka", "tylko w krwi", "w kościach", "w gruczołach potowych"], "answer": 0, "explain": "Melanina: **naskórek, mieszki włosowe, tęczówka oka**."}, {"id": "q22", "type": "mc", "tag": "l3", "q": "Czym jest opalenizna?", "options": ["oznaką choroby grzybiczej", "efektem wytwarzania większej ilości melaniny pod wpływem UV", "skutkiem braku witaminy D", "zatkanymi porami"], "answer": 1, "explain": "Opalenizna = więcej **melaniny** – skóra broni się przed **UV**."}, {"id": "q23", "type": "mc", "tag": "l3", "q": "Dlaczego osoby o ciemnej karnacji potrzebują nieco więcej czasu na słońcu?", "options": ["bo mają mniej receptorów", "bo dużo melaniny częściowo blokuje wytwarzanie witaminy D", "bo szybciej się pocą", "bo nie mają naskórka"], "answer": 1, "explain": "Wysokie stężenie melaniny **częściowo blokuje syntezę witaminy D**."}, {"id": "q24", "type": "tf", "tag": "l3", "q": "Melanina – prawda czy fałsz?", "items": [{"s": "Im więcej melaniny, tym ciemniejsza barwa skóry, włosów i oczu.", "a": true}, {"s": "Melanina zabezpiecza komórki przed promieniowaniem UV.", "a": true}, {"s": "Melanina to witamina potrzebna do kości.", "a": false}], "explain": "Melanina to **barwnik** (nie witamina) – chroni przed UV. Do kości potrzebna jest **witamina D**."}, {"id": "q25", "type": "short", "tag": "l3", "q": "Jak nazywa się barwnik skóry chroniący przed UV?", "accept": ["melanina", "melaniny", "melanine"], "explain": "**Melanina**."}, {"id": "q26", "type": "mc", "tag": "l4", "q": "Jakie są objawy grzybicy skóry?", "options": ["skóra zaczerwieniona, łuszczy się i swędzi", "skóra jest bardzo ciemna", "pojawia się znamię większe niż 6 mm", "gorączka i katar"], "answer": 0, "explain": "Grzybica: **zaczerwienienie, łuszczenie, swędzenie**; paznokcie zmieniają kolor, kruszą się i odkształcają."}, {"id": "q27", "type": "mc", "tag": "l4", "q": "Co jest **profilaktyką** grzybicy?", "options": ["pożyczanie butów od kolegi", "noszenie klapek na basenie i własny ręcznik", "chodzenie boso w szatni", "noszenie wilgotnych skarpet"], "answer": 1, "explain": "Klapki na basenie, **nie dziel się ręcznikami ani butami**, skóra **sucha i czysta**."}, {"id": "q28", "type": "mc", "tag": "l4", "q": "Co jest główną przyczyną trądziku młodzieńczego?", "options": ["zmiany hormonalne w okresie dojrzewania", "ukąszenie komara", "za mało melaniny", "złamanie ręki"], "answer": 0, "explain": "Trądzik młodzieńczy wiąże się ze **zmianami hormonalnymi w okresie dojrzewania**."}, {"id": "q29", "type": "order", "tag": "l4", "q": "Ułóż etapy powstawania trądziku po kolei.", "items": ["wzrost poziomu hormonów i nadmierna produkcja sebum", "zatkanie porów skóry", "powstanie zaskórników", "krosty i stany zapalne"], "explain": "Hormony → sebum → zatkane pory → zaskórniki → krosty i stany zapalne."}, {"id": "q30", "type": "cat", "tag": "l4", "q": "Przyporządkuj przyczynę choroby skóry.", "categories": ["grzyby", "hormony / sebum"], "items": [{"t": "grzybica stóp", "c": 0}, {"t": "zaskórniki u nastolatka", "c": 1}, {"t": "kruszące się, przebarwione paznokcie", "c": 0}, {"t": "krosty na twarzy w okresie dojrzewania", "c": 1}], "explain": "Grzybica – **grzyby**; trądzik – **hormony** i nadmiar **sebum**."}, {"id": "q31", "type": "tf", "tag": "l4", "q": "Choroby skóry – prawda czy fałsz?", "items": [{"s": "Choroby skóry mogą mieć przyczyny bakteryjne, wirusowe, alergiczne i grzybicze.", "a": true}, {"s": "Na nasilenie trądziku wpływają dieta, stres i brak higieny.", "a": true}, {"s": "Trądzik najlepiej leczyć samodzielnie, wyciskając krosty.", "a": false}], "explain": "Wyciskanie nasila stany zapalne i grozi **bliznami**. Leczenie dobiera **dermatolog**."}, {"id": "q32", "type": "short", "tag": "l4", "q": "Jak nazywa się lekarz, który leczy choroby skóry?", "accept": ["dermatolog", "dermatologa", "dermatolożka"], "explain": "**Dermatolog**."}, {"id": "q33", "type": "mc", "tag": "l5", "q": "Czerniak to:", "options": ["grzybica paznokci", "jeden z najgroźniejszych nowotworów skóry", "rodzaj trądziku", "niegroźne przebarwienie po lecie"], "answer": 1, "explain": "**Czerniak** – jeden z najgroźniejszych **nowotworów skóry**, związany z nadmiarem **UV**."}, {"id": "q34", "type": "mc", "tag": "l5", "q": "Co oznacza litera **E** w zasadzie ABCDE?", "options": ["edukacja", "ewolucja – zmiana wyglądu znamienia (koloru, kształtu, wielkości)", "egzema", "energia"], "answer": 1, "explain": "**E – ewolucja**: znamię zmienia kolor, kształt lub wielkość."}, {"id": "q35", "type": "mc", "tag": "l5", "q": "Co oznacza litera **B** w zasadzie ABCDE?", "options": ["brzegi niewyraźne, poszarpane, ze zgrubieniami", "barwa jednolita", "bąbel", "ból głowy"], "answer": 0, "explain": "**B – brzegi**: niewyraźne, poszarpane, ze zgrubieniami."}, {"id": "q36", "type": "mc", "tag": "l5", "q": "Co najlepiej chroni przed czerniakiem?", "options": ["częste solarium", "nakrycie głowy, ubranie i krem z filtrem SPF", "opalanie się w południe bez kremu", "wyciskanie pieprzyków"], "answer": 1, "explain": "Ochrona przed UV: **nakrycie głowy, ubranie, krem SPF**; **bez solarium**; regularna kontrola skóry."}, {"id": "q37", "type": "mc", "tag": "l5", "q": "Co zrobić, gdy na skórze pojawi się zmiana, której wcześniej nie było?", "options": ["zakleić plastrem i zapomnieć", "pokazać ją lekarzowi", "pójść do solarium", "usunąć ją samemu"], "answer": 1, "explain": "Każdą nową lub zmieniającą się zmianę trzeba **pokazać lekarzowi** (dermatologowi)."}, {"id": "q38", "type": "match", "tag": "l5", "q": "Dopasuj literę ABCDE do opisu.", "pairs": [["A", "asymetria – niesymetryczny kształt"], ["B", "brzegi – niewyraźne, poszarpane"], ["C", "(k)olor – łaciate, nierówno zabarwione"], ["D", "duży rozmiar – powyżej 6 mm"], ["E", "ewolucja – zmiana wyglądu"]], "explain": "A-symetria, B-rzegi, C(k)olor, D-uży rozmiar, E-wolucja."}, {"id": "q39", "type": "tf", "tag": "l5", "q": "Czerniak – prawda czy fałsz?", "items": [{"s": "Komórki nowotworowe powstają w wyniku zmian w materiale genetycznym komórek skóry.", "a": true}, {"s": "Czerniak może powstać także na zdrowej skórze, bez pieprzyka.", "a": true}, {"s": "Znamię o średnicy 3 mm jest zawsze czerniakiem.", "a": false}], "explain": "Podejrzany rozmiar to **powyżej 6 mm** – ale liczą się wszystkie cechy ABCDE i ocena lekarza."}, {"id": "q40", "type": "short", "tag": "l5", "q": "Jak nazywa się filtr na kremie chroniącym przed słońcem (3 litery)?", "accept": ["SPF", "spf"], "explain": "Krem z filtrem **SPF**."}], "explainPrompts": [{"id": "e1", "tag": "l1", "prompt": "Wyjaśnij, w jaki sposób skóra przyczynia się do utrzymania stałej temperatury ciała.", "keyPoints": ["gorąco: naczynia krwionośne się rozszerzają – ciało oddaje ciepło", "gorąco: gruczoły potowe wydzielają pot, który paruje i ochładza", "zimno: naczynia się kurczą – ciało zatrzymuje ciepło"], "model": "Gdy jest gorąco, naczynia krwionośne w skórze się rozszerzają, więc więcej krwi płynie przy powierzchni i ciało oddaje ciepło. Gruczoły potowe wydzielają pot, który paruje i ochładza ciało. Gdy jest zimno, naczynia się kurczą i ciało zatrzymuje ciepło w środku.", "kw": [["naczyn|^krew|^krw|krwi+rozsz|szerz", "oddaj|oddaw+ciepl"], ["^pot|^poc|^spoc|potow+paru|chlod|ochl|odpar|wypar|parow"], ["naczyn|^krew|^krw|krwi+kurcz|zwez|zweza", "zimn+zatrzym|nie trac|kurcz"]]}, {"id": "e2", "tag": "l2", "prompt": "Wymień warstwy skóry oraz charakterystyczne cechy każdej z nich.", "keyPoints": ["naskórek: zewnętrzny, nabłonek, warstwa rozrodcza i zrogowaciała, bez naczyń", "skóra właściwa: tkanka łączna, naczynia, receptory, gruczoły, mieszki włosowe", "tkanka podskórna: tłuszcz – izolacja, zapas energii, amortyzacja"], "model": "Naskórek – zewnętrzna warstwa z nabłonka; ma warstwę rozrodczą (komórki się dzielą) i zrogowaciałą (martwe komórki z keratyną), nie ma naczyń krwionośnych. Skóra właściwa – tkanka łączna z włóknami, w niej naczynia krwionośne, zakończenia nerwowe, gruczoły potowe i łojowe, mieszki włosowe. Pod skórą jest tkanka podskórna – tłuszcz, który izoluje, magazynuje energię i amortyzuje.", "kw": [["naskor+zewn|zrogow|keraty|naczyn|rozrod|nablon|martw|chroni|ochron|melanin|zluszcz|cienk"], ["wlasciw+naczyn|gruczol|recept|nerw|miesz|wlos|lacz|kolagen|elast|krew|krw"], ["podskor+tluszcz|izol|energi|zapas|amortyz|ciepl|chroni|ochron", "tkank+tluszcz"]]}, {"id": "e3", "tag": "l3", "prompt": "Co poradzisz osobie, która uwielbia się opalać i co roku ma ciemną opaleniznę?", "keyPoints": ["opalenizna = obrona skóry (melanina) przed UV", "nadmiar UV zwiększa ryzyko czerniaka", "nakrycie głowy, ubranie, krem SPF, unikać słońca w południe", "bez solarium; oglądać skórę i pokazywać zmiany lekarzowi"], "model": "Powiedziałbym, że opalenizna to znak, że skóra broni się przed UV, wytwarzając melaninę. Nadmiar UV zwiększa ryzyko czerniaka. Niech używa kremu z filtrem SPF, nosi nakrycie głowy i ubranie, nie opala się długo w południe i nie chodzi do solarium. Powinna też regularnie oglądać skórę i pokazywać nowe zmiany lekarzowi.", "kw": [["melanin|obron|ochron|barwnik"], ["czerniak|nowotw|^rak|melanom"], ["czapk|kapelusz|nakryc|ubran|krem|filtr|^spf|^cien|poludn|unika"], ["solar|lekarz|dermatolog|kontrol|znamion|pieprzyk|obserw|sprawdz|oglad"]]}, {"id": "e4", "tag": "l4", "prompt": "Gdzie można zarazić się grzybicą i jak się przed tym uchronić?", "keyPoints": ["wilgotne miejsca: baseny, siłownie, szatnie", "bezpośredni kontakt z zakażoną powierzchnią", "klapki na basenie", "nie dzielić się ręcznikami ani butami; skóra sucha i czysta"], "model": "Grzybicą można się zarazić w wilgotnych miejscach, np. na basenie i w siłowni, przez bezpośredni kontakt z zakażoną powierzchnią. Żeby się chronić, trzeba nosić klapki na basenie, nie pożyczać ręczników ani butów i utrzymywać skórę suchą i czystą.", "kw": [["wilgot|basen|silown|szatn|prysznic|lazien|saun|mokr"], ["kontakt|dotyk|zakazon|powierzch|boso|^bez obuw|^bez klap"], ["klap|japon|kapc|obuw"], ["wlasn|swoj|^swoi|^swe|recznik|osusz|^such|wyciera|nie pozycz|higien|nie dziel|^czyst"]]}, {"id": "e5", "tag": "l5", "prompt": "Co należy zrobić, gdy na skórze pojawią się zmiany, których nie było wcześniej? Wymień objawy ABCDE.", "keyPoints": ["pokazać zmianę lekarzowi (dermatologowi)", "A asymetria, B brzegi, C kolor", "D średnica powyżej 6 mm, E ewolucja (zmiana wyglądu)"], "model": "Trzeba jak najszybciej pokazać zmianę lekarzowi, najlepiej dermatologowi. Podejrzane są znamiona: asymetryczne (A), z niewyraźnymi, poszarpanymi brzegami (B), nierówno zabarwione (C), o średnicy powyżej 6 mm (D) i takie, które się zmieniają – kolor, kształt, wielkość (E).", "kw": [["lekarz|dermatolog|doktor|przychodn|specjalist|onkolog"], ["abcde|asymetr|brzeg|kolor|barw"], ["srednic|^6 mm|^6$|wielkos|rozmiar|ewoluc|zmienia|rosn|powieksz"]]}], "mockTest": {"id": "kartkowka-skora", "title": "Szybka kartkówka – skóra (10 min)", "minutes": 10, "gradeScale": [[0, "niedostateczny"], [31, "dopuszczający"], [51, "dostateczny"], [71, "dobry"], [88, "bardzo dobry"], [97, "celujący"]], "intro": "6 krótkich pytań na rozgrzewkę przed właściwym sprawdzianem.", "tasks": [{"id": "t1", "type": "mc", "tag": "l1", "q": "Witamina D jest potrzebna do:", "options": ["zdrowych kości i zębów", "trawienia", "widzenia", "oddychania"], "answer": 0, "explain": "Kości i zęby."}, {"id": "t2", "type": "mc", "tag": "l2", "q": "Warstwa zewnętrzna skóry to:", "options": ["skóra właściwa", "naskórek", "tkanka podskórna"], "answer": 1, "explain": "Naskórek."}, {"id": "t3", "type": "mc", "tag": "l3", "q": "Opalenizna powstaje dzięki:", "options": ["keratynie", "melaninie", "sebum"], "answer": 1, "explain": "Melanina."}, {"id": "t4", "type": "mc", "tag": "l4", "q": "Na basenie przed grzybicą chronią:", "options": ["klapki", "rękawiczki", "okulary"], "answer": 0, "explain": "Klapki."}, {"id": "t5", "type": "mc", "tag": "l5", "q": "Solarium:", "options": ["chroni przed czerniakiem", "zwiększa ryzyko czerniaka (silne UV)", "leczy trądzik"], "answer": 1, "explain": "Silne UV – ryzyko czerniaka."}, {"id": "t6", "type": "short", "tag": "l1", "q": "Co czujemy dzięki receptorom? Podaj jeden bodziec.", "accept": ["dotyk", "ciepło", "zimno", "ból", "nacisk", "cieplo", "bol"], "explain": "Dotyk/nacisk, ciepło, zimno, ból."}]}, "mocks": [{"id": "replika-sprawdz-co-wiesz", "title": "Replika: „Sprawdź, co wiesz i umiesz!” + pytania z marginesów", "minutes": 25, "gradeScale": [[0, "niedostateczny"], [31, "dopuszczający"], [51, "dostateczny"], [71, "dobry"], [88, "bardzo dobry"], [97, "celujący"]], "intro": "Wszystkie pytania z podręcznika (s. 14, 15, 19) – odpowiadaj **pełnymi zdaniami**, jak na sprawdzianie. Możesz pisać albo stuknąć **🎤 Mów**. Po oddaniu zobaczysz wzorcową odpowiedź i punkty do porównania przy każdym pytaniu.", "tasks": [{"id": "p1", "type": "open", "tag": "l2", "q": "**1.** Wymień warstwy skóry oraz charakterystyczne cechy każdej z nich. _(s. 15)_", "model": "Naskórek – zewnętrzny, z nabłonka; warstwa rozrodcza (komórki się dzielą, melanina) i zrogowaciała (martwe komórki z keratyną, złuszczają się); bez naczyń krwionośnych. Skóra właściwa – tkanka łączna z włóknami kolagenowymi i sprężystymi; naczynia krwionośne, zakończenia nerwowe (receptory), gruczoły potowe i łojowe, mieszki włosowe. Tkanka podskórna – tkanka tłuszczowa: izolacja, zapas energii, amortyzacja.", "keyPoints": ["naskórek + cecha (zewnętrzny / zrogowaciały / bez naczyń)", "skóra właściwa + cecha (naczynia, gruczoły, receptory, mieszki)", "tkanka podskórna + cecha (tłuszcz: izolacja, energia)"], "points": 3, "explain": "Trzy warstwy, przy każdej co najmniej jedna cecha. Pamiętaj: wg podręcznika skóra = naskórek + skóra właściwa, a tkanka podskórna leży **pod** nią.", "kw": [["naskor+zewn|zrogow|keraty|naczyn|rozrod|nablon|martw|chroni|ochron|melanin|zluszcz|cienk"], ["wlasciw+naczyn|gruczol|recept|nerw|miesz|wlos|lacz|kolagen|elast|krew|krw"], ["podskor+tluszcz|izol|energi|zapas|amortyz|ciepl|chroni|ochron", "tkank+tluszcz"]]}, {"id": "p2", "type": "open", "tag": "l1", "q": "**2.** Wyjaśnij, w jaki sposób skóra przyczynia się do utrzymania stałej temperatury ciała. _(s. 15)_", "model": "Gdy jest gorąco, naczynia krwionośne w skórze się rozszerzają – więcej krwi płynie przy powierzchni i ciało oddaje ciepło; gruczoły potowe wydzielają pot, który paruje i ochładza ciało. Gdy jest zimno, naczynia się kurczą i ciało zatrzymuje ciepło.", "keyPoints": ["gorąco → naczynia się rozszerzają, oddawanie ciepła", "pot paruje i ochładza", "zimno → naczynia się kurczą, zatrzymanie ciepła"], "points": 3, "explain": "Najczęstszy błąd: odwrócenie – na gorąco naczynia się **rozszerzają**, na zimno **kurczą**.", "kw": [["naczyn|^krew|^krw|krwi+rozsz|szerz", "oddaj|oddaw+ciepl"], ["^pot|^poc|^spoc|potow+paru|chlod|ochl|odpar|wypar|parow"], ["naczyn|^krew|^krw|krwi+kurcz|zwez|zweza", "zimn+zatrzym|nie trac|kurcz"]]}, {"id": "p3", "type": "open", "tag": "l1", "q": "**3.** Który element skóry pomaga ustrzec się poparzenia lub skłania do zakupu gładkiego, miękkiego koca? _(s. 15)_", "model": "Receptory, czyli zakończenia nerwowe w skórze. Receptory ciepła i bólu ostrzegają przed gorącym przedmiotem (odsuwamy rękę, zanim się oparzymy), a receptory dotyku pozwalają poczuć, że koc jest gładki i miękki.", "keyPoints": ["receptory / zakończenia nerwowe", "ciepło i ból → ostrzeżenie przed oparzeniem", "dotyk → czujemy gładkość i miękkość"], "points": 3, "explain": "Odpowiedź: **receptory** (zakończenia nerwowe) w skórze właściwej.", "kw": [["recept|nerw"], ["ciepl|gorac|temperat|^bol|parz"], ["dotyk|gladk|miek|faktur|nacisk|ucisk"]]}, {"id": "p4", "type": "open", "tag": "l1", "q": "**4.** Uzasadnij, dlaczego uszkodzenie lub utrata 20% skóry są śmiertelnie niebezpieczne. _(s. 15)_", "model": "Skóra na tak dużej powierzchni przestaje pełnić swoje funkcje. Znika bariera ochronna – do organizmu łatwo wnikają bakterie i wirusy (groźne zakażenia). Przez uszkodzoną skórę organizm traci bardzo dużo wody i soli (odwodnienie) oraz ciepła – nie może utrzymać stałej temperatury. Do tego silny ból i utrata płynów mogą doprowadzić do wstrząsu. Skoro groźne jest już oparzenie 1% skóry (powierzchnia dłoni), to 20% (ok. 20 dłoni) zagraża życiu.", "keyPoints": ["brak bariery → zakażenia (bakterie, wirusy)", "utrata wody i soli → odwodnienie", "utrata ciepła / zaburzona termoregulacja", "porównanie: groźne już 1% (dłoń), 20% to ok. 20 dłoni"], "points": 4, "explain": "Podaj kilka skutków, nie jedno zdanie – każda utracona funkcja skóry to osobny punkt. (Odwodnienie i wstrząs to logiczny wniosek z funkcji skóry – nie ma ich na zdjęciach podręcznika.)", "kw": [["zakaz|bakter|wirus|drobnoustr|infekc|zaraz|barier|zarazk"], ["^wod|odwodn|^plyn|^sol"], ["ciepl|temperat|wychlodz|termoreg|marzn|zimn"], ["dlon", "^1$+skor|proc|powierzch"]]}, {"id": "p5", "type": "open", "tag": "l1", "q": "**5.** Jakie funkcje pełni wydzielanie potu? _(s. 14)_", "model": "Pot paruje i ochładza ciało (termoregulacja), a razem z potem wydalane są szkodliwe substancje, np. nadmiar soli i mocznik.", "keyPoints": ["ochładzanie ciała (pot paruje)", "wydalanie szkodliwych substancji: nadmiar soli, mocznik"], "points": 2, "explain": "Dwie funkcje: **chłodzenie** i **wydalanie**.", "kw": [["chlodz|ochl|paru|odpar|wypar|temperat|termoreg|^zimn|ciepl"], ["mocznik|^sol|szkodliw|toksyn|wydal|zbedn|nadmiar"]]}, {"id": "p6", "type": "open", "tag": "l1", "q": "**6.** Do czego służy produkowana przez skórę witamina D? _(s. 14)_", "model": "Witamina D (powstaje pod wpływem promieniowania słonecznego) jest potrzebna m.in. do utrzymania w zdrowiu kości i zębów.", "keyPoints": ["zdrowe, mocne kości", "zdrowe zęby (albo: powstaje pod wpływem słońca – UV)"], "points": 2, "explain": "Kości i zęby.", "kw": [["^kosc|szkielet|kostn"], ["^zeb|^zab|slon|^uv|ultrafiolet|promien|opalan"]]}, {"id": "p7", "type": "open", "tag": "l1", "q": "**7.** Jaka jest rola receptorów? _(s. 14)_", "model": "Receptory odbierają bodźce z otoczenia – dotyk (nacisk), ciepło, zimno, ból – dzięki czemu reagujemy na zmiany, np. odsuwamy się od gorącego przedmiotu, zanim się oparzymy.", "keyPoints": ["odbierają bodźce z otoczenia", "przykłady: dotyk, ciepło, zimno, ból", "pozwalają reagować (np. odsunąć rękę od gorącego)"], "points": 3, "explain": "Receptory = „czujniki” skóry.", "kw": [["bodz|odbier|rejestr|wyczuw|odczuw|informac"], ["dotyk|nacisk|ucisk|ciepl|zimn|gorac|^bol|temperat"], ["reag|odsun|ostrzeg|cofn|chroni|unik"]]}, {"id": "p8", "type": "open", "tag": "l4", "q": "**8.** Gdzie można zarazić się grzybicą i jak się przed tym uchronić? _(s. 19)_", "model": "W miejscach wilgotnych, np. na basenie, w siłowni, w szatni – przez bezpośredni kontakt z zakażoną powierzchnią. Ochrona: klapki na basenie, nie dzielić się ręcznikami ani butami, utrzymywać skórę suchą i czystą.", "keyPoints": ["wilgotne miejsca: basen, siłownia", "kontakt z zakażoną powierzchnią", "klapki", "własny ręcznik i buty; sucha, czysta skóra"], "points": 4, "explain": "Gdzie + jak się chronić (min. 2 sposoby).", "kw": [["wilgot|basen|silown|szatn|prysznic|lazien|saun|mokr"], ["kontakt|dotyk|zakazon|powierzch|boso|^bez obuw|^bez klap"], ["klap|japon|kapc|obuw"], ["wlasn|swoj|^swoi|^swe|recznik|osusz|^such|wyciera|nie pozycz|higien|nie dziel|^czyst"]]}, {"id": "p9", "type": "open", "tag": "l5", "q": "**9.** Co poradzisz osobie, która uwielbia się opalać i co roku ma ciemną opaleniznę? _(s. 19)_", "model": "Opalenizna to obrona skóry przed UV (więcej melaniny), a nadmiar UV zwiększa ryzyko czerniaka. Radzę: krem z filtrem SPF, nakrycie głowy i ubranie, unikanie długiego opalania (zwłaszcza w południe), żadnego solarium, regularne oglądanie skóry i pokazywanie zmian lekarzowi.", "keyPoints": ["nadmiar UV → ryzyko czerniaka", "krem z filtrem SPF", "nakrycie głowy, ubranie", "bez solarium; kontrola skóry u lekarza"], "points": 4, "explain": "Uzasadnienie (UV → czerniak) + konkretne rady.", "kw": [["czerniak|nowotw|^rak|melanom|^uv|ultrafiolet|promieniowan|^oparz"], ["krem|filtr|^spf|^spv|^blok"], ["czapk|kapelusz|nakryc|ubran|koszul|okular|^cien|unika|poludn|ogranicz"], ["solar|lekarz|dermatolog|kontrol|znamion|pieprzyk|obserw|sprawdz|oglad"]]}, {"id": "p10", "type": "open", "tag": "l5", "q": "**10.** Co należy zrobić, gdy na skórze pojawią się zmiany, których nie było wcześniej? _(s. 19)_", "model": "Trzeba pokazać je lekarzowi (dermatologowi), szczególnie gdy mają cechy ABCDE: asymetria, nieregularne brzegi, nierówny kolor, średnica powyżej 6 mm, zmieniają się (ewolucja).", "keyPoints": ["pokazać zmianę lekarzowi", "konkretnie: dermatologowi albo sprawdzić cechy ABCDE"], "points": 2, "explain": "Nie czekaj – **do lekarza**.", "kw": [["lekarz|dermatolog|doktor|przychodn|specjalist|onkolog"], ["dermatolog|abcde|asymetr|brzeg|kolor|barw|srednic|^6 mm|wielkos|rozmiar|ksztal|ewoluc|obserw|zmienia"]]}]}, {"id": "sprawdzian-skora-a", "title": "Sprawdzian próbny – skóra (grupa A)", "minutes": 25, "gradeScale": [[0, "niedostateczny"], [31, "dopuszczający"], [51, "dostateczny"], [71, "dobry"], [88, "bardzo dobry"], [97, "celujący"]], "intro": "Pełny próbny sprawdzian z całego działu: funkcje, budowa, melanina, choroby skóry, czerniak i ABCDE. **25 minut**, bez ściągi. Po oddaniu – wyjaśnienie przy każdym zadaniu.", "tasks": [{"id": "a1", "type": "mc", "tag": "l1", "q": "**Zad. 1.** Która funkcja skóry polega na odbieraniu bodźców?", "options": ["wydalanie", "odbieranie dotyku, ciepła, zimna i bólu przez receptory", "wytwarzanie witaminy D", "ochrona przed UV"], "answer": 1, "explain": "Odbieranie bodźców = **receptory**."}, {"id": "a2", "type": "mc", "tag": "l1", "q": "**Zad. 2.** W upalny dzień skóra chłodzi ciało, bo:", "options": ["naczynia się kurczą i pot zanika", "naczynia się rozszerzają, a pot paruje", "wytwarza więcej melaniny", "zatrzymuje mocznik"], "answer": 1, "explain": "Gorąco → naczynia **rozszerzone** + pot **paruje**."}, {"id": "a3", "type": "tf", "tag": "l1", "q": "**Zad. 3.** Prawda czy fałsz?", "items": [{"s": "Z potem wydalany jest mocznik.", "a": true}, {"s": "Witamina D jest potrzebna do zdrowych kości i zębów.", "a": true}, {"s": "Oparzenie 1% skóry jest zawsze niegroźne.", "a": false}], "explain": "Już 1% (ok. dłoń) jest groźne dla zdrowia."}, {"id": "a4", "type": "match", "tag": "l2", "q": "**Zad. 4.** Dopasuj element do warstwy.", "pairs": [["warstwa zrogowaciała", "naskórek"], ["gruczoł potowy", "skóra właściwa"], ["komórki tłuszczowe", "tkanka podskórna"]], "explain": "Zrogowaciała – naskórek; gruczoły – skóra właściwa; tłuszcz – tkanka podskórna."}, {"id": "a5", "type": "mc", "tag": "l2", "q": "**Zad. 5.** Płytkie zadrapanie naskórka nie krwawi, ponieważ:", "options": ["naskórek nie ma naczyń krwionośnych", "naskórek jest z tłuszczu", "krew krzepnie natychmiast w każdej warstwie", "w naskórku są tylko receptory"], "answer": 0, "explain": "**Brak naczyń** w naskórku."}, {"id": "a6", "type": "multi", "tag": "l2", "q": "**Zad. 6.** Zaznacz elementy, które znajdują się w skórze właściwej.", "options": ["naczynia krwionośne", "gruczoły łojowe", "mieszki włosowe", "warstwa zrogowaciała"], "answer": [0, 1, 2], "explain": "Warstwa zrogowaciała należy do **naskórka**."}, {"id": "a7", "type": "mc", "tag": "l3", "q": "**Zad. 7.** Melanina:", "options": ["chroni komórki przed UV", "wytwarza pot", "jest białkiem paznokci", "powoduje grzybicę"], "answer": 0, "explain": "Melanina – barwnik ochronny przed **UV**."}, {"id": "a8", "type": "mc", "tag": "l4", "q": "**Zad. 8.** Pierwszy etap powstawania trądziku to:", "options": ["krosty", "zaskórniki", "wzrost poziomu hormonów i nadmiar sebum", "zatkanie porów"], "answer": 2, "explain": "Kolejność: hormony/sebum → pory → zaskórniki → krosty."}, {"id": "a9", "type": "mc", "tag": "l4", "q": "**Zad. 9.** Które zachowanie zwiększa ryzyko grzybicy?", "options": ["klapki na basenie", "pożyczanie butów i ręcznika", "suszenie stóp po kąpieli", "czysta skóra"], "answer": 1, "explain": "**Nie dziel się** ręcznikami ani butami."}, {"id": "a10", "type": "match", "tag": "l5", "q": "**Zad. 10.** Dopasuj literę do objawu czerniaka.", "pairs": [["A", "niesymetryczny kształt"], ["C", "nierówno zabarwione, łaciate"], ["D", "średnica powyżej 6 mm"], ["E", "zmiana wyglądu"]], "explain": "A-symetria, C(k)olor, D-uży rozmiar, E-wolucja."}, {"id": "a11", "type": "short", "tag": "l5", "q": "**Zad. 11.** Jak nazywa się najgroźniejszy nowotwór skóry z lekcji?", "accept": ["czerniak", "czerniaka", "czerniakiem"], "explain": "**Czerniak**."}, {"id": "a12", "type": "open", "tag": "l1", "q": "**Zad. 12.** Uzasadnij, dlaczego utrata 20% skóry jest śmiertelnie niebezpieczna (podaj 3 argumenty).", "model": "Brak bariery – zakażenia bakteriami i wirusami; utrata wody i soli – odwodnienie; utrata ciepła – zaburzona termoregulacja. Groźne jest już 1% skóry (dłoń), a 20% to ok. 20 dłoni.", "keyPoints": ["zakażenia (brak bariery)", "odwodnienie (utrata wody i soli)", "utrata ciepła / termoregulacja"], "points": 3, "explain": "Każda utracona funkcja skóry = 1 argument.", "kw": [["zakaz|bakter|wirus|drobnoustr|infekc|zaraz|barier|zarazk"], ["^wod|odwodn|^plyn|^sol"], ["ciepl|temperat|wychlodz|termoreg|marzn|zimn"]]}]}, {"id": "sprawdzian-skora-b", "title": "Sprawdzian próbny – skóra (grupa B)", "minutes": 25, "gradeScale": [[0, "niedostateczny"], [31, "dopuszczający"], [51, "dostateczny"], [71, "dobry"], [88, "bardzo dobry"], [97, "celujący"]], "intro": "Druga wersja próbnego sprawdzianu (inne pytania z tego samego zakresu). **25 minut**, bez ściągi.", "tasks": [{"id": "b1", "type": "mc", "tag": "l1", "q": "**Zad. 1.** Pod wpływem promieniowania słonecznego skóra wytwarza:", "options": ["witaminę D", "witaminę C", "mocznik", "keratynę z włosów"], "answer": 0, "explain": "**Witamina D**."}, {"id": "b2", "type": "mc", "tag": "l1", "q": "**Zad. 2.** Zimą naczynia krwionośne w skórze:", "options": ["rozszerzają się, by oddać ciepło", "kurczą się, by zatrzymać ciepło", "wytwarzają pot", "przechodzą do naskórka"], "answer": 1, "explain": "Zimno → naczynia się **kurczą**."}, {"id": "b3", "type": "cat", "tag": "l1", "q": "**Zad. 3.** Przyporządkuj do funkcji skóry.", "categories": ["wydalanie", "ochrona", "odbieranie bodźców"], "items": [{"t": "mocznik w pocie", "c": 0}, {"t": "bariera dla wirusów", "c": 1}, {"t": "czujesz zimną wodę", "c": 2}, {"t": "nadmiar soli w pocie", "c": 0}], "explain": "Pot – wydalanie; bariera – ochrona; receptory – bodźce."}, {"id": "b4", "type": "order", "tag": "l2", "q": "**Zad. 4.** Ułóż od powierzchni w głąb.", "items": ["naskórek", "skóra właściwa", "tkanka podskórna"], "explain": "Naskórek → skóra właściwa → tkanka podskórna."}, {"id": "b5", "type": "mc", "tag": "l2", "q": "**Zad. 5.** Komórki, które stale się dzielą i odnawiają naskórek, leżą w:", "options": ["warstwie zrogowaciałej", "warstwie rozrodczej", "tkance podskórnej", "paznokciach"], "answer": 1, "explain": "**Warstwa rozrodcza**."}, {"id": "b6", "type": "mc", "tag": "l2", "q": "**Zad. 6.** Funkcją tkanki podskórnej jest:", "options": ["wytwarzanie potu", "izolacja cieplna i magazyn energii", "produkcja melaniny", "odbieranie bodźców wzrokowych"], "answer": 1, "explain": "Tłuszcz: **izolacja**, **zapas energii**, amortyzacja."}, {"id": "b7", "type": "tf", "tag": "l3", "q": "**Zad. 7.** Prawda czy fałsz?", "items": [{"s": "Melanina występuje też w tęczówce oka.", "a": true}, {"s": "Dużo melaniny przyspiesza wytwarzanie witaminy D.", "a": false}], "explain": "Dużo melaniny **częściowo blokuje** syntezę witaminy D."}, {"id": "b8", "type": "mc", "tag": "l4", "q": "**Zad. 8.** Paznokcie zmieniają kolor, kruszą się i odkształcają. To objaw:", "options": ["trądziku", "grzybicy", "czerniaka", "opalenizny"], "answer": 1, "explain": "**Grzybica** paznokci."}, {"id": "b9", "type": "tf", "tag": "l4", "q": "**Zad. 9.** Trądzik – prawda czy fałsz?", "items": [{"s": "Długotrwały stan zapalny może zostawić trwałe blizny.", "a": true}, {"s": "Zmiany trądzikowe pojawiają się tylko na stopach.", "a": false}], "explain": "Głównie **twarz**, czasem plecy, klatka piersiowa, ramiona."}, {"id": "b10", "type": "mc", "tag": "l5", "q": "**Zad. 10.** Litera **D** w zasadzie ABCDE oznacza:", "options": ["duży rozmiar – średnica powyżej 6 mm", "dermatolog", "dobrą barwę", "drapanie"], "answer": 0, "explain": "**D – duży rozmiar**, > 6 mm."}, {"id": "b11", "type": "multi", "tag": "l5", "q": "**Zad. 11.** Zaznacz zachowania chroniące przed czerniakiem.", "options": ["krem z filtrem SPF", "solarium przed wakacjami", "nakrycie głowy i ubranie", "oglądanie skóry i zgłaszanie zmian lekarzowi"], "answer": [0, 2, 3], "explain": "Solarium = bardzo silne UV – szkodzi."}, {"id": "b12", "type": "open", "tag": "l5", "q": "**Zad. 12.** Co poradzisz koledze, który co roku mocno się opala? (3 rady + uzasadnienie)", "model": "Nadmiar UV zwiększa ryzyko czerniaka. Rady: krem SPF, nakrycie głowy i ubranie, bez solarium, kontrola znamion u lekarza.", "keyPoints": ["uzasadnienie: UV → czerniak", "krem SPF", "nakrycie głowy / ubranie", "bez solarium / kontrola u lekarza"], "points": 4, "explain": "Rada + dlaczego.", "kw": [["czerniak|nowotw|^rak|melanom|^uv|ultrafiolet|promieniowan|^oparz"], ["krem|filtr|^spf|^spv|^blok"], ["czapk|kapelusz|nakryc|ubran|koszul|okular|^cien|unika|poludn|ogranicz"], ["solar|lekarz|dermatolog|kontrol|znamion|pieprzyk|obserw|sprawdz|oglad"]]}]}, {"id": "slabe-punkty-bio", "title": "Słabe punkty – skóra", "minutes": 15, "gradeScale": [[0, "niedostateczny"], [31, "dopuszczający"], [51, "dostateczny"], [71, "dobry"], [88, "bardzo dobry"], [97, "celujący"]], "intro": "Krótki sprawdzian **tylko z typowych pułapek** tego działu: naczynia na gorąco/zimno, naskórek vs skóra właściwa, pot vs łój, melanina vs witamina D, 6 mm, etapy trądziku i pytanie opisowe o 20% skóry.", "tasks": [{"id": "ws1", "type": "mc", "tag": "l1", "q": "**Zad. 1.** Gdy jest gorąco, naczynia krwionośne w skórze:", "options": ["kurczą się", "rozszerzają się"], "answer": 1, "explain": "Gorąco → **rozszerzają się** (oddawanie ciepła)."}, {"id": "ws2", "type": "mc", "tag": "l2", "q": "**Zad. 2.** W której warstwie są naczynia krwionośne i gruczoły?", "options": ["w naskórku", "w skórze właściwej"], "answer": 1, "explain": "**Skóra właściwa**. Naskórek jest bez naczyń."}, {"id": "ws3", "type": "match", "tag": "l2", "q": "**Zad. 3.** Dopasuj gruczoł do wydzieliny.", "pairs": [["gruczoł potowy", "pot – chłodzi i wydala sól, mocznik"], ["gruczoł łojowy", "łój (sebum) – natłuszcza skórę i włosy"]], "explain": "Pot ≠ łój."}, {"id": "ws4", "type": "mc", "tag": "l3", "q": "**Zad. 4.** Co chroni skórę przed UV, a co powstaje dzięki UV?", "options": ["melanina chroni; witamina D powstaje", "witamina D chroni; melanina powstaje tylko w nocy", "keratyna chroni; mocznik powstaje"], "answer": 0, "explain": "**Melanina** – ochrona; **witamina D** – wytwarzana pod wpływem słońca."}, {"id": "ws5", "type": "short", "tag": "l5", "q": "**Zad. 5.** Podaj (w mm), powyżej jakiej średnicy znamię jest podejrzane.", "accept": ["6", "6 mm"], "num": 6, "tol": 0, "explain": "**> 6 mm** (milimetrów, nie centymetrów!)."}, {"id": "ws6", "type": "order", "tag": "l4", "q": "**Zad. 6.** Etapy trądziku po kolei.", "items": ["nadmiar sebum (hormony)", "zatkane pory", "zaskórniki", "krosty i stany zapalne"], "explain": "Sebum → pory → zaskórniki → krosty."}, {"id": "ws7", "type": "mc", "tag": "l4", "q": "**Zad. 7.** Grzybicę wywołują:", "options": ["bakterie", "grzyby", "hormony"], "answer": 1, "explain": "Nazwa mówi wszystko: **grzyby**."}, {"id": "ws8", "type": "open", "tag": "l1", "q": "**Zad. 8.** Dlaczego utrata 20% skóry jest śmiertelnie niebezpieczna? Napisz wg schematu 4 kroków.", "model": "Skóra to bariera i regulator. Gdy zniknie na dużej powierzchni, wnikają drobnoustroje, organizm traci wodę, sole i ciepło. Skutek: zakażenie, odwodnienie, wychłodzenie, wstrząs – zagrożenie życia. Np. oparzenie 1% (dłoń) już jest groźne, a 20% to ok. 20 dłoni.", "keyPoints": ["brak bariery → zakażenia", "utrata wody i soli → odwodnienie", "utrata ciepła", "porównanie 1% = dłoń"], "points": 4, "explain": "Kilka argumentów = komplet punktów.", "kw": [["zakaz|bakter|wirus|drobnoustr|infekc|zaraz|barier|zarazk"], ["^wod|odwodn|^plyn|^sol"], ["ciepl|temperat|wychlodz|termoreg|marzn|zimn"], ["dlon", "^1$+skor|proc|powierzch"]]}]}], "cheatSheet": [{"title": "Funkcje skóry (5)", "items": ["**Chroni i broni** – bakterie, wirusy, chemikalia, nadmiar UV, urazy", "**Reguluje temperaturę** – gorąco: naczynia **rozszerzone** + pot paruje; zimno: naczynia **zwężone**", "**Wydziela i wydala** – pot (woda, **nadmiar soli**, **mocznik**), sebum", "**Produkuje witaminę D** (słońce) → **kości i zęby**", "**Odbiera bodźce** – receptory: dotyk/nacisk, ciepło, zimno, ból", "1% skóry ≈ **dłoń**; 20% skóry = zagrożenie życia (zakażenia, odwodnienie, utrata ciepła)"], "images": [{"img": "funkcje", "caption": "Funkcje skóry"}]}, {"title": "Budowa skóry", "items": ["Skóra = **naskórek + skóra właściwa**; pod nią **tkanka podskórna**", "**Naskórek**: warstwa **rozrodcza** (dzieli się, melanina) + **zrogowaciała** (martwe komórki, keratyna); **bez naczyń**", "**Skóra właściwa**: tkanka łączna; naczynia, receptory, gruczoły potowe i łojowe, mieszki włosowe", "**Tkanka podskórna**: tłuszcz – izolacja, energia, amortyzacja", "**Wytwory naskórka**: włosy, paznokcie, gruczoły"], "images": [{"img": "przekroj", "caption": "Przekrój skóry"}]}, {"title": "Gruczoły – nie pomyl", "items": ["Pot ≠ łój: inne gruczoły, inna funkcja."], "table": {"columns": ["gruczoł", "wydzielina", "po co"], "rows": [["potowy", "pot", "chłodzenie + wydalanie soli i mocznika"], ["łojowy", "łój (sebum)", "natłuszcza skórę i włosy; nadmiar → trądzik"]]}}, {"title": "Melanina", "items": ["Barwnik w **naskórku, mieszkach włosowych, tęczówce**", "Chroni przed **UV** → **opalenizna**", "Więcej melaniny = ciemniejsza skóra, włosy, oczy", "Dużo melaniny **częściowo blokuje** witaminę D → ciemna karnacja potrzebuje więcej słońca"]}, {"title": "Choroby skóry", "items": ["Przyczyny: **bakterie, wirusy, alergie, grzyby** (np. trądzik, łupież, opryszczka, alergie, grzybice)", "**Grzybica**: zaczerwienienie, łuszczenie, swędzenie; paznokcie przebarwione, kruche. Zarażenie: **basen, siłownia** (wilgoć, kontakt). Ochrona: **klapki, własny ręcznik i buty, sucha i czysta skóra**", "**Trądzik młodzieńczy**: hormony (dojrzewanie). 1) dużo **sebum** 2) **zatkane pory** 3) **zaskórniki** 4) **krosty, stany zapalne**. Blizny → leczy **dermatolog**"], "images": [{"img": "tradzik", "caption": "Etapy trądziku"}]}, {"title": "Czerniak i ABCDE", "items": ["Czerniak – groźny **nowotwór skóry**, od nadmiaru **UV**; z pieprzyka lub na zdrowej skórze; zmiany w materiale genetycznym komórek", "**A** asymetria · **B** brzegi poszarpane · **C** (k)olor nierówny · **D** duży > **6 mm** · **E** ewolucja (zmiana)", "Profilaktyka: oglądaj skórę → zmiany do **lekarza**; **czapka, ubranie, krem SPF**; **bez solarium**"], "images": [{"img": "abcde", "caption": "ABCDE"}]}], "steps": [{"id": "funkcje", "title": "Funkcje skóry", "tags": ["l1"], "levels": [{"n": 1, "title": "Skóra = kombinezon ochronny", "tags": ["l1"], "body": ["Wyobraź sobie skórę jak **kombinezon kosmonauty**: nie wpuszcza zarazków i brudu, trzyma właściwą temperaturę, ma czujniki i nawet sam „produkuje” witaminę D ze słońca.", "To **największy narząd** ciała. Ma **5 funkcji**: chroni, reguluje temperaturę, wydala, produkuje witaminę D, odbiera bodźce."], "checks": [{"ref": "d1"}, {"q": {"id": "f1a", "type": "mc", "tag": "l1", "q": "Ile funkcji skóry pokazuje schemat „Funkcje skóry” w podręczniku?", "options": ["2", "3", "5", "10"], "answer": 2, "explain": "**5**: chroni, reguluje temperaturę, wydziela i wydala, produkuje witaminę D, odbiera bodźce."}}], "images": [{"img": "funkcje", "caption": "Funkcje skóry – schemat z podręcznika"}]}, {"n": 2, "title": "Ochrona, witamina D i receptory", "tags": ["l1"], "body": ["**Ochrona** – bariera przed bakteriami, wirusami, chemikaliami, nadmiarem UV.", "**Witamina D** – powstaje pod wpływem **słońca**, potrzebna dla **kości i zębów**.", "**Receptory** – czujniki: dotyk, ciepło, zimno, ból."], "checks": [{"ref": "q5"}, {"ref": "q6"}, {"ref": "q9"}]}, {"n": 3, "title": "Termoregulacja: naczynia i pot", "tags": ["l1"], "body": ["**Gorąco** → naczynia **rozszerzają się** (czerwona twarz) + **pot paruje** i chłodzi.", "**Zimno** → naczynia **kurczą się** (blade dłonie) – ciepło zostaje w środku.", "Pot przy okazji **wydala** nadmiar soli i mocznik."], "checks": [{"ref": "q1"}, {"ref": "q2"}, {"ref": "q3"}], "lessons": ["l1"]}, {"n": 4, "title": "Wydalanie i 1% skóry", "tags": ["l1"], "body": ["Z potem wychodzą **woda, nadmiar soli, mocznik**. Skóra wydziela też **sebum**.", "**1% powierzchni skóry ≈ dłoń**. Oparzenie tak małej powierzchni jest już groźne."], "checks": [{"ref": "q4"}, {"ref": "q7"}, {"ref": "q8"}]}, {"n": 5, "title": "Ekspert: wyjaśnij jak na sprawdzianie", "tags": ["l1"], "body": ["Pytanie z podręcznika: „Wyjaśnij, w jaki sposób skóra przyczynia się do utrzymania stałej temperatury ciała.” Odpowiedz 3 zdaniami: gorąco–naczynia, gorąco–pot, zimno–naczynia.", "Pytanie trudne: dlaczego utrata **20%** skóry zabija? Bo znikają naraz wszystkie funkcje: bariera (zakażenia), zatrzymywanie wody (odwodnienie), termoregulacja (utrata ciepła)."], "checks": [{"ref": "e1"}, {"q": {"id": "f5a", "type": "open", "tag": "l1", "q": "Uzasadnij, dlaczego uszkodzenie lub utrata 20% skóry są śmiertelnie niebezpieczne.", "model": "Skóra przestaje chronić – wnikają bakterie i wirusy (zakażenia). Organizm traci dużo wody i soli (odwodnienie) i ciepła (zaburzona termoregulacja). Groźne jest już 1% skóry (dłoń), a 20% to ok. 20 dłoni.", "keyPoints": ["zakażenia – brak bariery", "utrata wody i soli – odwodnienie", "utrata ciepła – termoregulacja", "porównanie z 1% = dłoń"], "points": 4, "explain": "Porównaj z wzorem i dopisz brakujące punkty do zeszytu.", "kw": [["zakaz|bakter|wirus|drobnoustr|infekc|zaraz|barier|zarazk"], ["^wod|odwodn|^plyn|^sol"], ["ciepl|temperat|wychlodz|termoreg|marzn|zimn"], ["dlon", "^1$+skor|proc|powierzch"]]}}]}]}, {"id": "budowa", "title": "Budowa skóry: warstwy i wytwory", "tags": ["l2"], "levels": [{"n": 1, "title": "Skóra jak kanapka", "tags": ["l2"], "body": ["Skóra jest jak **kanapka z trzech pięter**: na górze cienki **naskórek** (jak skórka chleba), w środku gruba **skóra właściwa** (z „nadzieniem”: naczyniami, nerwami, gruczołami), a pod spodem **tkanka podskórna** – miękka poduszka z tłuszczu.", "Według podręcznika: skóra = **naskórek + skóra właściwa**, a **pod nią** leży tkanka podskórna."], "checks": [{"ref": "d2"}, {"ref": "q10"}], "images": [{"img": "przekroj", "caption": "Przekrój skóry – schemat"}]}, {"n": 2, "title": "Naskórek: dwie warstwy", "tags": ["l2"], "body": ["**Warstwa zrogowaciała** (na wierzchu) – **martwe** komórki z **keratyną**, złuszczają się.", "**Warstwa rozrodcza** (na dole naskórka) – komórki **dzielą się** i dostarczają nowych. Tu jest też **melanina**.", "Naskórek **nie ma naczyń krwionośnych**."], "checks": [{"ref": "q11"}, {"ref": "q12"}, {"ref": "q13"}]}, {"n": 3, "title": "Skóra właściwa i tkanka podskórna", "tags": ["l2"], "body": ["**Skóra właściwa** – tkanka łączna z włóknami kolagenowymi i sprężystymi. W niej: **naczynia krwionośne, zakończenia nerwowe (receptory), gruczoły potowe i łojowe, mieszki włosowe**.", "**Tkanka podskórna** – **tłuszcz**: izoluje, magazynuje energię, amortyzuje."], "checks": [{"ref": "q14"}, {"ref": "q15"}, {"ref": "q18"}], "lessons": ["l2"]}, {"n": 4, "title": "Gruczoły i wytwory naskórka", "tags": ["l2"], "body": ["Gruczoł **potowy** → pot (chłodzenie, wydalanie). Gruczoł **łojowy** → **łój (sebum)** – natłuszcza skórę i włosy.", "**Wytwory naskórka**: **włosy, paznokcie**, gruczoły. Włosy i paznokcie są z **keratyny**."], "checks": [{"ref": "q16"}, {"ref": "q17"}, {"ref": "q19"}]}, {"n": 5, "title": "Ekspert: warstwy z cechami", "tags": ["l2"], "body": ["Pytanie z podręcznika: „Wymień warstwy skóry oraz charakterystyczne cechy każdej z nich.” Przy każdej warstwie podaj **co najmniej 2 cechy**.", "_Uwaga: szczegóły budowy (s. 16–17) uzupełnione wg podstawy programowej – porównaj z zeszytem._"], "checks": [{"ref": "e2"}, {"ref": "q20"}]}]}, {"id": "melanina", "title": "Melanina, słońce i witamina D", "tags": ["l3"], "levels": [{"n": 1, "title": "Naturalny parasol", "tags": ["l3"], "body": ["**Melanina** to barwnik – taki **naturalny parasol** komórek przed promieniami **UV**. Kiedy jesteś długo na słońcu, skóra robi więcej melaniny i się **opalasz**."], "checks": [{"ref": "d3"}, {"ref": "q25"}]}, {"n": 2, "title": "Gdzie jest melanina?", "tags": ["l3"], "body": ["W **naskórku**, w **mieszkach włosowych** i w **tęczówce oka**. Im więcej melaniny – tym ciemniejsza skóra, włosy i oczy."], "checks": [{"ref": "q21"}, {"ref": "q22"}]}, {"n": 3, "title": "Melanina kontra witamina D", "tags": ["l3"], "body": ["Słońce daje **witaminę D**, ale dużo **melaniny częściowo blokuje** jej wytwarzanie. Dlatego osoby o **ciemnej karnacji** potrzebują trochę dłużej przebywać na słońcu."], "checks": [{"ref": "q23"}, {"ref": "q24"}], "lessons": ["l3"]}, {"n": 4, "title": "Słońce: przyjaciel i wróg", "tags": ["l3"], "body": ["Trochę słońca = witamina D. Za dużo UV = oparzenia, starzenie się skóry, **czerniak**. Opalenizna to **sygnał obronny**, a nie „zdrowy kolor”."], "checks": [{"q": {"id": "m4a", "type": "mc", "tag": "l3", "q": "Opalenizna to przede wszystkim:", "options": ["dowód, że skóra jest zdrowsza", "obrona skóry przed UV (więcej melaniny)", "efekt witaminy D", "objaw grzybicy"], "answer": 1, "explain": "Opalenizna = skóra broni się przed UV, wytwarzając **melaninę**."}}, {"q": {"id": "m4b", "type": "mc", "tag": "l3", "q": "Co **nie** jest skutkiem nadmiaru UV?", "options": ["oparzenie słoneczne", "ryzyko czerniaka", "przyspieszone starzenie skóry", "zatkanie porów przez sebum"], "answer": 3, "explain": "Zatkane pory to mechanizm **trądziku** (sebum), nie UV."}}]}, {"n": 5, "title": "Ekspert: doradź koledze", "tags": ["l3"], "body": ["Pytanie z podręcznika: „Co poradzisz osobie, która uwielbia się opalać i co roku ma ciemną opaleniznę?” Połącz wiedzę o melaninie z profilaktyką czerniaka."], "checks": [{"ref": "e3"}, {"q": {"id": "m5a", "type": "mc", "tag": "l3", "q": "Dlaczego wysokie stężenie melaniny wydłuża czas potrzebny na wytworzenie witaminy D?", "options": ["bo melanina niszczy kości", "bo częściowo blokuje syntezę witaminy D w skórze", "bo zatrzymuje pot", "bo zmniejsza liczbę receptorów"], "answer": 1, "explain": "Melanina **częściowo blokuje** syntezę witaminy D."}}]}]}, {"id": "choroby", "title": "Choroby skóry: grzybica i trądzik", "tags": ["l4"], "levels": [{"n": 1, "title": "Skóra też choruje", "tags": ["l4"], "body": ["Choroby skóry to np. **trądzik, łupież, opryszczka, alergie i grzybice**. Przyczyny: **bakterie, wirusy, alergie, grzyby**.", "Dziś dwie: **grzybica** (grzyby lubią wilgoć) i **trądzik młodzieńczy** (hormony nastolatka)."], "checks": [{"ref": "d4"}, {"ref": "q32"}]}, {"n": 2, "title": "Grzybica: objawy i zarażenie", "tags": ["l4"], "body": ["Skóra **zaczerwieniona, łuszczy się, swędzi**. Paznokcie **zmieniają kolor, kruszą się, odkształcają**.", "Zarażenie: **wilgotne miejsca** (basen, siłownia) – **kontakt z zakażoną powierzchnią**."], "checks": [{"ref": "q26"}, {"ref": "q27"}]}, {"n": 3, "title": "Trądzik: 4 etapy", "tags": ["l4"], "body": ["1) **Hormony** w okresie dojrzewania → dużo **sebum**. 2) **Pory się zatykają**. 3) **Zaskórniki**. 4) **Krosty i stany zapalne**.", "Głównie **twarz**, czasem plecy, klatka piersiowa, ramiona. Nasilają: dieta, stres, brak higieny, zanieczyszczone powietrze."], "checks": [{"ref": "q28"}, {"ref": "q29"}], "lessons": ["l4"], "images": [{"img": "tradzik", "caption": "Etapy trądziku (s. 19)"}]}, {"n": 4, "title": "Rozróżniaj i lecz mądrze", "tags": ["l4"], "body": ["Grzyby → grzybica; hormony i sebum → trądzik. **Nie wyciskaj** krost – długotrwały stan zapalny zostawia **blizny**. Leczenie dobiera **dermatolog**."], "checks": [{"ref": "q30"}, {"ref": "q31"}]}, {"n": 5, "title": "Ekspert: pytanie z podręcznika", "tags": ["l4"], "body": ["„Gdzie można zarazić się grzybicą i jak się przed tym uchronić?” – podaj **miejsce**, **sposób zarażenia** i **co najmniej 2 sposoby** ochrony."], "checks": [{"ref": "e4"}, {"q": {"id": "g5a", "type": "mc", "tag": "l4", "q": "Który zestaw to pełna profilaktyka grzybicy z podręcznika?", "options": ["klapki na basenie, nie dzielić się ręcznikami i butami, sucha i czysta skóra", "krem SPF i nakrycie głowy", "częste solarium", "wyciskanie zmian"], "answer": 0, "explain": "Klapki + własny ręcznik i buty + sucha, czysta skóra."}}]}]}, {"id": "czerniak", "title": "Czerniak i objawy ABCDE", "tags": ["l5"], "levels": [{"n": 1, "title": "Pieprzyki pod kontrolą", "tags": ["l5"], "body": ["Większość pieprzyków jest niegroźna. Ale z pieprzyka (albo na zdrowej skórze) może powstać **czerniak** – groźny **nowotwór skóry**. Główny winowajca: **za dużo UV**."], "checks": [{"ref": "d5"}, {"ref": "q33"}]}, {"n": 2, "title": "ABCDE – litera po literze", "tags": ["l5"], "body": ["**A**symetria · **B**rzegi poszarpane · **C** (k)olor nierówny · **D**uży rozmiar (> 6 mm) · **E**wolucja (zmiana koloru, kształtu, wielkości)."], "checks": [{"ref": "q34"}, {"ref": "q35"}, {"ref": "q38"}], "images": [{"img": "abcde", "caption": "Objawy ABCDE (s. 19)"}]}, {"n": 3, "title": "Jak powstaje i jak się chronić", "tags": ["l5"], "body": ["**Zmiany w materiale genetycznym** komórek skóry → **komórki nowotworowe**.", "Ochrona: **nakrycie głowy, ubranie, krem SPF**, **bez solarium**, oglądanie skóry i zgłaszanie zmian **lekarzowi**."], "checks": [{"ref": "q36"}, {"ref": "q39"}, {"ref": "q40"}], "lessons": ["l5"]}, {"n": 4, "title": "Co robić, gdy coś się zmienia", "tags": ["l5"], "body": ["Nowa zmiana albo pieprzyk, który rośnie, zmienia kolor czy kształt → **do lekarza (dermatologa)**. Wcześnie wykryty czerniak jest wyleczalny."], "checks": [{"ref": "q37"}, {"ref": "d6"}]}, {"n": 5, "title": "Ekspert: pełna odpowiedź", "tags": ["l5"], "body": ["Pytanie z podręcznika: „Co należy zrobić, gdy na skórze pojawią się zmiany, których nie było wcześniej?” – działanie + wszystkie litery ABCDE."], "checks": [{"ref": "e5"}, {"q": {"id": "c5a", "type": "mc", "tag": "l5", "q": "Znamię 8 mm, z poszarpanymi brzegami, które w ciągu pół roku pociemniało. Które cechy ABCDE ma na pewno?", "options": ["żadnej", "tylko D", "B, D i E", "tylko A"], "answer": 2, "explain": "Poszarpane brzegi (**B**), > 6 mm (**D**), zmiana koloru (**E**) – trzeba iść do lekarza."}}]}]}], "life": [{"concept": "Termoregulacja", "intro": "Skóra jak klimatyzacja – cały czas pilnuje ok. 36,6 °C.", "examples": [{"t": "WF w upale", "d": "Pocisz się i masz czerwoną twarz – naczynia rozszerzone, pot paruje i chłodzi."}, {"t": "Zimowy przystanek", "d": "Blade, zimne palce – naczynia się kurczą, żeby ciepło zostało przy narządach."}, {"t": "Wyjście z basenu", "d": "Mokra skóra na wietrze – woda paruje i robi się zimno (tak samo działa pot)."}, {"t": "Wiatrak latem", "d": "Przyspiesza parowanie potu, więc szybciej się chłodzisz."}, {"t": "Sauna", "d": "Pocisz się bardzo mocno – organizm broni się przed przegrzaniem; trzeba pić wodę."}, {"t": "Gęsia skórka", "d": "Mięśnie przywłosowe stawiają włoski, gdy jest zimno – pozostałość po futrze przodków."}, {"t": "Gorączka i dreszcze", "d": "Gdy temperatura rośnie, najpierw jest zimno i blado (naczynia zwężone), a gdy gorączka spada – pot."}]}, {"concept": "Receptory w skórze", "intro": "Czujniki, dzięki którym reagujesz, zanim się skrzywdzisz.", "examples": [{"t": "Gorący garnek", "d": "Receptory ciepła i bólu – ręka cofa się, zanim się oparzysz."}, {"t": "Miękki koc w sklepie", "d": "Receptory dotyku mówią: gładki, miękki – kupujemy!"}, {"t": "Kąpiel", "d": "Najpierw sprawdzasz wodę ręką – receptory ciepła i zimna."}, {"t": "Komar na nodze", "d": "Czujesz lekki dotyk i swędzenie, zanim zobaczysz owada."}, {"t": "Ekran dotykowy", "d": "Opuszki palców mają bardzo dużo receptorów – czujesz drobne wibracje."}, {"t": "Drzazga", "d": "Receptory bólu informują o uszkodzeniu – trzeba ją wyjąć."}, {"t": "Pismo Braille'a", "d": "Niewidomi czytają opuszkami palców dzięki gęstym receptorom dotyku."}]}, {"concept": "Budowa skóry na co dzień", "intro": "Warstwy skóry widać w zwykłych sytuacjach.", "examples": [{"t": "Płytkie zadrapanie", "d": "Nie krwawi – naskórek nie ma naczyń krwionośnych."}, {"t": "Głębsze skaleczenie", "d": "Krwawi – przecięta skóra właściwa z naczyniami."}, {"t": "Kurz w pokoju", "d": "Spora część to złuszczone martwe komórki warstwy zrogowaciałej."}, {"t": "Pomarszczone palce po kąpieli", "d": "Warstwa zrogowaciała nasiąka wodą."}, {"t": "Obcinanie paznokci i włosów", "d": "Nie boli – to martwe wytwory naskórka z keratyny."}, {"t": "Odcisk od nowych butów", "d": "Naskórek grubieje w miejscu tarcia – to ochrona."}, {"t": "Foki i pingwiny", "d": "Gruba warstwa tłuszczu pod skórą chroni przed zimnem – jak nasza tkanka podskórna."}]}, {"concept": "Melanina i witamina D", "intro": "Słońce – trochę potrzebne, za dużo groźne.", "examples": [{"t": "Ślad po zegarku latem", "d": "Pod paskiem skóra jasna – tam nie dotarło UV, nie było więcej melaniny."}, {"t": "Piegi", "d": "Miejsca z większą ilością melaniny – latem ciemnieją."}, {"t": "Kolor oczu", "d": "Brązowe oczy mają więcej melaniny w tęczówce niż niebieskie."}, {"t": "Siwe włosy", "d": "Z wiekiem mieszki włosowe wytwarzają mniej melaniny."}, {"t": "Spacer w słoneczny dzień", "d": "Kilkanaście minut na słońcu pomaga wytworzyć witaminę D dla kości."}, {"t": "Witamina D zimą", "d": "W Polsce zimą słońca jest mało – lekarze często zalecają suplement."}, {"t": "Rodzina z różną karnacją", "d": "Osoba o ciemniejszej skórze potrzebuje trochę dłużej słońca, żeby wytworzyć tyle samo witaminy D."}]}, {"concept": "Grzybica – profilaktyka", "intro": "Grzyby kochają ciepło i wilgoć.", "examples": [{"t": "Basen", "d": "Klapki pod prysznicem i przy basenie – zawsze."}, {"t": "Szatnia na WF", "d": "Nie chodź boso, nie zakładaj cudzych butów."}, {"t": "Własny ręcznik", "d": "Pożyczony ręcznik łatwo przenosi grzyby – nie pożyczaj."}, {"t": "Suszenie stóp", "d": "Wytrzyj dokładnie między palcami – wilgoć sprzyja grzybom."}, {"t": "Przewiewne buty", "d": "W gumowcach cały dzień stopa się poci – łatwiej o grzybicę."}, {"t": "Skarpetki", "d": "Bawełniane, codziennie czyste."}, {"t": "Kręgielnia i ścianka", "d": "Buty z wypożyczalni – dobrze założyć swoje skarpetki."}]}, {"concept": "Trądzik młodzieńczy", "intro": "Normalna sprawa w okresie dojrzewania – ale da się mu pomóc.", "examples": [{"t": "Mycie twarzy", "d": "Delikatne mycie rano i wieczorem usuwa nadmiar sebum."}, {"t": "Wyciskanie krost", "d": "Nasila stan zapalny i zostawia blizny – nie rób tego."}, {"t": "Dieta", "d": "Dużo słodyczy i fast foodów może nasilać zmiany."}, {"t": "Stres przed sprawdzianem", "d": "Stres też może nasilić trądzik."}, {"t": "Telefon przy twarzy", "d": "Brudny ekran przenosi zanieczyszczenia na skórę – warto go przecierać."}, {"t": "Poszewka na poduszkę", "d": "Częsta zmiana = mniej sebum i brudu na twarzy."}, {"t": "Wizyta u dermatologa", "d": "Gdy zmiany są duże lub bolą, lekarz dobiera leczenie."}]}, {"concept": "Ochrona przed czerniakiem", "intro": "Zasady, które naprawdę ratują życie.", "examples": [{"t": "Wakacje nad morzem", "d": "Krem z filtrem SPF, czapka, koszulka; unikaj słońca w południe."}, {"t": "Ponowne smarowanie", "d": "Krem nakładaj ponownie co ok. 2 godziny i po kąpieli."}, {"t": "Solarium", "d": "Bardzo silne UV – podręcznik mówi wprost: nie korzystaj."}, {"t": "Narty w górach", "d": "Śnieg odbija UV – też potrzebny krem z filtrem."}, {"t": "Pochmurny dzień", "d": "Część UV przechodzi przez chmury – łatwo się spalić."}, {"t": "Oglądanie skóry", "d": "Raz w miesiącu obejrzyj pieprzyki (plecy pokaże rodzic lub lustro) – sprawdź ABCDE."}, {"t": "Badanie znamion", "d": "Dermatolog ogląda je dermatoskopem – szybko i bezboleśnie."}]}], "weakSpots": {"title": "🎯 Typowe pułapki – skóra", "intro": "Tu są błędy, które **najczęściej** kosztują punkty na sprawdzianie z tego działu. Przejdź po kolei: najpierw pułapki, potem pytania opisowe, karty i krótki sprawdzian.", "mistakesTitle": "Najczęstsze błędy w tym dziale", "banner": "typowe pułapki i ćwiczenia z tego działu są w zakładce", "testScope": "tylko z typowych pułapek tego działu", "cardsJump": "🃏 Pułapki – karty", "cardsTitle": "🃏 #. Pułapki – karty (najpierw odpowiedz w myślach)", "quickTitle": "⚡ Szybki quiz: pułapki", "placeholder": "Najpierw napisz SAM (albo stuknij 🎤 Mów) – 4 zdania: co / jak działa / skutek / przykład…", "mistakes": ["**Naczynia odwrotnie**: na gorąco naczynia się **rozszerzają** (oddają ciepło), na zimno **kurczą** (zatrzymują ciepło).", "„Pot chłodzi, bo jest zimny” ❌ – pot chłodzi, bo **paruje** i zabiera ciepło ze skóry.", "Naczynia krwionośne i gruczoły „w naskórku” ❌ – są w **skórze właściwej**; naskórek jest **bez naczyń**.", "Mylenie **potu** (chłodzi, wydala sól i mocznik) z **łojem/sebum** (natłuszcza; nadmiar → trądzik).", "Mylenie **melaniny** (barwnik, chroni przed UV) z **witaminą D** (powstaje dzięki słońcu, dla kości i zębów).", "ABCDE: **D = powyżej 6 mm** (nie cm!), **E = ewolucja** (zmiana wyglądu), C = (k)olor.", "Grzybicę wywołują **grzyby**, nie bakterie; trądzik – **hormony i sebum**.", "Opisowe (np. 20% skóry) – jedno zdanie = 1 punkt. Podaj **kilka argumentów** według schematu."], "template": [{"k": "1. Co?", "d": "Nazwij element / warstwę / zjawisko (np. „skóra to bariera i regulator temperatury”)."}, {"k": "2. Jak działa?", "d": "Opisz mechanizm pojęciami z lekcji: naczynia, pot, receptory, melanina, sebum…"}, {"k": "3. Skutek", "d": "Co się stanie / po co to jest (zakażenie, odwodnienie, ochłodzenie, ochrona przed UV…)."}, {"k": "4. Przykład", "d": "Podaj przykład lub liczbę z podręcznika (1% = dłoń, 6 mm, basen, solarium…)."}], "models": [{"id": "skora20", "q": "Uzasadnij, dlaczego uszkodzenie lub utrata 20% skóry są śmiertelnie niebezpieczne.", "steps": ["Skóra jest **barierą** i **regulatorem**: chroni przed drobnoustrojami, zatrzymuje wodę i pomaga utrzymać stałą temperaturę.", "Gdy brakuje jej na dużej powierzchni, do organizmu **wnikają bakterie i wirusy**, a ciało **traci wodę, sole i ciepło**.", "Skutki: groźne **zakażenia**, **odwodnienie**, **wychłodzenie**, ból i wstrząs – zagrożenie życia.", "Groźne jest już oparzenie **1% skóry (powierzchnia dłoni)**, a 20% to około **20 dłoni**."], "keyPoints": [{"t": "zakażenia / drobnoustroje", "kw": ["zakaz", "bakter", "wirus", "drobnoustroj", "infekc"]}, {"t": "utrata wody / odwodnienie", "kw": ["wod", "odwodn", "plyn"]}, {"t": "utrata ciepła / temperatura", "kw": ["ciepl", "temperatur", "wychlodz"]}, {"t": "1% = dłoń", "kw": ["dlon", "1%", "1 %", "procent"]}], "model": "Skóra jest barierą i regulatorem. Gdy brakuje jej na 20% powierzchni, wnikają bakterie i wirusy, a organizm traci wodę, sole i ciepło. Skutki to zakażenia, odwodnienie, wychłodzenie i wstrząs. Groźne jest już 1% skóry, czyli powierzchnia dłoni."}, {"id": "termo", "q": "Wyjaśnij, w jaki sposób skóra przyczynia się do utrzymania stałej tempera
