var Q={"agent": "agent_8101m4bwtzy8f0n8d25jejxv2ynk", "kid": false, "label": "Quiz głosowy", "n": 10, "passMin": 4, "pick": {"l1": 1, "l2": 1, "l3": 1, "l4": 1, "l5": 1}, "scale": [[0, "niedostateczny"], [31, "dopuszczający"], [51, "dostateczny"], [71, "dobry"], [88, "bardzo dobry"], [97, "celujący"]], "grading": null, "items": [{"id": "q1", "topic": "l1", "q": "Co dzieje się z naczyniami krwionośnymi w skórze, gdy organizm jest przegrzany? Warianty: A) kurczą się; B) rozszerzają się; C) znikają; D) zamieniają się w gruczoły", "a": "B) rozszerzają się", "alt": "litera albo treść wariantu", "x": "Gdy jest gorąco, naczynia się rozszerzają → więcej krwi przy powierzchni → ciało oddaje ciepło.", "s": "funkcje", "lv": 3, "st": "Funkcje skóry – Poziom 3: Termoregulacja: naczynia i pot"}, {"id": "q2", "topic": "l1", "q": "Co dzieje się z naczyniami krwionośnymi w skórze, gdy jest zimno? Warianty: A) rozszerzają się; B) kurczą się; C) pękają; D) wytwarzają pot", "a": "B) kurczą się", "alt": "litera albo treść wariantu", "x": "Na zimnie naczynia się kurczą – mniej krwi przy skórze, ciało zatrzymuje ciepło.", "s": "funkcje", "lv": 3, "st": "Funkcje skóry – Poziom 3: Termoregulacja: naczynia i pot"}, {"id": "q3", "topic": "l1", "q": "Dlaczego pot ochładza ciało? Warianty: A) bo jest zimny już w gruczole; B) bo paruje i zabiera ciepło ze skóry; C) bo zatyka pory; D) bo zawiera melaninę", "a": "B) bo paruje i zabiera ciepło ze skóry", "alt": "litera albo treść wariantu", "x": "Pot paruje, a parowanie zabiera ciepło ze skóry – ciało się ochładza.", "s": "funkcje", "lv": 3, "st": "Funkcje skóry – Poziom 3: Termoregulacja: naczynia i pot"}, {"id": "q4", "topic": "l1", "q": "Jakie szkodliwe substancje są wydalane razem z potem? Warianty: A) tlen i witamina D; B) nadmiar soli i mocznik; C) melanina i keratyna; D) cukier i białko mięśni", "a": "B) nadmiar soli i mocznik", "alt": "litera albo treść wariantu", "x": "Z potem wydalane są np. nadmiar soli i mocznik.", "s": "funkcje", "lv": 4, "st": "Funkcje skóry – Poziom 4: Wydalanie i 1% skóry"}, {"id": "q5", "topic": "l1", "q": "Do czego służy witamina D produkowana przez skórę? Warianty: A) do utrzymania w zdrowiu kości i zębów; B) do trawienia tłuszczów; C) do widzenia w ciemności; D) do krzepnięcia krwi", "a": "A) do utrzymania w zdrowiu kości i zębów", "alt": "litera albo treść wariantu", "x": "Witamina D (powstaje pod wpływem słońca) jest potrzebna m.in. dla zdrowych kości i zębów.", "s": "funkcje", "lv": 2, "st": "Funkcje skóry – Poziom 2: Ochrona, witamina D i receptory"}, {"id": "q6", "topic": "l1", "q": "Jaka jest rola receptorów w skórze? Warianty: A) wytwarzają pot; B) odbierają bodźce z otoczenia (dotyk, ciepło, zimno, ból); C) barwią skórę; D) magazynują tłuszcz", "a": "B) odbierają bodźce z otoczenia (dotyk, ciepło, zimno, ból)", "alt": "litera albo treść wariantu", "x": "Receptory (zakończenia nerwowe i specjalne komórki) odbierają bodźce – dzięki nim reagujesz na zmiany.", "s": "funkcje", "lv": 2, "st": "Funkcje skóry – Poziom 2: Ochrona, witamina D i receptory"}, {"id": "q7_0", "topic": "l1", "q": "Prawda czy fałsz: Skóra chroni przed bakteriami, wirusami i substancjami chemicznymi.", "a": "prawda", "x": "Gdy jest gorąco, gruczoły potowe wydzielają więcej potu – to chłodzi ciało.", "s": "funkcje", "lv": 4, "st": "Funkcje skóry – Poziom 4: Wydalanie i 1% skóry"}, {"id": "q7_1", "topic": "l1", "q": "Prawda czy fałsz: Witamina D powstaje w skórze pod wpływem promieniowania słonecznego.", "a": "prawda", "s": "funkcje", "lv": 4, "st": "Funkcje skóry – Poziom 4: Wydalanie i 1% skóry"}, {"id": "q7_2", "topic": "l1", "q": "Prawda czy fałsz: Gdy jest gorąco, gruczoły potowe przestają pracować.", "a": "fałsz", "s": "funkcje", "lv": 4, "st": "Funkcje skóry – Poziom 4: Wydalanie i 1% skóry"}, {"id": "q8", "topic": "l1", "q": "Jaką część ciała ma mniej więcej powierzchnię równą 1% powierzchni skóry?", "a": "dłoń", "alt": "dłoni, powierzchnia dłoni, ręka", "x": "1% skóry ≈ powierzchnia dłoni – a już takie oparzenie jest groźne dla zdrowia.", "s": "funkcje", "lv": 4, "st": "Funkcje skóry – Poziom 4: Wydalanie i 1% skóry"}, {"id": "q10", "topic": "l2", "q": "Która warstwa skóry jest zewnętrzna? Warianty: A) tkanka podskórna; B) skóra właściwa; C) naskórek; D) mięśniówka", "a": "C) naskórek", "alt": "litera albo treść wariantu", "x": "Na zewnątrz jest naskórek, pod nim skóra właściwa, a jeszcze niżej tkanka podskórna.", "s": "budowa", "lv": 1, "st": "Budowa skóry: warstwy i wytwory – Poziom 1: Skóra jak kanapka"}, {"id": "q11", "topic": "l2", "q": "W której warstwie nie ma naczyń krwionośnych? Warianty: A) w naskórku; B) w skórze właściwej; C) w tkance podskórnej; D) we wszystkich są", "a": "A) w naskórku", "alt": "litera albo treść wariantu", "x": "Naskórek nie ma naczyń krwionośnych – dlatego płytkie zadrapanie nie krwawi.", "s": "budowa", "lv": 2, "st": "Budowa skóry: warstwy i wytwory – Poziom 2: Naskórek: dwie warstwy"}, {"id": "q12", "topic": "l2", "q": "Warstwa zrogowaciała naskórka zbudowana jest z: Warianty: A) żywych, dzielących się komórek; B) martwych komórek wypełnionych keratyną; C) komórek tłuszczowych; D) naczyń krwionośnych", "a": "B) martwych komórek wypełnionych keratyną", "alt": "litera albo treść wariantu", "x": "Warstwa zrogowaciała = martwe komórki z keratyną; stale się złuszczają.", "s": "budowa", "lv": 2, "st": "Budowa skóry: warstwy i wytwory – Poziom 2: Naskórek: dwie warstwy"}, {"id": "q13", "topic": "l2", "q": "Co robią komórki warstwy rozrodczej naskórka? Warianty: A) wydzielają pot; B) ciągle się dzielą i tworzą nowe komórki naskórka; C) magazynują tłuszcz; D) odbierają dźwięki", "a": "B) ciągle się dzielą i tworzą nowe komórki naskórka", "alt": "litera albo treść wariantu", "x": "Warstwa rozrodcza – komórki się dzielą i zastępują złuszczone komórki.", "s": "budowa", "lv": 2, "st": "Budowa skóry: warstwy i wytwory – Poziom 2: Naskórek: dwie warstwy"}, {"id": "q14", "topic": "l2", "q": "Gdzie znajdują się gruczoły potowe i łojowe, mieszki włosowe, naczynia i zakończenia nerwowe? Warianty: A) w warstwie zrogowaciałej; B) w skórze właściwej; C) w paznokciach; D) w kościach", "a": "B) w skórze właściwej", "alt": "litera albo treść wariantu", "x": "Te elementy leżą w skórze właściwej (tkanka łączna).", "s": "budowa", "lv": 3, "st": "Budowa skóry: warstwy i wytwory – Poziom 3: Skóra właściwa i tkanka podskórna"}, {"id": "q15", "topic": "l2", "q": "Z jakiej tkanki zbudowana jest głównie tkanka podskórna? Warianty: A) z tkanki tłuszczowej; B) z tkanki kostnej; C) z nabłonka; D) z tkanki nerwowej", "a": "A) z tkanki tłuszczowej", "alt": "litera albo treść wariantu", "x": "Tkanka podskórna = głównie tłuszcz: izolacja, zapas energii, amortyzacja.", "s": "budowa", "lv": 3, "st": "Budowa skóry: warstwy i wytwory – Poziom 3: Skóra właściwa i tkanka podskórna"}, {"id": "q16", "topic": "l2", "q": "Co wydzielają gruczoły łojowe? Warianty: A) pot; B) łój (sebum), który natłuszcza skórę i włosy; C) melaninę; D) witaminę D", "a": "B) łój (sebum), który natłuszcza skórę i włosy", "alt": "litera albo treść wariantu", "x": "Gruczoły łojowe → łój (sebum) – natłuszcza i chroni przed wysychaniem.", "s": "budowa", "lv": 4, "st": "Budowa skóry: warstwy i wytwory – Poziom 4: Gruczoły i wytwory naskórka"}, {"id": "q19", "topic": "l2", "q": "Jak nazywa się twarde białko budujące włosy, paznokcie i warstwę zrogowaciałą?", "a": "keratyna", "alt": "keratyny, keratynę", "x": "Keratyna – białko rogowe.", "s": "budowa", "lv": 4, "st": "Budowa skóry: warstwy i wytwory – Poziom 4: Gruczoły i wytwory naskórka"}, {"id": "q21", "topic": "l3", "q": "Gdzie znajduje się melanina? Warianty: A) w naskórku, mieszkach włosowych i tęczówce oka; B) tylko w krwi; C) w kościach; D) w gruczołach potowych", "a": "A) w naskórku, mieszkach włosowych i tęczówce oka", "alt": "litera albo treść wariantu", "x": "Melanina: naskórek, mieszki włosowe, tęczówka oka.", "s": "melanina", "lv": 2, "st": "Melanina, słońce i witamina D – Poziom 2: Gdzie jest  if(t==='match'||t==='cat')return [].map.call(b.querySelectorAll('select'),function(s){var lb=s.parentNode.querySelector('.lbl');return cut(lb?lb.textContent:'',30)+' → '+(s.value===''?'(brak)':strip(s.options[s.selectedIndex].text));}).join('; ');
 if(t==='short'){o=b.querySelector('input[type=text]');return o?o.value:'';}
 if(t==='open'){o=b.querySelector('textarea');return o?o.value:'';}
 if(t==='table'){return b.tableAnswers?b.tableAnswers():'';}}catch(e){}return '';}
function wrongItem(id,pts,max){var q=qById(id);if(!q)return null;return {id:String(id).slice(0,60),q:cut(q.q,160),a:cut(answerText(q,boxFor(id)),160),c:cut(correctText(q),160),pts:pts,max:max};}
function uid(){return (now().toString(36)+Math.random().toString(36).slice(2,10));}
function base(mode){return {k:CFG.siteKey,v:1,id:uid(),ts:new Date().toISOString(),slug:slug(),pageId:M.id||'',subject:M.subject||'',topic:M.title||'',mode:mode};}
/* queue */
function lq(){try{return JSON.parse(localStorage.getItem(QK))||[];}catch(e){return [];}}
function sq(a){try{localStorage.setItem(QK,JSON.stringify(a.slice(-MAXQ)));}catch(e){}}
var busy=false;
function flush(){if(busy||!CFG.endpoint||!navigator.onLine&&navigator.onLine!==undefined)return;var a=lq();if(!a.length)return;busy=true;var item=a[0];
 fetch(CFG.endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(item),keepalive:true})
 .then(function(){var b=lq().filter(function(x){return x.id!==item.id;});sq(b);busy=false;if(b.length)setTimeout(flush,400);})
 .catch(function(){busy=false;setTimeout(flush,60000);});}
function send(rec){if(M.child){rec.extra=rec.extra||{};if(!rec.extra.child)rec.extra.child=String(M.child).slice(0,40);}var a=lq();a.push(rec);sq(a);flush();}
window.addEventListener('online',flush);document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')flush();});
setTimeout(flush,1500);
/* quiz runs */
var qz=null;
addEventListener('tp:quiz-start',function(e){qz={t0:now(),ans:{}};});
addEventListener('tp:answer',function(e){var d=e.detail||{};if(qz&&(C.quiz||[]).some(function(q){return q.id===d.id;})&&!qz.ans[d.id])qz.ans[d.id]={pts:d.pts,max:d.max,w:d.pts<d.max?wrongItem(d.id,d.pts,d.max):null};});
addEventListener('tp:quiz-done',function(e){var d=e.detail||{};if(!qz)qz={t0:now(),ans:{}};var pct=d.max?Math.round(100*d.pts/d.max):0,sc=firstScale(),g=gradeFor(pct,sc),v=verdict(pct,g,sc);
 var wr=Object.keys(qz.ans).map(function(k){return qz.ans[k].w;}).filter(Boolean);
 var r=base('quiz');r.variant='Quiz mieszany';r.score=d.pts;r.max=d.max;r.percent=pct;r.grade=g;r.gradeNum=v.gradeNum;r.pass=v.pass;r.durationSec=Math.round((now()-qz.t0)/1000);r.wrongCount=wr.length;r.wrong=wr.slice(0,40);r.extra={questions:d.n};send(r);qz=null;});
/* mock tests */
var mk={};
addEventListener('tp:mock-start',function(e){mk[(e.detail||{}).id]=now();});
addEventListener('tp:mock-done',function(e){var d=e.detail||{},T=mocks()[d.idx]||{},t0=mk[d.id];var v=verdict(d.pct,d.grade,T.gradeScale);
 var wr=(d.tasks||[]).filter(function(t){return t.pts<t.max;}).map(function(t){return wrongItem(t.id,t.pts,t.max);}).filter(Boolean);
 var r=base('mock');r.variant=cut(d.title||d.id,80);r.score=d.pts;r.max=d.max;r.percent=d.pct;r.grade=d.grade||'';r.gradeNum=v.gradeNum;r.pass=v.pass;r.durationSec=t0?Math.round((now()-t0)/1000):null;r.wrongCount=wr.length;r.wrong=wr.slice(0,40);r.extra={mockId:d.id,minutesLimit:d.minutes,tasks:(d.tasks||[]).length};send(r);delete mk[d.id];});
/* generic finished activity (kids template & future pages): detail = {mode,variant,score,max,percent,grade,gradeNum,pass,durationSec,wrong:[{id,q,a,c,pts,max}],extra} */
addEventListener('tp:result',function(e){var d=e.detail||{};var r=base(['quiz','mock','flashcards','other'].indexOf(d.mode)>=0?d.mode:'other');r.variant=cut(d.variant||'',80);r.score=d.score;r.max=d.max;r.percent=d.percent;r.grade=cut(d.grade||'',40);r.gradeNum=d.gradeNum==null?null:d.gradeNum;r.pass=typeof d.pass==='boolean'?d.pass:null;r.durationSec=d.durationSec;
 var wr=(d.wrong||[]).slice(0,40).map(function(x){return {id:String(x.id||'').slice(0,60),q:cut(x.q,160),a:cut(x.a,160),c:cut(x.c,160),pts:x.pts,max:x.max};});r.wrongCount=wr.length;r.wrong=wr;r.extra=(d.extra&&typeof d.extra==='object')?d.extra:{};send(r);});
/* flashcard sessions: summary sent when the page is hidden/closed (only if >=5 cards rated) */
var fc=null;
addEventListener('tp:card',function(e){var d=e.detail||{};if(!fc)fc={t0:now(),n:0,r:{1:0,2:0,3:0}};fc.n++;fc.r[d.rating]=(fc.r[d.rating]||0)+1;fc.known=d.known;fc.total=d.total;fc.t1=now();});
function fcFlush(){if(!fc||fc.n<5){return;}var r=base('flashcards');r.variant='Fiszki';r.score=fc.known;r.max=fc.total;r.percent=fc.total?Math.round(100*fc.known/fc.total):0;r.grade='';r.gradeNum=null;r.pass=null;r.durationSec=Math.round((fc.t1-fc.t0)/1000);r.wrongCount=fc.r[1]||0;r.wrong=[];r.extra={rated:fc.n,nieWiem:fc.r[1]||0,prawie:fc.r[2]||0,wiem:fc.r[3]||0};fc=null;send(r);}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')fcFlush();});addEventListener('pagehide',fcFlush);
window.__tpResults={queue:lq,flush:flush,cfg:{endpoint:!!CFG.endpoint}};
})();</script>
